name: BFSS TD-C1A D1 explicit application diagnostic collection
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-td-c1a-d1-explicit-application-diagnostic.yml
      - tools/run_bfss_td_c1a_d1_explicit_application.py
      - research/top-down-symmetry/TD_C1A_D1_APPLICATION_MANIFEST.json
      - lean/diagnostics/BFSSTDC1AD1VariableApplicationControl.lean
      - lean/diagnostics/BFSSTDC1AD1ExplicitAxisLift.lean
      - lean/diagnostics/BFSSTDC1AD1ExplicitConditionalEvaluation.lean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explicit-application-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Verify frozen source and prospective contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_bfss_td_c1a_d1_explicit_application.py --preflight
          cp .github/workflows/bfss-td-c1a-d1-explicit-application-diagnostic.yml bfss-td-c1a-d1-evidence/executed-workflow.yml
          git hash-object --no-filters .github/workflows/bfss-td-c1a-d1-explicit-application-diagnostic.yml > bfss-td-c1a-d1-evidence/workflow-blob.txt
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Collect explicit application leaves
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 tools/run_bfss_td_c1a_d1_explicit_application.py --collect
      - name: Preserve every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-td-c1a-d1-explicit-application-evidence
          path: bfss-td-c1a-d1-evidence/
          retention-days: 30
          if-no-files-found: warn
