name: BFSS W0H1A R2 harness-only preflight RED preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0h1a-r2-preflight-red-preservation.yml

permissions:
  contents: write
  actions: read

jobs:
  original-harness-log:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact pending R2 source and previous R1 archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact unmodified native source and first RED archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1AOriginalGeneratorCentralizerComapR2.lean)" = c5c0894d99a01e92e92a58dac7313698a2f69971
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0H1AOriginalGeneratorCentralizerIndependentConsumerR2.lean)" = b6e91f79c46724f65f54835623b97d5f909dcf66
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0h1a-r2-original-centralizer-unfold-strict.yml)" = 82313868f060241d6a9baf490275125b62a5b475
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0H1A_R1_44145848122_SOURCE_RED_evidence.zip)" = 0240463e97836e347a5423999e6832dfcf81e2cf
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a=s["active"]
          assert a["gate"]=="P3-M4-W0H1A" and a["attempt"]=="R2"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="c5c0894d99a01e92e92a58dac7313698a2f69971"
          assert a["consumer_blob"]=="b6e91f79c46724f65f54835623b97d5f909dcf66"
          assert a["workflow_blob"]=="82313868f060241d6a9baf490275125b62a5b475"
          assert a["previous_red_run"]==44145848122
          assert s["previous_active_W0H1A_R1_RED"]["preservation_run"]==44148961842
          assert s["last_qualified"]["run_id"]==44139239821
          assert not Path("research/quantum-information/diagnostics/BFSS_W0H1A_R2_44149941739_PREFLIGHT_ONLY_complete_job.log").exists()
          PY
      - name: Download original harness-only full job log and signed run metadata, check zero artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          from pathlib import Path
          run=44149941739
          job=134275151501
          sha="3a48165bd006552444f036ae8ac2960fc7ffd5fe"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def json_url(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=60) as response:
                  return json.load(response)
          metadata=json_url(f"{prefix}/actions/runs/{run}")
          jobs=json_url(f"{prefix}/actions/runs/{run}/jobs")
          artifacts=json_url(f"{prefix}/actions/runs/{run}/artifacts")
          assert metadata["id"]==run and metadata["head_sha"]==sha
          assert metadata["status"]=="completed" and metadata["conclusion"]=="failure"
          assert artifacts["total_count"]==0 and artifacts["artifacts"]==[]
          target=[x for x in jobs["jobs"] if x["id"]==job]
          assert len(target)==1 and target[0]["conclusion"]=="failure"
          steps={x["name"]:x["conclusion"] for x in target[0]["steps"]}
          assert steps["Checkout exact original BFSS source"]=="success"
          assert steps["Preflight original W0H0 and W0B0 GREEN with original W0B1 RED STOP provenance"]=="failure"
          assert steps["Restore pinned Lean 4.34.1 and Mathlib"]=="skipped"
          assert steps["Cold original singleton centralizer source, independent consumer, strict axiom audit"]=="skipped"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          url=f"{prefix}/actions/jobs/{job}/logs"
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302,e
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=90) as response:
                  raw=response.read()
          else:
              with response: raw=response.read()
          assert len(raw)>10000
          assert b"No such file or directory" in raw
          assert b"bfss-m4-w0h1a-r2/tested-commit.txt" in raw
          assert b"No files were found" in raw
          assert b"Process completed with exit code 1" in raw
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          log=root/f"BFSS_W0H1A_R2_{run}_PREFLIGHT_ONLY_complete_job.log"
          original=root/f"BFSS_W0H1A_R2_{run}_PREFLIGHT_ONLY_original_run_jobs_artifacts.json"
          manifest=root/f"BFSS_W0H1A_R2_{run}_PREFLIGHT_ONLY_manifest.json"
          for path in [log,original,manifest]:assert not path.exists(),path
          log.write_bytes(raw)
          obj={"run":metadata,"jobs":jobs,"artifacts":artifacts}
          original.write_text(json.dumps(obj,sort_keys=True,indent=2)+"\n")
          record={
           "gate":"P3-M4-W0H1A","attempt":"R2","status":"PREFLIGHT_ONLY_RED",
           "run_id":run,"job_id":job,"tested_sha":sha,
           "artifact_count":0,"source_attempted":False,"consumer_attempted":False,
           "cause":"Harness mkdir used unsuffixed R1 temp directory; R2 tee used suffixed path. Missing tested-commit.txt directory before Python preflight.",
           "parallel_guard_red_run":44149941665,
           "parallel_guard_reason":"R2 source/consumer workflow pin-table duplicate old-key rewrite",
           "original_job_log":{"path":str(log),"size":len(raw),"sha256":hashlib.sha256(raw).hexdigest()},
           "original_run_metadata":{"path":str(original),"sha256":hashlib.sha256(original.read_bytes()).hexdigest()},
           "source_blob":"c5c0894d99a01e92e92a58dac7313698a2f69971",
           "consumer_blob":"b6e91f79c46724f65f54835623b97d5f909dcf66",
           "workflow_blob":"82313868f060241d6a9baf490275125b62a5b475",
           "first_native_source_red":44145848122,
           "last_qualified_original_bfss_run":44139239821
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0H1A_R2_PREFLIGHT_ONLY_NO_PROVIDER_ARTIFACT_FULL_JOB_LOG_PRESERVED",record["original_job_log"])
          PY
      - name: Git-pin original no-artifact RED full job log, metadata and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_W0H1A_R2_44149941739_PREFLIGHT_ONLY_complete_job.log research/quantum-information/diagnostics/BFSS_W0H1A_R2_44149941739_PREFLIGHT_ONLY_original_run_jobs_artifacts.json research/quantum-information/diagnostics/BFSS_W0H1A_R2_44149941739_PREFLIGHT_ONLY_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0H1A R2: preserve original harness-only RED job and zero-artifact metadata"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
