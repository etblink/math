name: BFSS W0C2B1 R2 original Fock Jacobi strict GREEN independent preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b1-r2-green-evidence-pinning.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-original-b1-r2-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact original Fock Jacobi GREEN and frozen R1 RED
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify accepted 26 anchors and original R1 RED byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean)" = 861628fe6322c919bee87e493e1e629d48bfa8bb
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumerR2.lean)" = bd271b47833e2cca9fb80f1d6fca381c8b6a2ccb
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b1-r2-original-fock-jacobi-covariance-strict.yml)" = 88c98717600cb561860e3b962e0ce830270afada
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceAction.lean)" = db15340dfb46eea78c20549bb6d1616dd99f302b
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip)" = 98b23994b080a087d77d8317a4758a774f0f1ef2
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_complete_job.log)" = 5e96a9c57152a876ae5e772fcca7a462aa91ac1c
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B1','R2','PENDING_STRICT_CI',False)
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B0N','R1',44260119108,'GREEN_QUALIFIED')
          assert len(s['accepted_anchors'])==26 and s['accepted_anchors'][-1]==q
          assert s['previous_active_W0C2B1_R1_NATIVE_RED']['run_id']==44263755514
          assert s['previous_active_W0C2B1_R1_NATIVE_RED']['preservation_run']==44266245618
          assert s['previous_active_W0C2B1_R1_NATIVE_RED']['native_red_count']==1
          assert s['previous_active_W0C2B0_R2_stopped']['native_red_count']==2
          root=Path('research/quantum-information/diagnostics')
          for name in ('BFSS_M4_W0C2B1_R2_44267283653_GREEN_evidence.zip',
                       'BFSS_W0C2B1_R2_44267283653_complete_job.log',
                       'BFSS_W0C2B1_R2_44267283653_GREEN_evidence_manifest.json'):
              assert not (root/name).exists(),name
          print('BFSS_W0C2B1_R2_ORIGINAL_GREEN_EVIDENCE_ARCHIVER_PREFLIGHT_PASS')
          PY
      - name: Verify exact provider ZIP six members source consumer axioms and full job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44267283653;job=134674838882;artifact=14410837798
          tested='df89d1f32ddbdb830cfc697007daac90564c0cfc'
          digest='3273d69f082a57bd6d6bfa83df7536ae118e9eb35963452565dd5a359d69a340'
          size=4160
          marker='BFSS_W0C2B1_R2_ORIGINAL_FOCK_JACOBI_4_SOURCE_4_CONSUMER_4_CONTROLS_SIX_MUTANTS_STRICT_GREEN'
          roots=['originalFock_commutator_sum','originalFock_commutator_weighted_sum',
                 'originalFock_commutator_jacobi','originalFock_commutator_covariance_bracket']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return json.load(response)
          ri=getjson(f'{prefix}/actions/runs/{run}')
          ji=getjson(f'{prefix}/actions/jobs/{job}')
          ai=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert ri['head_sha']==tested and ri['run_attempt']==1 and ri['status']=='completed' and ri['conclusion']=='success'
          assert ji['id']==job and ji['run_id']==run and ji['conclusion']=='success'
          for name in ('Checkout exact unified','Preflight qualified N','Restore pinned Lean',
                       'Cold original Fock Jacobi','Preserve original Fock Jacobi'):
              assert any(s['name'].startswith(name) and s['conclusion']=='success' for s in ji['steps']),name
          assert ai['id']==artifact and ai['size_in_bytes']==size and ai['digest']=='sha256:'+digest
          assert ai['workflow_run']['id']==run and ai['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={'preflight.log','tested-commit.txt','cold-source.log',
                 'source-axioms.log','consumer.log','auditor.log'}
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(content,expected):
              assert 'sorryAx' not in content and 'error:' not in content
              found=pat.findall(content)
              assert len(found)==len(expected),(found,expected)
              assert [name.rsplit('.',1)[-1] for name,_ in found]==expected,found
              for _,ax in found:assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B1_R2_ORIGINAL_FOCK_JACOBI_ONE_NATIVE_RED_PRESERVED_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (8965 jobs)' in cold and 'error:' not in cold and 'sorryAx' not in cold
              audit(z.read('source-axioms.log').decode(),roots)
              audit(z.read('consumer.log').decode(),[name+'_consumer' for name in roots])
              assert marker in z.read('auditor.log').decode()
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>50000 and marker.encode() in full
          assert b'Build completed successfully (8965 jobs)' in full
          assert b'Artifact ID 14410837798' in full
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          archive=root/'BFSS_M4_W0C2B1_R2_44267283653_GREEN_evidence.zip'
          log=root/'BFSS_W0C2B1_R2_44267283653_complete_job.log'
          manifest=root/'BFSS_W0C2B1_R2_44267283653_GREEN_evidence_manifest.json'
          for p in (archive,log,manifest):assert not p.exists(),p
          archive.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
            'gate':'P3-M4-W0C2B1','attempt':'R2','status':'ORIGINAL_STRICT_GREEN_PENDING_CANONICAL_ACCEPTANCE',
            'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
            'original_zip':{'path':str(archive),'size':size,'sha256':digest,'members':members},
            'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
            'source_blob':'861628fe6322c919bee87e493e1e629d48bfa8bb',
            'consumer_blob':'bd271b47833e2cca9fb80f1d6fca381c8b6a2ccb',
            'workflow_blob':'88c98717600cb561860e3b962e0ce830270afada',
            'source_reports':4,'consumer_reports':4,'original_fock_controls':4,
            'negative_auditor_mutants':6,'cold_build_jobs':8965,
            'allowed_axioms':sorted(allowed),'strict_marker':marker,
            'accepted_predecessor_run':44260119108,
            'preserved_original_R1_native_red_run':44263755514,
            'preserved_original_R1_native_red_preservation_run':44266245618,
            'claim_ceiling':'Original Fock commutator/Jacobi and conditional complex coefficient covariance only; original 48 gamma centrality and unconditional K Lie bracket unproved'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B1_R2_ORIGINAL_STRICT_GREEN_ZIP_FULL_LOG_MEMBER_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin provider original six member ZIP full job log and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B1_R2_44267283653_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B1_R2_44267283653_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B1_R2_44267283653_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS W0C2B1 R2: pin original Jacobi GREEN ZIP full Actions log and member SHA CRC'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
