name: BFSS CSQ-G0 isolated normal-order diagnostic

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/diagnostics/BFSSCSQG0NormalOrderDiagnostic.lean'
      - '.github/workflows/bfss-csq-g0-normal-order-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-csq-g0-normal-order-diagnostic-${{ github.sha }}
  cancel-in-progress: true

jobs:
  normal-order-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/diagnostics/BFSSCSQG0NormalOrderDiagnostic.lean \
            .github/workflows/bfss-csq-g0-normal-order-diagnostic.yml \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G4BOriginalCoefficientCommutatorProbe.lean \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G6HOriginalOrderedMajoranaFierzAssemblyProbe.lean \
            > "$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/diagnostics/BFSSCSQG0NormalOrderDiagnostic.lean": "22503cb611b8997f42924dc2c6f5901d2f0f7e75",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0OriginalPhysicalSquare.lean": "1a89660e34463d74a442c17fee2366e290e56127",
            "lean/diagnostics/BFSSCSQG0IndependentAudit.lean": "34140d8d82b61337dba269e78f8e5fb2e1e4b843",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G4BOriginalCoefficientCommutatorProbe.lean": "c043464e7e605d4a3f456060da9e66d3beecb549",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G6HOriginalOrderedMajoranaFierzAssemblyProbe.lean": "fa4c225a10c9d78b8dd35c42a8d5dc1e6d2d311d",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0LiteralOrbitalDifference.lean": "ab4fc2784acd101e55f8e588399c5439ab218adf",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQF1OriginalFermionicDifference.lean": "0c01875de6c1d9b11688078d9e0ceefdb9a353a7",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","664b396a98bd1479d2fceeb8c73cc79234337ad6","HEAD"])
          s=Path("lean/diagnostics/BFSSCSQG0NormalOrderDiagnostic.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6G6HOriginalOrderedMajoranaFierzAssemblyProbe"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==["rawAtTwo","literalAtPoint","evaluateAdd","literalSplitAtPoint","responseAtPoint","namedSplitAtPoint"]
          assert "set_option autoImplicit false" in s
          assert "set_option warningAsError true" in s
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",s)
          for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats","set_option synthInstance.maxHeartbeats"]:
              assert forbidden not in s
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_CSQ_G0_NORMAL_ORDER_DIAGNOSTIC_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Build frozen G6H donor and test normal-order boundaries
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-csq-g0-normal-order-diagnostic"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6G6HOriginalOrderedMajoranaFierzAssemblyProbe 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSCSQG0NormalOrderDiagnostic.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-csq-g0-normal-order-diagnostic"
          source=(E/"native-source.log").read_text()
          audit=(E/"strict-axioms.log").read_text()
          assert "Build completed successfully" in source
          for log in [source,audit]:
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(bad,log[-6000:])
          names=["rawAtTwo","literalAtPoint","evaluateAdd","literalSplitAtPoint","responseAtPoint","namedSplitAtPoint"]
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in names:
              full="FCP.BFSSCSQG0NormalOrderDiagnostic."+name
              reports=re.findall(re.escape("'"+full+"'")+r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",audit)
              assert len(reports)==1,(full,reports)
              assert {x.strip() for x in reports[0].split(",") if x.strip()}<=allowed,(full,reports)
          print("BFSS_CSQ_G0_NORMAL_ORDER_DIAGNOSTIC_GREEN_NOT_FULL_G0")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-csq-g0-normal-order-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-csq-g0-normal-order-diagnostic/
          if-no-files-found: warn
          retention-days: 30
