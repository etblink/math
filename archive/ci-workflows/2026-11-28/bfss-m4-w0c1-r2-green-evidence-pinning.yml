name: BFSS W0C1 R2 original 48-Majorana witness GREEN evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c1-r2-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-provider-original-W0C1-R2-GREEN:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original W0C1 R2 and accepted W0B2B/W0C0 ancestors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Confirm exact source, consumer, strict gate, and native R1 RED preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean)" = 5fafaa3d73d3761719ea160466b40d94b85d74db
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean)" = 85e8067c892bc52533f6a3ecc1f099010efac4ae
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c1-r2-original-commutator-trace-witness-strict.yml)" = c9db16b6c55239f3c8235a70f623ca9f929dcee1
          test "$(git rev-parse HEAD:research/quantum-information/BFSS_QIT_SCC_W0C1_R2_ORIGINAL_ZERO_SMUL_PROOF_REPAIR_PRE_GATE_2026_11_17.md)" = 7d585894a12e92b4295f5e3ed99bda0131176aa9
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip)" = b9c846a1ef7abdecc8d5e627c5a9921a903bbf14
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_complete_job.log)" = f60230b28a2f3bf76711ad81dc6e25d4f66a9f0d
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_NATIVE_RED_evidence_manifest.json)" = e2a4c11096067471c6a8a2ebb7e2160d66e21b9f
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip)" = f8133dba86db582f5d302885c7c134b3e2ff043a
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip)" = 4992a5444441022a998afc26324551a273b747c9
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C1","R2","PENDING_STRICT_CI",False)
          assert a["source_blob"]=="5fafaa3d73d3761719ea160466b40d94b85d74db"
          assert a["consumer_blob"]=="85e8067c892bc52533f6a3ecc1f099010efac4ae"
          assert a["workflow_blob"]=="c9db16b6c55239f3c8235a70f623ca9f929dcee1"
          assert a["contract_commit"]=="1b1b10b4cfdcf62716822ba1244ab2c469d33af2"
          assert a["previous_red_run"]==44204390734 and a["previous_red_preservation_run"]==44207291646
          assert q["gate"]=="P3-M4-W0C0" and q["run_id"]==44192981282 and q["qualification"] is True
          assert s["accepted_anchors"][-1]==q and q["preservation_run"]==44197140876
          assert s["previous_active_W0C1_R1_RED"]["status"]=="NATIVE_SOURCE_RED_UNQUALIFIED"
          assert s["previous_active_W0C1_R1_RED"]["preservation_run"]==44207291646
          assert s["next_planned"]["gate"]=="P3-M4-W0C2" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          for p in ["research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip",
                    "research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_complete_job.log",
                    "research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_GREEN_evidence_manifest.json"]:
              assert not Path(p).exists(),p
          print("BFSS_W0C1_R2_UNPROMOTED_ORIGINAL_EVIDENCE_ARCHIVER_PREFLIGHT_PASS")
          PY
      - name: Rehash provider ZIP, exact original CI log, and six source/consumer axiom checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          run=44208084307;job=134479111962;artifact=14384678894
          tested="3f45d2df6c4200086ba2a8ee404d2f4e37524672"
          size=19649
          digest="94b561a285577bbe61cf780ecfbf8843415f5b5f11889ae67632c2c29fa51ac1"
          marker="BFSS_W0C1_R2_ORIGINAL_FOCK_WITNESS_2_SOURCE_2_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN"
          preflight="BFSS_W0C1_R2_W0B2B_W0C0_ORIGINAL_SOURCE_EXACT_GREEN_AND_REDS_PREFLIGHT_PASS"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          jobinfo=getjson(f"{prefix}/actions/jobs/{job}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["status"]=="completed" and runinfo["conclusion"]=="success"
          assert runinfo["head_sha"]==tested and runinfo["run_attempt"]==1
          assert jobinfo["id"]==job and jobinfo["run_id"]==run and jobinfo["conclusion"]=="success"
          for name in ["Preflight qualified W0B2B and W0C0 original providers and W0C1 frozen contract",
                       "Restore pinned Lean 4.34.1 and Mathlib",
                       "Cold original witness kernel, injectivity, consumer and axiom audit"]:
              assert any(x["name"]==name and x["conclusion"]=="success" for x in jobinfo["steps"]),name
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with r:return r.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={"propext","Classical.choice","Quot.sound"}
          def audit(text,expected):
              assert "error:" not in text and "sorryAx" not in text
              roots=pat.findall(text)
              assert len(roots)==len(expected),(roots,expected)
              assert [n.rsplit(".",1)[-1] for n,_ in roots]==expected,roots
              assert len({n for n,_ in roots})==len(roots)
              assert all({x.strip() for x in axioms.split(",") if x.strip()}<=allowed for _,axioms in roots)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert preflight in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9230 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert marker in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),["originalFockWitness_kernel_zero","originalFockWitnessSignature_injective"])
              audit(z.read("consumer.log").decode(),["originalFockWitness_kernel_zero_consumer","originalFockWitnessSignature_injective_consumer"])
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          complete=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(complete)>200000
          assert b"Build completed successfully (9230 jobs)." in complete
          assert preflight.encode() in complete and marker.encode() in complete
          assert b"Artifact ID 14384678894" in complete
          # Do not scan entire Actions transcript for sorryAx: it echoes the auditor's deliberate bad probes.
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0C1_R2_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0C1_R2_{run}_complete_job.log"
          manifest=root/f"BFSS_W0C1_R2_{run}_GREEN_evidence_manifest.json"
          for p in (archive,full,manifest):assert not p.exists(),p
          archive.write_bytes(raw);full.write_bytes(complete)
          record={
            "gate":"P3-M4-W0C1","attempt":"R2","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(full),"size":len(complete),"sha256":hashlib.sha256(complete).hexdigest()},
            "source_blob":"5fafaa3d73d3761719ea160466b40d94b85d74db",
            "consumer_blob":"85e8067c892bc52533f6a3ecc1f099010efac4ae",
            "workflow_blob":"c9db16b6c55239f3c8235a70f623ca9f929dcee1",
            "source_reports":2,"consumer_reports":2,"independent_controls":3,"negative_mutants":6,
            "cold_build_jobs":9230,"strict_marker":marker,"preflight_marker":preflight,
            "allowed_axioms":["propext","Classical.choice","Quot.sound"],
            "accepted_predecessor_run":44192981282,
            "qualified_W0B2B_run":44180157170,
            "prior_W0C1_R1_native_red_run":44204390734,
            "prior_W0C1_R1_preservation_run":44207291646
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0C1_R2_PROVIDER_ORIGINAL_GREEN_ZIP_FULL_JOB_LOG_AND_MEMBER_SHA_CRC_PASS")
          PY
      - name: Git-pin provider-original ZIP, full Actions log and hash manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_complete_job.log research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip | tr -d ' ')" = 19649
          git commit -m "BFSS W0C1 R2: preserve original witness GREEN ZIP complete Actions log and digest manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
          echo "BFSS_W0C1_R2_ORIGINAL_GREEN_EVIDENCE_GIT_PIN_COMPLETE"
