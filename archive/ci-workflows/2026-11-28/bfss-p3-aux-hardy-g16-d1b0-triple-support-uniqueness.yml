name: BFSS G16 D1B0 finite triple-support uniqueness diagnostic
'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16TripleSupportDiagnostic.lean
      - lean/diagnostics/BFSSP3AuxHardyG16TripleSupportIndependentConsumer.lean
      - .github/workflows/bfss-p3-aux-hardy-g16-d1b0-triple-support-uniqueness.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-g16-d1b0-finite-20261115
  cancel-in-progress: true
jobs:
  triple-support-uniqueness:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout pinned G15 source baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Frozen proof provenance and static failure controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-g16-d1b0-evidence
          git rev-parse HEAD > bfss-g16-d1b0-evidence/tested-sha.txt
          python3 - <<'PY' | tee bfss-g16-d1b0-evidence/preflight.log
          from pathlib import Path
          import hashlib,json,re,subprocess
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16TripleSupportDiagnostic.lean"
          CONSUMER="lean/diagnostics/BFSSP3AuxHardyG16TripleSupportIndependentConsumer.lean"
          ROOTS=["FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.tripleLabel_card","FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.tripleSupport_card","FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.tripleSupport_injective","FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.thirdAxis_outside"]
          EXPECTED_SOURCE="c5d12678d7916db42c8c8e009118c57e609002d5"
          EXPECTED_CONSUMER="bf70d826790e9ab5e32786e5cb4c9d0ed87943d7"
          FROZEN={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15OriginalTauCoefficientNormReduction.lean":"1a6765a57f4dcea2a1d7f05ac5d37dbbade9bdfc",
            "lean/diagnostics/BFSSP3AuxHardyG15OriginalTauCoefficientNormReductionIndependentConsumer.lean":"fe33403df207a37deb495efb99a63814583f1951",
            ".github/workflows/bfss-p3-aux-hardy-g15-original-tau-coefficient-norm-reduction-strict.yml":"8a54f68795fccb16775ee2fbf1650ccdc2f5e659",
            "lean/OAI/MathematicalPhysics/BFSS/GammaWords.lean":"d12051e70de679f5458dbd456667a32c7b407ce4",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16FourPlaneIncidenceDiagnostic.lean":"a4e71f5d41e505a93e4e7cb70494d4c0a8e774cd",
            "lean/diagnostics/BFSSP3AuxHardyG16FourPlaneIncidenceIndependentConsumer.lean":"959e0b5936b81d6d039028fd4d7047b253829a82",
            ".github/workflows/bfss-p3-aux-hardy-g16-d0-finite-plane-incidence.yml":"2b3d689ca7f2cb97b69f18d01ea8728666ae06a6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16SourceGammaWordFrobenius.lean":"3956f0a3f62164a0ae1245beb0c0f07e034e60cb",
            "lean/diagnostics/BFSSP3AuxHardyG16SourceGammaWordFrobeniusIndependentConsumer.lean":"f3e6866f90f282f19a347bc6c2ffd288f43585d0"
          }
          def git(*a): return subprocess.check_output(["git",*a],text=True).strip()
          assert subprocess.run(["git","merge-base","--is-ancestor","4d45f9c3bd1b3b2e94c7d23e2576a8fb87a65166","HEAD"]).returncode==0
          for p,expected in FROZEN.items():
              assert git("hash-object","--no-filters",p)==expected,("accepted G15 / trace donor drift",p)
          assert git("hash-object","--no-filters",SOURCE)==EXPECTED_SOURCE
          assert git("hash-object","--no-filters",CONSUMER)==EXPECTED_CONSUMER
          source=Path(SOURCE).read_text()
          consumer=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG16FourPlaneIncidenceDiagnostic"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG16TripleSupportDiagnostic"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==ROOTS
          assert len(re.findall(r"(?m)^example\b",consumer))==7
          assert "set_option autoImplicit false" in source and "set_option autoImplicit false" in consumer
          for text in (source,consumer):
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",text)
              assert "maxHeartbeats" not in text and "maxRecDepth" not in text
              assert "set_option linter" not in text and "set_option trace" not in text
          assert "pairedAlgebraData" not in source and "OAI.BFSSQuantum" not in source
          assert "theorem tripleSupport_injective" in source and "theorem thirdAxis_outside" in source
          assert "({0, 1, 2} : Finset (Fin 9))" in consumer and "({6, 7, 8} : Finset (Fin 9))" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in pkgs if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          receipt={"qualification":"DIAGNOSTIC_PREFLIGHT_NOT_G16","tested_sha":git("rev-parse","HEAD"),
            "source":SOURCE,"source_blob":EXPECTED_SOURCE,"consumer":CONSUMER,"consumer_blob":EXPECTED_CONSUMER,
            "roots":ROOTS,"examples":8,"frozen_accepted_sources":FROZEN}
          p=Path("bfss-g16-d1b0-evidence/pin-manifest.json")
          p.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("BFSS_G16_D1B0_PREFLIGHT_PASS",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Restore exact Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee ../bfss-g16-d1b0-evidence/cache.log
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Strict source and seven independent finite support controls
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG16TripleSupportDiagnostic"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16TripleSupportDiagnostic.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16TripleSupportDiagnostic.olean"
          timeout 550s lake build "$mod" 2>&1 | tee ../bfss-g16-d1b0-evidence/build.log
          timeout 550s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-g16-d1b0-evidence/source.log
          timeout 550s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG16TripleSupportIndependentConsumer.lean 2>&1 | tee ../bfss-g16-d1b0-evidence/consumer.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("../bfss-g16-d1b0-evidence")
          roots=["FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.tripleLabel_card","FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.tripleSupport_card","FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.tripleSupport_injective","FCP.BFSSP3AuxHardyG16TripleSupportDiagnostic.thirdAxis_outside"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in [("build.log",None),("source.log",roots),("consumer.log",roots)]:
              log=(d/name).read_text()
              assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4000:])
              assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
              if expected is not None:
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [a for a,_ in reports]==expected,(name,reports)
                  for _,raw in reports: assert {v.strip() for v in raw.split(",") if v.strip()}<=allowed,(name,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
             "status":"G16_D1B0_TRIPLE_SUPPORT_DIAGNOSTIC_GREEN",
             "root_count":4,"independent_examples":7,
             "triple_support_injectivity_verified":True,"third_axis_side_dichotomy_verified":True,
             "gamma_product_sign_verified":False,"originalHardyY_quadratic_verified":False,
             "full_G16_qualified":False,"physical_domain_or_Hardy_claim":False
          },sort_keys=True,indent=2)+"\n")
          print("BFSS_G16_D1B0_TRIPLE_SUPPORT_DIAGNOSTIC_GREEN")
          PY
      - name: Preserve all first-causal diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-g16-d1b0-incidence-evidence
          path: bfss-g16-d1b0-evidence/
          if-no-files-found: warn
          retention-days: 14
