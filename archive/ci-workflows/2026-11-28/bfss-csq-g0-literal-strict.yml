name: BFSS CSQ-G0 R3 literal physical square strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0LiteralPhysicalSquare.lean'
      - 'lean/diagnostics/BFSSCSQG0LiteralIndependentAudit.lean'
      - '.github/workflows/bfss-csq-g0-literal-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-csq-g0-literal-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-source-csq-g0:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-csq-g0-literal"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-csq-g0-literal/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0LiteralPhysicalSquare.lean \
            lean/diagnostics/BFSSCSQG0LiteralIndependentAudit.lean \
            .github/workflows/bfss-csq-g0-literal-strict.yml \
            > "$RUNNER_TEMP/bfss-csq-g0-literal/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-csq-g0-literal/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-csq-g0-literal/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/diagnostics/BFSSCSQG0NormalOrderDiagnostic.lean": "22503cb611b8997f42924dc2c6f5901d2f0f7e75",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0OriginalPhysicalSquare.lean": "1a89660e34463d74a442c17fee2366e290e56127",
            "lean/diagnostics/BFSSCSQG0IndependentAudit.lean": "34140d8d82b61337dba269e78f8e5fb2e1e4b843",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0LiteralPhysicalSquare.lean": "ae2ec2b46624886e6eb59ffe33ac8c970925b923",
            "lean/diagnostics/BFSSCSQG0LiteralIndependentAudit.lean": "ef9d51eb59b0692d7ccbcbc9de3de79206479a26",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0LiteralOrbitalDifference.lean": "ab4fc2784acd101e55f8e588399c5439ab218adf",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQF1OriginalFermionicDifference.lean": "0c01875de6c1d9b11688078d9e0ceefdb9a353a7",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G7TOriginalFullColorLieGaussIdentityProbe.lean": "dca9ab9edb0019189e275ee025d083eed5cc3f3c",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G4BOriginalCoefficientCommutatorProbe.lean": "c043464e7e605d4a3f456060da9e66d3beecb549",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G6HOriginalOrderedMajoranaFierzAssemblyProbe.lean": "fa4c225a10c9d78b8dd35c42a8d5dc1e6d2d311d",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G6KOriginalBoundedFermionColorCurrentProbe.lean": "b71adefca6898253e8c7b6c9ad72b70296f2e958",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean": "152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","51a491564b17eec27e7d122c9b91f08996987b54","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0LiteralPhysicalSquare.lean").read_text()
          t=Path("lean/diagnostics/BFSSCSQG0LiteralIndependentAudit.lean").read_text()
          source_roots = ["gaussSignCancel","generator_apply","physicalGaussCancel","rawAtTwo","literalAtPoint","evaluateAdd","literalSplitAtPoint","responseAtPoint","namedSplitAtPoint","joinDifferences","physicalSquareDifference"]
          consumer_roots = ["pairedGaussAudit","pairedSquareAudit"]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQO0LiteralOrbitalDifference",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQF1OriginalFermionicDifference",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6G7TOriginalFullColorLieGaussIdentityProbe",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQG0LiteralPhysicalSquare",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_CSQ_G0_LITERAL_SOURCE_EXACT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-csq-g0-literal/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original physical square and independent paired controls
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-csq-g0-literal"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQG0LiteralPhysicalSquare 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSCSQG0LiteralIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-csq-g0-literal"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSCSQG0Literal.gaussSignCancel",
                  "FCP.BFSSCSQG0Literal.generator_apply",
                  "FCP.BFSSCSQG0Literal.physicalGaussCancel",
                  "FCP.BFSSCSQG0Literal.rawAtTwo",
                  "FCP.BFSSCSQG0Literal.literalAtPoint",
                  "FCP.BFSSCSQG0Literal.evaluateAdd",
                  "FCP.BFSSCSQG0Literal.literalSplitAtPoint",
                  "FCP.BFSSCSQG0Literal.responseAtPoint",
                  "FCP.BFSSCSQG0Literal.namedSplitAtPoint",
                  "FCP.BFSSCSQG0Literal.joinDifferences",
                  "FCP.BFSSCSQG0Literal.physicalSquareDifference",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSCSQG0LiteralIndependent.pairedGaussAudit",
                  "FCP.BFSSCSQG0LiteralIndependent.pairedSquareAudit",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_CSQ_G0_LITERAL_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-csq-g0-literal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-csq-g0-literal/
          if-no-files-found: warn
          retention-days: 30
