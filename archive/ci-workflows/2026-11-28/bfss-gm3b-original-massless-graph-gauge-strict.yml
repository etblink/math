name: BFSS GM3B original massless Fock graph gauge invariance strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3BOriginalMasslessGraphGaugeInvariant.lean'
      - 'lean/diagnostics/BFSSGM3BOriginalMasslessGraphGaugeIndependentAudit.lean'
      - '.github/workflows/bfss-gm3b-original-massless-graph-gauge-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm3b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-exact-original-massless-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm3b-graph"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm3b-graph/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm3b-graph/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm3b-graph/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean":"84853fb624289121938e0fb4d2b45afdc16a74c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph.lean":"2fc90310c9ac476d8e52ba0176ecc94f8994d1c9",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM1AOriginalMasslessFockGaugeAETransport.lean":"f752436c29b38e6c21944a9b11118e53afe24c48",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation.lean":"0c8b10e9bf4d352d34f1de08c092c5188188b7bc",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining.lean":"668085f9530cb5b2cd0aa73fe22c0bd0226cabed",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
          }
          for path,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==sha,("FROZEN_SOURCE_DRIFT",path,got,sha)
          subprocess.check_call(["git","merge-base","--is-ancestor","63be8e39d3a1bad73fb935662efb10f261851e9e","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3BOriginalMasslessGraphGaugeInvariant.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM3BOriginalMasslessGraphGaugeIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==[
            "originalMasslessGraph_gauge_mem",
            "pairedOriginalMasslessGraph_gauge_mem"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalMasslessGraph_gauge_mem",
            "pairedOriginalMasslessGraph_gauge_mem"]
          assert re.findall(r"(?m)^import (\S+)$",t)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM3BOriginalMasslessGraphGaugeInvariant"]
          assert re.findall(r"(?m)^theorem (\S+)",t)==["pairedSourceMasslessGraphGaugeMem"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",t)==["pairedSourceMasslessGraphGaugeMem"]
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",content)
              for bad in ["set_option maxRecDepth","set_option maxHeartbeats",
                          "set_option synthInstance.maxHeartbeats"]:
                  assert bad not in content
          assert "originalMasslessMultiplier_gauge_intertwines" in s
          assert "originalMasslessDomain_gauge_mem" in s
          assert "originalMasslessGraph_mem" in s
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM3B_SOURCE_EXACT_GRAPH_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm3b-graph/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original source graph native build and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm3b-graph"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM3BOriginalMasslessGraphGaugeInvariant 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM3BOriginalMasslessGraphGaugeIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm3b-graph"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-5000:])
          native=(E/"native-source.log").read_text()
          for name in ["FCP.BFSSGM3B.originalMasslessGraph_gauge_mem",
                       "FCP.BFSSGM3B.pairedOriginalMasslessGraph_gauge_mem"]:
              assert "'"+name+"' depends on axioms:" in native or "'"+name+"' does not depend on any axioms" in native,("MISSING_NATIVE_AX",name)
          body=(E/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          assert [name for name,_ in reports]==["FCP.BFSSGM3BIndependent.pairedSourceMasslessGraphGaugeMem"],reports
          for name,raw in reports:
              axioms={x.strip() for x in raw.split(",") if x.strip()}
              assert axioms<={"propext","Classical.choice","Quot.sound"},(name,axioms)
          print("BFSS_GM3B_ORIGINAL_SOURCE_GRAPH_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve exact first-causal source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm3b-graph-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm3b-graph/
          if-no-files-found: warn
          retention-days: 30
