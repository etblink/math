name: BFSS W0C0 R1 original strict-linter RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c0-r1-original-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-w0c0-r1-original-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned original source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check original source, workflow and accepted predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparation.lean)" = 42ee591cbd6c9d7d98e736076c2a4b6cb321ae0e
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumer.lean)" = 63ce6ff9ee136bf3b02a845dc1c8dea4cbaf9054
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c0-r1-original-fock-scalar-trace-strict.yml)" = 43736998ba3bd7d2bb51b54b03afd56af17776b2
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip)" = f8133dba86db582f5d302885c7c134b3e2ff043a
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"])==("P3-M4-W0C0","R1","PENDING_STRICT_CI")
          assert a["qualification"] is False and q["gate"]=="P3-M4-W0B2B" and q["run_id"]==44180157170
          assert q["qualification"] is True and q==s["accepted_anchors"][-1]
          PY
      - name: Rehash original provider ZIP and original complete job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          run=44184526501;job=134397361890;artifact=14375177196
          tested="deaf6f7cc314f3b18ff231945112b6478cae25e3"
          digest="a1c300789de7b8e97e88efa894841670ab92bf7e98d489373c54dff285b9eb73"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f:return json.load(f)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert (runinfo["status"],runinfo["conclusion"],runinfo["head_sha"])==("completed","failure",tested)
          assert meta["id"]==artifact and meta["size_in_bytes"]==18813 and meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try: response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  with urllib.request.urlopen(e.headers["Location"],timeout=90) as f:return f.read()
              else:
                  with response:return response.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==18813 and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())=={"preflight.log","cold-source.log","source-axioms.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "Build completed successfully (9218 jobs)." in z.read("cold-source.log").decode()
              error=z.read("source-axioms.log").decode()
              assert "error: Try this:" in error and "P3M4W0C0OriginalFockScalarTraceSeparation.lean:37:2" in error
              assert "The goal is a proposition" in error and "sorryAx" not in error
              members=[{"name":name,"size":len(z.read(name)),"sha256":hashlib.sha256(z.read(name)).hexdigest(),"crc32":format(z.getinfo(name).CRC,"08x")} for name in sorted(z.namelist())]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(full)>10000 and b"Build completed successfully (9218 jobs)." in full and b"The goal is a proposition" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(exist_ok=True,parents=True)
          archive=root/"BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip"
          log=root/"BFSS_W0C0_R1_44184526501_complete_job.log"
          manifest=root/"BFSS_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence_manifest.json"
          for p in (archive,log,manifest):assert not p.exists()
          archive.write_bytes(raw);log.write_bytes(full)
          m={
            "gate":"P3-M4-W0C0","attempt":"R1","status":"RED_UNQUALIFIED",
            "run_id":run,"job_id":job,"artifact_id":artifact,"tested_sha":tested,
            "source_blob":"42ee591cbd6c9d7d98e736076c2a4b6cb321ae0e",
            "consumer_blob":"63ce6ff9ee136bf3b02a845dc1c8dea4cbaf9054",
            "workflow_blob":"43736998ba3bd7d2bb51b54b03afd56af17776b2",
            "original_zip":{"path":str(archive),"size":18813,"sha256":digest,"members":members},
            "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
            "cold_source_jobs":9218,"source_compiled":True,"strict_source_warning_error":True,"consumer_executed":False,
            "failure_phase":"STRICT_SOURCE_WARNING_AS_ERROR","failure_line":37,
            "failure_reason":"Lean style linter rejects proposition-valued letI; strict -DwarningAsError; source cold build succeeds.",
            "latest_qualified_predecessor_run":44180157170,
          }
          manifest.write_text(json.dumps(m,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0C0_R1_RED_ORIGINAL_ZIP_AND_FULL_LOG_REHASH_PASS")
          PY
      - name: Commit original CI ZIP log and digest manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C0_R1_44184526501_complete_job.log research/quantum-information/diagnostics/BFSS_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C0 R1: preserve original strict-linter RED ZIP full Actions log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
          echo "BFSS_W0C0_R1_NATIVE_RED_EVIDENCE_GIT_PIN_COMPLETE"
