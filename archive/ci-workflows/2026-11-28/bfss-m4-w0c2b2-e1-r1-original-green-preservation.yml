name: BFSS W0C2B2 E1 R1 original skew bracket gamma strict GREEN evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-e1-r1-original-green-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-e1-original-strict-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen E1 GREEN sources and 27 accepted anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Exact E1 source consumer and frozen donor byte preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E1OriginalSkewBracketGammaAction.lean)" = 5663ee2dcfd6ea682d23c3cf45dcd424888a7b89
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSW0C2B2E1OriginalSkewBracketGammaActionIndependentConsumer.lean)" = 4450f110f9a206d278f312a333de430f64b61298
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-e1-original-skew-bracket-gamma-action-strict.yml)" = 939c0d381253d3b0d8e149f73ac19221b80afd46
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentralityR2.lean)" = d52f48a79750846231c306d9e9ac8ceda25d37be
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean)" = 861628fe6322c919bee87e493e1e629d48bfa8bb
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0NOriginalSource48RealComplexCoefficientAdapter.lean)" = c5841055363a6eef713f35e568409dd2fa2b6c9e
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean)" = c2e7a7c665121283cde13ae5dabc183362b6b420
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E0_R2_44368187249_GREEN_evidence.zip)" = 6b4204d7603459d075c60444e1b3e12adca78fe0
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R2_44355713875_NATIVE_RED_evidence.zip)" = c8d32c6291f7469400abf794b0eacd30113ec828
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          gm=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R2_44368187249_GREEN_evidence_manifest.json').read_text())
          assert gm['strict_run']==44368187249 and gm['original_zip']['sha256']=='32065e648bc194211e09d25f720d883cc1adda8caec12283cb6dace19deb466c'
          root=Path('research/quantum-information/diagnostics')
          for n in ('BFSS_M4_W0C2B2_E1_R1_44373898851_GREEN_evidence.zip',
                    'BFSS_W0C2B2_E1_R1_44373898851_complete_job.log',
                    'BFSS_W0C2B2_E1_R1_44373898851_GREEN_evidence_manifest.json'):
              assert not (root/n).exists(),n
          print('BFSS_E1_R1_ORIGINAL_GREEN_27_ANCHORS_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Independently verify original E1 strict provider ZIP full job and all axiom reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44373898851;job=135047764872;artifact=14460072996
          tested='dea5e983d339410741d474058d590b88f01d2e25'
          size=4298;digest='bb92aaa134037b190e43ee7458e0fba1c2760f115621fbb4085d63ec4ba4132d'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as resp:return json.load(resp)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='success' and r['run_attempt']==1
          assert j['id']==job and j['run_id']==run and j['conclusion']=='success'
          for step in ('Checkout original immutable','Preflight 27 anchors',
                       'Restore pinned Lean','Cold original source bracket gamma action',
                       'Upload original E1 provider'):
              assert any(s['name'].startswith(step) and s['conclusion']=='success' for s in j['steps']),step
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log','auditor.log'}
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def validate(log,names):
              assert 'error:' not in log and 'sorryAx' not in log
              found=pat.findall(log)
              assert len(found)==len(names),(found,names)
              assert [s.rsplit('.',1)[-1] for s,_ in found]==names
              for _,axioms in found:assert {x.strip() for x in axioms.split(',') if x.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist());assert expected<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B2_E1_27_ACCEPTED_ANCHORS_E0_ORIGINAL_GREEN_AND_STOPPED_B2_EVIDENCE_PINNED_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              assert 'Build completed successfully (8967 jobs)' in z.read('cold-source.log').decode()
              validate(z.read('source-axioms.log').decode(),[
                  'originalSource48K_skew_complex_gamma_covariance',
                  'originalSource48K_skew_bracket_complex_gamma_covariance'])
              validate(z.read('consumer.log').decode(),[
                  'originalSource48K_skew_complex_gamma_covariance_consumer',
                  'originalSource48K_skew_bracket_complex_gamma_covariance_consumer'])
              assert 'BFSS_W0C2B2_E1_ORIGINAL_SOURCE_BRACKET_GAMMA_2_SOURCE_2_CONSUMER_2_CONTROLS_6_MUTANTS_STRICT_GREEN' in z.read('auditor.log').decode()
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>70000,len(full)
          for token in (b'Build completed successfully (8967 jobs)',
                        b'BFSS_W0C2B2_E1_ORIGINAL_SOURCE_BRACKET_GAMMA_2_SOURCE_2_CONSUMER_2_CONTROLS_6_MUTANTS_STRICT_GREEN',
                        b'Artifact ID 14460072996'):
              assert token in full,token
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B2_E1_R1_44373898851_GREEN_evidence.zip'
          log=root/'BFSS_W0C2B2_E1_R1_44373898851_complete_job.log'
          manifest=root/'BFSS_W0C2B2_E1_R1_44373898851_GREEN_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
              'gate':'P3-M4-W0C2B2-E1','attempt':'R1',
              'status':'ORIGINAL_SOURCE_SKEW_BRACKET_GAMMA_ACTION_STRICT_GREEN_DIAGNOSTIC',
              'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
              'original_zip':{'path':str(arc),'size':len(raw),'sha256':digest,'members':members},
              'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'5663ee2dcfd6ea682d23c3cf45dcd424888a7b89',
              'consumer_blob':'4450f110f9a206d278f312a333de430f64b61298',
              'workflow_blob':'939c0d381253d3b0d8e149f73ac19221b80afd46',
              'source_compiled':True,'consumer_compiled':True,
              'source_axiom_reports':2,'consumer_axiom_reports':2,
              'original_source_controls':2,'negative_mutants_rejected':6,
              'predecessor_accepted_anchor_count':27,'predecessor_qualified_run':44267283653,
              'canonical_B2_status':'BLOCKED','W0C2B3_status':'PROSPECTIVE_NOT_STAGED',
              'claim_ceiling':'Only skew K(A) and original K commutator bracket gamma action on Source48; no K(AB-BA) target gamma action or all-48 defect centrality, no 28th anchor'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_E1_R1_ORIGINAL_STRICT_GREEN_ZIP_WHOLE_JOB_SHA_CRC_SOURCE_CONSUMER_AXIOMS_VERIFIED')
          PY
      - name: Git-pin original E1 GREEN ZIP whole job log and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E1_R1_44373898851_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B2_E1_R1_44373898851_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B2_E1_R1_44373898851_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS E1 R1: archive original source skew bracket gamma strict GREEN evidence'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
