name: RHOPF P9A0 original Gamma9 bivector strict source gate

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A0OriginalGammaPairClifford.lean
      - lean/diagnostics/RHOPFP9A0OriginalGammaPairIndependentAudit.lean
      - research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py
      - .github/workflows/rhopf-p9a0-original-gamma-pair-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhopf-p9a0-original-gamma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout source-pinned unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Freeze source and run exact integer independent consumer
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rhopf-p9a0"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/exact-tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$evidence/toolchain-sha256.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          pkgs=json.loads(Path('lean/lake-manifest.json').read_text())['packages']
          assert next(x['rev'] for x in pkgs if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          pins={
           'lean/OAI/MathematicalPhysics/BFSS/Core.lean':'9882359ced78b0a3bd7e2f057974bd0a031b3e60',
           'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2RealGammaProbe.lean':'b9b8192055c70f0d001d7982669b9823c55562ed',
           'research/topology/data/BFSS_GAMMA9_SOURCE_PERMUTATION_FIXTURE_2026_11_18.json':'684680e139cfcd09c37bf075c0c014bdaa80ba35',
           'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A0OriginalGammaPairClifford.lean':'bf5eb554232a6d452e86d85b05220aad7c5d0aeb',
           'lean/diagnostics/RHOPFP9A0OriginalGammaPairIndependentAudit.lean':'cde7948f69f3a53bd9a9544db1102d5a4230bbcf',
           'research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py':'9d20952c366e356ff5dc656a35d0b604236a15ac'}
          for path,expected in pins.items():
           got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
           assert got==expected,(path,expected,got)
          src=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A0OriginalGammaPairClifford.lean').read_text()
          consumer=Path('lean/diagnostics/RHOPFP9A0OriginalGammaPairIndependentAudit.lean').read_text()
          assert re.findall(r'(?m)^import (\S+)$',src)==['OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2RealGammaProbe']
          assert re.findall(r'(?m)^import (\S+)$',consumer)==['OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A0OriginalGammaPairClifford']
          names=['originalGamma_sq','originalGamma_anticommute','originalGammaPair_sq_neg_one','originalGammaPair_skew','K13_sq','K25_sq','K46_sq','K13_skew','K25_skew','K46_skew']
          assert re.findall(r'(?m)^theorem (\w+)',src)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',src)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',consumer)==['FCP.RHOPFP9A0.'+n for n in names]
          for contents in (src,consumer):
           assert 'set_option autoImplicit false' in contents
           assert not re.search(r'(?m)^\s*(?:sorry|admit|axiom|unsafe|opaque|constant)\b',contents)
           assert not re.search(r'(?m)^\s*set_option\s+(?:maxRecDepth|maxHeartbeats)',contents)
          print('RHOPF_P9A0_EXACT_SOURCE_BLOBS_AND_AXIOM_PREFLIGHT_PASS')
          PY
          python3 research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py |
            tee "$evidence/source-integer-independent-consumer.json"

      - name: Restore exact pinned Lean and Mathlib
        timeout-minutes: 44
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2000s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'

      - name: Compile source and strict original Gamma9 pair results
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 1200s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2RealGammaProbe 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a0/source-gamma-build.log"
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A0OriginalGammaPairClifford
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 700s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a0/native-proofs-and-axioms.log"

      - name: Compile original-source Lean consumer and verify allowed axiom reports
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=diagnostics/RHOPFP9A0OriginalGammaPairIndependentAudit
          mkdir -p .lake/build/lib/lean/diagnostics
          timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a0/independent-lean-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import os
          base=Path(os.environ['RUNNER_TEMP'])/'rhopf-p9a0'
          logs=(base/'native-proofs-and-axioms.log').read_text()+(base/'independent-lean-axioms.log').read_text()
          for n in ('originalGamma_sq','originalGamma_anticommute','originalGammaPair_sq_neg_one','originalGammaPair_skew','K13_sq','K25_sq','K46_sq','K13_skew','K25_skew','K46_skew'):
           assert 'RHOPFP9A0.'+n in logs,n
          assert 'sorryAx' not in logs and 'error:' not in logs
          print('RHOPF_P9A0_STRICT_NATIVE_AND_INDEPENDENT_CONSUMER_PASS')
          PY

      - name: Retain tested commit, original-source diagnostics and failed proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhopf-p9a0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhopf-p9a0
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
