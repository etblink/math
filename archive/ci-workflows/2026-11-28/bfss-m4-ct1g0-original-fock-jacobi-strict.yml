name: BFSS M4 CT1G0 original Fock Jacobi strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT1G0OriginalFockJacobiSource48Adapter.lean
      - lean/diagnostics/BFSSP3M4CT1G0OriginalFockJacobiIndependentConsumer.lean
      - .github/workflows/bfss-m4-ct1g0-original-fock-jacobi-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-ct1g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-original-jacobi-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and consumer bytes, pinned donors, original checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-ct1g0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-ct1g0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-ct1g0/preflight.log"
          import json,re,subprocess,hashlib
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT1G0OriginalFockJacobiSource48Adapter.lean":"df368f58b722ec8cd33a5e8656700cbe06badbe6","lean/diagnostics/BFSSP3M4CT1G0OriginalFockJacobiIndependentConsumer.lean":"299475618bdf1b0e6a43326c51f15640fa58c397","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1L2AbstractOriginalFockCovarianceLeibniz.lean":"b4012951a26aa7573db513adab3d7ce27396db7e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT0OriginalSkewBivectorTrace.lean":"a6f93c62c83bf51a0b89691196f875399d2896fa","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,want in pins.items():
            got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
            assert got==want,(path,want,got)
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT1G0OriginalFockJacobiSource48Adapter.lean").read_text()
          c=Path("lean/diagnostics/BFSSP3M4CT1G0OriginalFockJacobiIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalFock_commutator_jacobi",
            "originalFock_commutator_sub",
            "originalSource48K_commutator_jacobi"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",c)==[
            "originalFock_commutator_jacobi_consumer",
            "originalFock_commutator_sub_consumer",
            "originalSource48K_commutator_jacobi_consumer"]
          assert len(re.findall(r"(?m)^example\b",c))==4
          for x in (s,c):
            assert "set_option autoImplicit false" in x
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",x)
            assert "maxRecDepth" not in x and "maxHeartbeats" not in x
          assert "Fermion 2 →L[ℂ] Fermion 2" in s
          assert "sourceNormalizedGamma" in s and "originalSource48BivectorK" in s
          assert "simp only [sub_mul, mul_sub, mul_assoc]" in s
          assert "originalFock_commutator_jacobi" in c
          assert "((0 : Fin 24), (0 : Fin 2))" in c
          assert "((0 : Fin 24), (1 : Fin 2))" in c
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in manifest["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          assert state["branch"]=="integration/bfss-unified-research-20261108"
          assert state["last_qualified"]["gate"]=="P3-M4-CT0"
          assert state["last_qualified"]["run_id"]==43983772199
          assert state["active"]["gate"]=="P3-M4-CT1G0"
          assert state["active"]["status"]=="PENDING_STRICT_CI"
          assert state["active"]["attempt"]=="R2"
          assert state["active"]["previous_red_run"]==43988822460
          assert state["active"]["prior_red_artifact_id"]==14287816678
          assert state["active"]["prior_red_artifact_sha256"]=="c03e06d90de7d0a7e946a55d27f5bd2c2d7e03981355d80ad512ff8dbe61d75e"
          assert state["active"]["source_blob"]=="df368f58b722ec8cd33a5e8656700cbe06badbe6"
          assert state["active"]["consumer_blob"]=="299475618bdf1b0e6a43326c51f15640fa58c397"
          assert "maximum recursion depth has been reached" in Path(state["active"]["prior_red_job_log"]).read_text()
          assert hashlib.sha256(Path(state["active"]["prior_red_evidence_archive"]).read_bytes()).hexdigest()==state["active"]["prior_red_artifact_sha256"]
          assert state["active"]["qualification"] is False
          assert state["active"]["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT1G0OriginalFockJacobiSource48Adapter.lean"]
          assert state["active"]["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4CT1G0OriginalFockJacobiIndependentConsumer.lean"]
          assert state["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          print("BFSS_M4_CT1G0_EXACT_ORIGINAL_FOCK_DONORS_CONSUMER_TOOLCHAIN_CHECKPOINT_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original Jacobi roots, independent consumer and strict axiom audit
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-ct1g0"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4CT1G0OriginalFockJacobiSource48Adapter 2>&1 | tee "$root/cold-source.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT1G0OriginalFockJacobiSource48Adapter.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4CT1G0OriginalFockJacobiIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-ct1g0"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def check(log,expected):
            assert "error:" not in log and "sorryAx" not in log,log[-1500:]
            bad=[x for x in log.splitlines() if "warning:" in x and not allow_warning.fullmatch(x)]
            assert not bad,bad[:5]
            entries=pat.findall(log)
            assert len(entries)==len(expected),(entries,expected)
            labels=[n.rsplit(".",1)[-1] for n,_ in entries]
            assert len(set(labels))==len(labels) and set(labels)==set(expected),labels
            for n,raw in entries:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(n,raw)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b","c"))+"\n"
          check(fixture,["a","b","c"])
          mutants=[
            fixture.replace("Quot.sound","sorryAx",1),
            fixture.replace("Quot.sound","Unapproved.axiom",1),
            fixture.replace("'N.c'","'N.a'"),
            "\n".join(fixture.splitlines()[:2])+"\n",
            fixture+"warning: unintended source warning\n",
            fixture+"error: native proof failure\n"]
          for i,broken in enumerate(mutants):
            try: check(broken,["a","b","c"])
            except AssertionError: pass
            else: raise AssertionError(("negative auditor accepted",i))
          print("BFSS_M4_CT1G0_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          check((root/"source-axioms.log").read_text(),[
            "originalFock_commutator_jacobi",
            "originalFock_commutator_sub",
            "originalSource48K_commutator_jacobi"])
          check((root/"consumer.log").read_text(),[
            "originalFock_commutator_jacobi_consumer",
            "originalFock_commutator_sub_consumer",
            "originalSource48K_commutator_jacobi_consumer"])
          print("BFSS_M4_CT1G0_ORIGINAL_FOCK_JACOBI_3_SOURCE_3_CONSUMER_4_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve exact original preflight, cold, source and consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-ct1g0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-ct1g0/
          if-no-files-found: warn
          retention-days: 14
