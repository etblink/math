name: BFSS M4 W0B0 original gamma commutant predicate strict

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0b0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-48-gamma-commutant:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout unified branch at exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight W0A3 original GREEN donor and W0A4 both stopped source REDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0b0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0b0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0b0/preflight.log"
          import json,re,subprocess,hashlib,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B0OriginalGammaCommutantInduction.lean":"d3cbdd7446f06e203959776abee3629b8269f572","lean/diagnostics/BFSSP3M4W0B0OriginalGammaCommutantIndependentConsumer.lean":"159c561d6e73e3c86959cd239deb10984064e92e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A3OriginalComplexPureTensorGammaTransport.lean":"3a8d37dd0b065345b0a27529830dd0a1ee99a5b3","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48RealLinearGammaProbe.lean":"a9f446ea7986ca796c2f4b222a5ab710d98590cc","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3IOriginalComplexCliffordFockAlgebraEquivProbe.lean":"754a5f2a13baea90312f6031eb8fa7963dbdf42b","research/quantum-information/diagnostics/BFSS_M4_W0A3_R1_44051746176_evidence.zip":"845be0ed709f4fe44e288f116cc17eba4fcc5b9d","research/quantum-information/diagnostics/BFSS_M4_W0A4_R1_44055363556_RED_evidence.zip":"ef3ad039799680fde9f0d1669f130ef275f9a2a3","research/quantum-information/diagnostics/BFSS_M4_W0A4_R2_44059417729_RED_evidence.zip":"c1d7f4436e22dd5698058ea3b5557d131823de9d","research/quantum-information/diagnostics/BFSS_W0A4_R1_44055363556_complete_job.log":"6f635122f8ab1a3078851aac68214462a4124488","research/quantum-information/diagnostics/BFSS_W0A4_R2_44059417729_complete_job.log":"c8d16f4c41bfe15e2ceb05664a7efc3d5aef4d9d","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,expected,actual)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B0OriginalGammaCommutantInduction.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4W0B0OriginalGammaCommutantIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==[
             "sourceGammaRealLinear_commute","originalComplexEquiv_generator_commutes"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
             "sourceGammaRealLinear_commute_consumer","originalComplexEquiv_generator_commutes_consumer"]
          assert len(re.findall(r"(?m)^theorem\b",source))==2
          assert len(re.findall(r"(?m)^theorem\b",consumer))==2
          assert len(re.findall(r"(?m)^example\b",consumer))==2
          assert len(re.findall(r"(?m)^import ",source))==3
          assert consumer.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0B0OriginalGammaCommutantInduction\n")
          assert "Commute.sum_right" in source and "smul_right" in source
          assert "TensorProduct.inductionOn" in source
          assert "originalComplexEquiv_pureTensorGenerator_eq_activeGamma" in source
          assert "Commute.add_right" not in source or "add_right" in source
          for data in (source,consumer):
              assert "set_option autoImplicit false" in data
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",data)
              assert "maxRecDepth" not in data and "maxHeartbeats" not in data
              assert "AlgebraTensorModule.lift" not in data and "activeGammaComplexLinear" not in data
              assert "OriginalFullComplexGammaTransport" not in data and "originalSource48BivectorK" not in data
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q,a=state["last_qualified"],state["active"]
          assert q["gate"]=="P3-M4-W0A3" and q["run_id"]==44051746176 and q["status"]=="GREEN_QUALIFIED"
          assert q["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A3OriginalComplexPureTensorGammaTransport.lean"]
          assert q["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0A3_R1_44051746176_evidence.zip"]
          assert a["gate"]=="P3-M4-W0B0" and a["attempt"]=="R1" and a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["accepted_predecessor_run"]==44051746176 and a["contract_commit"]=="812cc2b8ea6ace9b2210c3ec7ef05742a33fb87d"
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B0OriginalGammaCommutantInduction.lean"]
          assert a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0B0OriginalGammaCommutantIndependentConsumer.lean"]
          assert Path(a["prospective_receipt"]).is_file()
          r1=state["previous_active_W0A4_R1_RED"]
          r2=state["previous_active_W0A4_R2_stopped"]
          assert r1["status"]==r2["status"]=="RED_UNQUALIFIED"
          assert r1["run_id"]==44055363556 and r2["run_id"]==44059417729
          assert r2["stopped"] is True and r2["stop_reason"]=="TWO_CONSECUTIVE_ORIGINAL_COMPLEX_LINEAR_MAP_CONSTRUCTION_REDS"
          assert r1["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0A4_R1_44055363556_RED_evidence.zip"]
          assert r2["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0A4_R2_44059417729_RED_evidence.zip"]
          assert r1["evidence_job_log_blob"]==pins["research/quantum-information/diagnostics/BFSS_W0A4_R1_44055363556_complete_job.log"]
          assert r2["evidence_job_log_blob"]==pins["research/quantum-information/diagnostics/BFSS_W0A4_R2_44059417729_complete_job.log"]
          for path,digest in [
             ("research/quantum-information/diagnostics/BFSS_M4_W0A3_R1_44051746176_evidence.zip","a7cf6534bc40bdc1edd5ef99e7c7519f9d4cfec85339e2dd5d24ce076a3d578d"),
             ("research/quantum-information/diagnostics/BFSS_M4_W0A4_R1_44055363556_RED_evidence.zip","7deda8b0723841d8a35e19dd8587211254b7e3a8cebaa317918321a54d96dcb6"),
             ("research/quantum-information/diagnostics/BFSS_M4_W0A4_R2_44059417729_RED_evidence.zip","5c4589b34218e6d34b7bc8fe3fbba8badb7f3bf0553522802fc9d3f763a47c90")]:
              data=Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest,path
              with zipfile.ZipFile(path) as z: assert z.testzip() is None
          with zipfile.ZipFile("research/quantum-information/diagnostics/BFSS_M4_W0A4_R2_44059417729_RED_evidence.zip") as z:
              assert set(z.namelist())=={"preflight.log","tested-commit.txt"}
          assert "P3M4W0A4OriginalFullComplexGammaTransport.lean:41:8: Type mismatch" in Path(
              "research/quantum-information/diagnostics/BFSS_W0A4_R2_44059417729_complete_job.log").read_text()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_W0B0_ORIGINAL_GAMMA_COMMUTANT_W0A3_GREEN_W0A4_R1_R2_STOP_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib commit
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Original cold W0B0 source, independent consumer and strict root audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0b0"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0B0OriginalGammaCommutantInduction 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B0OriginalGammaCommutantInduction.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0B0OriginalGammaCommutantIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0b0"
          allowed={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              unexpected=[x for x in log.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
              assert not unexpected,unexpected[:5]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert len(set(names))==len(names) and names==expected,names
              for n,axs in found:
                  assert {a.strip() for a in axs.split(",") if a.strip()}<=allowed,(n,axs)
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a"])
          mutants=[good.replace("Quot.sound","sorryAx",1),
                   good.replace("Quot.sound","Foreign.axiom",1),
                   good+good,"",good+"warning: unexpected warning\n",
                   good+"error: failed proof\n"]
          for k,bad in enumerate(mutants):
              try: audit(bad,["a"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted negative mutation",k))
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),
                ["sourceGammaRealLinear_commute","originalComplexEquiv_generator_commutes"])
          audit((root/"consumer.log").read_text(),
                ["sourceGammaRealLinear_commute_consumer",
                 "originalComplexEquiv_generator_commutes_consumer"])
          print("BFSS_W0B0_ORIGINAL_GAMMA_COMMUTANT_2_SOURCE_2_CONSUMER_2_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve original exact preflight, cold source, independent consumer and axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0b0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0b0/
          if-no-files-found: warn
          retention-days: 14
