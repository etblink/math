name: BFSS M4 QTC0C abstract module coefficient strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean
      - lean/diagnostics/BFSSP3M4QTC0CAbstractCoefficientIndependentConsumer.lean
      - .github/workflows/bfss-m4-qtc0c-abstract-coefficient-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-qtc0c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abstract-module-ordered-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact module source, consumer, prior GREEN and both sealed REDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-qtc0c"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-qtc0c/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-qtc0c/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean":"9448c9a47c605cb6aba2cfc798ae28a0213c9411","lean/diagnostics/BFSSP3M4QTC0CAbstractCoefficientIndependentConsumer.lean":"4ec2e6eb6b98b6039326765454e563038258f869","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean":"9d1dc845bea73d8e07549c69d9ef07804509f52e","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip":"7cebb61b36ba22283cbd27a8d5f91b301b7303e2","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip":"671be94ee31c954b8f8b276de7b8ede9359aa617","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip":"485d47d68a5425a79d720248a4b64b972da619ab","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_complete_job.log":"c56410ec436f5505988f6a138ae19e8afbb5d88f","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_complete_job.log":"6290b76858d5e736b04af723532d94fec6b3e532","contributions/bfss-kotler/BFSS_PROJECT_LEAD_EVERGREEN_QUALIFIED_REUSE_LEDGER_2026_11_10.md":"4a8604acb431247694eb0a34bef1086a66e27af7","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean").read_text()
          con=Path("lean/diagnostics/BFSSP3M4QTC0CAbstractCoefficientIndependentConsumer.lean").read_text()
          assert src.startswith("import Mathlib.Tactic\n") and src.count("import ")==1
          assert con.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC0CAbstractCoefficientContraction\n")
          srcRoots=["coefficient_left","coefficient_right","coefficient_both"]
          conRoots=["left_consumer","right_consumer","both_consumer"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==srcRoots
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==conRoots
          assert len(re.findall(r"(?m)^example\b",con))==7
          assert len(re.findall(r"(?m)^theorem\b",src))==3
          assert len(re.findall(r"(?m)^theorem\b",con))==3
          for body in (src,con):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
          assert "[AddCommMonoid M] [Module ℂ M]" in src
          assert "Matrix.transpose_apply" in src and "Finset.sum_comm" in src
          assert "Fermion 2" not in src and "ContinuousLinearMap" not in src
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q=state["last_qualified"]
          a=state["active"]
          assert q["gate"]=="P3-M4-QTC0A" and q["run_id"]==44001621836 and q["status"]=="GREEN_QUALIFIED"
          assert a["gate"]=="P3-M4-QTC0C" and a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["attempt"]=="R1" and a["accepted_predecessor_run"]==44001621836
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean"] and a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4QTC0CAbstractCoefficientIndependentConsumer.lean"]
          assert a["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==3
          assert a["independent_controls"]==7
          stop=state["previous_active_QTC0B_R2_stopped"]
          assert stop["stopped"] is True and stop["run_id"]==44014529416
          assert stop["stop_reason"]=="TWO_ANALOGOUS_NATIVE_DIRECT_FOCK_REWRITE_ELABORATION_FAILURES"
          assert stop["artifact_sha256"]=="f7fa7726865600cab92e1270b558dcc856ad0cfc28318f2bb7d95e74b7ab8dbb"
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          artifacts=[
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip",
             "bf8d93fe00846c9ea26815d32ee331424d9510d1816b66cd98c90ef82baf724c"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip",
             "a50bc06b6f5ac03c15be16de7b943910ca55bc3a7960f40829c1049e8402c5c1"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip",
             "f7fa7726865600cab92e1270b558dcc856ad0cfc28318f2bb7d95e74b7ab8dbb")
          ]
          for path,digest in artifacts:
              raw=Path(path).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest
              with zipfile.ZipFile(path) as z: assert z.testzip() is None
          for text in ("BFSS_M4_QTC0B_R1_R2_TWO_REDS_ARCHITECTURE_DECISION_2026_11_16.md",
                       "BFSS_M4_QTC0C_R1_ABSTRACT_COEFFICIENT_CONTRACTION_FORWARD_RESEARCH_AND_PRE_GATE_2026_11_16.md"):
              assert Path("research/spectral-p2-original-field",text).is_file()
          print("BFSS_M4_QTC0C_ABSTRACT_SOURCE_CONSUMER_GREEN_RED_HISTORY_AND_TOOLCHAIN_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 33
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1700s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold abstract module source, independent consumer and strict axioms
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-qtc0c"
          timeout 700s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC0CAbstractCoefficientContraction 2>&1 | tee "$root/cold-source.log"
          timeout 170s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 170s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4QTC0CAbstractCoefficientIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-qtc0c"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-1500:]
              warning_lines=[l for l in log.splitlines() if "warning:" in l and not allow_warning.fullmatch(l)]
              assert not warning_lines,warning_lines[:5]
              entries=pat.findall(log)
              assert len(entries)==len(expected),(entries,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in entries]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for theorem,axioms in entries:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(theorem,axioms)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("left","right","both"))+"\n"
          audit(fixture,["left","right","both"])
          mutants=[
              fixture.replace("Quot.sound","sorryAx",1),
              fixture.replace("Quot.sound","Unapproved.axiom",1),
              fixture.replace("'N.right'","'N.left'"),
              "\n".join(fixture.splitlines()[:2])+"\n",
              fixture+"warning: unexpected warning\n",
              fixture+"error: source theorem failed\n"
          ]
          for k,bad in enumerate(mutants):
              try: audit(bad,["left","right","both"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted mutated failure",k))
          print("BFSS_M4_QTC0C_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          assert "error:" not in (root/"cold-source.log").read_text()
          assert "Build completed successfully" in (root/"cold-source.log").read_text()
          audit((root/"source-axioms.log").read_text(),["coefficient_left","coefficient_right","coefficient_both"])
          audit((root/"consumer.log").read_text(),["left_consumer","right_consumer","both_consumer"])
          print("BFSS_M4_QTC0C_ABSTRACT_3_SOURCE_3_CONSUMER_7_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve original preflight, cold source and independent reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-qtc0c-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-qtc0c/
          if-no-files-found: warn
          retention-days: 14
