name: BFSS GM5E10 exact original fixed-ball zero mode strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E10OriginalFixedBallZeroMode.lean'
      - 'lean/diagnostics/BFSSGM5E10OriginalFixedBallZeroModeIndependentAudit.lean'
      - '.github/workflows/bfss-gm5e10-original-fixed-ball-zero-mode-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm5e10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-fixed-ball-zero-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E10OriginalFixedBallZeroMode.lean \
            lean/diagnostics/BFSSGM5E10OriginalFixedBallZeroModeIndependentAudit.lean \
            .github/workflows/bfss-gm5e10-original-fixed-ball-zero-mode-strict.yml \
            > "$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E9OriginalCutoffZeroMode.lean": "f8ffe8b7fe420f08910b121ecfae19394446fcb4",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E1OriginalRadialWeightedGradientControl.lean": "257318d2553e1fab10d3b79c6b88180b2e49ab7a",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5COriginalMasslessCoreMomentControl.lean": "d5b7fbe3cb19ec19a1fae372805830fe34b4d7b7",
            "lean/OAI/MathematicalPhysics/BFSS/Cutoffs.lean": "7fe937b9af79f4ea7a8f994fa37d510608464c2b",
            "lean/OAI/MathematicalPhysics/BFSS/MassiveMoments.lean": "2fd223d0da1a85c3be52bb2b9c68f4f12d10957e",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E5OriginalWeightedGraphCompactness.lean": "fd39e85e5d7c2d6009c53416072ba23b7440a81f",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E8OriginalPersistentOverlapZeroMode.lean": "672da1f40cbc5c71dee40a81d185054a11ec3479",
            "lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean": "cc01379653404c4ede3d551fd8d823e079543b21",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5BOriginalNativeClosedChargeCoreEnergy.lean": "eebefdba1bf2b6c3d29462f88561f1337b2232de",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean": "a9f27a48852ac570aedc8e0ab88d683250e6b138",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean": "152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean": "e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E7OriginalGaugeCoreLocalization.lean": "e207f80249e32a3b600c42d68cb73111dbdf3949",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BBOriginalPhysicalHilbertChargeAdjointProbe.lean": "044eef08490bcd2f15e95bb3cf1287704f5254de",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe.lean": "0afafb8eae4b5efdbd4f95eff2ae1e9352dfe7c5",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","fcd873ebbb3148fb0036e19b7b8cb81dbb28be98","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5E10OriginalFixedBallZeroMode.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM5E10OriginalFixedBallZeroModeIndependentAudit.lean").read_text()
          source_roots = [
            "nativeCoreCutoff_charge_sq_le",
            "originalZeroMode_of_fixedBallMass",
          ]
          consumer_roots = [
            "pairedOriginalZeroMode_of_fixedBallMass",
          ]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5E9OriginalCutoffZeroMode",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5E10OriginalFixedBallZeroMode",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM5E10_SOURCE_EXACT_FIXED_BALL_ZERO_MODE_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original fixed-ball zero mode criterion and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm5e10-fixed-ball-zero-mode"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5E10OriginalFixedBallZeroMode 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM5E10OriginalFixedBallZeroModeIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm5e10-fixed-ball-zero-mode"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSGM5E10.nativeCoreCutoff_charge_sq_le",
                  "FCP.BFSSGM5E10.originalZeroMode_of_fixedBallMass",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSGM5E10Independent.pairedOriginalZeroMode_of_fixedBallMass",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_GM5E10_ORIGINAL_SOURCE_FIXED_BALL_ZERO_MODE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm5e10-fixed-ball-zero-mode-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm5e10-fixed-ball-zero-mode/
          if-no-files-found: warn
          retention-days: 30
