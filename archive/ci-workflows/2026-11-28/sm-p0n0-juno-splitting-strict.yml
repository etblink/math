name: SM-P0N0 original JUNO physical-intake provenance and negative-controls strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - research/standard-model/tools/sm_p0n0.py
      - research/standard-model/tests/test_sm_p0n0.py
      - .github/workflows/sm-p0n0-juno-splitting-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm-p0n0-juno-original-strict
  cancel-in-progress: false
jobs:
  source-exact-physical-intake-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical pinned source with frozen SM ledger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify frozen original sources, accepted ledger and 27 BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sm-p0n0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sm-p0n0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-p0n0/preflight.log"
          import ast,json,re,subprocess
          from pathlib import Path
          pins={"research/standard-model/tools/sm_p0n0.py":"95192c55e594babe30eecf963debd7acf8a28c59","research/standard-model/tests/test_sm_p0n0.py":"70b7df6ffad8c6c8f8ae2f6a1ddc89f417e375ba","research/standard-model/SM_P0N0_JUNO_MASS_SPLITTING_PHYSICAL_INTERFACE_MICROGATE_2026_11_18.md":"9ec9c09356ce104272a41f19384a8fa5cdd35e97","research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json":"1d391ba994ee23f03c4423b45fbb15e7e42c86f1","research/standard-model/tools/smd1_scc0.py":"95569dffd88af133df3dd56d23e1f61ca8c4a207","research/standard-model/tests/test_smd1_scc0.py":"2a41d3592179c1fd205518f912ae365ba8f59f8f","research/standard-model/tools/smd1_scc3b1.py":"f395234389956eff23512055f23e659066869eb9","research/standard-model/tests/test_smd1_scc3b1.py":"b4903d31f2268f244f90b80c9ebe120e06ec932c","research/standard-model/evidence/SMD1_SCC3B1_R1_44416698450_ORIGINAL_STRICT_GREEN_evidence.zip":"242f749c580794702eaaaf8d89a927b799a316d6","research/standard-model/evidence/SMD1_SCC3B0_R2_44414707214_ORIGINAL_STRICT_GREEN_evidence.zip":"0ed52e9e9aed7c98a5d1acefc776facacfc4517d","research/standard-model/evidence/SMD1_SCC3A_R1_44410857114_ORIGINAL_STRICT_GREEN_evidence.zip":"a37c8350995349051c6623efa1cf532f1429821e","research/standard-model/evidence/SMD1_SCC2_R2_44407657796_ORIGINAL_STRICT_GREEN_evidence.zip":"2f8eb4be633546a7d2ddf1f33d174f6c3900264b","research/standard-model/evidence/SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence.zip":"faf10f95ec2973ad5040be3f6f2ac362dcc1ca10","lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean":"481a984b5ba7d2d7df41297d162ab1d608646d6e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean":"7d372392703d0fe69942df9df58b421af6850656"}
          for path,expect in pins.items():
              got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
              assert got==expect,(path,got,expect)
          code=Path('research/standard-model/tools/sm_p0n0.py').read_text()
          tests=Path('research/standard-model/tests/test_sm_p0n0.py').read_text()
          ast.parse(code)
          ast.parse(tests)
          assert len(re.findall(r'(?m)^    def test_',tests))==20
          for p in ('class FrozenObservation','class MassSquaredSpectrum','class CandidateIntake',
                    'def symbolic_delta21','def same_delta_after_common_offset',
                    'def load_frozen_first_juno','def candidate_intakes','def intake_checkpoint'):
              assert p in code,p
          assert 'NO_EXPERIMENTAL_INFERENCE' in code
          assert 'FIT_INPUT_NOT_PREDICTION' in code
          assert 'MISSING_PHYSICAL_MAP' in code
          assert 'NOT_PRESENT_IN_FROZEN_LEDGER' in code
          assert 'FIRST_JUNO_DOI' in code
          assert 'https://doi.org/10.1038/s41586-026-10538-z' in code
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert sm['last_qualified_decision_methodology']['gate']=='SM-D1-SCC3B1'
          assert sm['last_qualified_decision_methodology']['independent_preservation_run']==44417161740
          assert sm['last_qualified_formal_methodology']['gate']=='SM-D1-SCC3B0'
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in sm['upcoming'])
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          ledger=json.loads(Path('research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json').read_text())
          assert ledger['schema']=='SM-D0_EVIDENCE_LEDGER/0.1' and ledger['as_of']=='2026-11-18'
          assert any(x['id']=='juno_dm2_21_2026' for x in ledger['constraints'])
          print('SM_P0N0_20_JUNO_TESTS_SOURCE_EXACT_SM_D0_SCC0_SCC3B1_SCC3B0_27_BFSS_ANCHORS_PREFLIGHT_PASS')
          
          PY
      - name: Original SCC0 and SCC3B1 regression plus independent physical intake consumer
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PYTHONHASHSEED=0
          python3 --version | tee "$RUNNER_TEMP/sm-p0n0/python-version.log"
          python3 -W error -m unittest discover -s research/standard-model/tests -p test_smd1_scc0.py -v 2>&1 | tee "$RUNNER_TEMP/sm-p0n0/scc0-regression.log"
          python3 -W error -m unittest discover -s research/standard-model/tests -p test_smd1_scc3b1.py -v 2>&1 | tee "$RUNNER_TEMP/sm-p0n0/scc3b1-regression.log"
          python3 -W error -m unittest discover -s research/standard-model/tests -p test_sm_p0n0.py -v 2>&1 | tee "$RUNNER_TEMP/sm-p0n0/physical-intake-consumer.log"
      - name: Independent negative audit and machine-readable no-prediction checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-p0n0/negative-auditor.log"
          import json,sys,tempfile
          from dataclasses import replace
          from fractions import Fraction
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'research/standard-model/tools'))
          from sm_p0n0 import *
          ledger=Path('research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json')
          data=json.loads(ledger.read_text())
          def fail(fn,err):
              try:fn()
              except err:pass
              else:raise AssertionError('negative control did not reject bad input')
          fail(lambda: MassSquaredSpectrum(Fraction(-1),Fraction(1),Fraction(2),Ordering.NORMAL),ValueError)
          fail(lambda: MassSquaredSpectrum(Fraction(0),Fraction(1),Fraction(2),Ordering.NORMAL,'eV'),ValueError)
          fail(lambda: MassSquaredSpectrum(Fraction(0),Fraction(1),Fraction(2),Ordering.INVERTED),ValueError)
          fail(lambda: MassSquaredSpectrum(0.0,Fraction(1),Fraction(2),Ordering.NORMAL),TypeError)
          fail(lambda: CandidateIntake('BFSS',CandidateStatus.MISSING_PHYSICAL_MAP,Fraction(1),True),ValueError)
          fail(lambda: CandidateIntake('BFSS','PREDICTED',None,False),TypeError)
          fail(lambda: MassSquaredSpectrum(Fraction(0),Fraction(1),Fraction(2),Ordering.NORMAL).shifted(Fraction(-1)),ValueError)
          m=load_frozen_first_juno(ledger)
          assert m.value==Fraction(3,40000) and m.error_plus==Fraction(3,2500000)
          assert len(candidate_intakes())==4
          assert all(x.model_prediction is None for x in candidate_intakes())
          print('SM_P0N0_7_ADVERSARIAL_REJECTIONS_ZERO_UNQUALIFIED_PREDICTIONS_PASS')
          
          PY
          python3 - <<'PY'
          import json,sys,os
          from pathlib import Path
          sys.path.insert(0,'research/standard-model/tools')
          from sm_p0n0 import intake_checkpoint
          checkpoint=intake_checkpoint(Path('research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json'))
          target=Path(os.environ['RUNNER_TEMP'])/'sm-p0n0'/'physical-intake-checkpoint.json'
          target.write_text(json.dumps(checkpoint,sort_keys=True,indent=2)+'\n')
          print('SM_P0N0_FROZEN_JUNO_CHECKPOINT_GENERATED_NO_MODEL_PREDICTIONS')
          PY
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-p0n0/completion-auditor.log"
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sm-p0n0'
          checks={'scc0-regression.log':24,'scc3b1-regression.log':15,'physical-intake-consumer.log':20}
          for path,n in checks.items():
              log=(root/path).read_text()
              assert f'Ran {n} tests' in log and 'OK' in log
              assert not re.search(r'(?m)^FAILED|^ERROR|^Traceback ',log),path
              assert len(re.findall(r'(?m)^test_',log))==n,(path,len(re.findall(r'(?m)^test_',log)))
          assert 'SM_P0N0_7_ADVERSARIAL_REJECTIONS_ZERO_UNQUALIFIED_PREDICTIONS_PASS' in (root/'negative-auditor.log').read_text()
          chk=json.loads((root/'physical-intake-checkpoint.json').read_text())
          assert chk['model_prediction_count']==0
          assert chk['measurement']['role']=='EMPIRICAL_MEASUREMENT_NOT_MODEL_PREDICTION'
          assert chk['measurement']['unit']=='eV^2'
          assert chk['measurement']['likelihood_status']=='NOT_PRESENT_IN_FROZEN_LEDGER'
          assert chk['measurement']['covariance_status']=='NOT_PRESENT_IN_FROZEN_LEDGER'
          assert chk['physical_SM_D1']=='PROSPECTIVE_UNSTAGED'
          assert chk['candidate_statuses']['BFSS']=='MISSING_PHYSICAL_MAP'
          assert chk['candidate_statuses']['NFC-protected-persistence']=='MISSING_PHYSICAL_MAP'
          print('SM_P0N0_24_SCC0_15_SCC3B1_20_INDEPENDENT_7_NEGATIVE_ZERO_MODEL_PREDICTION_STRICT_GREEN')
          
          PY
      - name: Preserve original native evidence for independent archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm-p0n0-original-juno-physical-intake-source-consumer
          path: /home/runner/work/_temp/sm-p0n0/
          retention-days: 14
          if-no-files-found: warn
