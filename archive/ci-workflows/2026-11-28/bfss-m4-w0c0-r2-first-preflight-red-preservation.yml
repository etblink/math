name: BFSS W0C0 R2 first setup-only RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c0-r2-first-preflight-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-r2-setup-red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout frozen original R2 attempt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Inspect original R2 attempt and archived R1 source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean)" = 96d3b63d08413f880d1adf0cef8b8e291f7b9453
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean)" = fe9136065179d706c60871ae16e02b8f60e1b189
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c0-r2-original-fock-scalar-trace-strict.yml)" = 3bf1f0dbb2cdcdcb4b28cbfa8c0eb6950764721c
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip)" = 54f84642bc280e61ce9fe59b77bfd9caf7bc7c61
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"])==("P3-M4-W0C0","R2","PENDING_STRICT_CI")
          assert a["qualification"] is False and q["gate"]=="P3-M4-W0B2B" and q["run_id"]==44180157170
          assert Path(a["prospective_receipt"]).is_file()
          PY
      - name: Download and rehash original R2 preflight-only RED artifact and complete job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          run=44190799433;job=134419344964;artifact=14376991147
          tested="5e988a4ebe038ee568065a358ee3c6d870f5e2e7"
          digest="a0c3aee58d3761ae4d79c3fbcad3119a0aeef9a48ba4e1bbd7f3d1e8bc339f24"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f:return json.load(f)
          info=getjson(f"{prefix}/actions/runs/{run}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert info["status"]=="completed" and info["conclusion"]=="failure" and info["head_sha"]==tested
          assert meta["size_in_bytes"]==754 and meta["digest"]=="sha256:"+digest and meta["workflow_run"]["id"]==run
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try: res=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  with urllib.request.urlopen(e.headers["Location"],timeout=90) as f:return f.read()
              else:
                  with res:return res.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==754 and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert names=={"preflight.log","tested-commit.txt"},names
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_QIT_SCC_W0C0_R2_ORIGINAL_FOCK_SCALAR_TRACE_PRE_GATE_2026_11_17.md" in z.read("preflight.log").decode()
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert b"could not open" in full and b"BFSS_QIT_SCC_W0C0_R2_ORIGINAL_FOCK_SCALAR_TRACE_PRE_GATE_2026_11_17.md" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/"BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip"
          log=root/"BFSS_W0C0_R2_44190799433_complete_job.log"
          manifest=root/"BFSS_W0C0_R2_44190799433_PREFLIGHT_RED_evidence_manifest.json"
          for p in (archive,log,manifest):assert not p.exists()
          archive.write_bytes(raw);log.write_bytes(full)
          m={"gate":"P3-M4-W0C0","attempt":"R2","status":"PREFLIGHT_RED_UNQUALIFIED",
             "run_id":run,"job_id":job,"artifact_id":artifact,"tested_sha":tested,
             "original_zip":{"path":str(archive),"size":754,"sha256":digest,"members":members},
             "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
             "source_blob":"96d3b63d08413f880d1adf0cef8b8e291f7b9453",
             "consumer_blob":"fe9136065179d706c60871ae16e02b8f60e1b189",
             "workflow_blob":"3bf1f0dbb2cdcdcb4b28cbfa8c0eb6950764721c",
             "failure_phase":"PRE_LEAN_PIN_PATH_MISMATCH","native_theorems_executed":0,
             "failure_reason":"R1-to-R2 rename retained an incorrect frozen contract pin filename, before Lean restoration or compilation."}
          manifest.write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0C0_R2_FIRST_SETUP_RED_PROVIDER_ZIP_FULL_LOG_AND_CRC_SHA_REHASH_PASS")
          PY
      - name: Git-pin original setup-only RED ZIP job log and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C0_R2_44190799433_complete_job.log research/quantum-information/diagnostics/BFSS_W0C0_R2_44190799433_PREFLIGHT_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C0 R2: preserve setup-only wrong-contract-pin RED with original full evidence"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
