name: BFSS W0A0 original R1 RED R2 GREEN artifact Git pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0a0-r1-r2-evidence-pinning.yml

permissions:
  actions: read
  contents: write

jobs:
  pin-original-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact unified branch for bounded evidence-only commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify immutable BFSS mathematical source and consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean)" = "175cd63e2ef031818b61a51b73eb59782fe38add"
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean)" = "c58f6d3e49bbcb4b7d2c88a08f57f7e07b61ce63"
          python3 - <<'PY'
          import json
          s=json.load(open("BFSS_GATE_STATE.json"))
          assert s["active"]["gate"]=="P3-M4-W0A0" and s["active"]["attempt"]=="R2"
          assert s["active"]["status"]=="PENDING_STRICT_CI" and not s["active"]["qualification"]
          assert s["last_qualified"]["run_id"]==44024718712
          PY
      - name: Independently fetch, rehash, audit, and retain original provider R1/R2 ZIP bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,zipfile,io,re
          from pathlib import Path
          base="https://api.github.com/repos/etblink/math/actions/artifacts/"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          targets=[
            dict(artifact=14307206335,run=44033364617,sha="d4f6c7a090ffba44ba7f091c831e568aba154c26",
              length=13299,digest="e805e4eb1515a045031768794d1cb74786b3c64c0caff708f16fac80db45b58b",
              name="BFSS_M4_W0A0_R1_44033364617_evidence.zip",green=False),
            dict(artifact=14309387668,run=44039594189,sha="5d8703c8beb932dd3745302d5712bc2970c672ba",
              length=13705,digest="b54da01cabbe477a91379d21fe447761419cc85a48755b9450e45f5b328d7d97",
              name="BFSS_M4_W0A0_R2_44039594189_evidence.zip",green=True)
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          for t in targets:
              url=base+str(t["artifact"])
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r: meta=json.load(r)
              assert meta["id"]==t["artifact"] and meta["size_in_bytes"]==t["length"]
              assert meta["digest"]=="sha256:"+t["digest"]
              assert meta["workflow_run"]["id"]==t["run"] and meta["workflow_run"]["head_sha"]==t["sha"]
              try:
                  r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+"/zip",headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as resp: raw=resp.read()
              else:
                  with r: raw=r.read()
              assert len(raw)==t["length"] and hashlib.sha256(raw).hexdigest()==t["digest"]
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
                  expected=({"cold-source.log","preflight.log","tested-commit.txt","source-axioms.log","consumer.log","auditor.log"}
                            if t["green"] else {"cold-source.log","preflight.log","tested-commit.txt"})
                  assert set(z.namelist())==expected
                  assert z.read("tested-commit.txt").decode().strip()==t["sha"]
                  assert "BFSS_W0A0_ALL_48_LABELS_AND_QUALIFIED_DONORS_PREFLIGHT_PASS" in z.read("preflight.log").decode()
                  cold=z.read("cold-source.log").decode()
                  if t["green"]:
                      assert "Build completed successfully (9124 jobs)." in cold
                      assert "error:" not in cold and "sorryAx" not in cold
                      expected_roots={
                        "source-axioms.log":"originalComplexEquiv_allLabelAxis_eq_activeGamma",
                        "consumer.log":"originalComplexEquiv_allLabelAxis_consumer"
                      }
                      allowed={"propext","Classical.choice","Quot.sound"}
                      pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
                      for fname,root in expected_roots.items():
                          txt=z.read(fname).decode()
                          assert "error:" not in txt and "sorryAx" not in txt
                          found=pat.findall(txt)
                          assert len(found)==1 and found[0][0].split(".")[-1]==root,(fname,found)
                          assert {a.strip() for a in found[0][1].split(",") if a.strip()}<=allowed
                      assert "BFSS_W0A0_ORIGINAL_ALL_48_LABELS_1_SOURCE_1_CONSUMER_2_CONTROLS_STRICT_GREEN" in z.read("auditor.log").decode()
                  else:
                      assert "P3M4W0A0OriginalSourceAxisWitness.lean:38:18" in cold
                      assert "sorryAx" in cold
              dest="research/quantum-information/diagnostics/"+t["name"]
              out=Path(dest)
              assert not out.exists(),dest
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(raw)
              print("BFSS_W0A0_PROVIDER_ORIGINAL_ZIP_PIN_READY",t["run"],t["digest"],dest)
          PY
      - name: Commit ONLY the two verified original ZIPs on the unified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0A0_R1_44033364617_evidence.zip research/quantum-information/diagnostics/BFSS_M4_W0A0_R2_44039594189_evidence.zip
          actual="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            research/quantum-information/diagnostics/BFSS_M4_W0A0_R1_44033364617_evidence.zip \
            research/quantum-information/diagnostics/BFSS_M4_W0A0_R2_44039594189_evidence.zip)"
          test "$actual" = "$expected"
          git commit -m "BFSS W0A0: preserve exact provider-original RED and GREEN ZIPs"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
