name: BFSS W0C2B2 D0 R1 original cold-build timeout preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-d0-r1-timeout-evidence-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  original-d0-timeout-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact original D0 and frozen B2 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact D0 source consumer workflow and stopped B2 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D0OriginalFockCommutatorAddHom.lean)" = 5f511b8d3a6851441d316d986ef6152a5139721f
          test "$(git rev-parse HEAD:lean/diagnostics/OriginalW0C2B2D0CommutatorAddHomIndependentConsumer.lean)" = 3b905f827309a93444b0936e1ba553f0c281c46d
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-d0-original-fock-ad-hom-diagnostic.yml)" = 3ace38e8cf0c3c10b653f7cbb031abea9cec0a09
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R1_44274131658_NATIVE_RED_evidence.zip)" = 12b5843b116bae63e2183049cae572cb1fcc051b
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R2_44280267807_NATIVE_RED_evidence.zip)" = b668e91fa897136c5144ef535cb0fef035e9c216
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          root=Path('research/quantum-information/diagnostics')
          for name in ('BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip',
                       'BFSS_W0C2B2_D0_R1_44330552342_complete_job.log',
                       'BFSS_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence_manifest.json'):
              assert not (root/name).exists(),name
          print('BFSS_W0C2B2_D0_R1_COLD_DEPENDENCY_TIMEOUT_PRESERVATION_PREFLIGHT_PASS')
          PY
      - name: Independently inspect exact timeout artifact and complete original Actions job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44330552342;job=134893488336;artifact=14441212043
          tested='b3477dbba5a64b9ac61a3d1621b49b607107b6f6'
          size=18821;digest='cb089a42d1c9d63d92dfdeba00660f9266a02fb7aa338323ad31d50edeeb891b'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return json.load(response)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='failure' and r['run_attempt']==1
          assert j['id']==job and j['run_id']==run and j['conclusion']=='failure'
          for step in ('Checkout exact unified','Guard 27 anchors','Restore pinned Lean'):
              assert any(s['name'].startswith(step) and s['conclusion']=='success' for s in j['steps']),step
          assert any(s['name'].startswith('Cold original Fock additive') and s['conclusion']=='failure' for s in j['steps'])
          assert any(s['name'].startswith('Upload original D0 diagnostic') and s['conclusion']=='success' for s in j['steps'])
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={'preflight.log','tested-commit.txt','cold-source.log'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B2_D0_27_ANCHORS_TWO_REDS_STOPPED_DIAGNOSTIC_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert '[9234/9240]' in cold
              assert 'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.T1OriginalFockTraceInvariance' in cold
              assert 'Build completed successfully' not in cold
              assert 'ProbeW0C2B2D0OriginalFockCommutatorAddHom' not in cold
              assert not any(s in cold for s in ('error:','sorryAx','maximum recursion depth has been reached','(kernel) deterministic timeout'))
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>150000
          assert b'Process completed with exit code 124' in full and b'[9234/9240]' in full
          assert b'Artifact ID 14441212043' in full
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip'
          log=root/'BFSS_W0C2B2_D0_R1_44330552342_complete_job.log'
          manifest=root/'BFSS_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
            'gate':'P3-M4-W0C2B2-D0','attempt':'R1','status':'COLD_BUILD_DEPENDENCY_TIMEOUT_UNQUALIFIED',
            'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
            'original_zip':{'path':str(arc),'size':size,'sha256':digest,'members':members},
            'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
            'source_blob':'5f511b8d3a6851441d316d986ef6152a5139721f',
            'consumer_blob':'3b905f827309a93444b0936e1ba553f0c281c46d',
            'workflow_blob':'3ace38e8cf0c3c10b653f7cbb031abea9cec0a09',
            'failure_phase':'COLD_DEPENDENCY_BUILD_TIMEOUT_1000S',
            'first_causal_error':'Process exit code 124 after 1000-second lake build, last progress 9234/9240, no source Lean error',
            'source_axiom_reports_completed':0,'consumer_executed':False,
            'count_as_comparable_native_proof_red':False,
            'predecessor_accepted_anchor_count':27,'predecessor_qualified_run':44267283653,
            'B2_canonical_status':'BLOCKED',
            'claim_ceiling':'D0 algebraic bridge not yet tested to completion; B2 original centrality and K bracket not qualified'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B2_D0_ORIGINAL_TIMEOUT_ZIP_JOBLOG_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin original timeout ZIP complete log and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R1_44330552342_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS W0C2B2 D0 R1: preserve original cold dependency timeout'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
