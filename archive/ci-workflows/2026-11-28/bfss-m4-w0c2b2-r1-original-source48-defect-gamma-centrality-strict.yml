name: BFSS M4 W0C2B2 R1 original Source48 K Lie-defect gamma centrality strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality.lean
      - lean/diagnostics/BFSSP3M4W0C2B2OriginalSource48KLieDefectGammaCentralityIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0c2b2-r1-original-source48-defect-gamma-centrality-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-m4-w0c2b2-r1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source48-lie-defect-centrality:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original unified BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight 27 accepted original donor anchors and frozen negative evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0c2b2-r1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0c2b2-r1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0c2b2-r1/preflight.log"
          import json,re,subprocess,hashlib,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality.lean":"aae0746f002b1c74bf7712c59d7b5abfe4c8019a","lean/diagnostics/BFSSP3M4W0C2B2OriginalSource48KLieDefectGammaCentralityIndependentConsumer.lean":"69f06d3c451f9a2ca09ff49fb1c752ad49033544","research/quantum-information/BFSS_QIT_SCC_W0C2B2_R1_ORIGINAL_SOURCE48_DEFECT_GAMMA_CENTRALITY_PRE_GATE_2026_11_18.md":"e91fa59fee108f0d846a1dbf8c61e4759e46edea","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean":"861628fe6322c919bee87e493e1e629d48bfa8bb","lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumerR2.lean":"bd271b47833e2cca9fb80f1d6fca381c8b6a2ccb",".github/workflows/bfss-m4-w0c2b1-r2-original-fock-jacobi-covariance-strict.yml":"88c98717600cb561860e3b962e0ce830270afada","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0NOriginalSource48RealComplexCoefficientAdapter.lean":"c5841055363a6eef713f35e568409dd2fa2b6c9e","lean/diagnostics/BFSSP3M4W0C2B0NOriginalSource48RealComplexCoefficientIndependentConsumer.lean":"3773f069d3da87c7c899596817f02efec639fbfa",".github/workflows/bfss-m4-w0c2b0n-r1-original-source48-real-complex-strict.yml":"d431d74251ba5826baf312534fd6578424306643","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean":"b98cc05a012c98da8016496492d77135fc58ebc8","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean":"51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","research/quantum-information/diagnostics/BFSS_M4_W0C2B1_R2_44267283653_GREEN_evidence.zip":"b79401089d48f219ec329d8b98690d9022cd4e7b","research/quantum-information/diagnostics/BFSS_W0C2B1_R2_44267283653_complete_job.log":"03e208ff823cdca8f881f879621dc338496334f9","research/quantum-information/diagnostics/BFSS_W0C2B1_R2_44267283653_GREEN_evidence_manifest.json":"dd64bcd5177d86d5f5d672a3ab4b8aa3f0a07357","research/quantum-information/diagnostics/BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip":"98b23994b080a087d77d8317a4758a774f0f1ef2","research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_complete_job.log":"5e96a9c57152a876ae5e772fcca7a462aa91ac1c","research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_NATIVE_RED_evidence_manifest.json":"fcc701f35202253b973c6dc1e48fe2e199554d76","research/quantum-information/diagnostics/BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip":"3e57a0e7205dc6f34c6f3da90ff3056fa63943ea","research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip":"547432c9bf3fb0778d6bc060daa6f9a6e9afc004","research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip":"4117bd19a0a8d1614df176e72d69a9b628de19da","research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip":"3f15c1c8bcf0e057e3de2055abc6ec00e8b931ec"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,got,expected)
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R1','PENDING_STRICT_CI',False)
          assert (q['gate'],q['attempt'],q['status'],q['qualification'],q['run_id'])==('P3-M4-W0C2B1','R2','GREEN_QUALIFIED',True,44267283653)
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert q['tested_sha']=='df89d1f32ddbdb830cfc697007daac90564c0cfc'
          assert q['preservation_run']==44269104447
          assert q['artifact_sha256']=='3273d69f082a57bd6d6bfa83df7536ae118e9eb35963452565dd5a359d69a340'
          for key in ('source','consumer','workflow','evidence_archive','evidence_job_log','evidence_manifest'):
              assert pins[q[key]]==q[key+'_blob'],key
          assert a['source']=='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality.lean' and pins[a['source']]==a['source_blob']
          assert a['consumer']=='lean/diagnostics/BFSSP3M4W0C2B2OriginalSource48KLieDefectGammaCentralityIndependentConsumer.lean' and pins[a['consumer']]==a['consumer_blob']
          assert a['workflow']=='.github/workflows/bfss-m4-w0c2b2-r1-original-source48-defect-gamma-centrality-strict.yml'
          assert a['prospective_receipt']=='research/quantum-information/BFSS_QIT_SCC_W0C2B2_R1_ORIGINAL_SOURCE48_DEFECT_GAMMA_CENTRALITY_PRE_GATE_2026_11_18.md'
          assert a['contract_commit']=='32897cf15193202689fd19c6cb6ac18116dbab4e'
          assert a['accepted_predecessor_run']==44267283653
          assert a['expected_source_reports']==a['expected_consumer_reports']==4
          assert a['independent_controls']==4
          assert a['allowed_axioms']==['propext','Classical.choice','Quot.sound']
          assert s['previous_active_W0C2B1_R1_NATIVE_RED']['run_id']==44263755514
          assert s['previous_active_W0C2B1_R1_NATIVE_RED']['preservation_run']==44266245618
          assert s['previous_active_W0C2B1_R1_NATIVE_RED']['native_red_count']==1
          assert s['previous_active_W0C2B0_R2_stopped']['native_red_count']==2
          assert s['previous_active_W0C2B0_R2_stopped']['status']=='BLOCKED'
          assert s['next_planned']['gate']=='P3-M4-W0C2B3'
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          assert s['strategic_focus']['full_bivector_bracket_qualified'] is False
          src=Path(a['source']).read_text()
          con=Path(a['consumer']).read_text()
          roots=["originalSource48K_skew_complex_gamma_covariance","originalSource48K_skew_bracket_complex_gamma_covariance","originalSource48K_lieDefect_gamma_commutator_zero","originalSource48K_lieDefect_gamma_central"]
          assert len(re.findall(r'(?m)^theorem\b',src))==4
          assert len(re.findall(r'(?m)^theorem\b',con))==4
          assert len(re.findall(r'(?m)^example\b',con))==4
          assert re.findall(r'(?m)^#print axioms (\S+)$',src)==roots
          assert re.findall(r'(?m)^#print axioms (\S+)$',con)==[name+'_consumer' for name in roots]
          assert len(re.findall(r'(?m)^import ',src))==4
          assert len(re.findall(r'(?m)^import ',con))==1
          assert con.startswith('import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality\n')
          for data in (src,con):
              assert 'set_option autoImplicit false' in data
              assert 'Fermion 2 →L[ℂ] Fermion 2' in data
              assert 'Source48Label' in data and 'sourceNormalizedGamma' in data
              for banned in ('maxRecDepth','maxHeartbeats','P3M4QTC1OriginalSourceRealComplexQuarterBridge','P3M4CT1G0OriginalFockJacobiSource48Adapter'):
                  assert banned not in data,banned
              assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',data)
          for token in ('originalSource48BivectorK_skew_commutator_gamma_of_transpose',
              'originalSource48Fock_real_column_to_complex',
              'originalFock_commutator_covariance_bracket',
              'originalSource48_matrix_commutator_skew',
              'originalSource48Fock_real_commutator_column_to_complex',
              'simp only [sub_mul, mul_sub]','abel','sub_eq_zero.mp'):
              assert token in src,token
          assert 'originalSource48K_lieBracket_of_defect_central' not in src
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          manifest=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in manifest['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          for name,sha,size in (
              ('BFSS_M4_W0C2B1_R2_44267283653_GREEN_evidence.zip','3273d69f082a57bd6d6bfa83df7536ae118e9eb35963452565dd5a359d69a340',4160),
              ('BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip','a0b6dfdd17dfdeceed8483f486e9bd98850bb187033fab457fbb1291f261d8ec',3658),
              ('BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip','e68c0260726275649427ee7d4e02c8c954504fd5fd228cd86a7f9a58e0f12761',3975),
              ('BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip','fb4cfc3b3b098941576ebdb42650ae0e2abd3dc7996538bf79201ebbc91bf7cd',4080)):
              raw=Path('research/quantum-information/diagnostics',name).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha,name
              with zipfile.ZipFile(Path('research/quantum-information/diagnostics',name)) as z:
                  assert z.testzip() is None,name
          print('BFSS_W0C2B2_R1_ORIGINAL_SOURCE48_DEFECT_CENTRALITY_27_ACCEPTED_ANCHORS_PREFLIGHT_PASS')
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original Source48 K defect centrality source consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0c2b2-r1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0C2B2OriginalSource48KLieDefectGammaCentralityIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'bfss-m4-w0c2b2-r1'
          allowed={'propext','Classical.choice','Quot.sound'}
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          permitted_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,names):
              assert 'sorryAx' not in log and 'error:' not in log
              warnings=[line for line in log.splitlines() if 'warning:' in line and not permitted_warning.fullmatch(line)]
              assert not warnings,warnings[:3]
              found=pattern.findall(log)
              assert len(found)==len(names),(found,names)
              assert [n.rsplit('.',1)[-1] for n,_ in found]==names
              assert len(set(n for n,_ in found))==len(names)
              for _,axioms in found:
                  assert {i.strip() for i in axioms.split(',') if i.strip()}<=allowed,axioms
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.c' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.d' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,['a','b','c','d'])
          mutants=[
            good.replace('Quot.sound','sorryAx',1),
            good.replace('Quot.sound','Unknown.axiom',1),
            good+good,'',
            good+'warning: unaccepted warning\n',
            good+'error: unsolved goals\n'
          ]
          for i,bad in enumerate(mutants):
              try:audit(bad,['a','b','c','d'])
              except AssertionError:pass
              else:raise AssertionError(('negative mutation accepted',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'error:' not in cold and 'sorryAx' not in cold
          roots=["originalSource48K_skew_complex_gamma_covariance","originalSource48K_skew_bracket_complex_gamma_covariance","originalSource48K_lieDefect_gamma_commutator_zero","originalSource48K_lieDefect_gamma_central"]
          audit((root/'source-axioms.log').read_text(),roots)
          audit((root/'consumer.log').read_text(),[name+'_consumer' for name in roots])
          print('BFSS_W0C2B2_R1_ORIGINAL_SOURCE48_DEFECT_GAMMA_CENTRALITY_4_SOURCE_4_CONSUMER_4_CONTROLS_SIX_MUTANTS_STRICT_GREEN')
          PY
      - name: Preserve original Source48 gamma centrality proof and RED/GREEN diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0c2b2-r1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0c2b2-r1/
          if-no-files-found: warn
          retention-days: 14
