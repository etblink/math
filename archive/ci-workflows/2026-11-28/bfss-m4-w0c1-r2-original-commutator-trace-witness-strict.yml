name: BFSS M4 W0C1 R2 original Majorana commutator trace witness strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean
      - lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean
      - .github/workflows/bfss-m4-w0c1-r2-original-commutator-trace-witness-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0c1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fock-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight qualified W0B2B and W0C0 original providers and W0C1 frozen contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0c1-r2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0c1-r2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0c1-r2/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"research/quantum-information/BFSS_QIT_SCC_W0C1_R1_ORIGINAL_COMMUTATOR_TRACE_WITNESS_PRE_GATE_2026_11_17.md":"800b6defbf23ef4dfcba3d5e345d186aff3c3208","research/quantum-information/BFSS_QIT_SCC_W0C1_R1_SOURCE48_SCOPE_PRE_STAGE_ADDENDUM_2026_11_17.md":"1fe248e35d18fafbee557a78f79bf1fee3dd5e42","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2BOriginalSchurScalarCommutant.lean":"6d5fbe98aa8d660c9b7c680efefde02501d8e253","lean/diagnostics/BFSSP3M4W0B2BOriginalSchurScalarIndependentConsumer.lean":"68e1fe906d2d498f01baf56db7879c2697596c1c",".github/workflows/bfss-m4-w0b2b-r1-original-schur-scalar-strict.yml":"ce8fd612a8c23ffe5fc86aa61fdc480c3a2e8f8f","research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip":"f8133dba86db582f5d302885c7c134b3e2ff043a","research/quantum-information/diagnostics/BFSS_W0B2B_R1_44180157170_complete_job.log":"76e06a033b2e3dacc6dbf9ae7c7c6280b1d4a07b","research/quantum-information/diagnostics/BFSS_W0B2B_R1_44180157170_GREEN_evidence_manifest.json":"8770fa58b313985267fb710abb58fd3a282d7712","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean":"96d3b63d08413f880d1adf0cef8b8e291f7b9453","lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean":"fe9136065179d706c60871ae16e02b8f60e1b189",".github/workflows/bfss-m4-w0c0-r2-original-fock-scalar-trace-strict.yml":"b36fb1ae5b76a3b611292ac9ac4c11ca59509bde","research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip":"4992a5444441022a998afc26324551a273b747c9","research/quantum-information/diagnostics/BFSS_W0C0_R2_44192981282_complete_job.log":"d269402e6bb231c58f49eacc68a76c50ffe1aa5d","research/quantum-information/diagnostics/BFSS_W0C0_R2_44192981282_GREEN_evidence_manifest.json":"0243686ca56af184824568a38c3a646141c19a1d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/T1OriginalFockTraceInvariance.lean":"3be6c9a6f2898484df66690f94fdfa1877660897","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum.lean":"a16d3573b737bb4453e42b0b543d63cbbac1cd1b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4BFermionLinearTransportProbe.lean":"e55fcbb58ce4d3776bddefdd6d11ad83560bb75c","research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip":"54f84642bc280e61ce9fe59b77bfd9caf7bc7c61","research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip":"56e470ba2dbea58c9a05cdfcea91f64e06b568e8","research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44191695033_PREFLIGHT_SYNTAX_RED_evidence.zip":"5655f0d212cc75319ad45d8f8ec1a0fb143c8dba","research/quantum-information/diagnostics/BFSS_W0C0_R2_44196763215_PRESERVATION_RED_complete_job.log":"f13d4be76d3df0de02efeee9ca0ef23a6afda30e","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean":"5fafaa3d73d3761719ea160466b40d94b85d74db","lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean":"85e8067c892bc52533f6a3ecc1f099010efac4ae","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitness.lean":"bdcef8cd83feda4fda905092649c7411a2456f9e","lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumer.lean":"9563e06c058771fec4be3b322be48799f38be231",".github/workflows/bfss-m4-w0c1-r1-original-commutator-trace-witness-strict.yml":"61341d74095497e43f69c05234f129c21868ed65","research/quantum-information/BFSS_QIT_SCC_W0C1_R2_ORIGINAL_ZERO_SMUL_PROOF_REPAIR_PRE_GATE_2026_11_17.md":"7d585894a12e92b4295f5e3ed99bda0131176aa9","research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip":"b9c846a1ef7abdecc8d5e627c5a9921a903bbf14","research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_complete_job.log":"f60230b28a2f3bf76711ad81dc6e25d4f66a9f0d","research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_NATIVE_RED_evidence_manifest.json":"e2a4c11096067471c6a8a2ebb7e2160d66e21b9f"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean").read_text()
          cons=Path("lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean").read_text()
          assert len(re.findall(r"(?m)^theorem\b",src))==2
          assert len(re.findall(r"(?m)^theorem\b",cons))==2
          assert len(re.findall(r"(?m)^example\b",cons))==3
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==[
              "originalFockWitness_kernel_zero",
              "originalFockWitnessSignature_injective"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",cons)==[
              "originalFockWitness_kernel_zero_consumer",
              "originalFockWitnessSignature_injective_consumer"]
          assert len(re.findall(r"(?m)^import ",src))==3
          assert cons.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C1OriginalCommutatorTraceWitnessR2\n")
          assert len(re.findall(r"(?m)^import ",cons))==1
          for name in ("originalFockClifford_scalar_operator_unique",
                       "originalFockTrace_scalar_one_eq_zero_iff",
                       "originalFockTrace","Source48Label","sourceNormalizedGamma",
                       "sub_mul","mul_sub","map_sub","abel"):
              assert name in src,name
          assert "noncomputable def originalFockWitnessSignature" in src
          for body in (src,cons):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
              assert "CliffordAlgebra.induction" not in body
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C1","R2","PENDING_STRICT_CI",False)
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean"]
          assert a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean"]
          assert a["contract_commit"]=="1b1b10b4cfdcf62716822ba1244ab2c469d33af2"
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==2
          assert a["independent_controls"]==3
          assert a["accepted_predecessor_run"]==44192981282
          assert (q["gate"],q["attempt"],q["run_id"],q["status"])==("P3-M4-W0C0","R2",44192981282,"GREEN_QUALIFIED")
          assert q["qualification"] is True and s["accepted_anchors"][-1]==q
          assert q["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean"]
          assert q["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip"]
          assert q["preservation_run"]==44197140876
          b=next(x for x in s["accepted_anchors"] if x["gate"]=="P3-M4-W0B2B")
          assert b["run_id"]==44180157170 and b["status"]=="GREEN_QUALIFIED"
          assert b["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2BOriginalSchurScalarCommutant.lean"]
          assert b["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip"]
          assert s["previous_active_W0C1_R1_RED"]["run_id"]==44204390734
          assert s["previous_active_W0C1_R1_RED"]["status"]=="NATIVE_SOURCE_RED_UNQUALIFIED"
          assert s["previous_active_W0C1_R1_RED"]["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitness.lean"]
          assert s["previous_active_W0C1_R1_RED"]["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumer.lean"]
          assert s["previous_active_W0C1_R1_RED"]["workflow_blob"]==pins[".github/workflows/bfss-m4-w0c1-r1-original-commutator-trace-witness-strict.yml"]
          assert s["previous_active_W0C1_R1_RED"]["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip"]
          assert s["previous_active_W0C1_R1_RED"]["evidence_job_log_blob"]==pins["research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_complete_job.log"]
          assert s["previous_active_W0C1_R1_RED"]["evidence_manifest_blob"]==pins["research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_NATIVE_RED_evidence_manifest.json"]
          assert a["previous_red_run"]==44204390734 and a["previous_red_preservation_run"]==44207291646
          assert "exact zero_smul ℂ (1 : Op)" in src and "by simp [hz0]" not in src
          original=Path("research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip")
          assert original.stat().st_size==19367
          assert hashlib.sha256(original.read_bytes()).hexdigest()=="006cbbca5679d7891d800851aabe160df014ab0f089500f059ef1999f688d884"
          with zipfile.ZipFile(original) as z:
              assert z.testzip() is None and set(z.namelist())=={"preflight.log","cold-source.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()=="38898e1198d5f0d1ad7f10b43e9e58830e007d19"
              assert "unsolved goals" in z.read("cold-source.log").decode()
              assert "⊢ 0 • 1 = 0" in z.read("cold-source.log").decode()
          assert "unsolved goals" in Path("research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_complete_job.log").read_text()
          assert s["previous_active_W0C0_R1_RED"]["run_id"]==44184526501
          assert s["w0c0_r2_first_preflight_red"]["run_id"]==44190799433
          assert s["w0c0_r2_second_preflight_red"]["run_id"]==44191695033
          assert s["next_planned"]["gate"]=="P3-M4-W0C2" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert Path(a["prospective_receipt"]).is_file()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          originals=[
              ("research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip",14293,
                "90049da54aee06c9cc649b1577059f10c440c037de3689e25b5da9314b7623a6",
                "e5b93b53ba9917374e39b79dac4e808f44ad615c",
                "Build completed successfully (9134 jobs)."),
              ("research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip",19089,
                "37cd7da40243fff8833524789de91314a5bf21bf273a086f96cb81669679c8e1",
                "d193649342bb543faa91bf559db0b953c6ec2dcd",
                "Build completed successfully (9218 jobs).")]
          for path,size,digest,tested,cold in originals:
              raw=Path(path).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  assert set(z.namelist())=={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
                  assert z.read("tested-commit.txt").decode().strip()==tested
                  assert cold in z.read("cold-source.log").decode()
          print("BFSS_W0C1_R2_W0B2B_W0C0_ORIGINAL_SOURCE_EXACT_GREEN_AND_REDS_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original witness kernel, injectivity, consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0c1-r2"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C1OriginalCommutatorTraceWitnessR2 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0c1-r2"
          allowed={"propext","Classical.choice","Quot.sound"}
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              warnings=[line for line in log.splitlines() if "warning:" in line and not warning_ok.fullmatch(line)]
              assert not warnings,warnings[:3]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert names==expected and len(set(names))==len(names),names
              for _,axioms in found:
                  assert {x.strip() for x in axioms.split(",") if x.strip()}<=allowed,axioms
          good="'N.one' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.two' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["one","two"])
          bads=[good.replace("Quot.sound","sorryAx",1),good.replace("Quot.sound","Foreign.axiom",1),good+good,"",good+"warning: unexpected warning\n",good+"error: failed proof\n"]
          for k,bad in enumerate(bads):
              try: audit(bad,["one","two"])
              except AssertionError: pass
              else: raise AssertionError(("negative mutation accepted",k))
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),[
              "originalFockWitness_kernel_zero",
              "originalFockWitnessSignature_injective"])
          audit((root/"consumer.log").read_text(),[
              "originalFockWitness_kernel_zero_consumer",
              "originalFockWitnessSignature_injective_consumer"])
          print("BFSS_W0C1_R2_ORIGINAL_FOCK_WITNESS_2_SOURCE_2_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN")
          PY
      - name: Preserve exact original proof and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0c1-r2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0c1-r2/
          if-no-files-found: warn
          retention-days: 14
