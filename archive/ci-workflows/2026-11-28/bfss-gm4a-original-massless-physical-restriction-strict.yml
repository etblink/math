name: BFSS GM4A source-exact original physical massless operator restriction strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction.lean'
      - 'lean/diagnostics/BFSSGM4AOriginalMasslessPhysicalRestrictionIndependentAudit.lean'
      - '.github/workflows/bfss-gm4a-original-massless-physical-restriction-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm4a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-exact-original-physical-restriction:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen source and independently typed consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm4a-physical"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm4a-physical/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm4a-physical/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm4a-physical/preflight.log"
          import re,json,subprocess
          from pathlib import Path
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean":"84853fb624289121938e0fb4d2b45afdc16a74c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph.lean":"2fc90310c9ac476d8e52ba0176ecc94f8994d1c9",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation.lean":"0c8b10e9bf4d352d34f1de08c092c5188188b7bc",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining.lean":"668085f9530cb5b2cd0aa73fe22c0bd0226cabed",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3BOriginalMasslessGraphGaugeInvariant.lean":"4924bbffbf5d2ff2c989faeab9dba2d553dc8d0b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3COriginalMasslessGraphTwoSidedGaugeInvariance.lean":"83c862bee0398f128b43b8cd30d1136984ab1162",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainD2B8AFixedPointSpaceProbe.lean":"136f461a29d5fe99453da0df081d824c33f6c7cf",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","94c58216116c8a2c1625471af45e8c02e252236a","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM4AOriginalMasslessPhysicalRestrictionIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainD2B8AFixedPointSpaceProbe"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==["originalMasslessMultiplier_output_mem_physical"]
          assert re.findall(r"(?m)^(?:noncomputable )?def (\S+)",s)==[
            "originalPhysicalMasslessDomain",
            "originalPhysicalMasslessDomainLift",
            "originalPhysicalMasslessMultiplier",
            "pairedOriginalPhysicalMasslessDomain",
            "pairedOriginalPhysicalMasslessMultiplier"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalPhysicalMasslessDomain",
            "originalPhysicalMasslessDomainLift",
            "originalMasslessMultiplier_output_mem_physical",
            "originalPhysicalMasslessMultiplier",
            "pairedOriginalPhysicalMasslessDomain",
            "pairedOriginalPhysicalMasslessMultiplier"]
          assert re.findall(r"(?m)^import (\S+)$",t)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction"]
          assert re.findall(r"(?m)^theorem (\S+)",t)==["pairedSourceMasslessMultiplier_output_physical"]
          assert re.findall(r"(?m)^(?:noncomputable )?def (\S+)",t)==["pairedSourcePhysicalMasslessMultiplier"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",t)==[
            "pairedSourcePhysicalMasslessMultiplier",
            "pairedSourceMasslessMultiplier_output_physical"]
          for v in [s,t]:
              assert "set_option autoImplicit false" in v
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",v)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in v
          for token in ["G.physicalSpace","originalMasslessDomain M",
                        "originalMasslessMultiplier M","sourceFullGaugePairCLM_fixed_iff_physical",
                        "originalMasslessMultiplier_gauge_intertwines"]:
              assert token in s,("SOURCE_EXACT_INTERFACE_MISSING",token)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM4A_SOURCE_EXACT_PHYSICAL_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm4a-physical/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Physical restricted multiplier native and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm4a-physical"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM4AOriginalMasslessPhysicalRestrictionIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm4a-physical"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          native=(E/"native-source.log").read_text()
          for name in [
            "FCP.BFSSGM4A.originalPhysicalMasslessDomain",
            "FCP.BFSSGM4A.originalPhysicalMasslessDomainLift",
            "FCP.BFSSGM4A.originalMasslessMultiplier_output_mem_physical",
            "FCP.BFSSGM4A.originalPhysicalMasslessMultiplier",
            "FCP.BFSSGM4A.pairedOriginalPhysicalMasslessDomain",
            "FCP.BFSSGM4A.pairedOriginalPhysicalMasslessMultiplier"]:
              assert "'"+name+"' depends on axioms:" in native or "'"+name+"' does not depend on any axioms" in native,("MISSING_NATIVE_AXIOM_REPORT",name)
          strict=(E/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",strict)
          assert [n for n,_ in reports]==[
            "FCP.BFSSGM4AIndependent.pairedSourcePhysicalMasslessMultiplier",
            "FCP.BFSSGM4AIndependent.pairedSourceMasslessMultiplier_output_physical"],reports
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,raw in reports:
              axioms={x.strip() for x in raw.split(",") if x.strip()}
              assert axioms<=allowed,(name,axioms)
          print("BFSS_GM4A_ORIGINAL_SOURCE_PHYSICAL_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm4a-physical-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm4a-physical/
          if-no-files-found: warn
          retention-days: 30
