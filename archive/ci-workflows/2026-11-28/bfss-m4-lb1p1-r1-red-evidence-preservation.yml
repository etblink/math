name: BFSS P1 R1 original RED artifact preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths: [.github/workflows/bfss-m4-lb1p1-r1-red-evidence-preservation.yml]

permissions:
  actions: read
  contents: read

jobs:
  preserve-original-p1-r1-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Independently rehash and expose original P1 R1 failure ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, hashlib, base64, zipfile, io
          aid=14290412981
          run=43996551474
          tested="c34911208aae4964283b39454ed41d990eb1306e"
          digest="0d873a2259c24bc4ccdbb3be175869ad413504dcd0cd12fe8b25830e557e7420"
          expected_size=3547
          url="https://api.github.com/repos/etblink/math/actions/artifacts/"+str(aid)
          h={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=60) as r:
              metadata=json.load(r)
          assert metadata["id"]==aid and metadata["size_in_bytes"]==expected_size
          assert metadata["workflow_run"]["id"]==run
          assert metadata["workflow_run"]["head_sha"]==tested
          assert metadata["digest"]=="sha256:"+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          try:
              r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+"/zip",headers=h),timeout=60)
          except urllib.error.HTTPError as ex:
              assert ex.code==302
              signed=ex.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=60) as r: raw=r.read()
          else:
              with r: raw=r.read()
          assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"tested-commit.txt","preflight.log","cold-source.log"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_M4_LB1P1_SOURCE_CONSUMER_DONOR_TOOLCHAIN_STOP_RULE_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "P3M4LB1P1OriginalFourMajoranaCommutator.lean:41:6: Unknown identifier" in cold
              assert "P3M4LB1P1OriginalFourMajoranaCommutator.lean:75:5: Unknown identifier" in cold
              assert "sorryAx" in cold and "error: build failed" in cold
              assert "Build completed successfully" not in cold
              entries=[{"name":n,"bytes":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
          print("BFSS_M4_LB1P1_R1_ORIGINAL_RED_ZIP_REHASH_PASS "+json.dumps({
              "artifact_id":aid,"run":run,"tested_sha":tested,"bytes":len(raw),"sha256":digest,
              "entries":entries,"first_error_source_line":41,"phase":"COLD_NATIVE_SOURCE",
              "claim":"RED_UNQUALIFIED"},sort_keys=True))
          print("BFSS_M4_LB1P1_R1_ORIGINAL_RED_ZIP_BASE64 "+base64.b64encode(raw).decode())
          PY
