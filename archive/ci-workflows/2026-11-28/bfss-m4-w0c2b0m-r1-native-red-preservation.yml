name: BFSS W0C2B0M R1 native source RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0m-r1-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout unchanged R1 mathematical source and two prior REDs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify first native complex carrier RED contract and immutable prior archives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficient.lean)" = 19e20ca4138c0303c28e3ab46d4b2fcf3a496bb0
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumer.lean)" = 14f366562c5986f58fd282a09e28720e7ea171b5
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0m-r1-original-complex-nested-strict.yml)" = 90492c571e555267d560aba6c910fef43ae52faf
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip)" = cb5591ab7ae5762150ea1d10dc093788f812d929
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip)" = 4117bd19a0a8d1614df176e72d69a9b628de19da
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip)" = 3f15c1c8bcf0e057e3de2055abc6ec00e8b931ec
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence.zip)" = c1874bd132ee5962454a85c6380e2be204b4596d
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B0M','R1','PENDING_STRICT_CI',False)
          assert q['gate']=='P3-M4-W0C2A' and q['run_id']==44213315719
          assert len(s['accepted_anchors'])==24 and s['accepted_anchors'][-1]==q
          assert s['w0c2b0m_r1_first_preflight_red']['run_id']==44251761371
          assert s['previous_active_W0C2B0_R2_stopped']['native_red_count']==2
          for name in ('BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip','BFSS_W0C2B0M_R1_44252646318_complete_job.log','BFSS_W0C2B0M_R1_44252646318_NATIVE_RED_evidence_manifest.json'):
              assert not (Path('research/quantum-information/diagnostics')/name).exists(),name
          print('BFSS_W0C2B0M_R1_ORIGINAL_NATIVE_SOURCE_RED_PRESERVATION_PREFLIGHT_PASS')
          PY
      - name: Download provider-original artifact and full log, pin SHA, CRC and causal error
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44252646318;job=134626770690;artifact=14404568563
          tested='113b4dbc7850152442b2303be70c82858504848c'
          size=3779
          digest='e9242ef864e6f7bdacb76386f94595b1c67b5eb471f0c485de795bd2970d1529'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f:return json.load(f)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure'
          assert j['id']==job and j['run_id']==run and j['conclusion']=='failure'
          assert any(t['name'].startswith('Preflight original complex carrier') and t['conclusion']=='success' for t in j['steps'])
          assert any(t['name'].startswith('Restore pinned Lean') and t['conclusion']=='success' for t in j['steps'])
          assert any(t['name'].startswith('Cold original complex nested') and t['conclusion']=='failure' for t in j['steps'])
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with r:return r.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={'preflight.log','cold-source.log','tested-commit.txt'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B0M_R1_COMPLEX_ORIGINAL_FOCK_AND_TWO_FROZEN_REDS_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              for phrase in ('OriginalFockComplexNestedCoefficient.lean:47:38: unsolved goals',
                             'OriginalFockComplexNestedCoefficient.lean:59:42: unsolved goals',
                             'This simp argument is unused:','sorryAx','error: build failed'):
                  assert phrase in cold,phrase
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(expected)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>50000 and b'OriginalFockComplexNestedCoefficient.lean:47:38: unsolved goals' in full
          assert b'OriginalFockComplexNestedCoefficient.lean:59:42: unsolved goals' in full
          assert b'Artifact ID 14404568563' in full
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          zip_path=root/'BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip'
          log_path=root/'BFSS_W0C2B0M_R1_44252646318_complete_job.log'
          manifest=root/'BFSS_W0C2B0M_R1_44252646318_NATIVE_RED_evidence_manifest.json'
          for p in (zip_path,log_path,manifest):assert not p.exists(),p
          zip_path.write_bytes(raw);log_path.write_bytes(full)
          manifest.write_text(json.dumps({
              'gate':'P3-M4-W0C2B0M','attempt':'R1','status':'NATIVE_SOURCE_RED_UNQUALIFIED',
              'run_id':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
              'original_zip':{'path':str(zip_path),'size':size,'sha256':digest,'members':members},
              'original_job_log':{'path':str(log_path),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'19e20ca4138c0303c28e3ab46d4b2fcf3a496bb0',
              'consumer_blob':'14f366562c5986f58fd282a09e28720e7ea171b5',
              'workflow_blob':'90492c571e555267d560aba6c910fef43ae52faf',
              'failure_phase':'ORIGINAL_SOURCE_LEAN',
              'source_error_lines':[47,59],'warning_lines':[50,65],
              'first_causal_error':'sum_smul and sub_smul rewrites not applied by simp only; two unsolved scalar module equalities',
              'native_source_executed':True,'consumer_executed':False,
              'native_complex_coefficient_red_count':1,
              'previous_preflight_red':44251761371,
              'separately_stopped_real_coefficient_native_red_count':2,
              'last_qualified_run':44213315719,
              'claim_ceiling':'No original complex coefficient contraction or original bivector Lie bracket qualified'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B0M_R1_ORIGINAL_NATIVE_RED_ZIP_COMPLETE_LOG_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin provider-original native RED ZIP complete Actions log and SHA CRC manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44252646318_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44252646318_NATIVE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C2B0M R1: preserve first original complex carrier native RED evidence"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
