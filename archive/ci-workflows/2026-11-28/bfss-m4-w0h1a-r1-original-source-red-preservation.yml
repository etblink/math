name: BFSS W0H1A R1 original source RED evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0h1a-r1-original-source-red-preservation.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-native-R1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact R1 stopped original source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Assert original R1 source and previously qualified donors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1AOriginalGeneratorCentralizerComap.lean)" = a4c6a2d8006cdd151b72995bb35313c5f2299d57
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0H1AOriginalGeneratorCentralizerIndependentConsumer.lean)" = 8e0e457e2d781737f09ef7b7e48a9a142d51a4e0
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0h1a-original-centralizer-comap-strict.yml)" = 95fdaea744514d567bdf4da471adb4c15c5650a0
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a=s["active"]
          assert a["gate"]=="P3-M4-W0H1A" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="a4c6a2d8006cdd151b72995bb35313c5f2299d57"
          assert a["consumer_blob"]=="8e0e457e2d781737f09ef7b7e48a9a142d51a4e0"
          assert a["workflow_blob"]=="95fdaea744514d567bdf4da471adb4c15c5650a0"
          assert a["contract_commit"]=="2cbdc3b895df680476fc8e5b7748ff05220e4100"
          assert s["last_qualified"]["gate"]=="P3-M4-W0H0"
          assert s["last_qualified"]["run_id"]==44139239821
          assert s["last_qualified_source_exact_original_BFSS"]["run_id"]==44139239821
          assert s["previous_active_W0B1_R2_stopped"]["run_id"]==44127193329
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert not Path("research/quantum-information/diagnostics/BFSS_M4_W0H1A_R1_44145848122_SOURCE_RED_evidence.zip").exists()
          PY
      - name: Fetch and rehash original provider ZIP and complete job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          artifact=14356329219
          run=44145848122
          job=134260618792
          tested="4e04deec085de52ac1e55e7265e3463788893d3a"
          digest="ef701824430dc78c70d4bd049e013a30a1a09df447e44e6b1a6dc5231fafcd43"
          size=13910
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{artifact}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as res:
              meta=json.load(res)
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          def download(u):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(u,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response: return response.read()
              else:
                  with response: return response.read()
          raw=download(url+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={"cold-source.log","preflight.log","tested-commit.txt"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected,z.namelist()
              assert z.read("tested-commit.txt").decode().strip()==tested
              cold=z.read("cold-source.log").decode()
              assert "Tactic `rewrite` failed: Did not find an occurrence of the pattern" in cold,cold[-5000:]
              assert "P3M4W0H1AOriginalGeneratorCentralizerComap.lean:44:6" in cold
              assert "Subalgebra.comap" in cold
              assert "originalSourceCentralizerPullback T" in cold
              assert "sorryAx" in cold and "error: build failed" in cold
              assert "BFSS_W0H1A_W0H0_ORIGINAL_GREEN_W0B0_GENERATOR_GREEN_W0B1_STOP_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/etblink/math/actions/jobs/{job}/logs")
          assert len(log)>20000 and b"P3M4W0H1AOriginalGeneratorCentralizerComap.lean:44:6" in log
          assert b"Tactic `rewrite` failed: Did not find an occurrence of the pattern" in log
          assert b"sorryAx" in log and b"error: build failed" in log
          assert b"BFSS_W0H1A_W0H0_ORIGINAL_GREEN_W0B0_GENERATOR_GREEN_W0B1_STOP_PREFLIGHT_PASS" in log
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0H1A_R1_{run}_SOURCE_RED_evidence.zip"
          full=root/f"BFSS_W0H1A_R1_{run}_complete_job.log"
          manifest=root/f"BFSS_W0H1A_R1_{run}_SOURCE_RED_evidence_manifest.json"
          for path in [archive,full,manifest]: assert not path.exists(),path
          archive.write_bytes(raw)
          full.write_bytes(log)
          record={
             "gate":"P3-M4-W0H1A","attempt":"R1","status":"RED_UNQUALIFIED",
             "failure_phase":"COLD_ORIGINAL_LEAN_SOURCE","run_id":run,"job_id":job,
             "tested_sha":tested,"artifact_id":artifact,
             "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
             "original_job_log":{"path":str(full),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
             "source_blob":"a4c6a2d8006cdd151b72995bb35313c5f2299d57",
             "consumer_blob":"8e0e457e2d781737f09ef7b7e48a9a142d51a4e0",
             "workflow_blob":"95fdaea744514d567bdf4da471adb4c15c5650a0",
             "failed_line":44,"failed_tactic":"rw [Subalgebra.mem_comap, Subalgebra.mem_centralizer_iff]",
             "failure_cause":"Source named pullback definition not unfolded before rewrite. First native source failure in this architecture.",
             "expected_source_reports":1,"actual_source_reports":0,"actual_consumer_reports":0,
             "predecessor_qualified_run":44139239821,
             "frozen_w0b1_source_red_runs":[44117272657,44127193329]
          }
          manifest.write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0H1A_R1_ORIGINAL_NATIVE_SOURCE_RED_PROVIDER_REHASH_PASS",json.dumps(record,sort_keys=True))
          PY
      - name: Git-pin original R1 source RED ZIP, full job log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0H1A_R1_44145848122_SOURCE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0H1A_R1_44145848122_complete_job.log research/quantum-information/diagnostics/BFSS_W0H1A_R1_44145848122_SOURCE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0H1A_R1_44145848122_SOURCE_RED_evidence.zip | tr -d ' ')" = 13910
          git commit -m "BFSS W0H1A: preserve original R1 native rewrite RED ZIP, complete CI log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
