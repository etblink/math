name: BFSS P0B R2 exact RED artifact preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths: [.github/workflows/bfss-p0b-r2-evidence-preservation.yml]
permissions:
  actions: read
  contents: read
jobs:
  preserve-exact-original-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rehash and expose exact original diagnostic ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,base64,zipfile,io
          api="https://api.github.com/repos/etblink/math/actions/artifacts/14272854442"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=60) as r:
              m=json.load(r)
          expected="46b201bd2b46e29a3650d3982fd9e605d9cd54ede30f8aca4019d7887a9e7ec2"
          assert m["id"]==14272854442 and m["size_in_bytes"]==3745
          assert m["workflow_run"]["id"]==43958703251
          assert m["workflow_run"]["head_sha"]=="d235bf1bba640ffa6b3caa4fbea9b33cbe86b103"
          assert m["digest"]=="sha256:"+expected
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              r=opener.open(urllib.request.Request(api+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=60) as r:
                  data=r.read()
          else:
              with r:
                  data=r.read()
          assert len(data)==3745
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert set(names)=={"tested-commit.txt","preflight.log","cold-source.log"},names
              assert z.read("tested-commit.txt").decode().strip()=="d235bf1bba640ffa6b3caa4fbea9b33cbe86b103"
              pre=z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "PREFLIGHT_PASS" in pre
              assert ":35:37: Type mismatch" in cold and "sorryAx" in cold
              assert "Build completed successfully" not in cold
              entries=[{"name":n,"bytes":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in names]
          print("BFSS_P0B_R2_ORIGINAL_ZIP_REHASH_PASS "+json.dumps({"artifact_id":14272854442,"original_run":43958703251,"tested_sha":"d235bf1bba640ffa6b3caa4fbea9b33cbe86b103","bytes":len(data),"sha256":actual,"zip_integrity":"PASS","entries":entries},sort_keys=True))
          print("BFSS_P0B_R2_ORIGINAL_ZIP_BASE64 "+base64.b64encode(data).decode())
          PY
