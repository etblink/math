name: SM-Y0 truth-first one-family hypercharge anomaly ledger strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean
      - lean/diagnostics/SMY0OneFamilyAnomalyIndependentConsumer.lean
      - .github/workflows/sm-y0-one-family-hypercharge-anomalies-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm-y0-standard-model-one-family-anomaly-strict
  cancel-in-progress: false
jobs:
  sm-one-family-source-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout unified repository preserving BFSS original source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact SM sources empirical charter toolchain and untouched BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sm-y0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sm-y0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-y0/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          source='lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean'
          consumer='lean/diagnostics/SMY0OneFamilyAnomalyIndependentConsumer.lean'
          roots=['canonical_colorMixed_zero','canonical_weakMixed_zero',
            'canonical_cubicAbelian_zero','canonical_gravityMixed_zero',
            'canonical_hypercharge_coefficients_vanish',
            'canonical_weak_doublet_count_even','erasedQuark_colorMixed_ne_zero',
            'erasedQuark_weakMixed_ne_zero','erasedQuark_not_anomaly_free']
          consumer_roots=['canonical_inputs_consumer','colorMixed_consumer',
            'weakMixed_consumer','cubicAbelian_consumer','gravityMixed_consumer',
            'all_hypercharge_coefficients_consumer',
            'perturbed_charge_detected_consumer','weak_doublets_even_consumer']
          pins={
            source:'481a984b5ba7d2d7df41297d162ab1d608646d6e',
            consumer:'082492122e15f5f73a24b086ea1e3c4ae71527df',
            'research/methodology/TRUTH_FIRST_FOUNDATIONAL_RESEARCH_CHARTER_2026_11_18.md':'0513dda5fe1feaf4572d0dd1ed09293994ec2391',
            'research/standard-model/SM0_TRUTH_FIRST_EMPIRICAL_REQUIREMENTS_ATLAS_2026_11_18.md':'d0f370b82e0ccc293f7b64e80c103b8e7e4f724c',
            'research/standard-model/SM0_REUSE_AUDIT_MATHLIB_BFSS_SPIN10_CHIRALITY_2026_11_18.md':'c0882b618b55d2bc5328f2a97a3eb9256b116115',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean':'7d372392703d0fe69942df9df58b421af6850656',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E2_R1_44376918039_NATIVE_CONSUMER_RED_evidence.zip':'eb1f32067abc3fedf97a6a160c4f6f0ffae23c4c',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence.zip':'924d03cbeb88a186dc3f733297e5f01e04bbdc51'
          }
          for path,expected in pins.items():
            actual=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert actual==expected,(path,actual,expected)
          sm=Path(source).read_text();con=Path(consumer).read_text()
          assert sm.startswith('import Mathlib.Tactic\n') and con.startswith(
            'import OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMY0OneFamilyAnomalyLedger\n')
          assert re.findall(r'(?m)^#print axioms (\S+)$',sm)==roots
          assert re.findall(r'(?m)^#print axioms (\S+)$',con)==consumer_roots
          assert len(re.findall(r'(?m)^theorem\b',sm))==9
          assert len(re.findall(r'(?m)^theorem\b',con))==8
          assert len(re.findall(r'(?m)^example\b',con))==3
          assert 'originalSource48BivectorK' not in sm+con
          for file in (sm,con):
            assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',file)
            assert not any(x in file for x in ('set_option maxRecDepth','set_option maxHeartbeats'))
          assert '1 / 6' in sm and '2 / 3' in sm and '1 / 3' in sm and '1 / 2' in sm
          assert '(3 + 1 : ℕ)' in sm
          ss=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert len(ss['accepted_anchors'])==27
          assert ss['last_qualified']['gate']=='P3-M4-W0C2B1'
          assert (ss['active']['gate'],ss['active']['status'],ss['active']['qualification'])==(
              'P3-M4-W0C2B2','BLOCKED',False)
          assert ss['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          lm=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in lm['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          print('SM_Y0_9_SOURCE_8_CONSUMER_TRUTH_FIRST_CHARTER_PDG_CONTEXT_27_BFSS_ANCHORS_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Restore exact pinned Lean 4.34.1 and Mathlib cache
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold independent SM-Y0 source consumer and axiom checks
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/sm-y0"
          timeout 1100s lake build OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMY0OneFamilyAnomalyLedger 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/SMY0OneFamilyAnomalyIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sm-y0'
          allowed={'propext','Classical.choice','Quot.sound'}
          roots=['canonical_colorMixed_zero','canonical_weakMixed_zero','canonical_cubicAbelian_zero',
            'canonical_gravityMixed_zero','canonical_hypercharge_coefficients_vanish',
            'canonical_weak_doublet_count_even','erasedQuark_colorMixed_ne_zero',
            'erasedQuark_weakMixed_ne_zero','erasedQuark_not_anomaly_free']
          consumer=['canonical_inputs_consumer','colorMixed_consumer','weakMixed_consumer',
            'cubicAbelian_consumer','gravityMixed_consumer','all_hypercharge_coefficients_consumer',
            'perturbed_charge_detected_consumer','weak_doublets_even_consumer']
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          pkg_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,names):
              assert 'sorryAx' not in log and 'error:' not in log
              warnings=[x for x in log.splitlines() if 'warning:' in x and not pkg_warning.fullmatch(x)]
              assert not warnings,warnings
              found=pat.findall(log)
              assert len(found)==len(names),(found,names)
              assert [x.rsplit('.',1)[-1] for x,_ in found]==names
              for _,axs in found:assert {a.strip() for a in axs.split(',') if a.strip()}<=allowed,axs
          good="'SM.x' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,['x'])
          bad=[good.replace('Quot.sound','sorryAx'),good.replace('Quot.sound','Foreign.axiom'),
               good+good,'',good+'warning: unintended\n',good+'error: illegal\n']
          for i,item in enumerate(bad):
              try:audit(item,['x'])
              except AssertionError:pass
              else:raise AssertionError(('negative auditor mutant survived',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'error:' not in cold and 'sorryAx' not in cold
          audit((root/'source-axioms.log').read_text(),roots)
          audit((root/'consumer.log').read_text(),consumer)
          print('SM_Y0_ORIGINAL_9_SOURCE_8_INDEPENDENT_CONSUMER_3_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN')
          PY
      - name: Preserve original SM-Y0 source consumer evidence for independent archiving
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm-y0-original-source-consumer-evidence
          path: /home/runner/work/_temp/sm-y0/
          retention-days: 14
          if-no-files-found: warn
