              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {"native-source.log":["FCP.BFSSLOC1.cutoffField_stronglyMeasurable","FCP.BFSSLOC1.cutoffError_stronglyMeasurable","FCP.BFSSLOC1.cutoffGradient_zero_off_support","FCP.BFSSLOC1.cutoffField_support","FCP.BFSSLOC1.cutoffError_support","FCP.BFSSLOC1.cutoffField_pointwise_bound","FCP.BFSSLOC1.cutoffError_pointwise_bound","FCP.BFSSLOC1.cutoffField_memLp","FCP.BFSSLOC1.cutoffError_memLp","FCP.BFSSLOC1.cutoffError_L2_bound"],"strict-axioms.log":["FCP.BFSSLOC1Independent.originalSU2CutoffSupportAudit","FCP.BFSSLOC1Independent.originalSU2CutoffErrorBoundAudit"]}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_LOC1_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-loc1-original-cutoff-l2-bounds-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-loc1-original-cutoff-l2-bounds/
          if-no-files-found: warn
          retention-days: 30
