name: BFSS W0B0 R2 provider-original GREEN evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0b0-r2-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  pin-provider-original-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualified-predecessor unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact unchanged mathematical source, consumer, original RED ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B0OriginalGammaCommutantInduction.lean)" = "c67f30bb76a9990e508a8a050a8c3313e694bda7"
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0B0OriginalGammaCommutantIndependentConsumer.lean)" = "159c561d6e73e3c86959cd239deb10984064e92e"
          python3 - <<'PY'
          import json,subprocess
          s=json.load(open("BFSS_GATE_STATE.json"))
          assert s["last_qualified"]["gate"]=="P3-M4-W0A3"
          assert s["last_qualified"]["run_id"]==44051746176
          assert s["last_qualified"]["status"]=="GREEN_QUALIFIED"
          a=s["active"]
          assert a["gate"]=="P3-M4-W0B0" and a["attempt"]=="R2"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="c67f30bb76a9990e508a8a050a8c3313e694bda7"
          assert a["consumer_blob"]=="159c561d6e73e3c86959cd239deb10984064e92e"
          assert s["previous_active_W0B0_R1_RED"]["run_id"]==44064728599
          assert s["previous_active_W0A4_R2_stopped"]["stopped"] is True
          PY
      - name: Re-download original provider ZIP and audit source, consumer, six auditor tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          aid=14339909789
          run=44109519633
          tested="68ed5e35c7268951779d9d35aa4f87f59fee2b67"
          digest="e21cc898a2e5ab41b52e93a804b602129b539de151665a742e43d1773872f890"
          size=13960
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{aid}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:
              meta=json.load(response)
          assert meta["id"]==aid and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as err:
              assert err.code==302,err
              signed=err.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=90) as response:
                  raw=response.read()
          else:
              with response:
                  raw=response.read()
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          allowed={"propext","Classical.choice","Quot.sound"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0B0_R2_ORIGINAL_COMPLEX_SCALAR_W0A3_GREEN_W0A4_STOP_W0B0_R1_RED_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9128 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert "BFSS_W0B0_R2_COMPLEX_SCALAR_2_SOURCE_2_CONSUMER_2_CONTROLS_STRICT_GREEN" in z.read("auditor.log").decode()
              for fname,names in [
                   ("source-axioms.log",{"sourceGammaRealLinear_commute","originalComplexEquiv_generator_commutes"}),
                   ("consumer.log",{"sourceGammaRealLinear_commute_consumer","originalComplexEquiv_generator_commutes_consumer"})]:
                  t=z.read(fname).decode()
                  reports=pat.findall(t)
                  assert "error:" not in t and "sorryAx" not in t
                  assert len(reports)==2
                  assert {name.rsplit(".",1)[-1] for name,_ in reports}==names
                  assert all({a.strip() for a in axioms.split(",") if a.strip()}<=allowed for _,axioms in reports)
              print("BFSS_W0B0_R2_PROVIDER_ORIGINAL_GREEN_REHASH_PASS",json.dumps({
                 "run":run,"artifact":aid,"tested":tested,"size":size,"sha256":digest,
                 "members":[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]},sort_keys=True))
          target=Path("research/quantum-information/diagnostics/BFSS_M4_W0B0_R2_44109519633_GREEN_evidence.zip")
          assert not target.exists()
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(raw)
          PY
      - name: Git pin only byte-identical original GREEN ZIP to unified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path="research/quantum-information/diagnostics/BFSS_M4_W0B0_R2_44109519633_GREEN_evidence.zip"
          git add -- "$path"
          test "$(git diff --cached --name-only)" = "$path"
          test "$(wc -c < "$path" | tr -d ' ')" = 13960
          git commit -m "BFSS W0B0 R2: preserve provider-original source and consumer strict GREEN ZIP"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
