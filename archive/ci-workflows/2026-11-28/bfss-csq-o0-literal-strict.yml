name: BFSS CSQ-O0 R4 literal orbital difference strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0LiteralOrbitalDifference.lean'
      - 'lean/diagnostics/BFSSCSQO0LiteralIndependentAudit.lean'
      - '.github/workflows/bfss-csq-o0-literal-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-csq-o0-literal-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-source-csq-o0:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-csq-o0-literal"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-csq-o0-literal/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0LiteralOrbitalDifference.lean \
            lean/diagnostics/BFSSCSQO0LiteralIndependentAudit.lean \
            .github/workflows/bfss-csq-o0-literal-strict.yml \
            > "$RUNNER_TEMP/bfss-csq-o0-literal/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-csq-o0-literal/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-csq-o0-literal/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/diagnostics/BFSSCSQO0LiteralG5PDiagnostic.lean": "2d08807369ba2b0705ab235bc6cac12eb67e32ac",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0OriginalOrbitalDifference.lean": "3a3179bc04e494e244fd35b3f2ac5284802c6d27",
            "lean/diagnostics/BFSSCSQO0IndependentAudit.lean": "86b8a7978b135aa3f3fc1e9c298d02264c0579a6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0LiteralOrbitalDifference.lean": "ab4fc2784acd101e55f8e588399c5439ab218adf",
            "lean/diagnostics/BFSSCSQO0LiteralIndependentAudit.lean": "ab68f9cae2d1eef1ed189dd0b26bb56a94e89d41",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G5POriginalScalarMixedRemainderProbe.lean": "980ddf4dd5593c2464476513b75b8e064eff2af2",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G5QOriginalDiagonalMixedCommutatorProbe.lean": "42d758cc80ecb9bea781f636e53877d285a17cf6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe.lean": "7fccbe6d246eb12e238c1041e730926807512b98",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean": "152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G4AOriginalCoreCalculusProbe.lean": "f28dd1e283ce824b406acd15529c2e101c844814",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQF1OriginalFermionicDifference.lean": "0c01875de6c1d9b11688078d9e0ceefdb9a353a7",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","3ce5f4daeb8f3b4ccd4e19ee0c3612933beb34ac","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQO0LiteralOrbitalDifference.lean").read_text()
          t=Path("lean/diagnostics/BFSSCSQO0LiteralIndependentAudit.lean").read_text()
          source_roots = ["evaluateHalfDouble", "normalizeRight", "literalSingleSpinor", "originalFderiv_coordinate_sum", "rightOrderedMixed_orbital_apply", "cancelCommonEvaluations", "scalarHalfSquare_difference"]
          consumer_roots = ["pairedRightOrderedAudit", "pairedScalarDifferenceAudit"]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6G5QOriginalDiagonalMixedCommutatorProbe",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQO0LiteralOrbitalDifference",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG1APairedThetaProbe",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_CSQ_O0_LITERAL_SOURCE_EXACT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-csq-o0-literal/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original orbital difference and independent paired controls
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-csq-o0-literal"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQO0LiteralOrbitalDifference OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG1APairedThetaProbe 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSCSQO0LiteralIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-csq-o0-literal"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSCSQO0Literal.evaluateHalfDouble",
                  "FCP.BFSSCSQO0Literal.normalizeRight",
                  "FCP.BFSSCSQO0Literal.literalSingleSpinor",
                  "FCP.BFSSCSQO0Literal.originalFderiv_coordinate_sum",
                  "FCP.BFSSCSQO0Literal.rightOrderedMixed_orbital_apply",
                  "FCP.BFSSCSQO0Literal.cancelCommonEvaluations",
                  "FCP.BFSSCSQO0Literal.scalarHalfSquare_difference",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSCSQO0LiteralIndependent.pairedRightOrderedAudit",
                  "FCP.BFSSCSQO0LiteralIndependent.pairedScalarDifferenceAudit",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_CSQ_O0_LITERAL_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-csq-o0-literal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-csq-o0-literal/
          if-no-files-found: warn
          retention-days: 30
