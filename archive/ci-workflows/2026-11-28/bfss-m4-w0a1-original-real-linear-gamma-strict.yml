name: BFSS M4 W0A1 original real-linear gamma transport strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A1OriginalRealLinearGammaTransport.lean
      - lean/diagnostics/BFSSP3M4W0A1OriginalRealLinearGammaIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0a1-original-real-linear-gamma-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0a1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-real-linear-gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact original source, accepted W0A0, frozen RED and approved dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0a1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0a1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0a1/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A1OriginalRealLinearGammaTransport.lean":"18330e00cc1917ffa97833c9cf7bcfcb35afefdd","lean/diagnostics/BFSSP3M4W0A1OriginalRealLinearGammaIndependentConsumer.lean":"9fd63b7cc0cd85b3cb10bb2b7b3d41b4b27a43ba","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean":"175cd63e2ef031818b61a51b73eb59782fe38add","lean/diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean":"c58f6d3e49bbcb4b7d2c88a08f57f7e07b61ce63","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3AOriginalCliffordFockGeneratorAxisCrosswalk.lean":"b3f032e8d2bc99901b659c323d982a29a926cd47","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52L9E4OriginalFockRealLinearCliffordGeneratorMapProbe.lean":"d1a6194ac68fef46ca99de45beb46d15ccb32c79","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48RealLinearGammaProbe.lean":"a9f446ea7986ca796c2f4b222a5ab710d98590cc","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean":"fad0eab5014aa038ddb0bf8411b0e81c358e7908","research/quantum-information/diagnostics/BFSS_M4_W0A0_R1_44033364617_evidence.zip":"f356fec7fbb63bd660712f043503bc70b1eae673","research/quantum-information/diagnostics/BFSS_M4_W0A0_R2_44039594189_evidence.zip":"3ddc359754cab20045315a4167a9e5d15e316f80","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path, expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A1OriginalRealLinearGammaTransport.lean").read_text()
          con=Path("lean/diagnostics/BFSSP3M4W0A1OriginalRealLinearGammaIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==[
              "originalNormalized_allSourceLabel_eq_activeGamma",
              "originalFockGammaRealLinear_eq_sourceGammaRealLinear"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==[
              "originalNormalized_allSourceLabel_consumer",
              "originalFockGammaRealLinear_consumer"]
          assert len(re.findall(r"(?m)^theorem\b",src))==2
          assert len(re.findall(r"(?m)^theorem\b",con))==2
          assert len(re.findall(r"(?m)^example\b",con))==3
          assert len(re.findall(r"(?m)^import ",src))==2
          assert con.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0A1OriginalRealLinearGammaTransport\n")
          assert "Finset.sum_congr rfl" in src and "LinearMap.ext" in src
          assert "donor_normalized_eq_active_source_axis" in src
          assert "sourceBlockColorEquiv.apply_symm_apply" in src
          for text in (src,con):
              assert "set_option autoImplicit false" in text
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",text)
              assert "maxRecDepth" not in text and "maxHeartbeats" not in text
              assert "originalSource48BivectorK" not in text
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q=state["last_qualified"];a=state["active"]
          assert q["gate"]=="P3-M4-W0A0" and q["status"]=="GREEN_QUALIFIED" and q["run_id"]==44039594189
          assert q["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean"]
          assert q["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0A0_R2_44039594189_evidence.zip"]
          assert a["gate"]=="P3-M4-W0A1" and a["attempt"]=="R1" and a["status"]=="PENDING_STRICT_CI"
          assert a["qualification"] is False and a["accepted_predecessor_run"]==44039594189
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A1OriginalRealLinearGammaTransport.lean"]
          assert a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0A1OriginalRealLinearGammaIndependentConsumer.lean"]
          assert a["contract_commit"]=="170ab7b6d2f4fe5d3d77fbb104e79c2a202ba699"
          assert Path(a["prospective_receipt"]).is_file()
          rawred=Path("research/quantum-information/diagnostics/BFSS_M4_W0A0_R1_44033364617_evidence.zip").read_bytes()
          rawgreen=Path("research/quantum-information/diagnostics/BFSS_M4_W0A0_R2_44039594189_evidence.zip").read_bytes()
          assert hashlib.sha256(rawred).hexdigest()=="e805e4eb1515a045031768794d1cb74786b3c64c0caff708f16fac80db45b58b"
          assert hashlib.sha256(rawgreen).hexdigest()=="b54da01cabbe477a91379d21fe447761419cc85a48755b9450e45f5b328d7d97"
          with zipfile.ZipFile(Path("research/quantum-information/diagnostics/BFSS_M4_W0A0_R2_44039594189_evidence.zip")) as z:
              assert z.testzip() is None
              assert "BFSS_W0A0_ORIGINAL_ALL_48_LABELS_1_SOURCE_1_CONSUMER_2_CONTROLS_STRICT_GREEN" in z.read("auditor.log").decode()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_W0A1_EXACT_ORIGINAL_REAL_LINEAR_W0A0_GREEN_R1_RED_DONORS_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original source, separate consumer and strict axiom auditor
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0a1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0A1OriginalRealLinearGammaTransport 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A1OriginalRealLinearGammaTransport.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0A1OriginalRealLinearGammaIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0a1"
          allowed={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              extras=[x for x in log.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
              assert not extras,extras[:5]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for name,axioms in found:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(name,axioms)
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a"])
          mutants=[good.replace("Quot.sound","sorryAx",1),
                   good.replace("Quot.sound","Foreign.axiom",1),
                   good+good, "",
                   good+"warning: unexpected warning\n",
                   good+"error: failed proof\n"]
          for k,bad in enumerate(mutants):
              try: audit(bad,["a"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted negative mutation",k))
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),
                ["originalNormalized_allSourceLabel_eq_activeGamma",
                 "originalFockGammaRealLinear_eq_sourceGammaRealLinear"])
          audit((root/"consumer.log").read_text(),
                ["originalNormalized_allSourceLabel_consumer",
                 "originalFockGammaRealLinear_consumer"])
          print("BFSS_W0A1_ORIGINAL_REAL_LINEAR_2_SOURCE_2_CONSUMER_3_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve exact preflight, original source, consumer and auditor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0a1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0a1/
          if-no-files-found: warn
          retention-days: 14
