name: RHOPF P9A1A original Gamma9 inequivalent generators strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A1AOriginalGammaGeneratorInequivalence.lean
      - lean/diagnostics/RHOPFP9A1AOriginalGammaGeneratorIndependentAudit.lean
      - .github/workflows/rhopf-p9a1a-original-gamma-generator-inequivalence-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhopf-p9a1a-original-gamma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-and-independent-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout original pinned unified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact source-hash and proof-contract preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhopf-p9a1a"
          git rev-parse HEAD | tee "$RUNNER_TEMP/rhopf-p9a1a/exact-tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/rhopf-p9a1a/toolchain-sha256.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          pkgs=json.loads(Path('lean/lake-manifest.json').read_text())['packages']
          assert next(x['rev'] for x in pkgs if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          pref='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/'
          pins={
            'lean/OAI/MathematicalPhysics/BFSS/Core.lean':'9882359ced78b0a3bd7e2f057974bd0a031b3e60',
            pref+'SU2RealGammaProbe.lean':'b9b8192055c70f0d001d7982669b9823c55562ed',
            pref+'SU2BFSSPairedSpin9V10HF10AGOriginalGammaOrderedPairGramProbe.lean':'ac69fc77e5a5b68c8ac06abf8f978a8be8b69a1b',
            pref+'RHOPFP9A0OriginalGammaPairClifford.lean':'bf5eb554232a6d452e86d85b05220aad7c5d0aeb',
            pref+'RHOPFP9A1AOriginalGammaGeneratorInequivalence.lean':'779bd9a78811f60397657df8b8a4350aafae57b7',
            'lean/diagnostics/RHOPFP9A1AOriginalGammaGeneratorIndependentAudit.lean':'aaa656b626f25612a9705bef725b5ef3a1f471b7',
            'research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py':'9d20952c366e356ff5dc656a35d0b604236a15ac'}
          for path,sha in pins.items():
            got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert got==sha,(path,got,sha)
          source=Path(pref+'RHOPFP9A1AOriginalGammaGeneratorInequivalence.lean').read_text()
          consumer=Path('lean/diagnostics/RHOPFP9A1AOriginalGammaGeneratorIndependentAudit.lean').read_text()
          assert re.findall(r'(?m)^import (\S+)$',source)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AGOriginalGammaOrderedPairGramProbe']
          assert re.findall(r'(?m)^import (\S+)$',consumer)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A1AOriginalGammaGeneratorInequivalence']
          names=['originalGammaPair_ne_scalar_distinct','K13_ne_K25','K13_ne_K46','K25_ne_K46']
          assert re.findall(r'(?m)^theorem (\w+)',source)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',source)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',consumer)==[
            'FCP.RHOPFP9A1A.'+n for n in names]
          for s in (source,consumer):
            assert 'set_option autoImplicit false' in s
            assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe|opaque|constant)\b',s)
            assert not re.search(r'(?m)^\s*set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('P9A1A_ORIGINAL_SOURCE_PINS_AND_DECLARATION_PREFLIGHT_PASS')
          PY
          python3 research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py |
            tee "$RUNNER_TEMP/rhopf-p9a1a/independent-original-integer-consumer.json"

      - name: Restore exact Lean 4.34.1 and Mathlib
        timeout-minutes: 44
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2000s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'

      - name: Compile accepted original trace Gram dependency and native proof
        timeout-minutes: 48
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 2700s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AGOriginalGammaOrderedPairGramProbe 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1a/original-gram-build.log"
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A1AOriginalGammaGeneratorInequivalence
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 650s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1a/native-proofs-and-axioms.log"

      - name: Independent Lean type consumer and strict axiom audit
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=diagnostics/RHOPFP9A1AOriginalGammaGeneratorIndependentAudit
          mkdir -p .lake/build/lib/lean/diagnostics
          timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1a/independent-lean-types-and-axioms.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'rhopf-p9a1a'
          native=(root/'native-proofs-and-axioms.log').read_text()
          independent=(root/'independent-lean-types-and-axioms.log').read_text()
          for name in ['originalGammaPair_ne_scalar_distinct','K13_ne_K25','K13_ne_K46','K25_ne_K46']:
            assert 'RHOPFP9A1A.'+name in native,name
            assert 'RHOPFP9A1A.'+name in independent,name
          assert 'sorryAx' not in native+independent
          assert 'error:' not in native+independent
          print('P9A1A_NATIVE_AND_INDEPENDENT_LEAN_PROOFS_PASS')
          PY

      - name: Archive exact-tested commit original source and RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhopf-p9a1a-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhopf-p9a1a
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
