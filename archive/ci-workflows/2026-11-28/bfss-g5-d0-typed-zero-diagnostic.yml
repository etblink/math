name: BFSS G5 D0 typed zero-action diagnostic collection
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - research/spectral-p2-original-field/P3_AUX_HARDY_G5_D0_MANIFEST.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-g5-d0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typed-zero-action-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Verify frozen strict source and diagnostic plan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_bfss_g5_d0_typed_zero.py --preflight
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Calibrate before native zero-action observations and joins
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 tools/run_bfss_g5_d0_typed_zero.py --collect
      - name: Preserve every case and first-causal failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-g5-d0-typed-zero-evidence
          path: bfss-aux-hardy-g5-d0-evidence/
          retention-days: 30
          if-no-files-found: warn
