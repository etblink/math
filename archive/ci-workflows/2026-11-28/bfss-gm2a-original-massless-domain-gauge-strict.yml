name: BFSS GM2A original massless maximal domain SU2 preservation strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation.lean'
      - 'lean/diagnostics/BFSSGM2AOriginalMasslessDomainGaugeIndependentAudit.lean'
      - '.github/workflows/bfss-gm2a-original-massless-domain-gauge-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-full-l2-massless-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen source, native and consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm2a-domain"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm2a-domain/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm2a-domain/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm2a-domain/preflight.log"
          from pathlib import Path
          import subprocess,json,re
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean":"84853fb624289121938e0fb4d2b45afdc16a74c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM0BOriginalMasslessFockPointwiseGaugeCovariance.lean":"23cce8467bbf40b7ab6ab3302863218fdd4df82e",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM1AOriginalMasslessFockGaugeAETransport.lean":"f752436c29b38e6c21944a9b11118e53afe24c48",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("ORIGINAL_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","1dd100cb7794f4af6f92680770539180614b3fb4","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM2AOriginalMasslessDomainGaugeIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM1AOriginalMasslessFockGaugeAETransport",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessD0b0OriginalMaximalDomainSubmodule"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==[
            "sourceGaugeTransport_memLp",
            "originalMasslessDomain_gauge_mem",
            "pairedOriginalMasslessDomain_gauge_mem"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "sourceGaugeTransport_memLp",
            "originalMasslessDomain_gauge_mem",
            "pairedOriginalMasslessDomain_gauge_mem"]
          assert re.findall(r"(?m)^import (\S+)$",t)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation"]
          assert re.findall(r"(?m)^theorem (\S+)",t)==["pairedSourceMaximalMasslessDomainGaugeMem"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",t)==["pairedSourceMaximalMasslessDomainGaugeMem"]
          for p in [s,t]:
              assert "set_option autoImplicit false" in p
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",p)
              for bad in ["set_option maxRecDepth","set_option maxHeartbeats",
                          "set_option synthInstance.maxHeartbeats"]:
                  assert bad not in p
          assert "FCP.BFSSGM1A.originalMasslessAction_gauge_ae_transport" in s
          assert "MemLp.toLp" in s and "Lp.memLp" in s
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM2A_ORIGINAL_SOURCE_DOMAIN_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm2a-domain/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original massless domain native build plus independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm2a-domain"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM2AOriginalMasslessDomainGaugeIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm2a-domain"
          for fn in ["native-source.log","strict-axioms.log"]:
              txt=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in txt,(fn,bad,txt[-5000:])
          native=(E/"native-source.log").read_text()
          for name in ["FCP.BFSSGM2A.sourceGaugeTransport_memLp",
                       "FCP.BFSSGM2A.originalMasslessDomain_gauge_mem",
                       "FCP.BFSSGM2A.pairedOriginalMasslessDomain_gauge_mem"]:
              assert "'"+name+"' depends on axioms:" in native or "'"+name+"' does not depend on any axioms" in native,("MISSING_NATIVE_AXIOMS",name)
          body=(E/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          assert [x for x,_ in reports]==["FCP.BFSSGM2AIndependent.pairedSourceMaximalMasslessDomainGaugeMem"],reports
          allowed={"propext","Classical.choice","Quot.sound"}
          for n,listed in reports:
              ax={t.strip() for t in listed.split(",") if t.strip()}
              assert ax<=allowed,(n,ax)
          print("BFSS_GM2A_ORIGINAL_SOURCE_DOMAIN_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal native, consumer and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm2a-domain-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm2a-domain/
          if-no-files-found: warn
          retention-days: 30
