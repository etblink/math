name: BFSS MOLD0 original kernel integral transport strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLD0OriginalKernelIntegralTransport.lean'
      - 'lean/diagnostics/BFSSMOLD0OriginalKernelIntegralTransportIndependentAudit.lean'
      - '.github/workflows/bfss-mold0-original-kernel-integral-transport-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-mold0-original-kernel-integral-transport-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-source-mold0:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLD0OriginalKernelIntegralTransport.lean \
            lean/diagnostics/BFSSMOLD0OriginalKernelIntegralTransportIndependentAudit.lean \
            .github/workflows/bfss-mold0-original-kernel-integral-transport-strict.yml \
            > "$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLC0OriginalKineticPairingTransport.lean":"e9b0e09d318a5bf8d798cc965883f446c732a178","lean/diagnostics/BFSSMOLC0OriginalKineticPairingTransportIndependentAudit.lean":"c17c92cdb71d31608593c521ce0518d50a43749b",".github/workflows/bfss-molc0-original-kinetic-pairing-transport-strict.yml":"231ab4412925ae18119b634a0ca5527f2058e2e8","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLB0OriginalReflectedKernelTest.lean":"362c4b50d3fbecb628374e1d56adc4bc5a3bf4ab","lean/diagnostics/BFSSMOLB0OriginalReflectedKernelTestIndependentAudit.lean":"c7f3f532f48079185eb343c3415d51d6567088da",".github/workflows/bfss-molb0-original-reflected-kernel-test-strict.yml":"5904f86c7c733571aaf03e0943ad22e1f1d51c2e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLA0OriginalMollifiedCore.lean":"9f1bb106f140f1bbd12ab8cb671b47207244617d","lean/diagnostics/BFSSMOLA0OriginalMollifiedCoreIndependentAudit.lean":"e52b9bd7438f64268b374285ce2923601f244a11",".github/workflows/bfss-mola0-original-mollified-core-strict.yml":"e298bc3c694e033fcdf80ee8cb551ff6e468418e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSICDC0OriginalPhysicalCommonDomain.lean":"01a9a26eee376861eac110f48ee8982ca7204343","lean/diagnostics/BFSSICDC0OriginalPhysicalCommonDomainIndependentAudit.lean":"ee34692fcfb3930e2012cce970f12e0f2f9eb321",".github/workflows/bfss-icdc0-original-physical-common-domain-strict.yml":"a04481a4e505e6f3fad690756dd2d0fb0769c9e4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSICDB0OriginalComponentGraphLifting.lean":"e0babb86e8159168e31e02850be4d7292b01e248","lean/diagnostics/BFSSICDB0OriginalComponentGraphLiftingIndependentAudit.lean":"18922c12eb8f99584ef9590f2e70f5cefd509256",".github/workflows/bfss-icdb0-original-component-graph-lifting-strict.yml":"3db59e1290684e705491d02b9788cbc5212bb874","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSICDA0OriginalJointGraphAdapter.lean":"d14edf176225a797b586a59cebed266ff195a432","lean/diagnostics/BFSSICDA0OriginalJointGraphAdapterIndependentAudit.lean":"6921f808433d69f6d282a7bfdfb69e8e3f16f676",".github/workflows/bfss-icda0-original-joint-graph-adapter-strict.yml":"03c2e6b836ee607874586a647a6a51b7bea3fff0","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0OriginalCoreEnergy.lean":"42e8396605ef90b96f4434f3df1fb7c2f8eca547","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0b3BasisSquareComposition.lean":"e604acccafcc7295fd467f9339b7e155dfc6c59d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC4PhysicalGraphCoreIdentification.lean":"032c90273c4214aad1b05aef7bd48894b6e23bf4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.lean":"389bd4318cbc389db226691bbccecaa78c6c6c3e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean":"a9f27a48852ac570aedc8e0ab88d683250e6b138","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe.lean":"0afafb8eae4b5efdbd4f95eff2ae1e9352dfe7c5","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","e71cff62a61b5924cdc02edf8d9aac79b35f2cdc","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLD0OriginalKernelIntegralTransport.lean").read_text()
          t=Path("lean/diagnostics/BFSSMOLD0OriginalKernelIntegralTransportIndependentAudit.lean").read_text()
          source_roots = ["kernel_integrable","kernelDerivative_integrable","kineticTerm_integrable","kineticTerm_integral","fixedInner_integral"]
          consumer_roots = ["originalSU2KernelDerivativeIntegrableAudit","originalSU2KineticTermIntegralAudit"]
          assert re.findall(r"(?m)^import (\S+)$", s) == ["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMOLC0OriginalKineticPairingTransport"]
          assert re.findall(r"(?m)^import (\S+)$", t) == ["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMOLD0OriginalKernelIntegralTransport"]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_MOLD0_SOURCE_EXACT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Calculus/ContDiff/Convolution.lean)" = bd9e90f63766eb35fdd67857ef621847de532df7
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Convolution.lean)" = 01ac3fc1f4d36b203933f575dde6b0931b0b8556
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Integral/Bochner/ContinuousLinearMap.lean)" = 24b8ad83aa2cb2a2cb5ce54ac6ce84dbad84bb7f
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/InnerProductSpace/LinearMap.lean)" = 9e464cfcd28bd0ac75d7d79f814305a6c88a4a28

      - name: Original kernel integral transport and independent consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-mold0-original-kernel-integral-transport"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMOLD0OriginalKernelIntegralTransport 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSMOLD0OriginalKernelIntegralTransportIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-mold0-original-kernel-integral-transport"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {"native-source.log":["FCP.BFSSMOLD0.kernel_integrable","FCP.BFSSMOLD0.kernelDerivative_integrable","FCP.BFSSMOLD0.kineticTerm_integrable","FCP.BFSSMOLD0.kineticTerm_integral","FCP.BFSSMOLD0.fixedInner_integral"],"strict-axioms.log":["FCP.BFSSMOLD0Independent.originalSU2KernelDerivativeIntegrableAudit","FCP.BFSSMOLD0Independent.originalSU2KineticTermIntegralAudit"]}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_MOLD0_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-mold0-original-kernel-integral-transport-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-mold0-original-kernel-integral-transport/
          if-no-files-found: warn
          retention-days: 30
