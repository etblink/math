name: BFSS W0B1 R1 original source RED evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0b1-r1-red-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-w0b1-original-red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout unified integration and verify frozen R1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Validate exact original source, consumer and qualified donor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B1OriginalFullCliffordCommutantInduction.lean)" = 6c9cae683665fb6cda2a6e8ff10d388f6a268a05
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0B1OriginalFullCliffordCommutantIndependentConsumer.lean)" = 9ea114c7f8a8c26b814b3abe9fd5c6a1e853e53a
          python3 - <<'PY'
          import json
          state=json.load(open("BFSS_GATE_STATE.json"))
          assert state["active"]["gate"]=="P3-M4-W0B1" and state["active"]["attempt"]=="R1"
          assert state["active"]["status"]=="PENDING_STRICT_CI" and state["active"]["qualification"] is False
          assert state["last_qualified"]["gate"]=="P3-M4-W0B0"
          assert state["last_qualified"]["run_id"]==44109519633
          assert state["previous_active_W0A4_R2_stopped"]["stopped"] is True
          PY
      - name: Independently retrieve and verify original failed provider artifact and full job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          owner="etblink/math"
          aid=14343844353
          run=44117272657
          jid=134158680276
          tested="c486662c149af872a88e97f485befe61fe1522f5"
          sha="3fd4c088723dae5cee7fdb68db391b482d26e1af5a241b1cb27541b11948b1b9"
          size=13688
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          base=f"https://api.github.com/repos/{owner}/actions/artifacts/{aid}"
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=60) as response:
              meta=json.load(response)
          assert meta["id"]==aid and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+sha
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          def download(url):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as f: return f.read()
              else:
                  with response: return response.read()
          raw=download(base+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"preflight.log","cold-source.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0B1_ORIGINAL_FULL_CLIFFORD_W0B0_GREEN_W0A4_STOP_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Unknown identifier `map_algebraMap`" in cold
              assert "sorryAx" in cold
              assert "build failed" in cold and "Build completed successfully" not in cold
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/{owner}/actions/jobs/{jid}/logs")
          assert len(log)>1000 and b"Unknown identifier `map_algebraMap`" in log and b"sorryAx" in log
          zip_path=root/f"BFSS_M4_W0B1_R1_{run}_RED_evidence.zip"
          log_path=root/f"BFSS_W0B1_R1_{run}_complete_job.log"
          manifest_path=root/f"BFSS_W0B1_R1_{run}_RED_evidence_manifest.json"
          for p in [zip_path,log_path,manifest_path]: assert not p.exists(),p
          zip_path.write_bytes(raw)
          log_path.write_bytes(log)
          manifest={"gate":"P3-M4-W0B1","attempt":"R1","status":"RED_UNQUALIFIED","run_id":run,
           "job_id":jid,"tested_sha":tested,"provider_artifact_id":aid,
           "original_zip":{"path":str(zip_path),"size":size,"sha256":sha,"members":members},
           "original_job_log":{"path":str(log_path),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
           "failure":"source Lean line 43 unknown map_algebraMap and scalar commutator type mismatch; source sorryAx due failure",
           "source_compiled":False,"consumer_qualified":False,"qualified_predecessor_run":44109519633}
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0B1_R1_ORIGINAL_PROVIDER_RED_REHASH_PASS",json.dumps(manifest,sort_keys=True))
          PY
      - name: Git-pin exact provider RED archive, log and manifest only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0B1_R1_44117272657_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0B1_R1_44117272657_complete_job.log research/quantum-information/diagnostics/BFSS_W0B1_R1_44117272657_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0B1: preserve original R1 RED evidence, full job log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
