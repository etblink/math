name: SM-D1-SCC0 R1 original green evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-d1-scc0-r1-original-green-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  original-independent-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without modifying original accepted sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Pin original source consumer workflow and BFSS evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/standard-model/tools/smd1_scc0.py)" = 95569dffd88af133df3dd56d23e1f61ca8c4a207
          test "$(git rev-parse HEAD:research/standard-model/tests/test_smd1_scc0.py)" = 2a41d3592179c1fd205518f912ae365ba8f59f8f
          test "$(git rev-parse HEAD:.github/workflows/sm-d1-scc0-finite-witness-strict.yml)" = 886899eda0781fe6a4ff9ad331ed9851b35b6664
          test "$(git rev-parse HEAD:research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json)" = 1d391ba994ee23f03c4423b45fbb15e7e42c86f1
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean)" = 481a984b5ba7d2d7df41297d162ab1d608646d6e
          python3 - <<'PY'
          import json
          from pathlib import Path
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert (sm['last_qualified']['gate'],sm['last_qualified_empirical']['gate'])==('SM-Y0','SM-D0')
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in sm['upcoming'])
          assert len(bf['accepted_anchors'])==27 and bf['active']['status']=='BLOCKED'
          assert not list(Path('research/standard-model/evidence').glob('SMD1_SCC0_R1_44398482716_*'))
          print('SM_D1_SCC0_PRESERVATION_FROZEN_SM_BFSS_PREFLIGHT_PASS')
          PY
      - name: Verify original run ZIP members and complete job transcript
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/etblink/math'
          run=44398482716;job=135134743768;aid=14471327772
          sha='56012ebc59bb310cd6ee48ef1235766d85aaac33'
          checksum='e96401c3d0e02f084654ab5287a2501a632e1dbe7f8f8b493b41549b2b9288ec'
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
               'X-GitHub-Api-Version':'2022-11-28'}
          def json_get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=hdr),timeout=60) as x:return json.load(x)
          rr=json_get(f'/actions/runs/{run}')
          jj=json_get(f'/actions/jobs/{job}')
          aa=json_get(f'/actions/artifacts/{aid}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(sha,'completed','success',1)
          assert (jj['id'],jj['run_id'],jj['conclusion'])==(job,run,'success')
          for part in ('Checkout exact unified','Preflight original SM/BFSS',
                       'Run independent exact finite','Preserve exact original test'):
              assert any(x['name'].startswith(part) and x['conclusion']=='success' for x in jj['steps']),part
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(aid,1408,'sha256:'+checksum)
          assert (aa['workflow_run']['head_sha'],aa['workflow_run']['id'])==(sha,run)
          assert aa['name']=='sm-d1-scc0-original-finite-counterfactual-evidence'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def getraw(path):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(
                      urllib.request.Request(base+path,headers=hdr),timeout=60)
              except urllib.error.HTTPError as exc:
                  assert exc.code==302,exc
                  signed=exc.headers['Location']
                  assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as x:return x.read()
              else:
                  with response:return response.read()
          raw=getraw(f'/actions/artifacts/{aid}/zip')
          assert len(raw)==1408 and hashlib.sha256(raw).hexdigest()==checksum
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert {'tested-commit.txt','preflight.log','consumer.log','assertions.log'}<=names,names
              assert z.read('tested-commit.txt').decode().strip()==sha
              assert 'SM_D1_SCC0_ORIGINAL_SM_Y0_SM_D0_BFSS_27_ANCHORS_FROZEN_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              consumer=z.read('consumer.log').decode()
              assert re.search(r'Ran 24 tests in [0-9.]+s',consumer) and '\nOK\n' in consumer
              assert 'SM_D1_SCC0_24_NEGATIVE_POSITIVE_INDEPENDENT_FIXTURES_PASS' in z.read('assertions.log').decode()
              members=[{'name':n,'sha256':hashlib.sha256(z.read(n)).hexdigest(),
                        'size':len(z.read(n)),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          whole=getraw(f'/actions/jobs/{job}/logs')
          assert len(whole)>5000,len(whole)
          assert b'SM_D1_SCC0_24_NEGATIVE_POSITIVE_INDEPENDENT_FIXTURES_PASS' in whole
          root=Path('research/standard-model/evidence')
          zp=root/'SMD1_SCC0_R1_44398482716_ORIGINAL_GREEN_evidence.zip'
          lp=root/'SMD1_SCC0_R1_44398482716_ORIGINAL_complete_job.log'
          mp=root/'SMD1_SCC0_R1_44398482716_ORIGINAL_GREEN_evidence_manifest.json'
          for p in (zp,lp,mp):assert not p.exists()
          zp.write_bytes(raw);lp.write_bytes(whole)
          mp.write_text(json.dumps({
              'gate':'SM-D1-SCC0','attempt':'R1',
              'qualification_scope':'FINITE_EXACT_COUNTERFACTUAL_METHODOLOGY_ONLY',
              'tested_commit':sha,'strict_run':run,'original_job':job,'original_artifact':aid,
              'original_zip':{'path':str(zp),'size':len(raw),'sha256':checksum,'members':members},
              'complete_job':{'path':str(lp),'size':len(whole),'sha256':hashlib.sha256(whole).hexdigest()},
              'source_blob':'95569dffd88af133df3dd56d23e1f61ca8c4a207',
              'independent_consumer_blob':'2a41d3592179c1fd205518f912ae365ba8f59f8f',
              'workflow_blob':'886899eda0781fe6a4ff9ad331ed9851b35b6664',
              'test_count':24,'BFSS_accepted_anchors_unchanged':27,
              'scientific_ceiling':'No physical candidate comparison, no statistical inference, no SCC theorem import.'
          },sort_keys=True,indent=2)+'\n')
          print('SM_D1_SCC0_R1_ORIGINAL_GREEN_ZIP_COMPLETE_JOB_SHA_CRC_VERIFIED')
          PY
      - name: Commit original provider zip full job log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/standard-model/evidence/SMD1_SCC0_R1_44398482716_ORIGINAL_*
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'SM-D1-SCC0 R1 preserve original strict GREEN and independent checksums'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
