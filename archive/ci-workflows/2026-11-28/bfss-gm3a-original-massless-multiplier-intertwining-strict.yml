name: BFSS GM3A exact original massless partial multiplier gauge intertwining strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining.lean'
      - 'lean/diagnostics/BFSSGM3AOriginalMasslessMultiplierGaugeIndependentAudit.lean'
      - '.github/workflows/bfss-gm3a-original-massless-multiplier-intertwining-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm3a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-exact-original-massless-intertwining:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen source and isolated independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm3a-intertwining"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm3a-intertwining/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm3a-intertwining/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm3a-intertwining/preflight.log"
          import subprocess,re,json
          from pathlib import Path
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean":"84853fb624289121938e0fb4d2b45afdc16a74c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph.lean":"2fc90310c9ac476d8e52ba0176ecc94f8994d1c9",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM0BOriginalMasslessFockPointwiseGaugeCovariance.lean":"23cce8467bbf40b7ab6ab3302863218fdd4df82e",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM1AOriginalMasslessFockGaugeAETransport.lean":"f752436c29b38e6c21944a9b11118e53afe24c48",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation.lean":"0c8b10e9bf4d352d34f1de08c092c5188188b7bc",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
          }
          for path,expect in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expect,("FROZEN_SOURCE_DRIFT",path,got,expect)
          subprocess.check_call(["git","merge-base","--is-ancestor","8a43be8ea27ea6a21b338f7022c24a0d8184c04e","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM3AOriginalMasslessMultiplierGaugeIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM2AOriginalMasslessMaximalDomainGaugePreservation",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==[
            "originalMasslessMultiplier_gauge_intertwines",
            "pairedOriginalMasslessMultiplier_gauge_intertwines"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalMasslessMultiplier_gauge_intertwines",
            "pairedOriginalMasslessMultiplier_gauge_intertwines"]
          assert re.findall(r"(?m)^import (\S+)$",t)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining"]
          assert re.findall(r"(?m)^theorem (\S+)",t)==["pairedSourceMasslessMultiplierGaugeIntertwines"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",t)==["pairedSourceMasslessMultiplierGaugeIntertwines"]
          for value in (s,t):
              assert "set_option autoImplicit false" in value
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",value)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in value
          assert "originalMasslessAction_gauge_ae_transport" in s
          assert "originalMasslessDomain_gauge_mem" in s
          assert "originalMasslessMultiplier_ae" in s
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM3A_ORIGINAL_SOURCE_INTERTWINING_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm3a-intertwining/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original source native build and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm3a-intertwining"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM3AOriginalMasslessMultiplierGaugeIntertwining 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM3AOriginalMasslessMultiplierGaugeIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm3a-intertwining"
          for file in ["native-source.log","strict-axioms.log"]:
              content=(E/file).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in content,(file,bad,content[-5000:])
          src=(E/"native-source.log").read_text()
          for name in ["FCP.BFSSGM3A.originalMasslessMultiplier_gauge_intertwines",
                       "FCP.BFSSGM3A.pairedOriginalMasslessMultiplier_gauge_intertwines"]:
              assert "'"+name+"' depends on axioms:" in src or "'"+name+"' does not depend on any axioms" in src,("NATIVE_AXIOM_REPORT_MISSING",name)
          strict=(E/"strict-axioms.log").read_text()
          matches=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",strict)
          assert [name for name,_ in matches]==["FCP.BFSSGM3AIndependent.pairedSourceMasslessMultiplierGaugeIntertwines"],matches
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,raw in matches:
              axioms={q.strip() for q in raw.split(",") if q.strip()}
              assert axioms<=allowed,(name,axioms)
          print("BFSS_GM3A_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve native/consumer first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm3a-intertwining-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm3a-intertwining/
          if-no-files-found: warn
          retention-days: 30
