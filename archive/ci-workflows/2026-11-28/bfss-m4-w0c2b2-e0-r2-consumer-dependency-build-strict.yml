name: BFSS M4 W0C2B2 E0 R2 source frozen consumer dependency cold strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-e0-r2-consumer-dependency-build-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-w0c2b2-e0-r2-frozen-consumer-dependency
  cancel-in-progress: false
jobs:
  source-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified original BFSS branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight 27 accepted anchors immutable donors all stopped native RED receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-w0c2b2-e0-r2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-w0c2b2-e0-r2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-w0c2b2-e0-r2/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          src='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E0OpaqueFockEqualActions.lean'
          con='lean/diagnostics/BFSSW0C2B2E0OpaqueFockEqualActionsIndependentConsumer.lean'
          roots=['originalFock_equal_actions_implies_difference_commutes',
                 'originalFock_equal_columns_implies_difference_commutes',
                 'originalFock_equal_column_family_implies_difference_commutes']
          pins={
            src:'46051f2904ca92d4693d85f65fa39027ec548e35',
            con:'73d03c880f12bd7f058a751b2a343743a2241a0f',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean':'861628fe6322c919bee87e493e1e629d48bfa8bb',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean':'51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0NOriginalSource48RealComplexCoefficientAdapter.lean':'c5841055363a6eef713f35e568409dd2fa2b6c9e',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean':'c2e7a7c665121283cde13ae5dabc183362b6b420',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentralityR2.lean':'d52f48a79750846231c306d9e9ac8ceda25d37be',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D0OriginalFockCommutatorAddHom.lean':'5f511b8d3a6851441d316d986ef6152a5139721f',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D1NamedSourceDefectBoundary.lean':'cf4286170608b3141df7ccbd753fc96507d1544a',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D2AOriginalDefectControlledUnfold.lean':'ada49449b77e145cdcb754edc5c43f57242a3c96',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R1_44274131658_NATIVE_RED_evidence.zip':'12b5843b116bae63e2183049cae572cb1fcc051b',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R2_44280267807_NATIVE_RED_evidence.zip':'b668e91fa897136c5144ef535cb0fef035e9c216',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip':'5b0cd1c0581ac1a8df5c50093f91e3d12b3fef43',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence.zip':'18c87219367977d3d9530e90789c3e8612740849',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence.zip':'274024155e885fb1c5bb49e20604bd621f503f39',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R1_44350891866_NATIVE_RED_evidence.zip':'01c99ad7de02f8b71f61b830b17c66ce3d536035',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R2_44355713875_NATIVE_RED_evidence.zip':'c8d32c6291f7469400abf794b0eacd30113ec828',
            'research/quantum-information/BFSS_W0C2B2_D2A_TWO_NATIVE_SOURCE_REDS_STOP_AND_SOURCE_ACTION_ROUTE_2026_11_18.md':'4451028cf479c75b2f22ba9d905bbd87672a52e2',
            'research/quantum-information/BFSS_W0C2B2_E0_OPAQUE_EQUAL_ACTIONS_PRE_GATE_2026_11_18.md':'b9d5d41446e3d9739b3235cbdc0a82b5accddc87'
          }
          pins.update({
            '.github/workflows/bfss-m4-w0c2b2-e0-opaque-fock-equal-actions-strict.yml':'a639f78bef7c0d2935a6fcb522c431336d162a0e',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence.zip':'ad1befa37a5897d2c8b2a76dcee0fe0c1e04a3ed',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_complete_job.log':'a238030be885b65498bd3bbf1f49ad8bd8596012',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json':'599d84c8794b90b3054aaadb6a096a742e9e9ce2',
            '.github/workflows/bfss-m4-w0c2b2-e0-r1-consumer-dependency-red-preservation.yml':'d6578749a8b847a41d03ce19f69392ce1ef5df9d'
          })
          for path,sha in pins.items():
            actual=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert actual==sha,(path,actual,sha)
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert s['branch']=='integration/bfss-unified-research-20261108'
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          assert s['strategic_focus']['full_bivector_bracket_qualified'] is False
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          m=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in m['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          for file,expected,imports in ((src,3,2),(con,3,2)):
            t=Path(file).read_text()
            assert len(re.findall(r'(?m)^theorem\b',t))==expected
            assert len(re.findall(r'(?m)^import ',t))==imports
            assert len(re.findall(r'(?m)^#print axioms (\S+)$',t))==3
            assert 'set_option autoImplicit false' in t
            assert 'Fermion 2 →L[ℂ] Fermion 2' in t
            assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',t)
            assert not any(z in t for z in ('maxRecDepth','maxHeartbeats','originalSource48K_lieDefect A B'))
          st=Path(src).read_text();ct=Path(con).read_text()
          assert re.findall(r'(?m)^#print axioms (\S+)$',st)==roots
          assert re.findall(r'(?m)^#print axioms (\S+)$',ct)==[
             'originalFock_equal_actions_implies_difference_commutes_consumer',
             'originalFock_equal_columns_implies_difference_commutes_consumer',
             'originalFock_equal_gamma_columns_difference_commutes_consumer']
          assert 'sourceNormalizedGamma' not in st
          assert 'sourceNormalizedGamma' in ct
          assert 'originalFock_commutator_covariance_bracket' not in ct
          assert len(re.findall(r'(?m)^example ',ct))==2
          for key,expected in [
              ('research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence_manifest.json','ORIGINAL_NATIVE_SOURCE_RECURSION_RED_UNQUALIFIED'),
              ('research/quantum-information/diagnostics/BFSS_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence_manifest.json','ORIGINAL_NATIVE_SOURCE_RECURSION_RED_UNQUALIFIED'),
              ('research/quantum-information/diagnostics/BFSS_W0C2B2_D2A_R1_44350891866_NATIVE_RED_evidence_manifest.json','ORIGINAL_NATIVE_SOURCE_UNSOLVED_GOAL_RED_UNQUALIFIED'),
              ('research/quantum-information/diagnostics/BFSS_W0C2B2_D2A_R2_44355713875_NATIVE_RED_evidence_manifest.json','ORIGINAL_NATIVE_SOURCE_RECURSION_RED_UNQUALIFIED')]:
            assert json.loads(Path(key).read_text())['status']==expected,key
          m=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json').read_text())
          assert (m['strict_run'],m['tested_sha'],m['status'])==(44364111715,'d5ca2b09e75e0471aa1979c3bab57e4d88009131','SOURCE_CLEAN_CONSUMER_IMPORT_OLEAN_MISSING_UNQUALIFIED')
          assert m['original_zip']['sha256']=='923922af8ef3b8abbec70c12fcb494c5d0be5a8dbc3fb8bfd25b7f8629d72fc9'
          assert m['original_job_log']['sha256']=='119a2f418eb3a9a214c64e2dcd8f2e27e464c3cab5cbdc1f40bb0e817d4e1f17'
          assert m['source_native_compiled'] is True and m['consumer_compiled'] is False
          assert m['source_blob']==pins[src] and m['consumer_blob']==pins[con]
          assert Path(con).read_text().startswith(
            'import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.ProbeW0C2B2E0OpaqueFockEqualActions\n'
            'import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2AOriginalBivectorLieDefectTraceBridge\n')
          print('BFSS_E0_R2_27_ANCHORS_R1_ORIGINAL_CONSUMER_DEPENDENCY_RED_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold E0 source plus accepted W0C2A dependency and independent consumer strict
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-w0c2b2-e0-r2"
          # Build both original E0 source and qualified W0C2A, whose olean
          # is required by the immutable independent consumer.
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.ProbeW0C2B2E0OpaqueFockEqualActions OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2AOriginalBivectorLieDefectTraceBridge 2>&1 | tee "$root/cold-source.log"
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.olean
          echo BFSS_E0_R2_W0C2A_ACCEPTED_IMPORT_OLEAN_BUILT | tee "$root/consumer-dependency-control.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E0OpaqueFockEqualActions.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSW0C2B2E0OpaqueFockEqualActionsIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'bfss-w0c2b2-e0-r2'
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,expected):
            assert 'error:' not in log and 'sorryAx' not in log
            warnings=[line for line in log.splitlines() if 'warning:' in line and not warning_ok.fullmatch(line)]
            assert not warnings,warnings
            found=pat.findall(log)
            assert len(found)==len(expected),(found,expected)
            names=[name.rsplit('.',1)[-1] for name,_ in found]
            assert names==expected and len(set(names))==len(names),(names,expected)
            for _,ax in found:
              assert {s.strip() for s in ax.split(',') if s.strip()}<=allowed,ax
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.c' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,['a','b','c'])
          mutants=[good.replace('Quot.sound','sorryAx',1),
                   good.replace('Quot.sound','Foreign.axiom',1),
                   good+good,'',good+'warning: unknown\n',good+'error: failed proof\n']
          for i,bad in enumerate(mutants):
            try:audit(bad,['a','b','c'])
            except AssertionError:pass
            else:raise AssertionError(('negative auditor mutation passed',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'error:' not in cold and 'sorryAx' not in cold
          audit((root/'source-axioms.log').read_text(),[
              'originalFock_equal_actions_implies_difference_commutes',
              'originalFock_equal_columns_implies_difference_commutes',
              'originalFock_equal_column_family_implies_difference_commutes'])
          audit((root/'consumer.log').read_text(),[
              'originalFock_equal_actions_implies_difference_commutes_consumer',
              'originalFock_equal_columns_implies_difference_commutes_consumer',
              'originalFock_equal_gamma_columns_difference_commutes_consumer'])
          print('BFSS_W0C2B2_E0_R2_3_SOURCE_3_CONSUMER_2_GAMMA_CONTROLS_6_MUTANTS_STRICT_GREEN')
          PY
      - name: Preserve original E0 provider ZIP for independent Git integrity archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-w0c2b2-e0-r2-original-evidence
          path: /home/runner/work/_temp/bfss-w0c2b2-e0-r2/
          retention-days: 14
          if-no-files-found: warn
