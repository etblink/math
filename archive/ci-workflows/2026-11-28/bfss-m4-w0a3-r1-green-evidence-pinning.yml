name: BFSS W0A3 R1 provider original GREEN evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0a3-r1-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  pin-provider-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check exact mathematical source and last accepted ancestor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A3OriginalComplexPureTensorGammaTransport.lean)" = "3a8d37dd0b065345b0a27529830dd0a1ee99a5b3"
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0A3OriginalComplexPureTensorIndependentConsumer.lean)" = "18ebec2e1265b2efd5e78baa69e0fbe9675f8c32"
          python3 - <<'PY'
          import json
          s=json.load(open("BFSS_GATE_STATE.json"))
          assert s["active"]["gate"]=="P3-M4-W0A3" and s["active"]["attempt"]=="R1"
          assert s["active"]["status"]=="PENDING_STRICT_CI" and not s["active"]["qualification"]
          assert s["last_qualified"]["gate"]=="P3-M4-W0A2" and s["last_qualified"]["run_id"]==44048184200
          PY
      - name: Independently retrieve original ZIP rehash six members and approved axiom reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          art=14314887042
          run=44051746176
          tested="eb248117ccf9913c837c7ce3d113be1384a11377"
          sha256="a7cf6534bc40bdc1edd5ef99e7c7519f9d4cfec85339e2dd5d24ce076a3d578d"
          size=13857
          uri=f"https://api.github.com/repos/etblink/math/actions/artifacts/{art}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(uri,headers=headers),timeout=60) as res: meta=json.load(res)
          assert meta["id"]==art and meta["size_in_bytes"]==size and meta["digest"]=="sha256:"+sha256
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(uri+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302,e
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=90) as response: raw=response.read()
          else:
              with response: raw=response.read()
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha256
          expected={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={"propext","Classical.choice","Quot.sound"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0A3_ORIGINAL_COMPLEX_PURE_TENSOR_W0A2_GREEN_DONORS_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9127 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert "BFSS_W0A3_ORIGINAL_COMPLEX_PURE_TENSOR_1_SOURCE_1_CONSUMER_2_CONTROLS_STRICT_GREEN" in z.read("auditor.log").decode()
              for name,root in [
                  ("source-axioms.log","originalComplexEquiv_pureTensorGenerator_eq_activeGamma"),
                  ("consumer.log","originalComplexEquiv_pureTensorGenerator_consumer")]:
                  txt=z.read(name).decode()
                  found=pat.findall(txt)
                  assert "error:" not in txt and "sorryAx" not in txt
                  assert len(found)==1 and found[0][0].rsplit(".",1)[-1]==root
                  assert {a.strip() for a in found[0][1].split(",") if a.strip()}<=allowed
              print("BFSS_W0A3_PROVIDER_ORIGINAL_REHASH_PASS",json.dumps({
                  "artifact":art,"run":run,"size":size,"sha256":sha256,
                  "members":[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
                  },sort_keys=True))
          dest=Path("research/quantum-information/diagnostics/BFSS_M4_W0A3_R1_44051746176_evidence.zip")
          assert not dest.exists()
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(raw)
          PY
      - name: Git-pin only original ZIP on unified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path="research/quantum-information/diagnostics/BFSS_M4_W0A3_R1_44051746176_evidence.zip"
          git add -- "$path"
          test "$(git diff --cached --name-only)" = "$path"
          test "$(wc -c < "$path" | tr -d ' ')" = 13857
          git commit -m "BFSS W0A3: preserve byte-identical original strict GREEN ZIP"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
