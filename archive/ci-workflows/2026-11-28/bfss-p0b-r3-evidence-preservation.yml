name: BFSS P0B R3 exact GREEN artifact preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths: [.github/workflows/bfss-p0b-r3-evidence-preservation.yml]
permissions:
  actions: read
  contents: read
jobs:
  preserve-exact-original-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rehash and expose exact original diagnostic ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,base64,zipfile,io
          api="https://api.github.com/repos/etblink/math/actions/artifacts/14273998605"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=60) as r:
              m=json.load(r)
          expected="4b106db2f5be4ee3717c74616f96a99633b3872d2bc3d678346c1c29127595cf"
          assert m["id"]==14273998605 and m["size_in_bytes"]==3944
          assert m["workflow_run"]["id"]==43962066769
          assert m["workflow_run"]["head_sha"]=="becb76924cabe59681dade936eda971ec1254ee3"
          assert m["digest"]=="sha256:"+expected
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              r=opener.open(urllib.request.Request(api+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=60) as r:
                  data=r.read()
          else:
              with r:
                  data=r.read()
          assert len(data)==3944
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert set(names)=={"tested-commit.txt","preflight.log","cold-source.log","source-axioms.log","consumer.log"},names
              assert z.read("tested-commit.txt").decode().strip()=="becb76924cabe59681dade936eda971ec1254ee3"
              pre=z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "PREFLIGHT_PASS" in pre
              import re
              allowed={"propext","Classical.choice","Quot.sound"}
              allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
              def audit(text):
                  assert "error:" not in text and "sorryAx" not in text
                  bad=[line for line in text.splitlines() if "warning:" in line and not allowed_warning.fullmatch(line)]
                  assert not bad,bad
              def roots(text,expected_names):
                  audit(text)
                  reports=pattern.findall(text)
                  assert len(reports)==2
                  assert {full.rsplit(".",1)[-1] for full,_ in reports}==set(expected_names)
                  assert len({full for full,_ in reports})==2
                  assert all({a.strip() for a in raw.split(",") if a.strip()}<=allowed for _,raw in reports)
                  return [{"name":full,"axioms":[a.strip() for a in raw.split(",") if a.strip()]} for full,raw in reports]
              audit(cold)
              assert "Build completed successfully (8964 jobs)." in cold
              source_reports=roots(z.read("source-axioms.log").decode(),["originalSource48BivectorK_plane_antisym","originalSource48BivectorK_plane_half"])
              consumer_reports=roots(z.read("consumer.log").decode(),["originalSource48BivectorK_plane_antisym_consumer","originalSource48BivectorK_plane_half_consumer"])
              assert "BFSS_M4_LB1P0B_CHECKPOINT_FIRST_ATTEMPT_AND_6_NEGATIVE_CONTROLS_PASS" in pre
              assert "BFSS_M4_LB1P0B_EXACT_SPARSE_NORMALIZATION_DONORS_2_CONSUMERS_3_CONTROLS_PREFLIGHT_PASS" in pre
              entries=[{"name":n,"bytes":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in names]
          print("BFSS_P0B_R3_ORIGINAL_ZIP_REHASH_PASS "+json.dumps({"artifact_id":14273998605,"original_run":43962066769,"tested_sha":"becb76924cabe59681dade936eda971ec1254ee3","bytes":len(data),"sha256":actual,"zip_integrity":"PASS","entries":entries,"cold_jobs":8964,"source_reports":source_reports,"consumer_reports":consumer_reports,"claim_scope":"elementary original Source48 normalization only"},sort_keys=True))
          print("BFSS_P0B_R3_ORIGINAL_ZIP_BASE64 "+base64.b64encode(data).decode())
          PY
