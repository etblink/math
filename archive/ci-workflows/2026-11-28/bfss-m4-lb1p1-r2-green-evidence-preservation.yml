name: BFSS P1 R2 original GREEN artifact independent preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths: [.github/workflows/bfss-m4-lb1p1-r2-green-evidence-preservation.yml]

permissions:
  actions: read
  contents: read

jobs:
  rehash-exact-original-p1-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Independently validate and expose exact P1 R2 original ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,zipfile,base64,io,re
          aid=14290894037
          run=43998813826
          tested="de3af5cd0f7aa82de8aa9c7439bee46d02a37a02"
          digest="6bcfef6696d6399c3f03ade5c0f97a732ee2f802ba9ab8ff13e6e6734d0db9a6"
          expected_len=3888
          url="https://api.github.com/repos/etblink/math/actions/artifacts/"+str(aid)
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r: metadata=json.load(r)
          assert metadata["id"]==aid and metadata["size_in_bytes"]==expected_len
          assert metadata["digest"]=="sha256:"+digest
          assert metadata["workflow_run"]["id"]==run and metadata["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):return None
          try:
              r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as exc:
              assert exc.code==302,exc
              signed=exc.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=60) as r: archive=r.read()
          else:
              with r: archive=r.read()
          assert len(archive)==expected_len
          assert hashlib.sha256(archive).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"tested-commit.txt","preflight.log","cold-source.log","source-axioms.log","consumer.log"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_M4_LB1P1_SOURCE_CONSUMER_DONOR_TOOLCHAIN_STOP_RULE_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (8965 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              allowed={"propext","Classical.choice","Quot.sound"}
              pat=re.compile(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]")
              def check(name, expected):
                  t=z.read(name).decode()
                  assert "error:" not in t and "sorryAx" not in t
                  entries=pat.findall(t)
                  assert len(entries)==2,(name,entries)
                  labels=[f.rsplit(".",1)[-1] for f,_ in entries]
                  assert len(set(labels))==2 and set(labels)==set(expected),(name,labels)
                  for theorem,axioms in entries:
                      assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(theorem,axioms)
                  return [{"theorem":f,"axioms":[x.strip() for x in v.split(",") if x.strip()]} for f,v in entries]
              src=check("source-axioms.log",[
                  "originalFock_fourFactor_commutator_from_two_covariances",
                  "originalSource48_fourMajorana_commutator"])
              con=check("consumer.log",[
                  "originalFock_fourFactor_conditional_consumer",
                  "originalSource48_fourMajorana_consumer"])
              entries=[{"name":n,"bytes":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
          print("BFSS_P1_R2_ORIGINAL_GREEN_ZIP_REHASH_PASS "+json.dumps({
              "artifact_id":aid,"strict_run":run,"tested_sha":tested,"bytes":len(archive),"sha256":digest,
              "cold_jobs":8965,"zip_integrity":"PASS","entries":entries,"source_reports":src,
              "consumer_reports":con,"claim_ceiling":"P1 original four-Majorana commutator only"},sort_keys=True))
          print("BFSS_P1_R2_ORIGINAL_GREEN_ZIP_BASE64 "+base64.b64encode(archive).decode())
          PY
