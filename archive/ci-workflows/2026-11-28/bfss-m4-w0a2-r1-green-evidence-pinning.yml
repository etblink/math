name: BFSS W0A2 R1 provider original GREEN ZIP Git preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0a2-r1-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  pin-original-w0a2-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Audit frozen mathematical source, consumer and last qualified W0A1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A2OriginalRealCliffordGammaTransport.lean)" = "d444e0c08b4a3ae63653c9807c39c140940a67be"
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0A2OriginalRealCliffordGammaIndependentConsumer.lean)" = "b9d9dee2bb6f72d959f9602a8b09154fb439879e"
          python3 - <<'PY'
          import json
          s=json.load(open("BFSS_GATE_STATE.json"))
          assert s["active"]["gate"]=="P3-M4-W0A2" and s["active"]["attempt"]=="R1"
          assert s["active"]["status"]=="PENDING_STRICT_CI" and not s["active"]["qualification"]
          assert s["last_qualified"]["gate"]=="P3-M4-W0A1" and s["last_qualified"]["run_id"]==44043503665
          PY
      - name: Independently fetch, rehash and inspect original six-member CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          art=14313710380
          run=44048184200
          tested="58219d2de55b7bba212effe50deec3d27eb361ac"
          sha256="543977c735a7f5fa11b852b23ef40e6f43d6b9850de4ed925f241b9e120904a6"
          size=13853
          uri=f"https://api.github.com/repos/etblink/math/actions/artifacts/{art}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(uri,headers=headers),timeout=60) as res: meta=json.load(res)
          assert meta["id"]==art and meta["size_in_bytes"]==size and meta["digest"]=="sha256:"+sha256
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(uri+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302,e
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=90) as response: raw=response.read()
          else:
              with response: raw=response.read()
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha256
          expected={"auditor.log","consumer.log","cold-source.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          approved={"propext","Classical.choice","Quot.sound"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0A2_ORIGINAL_REAL_GENERATOR_W0A1_GREEN_W0A0_RED_GREEN_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9126 jobs)." in cold and "error:" not in cold and "sorryAx" not in cold
              assert "BFSS_W0A2_ORIGINAL_REAL_CLIFFORD_1_SOURCE_1_CONSUMER_2_CONTROLS_STRICT_GREEN" in z.read("auditor.log").decode()
              names={"source-axioms.log":"originalComplexEquiv_realGenerator_eq_activeGamma",
                     "consumer.log":"originalComplexEquiv_realGenerator_consumer"}
              for n,root in names.items():
                  report=z.read(n).decode()
                  assert "error:" not in report and "sorryAx" not in report
                  found=pat.findall(report)
                  assert len(found)==1 and found[0][0].split(".")[-1]==root
                  assert {a.strip() for a in found[0][1].split(",") if a.strip()}<=approved
              print("BFSS_W0A2_PROVIDER_ORIGINAL_REHASH_PASS",json.dumps({
                  "id":art,"run":run,"sha":tested,"size":size,"sha256":sha256,
                  "members":[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
                  },sort_keys=True))
          dest=Path("research/quantum-information/diagnostics/BFSS_M4_W0A2_R1_44048184200_evidence.zip")
          assert not dest.exists()
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(raw)
          PY
      - name: Commit only exact provider original archive to unified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path="research/quantum-information/diagnostics/BFSS_M4_W0A2_R1_44048184200_evidence.zip"
          git add -- "$path"
          test "$(git diff --cached --name-only)" = "$path"
          test "$(wc -c < "$path" | tr -d ' ')" = 13853
          git commit -m "BFSS W0A2: preserve byte-identical original strict GREEN ZIP"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
