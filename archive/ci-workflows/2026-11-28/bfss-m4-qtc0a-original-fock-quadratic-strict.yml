name: BFSS M4 QTC0A original Fock weighted quadratic strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean
      - lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean
      - .github/workflows/bfss-m4-qtc0a-original-fock-quadratic-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-qtc0a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fock-quadratic-leibniz-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify frozen source, consumer, donors, evergreen and qualified predecessor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-qtc0a"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-qtc0a/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-qtc0a/preflight.log"
          import json,re,hashlib,subprocess
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean":"9d1dc845bea73d8e07549c69d9ef07804509f52e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1L2AbstractOriginalFockCovarianceLeibniz.lean":"b4012951a26aa7573db513adab3d7ce27396db7e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C0OriginalSource48BivectorCommutatorExpansion.lean":"8b11930128c92bb8a499970593252de942052b1b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB0OriginalSource48MajoranaBivectorCAR.lean":"d08200fae8ef6c9c9544414307ad537f1eeaa4a4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean":"9a2899e24c02cb5a5dd58159605a34195fce3856","contributions/bfss-kotler/BFSS_PROJECT_LEAD_EVERGREEN_QUALIFIED_REUSE_LEDGER_2026_11_10.md":"4a8604acb431247694eb0a34bef1086a66e27af7","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,want in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==want,(path,want,got)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean").read_text()
          expected_src=["originalFock_commutator_complex_smul",
                        "originalFock_quadratic_covariance_expanded"]
          expected_con=["originalFock_complex_scalar_consumer",
                        "originalFock_quadratic_covariance_consumer"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==expected_src
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==expected_con
          assert len(re.findall(r"(?m)^example\b",consumer))==4
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxRecDepth" not in code and "maxHeartbeats" not in code
          assert "Fermion 2 →L[ℂ] Fermion 2" in source
          assert "originalFock_product_covariance_from_two_hypotheses" in source
          assert "originalFockQuadratic" in source and "(1 / 4 : ℂ)" in source
          assert "originalFock_commutator_doubleSum" in source
          assert "originalFock_quadratic_covariance_expanded T x a b hcov" in consumer
          for lab in ("Fin 0", "Fin 1", "Fin 2", "Fin 3"):
              assert lab in consumer,lab
          assert "sourceNormalizedGamma" not in source
          assert "originalSource48BivectorK" not in source
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          assert s["branch"]=="integration/bfss-unified-research-20261108"
          assert s["last_qualified"]["gate"]=="P3-M4-LB1P1"
          assert s["last_qualified"]["run_id"]==43998813826
          assert s["active"]["gate"]=="P3-M4-QTC0A"
          assert s["active"]["status"]=="PENDING_STRICT_CI"
          assert s["active"]["attempt"]=="R1" and s["active"]["qualification"] is False
          assert s["active"]["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean"]
          assert s["active"]["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean"]
          assert s["active"]["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          prev=s["previous_active_LB1P1_R2_qualified"]
          assert prev["gate"]=="P3-M4-LB1P1" and prev["status"]=="GREEN_QUALIFIED"
          assert prev["artifact_sha256"]=="6bcfef6696d6399c3f03ade5c0f97a732ee2f802ba9ab8ff13e6e6734d0db9a6"
          assert hashlib.sha256(Path(prev["evidence_archive"]).read_bytes()).hexdigest()==prev["artifact_sha256"]
          stopped=s["previous_active_CT1G0_R2_stopped"]
          assert stopped["gate"]=="P3-M4-CT1G0" and stopped["stopped"] is True
          assert stopped["run_id"]==43991790285 and stopped["previous_red_run"]==43988822460
          assert stopped["stop_reason"]=="TWO_ANALOGOUS_NATIVE_RECURSION_FAILURES"
          assert hashlib.sha256(Path(stopped["evidence_archive"]).read_bytes()).hexdigest()==stopped["artifact_sha256"]
          print("BFSS_M4_QTC0A_SOURCE_CONSUMER_EVERGREEN_DONORS_PREDECESSOR_AND_STOP_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native Fock quadratic source, independent consumer and axiom auditor
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-qtc0a"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC0AOriginalFockWeightedQuadraticCovariance 2>&1 | tee "$root/cold-source.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-qtc0a"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-1600:]
              warnings=[l for l in log.splitlines() if "warning:" in l and not allow_warning.fullmatch(l)]
              assert not warnings,warnings[:4]
              entries=pat.findall(log)
              assert len(entries)==len(expected),(entries,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in entries]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for theorem,axioms in entries:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(theorem,axioms)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b"))+"\n"
          audit(fixture,["a","b"])
          mutants=[
              fixture.replace("Quot.sound","sorryAx",1),
              fixture.replace("Quot.sound","Unapproved.axiom",1),
              fixture.replace("'N.b'","'N.a'"),
              "\n".join(fixture.splitlines()[:1])+"\n",
              fixture+"warning: unexpected warning\n",
              fixture+"error: source theorem failed\n"]
          for index,bad in enumerate(mutants):
              try: audit(bad,["a","b"])
              except AssertionError: pass
              else: raise AssertionError(("negative auditor accepted",index))
          print("BFSS_M4_QTC0A_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),[
              "originalFock_commutator_complex_smul",
              "originalFock_quadratic_covariance_expanded"])
          audit((root/"consumer.log").read_text(),[
              "originalFock_complex_scalar_consumer",
              "originalFock_quadratic_covariance_consumer"])
          print("BFSS_M4_QTC0A_ORIGINAL_FOCK_WEIGHTED_QUADRATIC_2_SOURCE_2_CONSUMER_4_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve full original preflight, cold source, source and consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-qtc0a-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-qtc0a/
          if-no-files-found: warn
          retention-days: 14
