name: BFSS W0H1B R1 original native source RED evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0h1b-r1-original-native-red-preservation.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-R1-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen W0H1B R1 source and accepted donors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify original source and immutable original W0H1A GREEN donor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1BOriginalAdjoinFullCliffordCommutant.lean)" = 94049ca4a90eeff2cacf423e2fa31250d316b6a1
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0H1BOriginalAdjoinFullCliffordIndependentConsumer.lean)" = 3a5d04948ff1adae3fabd6f16da664d4a85725bf
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0h1b-r1-original-adjoin-full-commutant-strict.yml)" = d05f7de7d7a3acefba34221858cf716f8d8e02a1
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0H1A_R2_44151962609_GREEN_evidence.zip)" = 4437e182a35763d448b9780d158df926d073d839
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a=s["active"]
          assert a["gate"]=="P3-M4-W0H1B" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="94049ca4a90eeff2cacf423e2fa31250d316b6a1"
          assert a["consumer_blob"]=="3a5d04948ff1adae3fabd6f16da664d4a85725bf"
          assert a["workflow_blob"]=="d05f7de7d7a3acefba34221858cf716f8d8e02a1"
          assert a["contract_commit"]=="cccc758d74bdddf90c593dfce63f4bbdd7e7298b"
          assert s["last_qualified"]["gate"]=="P3-M4-W0H1A"
          assert s["last_qualified"]["run_id"]==44151962609
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert not Path("research/quantum-information/diagnostics/BFSS_M4_W0H1B_R1_44160611850_SOURCE_RED_evidence.zip").exists()
          PY
      - name: Retrieve original provider ZIP and original full Actions job log, verify failure and SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          run=44160611850
          job=134313075652
          artifact=14364306805
          tested="cbbcfc739d68451173c4825e5e656f76eee15afb"
          digest="58c5e1176099ce9b7764eba910d831b65a4afcb3de74b316f92cc5a996a6e234"
          size=13841
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def fetch_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:
                  return json.load(response)
          runinfo=fetch_json(f"{prefix}/actions/runs/{run}")
          meta=fetch_json(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["id"]==run and runinfo["status"]=="completed"
          assert runinfo["conclusion"]=="failure" and runinfo["head_sha"]==tested
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          def download(url):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"preflight.log","cold-source.log","tested-commit.txt"},z.namelist()
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0H1B_W0H1A_SOURCE_EXACT_GREEN_W0B1_SOURCE_STOP_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Unknown constant" in cold and "Subalgebra.mem_centralizer_iff.mp" in cold
              assert "P3M4W0H1BOriginalAdjoinFullCliffordCommutant.lean:58:15" in cold
              assert "unsolved goals" in cold and "sorryAx" in cold and "error: build failed" in cold
              assert "originalSourceCentralizerPullback_eq_top" in cold
              assert "originalComplexEquiv_fullClifford_commutes" in cold
              members=[{"name":name,"size":len(z.read(name)),"sha256":hashlib.sha256(z.read(name)).hexdigest()} for name in sorted(z.namelist())]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(full)>20000
          assert b"Subalgebra.mem_centralizer_iff.mp" in full
          assert b"Unknown constant" in full and b"sorryAx" in full
          assert b"BFSS_W0H1B_W0H1A_SOURCE_EXACT_GREEN_W0B1_SOURCE_STOP_PREFLIGHT_PASS" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0H1B_R1_{run}_SOURCE_RED_evidence.zip"
          log=root/f"BFSS_W0H1B_R1_{run}_complete_job.log"
          manifest=root/f"BFSS_W0H1B_R1_{run}_SOURCE_RED_evidence_manifest.json"
          for p in (archive,log,manifest):assert not p.exists(),p
          archive.write_bytes(raw)
          log.write_bytes(full)
          record={
            "gate":"P3-M4-W0H1B","attempt":"R1","status":"RED_UNQUALIFIED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
            "source_blob":"94049ca4a90eeff2cacf423e2fa31250d316b6a1",
            "consumer_blob":"3a5d04948ff1adae3fabd6f16da664d4a85725bf",
            "workflow_blob":"d05f7de7d7a3acefba34221858cf716f8d8e02a1",
            "failed_line":58,"failure_phase":"COLD_ORIGINAL_LEAN_SOURCE",
            "failure_reason":"Unknown constant Subalgebra.mem_centralizer_iff.mp. First source theorem compiled with only permitted axioms; second theorem had sorryAx.",
            "qualified_original_theorems_in_this_run":0,
            "first_theorem_compile_result":"COMPILED_IN_RED_RUN_ONLY_NOT_QUALIFIED_GATE",
            "source_reports_clean":1,"source_reports_failed":1,"consumer_reports":0,
            "last_qualified_source_exact_original_run":44151962609,
            "stopped_W0B1_native_red_runs":[44117272657,44127193329]
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0H1B_R1_NATIVE_RED_PROVIDER_ORIGINAL_ZIP_AND_FULL_JOB_LOG_REHASH_PASS",json.dumps(record,sort_keys=True))
          PY
      - name: Git-pin original provider-native RED ZIP, full job log and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0H1B_R1_44160611850_SOURCE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0H1B_R1_44160611850_complete_job.log research/quantum-information/diagnostics/BFSS_W0H1B_R1_44160611850_SOURCE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0H1B_R1_44160611850_SOURCE_RED_evidence.zip | tr -d ' ')" = 13841
          git commit -m "BFSS W0H1B R1: preserve original centralizer type-error RED ZIP, complete Actions log and digest manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
