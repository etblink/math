name: BFSS W0B0 R1 source RED original evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0b0-r1-original-red-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-source-red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact W0B0 R1 and frozen W0A4 STOP ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Validate R1 original source and stop checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B0OriginalGammaCommutantInduction.lean)" = "d3cbdd7446f06e203959776abee3629b8269f572"
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0B0OriginalGammaCommutantIndependentConsumer.lean)" = "159c561d6e73e3c86959cd239deb10984064e92e"
          python3 - <<'PY'
          import json
          x=json.load(open("BFSS_GATE_STATE.json"))
          assert x["last_qualified"]["gate"]=="P3-M4-W0A3" and x["last_qualified"]["run_id"]==44051746176
          assert x["active"]["gate"]=="P3-M4-W0B0" and x["active"]["attempt"]=="R1"
          assert x["active"]["status"]=="PENDING_STRICT_CI" and x["active"]["qualification"] is False
          assert x["previous_active_W0A4_R2_stopped"]["stopped"] is True
          PY
      - name: Independently fetch and rehash original failed provider ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          artifact=14320782146
          run=44064728599
          tested="e668c0a6a542a5f5712c0bcaf9c219e96b3649ed"
          digest="d7ade4d6b28b8ea442d2a7130b5c9a20a40e1d4481d0a7ff5d54704234483010"
          size=13540
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{artifact}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as res:
              meta=json.load(res)
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302,e
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=90) as response: raw=response.read()
          else:
              with response: raw=response.read()
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"cold-source.log","preflight.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0B0_ORIGINAL_GAMMA_COMMUTANT_W0A3_GREEN_W0A4_R1_R2_STOP_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "failed to synthesize instance of type class" in cold
              assert "SMulCommClass ℝ Op Op" in cold
              assert "P3M4W0B0OriginalGammaCommutantInduction.lean:41:8" in cold
              assert "sorryAx" in cold
              assert "build failed" in cold
              assert "Build completed successfully" not in cold
              print("BFSS_W0B0_R1_ORIGINAL_RED_REHASH_PASS",json.dumps({
                "run":run,"artifact":artifact,"tested":tested,"size":size,"sha256":digest,
                "members":[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
              },sort_keys=True))
          path=Path("research/quantum-information/diagnostics/BFSS_M4_W0B0_R1_44064728599_RED_evidence.zip")
          assert not path.exists()
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(raw)
          PY
      - name: Git-pin only exact provider-original RED bytes on unified integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path="research/quantum-information/diagnostics/BFSS_M4_W0B0_R1_44064728599_RED_evidence.zip"
          git add -- "$path"
          test "$(git diff --cached --name-only)" = "$path"
          test "$(wc -c < "$path" | tr -d ' ')" = 13540
          git commit -m "BFSS W0B0: preserve provider-original R1 RED typeclass diagnostic ZIP"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
