name: BFSS W0C2B0M R1 exact preflight RED preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0m-r1-preflight-red-preservation.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-w0c2b0m-r1-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staged original complex coefficient gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify unqualified source and original prior REDs remain frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficient.lean)" = 19e20ca4138c0303c28e3ab46d4b2fcf3a496bb0
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumer.lean)" = 14f366562c5986f58fd282a09e28720e7ea171b5
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0m-r1-original-complex-nested-strict.yml)" = c730b0a7294e41d4edcb1145d2958c01061a4135
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip)" = 4117bd19a0a8d1614df176e72d69a9b628de19da
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip)" = 3f15c1c8bcf0e057e3de2055abc6ec00e8b931ec
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2B0M","R1","PENDING_STRICT_CI",False)
          assert q["gate"]=="P3-M4-W0C2A" and q["run_id"]==44213315719 and len(s["accepted_anchors"])==24
          assert s["previous_active_W0C2B0_R2_stopped"]["native_red_count"]==2
          paths=["research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence.zip",
                 "research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44251761371_complete_job.log",
                 "research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence_manifest.json"]
          assert all(not Path(x).exists() for x in paths)
          print("BFSS_W0C2B0M_R1_PREFLIGHT_ONLY_ARCHIVE_PREFLIGHT_PASS")
          PY
      - name: Re-download original preflight ZIP and complete job log with integrity checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          prefix="https://api.github.com/repos/etblink/math"
          run=44251761371;job=134623909530;artifact=14403608294
          tested="55175988156ac97e075d091ddfd1cc4cfac1a54e"
          size=392;digest="176992321525e4ce947ef720e8e5c7c91bef09a41ada9d9fad9866d1e2e069a3"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return json.load(response)
          r=getjson(f"{prefix}/actions/runs/{run}")
          j=getjson(f"{prefix}/actions/jobs/{job}")
          a=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert r["head_sha"]==tested and r["conclusion"]=="failure" and r["run_attempt"]==1
          assert j["id"]==job and j["run_id"]==run and j["conclusion"]=="failure"
          assert any(x["name"].startswith("Checkout exact unified") and x["conclusion"]=="success" for x in j["steps"])
          assert any(x["name"].startswith("Preflight original complex") and x["conclusion"]=="failure" for x in j["steps"])
          assert any(x["name"].startswith("Restore pinned Lean") and x["conclusion"]=="skipped" for x in j["steps"])
          assert any(x["name"].startswith("Cold original complex nested") and x["conclusion"]=="skipped" for x in j["steps"])
          assert a["id"]==artifact and a["size_in_bytes"]==size and a["digest"]=="sha256:"+digest
          assert a["workflow_run"]["id"]==run and a["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try: response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"];assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert names=={"preflight.log","tested-commit.txt"},names
              assert z.read("tested-commit.txt").decode().strip()==tested
              pre=z.read("preflight.log").decode()
              assert 'File "<stdin>", line 30' in pre and "AssertionError" in pre
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(full)>15000 and b'File "<stdin>", line 30' in full and b"AssertionError" in full
          root=Path("research/quantum-information/diagnostics");root.mkdir(parents=True,exist_ok=True)
          zip_path=root/"BFSS_M4_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence.zip"
          job_path=root/"BFSS_W0C2B0M_R1_44251761371_complete_job.log"
          manifest=root/"BFSS_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence_manifest.json"
          for p in [zip_path,job_path,manifest]:assert not p.exists(),p
          zip_path.write_bytes(raw);job_path.write_bytes(full)
          manifest.write_text(json.dumps({
              "gate":"P3-M4-W0C2B0M","attempt":"R1","status":"PREFLIGHT_BEFORE_LEAN_UNQUALIFIED",
              "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
              "original_zip":{"path":str(zip_path),"size":size,"sha256":digest,"members":members},
              "original_job_log":{"path":str(job_path),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
              "source_blob":"19e20ca4138c0303c28e3ab46d4b2fcf3a496bb0",
              "consumer_blob":"14f366562c5986f58fd282a09e28720e7ea171b5",
              "workflow_blob":"c730b0a7294e41d4edcb1145d2958c01061a4135",
              "failure_phase":"PREFLIGHT_BEFORE_LEAN",
              "causal_error":"regex ^import<space> matches with trailing space but expected list has import without space",
              "line_number_in_python_preflight":30,
              "native_source_executed":False,"consumer_executed":False,
              "historical_real_coefficient_native_red_count":2,
              "last_qualified_run":44213315719,
              "claim_ceiling":"No original complex coefficient theorem qualified from this preflight RED"
          },sort_keys=True,indent=2)+"\n")
          print("BFSS_W0C2B0M_R1_EXACT_PREFLIGHT_RED_ZIP_FULL_LOG_MEMBER_SHA_CRC_PASS")
          PY
      - name: Git-pin provider original preflight RED ZIP full log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44251761371_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C2B0M R1: preserve exact preflight-only RED ZIP full log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
