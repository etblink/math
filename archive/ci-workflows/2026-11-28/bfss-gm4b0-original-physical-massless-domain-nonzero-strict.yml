name: BFSS GM4B0 original physical massless domain nonzero strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4B0OriginalPhysicalMasslessNonzeroDomainWitness.lean'
      - 'lean/diagnostics/BFSSGM4B0OriginalPhysicalMasslessNonzeroIndependentAudit.lean'
      - '.github/workflows/bfss-gm4b0-original-physical-massless-domain-nonzero-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm4b0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-physical-massless-nonzero:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Exact source and consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm4b0-nonzero"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm4b0-nonzero/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum lean/lean-toolchain lean/lake-manifest.json |
            tee "$RUNNER_TEMP/bfss-gm4b0-nonzero/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm4b0-nonzero/preflight.log"
          import subprocess,re,json
          from pathlib import Path
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean":"84853fb624289121938e0fb4d2b45afdc16a74c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction.lean":"a42c8018a8d9fde12b530a81fa96e9765c8cb699",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K2BNonzeroPhysicalL2Probe.lean":"a288a1bccb847f9544211709fce75c7c7a519453",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe.lean":"3891889c5f771df5dca57237c1c21dc8868ecffb",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","bca1f54d6ab6b22a7d8f24a2c2c1c268a41c05a6","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4B0OriginalPhysicalMasslessNonzeroDomainWitness.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM4B0OriginalPhysicalMasslessNonzeroIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==[
            "pairedInvariantSmoothCore_mem_physicalMasslessDomain",
            "pairedOriginalPhysicalMasslessDomain_has_nonzero",
            "pairedOriginalPhysicalMasslessDomain_ne_bot"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "pairedInvariantSmoothCore_mem_physicalMasslessDomain",
            "pairedOriginalPhysicalMasslessDomain_has_nonzero",
            "pairedOriginalPhysicalMasslessDomain_ne_bot"]
          assert re.findall(r"(?m)^import (\S+)$",t)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM4B0OriginalPhysicalMasslessNonzeroDomainWitness"]
          assert re.findall(r"(?m)^theorem (\S+)",t)==[
            "originalPhysicalMasslessNaturalDomainNonzero",
            "originalPhysicalMasslessDomainNotBottom"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",t)==[
            "originalPhysicalMasslessNaturalDomainNonzero",
            "originalPhysicalMasslessDomainNotBottom"]
          for value in [s,t]:
              assert "set_option autoImplicit false" in value
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",value)
              for bad in ["set_option maxRecDepth","set_option maxHeartbeats",
                          "set_option synthInstance.maxHeartbeats"]:
                  assert bad not in value
          assert "pairedOriginalCore_memMasslessDomain" in s
          assert "radialBumpSmoothCore_toL2" in s and "radialBumpL2_ne_zero" in s
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM4B0_PHYSICAL_MASSLESS_NONZERO_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm4b0-nonzero/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original physical domain native and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm4b0-nonzero"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM4B0OriginalPhysicalMasslessNonzeroDomainWitness 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM4B0OriginalPhysicalMasslessNonzeroIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm4b0-nonzero"
          for fn in ["native-source.log","strict-axioms.log"]:
              data=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in data,(fn,bad,data[-6000:])
          native=(E/"native-source.log").read_text()
          for name in [
            "FCP.BFSSGM4B0.pairedInvariantSmoothCore_mem_physicalMasslessDomain",
            "FCP.BFSSGM4B0.pairedOriginalPhysicalMasslessDomain_has_nonzero",
            "FCP.BFSSGM4B0.pairedOriginalPhysicalMasslessDomain_ne_bot"]:
              assert "'"+name+"' depends on axioms:" in native or "'"+name+"' does not depend on any axioms" in native,("MISSING_NATIVE_AXIOM_REPORT",name)
          body=(E/"strict-axioms.log").read_text()
          results=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          assert [name for name,_ in results]==[
            "FCP.BFSSGM4B0Independent.originalPhysicalMasslessNaturalDomainNonzero",
            "FCP.BFSSGM4B0Independent.originalPhysicalMasslessDomainNotBottom"],results
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,ax in results:
              assert {x.strip() for x in ax.split(",") if x.strip()}<=allowed,(name,ax)
          print("BFSS_GM4B0_ORIGINAL_SOURCE_NONZERO_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve original native/consumer and first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm4b0-nonzero-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm4b0-nonzero/
          if-no-files-found: warn
          retention-days: 30
