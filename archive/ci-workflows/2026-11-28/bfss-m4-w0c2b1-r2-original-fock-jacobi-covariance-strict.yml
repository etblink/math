name: BFSS M4 W0C2B1 R2 original Fock Jacobi and conditional covariance strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean
      - lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumerR2.lean
      - .github/workflows/bfss-m4-w0c2b1-r2-original-fock-jacobi-covariance-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-m4-w0c2b1-r2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-fock-jacobi:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight qualified N predecessor original donors and frozen negative evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0c2b1-r2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0c2b1-r2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0c2b1-r2/preflight.log"
          import json,re,subprocess,hashlib,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceAction.lean":"db15340dfb46eea78c20549bb6d1616dd99f302b","lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumer.lean":"76f5071b847245fe4173b0dde8205c8b69173b5d","research/quantum-information/BFSS_QIT_SCC_W0C2B1_R1_ORIGINAL_FOCK_JACOBI_COVARIANCE_PRE_GATE_2026_11_17.md":"8309ef707b0cd0776d2a2bf4c019b208ed4765f4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean":"b98cc05a012c98da8016496492d77135fc58ebc8","lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean":"dcbba93f72feb4f60912521f666d748bcf2e1687",".github/workflows/bfss-m4-w0c2b0m-r2-original-complex-nested-strict.yml":"61f2cc992208fb31dfad2740e76425fe4d3c9962","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0NOriginalSource48RealComplexCoefficientAdapter.lean":"c5841055363a6eef713f35e568409dd2fa2b6c9e","lean/diagnostics/BFSSP3M4W0C2B0NOriginalSource48RealComplexCoefficientIndependentConsumer.lean":"3773f069d3da87c7c899596817f02efec639fbfa",".github/workflows/bfss-m4-w0c2b0n-r1-original-source48-real-complex-strict.yml":"d431d74251ba5826baf312534fd6578424306643","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean":"51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb","research/quantum-information/diagnostics/BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip":"3e57a0e7205dc6f34c6f3da90ff3056fa63943ea","research/quantum-information/diagnostics/BFSS_W0C2B0N_R1_44260119108_complete_job.log":"43186ecee898599b9f21e02b2484543e24e79790","research/quantum-information/diagnostics/BFSS_W0C2B0N_R1_44260119108_GREEN_evidence_manifest.json":"4a2e00c318f0b202ebafda249bc6be81e3f0532c","research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip":"547432c9bf3fb0778d6bc060daa6f9a6e9afc004","research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip":"4117bd19a0a8d1614df176e72d69a9b628de19da","research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip":"3f15c1c8bcf0e057e3de2055abc6ec00e8b931ec","research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip":"277b934810e6a999c974917d23a199ccd0be3ddd","research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence.zip":"3e7266878a5eb46fffb753dc852032fc1a196581","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean":"861628fe6322c919bee87e493e1e629d48bfa8bb","lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumerR2.lean":"bd271b47833e2cca9fb80f1d6fca381c8b6a2ccb","research/quantum-information/BFSS_QIT_SCC_W0C2B1_R2_EXPLICIT_JACOBI_DISTRIBUTIVITY_REPAIR_PRE_GATE_2026_11_18.md":"fbf48ed9df07784a079be1254aa721c4b5aa246d",".github/workflows/bfss-m4-w0c2b1-r1-original-fock-jacobi-covariance-strict.yml":"a7e7b89896f5f447ec88f0c548d222be54a5fdee","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1L2AbstractOriginalFockCovarianceLeibniz.lean":"b4012951a26aa7573db513adab3d7ce27396db7e","research/quantum-information/diagnostics/BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip":"98b23994b080a087d77d8317a4758a774f0f1ef2","research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_complete_job.log":"5e96a9c57152a876ae5e772fcca7a462aa91ac1c","research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_NATIVE_RED_evidence_manifest.json":"fcc701f35202253b973c6dc1e48fe2e199554d76"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,got,expected)
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2B1","R2","PENDING_STRICT_CI",False)
          assert (q["gate"],q["attempt"],q["status"],q["qualification"],q["run_id"])==("P3-M4-W0C2B0N","R1","GREEN_QUALIFIED",True,44260119108)
          assert len(s["accepted_anchors"])==26 and s["accepted_anchors"][-1]==q
          assert q["tested_sha"]=="d66a948cfd9741fd4f9428471d9e7f559228276f"
          for kind in ("source","consumer","workflow","evidence_archive","evidence_job_log","evidence_manifest"):
              assert q[kind+"_blob"]==pins[q[kind]],kind
          assert q["artifact_sha256"]=="e68c0260726275649427ee7d4e02c8c954504fd5fd228cd86a7f9a58e0f12761"
          assert q["preservation_run"]==44261708018
          assert a["source"]=="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean" and a["source_blob"]==pins[a["source"]]
          assert a["consumer"]=="lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumerR2.lean" and a["consumer_blob"]==pins[a["consumer"]]
          assert a["workflow"]==".github/workflows/bfss-m4-w0c2b1-r2-original-fock-jacobi-covariance-strict.yml"
          assert a["prospective_receipt"]=="research/quantum-information/BFSS_QIT_SCC_W0C2B1_R2_EXPLICIT_JACOBI_DISTRIBUTIVITY_REPAIR_PRE_GATE_2026_11_18.md" and a["contract_commit"]=="f18004c1bb5ccb92141989a6f0ea50e89942039e"
          assert a["accepted_predecessor_run"]==44260119108
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==4
          assert a["independent_controls"]==4
          assert a["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert s["previous_active_W0C2B0_R2_stopped"]["native_red_count"]==2
          assert s["previous_active_W0C2B0_R2_stopped"]["status"]=="BLOCKED"
          assert s["previous_active_W0C2B0M_R1_NATIVE_RED"]["run_id"]==44252646318
          assert s["previous_active_W0C2B1_R1_NATIVE_RED"]["run_id"]==44263755514
          assert s["previous_active_W0C2B1_R1_NATIVE_RED"]["native_red_count"]==1
          assert s["previous_active_W0C2B1_R1_NATIVE_RED"]["preservation_run"]==44266245618
          assert "simp only [sub_mul, mul_sub, mul_assoc]" in Path(a["source"]).read_text()
          assert "  abel\n" in Path(a["source"]).read_text()
          assert s["w0c2b0m_r2_first_preflight_red"]["run_id"]==44254608894
          assert s["next_planned"]["gate"]=="P3-M4-W0C2B2" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert s["strategic_focus"]["full_bivector_bracket_qualified"] is False
          src=Path(a["source"]).read_text();con=Path(a["consumer"]).read_text()
          roots=["originalFock_commutator_sum","originalFock_commutator_weighted_sum","originalFock_commutator_jacobi","originalFock_commutator_covariance_bracket"]
          assert len(re.findall(r"(?m)^theorem\b",src))==4 and len(re.findall(r"(?m)^theorem\b",con))==4
          assert len(re.findall(r"(?m)^example\b",con))==4
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==roots
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==[x+"_consumer" for x in roots]
          assert len(re.findall(r"(?m)^import ",src))==2 and len(re.findall(r"(?m)^import ",con))==1
          assert con.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2B1OriginalFockJacobiCovarianceActionR2\n")
          for data in (src,con):
              assert "set_option autoImplicit false" in data
              assert "Fermion 2 →L[ℂ] Fermion 2" in data
              for banned in ("sourceNormalizedGamma","originalSource48K_lieDefect",
                  "maxRecDepth","maxHeartbeats","P3M4QTC1OriginalSourceRealComplexQuarterBridge",
                  "P3M4CT1G0OriginalFockJacobiSource48Adapter"):
                  assert banned not in data,banned
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",data)
          for token in ("Finset.mul_sum","Finset.sum_mul","Finset.sum_sub_distrib",
                  "originalFock_commutator_complex_smul","simp only [sub_mul, mul_sub, mul_assoc]","abel",
                  "originalFock_complex_nested_coefficient_bracket",
                  "originalFock_commutator_covariance_bracket"):
              assert token in src,token
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          for name,sha,size in [
            ("BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip","e68c0260726275649427ee7d4e02c8c954504fd5fd228cd86a7f9a58e0f12761",3975),
            ("BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip","fb4cfc3b3b098941576ebdb42650ae0e2abd3dc7996538bf79201ebbc91bf7cd",4080),
            ("BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip","e9242ef864e6f7bdacb76386f94595b1c67b5eb471f0c485de795bd2970d1529",3779),
            ("BFSS_M4_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence.zip","9f75266ae0f91f388918ddda14ffac47a55b1d926cb6dea92d0c7d87fca4e55f",512),("BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip","a0b6dfdd17dfdeceed8483f486e9bd98850bb187033fab457fbb1291f261d8ec",3658)]:
              data=Path("research/quantum-information/diagnostics",name).read_bytes()
              assert len(data)==size and hashlib.sha256(data).hexdigest()==sha,name
              with zipfile.ZipFile(Path("research/quantum-information/diagnostics",name)) as z:
                  assert z.testzip() is None,name
          print("BFSS_W0C2B1_R2_ORIGINAL_FOCK_JACOBI_ONE_NATIVE_RED_PRESERVED_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original Fock Jacobi source independent consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0c2b1-r2"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2B1OriginalFockJacobiCovarianceActionR2 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumerR2.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0c2b1-r2"
          allowed={"propext","Classical.choice","Quot.sound"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log
              warnings=[line for line in log.splitlines() if "warning:" in line and not warning_ok.fullmatch(line)]
              assert not warnings,warnings[:3]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert names==expected and len(set(names))==len(names),(names,expected)
              for _,ax in found:
                  assert {s.strip() for s in ax.split(",") if s.strip()}<=allowed,ax
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.c' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.d' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a","b","c","d"])
          bad=[good.replace("Quot.sound","sorryAx",1),good.replace("Quot.sound","Foreign.axiom",1),good+good,"",good+"warning: unexpected warning\n",good+"error: failed proof\n"]
          for i,case in enumerate(bad):
              try:audit(case,["a","b","c","d"])
              except AssertionError:pass
              else:raise AssertionError(("negative mutation accepted",i))
          cold=(root/"cold-source.log").read_text()
          assert "Build completed successfully" in cold and "error:" not in cold and "sorryAx" not in cold
          audit((root/"source-axioms.log").read_text(),["originalFock_commutator_sum","originalFock_commutator_weighted_sum","originalFock_commutator_jacobi","originalFock_commutator_covariance_bracket"])
          audit((root/"consumer.log").read_text(),["originalFock_commutator_sum_consumer","originalFock_commutator_weighted_sum_consumer","originalFock_commutator_jacobi_consumer","originalFock_commutator_covariance_bracket_consumer"])
          print("BFSS_W0C2B1_R2_ORIGINAL_FOCK_JACOBI_4_SOURCE_4_CONSUMER_4_CONTROLS_SIX_MUTANTS_STRICT_GREEN")
          PY
      - name: Preserve original Fock Jacobi proof and original RED diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0c2b1-r2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0c2b1-r2/
          if-no-files-found: warn
          retention-days: 14
