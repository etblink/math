name: BFSS W0H0 R1 original source GREEN evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0h0-r1-green-original-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-source-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact original W0H0 pending branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact original W0H0 source and consumer and stopped W0B1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H0OriginalScalarImageAdapter.lean)" = 7555f5e17d9f465c1e4b7b04ffc450eb1667fc13
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0H0OriginalScalarImageIndependentConsumer.lean)" = 21c02789f62e5e345eff7caf4e10505f6cbe4961
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0h0-source-exact-scalar-commute-strict.yml)" = 66ca52d2884c2c6dd25885fc1ccaaf5c8f36d135
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0G0_R1_44135729729_GREEN_evidence.zip)" = ed7e477d931b0822ffb5dfd87f1bee5c9f4163ac
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert a["gate"]=="P3-M4-W0H0" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="7555f5e17d9f465c1e4b7b04ffc450eb1667fc13"
          assert a["consumer_blob"]=="21c02789f62e5e345eff7caf4e10505f6cbe4961"
          assert a["workflow_blob"]=="66ca52d2884c2c6dd25885fc1ccaaf5c8f36d135"
          assert a["contract_commit"]=="22d27cfd0bc281e50cf5b0fc036595e1d312a72f"
          assert q["gate"]=="P3-M4-W0G0" and q["run_id"]==44135729729
          assert q["status"]=="GREEN_QUALIFIED" and q["evidence_archive_blob"]=="ed7e477d931b0822ffb5dfd87f1bee5c9f4163ac"
          assert s["last_qualified_source_exact_original_BFSS"]["gate"]=="P3-M4-W0B0"
          assert s["last_qualified_source_exact_original_BFSS"]["run_id"]==44109519633
          assert s["previous_active_W0B1_R2_stopped"]["run_id"]==44127193329
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert s["previous_active_W0B1_R1_RED"]["run_id"]==44117272657
          assert s["next_planned"]["gate"]=="P3-M4-W0H1"
          assert s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert not Path("research/quantum-information/diagnostics/BFSS_M4_W0H0_R1_44139239821_GREEN_evidence.zip").exists()
          PY
      - name: Download provider-original W0H0 GREEN ZIP and full job log, verify all native roots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          artifact=14354113791
          run=44139239821
          job=134237141336
          tested="8760e7ecb1ac5bd0f8c3eb480d752b3c14716819"
          digest="ccb4dea2e4114914c7554a6f6bbb76591de3f4c52be30d0d1bb1a9f4a3c52caa"
          size=13262
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{artifact}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as res:
              meta=json.load(res)
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          def download(u):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(u,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response: return response.read()
              else:
                  with response: return response.read()
          raw=download(url+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={"propext","Classical.choice","Quot.sound"}
          def audit(t,names):
              assert "error:" not in t and "sorryAx" not in t
              found=pat.findall(t)
              assert len(found)==len(names),(found,names)
              assert [a.rsplit(".",1)[-1] for a,_ in found]==names,found
              for _,axioms in found:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0H0_W0G0_GENERIC_GREEN_W0B0_ORIGINAL_GREEN_W0B1_STOP_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9117 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert "BFSS_W0H0_ORIGINAL_SCALAR_1_SOURCE_1_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),["originalComplexEquiv_scalarImage_commutes"])
              audit(z.read("consumer.log").decode(),["originalComplexEquiv_scalarImage_commutes_consumer"])
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/etblink/math/actions/jobs/{job}/logs")
          assert len(log)>10000 and b"Build completed successfully (9117 jobs)." in log
          assert b"BFSS_W0H0_ORIGINAL_SCALAR_1_SOURCE_1_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in log
          assert b"BFSS_W0H0_W0G0_GENERIC_GREEN_W0B0_ORIGINAL_GREEN_W0B1_STOP_PREFLIGHT_PASS" in log
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0H0_R1_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0H0_R1_{run}_complete_job.log"
          manifest=root/f"BFSS_W0H0_R1_{run}_GREEN_evidence_manifest.json"
          for path in (archive,full,manifest): assert not path.exists(),path
          archive.write_bytes(raw)
          full.write_bytes(log)
          record={
            "gate":"P3-M4-W0H0","attempt":"R1","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(full),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
            "source_blob":"7555f5e17d9f465c1e4b7b04ffc450eb1667fc13",
            "consumer_blob":"21c02789f62e5e345eff7caf4e10505f6cbe4961",
            "workflow_blob":"66ca52d2884c2c6dd25885fc1ccaaf5c8f36d135",
            "source_reports":1,"consumer_reports":1,"independent_controls":2,
            "negative_mutants":6,"cold_build_jobs":9117,
            "allowed_axioms":["propext","Classical.choice","Quot.sound"],
            "predecessor_qualified_run":44135729729,
            "last_qualified_original_bfss_before_run":44109519633,
            "stopped_original_source_red_runs":[44117272657,44127193329]
          }
          manifest.write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0H0_R1_GREEN_PROVIDER_ORIGINAL_REHASH_PASS",json.dumps(record,sort_keys=True))
          PY
      - name: Git-pin original six-member W0H0 GREEN ZIP, full job log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0H0_R1_44139239821_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0H0_R1_44139239821_complete_job.log research/quantum-information/diagnostics/BFSS_W0H0_R1_44139239821_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0H0_R1_44139239821_GREEN_evidence.zip | tr -d ' ')" = 13262
          git commit -m "BFSS W0H0: archive original scalar-image GREEN ZIP, complete CI log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
