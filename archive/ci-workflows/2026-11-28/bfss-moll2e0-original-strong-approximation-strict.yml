name: BFSS MOLL2E0 original strong approximation strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2E0OriginalStrongApproximation.lean'
      - 'lean/diagnostics/BFSSMOLL2E0OriginalStrongApproximationIndependentAudit.lean'
      - '.github/workflows/bfss-moll2e0-original-strong-approximation-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-moll2e0-original-strong-approximation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-source-moll2e0:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2E0OriginalStrongApproximation.lean \
            lean/diagnostics/BFSSMOLL2E0OriginalStrongApproximationIndependentAudit.lean \
            .github/workflows/bfss-moll2e0-original-strong-approximation-strict.yml \
            > "$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2D0OriginalMollifierDifference.lean":"577bbc04be8aea65c678b2c5ba65dcda8d18dcb9","lean/diagnostics/BFSSMOLL2D0OriginalMollifierDifferenceIndependentAudit.lean":"fdd0cceb76b5e527a439f3eb794cb0b7b973892b",".github/workflows/bfss-moll2d0-original-mollifier-difference-strict.yml":"c69f6ca7ee011be232294e34e939f7fdd14d4dd9","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2C0OriginalHilbertNormBridge.lean":"a41c7410a9b7681353f248bf002cbfe270198c94","lean/diagnostics/BFSSMOLL2C0OriginalHilbertNormBridgeIndependentAudit.lean":"c576943feb92f75e9a8d883b65abb58fadbb3cc5",".github/workflows/bfss-moll2c0-original-hilbert-norm-bridge-strict.yml":"b8960917210f4b306ef1fb3a4f78e50d3583c643","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2B0OriginalJensenContraction.lean":"469558405428d6b8ef30f1aa5735f7c0569b00fc","lean/diagnostics/BFSSMOLL2B0OriginalJensenContractionIndependentAudit.lean":"1930b80b3abefeb98db686657662e75a93107d22",".github/workflows/bfss-moll2b0-original-jensen-contraction-strict.yml":"7202acd5a22b566592de48757a8eb5a1d29df112","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2A0OriginalNormalizedKernel.lean":"c33a655a403ac4dafd6c762e16191f68857a967d","lean/diagnostics/BFSSMOLL2A0OriginalNormalizedKernelIndependentAudit.lean":"70dd359e2a9725fd9c8fbfe78cb7c7ec87a124d2",".github/workflows/bfss-moll2a0-original-normalized-kernel-strict.yml":"fbcde65976fd399973e05bb1b05300b7cf2f0dd3","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLE0OriginalKineticMollifierCommutation.lean":"12d56b34fa6ab1554b8008151185b9819145b11b","lean/diagnostics/BFSSMOLE0OriginalKineticMollifierCommutationIndependentAudit.lean":"fec6eeec146390335d8d2a144d8adadfd70f9321",".github/workflows/bfss-mole0-original-kinetic-mollifier-commutation-strict.yml":"6c04ae63591d63f37eb2f5490a3c3a032c87f433","lean/OAI/MathematicalPhysics/BFSS/RellichSmoothing.lean":"359b844bce3b7f85eef3bddbd82e46712b265793","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLD0OriginalKernelIntegralTransport.lean":"f98078b8c7e188128eab3c1d7310ac833086bb0e","lean/diagnostics/BFSSMOLD0OriginalKernelIntegralTransportIndependentAudit.lean":"934617f3316c86e35d41e1e458a91cc968c11392",".github/workflows/bfss-mold0-original-kernel-integral-transport-strict.yml":"aa7361179f7b0969d49d6cb142b6b577567cfd5f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLC0OriginalKineticPairingTransport.lean":"e9b0e09d318a5bf8d798cc965883f446c732a178","lean/diagnostics/BFSSMOLC0OriginalKineticPairingTransportIndependentAudit.lean":"c17c92cdb71d31608593c521ce0518d50a43749b",".github/workflows/bfss-molc0-original-kinetic-pairing-transport-strict.yml":"231ab4412925ae18119b634a0ca5527f2058e2e8","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLB0OriginalReflectedKernelTest.lean":"362c4b50d3fbecb628374e1d56adc4bc5a3bf4ab","lean/diagnostics/BFSSMOLB0OriginalReflectedKernelTestIndependentAudit.lean":"c7f3f532f48079185eb343c3415d51d6567088da",".github/workflows/bfss-molb0-original-reflected-kernel-test-strict.yml":"5904f86c7c733571aaf03e0943ad22e1f1d51c2e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLA0OriginalMollifiedCore.lean":"9f1bb106f140f1bbd12ab8cb671b47207244617d","lean/diagnostics/BFSSMOLA0OriginalMollifiedCoreIndependentAudit.lean":"e52b9bd7438f64268b374285ce2923601f244a11",".github/workflows/bfss-mola0-original-mollified-core-strict.yml":"e298bc3c694e033fcdf80ee8cb551ff6e468418e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSICDC0OriginalPhysicalCommonDomain.lean":"01a9a26eee376861eac110f48ee8982ca7204343","lean/diagnostics/BFSSICDC0OriginalPhysicalCommonDomainIndependentAudit.lean":"ee34692fcfb3930e2012cce970f12e0f2f9eb321",".github/workflows/bfss-icdc0-original-physical-common-domain-strict.yml":"a04481a4e505e6f3fad690756dd2d0fb0769c9e4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSICDB0OriginalComponentGraphLifting.lean":"e0babb86e8159168e31e02850be4d7292b01e248","lean/diagnostics/BFSSICDB0OriginalComponentGraphLiftingIndependentAudit.lean":"18922c12eb8f99584ef9590f2e70f5cefd509256",".github/workflows/bfss-icdb0-original-component-graph-lifting-strict.yml":"3db59e1290684e705491d02b9788cbc5212bb874","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSICDA0OriginalJointGraphAdapter.lean":"d14edf176225a797b586a59cebed266ff195a432","lean/diagnostics/BFSSICDA0OriginalJointGraphAdapterIndependentAudit.lean":"6921f808433d69f6d282a7bfdfb69e8e3f16f676",".github/workflows/bfss-icda0-original-joint-graph-adapter-strict.yml":"03c2e6b836ee607874586a647a6a51b7bea3fff0","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0OriginalCoreEnergy.lean":"42e8396605ef90b96f4434f3df1fb7c2f8eca547","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0b3BasisSquareComposition.lean":"e604acccafcc7295fd467f9339b7e155dfc6c59d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC4PhysicalGraphCoreIdentification.lean":"032c90273c4214aad1b05aef7bd48894b6e23bf4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.lean":"389bd4318cbc389db226691bbccecaa78c6c6c3e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean":"a9f27a48852ac570aedc8e0ab88d683250e6b138","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe.lean":"0afafb8eae4b5efdbd4f95eff2ae1e9352dfe7c5","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","31aed23ab68cc7c8c879a12e9e628e732d6a7de8","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMOLL2E0OriginalStrongApproximation.lean").read_text()
          t=Path("lean/diagnostics/BFSSMOLL2E0OriginalStrongApproximationIndependentAudit.lean").read_text()
          source_roots = ["shrinkingBump","shrinkingBump_radius","smooth_mollified_tendsto","normalized_mollified_tendsto","concrete_mollified_tendsto"]
          consumer_roots = ["originalSU2ShrinkingRadiusAudit","originalSU2StrongApproximationAudit"]
          assert re.findall(r"(?m)^import (\S+)$", s) == ["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMOLL2D0OriginalMollifierDifference"]
          assert re.findall(r"(?m)^import (\S+)$", t) == ["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMOLL2E0OriginalStrongApproximation"]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_MOLL2E0_SOURCE_EXACT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Calculus/ContDiff/Convolution.lean)" = bd9e90f63766eb35fdd67857ef621847de532df7
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Convolution.lean)" = 01ac3fc1f4d36b203933f575dde6b0931b0b8556
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Integral/Bochner/ContinuousLinearMap.lean)" = 24b8ad83aa2cb2a2cb5ce54ac6ce84dbad84bb7f
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/InnerProductSpace/LinearMap.lean)" = 9e464cfcd28bd0ac75d7d79f814305a6c88a4a28
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Function/L1Space/Integrable.lean)" = 2ad180afca8fb23408d5408050a8965089375ae5
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Integral/Bochner/Basic.lean)" = 5abe07ae60e8bdfe5d99a7e68c681a5b052ef4f2
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Calculus/BumpFunction/Normed.lean)" = 9f23d19dd1b85285b198375cbad423413b41d72c
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Calculus/BumpFunction/Basic.lean)" = c295ab7993c2b94fc9de8b3d6b79d7be7f4440a7
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Integral/Prod.lean)" = 7484a64e40beacdd472da61f858f02c8ffb62863
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Function/L2Space.lean)" = 77e0d3526db347b58cdd46fe666067be7e4fbe35
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Function/LpSpace/Basic.lean)" = 49ca798a7ffe3002a1d2ce7ae7ba6d06291406b6
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/InnerProductSpace/Basic.lean)" = 75aac879ab48e009bb05b5a71a189750e85382e9
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/MeasureTheory/Function/LocallyIntegrable.lean)" = dc00e515b31d960ce61d0ce79d08ba0d8ab3af83
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Topology/Algebra/Support.lean)" = d4e215efd8fc8d81ecf98cdc1b7e091cfe9de8a0
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Distribution/TestFunction.lean)" = aeb2cff4a55ef56e4692140053af214e1f5dcabe
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Topology/MetricSpace/Pseudo/Defs.lean)" = 912bc464320d8ea70f002255c59e9f79d41f6ac2
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/SpecificLimits/Basic.lean)" = c633976a412c7d498b55d6188e811d005fd73da4

      - name: Original strong approximation and independent consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-moll2e0-original-strong-approximation"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMOLL2E0OriginalStrongApproximation 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSMOLL2E0OriginalStrongApproximationIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-moll2e0-original-strong-approximation"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {"native-source.log":["FCP.BFSSMOLL2E0.shrinkingBump","FCP.BFSSMOLL2E0.shrinkingBump_radius","FCP.BFSSMOLL2E0.smooth_mollified_tendsto","FCP.BFSSMOLL2E0.normalized_mollified_tendsto","FCP.BFSSMOLL2E0.concrete_mollified_tendsto"],"strict-axioms.log":["FCP.BFSSMOLL2E0Independent.originalSU2ShrinkingRadiusAudit","FCP.BFSSMOLL2E0Independent.originalSU2StrongApproximationAudit"]}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_MOLL2E0_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-moll2e0-original-strong-approximation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-moll2e0-original-strong-approximation/
          if-no-files-found: warn
          retention-days: 30
