name: SM-D1-SCC3B1 original exact marginal decision independent Python strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - research/standard-model/tools/smd1_scc3b1.py
      - research/standard-model/tests/test_smd1_scc3b1.py
      - .github/workflows/sm-d1-scc3b1-decision-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm-d1-scc3b1-original-independent-strict
  cancel-in-progress: false
jobs:
  original-scc0-compatibility-and-adversarial-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact research and accepted SCC0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original source and independent adversarial consumer pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sm-d1-scc3b1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sm-d1-scc3b1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc3b1/preflight.log"
          import ast,json,re,subprocess
          from pathlib import Path
          pins={"research/standard-model/tools/smd1_scc3b1.py":"f395234389956eff23512055f23e659066869eb9","research/standard-model/tests/test_smd1_scc3b1.py":"b4903d31f2268f244f90b80c9ebe120e06ec932c","research/standard-model/SMD1_SCC3B1_ORTHOGONAL_EXACT_PREDICTION_JUDGMENT_MICROGATE_2026_11_18.md":"b1828875d7241b0f544723056a573545e55b9f6d","research/standard-model/tools/smd1_scc0.py":"95569dffd88af133df3dd56d23e1f61ca8c4a207","research/standard-model/tests/test_smd1_scc0.py":"2a41d3592179c1fd205518f912ae365ba8f59f8f","research/standard-model/evidence/SMD1_SCC3B0_R2_44414707214_ORIGINAL_STRICT_GREEN_evidence.zip":"0ed52e9e9aed7c98a5d1acefc776facacfc4517d","research/standard-model/evidence/SMD1_SCC3A_R1_44410857114_ORIGINAL_STRICT_GREEN_evidence.zip":"a37c8350995349051c6623efa1cf532f1429821e","research/standard-model/evidence/SMD1_SCC2_R2_44407657796_ORIGINAL_STRICT_GREEN_evidence.zip":"2f8eb4be633546a7d2ddf1f33d174f6c3900264b","research/standard-model/evidence/SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence.zip":"faf10f95ec2973ad5040be3f6f2ac362dcc1ca10","lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC3B0FiniteRationalTotalVariation.lean":"8417daf98449b51d45b18951bd389cb3bd777405","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean":"7d372392703d0fe69942df9df58b421af6850656","research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json":"1d391ba994ee23f03c4423b45fbb15e7e42c86f1"}
          for path,expect in pins.items():
              got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
              assert got==expect,(path,got,expect)
          tool=Path('research/standard-model/tools/smd1_scc3b1.py').read_text()
          tests=Path('research/standard-model/tests/test_smd1_scc3b1.py').read_text()
          ast.parse(tool)
          ast.parse(tests)
          assert tool.startswith('#!/usr/bin/env python3')
          assert tests.startswith('#!/usr/bin/env python3')
          assert len(re.findall(r'(?m)^    def test_',tests))==15
          for marker in ('class ExactDifference','class ProtocolIntegrity','class PredictionCompleteness',
                         'class JointLikelihood','class Judgment','class FamilyJudgment',
                         'def exact_total_variation','def compare_scenarios_v1','def compare_families_v1'):
              assert marker in tool,marker
          assert 'import smd1_scc0' not in tool
          assert 'from smd1_scc0 import Family, Scenario, Status, Witness' in tool
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert sm['last_qualified_formal_methodology']['gate']=='SM-D1-SCC3B0'
          assert sm['last_qualified_formal_methodology']['independent_preservation_run']==44415834582
          assert [x['gate'] for x in sm['qualified_formal_methodology_lineage']]==['SM-D1-SCC1','SM-D1-SCC2','SM-D1-SCC3A','SM-D1-SCC3B0']
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in sm['upcoming'])
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          print('SM_D1_SCC3B1_15_INDEPENDENT_TESTS_SOURCE_EXACT_SCC0_SCC3B0_SM_DATA_27_BFSS_ANCHORS_PREFLIGHT_PASS')
          
          PY
      - name: Run original SCC0 regression and SCC3B1 independent compatibility suite
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PYTHONHASHSEED=0
          python3 --version | tee "$RUNNER_TEMP/sm-d1-scc3b1/python-version.log"
          python3 -W error -m unittest discover -s research/standard-model/tests -p test_smd1_scc0.py -v 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc3b1/scc0-regression.log"
          python3 -W error -m unittest discover -s research/standard-model/tests -p test_smd1_scc3b1.py -v 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc3b1/independent-consumer.log"
      - name: Run separate adversarial negative input auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc3b1/negative-auditor.log"
          import sys
          from fractions import Fraction
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'research/standard-model/tools'))
          from smd1_scc0 import Distribution, Prediction, Scenario, Status, Witness
          from smd1_scc3b1 import compare_scenarios_v1, ExactDifference, JointLikelihood, ProtocolIntegrity
          def fail(f):
              try:f()
              except ValueError:pass
              else:raise AssertionError('invalid input not rejected')
          fail(lambda: Distribution((('a',Fraction(1,2)),('b',Fraction(1,3)))))
          fail(lambda: Distribution((('a',Fraction(2)),('b',Fraction(-1)))))
          fail(lambda: Witness('x','p','u',('a','a')))
          w=Witness('x','p','u',('a','b'))
          a=Scenario('a',{})
          b=Scenario('b',{})
          fail(lambda: compare_scenarios_v1(a,b,()))
          fail(lambda: compare_scenarios_v1(a,b,(w,w)))
          bad=Prediction('x','p','u',Status.MISSING_PHYSICAL_MAP,reason='no source model')
          q=compare_scenarios_v1(Scenario('A',{'x':bad}),b,(w,))
          assert q.exact==ExactDifference.UNDETERMINED and q.unavailable==('x',)
          assert q.integrity==ProtocolIntegrity.VALID
          assert q.joint==JointLikelihood.NOT_ASSESSED
          print('SM_D1_SCC3B1_7_NEGATIVE_CONTROLS_EXPECTED_REJECTIONS_AND_MISSING_MAP_PASS')
          
          PY
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc3b1/completion-auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sm-d1-scc3b1'
          legacy=(root/'scc0-regression.log').read_text()
          new=(root/'independent-consumer.log').read_text()
          negative=(root/'negative-auditor.log').read_text()
          assert 'FAILED' not in legacy and 'ERROR' not in legacy
          assert 'FAILED' not in new and 'ERROR' not in new
          assert len(re.findall(r'(?m)^test_',new))==15
          assert 'OK' in new and 'OK' in legacy
          assert 'SM_D1_SCC3B1_7_NEGATIVE_CONTROLS_EXPECTED_REJECTIONS_AND_MISSING_MAP_PASS' in negative
          print('SM_D1_SCC3B1_15_INDEPENDENT_TESTS_SCC0_REGRESSION_7_NEGATIVE_CONTROLS_STRICT_GREEN')
          PY
      - name: Preserve original exact compatibility logs for independent archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm-d1-scc3b1-original-independent-python-compatibility
          path: /home/runner/work/_temp/sm-d1-scc3b1/
          retention-days: 14
          if-no-files-found: warn
