name: BFSS W0B2A R1 ORIGINAL Clifford-module GREEN evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0b2a-r1-original-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-W0B2A-R1-GREEN:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact W0B2A R1 and pending canonical state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert source and consumer pins and accepted W0H1B predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2AOriginalCliffordModuleEndBridge.lean)" = 58d852a27e84288c0b1f33d784940155e2f26d54
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0B2AOriginalCliffordModuleEndIndependentConsumer.lean)" = 85784957405d4740f7dddc9e04dc72ed4c9d3b7a
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0b2a-original-module-end-strict.yml)" = 903636c37e0794846146aadd3b175a09553d34e0
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1BOriginalAdjoinFullCliffordCommutantR2.lean)" = 9139fba785aa31a1e1cde83419f9848ea67fc016
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0H1B_R2_44164974919_GREEN_evidence.zip)" = 7e49358ea47500a2b2e8ab0407e7db44c7871cb5
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0H1B_R2_44164974919_complete_job.log)" = 7a0996ce15adfc8f9bf5462c350dafaecd6ff906
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0H1B_R2_44164974919_GREEN_evidence_manifest.json)" = 4ef0a86aabdf53da7bf85dd15101f89b592badd3
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert a["gate"]=="P3-M4-W0B2A" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="58d852a27e84288c0b1f33d784940155e2f26d54"
          assert a["consumer_blob"]=="85784957405d4740f7dddc9e04dc72ed4c9d3b7a"
          assert a["workflow_blob"]=="903636c37e0794846146aadd3b175a09553d34e0"
          assert a["contract_commit"]=="7bda19744b08a71ce85744a2fc2de4a84668a4fe"
          assert a["accepted_predecessor_run"]==44164974919
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==3
          assert a["independent_controls"]==3
          assert q["gate"]=="P3-M4-W0H1B" and q["run_id"]==44164974919
          assert q["status"]=="GREEN_QUALIFIED" and q["qualification"] is True
          assert s["accepted_anchors"][-1]==q
          assert s["previous_active_W0H1B_R1_RED"]["run_id"]==44160611850
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert s["next_planned"]["gate"]=="P3-M4-W0B2B"
          for p in ("research/quantum-information/diagnostics/BFSS_M4_W0B2A_R1_44174996514_GREEN_evidence.zip","research/quantum-information/diagnostics/BFSS_W0B2A_R1_44174996514_complete_job.log","research/quantum-information/diagnostics/BFSS_W0B2A_R1_44174996514_GREEN_evidence_manifest.json"):
              assert not Path(p).exists(),p
          print("BFSS_W0B2A_R1_ORIGINAL_ACCEPTED_PREDECESSOR_AND_UNPROMOTED_EVIDENCE_PREFLIGHT_PASS")
          PY
      - name: Rehash provider-original GREEN ZIP and complete Actions job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          run=44174996514
          job=134363872763
          artifact=14370212842
          tested="c0ae4222093f5f922a25569098d420b63fb9e66e"
          digest="36f960ad45b38c879929752d90745ee57cd6efe5473b835540e7a7d848e65dd7"
          size=14216
          strict="BFSS_W0B2A_R1_ORIGINAL_FOCK_CLIFFORD_MODULE_END_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN"
          preflight="BFSS_W0B2A_R1_W0H1B_GREEN_ORIGINAL_M3B_M3C_M3I_PREFLIGHT_PASS"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as res:return json.load(res)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["id"]==run and runinfo["status"]=="completed" and runinfo["conclusion"]=="success"
          assert runinfo["head_sha"]==tested and runinfo["run_attempt"]==1
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          allowed={"propext","Classical.choice","Quot.sound"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(report,expected):
              assert "error:" not in report and "sorryAx" not in report,report[-2000:]
              found=pat.findall(report)
              assert len(found)==len(expected),(found,expected)
              assert [name.rsplit(".",1)[-1] for name,_ in found]==expected,found
              assert len(set(name for name,_ in found))==len(found)
              for _,axioms in found:
                  assert {x.strip() for x in axioms.split(",") if x.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert preflight in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9133 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert strict in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),
                    ["originalFockClifford_module_smul","originalFockClifford_moduleEnd",
                     "originalFockClifford_moduleEnd_apply"])
              audit(z.read("consumer.log").decode(),
                    ["originalFockClifford_module_smul_consumer",
                     "originalFockClifford_moduleEnd_apply_consumer",
                     "originalFockClifford_moduleEnd_smul_consumer"])
              members=[{"name":name,"size":len(z.read(name)),
                        "sha256":hashlib.sha256(z.read(name)).hexdigest()}
                       for name in sorted(z.namelist())]
          complete=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(complete)>20000
          assert b"Build completed successfully (9133 jobs)." in complete
          assert strict.encode() in complete
          assert preflight.encode() in complete
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0B2A_R1_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0B2A_R1_{run}_complete_job.log"
          manifest=root/f"BFSS_W0B2A_R1_{run}_GREEN_evidence_manifest.json"
          for p in (archive,full,manifest):assert not p.exists(),p
          archive.write_bytes(raw)
          full.write_bytes(complete)
          record={
            "gate":"P3-M4-W0B2A","attempt":"R1","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(full),"size":len(complete),"sha256":hashlib.sha256(complete).hexdigest()},
            "source_blob":"58d852a27e84288c0b1f33d784940155e2f26d54",
            "consumer_blob":"85784957405d4740f7dddc9e04dc72ed4c9d3b7a",
            "workflow_blob":"903636c37e0794846146aadd3b175a09553d34e0",
            "source_reports":3,"consumer_reports":3,"independent_controls":3,
            "negative_mutants":6,"cold_build_jobs":9133,"strict_marker":strict,
            "allowed_axioms":["propext","Classical.choice","Quot.sound"],
            "accepted_predecessor_run":44164974919,
            "qualified_predecessor_preservation_run":44168840610,
            "stopped_original_W0B1_native_red_runs":[44117272657,44127193329],
            "prior_W0H1B_original_native_red_run":44160611850,
            "roadmap_staging_green_run":44175396442
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0B2A_R1_ORIGINAL_GREEN_PROVIDER_ZIP_AND_FULL_LOG_REHASH_PASS",json.dumps(record,sort_keys=True))
          PY
      - name: Git-pin original GREEN ZIP full Actions log and digest manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0B2A_R1_44174996514_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0B2A_R1_44174996514_complete_job.log research/quantum-information/diagnostics/BFSS_W0B2A_R1_44174996514_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0B2A_R1_44174996514_GREEN_evidence.zip | tr -d ' ')" = 14216
          git commit -m "BFSS W0B2A R1: preserve original module-end GREEN ZIP complete Actions log and digest manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
