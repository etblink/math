name: BFSS W0C2B0M R2 exact preflight-only RED preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0m-r2-preflight-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-r2-preflight-provider-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original R2 preflight-failed commit and frozen proof donors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify source-exact R2 remains unqualified and first native R1 RED immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean)" = b98cc05a012c98da8016496492d77135fc58ebc8
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean)" = dcbba93f72feb4f60912521f666d748bcf2e1687
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0m-r2-original-complex-nested-strict.yml)" = fa1ab7c0242f06e2e6a3e393d82774ec94f6b825
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip)" = 277b934810e6a999c974917d23a199ccd0be3ddd
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2B0M","R2","PENDING_STRICT_CI",False)
          assert q["gate"]=="P3-M4-W0C2A" and q["run_id"]==44213315719 and len(s["accepted_anchors"])==24
          assert s["previous_active_W0C2B0M_R1_NATIVE_RED"]["run_id"]==44252646318
          assert s["previous_active_W0C2B0M_R1_NATIVE_RED"]["preservation_run"]==44253870183
          for name in ("BFSS_M4_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence.zip","BFSS_W0C2B0M_R2_44254608894_complete_job.log","BFSS_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence_manifest.json"):
              assert not (Path("research/quantum-information/diagnostics")/name).exists(),name
          print("BFSS_W0C2B0M_R2_ORIGINAL_PREFLIGHT_RED_SOURCE_UNCHANGED_ARCHIVER_PASS")
          PY
      - name: Validate provider-original ZIP and full log with SHA and CRC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix="https://api.github.com/repos/etblink/math"
          run=44254608894;job=134633170487;artifact=14404714731
          tested="56d383e85e19928d395858c1f1e5582e9cf3e298"
          size=512
          digest="9f75266ae0f91f388918ddda14ffac47a55b1d926cb6dea92d0c7d87fca4e55f"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          jobinfo=getjson(f"{prefix}/actions/jobs/{job}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["head_sha"]==tested and runinfo["run_attempt"]==1 and runinfo["status"]=="completed" and runinfo["conclusion"]=="failure"
          assert jobinfo["id"]==job and jobinfo["run_id"]==run and jobinfo["conclusion"]=="failure"
          assert any(x["name"].startswith("Checkout exact unified") and x["conclusion"]=="success" for x in jobinfo["steps"])
          assert any(x["name"].startswith("Preflight original complex") and x["conclusion"]=="failure" for x in jobinfo["steps"])
          assert any(x["name"].startswith("Restore pinned Lean") and x["conclusion"]=="skipped" for x in jobinfo["steps"])
          assert any(x["name"].startswith("Cold original complex") and x["conclusion"]=="skipped" for x in jobinfo["steps"])
          assert meta["id"]==artifact and meta["size_in_bytes"]==size and meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"];assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with r:return r.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())=={"preflight.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              pre=z.read("preflight.log").decode()
              assert "AssertionError" in pre and "fa1ab7c0242f06e2e6a3e393d82774ec94f6b825" in pre
              assert ".github/workflows/bfss-m4-w0c2b0m-r2-original-complex-nested-strict.yml" in pre
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(z.namelist())]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(full)>20000 and b"fa1ab7c0242f06e2e6a3e393d82774ec94f6b825" in full
          assert b"AssertionError" in full and b"Artifact ID 14404714731" in full
          root=Path("research/quantum-information/diagnostics");root.mkdir(parents=True,exist_ok=True)
          archive=root/"BFSS_M4_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence.zip"
          log=root/"BFSS_W0C2B0M_R2_44254608894_complete_job.log"
          manifest=root/"BFSS_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence_manifest.json"
          for p in [archive,log,manifest]:assert not p.exists(),p
          archive.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
              "gate":"P3-M4-W0C2B0M","attempt":"R2","status":"PREFLIGHT_BEFORE_LEAN_UNQUALIFIED",
              "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
              "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
              "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
              "source_blob":"b98cc05a012c98da8016496492d77135fc58ebc8",
              "consumer_blob":"dcbba93f72feb4f60912521f666d748bcf2e1687",
              "failed_workflow_blob":"fa1ab7c0242f06e2e6a3e393d82774ec94f6b825",
              "failure_phase":"PREFLIGHT_BEFORE_LEAN",
              "causal_error":"R2 workflow pin table accidentally bound R2 workflow path to the frozen R1 workflow SHA",
              "native_source_executed":False,"consumer_executed":False,
              "prior_R1_native_run":44252646318,"last_qualified_run":44213315719,
              "claim_ceiling":"No R2 mathematical theorem qualified; the independent roadmap also failed at the same malformed pin"
          },sort_keys=True,indent=2)+"\n")
          print("BFSS_W0C2B0M_R2_PROVIDER_ORIGINAL_PREFLIGHT_RED_ZIP_FULL_LOG_SHA_CRC_VERIFIED")
          PY
      - name: Git-pin original R2 preflight RED ZIP complete Actions log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0M_R2_44254608894_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C2B0M R2: preserve original first preflight pin-table RED"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
