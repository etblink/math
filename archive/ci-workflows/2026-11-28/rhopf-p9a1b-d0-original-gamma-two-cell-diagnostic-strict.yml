name: RHOPF P9A1B D0 original Gamma9 two-cell diagnostic strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A1BD0OriginalGammaTwoCellDiagnostic.lean
      - lean/diagnostics/RHOPFP9A1BD0OriginalGammaTwoCellIndependentAudit.lean
      - .github/workflows/rhopf-p9a1b-d0-original-gamma-two-cell-diagnostic-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhopf-p9a1b-d0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-two-cell-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout pinned original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Frozen-source and diagnostic contract preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhopf-p9a1b-d0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/rhopf-p9a1b-d0/exact-tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/rhopf-p9a1b-d0/toolchain-sha256.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          pkgs=json.loads(Path('lean/lake-manifest.json').read_text())['packages']
          assert next(p['rev'] for p in pkgs if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          p='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/'
          paths={
            'lean/OAI/MathematicalPhysics/BFSS/Core.lean':'9882359ced78b0a3bd7e2f057974bd0a031b3e60',
            p+'SU2RealGammaProbe.lean':'b9b8192055c70f0d001d7982669b9823c55562ed',
            p+'RHOPFP9A0OriginalGammaPairClifford.lean':'bf5eb554232a6d452e86d85b05220aad7c5d0aeb',
            p+'RHOPFP9A1AOriginalGammaGeneratorInequivalence.lean':'779bd9a78811f60397657df8b8a4350aafae57b7',
            p+'RHOPFP9A1BOriginalGammaSelectedHopfRows.lean':'a21027ce34226c7ed734917d59b7568f90dcb16e',
            p+'RHOPFP9A1BD0OriginalGammaTwoCellDiagnostic.lean':'22bad85aa8d49c14398543cbbc50435d34ea61f0',
            'lean/diagnostics/RHOPFP9A1BD0OriginalGammaTwoCellIndependentAudit.lean':'e24746317db269a439dcec2386561e5b6403d86b',
            'research/topology/data/BFSS_GAMMA9_SOURCE_PERMUTATION_FIXTURE_2026_11_18.json':'684680e139cfcd09c37bf075c0c014bdaa80ba35',
            'research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py':'9d20952c366e356ff5dc656a35d0b604236a15ac'}
          for path, expected in paths.items():
            actual=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert actual==expected,(path,expected,actual)
          src=Path(p+'RHOPFP9A1BD0OriginalGammaTwoCellDiagnostic.lean').read_text()
          consumer=Path('lean/diagnostics/RHOPFP9A1BD0OriginalGammaTwoCellIndependentAudit.lean').read_text()
          assert re.findall(r'(?m)^import (\S+)$',src)==['OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2RealGammaProbe']
          assert re.findall(r'(?m)^import (\S+)$',consumer)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A1BD0OriginalGammaTwoCellDiagnostic']
          names=['K13_entry_0_1','K25_entry_0_1','K46_entry_0_1','K13_entry_0_2','K25_entry_0_2','K46_entry_0_2']
          assert re.findall(r'(?m)^theorem (\S+)',src)==names
          assert re.findall(r'(?m)^#print axioms (\S+)',src)==names
          assert re.findall(r'(?m)^#print axioms (\S+)',consumer)==['FCP.RHOPFP9A1BD0.'+n for n in names]
          for s in [src,consumer]:
            assert 'set_option autoImplicit false' in s
            assert not re.search(r'(?m)^\s*(?:sorry|admit|axiom|unsafe|opaque|constant)\b',s)
            assert not re.search(r'(?m)^\s*set_option\s+(?:maxRecDepth|maxHeartbeats)',s)
          assert 'import all' not in src and 'import all' not in consumer
          print('RHOPF_P9A1B_D0_SOURCE_PINS_AND_CONTRACT_PREFLIGHT_PASS')
          PY
          python3 research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py |
            tee "$RUNNER_TEMP/rhopf-p9a1b-d0/independent-original-integer-consumer.json"

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 44
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2000s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'

      - name: Original Gamma9 build and bounded native two-cell diagnostic
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 1200s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2RealGammaProbe 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b-d0/original-gamma-build.log"
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A1BD0OriginalGammaTwoCellDiagnostic
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 650s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b-d0/native-proof-and-axiom-diagnostic.log"

      - name: Independent Lean entry consumer and strict axiom audit
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=diagnostics/RHOPFP9A1BD0OriginalGammaTwoCellIndependentAudit
          mkdir -p .lake/build/lib/lean/diagnostics
          timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b-d0/independent-lean-proof-and-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'rhopf-p9a1b-d0'
          ns=[(root/n).read_text() for n in
            ['native-proof-and-axiom-diagnostic.log','independent-lean-proof-and-axioms.log']]
          names=['K13_entry_0_1','K25_entry_0_1','K46_entry_0_1','K13_entry_0_2','K25_entry_0_2','K46_entry_0_2']
          for data in ns:
            for name in names:
              pattern=r"'FCP\.RHOPFP9A1BD0\."+name+r"' depends on axioms: \[([^\]]+)\]"
              matches=re.findall(pattern,data)
              if len(matches)==1:
                axioms={x.strip() for x in matches[0].split(',')}
                assert axioms.issubset({'propext','Classical.choice','Quot.sound'}),(name,axioms)
              else:
                assert "'FCP.RHOPFP9A1BD0."+name+"' does not depend on any axioms" in data,(name,matches)
            assert 'sorryAx' not in data and 'error:' not in data
          print('RHOPF_P9A1B_D0_STRICT_NATIVE_AND_INDEPENDENT_CONSUMER_PASS')
          PY

      - name: Retain exact tested source and RED diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhopf-p9a1b-d0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhopf-p9a1b-d0
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
