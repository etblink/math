name: BFSS M4 W0A0 all original Source48 label-axis witness strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean
      - lean/diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0a0-source-axis-witness-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0a0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-48-source-axis:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout unified branch exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact donors, gate state, label-only theorem and failure preservation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/bfss-m4-w0a0"
          mkdir -p "$root"
          git rev-parse HEAD | tee "$root/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$root/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean":"175cd63e2ef031818b61a51b73eb59782fe38add","lean/diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean":"c58f6d3e49bbcb4b7d2c88a08f57f7e07b61ce63","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3A2OriginalComplexCliffordFockSourceAxisCrosswalk.lean":"a9db27fc28379b35ca85515d733cc0bc43376592","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean":"fad0eab5014aa038ddb0bf8411b0e81c358e7908","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3IOriginalComplexCliffordFockAlgebraEquivProbe.lean":"754a5f2a13baea90312f6031eb8fa7963dbdf42b","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R1_44020471704_evidence.zip":"8ae6ad676712bd361d4a4a0568fc5924a3c3daa5","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R2_44022359538_evidence.zip":"387e2c5d271459d524259800a269e752ab0b9001","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1G0_R1_44024718712_evidence.zip":"ade0727552de6bcdaf1ed2863479a99911c8e3cb","research/quantum-information/BFSS_QIT_SCC_W0A0_R1_RED_44033364617_TYPED_PI_SINGLE_2026_11_16.md":"91b84f5a149803f861b941dc5472bc6409a0be82","research/quantum-information/BFSS_QIT_SCC_W0A0_R2_PRE_GATE_TYPED_PI_SINGLE_CONGRARG_2026_11_16.md":"a8804dd8e880288eec2ed36aed0bc7abfc221ce2","research/quantum-information/diagnostics/BFSS_W0A0_R1_44033364617_evidence_manifest.json":"0c0f69a7902cf612683150182a1fb1819fda8917","research/quantum-information/diagnostics/BFSS_W0A0_R1_44033364617_complete_job.log":"1696f84aa7a54347107bcc7e9b5a7cc8a70311b0"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,expected,actual)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean").read_text()
          con=Path("lean/diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==["originalComplexEquiv_allLabelAxis_eq_activeGamma"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==["originalComplexEquiv_allLabelAxis_consumer"]
          assert len(re.findall(r"(?m)^theorem\b",src))==1
          assert len(re.findall(r"(?m)^theorem\b",con))==1
          assert len(re.findall(r"(?m)^example\b",con))==2
          assert len(re.findall(r"(?m)^import\b",src))==1
          assert con.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0A0OriginalSourceAxisWitness\n")
          for body in (src,con):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
              assert "originalSource48BivectorK" not in body
          assert "sourceBlockColorEquiv.symm p" in src
          assert "originalComplexEquiv_sourceAxis_eq_activeGamma" in src
          assert "Pi.single p (1 : ℝ)" in src
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          last=state["last_qualified"]
          assert last["gate"]=="P3-M4-QTC1G0" and last["run_id"]==44024718712 and last["qualification"]
          active=state["active"]
          assert active["gate"]=="P3-M4-W0A0" and active["status"]=="PENDING_STRICT_CI" and not active["qualification"]
          assert active["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean"]
          assert active["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean"]
          assert active["attempt"]=="R2" and active["contract_commit"]=="0ee47e5703d87f48a9f99bcb6c431012b1362ea4"
          assert state["previous_active_W0A0_R1_RED"]["run_id"]==44033364617
          assert state["previous_active_W0A0_R1_RED"]["status"]=="RED_UNQUALIFIED"
          assert state["previous_active_W0A0_R1_RED"]["tested_sha"]=="d4f6c7a090ffba44ba7f091c831e568aba154c26"
          assert state["previous_active_W0A0_R1_RED"]["artifact_sha256"]=="e805e4eb1515a045031768794d1cb74786b3c64c0caff708f16fac80db45b58b"
          assert subprocess.check_output(["git","rev-parse",
            "HEAD^:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean"],text=True).strip()=="81b5df7e7dd009a5f03f561ac80d55d17aafdea4"
          assert "congrArg (fun t : Source48Label =>" in src
          assert "(Pi.single t (1 : ℝ) : Source48Vector)" in src
          assert "change Pi.single" not in src
          assert Path(active["prospective_receipt"]).is_file()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_W0A0_ALL_48_LABELS_AND_QUALIFIED_DONORS_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold source, independent consumer and strict axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0a0"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0A0OriginalSourceAxisWitness 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A0OriginalSourceAxisWitness.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0A0OriginalSourceAxisIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0a0"
          allowed={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              extras=[x for x in log.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
              assert not extras,extras[:5]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for name,axioms in found:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(name,axioms)
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a"])
          mutants=[good.replace("Quot.sound","sorryAx",1),
                   good.replace("Quot.sound","Foreign.axiom",1),
                   good+good, "",
                   good+"warning: unexpected warning\n",
                   good+"error: failed proof\n"]
          for k,bad in enumerate(mutants):
              try: audit(bad,["a"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted negative mutation",k))
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),["originalComplexEquiv_allLabelAxis_eq_activeGamma"])
          audit((root/"consumer.log").read_text(),["originalComplexEquiv_allLabelAxis_consumer"])
          print("BFSS_W0A0_ORIGINAL_ALL_48_LABELS_1_SOURCE_1_CONSUMER_2_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve original exact preflight, cold Lean, consumer and auditor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0a0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0a0/
          if-no-files-found: warn
          retention-days: 14
