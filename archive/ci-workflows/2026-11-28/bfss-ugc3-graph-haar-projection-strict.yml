name: BFSS UGC3 graph Haar projection strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC3GraphHaarProjection.lean'
      - 'lean/diagnostics/BFSSUGC3GraphHaarProjectionIndependentAudit.lean'
      - '.github/workflows/bfss-ugc3-graph-haar-projection-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ugc3-graph-haar-projection-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-source-ugc3:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ugc3-graph-haar-projection"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ugc3-graph-haar-projection/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC3GraphHaarProjection.lean \
            lean/diagnostics/BFSSUGC3GraphHaarProjectionIndependentAudit.lean \
            .github/workflows/bfss-ugc3-graph-haar-projection-strict.yml \
            > "$RUNNER_TEMP/bfss-ugc3-graph-haar-projection/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-ugc3-graph-haar-projection/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-ugc3-graph-haar-projection/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC2ClosedGraphGaugeCovariance.lean":"ca97afd3b19b21f48a97f953ce6e6e10dffc7b19","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC0FullCoreGaugeCovariance.lean":"6fc94841ffd7f93ff75bcd04f9a5396e02e42044","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC1FullCoreGaugeAction.lean":"059f6fe01c8e3b110ea249662fa56ace1163165a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainD2B6SourceFullL2GaugeActionProbe.lean":"02a0e02fde11ae8b0b6162df9a7f7a3df9a0800b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainD2B7SourceFullL2GaugeIsometryAndFixednessProbe.lean":"351d2d226c53a3cff8a5e1d08c2d3e24c63a0f86","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainD2B8AFixedPointSpaceProbe.lean":"136f461a29d5fe99453da0df081d824c33f6c7cf","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainD2B9CGenuineGaugeHaarProjectionProbe.lean":"15e1526b266d4e895857532cb372a32dc328ac97"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","f2d6669979b7fe723d247fac149ecc543cb4cd77","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSUGC3GraphHaarProjection.lean").read_text()
          t=Path("lean/diagnostics/BFSSUGC3GraphHaarProjectionIndependentAudit.lean").read_text()
          source_roots = ["graph_haar","graph_haar_continuous","graph_orbit_integrable","graph_haar_integral","graph_haar_closed_mem","graph_haar_physical","graph_haar_fixed"]
          consumer_roots = ["originalSU2HaarGraphAudit","originalSU2HaarFixedAudit"]
          assert re.findall(r"(?m)^import (\S+)$", s) == ["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSUGC2ClosedGraphGaugeCovariance","Mathlib.Analysis.Convex.Integral","Mathlib.MeasureTheory.SpecificCodomains.Pi"]
          assert re.findall(r"(?m)^import (\S+)$", t) == ["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSUGC3GraphHaarProjection"]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_UGC3_SOURCE_EXACT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-ugc3-graph-haar-projection/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original graph Haar projection and independent SU2 consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-ugc3-graph-haar-projection"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSUGC3GraphHaarProjection 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSUGC3GraphHaarProjectionIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-ugc3-graph-haar-projection"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {"native-source.log":["FCP.BFSSUGC3.graph_haar","FCP.BFSSUGC3.graph_haar_continuous","FCP.BFSSUGC3.graph_orbit_integrable","FCP.BFSSUGC3.graph_haar_integral","FCP.BFSSUGC3.graph_haar_closed_mem","FCP.BFSSUGC3.graph_haar_physical","FCP.BFSSUGC3.graph_haar_fixed"],"strict-axioms.log":["FCP.BFSSUGC3Independent.originalSU2HaarGraphAudit","FCP.BFSSUGC3Independent.originalSU2HaarFixedAudit"]}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_UGC3_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ugc3-graph-haar-projection-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ugc3-graph-haar-projection/
          if-no-files-found: warn
          retention-days: 30
