name: BFSS P3-AUX-HARDY-G11 original derivative color contraction strict
'on':
  push:
    branches:
    - integration/bfss-unified-research-20261108
    paths:
    - .github/workflows/bfss-p3-aux-hardy-g11-original-derivative-color-contraction-strict.yml
    - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.lean
    - lean/diagnostics/BFSSP3AuxHardyG11OriginalDerivativeColorContractionIndependentConsumer.lean
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-hardy-g11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-derivative-color-contraction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout frozen source ancestry
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 96
        persist-credentials: false
    - name: Preflight complete reviewed source closure and toolchain
      shell: bash
      run: "set -euo pipefail\nmkdir -p bfss-aux-hardy-g11-evidence\ngit rev-parse HEAD > bfss-aux-hardy-g11-evidence/tested-sha.txt\npython3 - <<'PY' | tee bfss-aux-hardy-g11-evidence/preflight.log\nfrom pathlib import Path\nimport subprocess,re,json,hashlib\nBASE=\"7d5f8f74b9d922a6e7628b7d05e30d2d2d6ab73d\"\nSOURCE=\"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.lean\"\nCONSUMER=\"lean/diagnostics/BFSSP3AuxHardyG11OriginalDerivativeColorContractionIndependentConsumer.lean\"\nHELPER=\"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean\"\nCONTROL_HELPER=\"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.lean\"\nEXPECTED={\"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG6OriginalCorePotentialBinding.lean\": \"ebe37de869b25068dfedb98c60340a27335e5c04\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.lean\": \"6d0f99d61340b6a052e733c0b964b8c4dcf69457\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9BSourcePairAndChargeReductionProbe.lean\": \"e066601ddb02e78493eb91582ce2dcb0e6fa3ca1\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9COrderedPairCoefficientProbe.lean\": \"1010bbfc6618718d98fbaf8cab065f4478759f94\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean\": \"cc0f4624239160dc39a7a191a519786e71df6abd\", \"lean/OAI/MathematicalPhysics/BFSS/Core.lean\": \"9882359ced78b0a3bd7e2f057974bd0a031b3e60\", \"lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean\": \"cc01379653404c4ede3d551fd8d823e079543b21\", \"lean/OAI/MathematicalPhysics/BFSS/Kinetic.lean\": \"14045947b1860b28cbbd82c3f2b40967e795d5a8\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG4OriginalPotentialYCancellation.lean\": \"b2a482d0817fd39e7437a77d66d8f911c7073de3\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5OriginalPotentialTauCAR.lean\": \"9ada3167a5de3be647c51f0740b5998d4e6ea45a\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean\": \"0398bafa58b46dfbd83ec90a65be84adb03dedf8\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean\": \"e20c76fb22bc09d16dbcd8657333227cb34ed1ea\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG7OriginalTauSmoothCore.lean\": \"d7320101971790d7fe56bfda1b011ae3e5d1b9d9\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean\": \"03b5236bd91e4664e7101544b065054bd6c925a1\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean\": \"138ab7f545bf00812a55d1cb035251a9eccb6c27\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean\": \"b7d518b9f4a6ffb4acfaa4f265416a0b3aeccc68\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9OriginalYEntryDerivativeBinding.lean\": \"59a1360ee22b9ffa24fdcf018d9c9299a0b9ce11\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.lean\": \"e7904e1edf3af664b3900c31c0757412d495d60c\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG10OriginalKineticTauCAR.lean\": \"59aaed1da894e8b91b2df51eda6f47a37cf4c517\", \"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.lean\": \"fae4dc32dee27c5542f7fffddf217b276ed2bfef\", \"lean/diagnostics/BFSSP3AuxHardyG11OriginalDerivativeColorContractionIndependentConsumer.lean\": \"27b63114ea4635beed31bc9cef954b8499e8194e\"}\nROOTS=[\"originalHardyY_basis_off_color\", \"originalHardyY_basis_color\", \"originalHardyY_basis_color_contraction\", \"originalHardyY_basis_spin_contraction\", \"originalHardyY_basis_complex_spin_contraction\", \"originalHardyTauCoefficientDerivative_spin_contraction\"]\nNAMESPACE=\"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction\"\nDONORS=[\"FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_basis_contraction\", \"FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_derivative_contraction\", \"FCP.BFSSP3AuxHardyG9OriginalYEntryDerivativeBinding.originalHardyTauCoefficientDerivative_eq_basis\", \"FCP.BFSSP3AuxHardyG9OriginalYEntryDerivativeBinding.originalHardyTauDerivative_eq_basis\", \"FCP.BFSSP3AuxHardyG10OriginalKineticTauCAR.originalKineticFermion_apply\", \"FCP.BFSSP3AuxHardyG10OriginalKineticTauCAR.originalKineticTau_anticommutator\"]\nCONTROL_ROOTS=[\"FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM\", \"FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM_apply\", \"FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntry_fderiv_apply\"]\ndef git(*a):\n    return subprocess.check_output([\"git\",*a],text=True).strip()\nassert git(\"cat-file\",\"-t\",BASE)==\"commit\"\nassert subprocess.run([\"git\",\"merge-base\",\"--is-ancestor\",BASE,\"HEAD\"]).returncode==0\nbaseline={}\nfor line in git(\"ls-tree\",\"-r\",BASE,\"--\",\"lean/OAI\").splitlines():\n    m=re.fullmatch(r\"\\d+ blob ([0-9a-f]{40})\\t(.+)\",line)\n    if m: baseline[m[2]]=m[1]\nseen={}\nstack=[SOURCE,CONSUMER,HELPER,CONTROL_HELPER]\nwhile stack:\n    p=stack.pop()\n    if p in seen: continue\n    f=Path(p)\n    assert f.is_file(),(\"missing OAI source\",p)\n    sha=git(\"hash-object\",\"--no-filters\",p)\n    if p not in (SOURCE,CONSUMER,CONTROL_HELPER):\n        assert baseline.get(p)==sha,(\"reviewed existing OAI source drift\",p,baseline.get(p),sha)\n    seen[p]=sha\n    for names in re.findall(r\"(?m)^(?:public )?import[ \\t]+([^\\n]+)\",f.read_text()):\n        for name in names.split(\"--\",1)[0].split():\n            if name==\"OAI\" or name.startswith(\"OAI.\"):\n                stack.append(\"lean/\"+name.replace(\".\",\"/\")+\".lean\")\nfor p,sha in EXPECTED.items():\n    assert seen.get(p)==sha,(\"frozen donor/candidate drift\",p,seen.get(p),sha)\nassert len(seen)==164,(\"unexpected original-source closure\",len(seen))\nsource=Path(SOURCE).read_text()\nconsumer=Path(CONSUMER).read_text()\nhelper=Path(HELPER).read_text()\ncontrol=Path(CONTROL_HELPER).read_text()\nassert re.findall(r\"(?m)^import (\\S+)$\",helper)==[\"Mathlib\"]\nassert re.findall(r\"(?m)^#print axioms (\\S+)$\",helper)==[\"FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply\"]\nassert re.findall(r\"(?m)^import (\\S+)$\",control)==[\"Mathlib\"]\nassert re.findall(r\"(?m)^#print axioms (\\S+)$\",control)==CONTROL_ROOTS\nassert \"pairedAlgebraData\" not in control and \"OAI.BFSSQuantum\" not in control\nassert \"Complex.ofRealCLM.comp\" in control and \"ContinuousLinearMap.proj\" in control\nassert \"ContinuousLinearMap.fderiv\" in control\nassert re.findall(r\"(?m)^import (\\S+)$\",source)==[\"OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG10OriginalKineticTauCAR\"]\nassert re.findall(r\"(?m)^import (\\S+)$\",consumer)==[\"OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG11OriginalDerivativeColorContraction\",\"OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe\"]\nassert re.findall(r\"(?m)^#print axioms (\\S+)$\",source)==ROOTS\nassert re.findall(r\"(?m)^#print axioms (\\S+)$\",consumer)==[NAMESPACE+\".\"+n for n in ROOTS]+DONORS\nfor code in (source,consumer,helper,control):\n    assert \"set_option autoImplicit false\" in code\n    assert not re.search(r\"(?m)^\\s*(?:sorry|admit|axiom|unsafe)\\b\",code)\n    assert \"maxHeartbeats\" not in code and \"maxRecDepth\" not in code\nassert \"originalHardyY_basis_off_color\" in source and \"(hBA : B ≠ A)\" in source\nassert \"originalHardyY_basis_contraction M i j hij A\" in source\nassert \"(M.gamma_symmetric k).eq\" in source and \"congrArg (fun C : GammaMatrix => C β δ)\" in source\nassert \"(1 / 4 : ℝ)\" in source and \"(1 / 4 : ℂ)\" in source\nassert \"originalHardyTauCoefficientDerivative_eq_basis\" in source\nassert \"pairedAlgebraData\" in consumer and \"open FCP.BFSSSU2GaugeG1A\" in consumer\nassert \"Boson 2\" in consumer and \"ColorIndex 2\" in consumer and \"SpinIndex\" in consumer\nassert \"(hij : i ≠ j)\" in consumer and \"(hBA : B ≠ A)\" in consumer\nassert \"(4 : ℂ) *\" in consumer and \"(X Z : Boson 2)\" in consumer\nassert \"originalHardyY pairedAlgebraData j i\" in consumer\nassert len(re.findall(r\"(?m)^example\\b\",consumer))==12\nassert Path(\"lean/lean-toolchain\").read_text().strip()==\"leanprover/lean4:v4.34.1\"\npackages=json.loads(Path(\"lean/lake-manifest.json\").read_text())[\"packages\"]\nassert next(v[\"rev\"] for v in packages if v[\"name\"]==\"mathlib\")==\"d13f23b723b8a846827a245b89c10fc7d3f11612\"\nout=Path(\"bfss-aux-hardy-g11-evidence\")\nreceipt={\"status\":\"PREFLIGHT_NOT_LEAN_QUALIFICATION\",\"tested_sha\":git(\"rev-parse\",\"HEAD\"),\n    \"reviewed_existing_source_baseline\":BASE,\"source\":SOURCE,\"consumer\":CONSUMER,\n    \"isolated_helper\":HELPER,\"entry_derivative_helper\":CONTROL_HELPER,\"entry_derivative_roots\":CONTROL_ROOTS,\n    \"transitive_OAI_pin_count\":len(seen),\"pins\":dict(sorted(seen.items())),\n    \"source_roots\":[NAMESPACE+\".\"+n for n in ROOTS],\"independent_donor_roots\":DONORS}\nmanifest=out/\"pin-manifest.json\"\nmanifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+\"\\n\")\nprint(\"BFSS_P3_AUX_HARDY_G11_PREFLIGHT_PASS\",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())\nPY\n"
    - name: Restore pinned Lean and Mathlib
      shell: bash
      timeout-minutes: 40
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

        curl --proto ''=https'' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none

        source "$HOME/.elan/env"

        cd lean

        timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-hardy-g11-evidence/cache.log

        test "$(lake env lean --version | grep -oF ''4.34.1'')" = ''4.34.1''

        test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = ''d13f23b723b8a846827a245b89c10fc7d3f11612''

        '
    - name: Isolated Mathlib finite operator evaluation before native build
      shell: bash
      timeout-minutes: 20
      run: "set -euo pipefail\nsource \"$HOME/.elan/env\"\ncd lean\nhelper_mod=\"OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG5FiniteOperatorEvaluation\"\nhelper_src=\"OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean\"\nhelper_obj=\".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.olean\"\ntimeout 500s lake build \"$helper_mod\" 2>&1 | tee ../bfss-aux-hardy-g11-evidence/helper-build.log\ntimeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o \"$helper_obj\" \"$helper_src\" 2>&1 | tee ../bfss-aux-hardy-g11-evidence/helper.log\npython3 - <<'PY'\nfrom pathlib import Path\nimport re,json\nd=Path(\"../bfss-aux-hardy-g11-evidence\")\nexpected=[\"FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply\"]\nallowed={\"propext\",\"Classical.choice\",\"Quot.sound\"}\ndepwarn=re.compile(r\"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\\.lake/packages/[a-zA-Z0-9_-]+' has local changes$\")\nfor name in (\"helper-build.log\",\"helper.log\"):\n    log=(d/name).read_text()\n    assert not any(x in log for x in (\"error:\",\"sorryAx\",\"unknownIdentifier\")),(name,log[-4500:])\n    assert not [line for line in log.splitlines() if \"warning:\" in line and not depwarn.fullmatch(line)],name\n    if name==\"helper.log\":\n        reports=re.findall(r\"(?m)^'([^'\\n]+)' (?:depends on axioms: \\[([^\\]]*)\\]|does not depend on any axioms)\",log)\n        assert [n for n,_ in reports]==expected,(name,reports)\n        for declaration,raw in reports:\n            assert {x.strip() for x in raw.split(\",\") if x.strip()}<=allowed,(declaration,raw)\n(d/\"helper-scope.json\").write_text(json.dumps({\"status\":\"GENERIC_FINITE_OPERATOR_EVALUATION_PASS\",\"native_G11_qualification\":False},sort_keys=True,indent=2)+\"\\n\")\nprint(\"BFSS_P3_AUX_HARDY_G11_FINITE_OPERATOR_EVALUATION_PASS\")\nPY\n"
    - name: Isolated complex matrix entry derivative before native build
      shell: bash
      timeout-minutes: 20
      run: "set -euo pipefail\nsource \"$HOME/.elan/env\"\ncd lean\nhelper_mod=\"OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG9ComplexMatrixEntryDerivative\"\nhelper_src=\"OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.lean\"\nhelper_obj=\".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.olean\"\ntimeout 500s lake build \"$helper_mod\" 2>&1 | tee ../bfss-aux-hardy-g11-evidence/entry-helper-build.log\ntimeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o \"$helper_obj\" \"$helper_src\" 2>&1 | tee ../bfss-aux-hardy-g11-evidence/entry-helper.log\npython3 - <<'PY'\nfrom pathlib import Path\nimport re,json\nd=Path(\"../bfss-aux-hardy-g11-evidence\")\nexpected=[\"FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM\", \"FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM_apply\", \"FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntry_fderiv_apply\"]\nallowed={\"propext\",\"Classical.choice\",\"Quot.sound\"}\ndepwarn=re.compile(r\"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\\.lake/packages/[a-zA-Z0-9_-]+' has local changes$\")\nfor name in (\"entry-helper-build.log\",\"entry-helper.log\"):\n    log=(d/name).read_text()\n    assert not any(x in log for x in (\"error:\",\"sorryAx\",\"unknownIdentifier\")),(name,log[-4500:])\n    assert not [line for line in log.splitlines() if \"warning:\" in line and not depwarn.fullmatch(line)],name\n    if name==\"entry-helper.log\":\n        reports=re.findall(r\"(?m)^'([^'\\n]+)' (?:depends on axioms: \\[([^\\]]*)\\]|does not depend on any axioms)\",log)\n        assert [n for n,_ in reports]==expected,(name,reports)\n        for declaration,raw in reports:\n            assert {x.strip() for x in raw.split(\",\") if x.strip()}<=allowed,(declaration,raw)\n(d/\"entry-helper-scope.json\").write_text(json.dumps({\"status\":\"COMPLEX_MATRIX_ENTRY_DERIVATIVE_HELPER_PASS\",\"native_G11_qualification\":False},sort_keys=True,indent=2)+\"\\n\")\nprint(\"BFSS_P3_AUX_HARDY_G11_COMPLEX_MATRIX_ENTRY_DERIVATIVE_HELPER_PASS\")\nPY\n"
    - name: Cold original derivative color source and native consumer with six and twelve root reports
      shell: bash
      timeout-minutes: 75
      run: "set -euo pipefail\nsource \"$HOME/.elan/env\"\ncd lean\nmod=\"OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG11OriginalDerivativeColorContraction\"\nsrc=\"OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.lean\"\nobj=\".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.olean\"\nrm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI\ntimeout 3600s lake build \"$mod\" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG9ComplexMatrixEntryDerivative 2>&1 | tee ../bfss-aux-hardy-g11-evidence/build.log\ntimeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o \"$obj\" \"$src\" 2>&1 | tee ../bfss-aux-hardy-g11-evidence/source.log\ntimeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG11OriginalDerivativeColorContractionIndependentConsumer.lean 2>&1 | tee ../bfss-aux-hardy-g11-evidence/consumer.log\npython3 - <<'PY'\nfrom pathlib import Path\nimport re,json\nd=Path(\"../bfss-aux-hardy-g11-evidence\")\nnew_roots=[\"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction.originalHardyY_basis_off_color\", \"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction.originalHardyY_basis_color\", \"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction.originalHardyY_basis_color_contraction\", \"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction.originalHardyY_basis_spin_contraction\", \"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction.originalHardyY_basis_complex_spin_contraction\", \"FCP.BFSSP3AuxHardyG11OriginalDerivativeColorContraction.originalHardyTauCoefficientDerivative_spin_contraction\"]\ndonors=[\"FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_basis_contraction\", \"FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_derivative_contraction\", \"FCP.BFSSP3AuxHardyG9OriginalYEntryDerivativeBinding.originalHardyTauCoefficientDerivative_eq_basis\", \"FCP.BFSSP3AuxHardyG9OriginalYEntryDerivativeBinding.originalHardyTauDerivative_eq_basis\", \"FCP.BFSSP3AuxHardyG10OriginalKineticTauCAR.originalKineticFermion_apply\", \"FCP.BFSSP3AuxHardyG10OriginalKineticTauCAR.originalKineticTau_anticommutator\"]\nentry_roots=['FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM', 'FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM_apply', 'FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntry_fderiv_apply']\nallowed={\"propext\",\"Classical.choice\",\"Quot.sound\"}\ndepwarn=re.compile(r\"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\\.lake/packages/[a-zA-Z0-9_-]+' has local changes$\")\nfor name,expected in [\n    (\"helper-build.log\",None),(\"helper.log\",[\"FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply\"]),(\"entry-helper-build.log\",None),(\"entry-helper.log\",entry_roots),(\"build.log\",None),(\"source.log\",new_roots),(\"consumer.log\",new_roots+donors)]:\n    log=(d/name).read_text()\n    assert not any(x in log for x in (\"error:\",\"sorryAx\",\"unknownIdentifier\")),(name,log[-4500:])\n    assert not [line for line in log.splitlines() if \"warning:\" in line and not depwarn.fullmatch(line)],name\n    if expected is not None:\n        reports=re.findall(r\"(?m)^'([^'\\n]+)' (?:depends on axioms: \\[([^\\]]*)\\]|does not depend on any axioms)\",log)\n        assert [n for n,_ in reports]==expected,(name,reports,expected)\n        for declaration,raw in reports:\n            assert {x.strip() for x in raw.split(\",\") if x.strip()}<=allowed,(declaration,raw)\n(d/\"scope-receipt.json\").write_text(json.dumps({'status': 'ORIGINAL_DERIVATIVE_COLOR_SPIN_CONTRACTION_STRICT_GREEN', 'original_native_Boson_color_spin_gamma_consumer': True, 'off_color_original_basis_zero': True, 'all_color_matrix_derivative_contraction': True, 'kinetic_gamma_row_orientation_via_source_symmetry': True, 'original_complex_coefficient_derivative_contraction': True, 'quarter_normalization_and_swapped_plane_controls': True, 'base_point_independence_control': True, 'new_roots': 6, 'independent_donor_roots': 6, 'isolated_accepted_generic_helper_reports': 1, 'early_complex_matrix_entry_helper_reports': 3, 'full_derivative_Fock_bilinear_assembly_proved': False, 'full_smooth_core_charge_tau_identity_proved': False, 'tau_norm_or_physical_Spin9_proved': False, 'supercharge_energy_domain_identity_proved': False, 'Hardy_fidelity_zero_mode_or_gap_proved': False, 'new_Fock_Clifford_or_Hamiltonian': False},sort_keys=True,indent=2)+\"\\n\")\nprint(\"BFSS_P3_AUX_HARDY_G11_ORIGINAL_DERIVATIVE_COLOR_SPIN_CONTRACTION_STRICT_GREEN\")\nPY\n"
