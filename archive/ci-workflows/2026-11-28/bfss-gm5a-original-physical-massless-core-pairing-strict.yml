name: BFSS GM5A exact original physical massless core pairing strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5AOriginalPhysicalMasslessCorePairing.lean'
      - 'lean/diagnostics/BFSSGM5AOriginalPhysicalMasslessCorePairingIndependentAudit.lean'
      - '.github/workflows/bfss-gm5a-original-physical-massless-core-pairing-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm5a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-physical-massless-core-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm5a-core-pairing"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm5a-core-pairing/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5AOriginalPhysicalMasslessCorePairing.lean \
            lean/diagnostics/BFSSGM5AOriginalPhysicalMasslessCorePairingIndependentAudit.lean \
            .github/workflows/bfss-gm5a-original-physical-massless-core-pairing-strict.yml \
            > "$RUNNER_TEMP/bfss-gm5a-core-pairing/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm5a-core-pairing/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm5a-core-pairing/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction.lean": "a42c8018a8d9fde12b530a81fa96e9765c8cb699",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4B2OriginalPhysicalMasslessRestrictedGraphClosed.lean": "a23aad279b923f6eb6dfeb343590b89a98fded0e",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean": "84853fb624289121938e0fb4d2b45afdc16a74c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph.lean": "2fc90310c9ac476d8e52ba0176ecc94f8994d1c9",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessM1bOriginalRealFieldRestrictionConsumer.lean": "fc2994f932cc13bbade9735f74a97390a4ea224d",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralMasslessCoreFormIdentity.lean": "3a8dd27bb573e62c8f86b79b83e0ab96f391602a",
            "lean/OAI/MathematicalPhysics/BFSS/MassiveMoments.lean": "2fd223d0da1a85c3be52bb2b9c68f4f12d10957e",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean": "e4990dadf1d8bde849e351467282ab3f14989c3b",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","9ee5c7a999531bd502b4ff076af278ba9be5353b","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5AOriginalPhysicalMasslessCorePairing.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM5AOriginalPhysicalMasslessCorePairingIndependentAudit.lean").read_text()
          source_roots = [
            "physicalMasslessCoreInput",
            "physicalMasslessCorePairing",
            "physicalMasslessCoreEnergy",
          ]
          consumer_roots = [
            "pairedPhysicalMasslessCorePairing",
            "pairedPhysicalMasslessCoreEnergy",
          ]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SpectralMasslessCoreFormIdentity",
            "OAI.MathematicalPhysics.BFSS.MassiveMoments",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5AOriginalPhysicalMasslessCorePairing",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM5A_SOURCE_EXACT_CORE_PAIRING_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm5a-core-pairing/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original source native core pairing and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm5a-core-pairing"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5AOriginalPhysicalMasslessCorePairing 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM5AOriginalPhysicalMasslessCorePairingIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm5a-core-pairing"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSGM5A.physicalMasslessCoreInput",
                  "FCP.BFSSGM5A.physicalMasslessCorePairing",
                  "FCP.BFSSGM5A.physicalMasslessCoreEnergy",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSGM5AIndependent.pairedPhysicalMasslessCorePairing",
                  "FCP.BFSSGM5AIndependent.pairedPhysicalMasslessCoreEnergy",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_GM5A_ORIGINAL_SOURCE_CORE_PAIRING_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm5a-core-pairing-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm5a-core-pairing/
          if-no-files-found: warn
          retention-days: 30
