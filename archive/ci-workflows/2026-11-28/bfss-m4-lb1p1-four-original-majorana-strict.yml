name: BFSS M4 LB1P1 four original Majoranas strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean
      - lean/diagnostics/BFSSP3M4LB1P1OriginalFourMajoranaIndependentConsumer.lean
      - .github/workflows/bfss-m4-lb1p1-four-original-majorana-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-lb1p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-four-majorana-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and consumer, accepted donors, stop rule and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-lb1p1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-lb1p1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-lb1p1/preflight.log"
          import json,re,subprocess,hashlib
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean":"9a2899e24c02cb5a5dd58159605a34195fce3856","lean/diagnostics/BFSSP3M4LB1P1OriginalFourMajoranaIndependentConsumer.lean":"5822a7290c04e5fc88b297ad14d9d16b8c290bbd","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB0OriginalSource48MajoranaBivectorCAR.lean":"d08200fae8ef6c9c9544414307ad537f1eeaa4a4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1L2AbstractOriginalFockCovarianceLeibniz.lean":"b4012951a26aa7573db513adab3d7ce27396db7e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0BOriginalSource48SkewPlaneNormalization.lean":"1c47a8645bb8ae18110f29083c95887b8a0e3a15","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0AOriginalSource48SkewPlane.lean":"7eb090ab82be47ecae18ae0d091716188cb2db79","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,want in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==want,(path,want,got)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4LB1P1OriginalFourMajoranaIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==["originalFock_fourFactor_commutator_from_two_covariances","originalSource48_fourMajorana_commutator"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==["originalFock_fourFactor_conditional_consumer","originalSource48_fourMajorana_consumer"]
          assert len(re.findall(r"(?m)^example\b",consumer))==4
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxRecDepth" not in code and "maxHeartbeats" not in code
          assert "Fermion 2 →L[ℂ] Fermion 2" in source
          assert "originalMajorana_bivector_commutator i j k" in source
          assert "originalMajorana_bivector_commutator i j l" in source
          assert "originalFock_product_covariance_from_two_hypotheses" in source
          assert "simp only [sub_mul, mul_sub, smul_mul_assoc, mul_smul_comm]" in source
          assert "originalSource48_fourMajorana_commutator" in consumer
          for key in ("a0 a1 a2 a3","a0 a1 a1 a2","a0 a1 a0 a1","a0 a0 a2 a3"):
              assert key in consumer,key
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          assert state["branch"]=="integration/bfss-unified-research-20261108"
          assert state["last_qualified"]["gate"]=="P3-M4-CT0"
          assert state["last_qualified"]["run_id"]==43983772199
          assert state["active"]["gate"]=="P3-M4-LB1P1"
          assert state["active"]["status"]=="PENDING_STRICT_CI"
          assert state["active"]["qualification"] is False
          assert state["active"]["attempt"]=="R2"
          assert state["active"]["previous_red_run"]==43996551474
          assert state["active"]["previous_red_tested_sha"]=="c34911208aae4964283b39454ed41d990eb1306e"
          assert state["active"]["prior_red_artifact_id"]==14290412981
          assert state["active"]["prior_red_artifact_sha256"]=="0d873a2259c24bc4ccdbb3be175869ad413504dcd0cd12fe8b25830e557e7420"
          assert hashlib.sha256(Path(state["active"]["prior_red_archive"]).read_bytes()).hexdigest()==state["active"]["prior_red_artifact_sha256"]
          assert "P3M4LB1P1OriginalFourMajoranaCommutator.lean:41:6: Unknown identifier" in Path(state["active"]["prior_red_job_log"]).read_text()
          assert state["active"]["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean"]
          assert state["active"]["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean"]
          assert state["active"]["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4LB1P1OriginalFourMajoranaIndependentConsumer.lean"]
          assert state["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          stopped=state["previous_active_CT1G0_R2_stopped"]
          assert stopped["gate"]=="P3-M4-CT1G0"
          assert stopped["status"]=="RED_UNQUALIFIED" and stopped["stopped"] is True
          assert stopped["run_id"]==43991790285 and stopped["previous_red_run"]==43988822460
          assert stopped["stop_reason"]=="TWO_ANALOGOUS_NATIVE_RECURSION_FAILURES"
          assert hashlib.sha256(Path(stopped["evidence_archive"]).read_bytes()).hexdigest()==stopped["artifact_sha256"]
          assert "maxRecDepth" not in source and "maxHeartbeats" not in source
          print("BFSS_M4_LB1P1_SOURCE_CONSUMER_DONOR_TOOLCHAIN_STOP_RULE_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold four-factor original source, independent consumer, strict axiom auditor
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-lb1p1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4LB1P1OriginalFourMajoranaCommutator 2>&1 | tee "$root/cold-source.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4LB1P1OriginalFourMajoranaIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-lb1p1"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def check(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-1500:]
              bad=[x for x in log.splitlines() if "warning:" in x and not allow_warning.fullmatch(x)]
              assert not bad,bad[:5]
              entries=pattern.findall(log)
              assert len(entries)==len(expected),(entries,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in entries]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for n,raw in entries:
                  assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(n,raw)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b"))+"\n"
          check(fixture,["a","b"])
          mutants=[
              fixture.replace("Quot.sound","sorryAx",1),
              fixture.replace("Quot.sound","Unapproved.axiom",1),
              fixture.replace("'N.b'","'N.a'"),
              "\n".join(fixture.splitlines()[:1])+"\n",
              fixture+"warning: unintended source warning\n",
              fixture+"error: native source proof failure\n"]
          for i,bad in enumerate(mutants):
              try: check(bad,["a","b"])
              except AssertionError: pass
              else: raise AssertionError(("negative auditor accepted",i))
          print("BFSS_M4_LB1P1_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          check((root/"source-axioms.log").read_text(),["originalFock_fourFactor_commutator_from_two_covariances","originalSource48_fourMajorana_commutator"])
          check((root/"consumer.log").read_text(),["originalFock_fourFactor_conditional_consumer","originalSource48_fourMajorana_consumer"])
          print("BFSS_M4_LB1P1_FOUR_ORIGINAL_MAJORANAS_2_SOURCE_2_CONSUMER_4_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve complete original preflight, cold source and consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-lb1p1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-lb1p1/
          if-no-files-found: warn
          retention-days: 14
