name: SM-D1-SCC3B0 R1 original rational-decide consumer RED preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-d1-scc3b0-r1-original-consumer-red-preservation.yml
permissions:
  actions: read
  contents: write
jobs:
  archive-original-consumer-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original research Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact originally failed and frozen accepted sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9e1c1015d35699bed47396716678c66d1e24b37e:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC3B0FiniteRationalTotalVariation.lean)" = 8417daf98449b51d45b18951bd389cb3bd777405
          test "$(git rev-parse 9e1c1015d35699bed47396716678c66d1e24b37e:lean/diagnostics/SMD1SCC3B0RationalTotalVariationIndependentConsumer.lean)" = a6484a8cfeeef722d69539a524a4a2b0b79ee3ac
          test "$(git rev-parse 9e1c1015d35699bed47396716678c66d1e24b37e:.github/workflows/sm-d1-scc3b0-rational-tv-lean-strict.yml)" = d74f7e980ab7974a21e7805c9b1dacfce98cba52
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC3B0FiniteRationalTotalVariation.lean)" = 8417daf98449b51d45b18951bd389cb3bd777405
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC3PrivatePairIncidence.lean)" = e7e737fa6877a85ef2bc216e3adb7fb63e12f485
          python3 - <<'PY'
          import json
          from pathlib import Path
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert sm['last_qualified_formal_methodology']['gate']=='SM-D1-SCC3A'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert not list(Path('research/standard-model/evidence').glob('SMD1_SCC3B0_R1_44413642677_*'))
          print('SM_D1_SCC3B0_R1_ORIGINAL_RED_TESTED_SOURCE_CONSUMER_AND_27_BFSS_ANCHORS_PINNED')
          PY
      - name: Independently authenticate original R1 RED ZIP and complete job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/etblink/math'
          run=44413642677;job=135188075994;artifact=14479586372
          tested='9e1c1015d35699bed47396716678c66d1e24b37e'
          size=2611
          digest='6934aaea446f9d149c91446bcec3bc89f8f5e31a79cf02a83ae8dd7071063715'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as r:return json.load(r)
          r=api(f'/actions/runs/{run}')
          j=api(f'/actions/jobs/{job}')
          a=api(f'/actions/artifacts/{artifact}')
          assert (r['head_sha'],r['status'],r['conclusion'],r['run_attempt'])==(tested,'completed','failure',1)
          assert (j['id'],j['run_id'],j['conclusion'])==(job,run,'failure')
          for name in ('Checkout exact unified','Verify native source','Restore pinned Lean'):
              assert any(s['name'].startswith(name) and s['conclusion']=='success' for s in j['steps']),name
          assert any(s['name'].startswith('Cold rational TV') and s['conclusion']=='failure' for s in j['steps'])
          assert (a['id'],a['size_in_bytes'],a['digest'])==(artifact,size,'sha256:'+digest)
          assert (a['workflow_run']['id'],a['workflow_run']['head_sha'])==(run,tested)
          assert a['name']=='sm-d1-scc3b0-original-rational-tv-source-consumer'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(path):
              try:
                  res=urllib.request.build_opener(NoRedirect).open(
                      urllib.request.Request(base+path,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  url=e.headers['Location']
                  assert url.startswith('https://')
                  with urllib.request.urlopen(url,timeout=90) as r:return r.read()
              else:
                  with res:return res.read()
          raw=download(f'/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert {'tested-commit.txt','preflight.log','cold-source.log',
                      'source-axioms.log','consumer.log'}<=names,names
              assert 'auditor.log' not in names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'SM_D1_SCC3B0_7_SOURCE_5_CONSUMER_2_EXAMPLES_PINNED_SCC3A_SCC2_SCC1_SM_Y0_SM_D0_SCC0_27_BFSS_ANCHORS_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully' in cold and 'sorryAx' not in cold
              source=z.read('source-axioms.log').decode()
              assert 'sorryAx' not in source and 'error:' not in source
              assert len(re.findall(r"(?m)^'FCP\.StandardModel\.SMD1SCC3B0\.totalVariation_[^']+' depends on axioms:",source))==7
              consumer=z.read('consumer.log').decode()
              assert consumer.count('error: Tactic ')>=5
              assert 'did not reduce to' in consumer
              assert 'sorryAx' in consumer
              members=[{'name':n,'size':len(z.read(n)),
                        'sha256':hashlib.sha256(z.read(n)).hexdigest(),
                        'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'/actions/jobs/{job}/logs')
          assert len(full)>40000 and b'did not reduce to' in full and b'sorryAx' in full
          out=Path('research/standard-model/evidence')
          out.mkdir(parents=True,exist_ok=True)
          zp=out/'SMD1_SCC3B0_R1_44413642677_ORIGINAL_CONSUMER_RED_evidence.zip'
          lp=out/'SMD1_SCC3B0_R1_44413642677_ORIGINAL_complete_job.log'
          mp=out/'SMD1_SCC3B0_R1_44413642677_ORIGINAL_CONSUMER_RED_evidence_manifest.json'
          for p in (zp,lp,mp):assert not p.exists(),p
          zp.write_bytes(raw);lp.write_bytes(full)
          mp.write_text(json.dumps({
             'gate':'SM-D1-SCC3B0','attempt':'R1',
             'status':'ORIGINAL_SOURCE_GREEN_CONSUMER_RATIONAL_DECIDE_RED_UNQUALIFIED',
             'original_run':run,'original_job':job,'tested_commit':tested,'original_artifact':artifact,
             'original_zip':{'path':str(zp),'size':len(raw),'sha256':digest,'members':members},
             'complete_job_log':{'path':str(lp),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
             'original_source_blob':'8417daf98449b51d45b18951bd389cb3bd777405',
             'original_consumer_blob':'a6484a8cfeeef722d69539a524a4a2b0b79ee3ac',
             'original_workflow_blob':'d74f7e980ab7974a21e7805c9b1dacfce98cba52',
             'original_source_axiom_reports_clean':7,
             'independent_consumer':'RED_NOT_QUALIFIED',
             'causal_failure':'Five nonreducing decide on finite rational sums in independent consumer',
             'BFSS_original_accepted_anchors_preserved':27,
             'claim_ceiling':'No accepted SCC3B0, no physical prediction, and no inference from failed consumer.'
          },sort_keys=True,indent=2)+'\n')
          print('SM_D1_SCC3B0_R1_ORIGINAL_CONSUMER_RED_ZIP_JOB_SHA_CRC_INDEPENDENTLY_VERIFIED')
          PY
      - name: Commit original unmodified R1 RED ZIP job and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/standard-model/evidence/SMD1_SCC3B0_R1_44413642677_ORIGINAL_*
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'SM-D1-SCC3B0 R1 preserve original rational-decide consumer RED'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
