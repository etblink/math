name: RHOPF P9C0 original Gamma9 commuting triple and involutions strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9C0OriginalGammaCommutingTriple.lean
      - lean/diagnostics/RHOPFP9C0OriginalGammaCommutingIndependentAudit.lean
      - .github/workflows/rhopf-p9c0-original-gamma-commuting-triple-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhopf-p9c0-source-triple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-original-source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout exact original pinned unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact source hashes native declarations and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhopf-p9c0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/rhopf-p9c0/exact-tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/rhopf-p9c0/toolchain-sha256.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          packages=json.loads(Path('lean/lake-manifest.json').read_text())['packages']
          assert next(x['rev'] for x in packages if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          prefix='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/'
          pins={
            'lean/OAI/MathematicalPhysics/BFSS/Core.lean':'9882359ced78b0a3bd7e2f057974bd0a031b3e60',
            prefix+'SU2RealGammaProbe.lean':'b9b8192055c70f0d001d7982669b9823c55562ed',
            prefix+'RHOPFP9A0OriginalGammaPairClifford.lean':'bf5eb554232a6d452e86d85b05220aad7c5d0aeb',
            prefix+'RHOPFP9A1AOriginalGammaGeneratorInequivalence.lean':'779bd9a78811f60397657df8b8a4350aafae57b7',
            prefix+'SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe.lean':'a9c96b4840e297b0b79f343d32e3992f50a5ace0',
            prefix+'RHOPFP9C0OriginalGammaCommutingTriple.lean':'b93450236ea9cc93869c5a09102708d3c62b5dd3',
            'lean/diagnostics/RHOPFP9C0OriginalGammaCommutingIndependentAudit.lean':'f4fe3eaad3bce730e125b1631aa5dc2f2ca7630d',
            'research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py':'9d20952c366e356ff5dc656a35d0b604236a15ac',
            'research/topology/data/BFSS_GAMMA9_SOURCE_PERMUTATION_FIXTURE_2026_11_18.json':'684680e139cfcd09c37bf075c0c014bdaa80ba35'}
          for path,sha in pins.items():
            found=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert found==sha,(path,found,sha)
          source=Path(prefix+'RHOPFP9C0OriginalGammaCommutingTriple.lean').read_text()
          consumer=Path('lean/diagnostics/RHOPFP9C0OriginalGammaCommutingIndependentAudit.lean').read_text()
          assert re.findall(r'(?m)^import (\S+)$',source)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A0OriginalGammaPairClifford',
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe']
          assert re.findall(r'(?m)^import (\S+)$',consumer)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C0OriginalGammaCommutingTriple']
          names=['K13_K25_commute','K13_K46_commute','K25_K46_commute',
                 'K13K25_involution','K13K46_involution','K25K46_involution']
          assert re.findall(r'(?m)^theorem (\S+)',source)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',source)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',consumer)==[
            'FCP.RHOPFP9C0.'+n for n in names]
          for s in (source,consumer):
            assert 'set_option autoImplicit false' in s
            assert not re.search(r'(?m)^\s*(?:sorry|admit|axiom|unsafe|opaque|constant)\b',s)
            assert not re.search(r'(?m)^\s*set_option\s+(?:maxRecDepth|maxHeartbeats)',s)
            assert 'import all' not in s
          print('RHOPF_P9C0_EXACT_SOURCE_AND_PROOF_CONTRACT_PASS')
          PY
          python3 research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py |
            tee "$RUNNER_TEMP/rhopf-p9c0/independent-original-integer-consumer.json"

      - name: Restore exact Lean 4.34.1 and pinned Mathlib
        timeout-minutes: 44
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2000s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'

      - name: Build qualified original Clifford source and native commuting triple
        timeout-minutes: 48
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 2700s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A0OriginalGammaPairClifford 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9c0/qualified-dependencies-build.log"
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9C0OriginalGammaCommutingTriple
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 650s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9c0/native-proof-and-axioms.log"

      - name: Independent exact-source Lean types and strict axiom audit
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=diagnostics/RHOPFP9C0OriginalGammaCommutingIndependentAudit
          mkdir -p .lake/build/lib/lean/diagnostics
          timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9c0/independent-lean-types-and-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'rhopf-p9c0'
          reports=[
            (root/'native-proof-and-axioms.log').read_text(),
            (root/'independent-lean-types-and-axioms.log').read_text()]
          names=['K13_K25_commute','K13_K46_commute','K25_K46_commute',
                 'K13K25_involution','K13K46_involution','K25K46_involution']
          for data in reports:
            for name in names:
              full='FCP.RHOPFP9C0.'+name
              matches=re.findall(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]+)\]",data,re.S)
              if len(matches)==1:
                axioms={a.strip() for a in matches[0].split(',')}
                assert axioms.issubset({'propext','Classical.choice','Quot.sound'}),(full,axioms)
              else:
                assert "'"+full+"' does not depend on any axioms" in data,(full,matches)
            assert 'sorryAx' not in data and 'error:' not in data
          print('RHOPF_P9C0_NATIVE_AND_INDEPENDENT_STRICT_PASS')
          PY

      - name: Retain exact tested commit original proof logs and RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhopf-p9c0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhopf-p9c0
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
