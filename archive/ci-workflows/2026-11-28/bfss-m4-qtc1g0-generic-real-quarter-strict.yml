name: BFSS M4 QTC1G0 isolated original Fock generic real quarter strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1G0OriginalFockGenericRealQuarter.lean
      - lean/diagnostics/BFSSP3M4QTC1G0OriginalFockGenericRealQuarterIndependentConsumer.lean
      - .github/workflows/bfss-m4-qtc1g0-generic-real-quarter-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-qtc1g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generic-original-Fock-real-quarter:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact new source, independent consumer, original REDs and qualified donors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-qtc1g0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-qtc1g0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-qtc1g0/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1G0OriginalFockGenericRealQuarter.lean":"3a2015658d8d9f20d0a9ab4ae7deb9061949a256","lean/diagnostics/BFSSP3M4QTC1G0OriginalFockGenericRealQuarterIndependentConsumer.lean":"94a379def18b71e22c3be162b5272100628a8bcb","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean":"e52b8ca7a440e04ab3c3a93187e5100daa39e074","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean":"9448c9a47c605cb6aba2cfc798ae28a0213c9411","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1OriginalSourceRealComplexQuarterBridge.lean":"91ae604dbd8129320c0822bac16b4302c14d3c15","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0D_R1_44018395393_evidence.zip":"c0de176f927ba70bed4494534f881d2ff93e732d","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_evidence.zip":"721c3b827bffafbe61d3d81720a103fb5297e389","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip":"7cebb61b36ba22283cbd27a8d5f91b301b7303e2","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip":"671be94ee31c954b8f8b276de7b8ede9359aa617","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip":"485d47d68a5425a79d720248a4b64b972da619ab","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R1_44020471704_evidence.zip":"8ae6ad676712bd361d4a4a0568fc5924a3c3daa5","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R2_44022359538_evidence.zip":"387e2c5d271459d524259800a269e752ab0b9001","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R1_44020471704_complete_job.log":"aa18bfb54c64d248849508c60d6cfd7f66d32cea","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R2_44022359538_complete_job.log":"8cb9db0265e187278bed283b081bda0adf21ae99","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1G0OriginalFockGenericRealQuarter.lean").read_text()
          con=Path("lean/diagnostics/BFSSP3M4QTC1G0OriginalFockGenericRealQuarterIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==["originalFock_real_quarter_quadratic_generic"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==["originalFock_real_quarter_generic_consumer"]
          assert len(re.findall(r"(?m)^theorem\b",src))==1
          assert len(re.findall(r"(?m)^theorem\b",con))==1
          assert len(re.findall(r"(?m)^example\b",con))==7
          assert len(re.findall(r"(?m)^import ",src))==2
          assert con.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC1G0OriginalFockGenericRealQuarter\n")
          for body in (src,con):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
              assert not re.search(r"(?m)^import\s+\S*P3M4QTC1OriginalSource",body)
              assert not re.search(r"(?m)^import\s+\S*P3M4QTC0B",body)
          assert "Fermion 2 →L[ℂ] Fermion 2" in src
          assert "originalFockOperator_real_smul_eq_complex_smul" in src
          assert "push_cast" in src and "Finset.smul_sum" in src and "exact_mod_cast" not in src
          assert "sourceNormalizedGamma" not in src and "originalSource48BivectorK" not in src
          assert "(B p q / 4 : ℝ)" in src and "(1 / 4 : ℂ)" in src
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q=s["last_qualified"];a=s["active"]
          assert q["gate"]=="P3-M4-QTC0D" and q["run_id"]==44018395393 and q["status"]=="GREEN_QUALIFIED"
          assert a["gate"]=="P3-M4-QTC1G0" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1G0OriginalFockGenericRealQuarter.lean"] and a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4QTC1G0OriginalFockGenericRealQuarterIndependentConsumer.lean"]
          assert a["accepted_predecessor_run"]==44018395393
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==1
          assert a["independent_controls"]==7
          assert a["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert Path(a["prospective_receipt"]).is_file()
          stop=s["previous_active_QTC1_R2_stopped"]
          assert stop["status"]=="RED_UNQUALIFIED" and stop["stopped"] is True
          assert stop["run_id"]==44022359538 and stop["stop_reason"]=="TWO_ANALOGOUS_SOURCE48_DEFINITIONAL_JOIN_RECURSION_REDS"
          assert stop["artifact_sha256"]=="8ed71c1a193032813804829c975e35f5fce8f666609c344d142601aabe05a6ff"
          assert s["previous_active_QTC1_R1_RED"]["run_id"]==44020471704
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          artifacts={
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0D_R1_44018395393_evidence.zip":
            "7b19d5dc6d02f14c9ae831382b4d2f8c42d20d5a0ab4ad585d8e8858e9b1a54f",
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_evidence.zip":
            "1a95148f7dc41086683592b670257734c7726f0fff0929e4b59930a65ffefa0e",
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip":
            "bf8d93fe00846c9ea26815d32ee331424d9510d1816b66cd98c90ef82baf724c",
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip":
            "a50bc06b6f5ac03c15be16de7b943910ca55bc3a7960f40829c1049e8402c5c1",
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip":
            "f7fa7726865600cab92e1270b558dcc856ad0cfc28318f2bb7d95e74b7ab8dbb",
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R1_44020471704_evidence.zip":
            "4effa4881bb7d33f5397873db92bfa4279e351dbda9d1991062356fe1ed73bd8",
            "research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC1_R2_44022359538_evidence.zip":
            "8ed71c1a193032813804829c975e35f5fce8f666609c344d142601aabe05a6ff"}
          for path,digest in artifacts.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(path) as z: assert z.testzip() is None
          print("BFSS_M4_QTC1G0_ISOLATED_GENERIC_FOCK_SOURCE_PREVIOUS_REDS_AND_DONORS_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold generic source, independent consumer and strict one-root axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-qtc1g0"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC1G0OriginalFockGenericRealQuarter 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1G0OriginalFockGenericRealQuarter.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4QTC1G0OriginalFockGenericRealQuarterIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-qtc1g0"
          allowed={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              extras=[x for x in log.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
              assert not extras,extras[:5]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for root_name,axioms in found:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(root_name,axioms)
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a"])
          mutants=[
              good.replace("Quot.sound","sorryAx",1),
              good.replace("Quot.sound","NotApproved.axiom",1),
              good+good,
              "",
              good+"warning: unexpected warning\n",
              good+"error: failed proof\n"
          ]
          for k,bad in enumerate(mutants):
              try: audit(bad,["a"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted negative mutation",k))
          print("BFSS_M4_QTC1G0_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),["originalFock_real_quarter_quadratic_generic"])
          audit((root/"consumer.log").read_text(),["originalFock_real_quarter_generic_consumer"])
          print("BFSS_M4_QTC1G0_ORIGINAL_FOCK_1_SOURCE_1_CONSUMER_7_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve original exact job source, consumer and auditor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-qtc1g0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-qtc1g0/
          if-no-files-found: warn
          retention-days: 14
