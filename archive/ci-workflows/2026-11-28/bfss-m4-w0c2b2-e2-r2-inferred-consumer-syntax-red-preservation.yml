name: BFSS W0C2B2 E2 R2 original consumer syntax RED preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-e2-r2-inferred-consumer-syntax-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-e2-r2-syntax-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable E2 R2 tested source and original history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify 27 accepted anchors exact source consumer and frozen R1 RED evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean)" = 7d372392703d0fe69942df9df58b421af6850656
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSW0C2B2E2R2OriginalTargetGammaActionIndependentConsumer.lean)" = e4e532f5c6b49a24617642d2b47a0e4a7a75d1e2
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-e2-r2-inferred-original-target-consumer-strict.yml)" = 2a2d058a28f5f1948366686fb97719ff3deea7b4
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E2_R1_44376918039_NATIVE_CONSUMER_RED_evidence.zip)" = eb1f32067abc3fedf97a6a160c4f6f0ffae23c4c
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B2_E2_R1_44376918039_complete_job.log)" = f158faf777920ca7dc0c7e3af6f2cae6e300855d
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B2_E2_R1_44376918039_NATIVE_CONSUMER_RED_evidence_manifest.json)" = ad9a0d2f58a7e743a484cbfcc08b8bbeff3c0063
          test "$(git rev-parse HEAD:research/methodology/TRUTH_FIRST_FOUNDATIONAL_RESEARCH_CHARTER_2026_11_18.md)" = 0513dda5fe1feaf4572d0dd1ed09293994ec2391
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert (a['active']['gate'],a['active']['status'],a['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert a['active']['native_red_count']==2
          assert len(a['accepted_anchors'])==27
          assert a['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          for name in (
              'BFSS_M4_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence.zip',
              'BFSS_W0C2B2_E2_R2_44382978294_complete_job.log',
              'BFSS_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence_manifest.json'):
              assert not (Path('research/quantum-information/diagnostics')/name).exists(),name
          print('BFSS_E2_R2_ORIGINAL_SYNTAX_RED_27_ANCHORS_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Download original E2 R2 ZIP and complete original job log with SHA and CRC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/etblink/math'
          run=44382978294;job=135079923900;art=14466171522
          tested='c67a5982dbe0cd0f3b2524a1b64e590f95ba4031'
          zip_size=20402;digest='2269072bb67c4e263c54afb8418d5c1c935c04ddf0d4a9e05620a7970dbfd39c'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as r:return json.load(r)
          rr=getjson(f'/actions/runs/{run}')
          jj=getjson(f'/actions/jobs/{job}')
          aa=getjson(f'/actions/artifacts/{art}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(tested,'completed','failure',1)
          assert jj['run_id']==run and jj['conclusion']=='failure'
          for name,outcome in [('Checkout original immutable','success'),('Preflight 27 anchors','success'),
                               ('Restore pinned Lean','success'),('Cold frozen E2 source','failure'),
                               ('Upload original E2 source/consumer','success')]:
              assert any(s['name'].startswith(name) and s['conclusion']==outcome for s in jj['steps']),name
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(art,zip_size,'sha256:'+digest)
          assert aa['workflow_run']['head_sha']==tested and aa['workflow_run']['id']==run
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(path):
              url=base+path
              try:resp=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with resp:return resp.read()
          raw=download(f'/actions/artifacts/{art}/zip')
          assert len(raw)==zip_size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert {'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log'}<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_E2_R2_27_ANCHORS_R1_ORIGINAL_CONSUMER_RED_FROZEN_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              assert 'Build completed successfully (9241 jobs)' in z.read('cold-source.log').decode()
              assert 'error:' not in z.read('source-axioms.log').decode() and 'sorryAx' not in z.read('source-axioms.log').decode()
              cons=z.read('consumer.log').decode()
              assert "36:71: error: unexpected token ':='; expected ':'" in cons
              assert "44:47: error: unexpected token ':='; expected ':'" in cons
              assert 'error(lean.inferDefTypeFailed)' in cons
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'/actions/jobs/{job}/logs')
          assert len(full)>150000,len(full)
          for marker in (b'Build completed successfully (9241 jobs)',b"unexpected token ':='; expected ':'",b'Artifact ID 14466171522'):
              assert marker in full,marker
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          zp=root/'BFSS_M4_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence.zip'
          lp=root/'BFSS_W0C2B2_E2_R2_44382978294_complete_job.log'
          mp=root/'BFSS_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence_manifest.json'
          for f in (zp,lp,mp):assert not f.exists(),f
          zp.write_bytes(raw);lp.write_bytes(full)
          mp.write_text(json.dumps({
              'gate':'P3-M4-W0C2B2-E2','attempt':'R2','status':'SOURCE_CLEAN_CONSUMER_SYNTAX_RED_NOT_ANALOGOUS_RECURSION',
              'strict_run':run,'job_id':job,'artifact_id':art,'tested_sha':tested,
              'original_zip':{'path':str(zp),'size':len(raw),'sha256':digest,'members':members},
              'original_job_log':{'path':str(lp),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'7d372392703d0fe69942df9df58b421af6850656',
              'consumer_blob':'e4e532f5c6b49a24617642d2b47a0e4a7a75d1e2',
              'workflow_blob':'2a2d058a28f5f1948366686fb97719ff3deea7b4',
              'source_compiled':True,'source_axiom_report_standard_only':True,
              'consumer_compiled':False,'consumer_axioms_qualified':False,
              'first_causal_error':'Lean theorem declaration requires explicit : type; two source-inferred theorem syntax forms rejected, lines 36 and 44',
              'is_same_native_recursion_as_R1':False,'equivalent_two_red_architecture_stop_triggered':False,
              'original_B2_canonical_status':'BLOCKED','accepted_anchor_count':27,
              'claim_ceiling':'No E2 qualified diagnostic, no original Lie-bracket conclusion; syntax RED is not physics'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_E2_R2_ORIGINAL_ZIP_COMPLETE_LOG_SHA_CRC_SYNTAX_DIAGNOSTICS_PRESERVED')
          PY
      - name: Commit immutable original E2 R2 native syntax RED evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B2_E2_R2_44382978294_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS E2 R2: preserve original source-clean independent consumer syntax RED'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
