name: BFSS CT0 R2 exact GREEN artifact preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths: [.github/workflows/bfss-ct0-r2-evidence-preservation.yml]

permissions:
  actions: read
  contents: read

jobs:
  preserve-exact-original-ct0-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Independently rehash and expose complete original CT0 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,base64,zipfile,io,re
          artifact=14285716957
          run=43983772199
          tested="7f7ae98f77858f79beccd9e1efdd334b513e2f56"
          expected="9e0a0118673c45300ff90414d039a64987d41dc04dd4559368c4bb2e595a7b8d"
          api="https://api.github.com/repos/etblink/math/actions/artifacts/"+str(artifact)
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=60) as r:
              meta=json.load(r)
          assert meta["id"]==artifact and meta["size_in_bytes"]==17839,meta
          assert meta["workflow_run"]["id"]==run
          assert meta["workflow_run"]["head_sha"]==tested
          assert meta["digest"]=="sha256:"+expected
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              reply=opener.open(urllib.request.Request(api+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302,e
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=60) as reply:
                  raw=reply.read()
          else:
              with reply:
                  raw=reply.read()
          assert len(raw)==17839
          assert hashlib.sha256(raw).hexdigest()==expected
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert set(names)=={"tested-commit.txt","preflight.log","cold-source.log","source-axioms.log","consumer.log"},names
              assert z.read("tested-commit.txt").decode().strip()==tested
              pre=z.read("preflight.log").decode()
              assert "BFSS_M4_CT0_EXACT_SOURCE_CONSUMER_DONOR_TOOLCHAIN_AND_CHECKPOINT_PREFLIGHT_PASS" in pre
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9180 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              allowed={"propext","Classical.choice","Quot.sound"}
              allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
              def reports(log,roots):
                  assert "error:" not in log and "sorryAx" not in log
                  bad=[line for line in log.splitlines() if "warning:" in line and not allowed_warning.fullmatch(line)]
                  assert not bad,bad
                  items=pattern.findall(log)
                  assert len(items)==3,(items,roots)
                  labels=[x.rsplit(".",1)[-1] for x,_ in items]
                  assert len(set(labels))==3 and set(labels)==set(roots),(labels,roots)
                  assert all({a.strip() for a in raw.split(",") if a.strip()}<=allowed for _,raw in items)
                  return [{"name":full,"axioms":[x.strip() for x in a.split(",") if x.strip()]} for full,a in items]
              src=reports(z.read("source-axioms.log").decode(),[
                "originalFockTrace_mul_comm",
                "originalFock_complex_skew_symmetric_doubleSum_zero",
                "originalSource48BivectorK_skew_trace_zero"])
              consumer=reports(z.read("consumer.log").decode(),[
                "originalFockTrace_mul_comm_consumer",
                "originalFock_complex_skew_symmetric_doubleSum_zero_consumer",
                "originalSource48BivectorK_skew_trace_zero_consumer"])
              entries=[{"name":n,"bytes":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in names]
          print("BFSS_CT0_R2_ORIGINAL_ZIP_REHASH_PASS "+json.dumps({
              "artifact_id":artifact,"original_run":run,"tested_sha":tested,
              "bytes":len(raw),"sha256":expected,"zip_integrity":"PASS",
              "entries":entries,"cold_jobs":9180,
              "source_reports":src,"consumer_reports":consumer,
              "claim_scope":"original skew Source48 K(A) trace zero only"},sort_keys=True))
          print("BFSS_CT0_R2_ORIGINAL_ZIP_BASE64 "+base64.b64encode(raw).decode())
          PY
