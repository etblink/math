            pref+'RHOPFP9C3D2G1D2OriginalGammaInterSphereHomeomorph.lean':'867385524e1ccdd53dfa3350ae3e92f8538ae94a',
            pref+'RHOPFP9C3D2G1D3OriginalGammaRangeUnitCoordinateHomeomorph.lean':'3e559cc73421704ea7a7dc729e592645e526b8d0',
            pref+'RHOPFP9C3D2G1D4OriginalGammaRelationalStandardSphereHomeomorph.lean':'e837ba778a8d580725c7dec60f4ccb63e476d442',
            pref+'RHOPFP9C3D2G1D5OriginalGammaStandardSphereCircleAction.lean':'243364cd6793a22fd3027278c2b348f514b12179',
            pref+'RHOPFP9C3D2G1D6OriginalGammaStandardSphereCircleFreeAction.lean':'3633f459a7770409c8583749c5c273eb21d1b4e8',
            pref+'RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuity.lean':'6d62408c5eabcf42947e8b2f970519c171a4905e',
            'lean/diagnostics/RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuityIndependentAudit.lean':'2b5e0baede1a4bfbd2840be0842b66c3fcb5f3e0',
            'research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py':'9d20952c366e356ff5dc656a35d0b604236a15ac',
            'research/topology/data/BFSS_GAMMA9_SOURCE_PERMUTATION_FIXTURE_2026_11_18.json':'684680e139cfcd09c37bf075c0c014bdaa80ba35'}
          for path,sha in pins.items():
            got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert got==sha,(path,got,sha)
          src=Path(pref+'RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuity.lean').read_text()
          consumer=Path('lean/diagnostics/RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuityIndependentAudit.lean').read_text()
          assert re.findall(r'(?m)^import (\S+)$',src)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C3D2G1D6OriginalGammaStandardSphereCircleFreeAction',
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C3D2F4OriginalGammaRelationalUnitCircleJointContinuity']
          assert re.findall(r'(?m)^import (\S+)$',consumer)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuity']
          names=['relationalStandardCircleAction_joint_continuous']
          assert re.findall(r'(?m)^theorem (\S+)',src)==names
          assert re.findall(r'(?m)^abbrev (\S+)',src)==[]
          assert re.findall(r'(?m)^noncomputable def (\S+)',src)==[]
          assert re.findall(r'(?m)^#print axioms (\S+)$',src)==['relationalStandardCircleAction_joint_continuous']
