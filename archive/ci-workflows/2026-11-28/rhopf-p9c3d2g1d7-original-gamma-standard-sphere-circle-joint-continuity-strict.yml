name: RHOPF P9C3D2G1D7 original Gamma9 standard sphere Circle joint continuity strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuity.lean
      - lean/diagnostics/RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuityIndependentAudit.lean
      - .github/workflows/rhopf-p9c3d2g1d7-original-gamma-standard-sphere-circle-joint-continuity-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhopf-p9c3d2g1d7-source-circle-group-representation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout exact original source on unified integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact original-source hashes and bounded proof-contract preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhopf-p9c3d2g1d7"
          git rev-parse HEAD | tee "$RUNNER_TEMP/rhopf-p9c3d2g1d7/exact-tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/rhopf-p9c3d2g1d7/toolchain-sha256.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          packages=json.loads(Path('lean/lake-manifest.json').read_text())['packages']
          assert next(x['rev'] for x in packages if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          pref='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/'
