      - name: Restore exact Lean 4.34.1 and Mathlib
        timeout-minutes: 44
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2000s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'

      - name: Compile accepted P9C0 and bounded native relational projection
        timeout-minutes: 48
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 2700s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C3D2G1D6OriginalGammaStandardSphereCircleFreeAction 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9c3d2g1d7/qualified-original-dependency-build.log"
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuity
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 650s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9c3d2g1d7/native-standard-sphere-circle-joint-continuity-and-axioms.log"

      - name: Independent source type consumer and strict axiom reports
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=diagnostics/RHOPFP9C3D2G1D7OriginalGammaStandardSphereCircleJointContinuityIndependentAudit
          mkdir -p .lake/build/lib/lean/diagnostics
          timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9c3d2g1d7/independent-lean-types-and-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'rhopf-p9c3d2g1d7'
          reports=[
            (root/'native-standard-sphere-circle-joint-continuity-and-axioms.log').read_text(),
            (root/'independent-lean-types-and-axioms.log').read_text()]
          for data in reports:
            for name in ['relationalStandardCircleAction_joint_continuous']:
              full='FCP.RHOPFP9C3D2G1D7.'+name
              matches=re.findall(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]+)\]",data,re.S)
              if len(matches)==1:
                axioms={a.strip() for a in matches[0].split(',')}
                assert axioms.issubset({'propext','Classical.choice','Quot.sound'}),(full,axioms)
              else:
                assert "'"+full+"' does not depend on any axioms" in data,(full,matches)
            assert 'sorryAx' not in data and 'error:' not in data
          print('RHOPF_P9C3D2G1D7_NATIVE_INDEPENDENT_STRICT_PASS')
          PY

      - name: Archive original tested source and all RED/GREEN proof diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhopf-p9c3d2g1d7-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhopf-p9c3d2g1d7
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
