            'FCP.RHOPFP9C3D2G1D7.'+n for n in ['relationalStandardCircleAction_joint_continuous']]
          # Structural source/consumer scope precheck prevents unmatched sections
          assert re.findall(r'(?m)^namespace (\S+)$',src)==['FCP.RHOPFP9C3D2G1D7']
          assert re.findall(r'(?m)^end(?: (\S+))?$',src)==['','FCP.RHOPFP9C3D2G1D7']
          assert re.findall(r'(?m)^noncomputable section$',src)==['noncomputable section']
          assert re.findall(r'(?m)^namespace (\S+)$',consumer)==['FCP.RHOPFP9C3D2G1D7Independent']
          assert re.findall(r'(?m)^end(?: (\S+))?$',consumer)==['','FCP.RHOPFP9C3D2G1D7Independent']
          assert re.findall(r'(?m)^noncomputable section$',consumer)==['noncomputable section']
