name: BFSS M4 HS1 original Spin9 Fock HS group strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS1OriginalSpin9FockHSUnitaryGroupAction.lean
      - lean/diagnostics/BFSSP3M4HS1OriginalSpin9FockHSUnitaryGroupIndependentConsumer.lean
      - .github/workflows/bfss-m4-hs1-original-spin9-fock-group-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-hs1-original-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-Fock-HS-isometry-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact unified integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact new source, original donors, independent consumer and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-hs1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-hs1/tested-commit.txt"
          python3 - <<'PY'
          import re,json,subprocess
          from pathlib import Path
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS1OriginalSpin9FockHSUnitaryGroupAction.lean":"a9c7b74e358eef4a56c2ae11eca5f138842d55a8",
            "lean/diagnostics/BFSSP3M4HS1OriginalSpin9FockHSUnitaryGroupIndependentConsumer.lean":"2f615ef5d62eceb9b47d4e0bbc5b00e21bb50622",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS0OriginalSpin9FockHSIsometry.lean":"780850642b475c53a91fb4c5dd91c3c6f46a1839",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB3OriginalFockStarAutomorphismAction.lean":"b50ef04695587b267ad8519074b1293f98828749",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1AOriginalFockTracePairing.lean":"b79f4230dc03670f4b3fffc425a0cc283688a7c6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M2AOriginalFockHSFiber.lean":"89543ae62bc971303cbb15d3a0c3207e114d57fa",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for p,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert got==sha,(p,sha,got)
          p=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS1OriginalSpin9FockHSUnitaryGroupAction.lean")
          s=p.read_text()
          c=Path("lean/diagnostics/BFSSP3M4HS1OriginalSpin9FockHSUnitaryGroupIndependentConsumer.lean").read_text()
          assertions=["originalSpin9FockHSFiberIsometryEquiv","originalSpin9FockHSFiberIsometryEquiv_apply",
            "originalSpin9FockHSFiberUnitaryHom","originalSpin9FockHSFiberUnitaryHom_toOperator",
            "originalSpin9FockHSFiberUnitaryHom_fixes_operator_one"]
          controls=["originalHS_group_law_consumer","originalHS_group_identity_consumer",
            "originalHS_fockOperator_consumer","originalHS_unitary_norm_consumer",
            "originalHS_operatorOne_singlet_consumer"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==assertions
          assert re.findall(r"(?m)^#print axioms (\S+)$",c)==controls
          assert "originalSpin9FockHSFiberLinearEquiv" in s
          assert "source9Spin_originalFockOperatorStarAutomorphismHom" in s
          assert "originalFockHSFiberToOperator" in s
          assert "set_option autoImplicit false" in s and "set_option autoImplicit false" in c
          assert "set_option maxHeartbeats 0" not in s and "set_option maxRecDepth" not in s
          for t in (s,c):
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",t)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in m["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_M4_HS1_SOURCE_DONORS_CONSUMER_PIN_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean 4.34.1 and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native source and independent source consumer with eight axiom reports
        shell: bash
        timeout-minutes: 57
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-hs1"
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4HS1OriginalSpin9FockHSUnitaryGroupAction"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS1OriginalSpin9FockHSUnitaryGroupAction.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS1OriginalSpin9FockHSUnitaryGroupAction.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1900s lake build "$mod" 2>&1 | tee "$root/cold-native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee "$root/source-axioms.log"
          timeout 720s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4HS1OriginalSpin9FockHSUnitaryGroupIndependentConsumer.lean 2>&1 | tee "$root/independent-consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-hs1"
          allow={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("cold-native-source.log","source-axioms.log","independent-consumer.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-9000:])
              bad=[x for x in t.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
              assert not bad,(name,bad[:15])
          assert "Build completed successfully" in (root/"cold-native-source.log").read_text()
          for name,ct in (("source-axioms.log",5),("independent-consumer.log",5)):
              t=(root/name).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
              assert len(reports)==ct,(name,reports)
              for decl,raw in reports:
                  got={a.strip() for a in raw.split(",") if a.strip()}
                  assert got<=allow,(decl,got)
          print("BFSS_M4_HS1_ORIGINAL_FOCK_HS_ISOMETRY_5_SOURCE_5_CONSUMERS_STRICT_GREEN")
          PY
      - name: Preserve full source and independent consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-hs1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-hs1/
          if-no-files-found: warn
          retention-days: 14
