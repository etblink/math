name: BFSS IBI-G0C native SU2 X-axis generator strict

'on':
  push:
    branches: [research/bfss-incidence-unified-20261114]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CNativeXGenerator.lean
      - lean/diagnostics/BFSSIBIG0CNativeXGeneratorIndependentConsumer.lean
      - .github/workflows/bfss-ibi-g0c-native-x-generator-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-g0c-native-x-gen0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-x-source-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact incidence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source and contract preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-g0c-native-x-gen0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-g0c-native-x-gen0/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CNativeXGenerator.lean":"def779ebf09a2f1ac11ed1449c64b5b7d013a1ed",
            "lean/diagnostics/BFSSIBIG0CNativeXGeneratorIndependentConsumer.lean":"7b7f4d3f84e5764b6ec158f960823734dad89147",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CInversePauli.lean":"3b6faa5aa1300cae29afbf11ef57e11abc865b0a",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CZImage.lean":"e4623ef2e7ce825575a73f96e087bee17c4872ab",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CPauliTrace.lean":"b3fc2604a8536cef7c5d0a1a6ca9ba12eccd4c8f",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG3AAdjointColorRepresentationProbe.lean":"553869f1287c64893398c3b79c04fe010023bd08",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in pkgs if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CNativeXGenerator.lean").read_text()
          cons=Path("lean/diagnostics/BFSSIBIG0CNativeXGeneratorIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",src)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CInversePauli"]
          assert re.findall(r"(?m)^import (\S+)$",cons)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CNativeXGenerator"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==[
            "sourceXMatrix_mem_specialUnitary","sourceXGauge_coe","sourceXGauge_zero"]
          assert len(re.findall(r"(?m)^example\b",cons))==3
          assert "Matrix.mem_specialUnitaryGroup_iff" in src
          assert "sourceXGauge_zero" in src
          for t in (src,cons):
              assert "set_option autoImplicit false" in t
              assert "ᴴ" not in t
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",t)
              assert "set_option maxHeartbeats 0" not in t
          print("BFSS_IBI_G0C_NATIVE_X_GEN0_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold source and independent consumer strict audit
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          module="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CNativeXGenerator"
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CNativeXGenerator.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CNativeXGenerator.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1650s lake build "$module" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-native-x-gen0/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-native-x-gen0/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSIBIG0CNativeXGeneratorIndependentConsumer.lean 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-native-x-gen0/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-ibi-g0c-native-x-gen0"
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-4500:])
              allowed=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              bad=[x for x in t.splitlines() if "warning:" in x and not allowed.fullmatch(x)]
              assert not bad,(name,bad[:10])
          log=(root/"source-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          expected=[
            "FCP.BFSSIBIG0CNativeXGenerator.sourceXMatrix_mem_specialUnitary",
            "FCP.BFSSIBIG0CNativeXGenerator.sourceXGauge_coe",
            "FCP.BFSSIBIG0CNativeXGenerator.sourceXGauge_zero"]
          assert [x for x,_ in reports]==expected,reports
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,raw in reports:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,raw)
          print("BFSS_IBI_G0C_NATIVE_X_GEN0_SOURCE_AND_CONSUMER_STRICT_GREEN")
          PY
      - name: Preserve native source X-generator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-g0c-native-x-gen0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-g0c-native-x-gen0/
          if-no-files-found: warn
          retention-days: 14
