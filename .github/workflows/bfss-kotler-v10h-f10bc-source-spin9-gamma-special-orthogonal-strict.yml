name: BFSS V10H F10BC source Spin9 original gamma SO16 algebraic hom strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean
      - .github/workflows/bfss-kotler-v10h-f10bc-source-spin9-gamma-special-orthogonal-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-original-gamma-so16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin exact accepted constructive ancestry and F10BC source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bc"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bc/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean")" = '3979ea1d3c64e4a3cb82e4baf2c10cbc6b5cb627'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10QSourceSpinOrientationDetOneProbe.lean")" = '948712b83647829ab5902dfa88979f44747af1f3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean")" = '7798089cb8ac4ec4fffc3ead4caa474def81b3f8'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean')
          s=p.read_text()
          names=[
            "source9SpinGammaMatrix_mem_specialOrthogonalGroup",
            "source9SpinGammaSpecialOrthogonalHom",
            "source9SpinGammaSpecialOrthogonalHom_apply",
          ]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
          assert s.count('#print axioms ')==3
          code=re.sub(r'/-.*?-/', '', s, flags=re.S)
          for term in ['spinGroup source9Quadratic',
                       'Matrix.specialOrthogonalGroup SpinIndex ℝ',
                       'source9SpinGammaOrthogonalHom',
                       'gammaDetDirectHom_eq_one',
                       'source9GammaCliffordAlgHom']:
              assert term in code,term
          for forbidden in ['Source48Label',
                            'coordinateToOriginalGammaSkewLieHom']:
              assert forbidden not in code,forbidden
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
          print('V10H_F10BC_SOURCE_PIN_ORIGINAL_GAMMA_SO16_ALGEBRAIC_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10Q determinant-one ancestry
        shell: bash
        timeout-minutes: 80
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 4650s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10QSourceSpinOrientationDetOneProbe

      - name: Fresh F10BC original gamma SO16 packaging warnings-as-errors compile
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 960s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bc/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate exact SO16 types and audit root axioms
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10BC_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example
              (g : spinGroup source9Quadratic) :
              ((source9SpinGammaOrthogonalHom g) : GammaMatrix) ∈
                Matrix.specialOrthogonalGroup SpinIndex ℝ :=
            source9SpinGammaMatrix_mem_specialOrthogonalGroup g
          noncomputable example :
              spinGroup source9Quadratic →*
                Matrix.specialOrthogonalGroup SpinIndex ℝ :=
            source9SpinGammaSpecialOrthogonalHom
          noncomputable example
              (g : spinGroup source9Quadratic) :
              ((source9SpinGammaSpecialOrthogonalHom g) : GammaMatrix) =
                source9GammaCliffordAlgHom
                  (g : CliffordAlgebra source9Quadratic) :=
            source9SpinGammaSpecialOrthogonalHom_apply g
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaMatrix_mem_specialOrthogonalGroup
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaSpecialOrthogonalHom
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaSpecialOrthogonalHom_apply
          LEAN
          timeout 840s lake env lean -DwarningAsError=true /tmp/V10H_F10BC_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bc/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10bc'/'declaration-audit.log').read_text()
          names={
            'FCP.BFSSPairedSpin9Clifford.source9SpinGammaMatrix_mem_specialOrthogonalGroup',
            'FCP.BFSSPairedSpin9Clifford.source9SpinGammaSpecialOrthogonalHom',
            'FCP.BFSSPairedSpin9Clifford.source9SpinGammaSpecialOrthogonalHom_apply',
          }
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          assert len(reports)+len(empty)==3,(reports,empty)
          assert ({n for n,_ in reports}|set(empty))==names,(reports,empty)
          for n,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BC_ORIGINAL_GAMMA_SO16_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BC audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bc-source-spin9-original-gamma-so16-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bc
          if-no-files-found: warn
