name: BFSS V10H F10BU exact PBW joint ambient vector action smoothness strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness.lean
      - lean/diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10bu-ambient-vector-action-smoothness-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-pbw-joint-ambient-vector-action-smoothness:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin accepted PBW multiplication vector action reversal and F10BU declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bu"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bu/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean")" = 'db887aa6e495eb2a74c2e826018ffb5453158806'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BFPBWCliffordTopologicalRing.lean")" = 'f7ea4c9e9d996d04d07a7733ffe7ab6a91ce2636'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BFIndependentAudit.lean)" = 'dd00871d12e1d533d15aa67608713d85eed0ec66'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean")" = '9092ccaa5b4436bfa25cafe8b71541e6642999f6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BOSourceVectorConjugationDerivative.lean")" = '03287d741b05cd4e373f1b5e608d0e6888b63e89'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BOIndependentAudit.lean)" = '744a1917c34857f40c08aded9f2b1480c7dfe62c'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BTPBWBilinearMultiplicationSmoothness.lean")" = '10c56519331f867d5f453a63953e0018c03a09a3'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BTIndependentAudit.lean)" = '7fd6812e2e5ee4bdfa5b56422a9905c5611e6bd3'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness.lean)" = 'aa38de95852718445ddd0448068592f9cefe4db4'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean)" = '7a8e3f09d3a799d49ca5c3fa2060abe957ef7628'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean').read_text()
          names=["source9CliffordReverseCLM","source9VectorEmbeddingCLM","source9VectorProjectionCLM","source9AmbientVectorConjugation","source9AmbientVectorConjugation_eq_spin","source9AmbientVectorConjugation_contDiff_pbw"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          assert not re.search(r'(?m)^local instance\s*:',s)
          for cls in ['NormedAddCommGroup','NormedSpace','FiniteDimensional']:
              assert 'local instance f10buLocal'+cls+' : '+cls in s
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'(?m)^instance\b|attribute\s+\[instance\]',code)
              assert 'Source48Label' not in code and 'NormedRing' not in code
              assert 'open scoped ContDiff' in code
              assert 'ChartedSpace' not in code and 'LieGroup' not in code
          for token in ['source9PBWNormedAddCommGroup','source9PBWNormedSpace',
                        'source9Clifford_finiteDimensional','toLinearMap := CliffordAlgebra.reverse',
                        'toLinearMap := CliffordAlgebra.ι source9Quadratic',
                        'toLinearMap := source9CliffordVectorProjection',
                        'cont := source9Clifford_reverse_continuous_pbw',
                        'cont := source9CliffordVectorProjection_continuous_pbw',
                        'continuous_of_finiteDimensional',
                        'a * CliffordAlgebra.ι source9Quadratic z * CliffordAlgebra.reverse a',
                        'rw [source9Spin_inv_coe_eq_reverse]',
                        '(source9Clifford_mul_contDiff_pbw n).comp₂ contDiff_fst hi',
                        '(source9Clifford_mul_contDiff_pbw n).comp₂ hleft hr',
                        'source9VectorProjectionCLM.contDiff.comp hproduct','(n : ℕ∞ω)']:
              assert token in s,token
          for token in ['source9PBWCoordinates = auditPBWCoordinates := rfl',
                        'source9PBWNormedAddCommGroup =','NormedAddCommGroup.induced',
                        'NormedSpace.induced ℝ','auditPBWCoordinates.injective := rfl',
                        'source9CliffordReverseCLM a = CliffordAlgebra.reverse a := rfl',
                        'source9VectorEmbeddingCLM z = CliffordAlgebra.ι source9Quadratic z := rfl',
                        'source9VectorProjectionCLM a = source9CliffordVectorProjection a := rfl',
                        '((g⁻¹ : spinGroup source9Quadratic) : CliffordAlgebra source9Quadratic)',
                        'fun az : CliffordAlgebra source9Quadratic × (SpaceIndex → ℝ)',
                        'source9AmbientVectorConjugation_contDiff_pbw n']:
              assert token in audit,token
          print('V10H_F10BU_SOURCE_PIN_EXACT_PBW_AMBIENT_VECTOR_ACTION_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10BT F10BO F10BG ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BTPBWBilinearMultiplicationSmoothness OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BOSourceVectorConjugationDerivative OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup

      - name: Fresh F10BU ambient vector action warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bu/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently check exact PBW joint ambient extension actual action and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bu/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean "$RUNNER_TEMP/v10h-f10bu/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness.lean "$RUNNER_TEMP/v10h-f10bu/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9CliffordReverseCLM","source9VectorEmbeddingCLM","source9VectorProjectionCLM","source9AmbientVectorConjugation","source9AmbientVectorConjugation_eq_spin","source9AmbientVectorConjugation_contDiff_pbw"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10bu'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BU_EXACT_PBW_JOINT_AMBIENT_VECTOR_ACTION_SMOOTHNESS_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BU audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bu-joint-ambient-vector-action-smoothness-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bu
          if-no-files-found: warn
