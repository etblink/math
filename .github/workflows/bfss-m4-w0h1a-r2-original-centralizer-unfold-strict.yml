          assert "bfss-m4-w0h1a-r2/tested-commit.txt" in Path("research/quantum-information/diagnostics/BFSS_W0H1A_R2_44149941739_PREFLIGHT_ONLY_complete_job.log").read_text()
          original_run=json.loads(Path("research/quantum-information/diagnostics/BFSS_W0H1A_R2_44149941739_PREFLIGHT_ONLY_original_run_jobs_artifacts.json").read_text())
          assert original_run["artifacts"]["total_count"]==0
          assert original_run["run"]["head_sha"]=="3a48165bd006552444f036ae8ac2960fc7ffd5fe"

          red2=s.get("w0h1a_r2_second_preflight_only",{})
