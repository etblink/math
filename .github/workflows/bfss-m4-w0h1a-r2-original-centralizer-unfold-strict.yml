name: BFSS M4 W0H1A R2 original centralizer unfolding strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1AOriginalGeneratorCentralizerComapR2.lean
      - lean/diagnostics/BFSSP3M4W0H1AOriginalGeneratorCentralizerIndependentConsumerR2.lean
      - .github/workflows/bfss-m4-w0h1a-r2-original-centralizer-unfold-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0h1a-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-centralizer-comap:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight original W0H0 and W0B0 GREEN with original W0B1 RED STOP provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0h1a-r2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0h1a-r2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0h1a-r2/preflight.log"
