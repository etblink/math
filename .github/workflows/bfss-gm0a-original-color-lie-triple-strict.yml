name: BFSS GM0A exact source color Lie triple independent strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM0AOriginalColorLieTripleGaugeInvariant.lean'
      - 'lean/diagnostics/BFSSGM0AOriginalColorLieTripleIndependentAudit.lean'
      - '.github/workflows/bfss-gm0a-original-color-lie-triple-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm0a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-original-color-lie-triple:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm0a-color-lie"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm0a-color-lie/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm0a-color-lie/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm0a-color-lie/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/GaugeGeometry.lean":"db8cf65e11799d156c1fc698ec885ae81c013414",
            "lean/OAI/MathematicalPhysics/BFSS/GaugeOrbits.lean":"d6343a145884b289716c04b2bdc6acb99bfa839a",
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean":"152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG2ABosonGaugeProbe.lean":"898c987cbcc0840f9c137682c3be345baca809d1",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("IMMUTABLE_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor",
            "df9bc7ec663565de94020ebd7b38b35c70eae36c","HEAD"])
          p=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM0AOriginalColorLieTripleGaugeInvariant.lean")
          q=Path("lean/diagnostics/BFSSGM0AOriginalColorLieTripleIndependentAudit.lean")
          s=p.read_text();c=q.read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.GaugeOrbits",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG2ABosonGaugeProbe"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==[
            "originalColorLieTriple_gauge_invariant",
            "pairedOriginalSpatialColorLieTriple_gauge_invariant"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalColorLieTriple_gauge_invariant",
            "pairedOriginalSpatialColorLieTriple_gauge_invariant"]
          assert re.findall(r"(?m)^import (\S+)$",c)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM0AOriginalColorLieTripleGaugeInvariant"]
          assert re.findall(r"(?m)^theorem (\S+)",c)==[
            "pairedOriginalSpatialColorLieTripleGaugeInvariant"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",c)==[
            "pairedOriginalSpatialColorLieTripleGaugeInvariant"]
          for label,t in [("source",s),("consumer",c)]:
              assert "set_option autoImplicit false" in t
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",t),(label,"DISALLOWED_ADMISSION")
              for bad in ["set_option maxRecDepth","set_option maxHeartbeats",
                          "set_option synthInstance.maxHeartbeats"]:
                  assert bad not in t,(label,"UNBOUNDED_ELABORATION",bad)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM0A_FROZEN_SOURCE_AND_CONSUMER_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm0a-color-lie/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original source native build plus independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm0a-color-lie"
          timeout 3000s lake build \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM0AOriginalColorLieTripleGaugeInvariant \
            2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM0AOriginalColorLieTripleIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm0a-color-lie"
          names=["native-source.log","strict-axioms.log"]
          for name in names:
              s=(E/name).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in s,("STRICT_LOG_FAILURE",name,bad,s[-6000:])
          native=(E/"native-source.log").read_text()
          expected_roots=[
            "FCP.BFSSGM0A.originalColorLieTriple_gauge_invariant",
            "FCP.BFSSGM0A.pairedOriginalSpatialColorLieTriple_gauge_invariant"]
          for root in expected_roots:
              assert "'"+root+"' depends on axioms:" in native or "'"+root+"' does not depend on any axioms" in native,("MISSING_ORIGINAL_AXOM_REPORT",root)
          body=(E/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          expected=["FCP.BFSSGM0AIndependent.pairedOriginalSpatialColorLieTripleGaugeInvariant"]
          assert [x for x,_ in reports]==expected,("CONSUMER_REPORT_MISMATCH",reports)
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,listed in reports:
              axioms={x.strip() for x in listed.split(",") if x.strip()}
              assert axioms<=allowed,("UNEXPECTED_AXIOMS",name,axioms)
          print("BFSS_GM0A_SOURCE_EXACT_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve original first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm0a-color-lie-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm0a-color-lie/
          if-no-files-found: warn
          retention-days: 30
