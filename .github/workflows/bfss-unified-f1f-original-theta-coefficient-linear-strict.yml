name: BFSS unified F1F original coefficient-linear Majorana strict gate

on:
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - .github/workflows/bfss-unified-f1f-original-theta-coefficient-linear-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean
      - lean/diagnostics/BFSSF1FOriginalThetaMatrixLinearMapIndependentAudit.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-unified-f1f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-coefficient-linear-commutator:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout exact original Fock proof candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify original F1A F1B source, F1F consumer and exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-unified-f1f"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-unified-f1f/tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean lean/diagnostics/BFSSF1FOriginalThetaMatrixLinearMapIndependentAudit.lean | tee "$RUNNER_TEMP/bfss-unified-f1f/input-sha256.txt"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          assert Path("lean/lean-toolchain").read_text().strip() == "leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in packages if p["name"]=="mathlib") == "d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean":"892a35274f1532b1bff29f05388d0156cdf3ba52",
            "lean/diagnostics/BFSSF1FOriginalThetaMatrixLinearMapIndependentAudit.lean":"9254f862a145583f34dfaa8e9d452612f61c63d1",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1BOriginalThetaBivectorSkewAdjoint.lean":"75cdfab1c25e961ba777c9788e77a3e6e4ee6d70",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1COriginalThetaBivectorThirdLabelCommutator.lean":"c56d3da8e89aa6cd428854003d94ff843c33af75",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1DOriginalThetaBivectorAllLabelAction.lean":"b8cb1f81839cd3b26a05f949cc26e8bc88ebfbf0",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1EOriginalThetaCoordinatePlaneMatrixAction.lean":"5c0c95e89ddc09b34d628dde3801e4a12ac98c53",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1AOriginalThetaBivectorCommutator.lean":"1b91182135d53026ae0ece8f2f85da52ccbc6f58",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2Probe.lean":"93d7ae00d4ee21ce59ab137c349590e2c496ff38",
          }
          for name,expected in pins.items():
            actual=subprocess.check_output(["git","hash-object","--no-filters",name],text=True).strip()
            assert actual==expected,(name,actual,expected)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSF1FOriginalThetaMatrixLinearMapIndependentAudit.lean").read_text()
          assert [x for x in source.splitlines() if x.startswith("import ")] == [
            "import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction",
            "import Mathlib.Algebra.Module.BigOperators"
          ]
          assert [x for x in consumer.splitlines() if x.startswith("import ")] == [
            "import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaMatrixFiniteCoefficientLinearMap"
          ]
          assert "def originalThetaCoefficientFiniteLift" in source
          assert "def originalThetaCoefficientLinearMap" in source
          assert "theorem originalThetaCoefficientLinearMap_apply" in source
          assert "#print axioms originalThetaCoefficientFiniteLift" in source
          assert "#print axioms originalThetaCoefficientLinearMap" in source
          assert "#print axioms originalThetaCoefficientLinearMap_apply" in source
          print("F1F_ORIGINAL_COEFFICIENT_LINEAR_SOURCE_PINNED_ANCESTRY_PASS")
          PY

      - name: Prepare exact pinned Lean Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-unified-f1f/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold compile original F1F theorem and independent consumer
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          evidence="$RUNNER_TEMP/bfss-unified-f1f"
          timeout 3450s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaMatrixFiniteCoefficientLinearMap 2>&1 | tee "$evidence/source-build.log"
          timeout 450s lake env lean OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean 2>&1 | tee "$evidence/source-axioms.log"
          timeout 450s lake env lean diagnostics/BFSSF1FOriginalThetaMatrixLinearMapIndependentAudit.lean 2>&1 | tee "$evidence/independent-consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-unified-f1f"
          theorems=[
            "FCP.BFSSF1FOriginalThetaCoefficientLinearMap.originalThetaCoefficientFiniteLift",
            "FCP.BFSSF1FOriginalThetaCoefficientLinearMap.originalThetaCoefficientLinearMap",
            "FCP.BFSSF1FOriginalThetaCoefficientLinearMap.originalThetaCoefficientLinearMap_apply"
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          package_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def check(log,name):
            for token in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
              assert token not in log,(name,token)
            warnings=[line for line in log.splitlines() if "warning:" in line]
            unexpected=[line for line in warnings if not package_warning.fullmatch(line)]
            assert not unexpected,(name,"unexpected warnings",unexpected[:8])
            if warnings:
              print(name,"THIRD_PARTY_PACKAGE_WARNINGS_RECORDED",len(warnings))
          for name in ["source-axioms.log","independent-consumer.log"]:
            log=(root/name).read_text()
            check(log,name)
            reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
            found={decl:{a.strip() for a in axioms.split(",") if a.strip()} for decl,axioms in reports}
            for theorem in theorems:
              assert theorem in found,(name,theorem,reports[-10:])
              assert found[theorem] <= allowed,(name,theorem,found[theorem])
            print(name,"F1F_EXACT_COEFFICIENT_LINEAR_ROOT_AXIOMS_PASS")
          check((root/"source-build.log").read_text(),"source-build.log")
          print("F1F_ORIGINAL_THETA_COEFFICIENT_LINEAR_INDEPENDENT_STRICT_PASS")
          PY

      - name: Preserve all proof source and error evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-unified-f1f-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-unified-f1f/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
