name: RHOPF P9A1B original Gamma9 selected Hopf rows strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A1BOriginalGammaSelectedHopfRows.lean
      - lean/diagnostics/RHOPFP9A1BOriginalGammaSelectedHopfIndependentAudit.lean
      - .github/workflows/rhopf-p9a1b-original-gamma-selected-hopf-rows-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhopf-p9a1b-original-gamma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout exact original source on unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact source and bounded theorem preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhopf-p9a1b"
          git rev-parse HEAD | tee "$RUNNER_TEMP/rhopf-p9a1b/exact-tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/rhopf-p9a1b/toolchain-sha256.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          pkgs=json.loads(Path('lean/lake-manifest.json').read_text())['packages']
          assert next(x['rev'] for x in pkgs if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          p='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/'
          pins={
            'lean/OAI/MathematicalPhysics/BFSS/Core.lean':'9882359ced78b0a3bd7e2f057974bd0a031b3e60',
            p+'SU2RealGammaProbe.lean':'b9b8192055c70f0d001d7982669b9823c55562ed',
            p+'RHOPFP9A0OriginalGammaPairClifford.lean':'bf5eb554232a6d452e86d85b05220aad7c5d0aeb',
            p+'RHOPFP9A1AOriginalGammaGeneratorInequivalence.lean':'779bd9a78811f60397657df8b8a4350aafae57b7',
            p+'RHOPFP9A1BOriginalGammaSelectedHopfRows.lean':'40dee23dce7ae63b692bc7e0bd749faef53bf021',
            'lean/diagnostics/RHOPFP9A1BOriginalGammaSelectedHopfIndependentAudit.lean':'25ef1d7dfd95645c4ea6ac3ca3e36ba4cce22f57',
            'research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py':'9d20952c366e356ff5dc656a35d0b604236a15ac',
            'research/topology/data/BFSS_GAMMA9_SOURCE_PERMUTATION_FIXTURE_2026_11_18.json':'684680e139cfcd09c37bf075c0c014bdaa80ba35'}
          for path,sha in pins.items():
            got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert got==sha,(path,got,sha)
          src=Path(p+'RHOPFP9A1BOriginalGammaSelectedHopfRows.lean').read_text()
          consumer=Path('lean/diagnostics/RHOPFP9A1BOriginalGammaSelectedHopfIndependentAudit.lean').read_text()
          assert re.findall(r'(?m)^import (\S+)$',src)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A0OriginalGammaPairClifford']
          assert re.findall(r'(?m)^import (\S+)$',consumer)==[
            'OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A1BOriginalGammaSelectedHopfRows']
          names=['K13_selected_rows','K25_selected_rows','K46_selected_rows','selected_R4_three_original_bivectors_equal']
          assert re.findall(r'(?m)^theorem (\w+)',src)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',src)==names
          assert re.findall(r'(?m)^#print axioms (\S+)$',consumer)==[
            'FCP.RHOPFP9A1B.'+n for n in names]
          for s in (src,consumer):
            assert 'set_option autoImplicit false' in s
            assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe|opaque|constant)\b',s)
            assert not re.search(r'(?m)^\s*set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('RHOPF_P9A1B_EXACT_SOURCE_AND_NATIVE_CONTRACT_PASS')
          PY
          python3 research/topology/tools/rhopf_p9a0_original_gamma_source_independent.py |
            tee "$RUNNER_TEMP/rhopf-p9a1b/original-source-integer-consumer.json"

      - name: Restore exact Lean 4.34.1 and Mathlib
        timeout-minutes: 44
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2000s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'

      - name: Compile original gamma and bounded selected-R4 native theorems
        timeout-minutes: 48
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2RealGammaProbe 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b/original-gamma-build.log"
          timeout 400s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9A0OriginalGammaPairClifford 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b/accepted-p9a0-build.log"
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/RHOPFP9A1BOriginalGammaSelectedHopfRows
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 1400s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b/native-proofs-and-axioms.log"

      - name: Independent Lean consumer and strict axiom reports
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=diagnostics/RHOPFP9A1BOriginalGammaSelectedHopfIndependentAudit
          mkdir -p .lake/build/lib/lean/diagnostics
          timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$target.olean" "$target.lean" 2>&1 |
            tee "$RUNNER_TEMP/rhopf-p9a1b/independent-lean-proofs-and-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'rhopf-p9a1b'
          n=(p/'native-proofs-and-axioms.log').read_text()
          c=(p/'independent-lean-proofs-and-axioms.log').read_text()
          for name in ['K13_selected_rows','K25_selected_rows','K46_selected_rows','selected_R4_three_original_bivectors_equal']:
            assert 'RHOPFP9A1B.'+name in n,name
            assert 'RHOPFP9A1B.'+name in c,name
          for x in (n,c):
            assert 'sorryAx' not in x and 'error:' not in x
          print('RHOPF_P9A1B_NATIVE_AND_INDEPENDENT_LEAN_PASS')
          PY

      - name: Archive source logs exact tested commit and negative knowledge
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhopf-p9a1b-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhopf-p9a1b
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
