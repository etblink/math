name: BFSS P3-AUX-R0B2A original FullL2 reciprocal bounded action strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-aux-r0b2a-original-fulll2-bounded-action-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B2AOriginalReciprocalFullL2BoundedAction.lean
      - lean/diagnostics/BFSSP3AuxR0B2AOriginalReciprocalFullL2BoundedActionIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-full-l2-reciprocal:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout frozen sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Preflight source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-aux-r0b2a-evidence
          git rev-parse HEAD > bfss-aux-r0b2a-evidence/tested-sha.txt
          python3 - <<'PY'
          import subprocess,json,re,pathlib
          git=lambda *a:subprocess.check_output(["git",*a],text=True).strip()
          assert subprocess.run(["git","merge-base","--is-ancestor","1d42426bb8ab84584fc517487a263dce0f55dc16","HEAD"]).returncode==0
          assert git("hash-object","--no-filters","lean/OAI/MathematicalPhysics/BFSS/Core.lean")=="9882359ced78b0a3bd7e2f057974bd0a031b3e60"
          assert git("hash-object","--no-filters","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0AOriginalRadialScalar.lean")=="a67f8740586588c6d4ee9c9148574c81c14d4937"
          assert git("hash-object","--no-filters","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B1OriginalReciprocalLpInfinity.lean")=="d1cbb8077799236e5e1b82704270bdb9ab9153b4"
          assert pathlib.Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(pathlib.Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in packages if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          roots=["originalReciprocalFullL2Linear","originalReciprocalFullL2Linear_apply","originalReciprocalFullL2Linear_norm_le","originalReciprocalFullL2CLM","originalReciprocalFullL2CLM_apply"]
          paths=["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B2AOriginalReciprocalFullL2BoundedAction.lean","lean/diagnostics/BFSSP3AuxR0B2AOriginalReciprocalFullL2BoundedActionIndependentConsumer.lean"]
          for i,path in enumerate(paths):
            s=pathlib.Path(path).read_text()
            expected=roots if i==0 else ["FCP.BFSSP3AuxR0B2AOriginalReciprocalFullL2BoundedAction."+x for x in roots]
            assert re.findall(r"(?m)^#print axioms (\S+)$",s)==expected
            assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",s)
          print("BFSS_P3_AUX_R0B2A_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold compile and independent consumer with root audit
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxR0B2AOriginalReciprocalFullL2BoundedAction"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B2AOriginalReciprocalFullL2BoundedAction.olean"
          rm -f "$obj"
          timeout 3100s lake build "$mod" 2>&1 | tee ../bfss-aux-r0b2a-evidence/build.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B2AOriginalReciprocalFullL2BoundedAction.lean 2>&1 | tee ../bfss-aux-r0b2a-evidence/source.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxR0B2AOriginalReciprocalFullL2BoundedActionIndependentConsumer.lean 2>&1 | tee ../bfss-aux-r0b2a-evidence/consumer.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path("../bfss-aux-r0b2a-evidence")
          roots=["originalReciprocalFullL2Linear","originalReciprocalFullL2Linear_apply","originalReciprocalFullL2Linear_norm_le","originalReciprocalFullL2CLM","originalReciprocalFullL2CLM_apply"]
          expected=["FCP.BFSSP3AuxR0B2AOriginalReciprocalFullL2BoundedAction."+x for x in roots]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,check in [("build.log",False),("source.log",True),("consumer.log",True)]:
            s=(d/name).read_text()
            assert "error:" not in s and "sorryAx" not in s,(name,s[-3500:])
            assert not [v for v in s.splitlines() if "warning:" in v and not depwarn.fullmatch(v)],name
            if check:
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              assert [x for x,_ in reports]==expected,(name,reports)
              for root,axioms in reports:
                assert {v.strip() for v in axioms.split(",") if v.strip()} <= allowed,(root,axioms)
          print("BFSS_P3_AUX_R0B2A_ORIGINAL_FULLL2_BOUNDED_ACTION_STRICT_GREEN")
          PY
      - name: Preserve first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-aux-r0b2a-evidence
          path: bfss-aux-r0b2a-evidence/
          if-no-files-found: warn
          retention-days: 14
