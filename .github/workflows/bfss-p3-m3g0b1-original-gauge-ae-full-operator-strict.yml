name: BFSS P3-M3G0B1 original full operator gauge a.e. strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-m3g0b1-original-gauge-ae-full-operator-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B1OriginalGaugeAEFullOperator.lean
      - lean/diagnostics/BFSSP3M3G0B1OriginalGaugeAEFullOperatorIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-m3g0b1-source-full-operator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-operator-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact B1 source and immutable M3 predecessors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Preflight 459 immutable sources, qualified B0 and two B1 blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-p3-m3g0b1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-p3-m3g0b1/tested-commit.txt"
          test "$(git hash-object --no-filters tools/bfss_m3g0a_manifest_audit.py)" = "7ce1334dad835fbe9798cf7557a98cd6e7fba3d0"
          test "$(git hash-object --no-filters lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B1OriginalGaugeAEFullOperator.lean)" = "e923a019ceac801b981e3fd22920f1cb5c0458f3"
          test "$(git hash-object --no-filters lean/diagnostics/BFSSP3M3G0B1OriginalGaugeAEFullOperatorIndependentConsumer.lean)" = "42e12c82dcf854fa0be0c73dbd38b0fd13f12692"
          python3 tools/bfss_m3g0a_manifest_audit.py | tee "$RUNNER_TEMP/bfss-p3-m3g0b1/accepted-M3G0A-manifest-preflight.log"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,subprocess
          p=Path("bfss-m3g0a-manifest-audit/pin-manifest.json")
          prev=json.loads(p.read_text())
          assert (prev["unique_deduplicated_exact_pins"],
                  prev["gauge_z_transitive_OAI_modules"]) == (459,225)
          hashes=dict(prev["pins"])
          assert len(hashes)==459
          accepted_b0={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B0OriginalGaugeAEBasisColumn.lean":
              "ffffa9e8d8679577a5f32999dd36fe5c9e904a07",
            "lean/diagnostics/BFSSP3M3G0B0OriginalGaugeAEBasisColumnIndependentConsumer.lean":
              "c914864eccc801d9045656f0d06157ae384670f4",
          }
          new_b1={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B1OriginalGaugeAEFullOperator.lean":"e923a019ceac801b981e3fd22920f1cb5c0458f3",
            "lean/diagnostics/BFSSP3M3G0B1OriginalGaugeAEFullOperatorIndependentConsumer.lean":"42e12c82dcf854fa0be0c73dbd38b0fd13f12692",
          }
          for name,expected in {**accepted_b0,**new_b1}.items():
            assert name not in hashes,("duplicate path",name)
            actual=subprocess.check_output(
              ["git","hash-object","--no-filters",name],text=True).strip()
            assert actual==expected,(name,expected,actual)
            hashes[name]=expected
          assert len(hashes)==463,len(hashes)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B1OriginalGaugeAEFullOperator.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M3G0B1OriginalGaugeAEFullOperatorIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==[
            "Mathlib.Order.Filter.Finite",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M3G0B0OriginalGaugeAEBasisColumn",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M2B2B0OriginalFockOperatorHSContinuousEquiv"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M3G0B1OriginalGaugeAEFullOperator"]
          roots=["originalFockOperatorGaugeEquiv_source_all_basis_ae","originalFockOperator_eq_of_basis","originalFockOperatorGaugeEquiv_source_operator_ae"]
          ns="FCP.BFSSP3M3G0B1OriginalGaugeAEFullOperator."
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==roots
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[ns+n for n in roots]
          for source_text in (source,consumer):
            assert "set_option autoImplicit false" in source_text
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",source_text)
            assert "maxHeartbeats" not in source_text and "maxRecDepth" not in source_text
          for required in ("Filter.eventually_all",
                           "originalFockOperatorGaugeEquiv_source_basis_ae",
                           "originalFockOperatorHSContinuousEquiv",
                           "originalFockOperatorHSContinuousEquiv_apply_basis",
                           "PiLp.ext","ContinuousLinearMap.comp_apply",
                           "pairedGaugeData.boson g⁻¹",
                           "pairedGaugeData.fermion g"):
            assert required in source,required
          for required in ("Boson 2","Fermion 2","OriginalFockOperatorLp",
                           "OriginalFockIndex","EuclideanSpace.basisFun","GaugeGroup 2"):
            assert required in consumer,required
          out=Path("bfss-m3g0b1-manifest-audit")
          out.mkdir(exist_ok=True)
          receipt={
            "status":"P3_M3G0B1_EXACT_463_PIN_PREFLIGHT_NOT_LEAN_QUALIFIED",
            "tested_sha":subprocess.check_output(
              ["git","rev-parse","HEAD"],text=True).strip(),
            "predecessor_M3G0B0_run":43422546945,
            "predecessor_M3G0B0_tested_sha":"38017936230c959dc61dfb07c0e776d5ffc04ab5",
            "accepted_prior_pins":459,
            "accepted_M3G0B0_pins":2,
            "new_M3G0B1_pins":2,
            "distinct_deduplicated_pins":463,
            "pins":dict(sorted(hashes.items())),
            "mathematical_qualification":False
          }
          (out/"pin-manifest.json").write_text(json.dumps(
            receipt,indent=2,sort_keys=True)+"\n")
          print("BFSS_P3_M3G0B1_463_PIN_ORIGINAL_SOURCE_PREFLIGHT_PASS",
            hashlib.sha256((out/"pin-manifest.json").read_bytes()).hexdigest())
          PY
      - name: Restore exact Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-p3-m3g0b1/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original bounded-operator source, real Fock consumer and root axioms
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          e="$RUNNER_TEMP/bfss-p3-m3g0b1"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B1OriginalGaugeAEFullOperator.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M3G0B1OriginalGaugeAEFullOperator.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 3600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M3G0B1OriginalGaugeAEFullOperator 2>&1 | tee "$e/cold-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee "$e/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M3G0B1OriginalGaugeAEFullOperatorIndependentConsumer.lean 2>&1 | tee "$e/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-p3-m3g0b1"
          roots=["originalFockOperatorGaugeEquiv_source_all_basis_ae","originalFockOperator_eq_of_basis","originalFockOperatorGaugeEquiv_source_operator_ae"]
          names=["FCP.BFSSP3M3G0B1OriginalGaugeAEFullOperator."+x for x in roots]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-3500:])
            unexpected=[l for l in log.splitlines()
                        if "warning:" in l and not depwarn.fullmatch(l)]
            assert not unexpected,(name,unexpected[:8])
            if name!="cold-build.log":
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
              assert [n for n,_ in reports]==names,(name,reports,names)
              for declaration,raw in reports:
                assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
            "status":"P3_M3G0B1_ORIGINAL_FOCK_FULL_OPERATOR_AE_THREE_THEOREM_GATE",
            "actual_original_Boson2_Fermion2":True,
            "actual_original_operator_norm_Lp":True,
            "finite_ae_index_intersection":True,
            "source_continuous_operator_equality_via_HS_columns_injectivity":True,
            "original_full_operator_ae_left_output_inverse_pullback":True,
            "basis_independence_proved":False,
            "original_operator_norm_isometry_proved":False,
            "physical_fixed_space_proved":False,
            "nonzero_physical_witness_proved":False,
            "closed_H_or_spectral_proved":False
          },sort_keys=True,indent=2))
          print("BFSS_P3_M3G0B1_ORIGINAL_FULL_OPERATOR_AE_463_PIN_STRICT_GREEN")
          PY
      - name: Preserve strict GREEN and first causal RED logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p3-m3g0b1-original-full-operator-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-p3-m3g0b1/
            bfss-m3g0a-manifest-audit/
            bfss-m3g0b1-manifest-audit/
          if-no-files-found: warn
          retention-days: 14
