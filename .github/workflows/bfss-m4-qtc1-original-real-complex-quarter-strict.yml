name: BFSS M4 QTC1 original source real complex quarter strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1OriginalSourceRealComplexQuarterBridge.lean
      - lean/diagnostics/BFSSP3M4QTC1OriginalSourceRealComplexQuarterIndependentConsumer.lean
      - .github/workflows/bfss-m4-qtc1-original-real-complex-quarter-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-qtc1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-original-K-quarter-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact original source scalar bridge, consumers and accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-qtc1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-qtc1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-qtc1/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1OriginalSourceRealComplexQuarterBridge.lean":"127cd129a375f7f024c882deb62d1220de26aa0d","lean/diagnostics/BFSSP3M4QTC1OriginalSourceRealComplexQuarterIndependentConsumer.lean":"24113406f779e1f2dcd769c9c400d0b897dda6a9","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean":"e52b8ca7a440e04ab3c3a93187e5100daa39e074","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean":"9448c9a47c605cb6aba2cfc798ae28a0213c9411","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0D_R1_44018395393_evidence.zip":"c0de176f927ba70bed4494534f881d2ff93e732d","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip":"7cebb61b36ba22283cbd27a8d5f91b301b7303e2","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_evidence.zip":"721c3b827bffafbe61d3d81720a103fb5297e389","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip":"671be94ee31c954b8f8b276de7b8ede9359aa617","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip":"485d47d68a5425a79d720248a4b64b972da619ab","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1OriginalSourceRealComplexQuarterBridge.lean").read_text()
          con=Path("lean/diagnostics/BFSSP3M4QTC1OriginalSourceRealComplexQuarterIndependentConsumer.lean").read_text()
          sr=["originalFock_real_quarter_quadratic","originalSource48BivectorK_eq_originalFockQuadratic"]
          cr=["real_quarter_consumer","original_K_quadratic_consumer"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==sr
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==cr
          assert len(re.findall(r"(?m)^example\b",con))==7
          assert len(re.findall(r"(?m)^theorem\b",src))==2
          assert len(re.findall(r"(?m)^theorem\b",con))==2
          assert len(re.findall(r"(?m)^import ",src))==3
          for body in (src,con):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
              assert not re.search(r"(?m)^import\s+\S*P3M4QTC0B",body)
          assert "Fermion 2 →L[ℂ] Fermion 2" in src
          assert "originalFockOperator_real_smul_eq_complex_smul" in src
          assert "originalSource48BivectorK" in src and "sourceNormalizedGamma" in src
          assert "exact_mod_cast hr" in src and "Finset.smul_sum" in src
          assert "originalFockQuadratic sourceNormalizedGamma" in src
          assert "(1 / 4 : ℂ)" in src and "(B p q / 4 : ℝ)" in src
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q=state["last_qualified"]; a=state["active"]
          assert q["gate"]=="P3-M4-QTC0D" and q["run_id"]==44018395393 and q["status"]=="GREEN_QUALIFIED"
          assert a["gate"]=="P3-M4-QTC1" and a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["attempt"]=="R1" and a["accepted_predecessor_run"]==44018395393
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1OriginalSourceRealComplexQuarterBridge.lean"] and a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4QTC1OriginalSourceRealComplexQuarterIndependentConsumer.lean"]
          assert a["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==2
          assert a["independent_controls"]==7
          assert Path(a["prospective_receipt"]).is_file()
          assert state["previous_active_QTC0B_R2_stopped"]["stopped"] is True
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          artifacts=[
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0D_R1_44018395393_evidence.zip",
             "7b19d5dc6d02f14c9ae831382b4d2f8c42d20d5a0ab4ad585d8e8858e9b1a54f"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip",
             "bf8d93fe00846c9ea26815d32ee331424d9510d1816b66cd98c90ef82baf724c"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_evidence.zip",
             "1a95148f7dc41086683592b670257734c7726f0fff0929e4b59930a65ffefa0e"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip",
             "a50bc06b6f5ac03c15be16de7b943910ca55bc3a7960f40829c1049e8402c5c1"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip",
             "f7fa7726865600cab92e1270b558dcc856ad0cfc28318f2bb7d95e74b7ab8dbb")
          ]
          for path,digest in artifacts:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(path) as z: assert z.testzip() is None
          print("BFSS_M4_QTC1_SOURCE_REAL_COMPLEX_K_QUARTER_DONORS_AND_EVIDENCE_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original real-source K normalization, independent consumer and axioms
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-qtc1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC1OriginalSourceRealComplexQuarterBridge 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC1OriginalSourceRealComplexQuarterBridge.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4QTC1OriginalSourceRealComplexQuarterIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-qtc1"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-1800:]
              unexpected=[x for x in log.splitlines() if "warning:" in x and not allow_warning.fullmatch(x)]
              assert not unexpected,unexpected[:6]
              got=pat.findall(log)
              assert len(got)==len(expected),(got,expected)
              names=[v.rsplit(".",1)[-1] for v,_ in got]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for theorem,axioms in got:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(theorem,axioms)
          good="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b"))+"\n"
          audit(good,["a","b"])
          mutants=[
              good.replace("Quot.sound","sorryAx",1),
              good.replace("Quot.sound","Unapproved.axiom",1),
              good.replace("'N.b'","'N.a'"),
              "\n".join(good.splitlines()[:1])+"\n",
              good+"warning: unexpected warning\n",
              good+"error: source theorem failed\n"
          ]
          for k,bad in enumerate(mutants):
              try: audit(bad,["a","b"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted mutant",k))
          print("BFSS_M4_QTC1_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),["originalFock_real_quarter_quadratic","originalSource48BivectorK_eq_originalFockQuadratic"])
          audit((root/"consumer.log").read_text(),["real_quarter_consumer","original_K_quadratic_consumer"])
          print("BFSS_M4_QTC1_ORIGINAL_K_QUARTER_2_SOURCE_2_CONSUMER_7_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve original preflight, cold build, source and consumer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-qtc1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-qtc1/
          if-no-files-found: warn
          retention-days: 14
