name: BFSS W0C2B0 R1 original real-contraction native RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0-r1-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-w0c2b0-r1-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original RED source and qualified donors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert original R1 strict tested source and last qualified W0C2A
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0OriginalRealFockCoefficientContraction.lean)" = 4846915b6d6f99e765a1ec28f9286295d7db2571
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0OriginalRealFockCoefficientIndependentConsumer.lean)" = ee6224071561e675d276e9d3a8d2bd865e87d7d6
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0-r1-original-real-coefficient-strict.yml)" = 341b3ad5ae1b381db1ca6e297110cfd5783472a6
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip)" = cb5591ab7ae5762150ea1d10dc093788f812d929
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_complete_job.log)" = 47d03e99bf3e9f4319200ecc02bfb7dc3db69175
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2B0","R1","PENDING_STRICT_CI",False)
          assert (q["gate"],q["attempt"],q["run_id"],q["status"],q["qualification"])==("P3-M4-W0C2A","R1",44213315719,"GREEN_QUALIFIED",True)
          assert s["accepted_anchors"][-1]==q and q["preservation_run"]==44216554946
          assert s["strategic_focus"]["full_bivector_bracket_qualified"] is False
          assert s["next_planned"]["gate"]=="P3-M4-W0C2B1" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          for p in ["research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip",
                    "research/quantum-information/diagnostics/BFSS_W0C2B0_R1_44218523669_complete_job.log",
                    "research/quantum-information/diagnostics/BFSS_W0C2B0_R1_44218523669_NATIVE_RED_evidence_manifest.json"]:
              assert not Path(p).exists(),p
          print("BFSS_W0C2B0_R1_NATIVE_RED_ARCHIVER_EXACT_SOURCE_PREFLIGHT_PASS")
          PY
      - name: Verify provider-original native RED ZIP, errors, CRC, and complete job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          repo="https://api.github.com/repos/etblink/math"
          run=44218523669;job=134514310717;artifact=14390513069
          tested="f52bef1a52636bf51945d431c164f0f7ad28c6ce"
          size=20778
          digest="02722db3e4d82c68bed20f980bc2f1b3400b7ed47604cc6f6463b0761d0b5ddb"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          runinfo=getjson(f"{repo}/actions/runs/{run}")
          jobinfo=getjson(f"{repo}/actions/jobs/{job}")
          artifactinfo=getjson(f"{repo}/actions/artifacts/{artifact}")
          assert runinfo["head_sha"]==tested and runinfo["status"]=="completed" and runinfo["conclusion"]=="failure" and runinfo["run_attempt"]==1
          assert jobinfo["id"]==job and jobinfo["run_id"]==run and jobinfo["conclusion"]=="failure"
          assert any(x["name"].startswith("Preflight accepted W0C2A") and x["conclusion"]=="success" for x in jobinfo["steps"])
          assert any(x["name"].startswith("Restore pinned Lean 4.34.1") and x["conclusion"]=="success" for x in jobinfo["steps"])
          assert any(x["name"].startswith("Cold original real coefficient") and x["conclusion"]=="failure" for x in jobinfo["steps"])
          assert artifactinfo["id"]==artifact and artifactinfo["size_in_bytes"]==size
          assert artifactinfo["digest"]=="sha256:"+digest
          assert artifactinfo["workflow_run"]["id"]==run and artifactinfo["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with r:return r.read()
          raw=download(f"{repo}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"preflight.log","cold-source.log","tested-commit.txt"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0C2B0_R1_ACCEPTED_W0C2A_REAL_SCALAR_BRIDGE_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "unsolved goals" in cold and "Matrix.mul_apply" in cold
              assert "Tactic " in cold and "rewrite" in cold
              assert "maximum recursion depth has been reached" in cold
              assert "sorryAx" in cold
              assert "Build completed successfully (9241 jobs)." not in cold
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          full=download(f"{repo}/actions/jobs/{job}/logs")
          assert len(full)>200000 and b"unsolved goals" in full
          assert b"maximum recursion depth has been reached" in full
          assert b"Artifact ID 14390513069" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/"BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip"
          log=root/"BFSS_W0C2B0_R1_44218523669_complete_job.log"
          manifest=root/"BFSS_W0C2B0_R1_44218523669_NATIVE_RED_evidence_manifest.json"
          for p in (archive,log,manifest): assert not p.exists(),p
          archive.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
            "gate":"P3-M4-W0C2B0","attempt":"R1","status":"NATIVE_SOURCE_RED_UNQUALIFIED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
            "source_blob":"4846915b6d6f99e765a1ec28f9286295d7db2571",
            "consumer_blob":"ee6224071561e675d276e9d3a8d2bd865e87d7d6",
            "workflow_blob":"341b3ad5ae1b381db1ca6e297110cfd5783472a6",
            "failure_phase":"ORIGINAL_SOURCE_REAL_FINITE_MATRIX_CONTRACTION",
            "failure_lines":[69,72,98,100],"consumer_executed":False,
            "source_axiom_report_contains_sorryAx":True,"native_mathematical_red_count":1,
            "failure_summary":"unclosed matrix finite sum; unused Finset.sum_smul linter; backward sub_smul rewrite; recursion depth in dependent source elaboration",
            "accepted_predecessor_run":44213315719,
            "physical_claim_ceiling":"No full original bivector Lie bracket, Spin9 or BFSS mass gap"
          },indent=2,sort_keys=True)+"\n")
          print("BFSS_W0C2B0_R1_PROVIDER_ORIGINAL_NATIVE_RED_ZIP_FULL_JOB_LOG_SHA_CRC_PASS")
          PY
      - name: Git-pin original native RED ZIP, complete job log and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0_R1_44218523669_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0_R1_44218523669_NATIVE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C2B0 R1: preserve native matrix contraction RED original ZIP and complete Actions log"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
