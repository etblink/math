name: BFSS V8L source paired Spin9 four-index distinct case transport strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9FourIndexDistinctCasesProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-four-index-distinct-cases-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-four-index-distinct:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact original paired and gamma pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2PairedThetaLabelCrosswalkProbe.lean")" = 'f3a2b41f902a20f6fe237ecce18dd7e869e9c45e'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9PlaneGeneratorProbe.lean")" = '02b8e54464b0aea151c96cefd316a86270cf8871'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9AdjacentLieBracketProbe.lean")" = '2186cce50ad2f06c125b7281cbe10f319d975a81'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrientationSwapProbe.lean")" = '58cd7bbd6d1314dc684309b0fe4724688d00e59f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ZeroDiagonalBracketsProbe.lean")" = 'd9c453029eed5ffba4d498bb333a9d5302261aa3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexDiagonalBoundaryProbe.lean")" = 'd0fba846741de21848820f46a179d7cc0251c113'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexPairCoincidenceProbe.lean")" = '10c1f7ea6bccece8003632d9fc43ace907dc27f1'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexDistinctCasesProbe.lean")" = '601025e7f934aa9704bb6a1af52b4696ee12ffc5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe.lean")" = '8aa93c41a83164e3a99eca139de477d82842d589'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9DisjointLieBracketProbe.lean")" = 'fd66cbfb575b9e511769d3ceeab73556e77bc409'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SharedEndBracketProbe.lean")" = 'dfb8f78deeb44d0dd8d5de8ad8268f79edd0df51'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SharedLeftBracketProbe.lean")" = 'ce5cdc1d8073262b867fc705e0adc4f0ac5e743e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CrossRightBracketProbe.lean")" = '05e4d93ad64aeb5b2ccd42999f7d225e108eb433'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9FourIndexDistinctCasesProbe.lean').read_text()
          roots=[
            'zeroDiagonalFourIndex_disjoint_case',
            'zeroDiagonalFourIndex_adjacent_case',
            'zeroDiagonalFourIndex_shared_right_case',
            'zeroDiagonalFourIndex_shared_left_case',
            'zeroDiagonalFourIndex_cross_right_case',
          ]
          for name in roots:
              assert s.count('theorem '+name+'\n')==1,(name,'not unique')
          assert 'SU2BFSSPairedSpin9ZeroDiagonalBracketsProbe' in s
          assert 'SU2BFSSPairedSpin9FourIndexPairCoincidenceProbe' in s
          assert 'zeroDiagonalFourIndexRHS' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V8L_EXACT_SOURCE_PIN_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile source-exact accepted V8I and V8K ancestors
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9ZeroDiagonalBracketsProbe \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9FourIndexPairCoincidenceProbe

      - name: Fresh compile exact V8L source with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9FourIndexDistinctCasesProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v8l"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v8l/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v8l/compiler.log")" -eq 5

      - name: Fresh independent Lean theorem specialization and axiom gate
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V8L_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9FourIndexDistinctCasesProbe
          open OAI.BFSSQuantum
          example (r s t u : SpaceIndex) (hrs : r ≠ s) (htu : t ≠ u)
              (hrt : r ≠ t) (hru : r ≠ u) (hst : s ≠ t) (hsu : s ≠ u) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane t u -
                FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane t u * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s =
              FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndexRHS r s t u :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_disjoint_case r s t u hrs htu hrt hru hst hsu
          example (r s t : SpaceIndex) (hrs : r ≠ s) (hst : s ≠ t) (hrt : r ≠ t) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane s t -
                FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane s t * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s =
              FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndexRHS r s s t :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_adjacent_case r s t hrs hst hrt
          example (r s t : SpaceIndex) (hrs : r ≠ s) (hst : s ≠ t) (hrt : r ≠ t) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane t s -
                FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane t s * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s =
              FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndexRHS r s t s :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_right_case r s t hrs hst hrt
          example (r s t : SpaceIndex) (hrs : r ≠ s) (hrt : r ≠ t) (hst : s ≠ t) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r t -
                FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r t * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s =
              FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndexRHS r s r t :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_left_case r s t hrs hrt hst
          example (r s t : SpaceIndex) (hrs : r ≠ s) (hrt : r ≠ t) (hst : s ≠ t) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane t r -
                FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane t r * FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s =
              FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndexRHS r s t r :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_cross_right_case r s t hrs hrt hst
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_disjoint_case
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_adjacent_case
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_right_case
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_left_case
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_cross_right_case
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_disjoint_case
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_adjacent_case
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_right_case
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_left_case
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_cross_right_case
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V8L_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v8l/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v8l'/'declaration-audit.log').read_text()
          roots=[
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_disjoint_case',
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_adjacent_case',
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_right_case',
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_shared_left_case',
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalFourIndex_cross_right_case',
          ]
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==roots,reports
          for name,ax in reports:
              assert set(x.strip() for x in ax.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,ax)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V8L_FIVE_FOUR_INDEX_DISTINCT_CASES_TYPE_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v8l-original-paired-four-index-distinct-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v8l
          if-no-files-found: warn
