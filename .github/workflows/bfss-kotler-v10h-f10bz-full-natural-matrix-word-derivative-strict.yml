name: BFSS V10H F10BZ whole natural nine-matrix word derivative strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BZFullNaturalMatrixWordDerivative.lean
      - lean/diagnostics/FCP_K1D18V10HF10BZIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10bz-full-natural-matrix-word-derivative-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-natural-nine-matrix-word-derivative:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin accepted BY BR original matrix ancestry and exact F10BZ declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bz"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bz/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean")" = 'db887aa6e495eb2a74c2e826018ffb5453158806'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BFPBWCliffordTopologicalRing.lean")" = 'f7ea4c9e9d996d04d07a7733ffe7ab6a91ce2636'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BFIndependentAudit.lean)" = 'dd00871d12e1d533d15aa67608713d85eed0ec66'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean")" = '9092ccaa5b4436bfa25cafe8b71541e6642999f6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BOSourceVectorConjugationDerivative.lean")" = '03287d741b05cd4e373f1b5e608d0e6888b63e89'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BOIndependentAudit.lean)" = '744a1917c34857f40c08aded9f2b1480c7dfe62c'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BTPBWBilinearMultiplicationSmoothness.lean")" = '10c56519331f867d5f453a63953e0018c03a09a3'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BTIndependentAudit.lean)" = '7fd6812e2e5ee4bdfa5b56422a9905c5611e6bd3'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness.lean)" = 'aa38de95852718445ddd0448068592f9cefe4db4'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean)" = '7a8e3f09d3a799d49ca5c3fa2060abe957ef7628'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BICoordinatePlaneSourceCurve.lean")" = 'faabd83f813eab9ae2026c5d426f8baed80d33a6'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BIIndependentAudit.lean)" = '119ab4569f0ef663838856ed3611e500a7125c82'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BVFinitePlaneWordSmoothness.lean)" = '1c0f3ddfc4fba9e28be411a4fd241e36398095a9'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BVIndependentAudit.lean)" = '54d3a22f75892e7a98d3f0986e3544b57d82a54e'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BJSourceCurveDerivatives.lean")" = '528937bc6f528eed64aea16ecc5eb69c74c2dd99'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BJIndependentAudit.lean)" = '13186e289439acf51af42c80cb0585f74a6285c2'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BWFinitePlaneWordDerivative.lean)" = '6a67d6fb7a1d01f5d0045adb8a6edb3747d0ee70'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BWIndependentAudit.lean)" = '26d4bc3768986a3d5ec9bb44484ba818085f57f6'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BLSourceCoordinateCommutatorAction.lean")" = 'bc0d8539c2523fffe2f36ee4b121a1b81a1431be'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BLIndependentAudit.lean)" = '1900ee7fa3f95d025dd3a2e210f2fa63d9c659d1'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneCarrierProbe.lean")" = '92a26e8380abe9c1f9bdf011d27b8e97b4e17ef3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitBridgeProbe.lean")" = 'd80001bbe5052357dbca559232d81cc01c56fb34'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BXWordDerivativeNativeVectorAction.lean)" = 'bbf201b5af11213eacef21fe6ec41947635cc781'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BXIndependentAudit.lean)" = '30d42b22ebadafb09c2b0c65db839af71ccf4ba7'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BMInverseSourceCurveDerivative.lean")" = '545581346eaf563b54dcf3c828e43d19c2d1dd23'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BMIndependentAudit.lean)" = '057c3313f16775de85109fd5ca257eef69c04cf8'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative.lean)" = '1fa83224a22fc0c7d2efdd6b1fdffe2f55f536cc'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BYIndependentAudit.lean)" = '4e89a6df00269492b91bee147cd4a24bb3b688a3'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BPSourceVectorLinearRepresentation.lean")" = '47684d3586cf7c53674c8d52341853f3f03fa319'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BPIndependentAudit.lean)" = '577618970cc8ed20c8d625564f4a0479583451be'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BQSourceVectorQuadraticIsometry.lean")" = 'cc78661038f8a9685f9e3eef397941ee90d39ca2'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BQIndependentAudit.lean)" = '81a86e36de23f922eb9aafac7f2cafd82f921340'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BRSourceVectorOrthogonalHom.lean")" = '8aa718eba564ae945e618aefbee9329f952256f0'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BRIndependentAudit.lean)" = '2795a632293658d2fad33e5c0444c7ea0a6f8ff0'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BZFullNaturalMatrixWordDerivative.lean)" = '6602ec877561b8751d8505b4cff096746bf0c27b'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BZIndependentAudit.lean)" = '0b5dd933bf5c36fe7daeece45f28b54cf54a58e9'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BZFullNaturalMatrixWordDerivative.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BZIndependentAudit.lean').read_text()
          names=["source9PlaneWordMatrixVelocity","source9PlaneWordMatrixVelocity_apply","source9PlaneSpinWord_vectorMatrix_entry_hasFDerivAt_zero","source9PlaneSpinWord_vectorOrthogonalMatrix_hasFDerivAt_zero","source9PlaneSpinWord_vectorOrthogonalMatrix_fderiv_zero","source9PlaneSpinWord_vectorOrthogonalMatrix_fderiv_zero_apply"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'(?m)^(?:local )?instance\b|attribute\s+\[instance\]',code)
              assert all(token not in code for token in ['Source48Label','NormedRing','GammaMatrix','SpinIndex','ChartedSpace','LieGroup'])
              assert 'open scoped Matrix.Norms.Elementwise' in code
          for token in ['(Fin k → ℝ) →L[ℝ] Matrix SpaceIndex SpaceIndex ℝ',
                        'ContinuousLinearMap.pi (fun i : SpaceIndex',
                        'ContinuousLinearMap.pi (fun j : SpaceIndex',
                        '(ContinuousLinearMap.proj i : (SpaceIndex → ℝ) →L[ℝ] ℝ).comp',
                        'source9PlaneWordVectorVelocity r s (source9CoordinateVector j) l',
                        'congrArg (fun A : Matrix SpaceIndex SpaceIndex ℝ => A i j) ih',
                        'rw [dotProduct_single, mul_one]','rw [hcolumn, htail]',
                        'source9PlaneSpinWord_vectorAction_hasFDerivAt_zero',
                        "(hasFDerivAt_pi'.1 hcol) i",'rw [← heq] at hi',
                        'apply hasFDerivAt_pi.2','(hrs : ∀ a, r a ≠ s a)',
                        '(source9PlaneSpinWord_vectorOrthogonalMatrix_hasFDerivAt_zero r s hrs l).fderiv',
                        '(fun L : (Fin k → ℝ) →L[ℝ] Matrix SpaceIndex SpaceIndex ℝ => L v) hmap).trans',
                        '(source9PlaneWordMatrixVelocity_apply r s l v)']:
              assert token in s,token
          assert s.count('apply hasFDerivAt_pi.2')==2
          for token in ['private def auditNaturalMatrixProductTopology',
                        'auditNaturalMatrixProductTopology := rfl',
                        'source9PlaneWordVectorVelocity r s (source9CoordinateVector j) l v i := rfl',
                        'source9PlaneWordMatrixVelocity r s [] = 0',
                        'source9PlaneWordMatrixVelocity r s [0, 0] v =',
                        'source9PlaneWordMatrixVelocity_apply r s l v',
                        'source9PlaneSpinWord_vectorMatrix_entry_hasFDerivAt_zero r s hrs l i j',
                        'source9PlaneSpinWord_vectorOrthogonalMatrix_hasFDerivAt_zero r s hrs l',
                        'source9PlaneSpinWord_vectorOrthogonalMatrix_fderiv_zero r s hrs l',
                        'source9PlaneSpinWord_vectorOrthogonalMatrix_fderiv_zero_apply r s hrs l v',
                        '(Matrix.single r s (1 : ℝ) - Matrix.single s r (1 : ℝ))',
                        'coordinatePlane9_eq_single_sub_single r s']:
              assert token in audit,token
          print('V10H_F10BZ_SOURCE_PIN_WHOLE_NATURAL_NINE_MATRIX_WORD_DERIVATIVE_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted combined BY and BR ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BRSourceVectorOrthogonalHom

      - name: Fresh F10BZ whole natural matrix derivative warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BZFullNaturalMatrixWordDerivative
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bz/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently check product topology whole natural matrix derivative and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BZIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bz/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BZIndependentAudit.lean "$RUNNER_TEMP/v10h-f10bz/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BZFullNaturalMatrixWordDerivative.lean "$RUNNER_TEMP/v10h-f10bz/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9PlaneWordMatrixVelocity","source9PlaneWordMatrixVelocity_apply","source9PlaneSpinWord_vectorMatrix_entry_hasFDerivAt_zero","source9PlaneSpinWord_vectorOrthogonalMatrix_hasFDerivAt_zero","source9PlaneSpinWord_vectorOrthogonalMatrix_fderiv_zero","source9PlaneSpinWord_vectorOrthogonalMatrix_fderiv_zero_apply"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10bz'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BZ_WHOLE_NATURAL_NINE_MATRIX_WORD_DERIVATIVE_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BZ audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bz-whole-natural-nine-matrix-word-derivative-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bz
          if-no-files-found: warn
