            ('SU2BFSSPhysicalDomainS1V52K1D18DOriginalSourceSpinUnitFactorizationProbe.lean',["originalSourceSpin48Isometry_clifford_generator","originalSourceInvertibleCliffordUnit_rankOne_action","originalSourceSpin48Isometry_twoGeneratorMatrices_of_unitFactorization"]),
