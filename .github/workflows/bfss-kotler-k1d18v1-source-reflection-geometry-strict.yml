            ('SU2BFSSPhysicalDomainS1V52K1D18V1OriginalSourceRankOneReflectionGeometryProbe.lean',["source48_original_reflection_fixes_axis","source48_original_reflection_negates_normalized_polar_kernel","source48_original_reflection_negates_source_polar_orthogonal"]),
