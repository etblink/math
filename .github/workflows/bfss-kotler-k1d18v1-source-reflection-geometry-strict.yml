              cat "$RUNNER_TEMP/k1d18v1-fresh/$m.log"; exit 1;
            }
            test -s ".lake/build/lib/lean/$p/$m.olean"
            cat "$RUNNER_TEMP/k1d18v1-fresh/$m.log"
            sha256sum ".lake/build/lib/lean/$p/$m.olean"
          done
          echo K1D18V1_SOURCE_EXACT_TWENTY_ONE_FRESH_COMPILATIONS_PASS
