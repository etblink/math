            ('SU2BFSSPhysicalDomainS1V52K1D18IOriginalLipschitzGeneratorParityProbe.lean',["originalSourceGeneratorUnit_mem_lipschitz","originalSourceGeneratorLipschitzUnit","originalSourceGeneratorLipschitzLinearMap_eq_rankOne","originalSourceGeneratorLipschitzDeterminant_neg_one","originalSourceGeneratorLipschitzUnit_involute_neg"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18JOriginalLipschitzInverseGeneratorParityProbe.lean',["originalSourceGeneratorInverse_det_neg_one","originalSourceGeneratorInverse_involute_neg","originalSourceGeneratorInverse_grade_det_agreement"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18KOriginalLipschitzGradeDetIdentityAndMulProbe.lean',["originalSourceLipschitzGradeDetInvariant","originalSourceLipschitzGradeDetInvariant_one","originalSourceLipschitzGradeDetInvariant_generator","originalSourceLipschitzGradeDetInvariant_generator_inv","originalSourceLipschitzGradeDetInvariant_mul"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18LOriginalLipschitzClosureGradeDetProbe.lean',["originalSourceLipschitzGradeDetInvariant_all"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18MOriginalSpinScalarCancellationProbe.lean',["originalSourceSpin48_det_character_smul_unit","originalSourceSpin48_det_character_smul_one"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18NOriginalSpinRealScalarInjectionProbe.lean',["originalSourceSpin48_lipschitzDetCharacter_real_one"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18OOriginalSpinDeterminantOneProbe.lean',["originalSourceSpin48_linearEquiv_eq_lipschitz","originalSourceSpin48_linearEquiv_coe_eq_sourceLinearMap","originalSourceSpin48_originalLinearMap_det_one"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18POriginalSpinQuadraticIsometryDetOneProbe.lean',["originalSourceSpin48_quadraticIsometry_linearMap_eq","originalSourceSpin48_quadraticIsometry_det_one"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18RSourceSpinSpecialOrthogonalWitnessProbe.lean',["source48QuadraticIsometryWitnessGL","source48SpecialOrthogonalWitnessGL","originalSourceSpin48_mem_isometryWitness","originalSourceSpin48_mem_specialOrthogonalWitness"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18SOriginalSpinSpecialOrthogonalWitnessHomKernelProbe.lean',["originalSourceSpin48SpecialOrthogonalWitnessRepresentation","originalSourceSpin48SpecialOrthogonalWitnessRepresentation_coe","originalSourceSpin48SpecialOrthogonalWitnessRepresentation_eq_one_iff_original","originalSourceSpin48SpecialOrthogonalWitnessRepresentation_ker_eq_two_sign_set"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18TOriginalSpinSOEqualActionFibersProbe.lean',["originalSourceSpin48SO_equal_action_iff_two_sign_fiber","originalSourceSpin48SO_not_injective"]),
