    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - .github/workflows/bfss-kotler-k1d18v1-source-reflection-geometry-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D18V1OriginalSourceRankOneReflectionGeometryProbe.lean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-reflection-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source pins and no unproved declaration lexemes
