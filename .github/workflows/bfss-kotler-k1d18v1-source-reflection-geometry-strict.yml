            ('SU2BFSSPhysicalDomainS1V52K1D18FOriginalLipschitzVectorActionProbe.lean',["sourceLipschitz_conjugated_generator_unique","sourceLipschitzVectorAction_clifford_generator","sourceLipschitzVectorAction_add","sourceLipschitzVectorAction_smul"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18GOriginalLipschitzVectorActionLawsProbe.lean',["originalSourceSpin48_unit_mem_lipschitz","sourceLipschitzVectorAction_one","sourceLipschitzVectorAction_mul","sourceLipschitzVectorAction_agrees_originalSpin48","originalSourceLipschitzLinearMap"]),
