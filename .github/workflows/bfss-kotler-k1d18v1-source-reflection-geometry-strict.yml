          key: bfss-fcp-k1d17-source-accepted-ancestors-v1-389ecdcc-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Require exact validated 81-root source ancestry (no fallback)
        shell: bash
        timeout-minutes: 20
        env:
          EXACT_HIT: ${{ steps.accepted-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_HIT" = true || { echo 'K1D18V1_NO_TRUSTED_ANCESTRY_CACHE_STOP'; exit 1; }
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py verify --log-dir "$RUNNER_TEMP/k1d18v1-cache"
          echo K1D18V1_ACCEPTED_81_ROOT_ANCESTRY_PASS
      - name: Fresh warning-as-error source compilation K1D18A through P, then R S T U V1
