name: BFSS W0A4 R1 provider-original RED evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0a4-r1-red-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  pin-original-red:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact unified integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check original W0A4 R1 source and qualified predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0A4OriginalFullComplexGammaTransport.lean)" = "606fcdd173d4c31f191d29e7de53a742cdcbf1aa"
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0A4OriginalFullComplexGammaIndependentConsumer.lean)" = "18fec08b3259513e63deff44319eb90b759b6b5f"
          python3 - <<'PY'
          import json
          state=json.load(open("BFSS_GATE_STATE.json"))
          assert state["active"]["gate"]=="P3-M4-W0A4" and state["active"]["attempt"]=="R1"
          assert state["active"]["status"]=="PENDING_STRICT_CI" and not state["active"]["qualification"]
          assert state["last_qualified"]["gate"]=="P3-M4-W0A3"
          assert state["last_qualified"]["run_id"]==44051746176
          PY
      - name: Fetch original provider ZIP and independently verify exact failed source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          artifact=14316043341
          run=44055363556
          tested="14b96aca0d455098fcd54486840f3b905eda2dd7"
          digest="7deda8b0723841d8a35e19dd8587211254b7e3a8cebaa317918321a54d96dcb6"
          size=13594
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{artifact}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
              meta=json.load(r)
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+"/zip",headers=headers),timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302,e
              signed=e.headers["Location"]
              assert signed.startswith("https://")
              with urllib.request.urlopen(signed,timeout=90) as response: raw=response.read()
          else:
              with response: raw=response.read()
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"cold-source.log","preflight.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0A4_FULL_COMPLEXIFIED_GAMMA_W0A3_QUALIFIED_DONORS_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Unknown identifier `AlgebraTensorModule.lift`" in cold
              assert "'change' tactic failed, pattern" in cold
              assert "build failed" in cold
              assert "Build completed successfully" not in cold
              print("BFSS_W0A4_R1_ORIGINAL_RED_REHASH_PASS",json.dumps({
                 "run":run,"artifact":artifact,"tested":tested,"size":size,"sha256":digest,
                 "members":[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
              },sort_keys=True))
          path=Path("research/quantum-information/diagnostics/BFSS_M4_W0A4_R1_44055363556_RED_evidence.zip")
          assert not path.exists()
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(raw)
          PY
      - name: Commit only original immutable RED ZIP to unified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path="research/quantum-information/diagnostics/BFSS_M4_W0A4_R1_44055363556_RED_evidence.zip"
          git add -- "$path"
          test "$(git diff --cached --name-only)" = "$path"
          test "$(wc -c < "$path" | tr -d ' ')" = 13594
          git commit -m "BFSS W0A4: preserve byte-identical original R1 source RED ZIP"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
