name: BFSS P3-AUX-RAD-C4A original weighted natural adjoint square strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-aux-rad-c4a-original-weighted-natural-adjoint-square-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC4AOriginalWeightedNaturalAdjointSquare.lean
      - lean/diagnostics/BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquareIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-rad-c4a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-weighted-natural-adjoint-square:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen source ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Preflight complete reviewed source closure and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-aux-rad-c4a-evidence
          git rev-parse HEAD > bfss-aux-rad-c4a-evidence/tested-sha.txt
          python3 - <<'PY' | tee bfss-aux-rad-c4a-evidence/preflight.log
          from pathlib import Path
          import subprocess,re,json,hashlib
          BASE="5d74a3b5abe74dae4d6ba181ae29f0cb76865414"
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC4AOriginalWeightedNaturalAdjointSquare.lean"
          CONSUMER="lean/diagnostics/BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquareIndependentConsumer.lean"
          EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC4AOriginalWeightedNaturalAdjointSquare.lean":"3202d27cbe9c27ea2d559cb0a1966c4a6d974920","lean/diagnostics/BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquareIndependentConsumer.lean":"820ec0bd4a0255d2564dc05b72bc488b1dabf4d0","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BBOriginalPhysicalHilbertChargeAdjointProbe.lean":"044eef08490bcd2f15e95bb3cf1287704f5254de","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BCOriginalPhysicalChargeNaturalAdjointSquareProbe.lean":"a31a2a04c8c63061fa1d3a447283c2ee261d92d6","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BDOriginalPhysicalChargeAdjointSquareSelfAdjointProbe.lean":"9bedf73dded2229062dce43184c7b1bd11b2ef22","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC3OriginalPhysicalWeightedChargeGraph.lean":"6aff6416d341738a1f55e6aaad107f4726f1e34f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC3DCOriginalWeightedPhysicalDomainDensity.lean":"5ed2b3bfc6add8b50e25d43db3252ee7848caed9"}
          ROOTS=["originalWeightedPhysicalAdjointSquare_domain","originalWeightedPhysicalAdjointSquare_selfAdjoint","originalWeightedPhysicalAdjointSquare_closed","originalWeightedPhysicalAdjointSquare_domain_dense","originalWeightedPhysicalAdjointSquare_energy","originalWeightedPhysicalAdjointSquare_nonneg"]
          NAMESPACE="FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare"
          DONORS=["FCP.BFSSSU2PhysicalDomainL6H5E8BC.naturalComp_mem_domain","FCP.BFSSSU2PhysicalDomainL6H5E8BC.naturalFormalProduct_inner","FCP.BFSSSU2PhysicalDomainL6H5E8BC.naturalFormalProduct_symmetric","FCP.BFSSSU2PhysicalDomainL6H5E8BD.naturalAdjointSquare_shift_graph_surjective","FCP.BFSSSU2PhysicalDomainL6H5E8BD.selfAdjoint_of_formalSymmetry_and_shift_surjectivity","FCP.BFSSP3AuxRADC3OriginalPhysicalWeightedChargeGraph.originalWeightedPhysicalChargeColumn_isClosed","FCP.BFSSP3AuxRADC3DCOriginalWeightedPhysicalDomainDensity.originalWeightedPhysicalChargeColumn_domain_dense_unconditional"]
          def git(*a):
              return subprocess.check_output(["git",*a],text=True).strip()
          assert git("cat-file","-t",BASE)=="commit"
          assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
          baseline={}
          for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
              m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
              if m:
                  baseline[m[2]]=m[1]
          seen={}
          stack=[SOURCE,CONSUMER]
          while stack:
              p=stack.pop()
              if p in seen:
                  continue
              f=Path(p)
              assert f.is_file(),("missing OAI source",p)
              sha=git("hash-object","--no-filters",p)
              if p not in (SOURCE,CONSUMER):
                  assert baseline.get(p)==sha,("reviewed existing OAI source drift",p,baseline.get(p),sha)
              seen[p]=sha
              for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                  for name in names.split("--",1)[0].split():
                      if name=="OAI" or name.startswith("OAI."):
                          stack.append("lean/"+name.replace(".","/")+".lean")
          for p,sha in EXPECTED.items():
              assert seen.get(p)==sha,("frozen donor/candidate drift",p,seen.get(p),sha)
          source=Path(SOURCE).read_text()
          consumer=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==(
              [NAMESPACE+"."+x for x in ROOTS]+DONORS)
          assert re.findall(r"(?m)^import (\S+)$",source)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxRADC3DCOriginalWeightedPhysicalDomainDensity",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6H5E8BDOriginalPhysicalChargeAdjointSquareSelfAdjointProbe"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxRADC4AOriginalWeightedNaturalAdjointSquare",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxHeartbeats" not in code and "maxRecDepth" not in code
          assert "pairedAlgebraData pairedGaugeData hε" in consumer
          assert "FullL2 2" in consumer and "Fermion 2" in consumer and "Boson 2" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in packages if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          out=Path("bfss-aux-rad-c4a-evidence")
          out.mkdir(exist_ok=True)
          receipt={"status":"PREFLIGHT_NOT_LEAN_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
              "reviewed_existing_source_baseline":BASE,"source":SOURCE,"consumer":CONSUMER,
              "transitive_OAI_pin_count":len(seen),"pins":dict(sorted(seen.items())),
              "source_roots":[NAMESPACE+"."+x for x in ROOTS],"independent_donor_roots":DONORS}
          manifest=out/"pin-manifest.json"
          manifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_RAD_C4A_PREFLIGHT_PASS",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-rad-c4a-evidence/cache.log
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold source, independent original paired consumer and thirteen root reports
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxRADC4AOriginalWeightedNaturalAdjointSquare"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC4AOriginalWeightedNaturalAdjointSquare.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC4AOriginalWeightedNaturalAdjointSquare.olean"
          rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
          timeout 3600s lake build "$mod" 2>&1 | tee ../bfss-aux-rad-c4a-evidence/build.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-aux-rad-c4a-evidence/source.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquareIndependentConsumer.lean 2>&1 | tee ../bfss-aux-rad-c4a-evidence/consumer.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          d=Path("../bfss-aux-rad-c4a-evidence")
          new_roots=["FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare.originalWeightedPhysicalAdjointSquare_domain","FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare.originalWeightedPhysicalAdjointSquare_selfAdjoint","FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare.originalWeightedPhysicalAdjointSquare_closed","FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare.originalWeightedPhysicalAdjointSquare_domain_dense","FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare.originalWeightedPhysicalAdjointSquare_energy","FCP.BFSSP3AuxRADC4AOriginalWeightedNaturalAdjointSquare.originalWeightedPhysicalAdjointSquare_nonneg"]
          donors=["FCP.BFSSSU2PhysicalDomainL6H5E8BC.naturalComp_mem_domain","FCP.BFSSSU2PhysicalDomainL6H5E8BC.naturalFormalProduct_inner","FCP.BFSSSU2PhysicalDomainL6H5E8BC.naturalFormalProduct_symmetric","FCP.BFSSSU2PhysicalDomainL6H5E8BD.naturalAdjointSquare_shift_graph_surjective","FCP.BFSSSU2PhysicalDomainL6H5E8BD.selfAdjoint_of_formalSymmetry_and_shift_surjectivity","FCP.BFSSP3AuxRADC3OriginalPhysicalWeightedChargeGraph.originalWeightedPhysicalChargeColumn_isClosed","FCP.BFSSP3AuxRADC3DCOriginalWeightedPhysicalDomainDensity.originalWeightedPhysicalChargeColumn_domain_dense_unconditional"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in [
              ("build.log",None),("source.log",new_roots),("consumer.log",new_roots+donors)]:
              log=(d/name).read_text()
              assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
              assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
              if expected is not None:
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [n for n,_ in reports]==expected,(name,reports,expected)
                  for declaration,raw in reports:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
              "status":"ORIGINAL_WEIGHTED_NATURAL_ADJOINT_SQUARE_STRICT_GREEN",
              "original_paired_SU2_consumer":True,"epsilon_positive":True,
              "natural_two_layer_domain":True,"selfAdjoint_closed_dense":True,
              "unnormalized_weighted_charge_energy_nonnegative":True,
              "new_roots":6,"independent_generic_and_predecessor_roots":7,
              "one_over_sixteen_weak_form_qualified":False,"graph_core_qualified":False,
              "maximal_weighted_domain_qualified":False,"epsilon_zero_qualified":False,
              "spectral_gap_or_eigenstate_qualified":False},sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_RAD_C4A_ORIGINAL_WEIGHTED_NATURAL_ADJOINT_SQUARE_STRICT_GREEN")
          PY
      - name: Preserve strict and first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-aux-rad-c4a-evidence
          path: bfss-aux-rad-c4a-evidence/
          if-no-files-found: warn
          retention-days: 14
