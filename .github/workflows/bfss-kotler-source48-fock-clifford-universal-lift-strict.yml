name: BFSS original Source48 Fock Clifford universal lift strict qualification
on:
  push:
    branches:
      - integration/community-20261027-bfss
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48FockCliffordUniversalLiftProbe.lean
      - .github/workflows/bfss-kotler-source48-fock-clifford-universal-lift-strict.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  actual-source48-clifford-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify immutable original and staged mathematical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = '9882359ced78b0a3bd7e2f057974bd0a031b3e60'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48AllVectorFockCliffordSquareProbe.lean)" = '86436ee9a4f3b097bc9cbc4521d5fc582dbd7feb'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48FockCliffordUniversalLiftProbe.lean)" = 'f057756e42d30c8069a9c934001cf75c1e2d1ed2'
      - name: Prepare pinned Lean dependencies
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
      - name: Build real original Source48 all-vector Clifford square ancestry
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3300s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSSource48AllVectorFockCliffordSquareProbe
      - name: Fresh compile and exact allowed-axiom audit
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48FockCliffordUniversalLiftProbe
          mkdir -p .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          timeout 750s lake env lean -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee /tmp/source48-universal-strict.log
          test -s ".lake/build/lib/lean/${target}.olean"
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/source48-universal-strict.log').read_text()
          source = pathlib.Path('OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48FockCliffordUniversalLiftProbe.lean').read_text()
          wanted = ['sourceFockCliffordAlgHom', 'sourceFockCliffordAlgHom_generator']
          requested = re.findall(r'^#print axioms (\S+)', source, re.M)
          actual = re.findall(r"(?ms)^'([^'\n]+)' depends on axioms: \[([^]]*)\]", log)
          warnings = re.findall(r'(?m)^[^\n]*\.lean:\d+:\d+: warning:', log)
          assert not warnings and 'error:' not in log and 'sorryAx' not in log, (warnings, log[-5000:])
          assert requested == wanted and len(actual) == len(wanted), (requested, actual)
          for (decl, axioms), name in zip(actual, wanted):
              assert decl == 'FCP.BFSSSource48FockCliffordUniversalLift.' + name, (decl, name)
              used = {p.strip() for p in axioms.split(',') if p.strip()}
              assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, (decl, used)
          print('KOTLER_BFSS_SOURCE48_CLIFFORD_UNIVERSAL_DEF_GENERATOR_STRICT_PASS')
          PY
