name: BFSS M4 LB1P0B original Source48 skew-plane normalization strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0BOriginalSource48SkewPlaneNormalization.lean
      - lean/diagnostics/BFSSP3M4LB1P0BOriginalSource48SkewPlaneNormalizationIndependentConsumer.lean
      - .github/workflows/bfss-m4-lb1p0b-source48-skew-plane-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-lb1p0b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source48-skew-plane-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact native source and independent consumer, donor bytes and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-lb1p0b"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-lb1p0b/tested-commit.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0BOriginalSource48SkewPlaneNormalization.lean":"c27ebd4b909b157d70efb5ad5db0ce836468f4d3","lean/diagnostics/BFSSP3M4LB1P0BOriginalSource48SkewPlaneNormalizationIndependentConsumer.lean":"056d7692125f723c91e1d4a50540b9bcfaaf09da","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0AOriginalSource48SkewPlane.lean":"7eb090ab82be47ecae18ae0d091716188cb2db79","lean/diagnostics/BFSSP3M4LB1P0AOriginalSource48SkewPlaneIndependentConsumer.lean":"53da0ec8242c49cfb062257d71d5a22bd4c35500","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1L2AbstractOriginalFockCovarianceLeibniz.lean":"b4012951a26aa7573db513adab3d7ce27396db7e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C0OriginalSource48BivectorCommutatorExpansion.lean":"8b11930128c92bb8a499970593252de942052b1b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB0OriginalSource48MajoranaBivectorCAR.lean":"d08200fae8ef6c9c9544414307ad537f1eeaa4a4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0BOriginalSource48SkewPlaneNormalization.lean").read_text()
          c=Path("lean/diagnostics/BFSSP3M4LB1P0BOriginalSource48SkewPlaneNormalizationIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==["originalSource48BivectorK_plane_antisym","originalSource48BivectorK_plane_half"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",c)==["originalSource48BivectorK_plane_antisym_consumer","originalSource48BivectorK_plane_half_consumer"]
          assert len(re.findall(r"(?m)^example\b",c))==3
          for text in (s,c):
              assert "set_option autoImplicit false" in text
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",text)
              assert "maxRecDepth" not in text and "maxHeartbeats" not in text
          assert "originalFock_sparse_plane_contract" in s
          assert "originalSource48SkewPlane" in s and "originalSource48BivectorK" in s
          assert "(hij : i ≠ j)" in s and "(hij : i ≠ j)" in c
          assert "(1 / 4 : ℝ)" in s and "(1 / 2 : ℝ)" in s
          assert "((0 : Fin 24), (0 : Fin 2))" in c and "((0 : Fin 24), (1 : Fin 2))" in c
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in m["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          import copy,contextlib,io,sys
          sys.path.insert(0,str(Path("tools").resolve()))
          from check_bfss_m4_checkpoint import check_checkpoint
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          check_checkpoint(Path.cwd(),state)
          mutators=[
              lambda x:x["active"].update(attempt="R2"),
              lambda x:x["active"].update(accepted_predecessor_run=0),
              lambda x:x["active"].update(contract_commit="invalid"),
              lambda x:x["active"].update(qualification=True),
              lambda x:x["active"].update(consumer_blob="0"*40),
              lambda x:x.update(branch="main"),
          ]
          for index,mutate in enumerate(mutators):
              candidate=copy.deepcopy(state)
              mutate(candidate)
              try:
                  with contextlib.redirect_stdout(io.StringIO()):
                      check_checkpoint(Path.cwd(),candidate)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(("checkpoint mutant survived",index))
          print("BFSS_M4_LB1P0B_CHECKPOINT_FIRST_ATTEMPT_AND_6_NEGATIVE_CONTROLS_PASS")
          print("BFSS_M4_LB1P0B_EXACT_SPARSE_NORMALIZATION_DONORS_2_CONSUMERS_3_CONTROLS_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native original source, explicit warning-as-error audit and independent consumer
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-lb1p0b"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4LB1P0BOriginalSource48SkewPlaneNormalization 2>&1 | tee "$root/cold-source.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P0BOriginalSource48SkewPlaneNormalization.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4LB1P0BOriginalSource48SkewPlaneNormalizationIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-lb1p0b"
          allowed={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit_log(text):
              assert "error:" not in text and "sorryAx" not in text,text[-9000:]
              bad=[line for line in text.splitlines() if "warning:" in line and not allowed_warning.fullmatch(line)]
              assert not bad,bad[:12]
          def audit_roots(text,targets):
              audit_log(text)
              reports=pattern.findall(text)
              assert len(reports)==len(targets),(reports,targets)
              names=[full.rsplit(".",1)[-1] for full,_ in reports]
              assert len(set(names))==len(names) and set(names)==set(targets),(names,targets)
              for full,raw in reports:
                  assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(full,raw)
          # Auditor controls are separate from the actual compiled log evidence.
          fixture="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit_roots(fixture,["a","b"])
          mutants=[
              fixture.replace("Quot.sound","sorryAx",1),
              fixture.replace("Quot.sound","Unapproved.axiom",1),
              fixture.replace("'N.b'","'N.a'"),
              fixture.splitlines()[0]+"\n",
              fixture+"warning: unexpected source warning\n",
              fixture+"error: source failure\n",
          ]
          for index,text in enumerate(mutants):
              try:
                  audit_roots(text,["a","b"])
              except AssertionError:
                  pass
              else:
                  raise AssertionError(("auditor mutant survived",index))
          print("BFSS_M4_LB1P0B_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          audit_log(cold)
          assert "Build completed successfully" in cold
          audit_roots((root/"source-axioms.log").read_text(),["originalSource48BivectorK_plane_antisym","originalSource48BivectorK_plane_half"])
          audit_roots((root/"consumer.log").read_text(),["originalSource48BivectorK_plane_antisym_consumer","originalSource48BivectorK_plane_half_consumer"])
          print("BFSS_M4_LB1P0B_ORIGINAL_SOURCE48_NORMALIZATION_2_SOURCE_2_CONSUMERS_3_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve exact cold, source, consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-lb1p0b-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-lb1p0b/
          if-no-files-found: warn
          retention-days: 14
