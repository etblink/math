name: BFSS V10H F10AU original gamma exhaustive oriented pair Lie bracket strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AUOriginalGammaExhaustiveNativePairLieBracket.lean
      - .github/workflows/bfss-kotler-v10h-f10au-original-gamma-exhaustive-oriented-pair-lie-bracket-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-exhaustive-oriented-pair-lie-bracket:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original gamma F10E F10AJ F10AK F10AL F10AM F10AN F10AO F10AP F10AQ F10AR F10AS F10AT F10AU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10au"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10au/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean")" = '6c11e898dd7b5ed93db833ca0c7b678e6fda6ffe'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AKOriginalGammaOrderedChainLieBracketProbe.lean")" = '96836497816cdcd8caedc6970b1b667866847920'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ALOriginalGammaOrderedForkLieBracketProbe.lean")" = 'f9399a0ebf17b4aabbf889d12fbcb79111d89c45'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AMOriginalGammaOrderedSharedRightLieBracketProbe.lean")" = '00a521b011fe78eb9bf2983dc05e9e109ba0b403'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe.lean")" = 'a9c96b4840e297b0b79f343d32e3992f50a5ace0'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets.lean")" = '0764c5d8a0aab5bc5e960c5122e6bbeadccb1031'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge.lean")" = '430611eec059c8119573c50fbcee12901b8457d5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AQOriginalGammaAnyOrientationForkRightLieBrackets.lean")" = '58e39145e25f1117535bb7da4f5b128b7a7c2f7f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AROriginalGammaNativeBracketOrientationAndZeroBridge.lean")" = '712f459104e2724793cd58ff62789b9effdf9f13'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ASOriginalGammaTotalTripleNativeLieBrackets.lean")" = 'b2e9158ec9a3661f4bf818953372249c851eccdb'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ATOriginalGammaAnyOrientationFourthOverlapLieBracket.lean")" = 'a19788b12942af020209dba21c5512f8518e5dc8'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AUOriginalGammaExhaustiveNativePairLieBracket.lean")" = '939feabe848a2bba572def231ab425976150f8cd'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AUOriginalGammaExhaustiveNativePairLieBracket.lean').read_text()
          n='source9OriginalGamma_exhaustive_oriented_pair_native_so_bracket'
          assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1
          assert s.count('#print axioms '+n)==1
          assert s.count('#print axioms ')==1
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for term in ['source9OriginalGamma_total_fork_native_so_bracket',
                       'source9OriginalGamma_total_chain_native_so_bracket',
                       'source9OriginalGamma_distinct_shared_right_native_so_bracket',
                       'source9OriginalGamma_distinct_fourth_overlap_native_so_bracket',
                       'source9OriginalGamma_distinct_disjoint_native_so_bracket_zero',
                       'source9OriginalGammaDistinctPairInSo',
                       'dite_eq_left','dite_eq_right','by_cases']:
              assert term in code,term
          assert code.count('by_cases ') == 4
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10AU_SOURCE_PIN_AND_FIVE_WAY_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10AT fourth overlap original gamma ancestry
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3750s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10ATOriginalGammaAnyOrientationFourthOverlapLieBracket

      - name: Fresh F10AU exhaustive native pair bracket warnings-as-errors compiler
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AUOriginalGammaExhaustiveNativePairLieBracket
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10au/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate exhaustive ORIGINAL pair native Lie theorem type and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10AU_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AUOriginalGammaExhaustiveNativePairLieBracket
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSGamma9
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (a b c d : SpaceIndex)
              (hab : a ≠ b) (hcd : c ≠ d) :
              ⁅source9OriginalGammaDistinctPairInSo a b hab,
                source9OriginalGammaDistinctPairInSo c d hcd⁆ =
                if hac : a = c then
                  if hbd : b = d then
                    (0 : LieAlgebra.Orthogonal.so SpinIndex ℝ)
                  else
                    -((2 : ℝ) • source9OriginalGammaDistinctPairInSo b d hbd)
                else if hbc : b = c then
                  if had : a = d then
                    (0 : LieAlgebra.Orthogonal.so SpinIndex ℝ)
                  else
                    (2 : ℝ) • source9OriginalGammaDistinctPairInSo a d had
                else if hbd : b = d then
                  -((2 : ℝ) • source9OriginalGammaDistinctPairInSo a c hac)
                else if had : a = d then
                  (2 : ℝ) • source9OriginalGammaDistinctPairInSo b c hbc
                else
                  (0 : LieAlgebra.Orthogonal.so SpinIndex ℝ) :=
            source9OriginalGamma_exhaustive_oriented_pair_native_so_bracket
              a b c d hab hcd
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_exhaustive_oriented_pair_native_so_bracket
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10AU_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10au/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10au'/'declaration-audit.log').read_text()
          expected='FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_exhaustive_oriented_pair_native_so_bracket'
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          assert len(reports)+len(empty)==1 and ({n for n,_ in reports}|set(empty))=={expected},(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10AU_EXHAUSTIVE_ORIENTED_PAIR_TYPE_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent exhaustive pair audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10au-exhaustive-oriented-pair-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10au
          if-no-files-found: warn
