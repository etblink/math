name: BFSS pinned Lean and Mathlib dependency sizes (measurement only)
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - .github/workflows/bfss-kotler-pinned-dependency-size-only-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  measure-pinned-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record clean-runner storage and exact lock pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          x=json.load(open('lean/lake-manifest.json'))
          assert next(p['rev'] for p in x['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          print("DEPENDENCY_DIAGNOSTIC_MANIFEST_PINS_PASS")
          PY
          df -B1 .
          df -i .
          echo DEPENDENCY_DIAGNOSTIC_NO_ACTIONS_CACHE_SAVE_OR_RESTORE
      - name: Install existing pinned Lean toolchain and Mathlib build artifacts unchanged
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          t0=$SECONDS
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          t1=$SECONDS
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          t2=$SECONDS
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          lake env lean --version
          echo "DEPENDENCY_DIAGNOSTIC_ELAN_BOOTSTRAP_SECONDS $((t1-t0))"
          echo "DEPENDENCY_DIAGNOSTIC_LAKE_CACHE_GET_SECONDS $((t2-t1))"
          echo DEPENDENCY_DIAGNOSTIC_PINNED_DEPENDENCIES_READY
      - name: Measure disk occupancy and exact cache candidate paths without saving a cache
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          home=pathlib.Path.home()
          toolchains=home/'.elan/toolchains'
          paths=[
            ('lean_toolchain_4_34_1',toolchains/'leanprover--lean4---v4.34.1'),
            ('elan_complete',home/'.elan'),
            ('lake_packages_all',root/'lean/.lake/packages'),
            ('lake_mathlib_checkout',root/'lean/.lake/packages/mathlib'),
            ('mathlib_compiled_lib',root/'lean/.lake/packages/mathlib/.lake/build/lib'),
            ('mathlib_compiled_lean',root/'lean/.lake/packages/mathlib/.lake/build/lib/lean'),
            ('lake_mathlib_build',root/'lean/.lake/packages/mathlib/.lake/build'),
            ('lake_owner_build',root/'lean/.lake/build'),
            ('owner_accepted_oleans',root/'lean/.lake/build/lib/lean/OAI'),
            ('lake_other_packages',root/'lean/.lake/packages'),
          ]
          for name,p in paths:
            if not p.exists():
              print('DEPENDENCY_SIZE_MISSING',name,str(p))
              continue
            physical=int(subprocess.check_output(['du','-s','-B1',str(p)],text=True).split()[0])
            apparent=int(subprocess.check_output(['du','-sb',str(p)],text=True).split()[0])
            print('DEPENDENCY_SIZE_BYTES',name,'physical',physical,'apparent',apparent)
          print('DEPENDENCY_LOCK_PACKAGE_COUNT',len(json.load(open('lean/lake-manifest.json'))['packages']))
          print('DEPENDENCY_DIAGNOSTIC_DISK_AFTER')
          subprocess.run(['df','-B1','.'],check=True)
          subprocess.run(['df','-i','.'],check=True)
          print('DEPENDENCY_DIAGNOSTIC_MEASUREMENT_COMPLETE_NO_CACHE_CREATED')
          PY
