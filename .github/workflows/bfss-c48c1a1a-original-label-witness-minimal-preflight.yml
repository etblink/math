name: BFSS C48-1A1a original 48-label witness minimal preflight

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/diagnostics/BFSSC48C1A1aOriginalLabelWitnessMinimalProbe.lean
      - .github/workflows/bfss-c48c1a1a-original-label-witness-minimal-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-c48c1a1a-label-mini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-label-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin source, toolchain, proof and no-axiom policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          source="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean"
          probe="lean/diagnostics/BFSSC48C1A1aOriginalLabelWitnessMinimalProbe.lean"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in pkgs if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={source:"fad0eab5014aa038ddb0bf8411b0e81c358e7908",probe:"a3627fd194e5e2310abb775ed4c2999d9e8c544a"}
          for p,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert actual==expected,(p,actual,expected)
          body=Path(probe).read_text()
          assert re.findall(r"(?m)^import (\\S+)$",body)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe"]
          assert re.findall(r"(?m)^#print axioms (\\S+)$",body)==[
              "original_source_label_has_explicit_paired_witness",
              "every_original_label_consumes_explicit_paired_predicate"]
          assert "set_option autoImplicit false" in body
          assert "maxRecDepth" not in body and "maxHeartbeats" not in body
          assert not re.search(r"(?m)^\\s*(?:sorry|admit|axiom|unsafe)\\b",body)
          print("C48C1A1a_LABEL_WITNESS_MINIMAL_PRECHECK_PINS_PASS")
          PY
      - name: Restore pinned Lean and Mathlib only
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Minimal original-source label proof and strict axiom audit
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mkdir -p "$RUNNER_TEMP/bfss-c48c1a1a-mini"
          timeout 650s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe 2>&1 | tee "$RUNNER_TEMP/bfss-c48c1a1a-mini/dependency-build.log"
          timeout 180s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSC48C1A1aOriginalLabelWitnessMinimalProbe.lean 2>&1 | tee "$RUNNER_TEMP/bfss-c48c1a1a-mini/axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          log=(Path(os.environ["RUNNER_TEMP"])/"bfss-c48c1a1a-mini"/"axioms.log").read_text()
          for forbidden in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier","warning:"):
              assert forbidden not in log,(forbidden,log[-4000:])
          reports=re.findall(r"(?m)^'([^'\\n]+)' (?:depends on axioms: \\[([^\\]]*)\\]|does not depend on any axioms)",log)
          roots=[
            "FCP.BFSSC48C1A1aOriginalLabelWitnessMinimalProbe.original_source_label_has_explicit_paired_witness",
            "FCP.BFSSC48C1A1aOriginalLabelWitnessMinimalProbe.every_original_label_consumes_explicit_paired_predicate"]
          assert [x for x,_ in reports]==roots,(reports,roots)
          allowed={"propext","Classical.choice","Quot.sound"}
          assert all({x.strip() for x in v.split(",") if x.strip()}<=allowed for _,v in reports),reports
          print("C48C1A1a_LABEL_WITNESS_MINIMAL_STRICT_PASS")
          PY
      - name: Retain miniature witness proof diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-c48c1a1a-mini-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-c48c1a1a-mini/
          retention-days: 14
