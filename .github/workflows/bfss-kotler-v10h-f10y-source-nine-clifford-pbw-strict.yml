name: BFSS V10H F10Y original source nine Clifford PBW basis strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10y-source-nine-clifford-pbw-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-nine-clifford-pbw:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original Cl9 source F10X F20B structural ancestry and F10Y
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10y"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10y/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe.lean")" = '42da9e4d7cc74a6137defe7f68e457275be21b31'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean")" = '63d117da8cb2ad337cfb372946332cb42bdf5390'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean').read_text()
          assert len(re.findall(r'(?m)^noncomputable def source9CliffordPBWBasis\b',s)) == 1
          assert len(re.findall(r'(?m)^theorem source9Clifford_finiteDimensional\b',s)) == 1
          assert s.count('#print axioms ') == 2
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for token in ['Pi.basisFun ℝ SpaceIndex', 'CliffordAlgebra.equivExterior source9Quadratic',
                        'source9CliffordPBWBasis.finiteDimensional_of_finite',
                        'CliffordAlgebra source9Quadratic']:
              assert token in code,token
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10Y_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10X source Clifford gamma kernel ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe

      - name: Fresh F10Y source nine Clifford PBW warning-as-error proof
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10y/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate exact source nine PBW basis and finite dimensionality types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10Y_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe
          open FCP.BFSSPairedSpin9Clifford
          open OAI.BFSSQuantum
          noncomputable example :
              Module.Basis (Finset SpaceIndex) ℝ
                (CliffordAlgebra source9Quadratic) :=
            source9CliffordPBWBasis
          noncomputable example :
              FiniteDimensional ℝ
                (CliffordAlgebra source9Quadratic) :=
            source9Clifford_finiteDimensional
          #print axioms FCP.BFSSPairedSpin9Clifford.source9CliffordPBWBasis
          #print axioms FCP.BFSSPairedSpin9Clifford.source9Clifford_finiteDimensional
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10Y_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10y/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10y'/'declaration-audit.log').read_text()
          names=['source9CliffordPBWBasis','source9Clifford_finiteDimensional']
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==2 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10Y_TWO_SOURCE_NINE_PBW_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA, compiler and independent source PBW audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10y-source-nine-pbw-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10y
          if-no-files-found: warn
