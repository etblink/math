name: BFSS D1F original massless Yukawa Fock strict

'on':
  push:
    branches:
      - research/bfss-hopfion-gut-counterfactuals-20261121
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1FOriginalMasslessYukawaFockQuantization.lean
      - lean/diagnostics/BFSSD1FOriginalMasslessYukawaFockIndependentConsumer.lean
      - .github/workflows/bfss-d1f-original-massless-yukawa-fock-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-d1f-original-massless-fock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Freeze original source pins and candidate shape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-d1f"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-d1f/tested-sha.txt"
          python3 - <<'PY' | tee "$RUNNER_TEMP/bfss-d1f/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          PINS={
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/FermionQuantization.lean":"c6b72d030225c707ef54f5285a18a7a8175ee280",
            "lean/OAI/MathematicalPhysics/BFSS/DeformedCharge.lean":"c27c913c44090100f0c714e3eb34e25205f4d2d3",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean":"152204ef15a6569534e0503824a697cb9ae8e4ce",
          }
          for p,expected in PINS.items():
            actual=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
            assert actual==expected,("ORIGINAL_SOURCE_DRIFT",p,actual,expected)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1FOriginalMasslessYukawaFockQuantization.lean").read_text()
          con=Path("lean/diagnostics/BFSSD1FOriginalMasslessYukawaFockIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",src)==[
            "OAI.MathematicalPhysics.BFSS.FermionQuantization"]
          assert re.findall(r"(?m)^import (\S+)$",con)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.D1FOriginalMasslessYukawaFockQuantization",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG1APairedThetaProbe"]
          assert all("set_option autoImplicit false" in s for s in (src,con))
          assert not any(re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",s) for s in (src,con))
          assert "masslessFrequency_eq_source_difference" in src
          assert "deformedFermionField_massless_quantized" in src
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("D1F_EXACT_ORIGINAL_SOURCE_PREFLIGHT_PASS")
          PY

      - name: Restore Lean 4.34.1 and pinned Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-d1f/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold original source and independent paired-SU2 consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-d1f"
          timeout 2500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.D1FOriginalMasslessYukawaFockQuantization 2>&1 | tee "$E/cold-build.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true \
            -o .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1FOriginalMasslessYukawaFockQuantization.olean \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1FOriginalMasslessYukawaFockQuantization.lean \
            2>&1 | tee "$E/source-axioms.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSD1FOriginalMasslessYukawaFockIndependentConsumer.lean \
            2>&1 | tee "$E/consumer-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-d1f"
          roots=[
            "FCP.BFSSHopfD1F.masslessFrequency_eq_source_difference",
            "FCP.BFSSHopfD1F.quantize_masslessFrequency",
            "FCP.BFSSHopfD1F.deformedFermionField_massless_quantized"]
          allowed={"propext","Classical.choice","Quot.sound"}
          for fname in ("cold-build.log","source-axioms.log","consumer-axioms.log"):
            content=(d/fname).read_text()
            assert not any(w in content for w in ("error:","sorryAx","unknownIdentifier","unsolved goals")),(fname,content[-3500:])
            if fname.endswith("axioms.log"):
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",content)
              assert [root for root,_ in reports]==roots,(fname,reports,roots)
              for root,axioms in reports:
                actual={x.strip() for x in axioms.split(",") if x.strip()}
                assert actual<=allowed,(fname,root,actual)
          print("BFSS_D1F_ORIGINAL_MASSLESS_FOCK_STRICT_GREEN")
          PY

      - name: Preserve red or green first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-d1f-massless-fock-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-d1f/
          if-no-files-found: warn
          retention-days: 30
