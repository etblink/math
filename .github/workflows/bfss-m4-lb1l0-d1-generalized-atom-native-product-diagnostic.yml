name: BFSS M4 LB1L0 D1 generalized-atom native product diagnostic

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/diagnostics/BFSSP3M4LB1L0D1TypedAtomNativeProductBridge.lean
      - .github/workflows/bfss-m4-lb1l0-d1-generalized-atom-native-product-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-lb1l0-d1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fock-generalized-atom-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify D1 source and accepted donor bytes, original carrier and frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-lb1l0-d1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-lb1l0-d1/tested-commit.txt"
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          pins={
            "lean/diagnostics/BFSSP3M4LB1L0D1TypedAtomNativeProductBridge.lean":"4f0358a84d3f79300d5ad077230878803fd200b1",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C0OriginalSource48BivectorCommutatorExpansion.lean":"8b11930128c92bb8a499970593252de942052b1b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB0OriginalSource48MajoranaBivectorCAR.lean":"d18200fae8ef6c9c9544414307ad537f1eeaa4a4",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d11d2717d1aaff59fb8814bb53581b961f42b4"
          }
          for path, sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==sha,(path,sha,got)
          s=Path("lean/diagnostics/BFSSP3M4LB1L0D1TypedAtomNativeProductBridge.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
              "originalFock_product_three_typed_atoms",
              "source48_gamma_product_covariance_via_typed_atoms"]
          assert "generalize hT :" in s and "generalize hX :" in s and "generalize hY :" in s
          assert "sourceNormalizedGamma" in s and "originalSource48BivectorK A" in s
          assert "set_option autoImplicit false" in s
          assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",s)
          assert "maxRecDepth" not in s and "maxHeartbeats" not in s
          assert "P3M4LB1L0OriginalFockProductCommutator" not in s
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in manifest["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_M4_LB1L0_D1_GENERALIZED_ATOM_SOURCE_DONORS_TOOLCHAIN_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Build frozen accepted source and check isolated D1 diagnostics and axioms
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-lb1l0-d1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4LB1C1OriginalSource48SkewKMajoranaCovariance 2>&1 | tee "$root/accepted-donor-cold.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4LB1L0D1TypedAtomNativeProductBridge.lean 2>&1 | tee "$root/generalized-atom-diagnostic.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-lb1l0-d1"
          allow={"propext","Classical.choice","Quot.sound"}
          allowedWarning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("accepted-donor-cold.log","generalized-atom-diagnostic.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-5000:])
              bad=[v for v in t.splitlines() if "warning:" in v and not allowedWarning.fullmatch(v)]
              assert not bad,(name,bad[:15])
          assert "Build completed successfully" in (root/"accepted-donor-cold.log").read_text()
          out=(root/"generalized-atom-diagnostic.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",out)
          assert len(reports)==2,reports
          for name,raw in reports:
              got={x.strip() for x in raw.split(",") if x.strip()}
              assert got<=allow,(name,got)
          print("BFSS_M4_LB1L0_D1_GENERALIZED_NATIVE_FOCK_PRODUCT_BRIDGE_2_AXIOM_REPORTS_DIAGNOSTIC_GREEN")
          PY
      - name: Preserve D1 diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-lb1l0-d1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-lb1l0-d1/
          if-no-files-found: warn
          retention-days: 14
