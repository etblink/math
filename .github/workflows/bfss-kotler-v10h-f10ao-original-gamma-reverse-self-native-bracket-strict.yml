name: BFSS V10H F10AO original gamma native Lie reversed/self strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets.lean
      - .github/workflows/bfss-kotler-v10h-f10ao-original-gamma-reverse-self-native-bracket-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-native-reverse-self-brackets:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original gamma F10AK F10AL F10AM F10AN and F10AO sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10ao"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10ao/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean")" = '6c11e898dd7b5ed93db833ca0c7b678e6fda6ffe'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AKOriginalGammaOrderedChainLieBracketProbe.lean")" = '96836497816cdcd8caedc6970b1b667866847920'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ALOriginalGammaOrderedForkLieBracketProbe.lean")" = 'f9399a0ebf17b4aabbf889d12fbcb79111d89c45'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AMOriginalGammaOrderedSharedRightLieBracketProbe.lean")" = '00a521b011fe78eb9bf2983dc05e9e109ba0b403'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe.lean")" = 'a9c96b4840e297b0b79f343d32e3992f50a5ace0'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets.lean")" = '0764c5d8a0aab5bc5e960c5122e6bbeadccb1031'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets.lean').read_text()
          names=["source9OriginalGamma_ordered_chain_reverse_native_so_bracket","source9OriginalGamma_ordered_fork_reverse_native_so_bracket","source9OriginalGamma_ordered_shared_right_reverse_native_so_bracket","source9OriginalGamma_ordered_pair_native_so_self_bracket_zero"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
              assert s.count('#print axioms '+n)==1,n
          assert s.count('#print axioms ')==4
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for term in ['source9OriginalGamma_ordered_chain_native_so_bracket',
                       'source9OriginalGamma_ordered_fork_native_so_bracket',
                       'source9OriginalGamma_ordered_shared_right_native_so_bracket',
                       'lie_skew', 'lie_self', 'source9OrderedGammaPairInSo']:
              assert term in code,term
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10AO_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10AN original gamma native disjoint Lie ancestry
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3750s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe

      - name: Fresh F10AO original gamma native reversed/self warnings-as-errors compiler
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10ao/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate four reverse/self native gamma bracket types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10AO_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSGamma9
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (a b c : SpaceIndex)
              (hab : a < b) (hbc : b < c) :
              ⁅source9OrderedGammaPairInSo ⟨(b,c),hbc⟩,
                source9OrderedGammaPairInSo ⟨(a,b),hab⟩⁆ =
                -((2 : ℝ) • source9OrderedGammaPairInSo
                  ⟨(a,c),hab.trans hbc⟩) :=
            source9OriginalGamma_ordered_chain_reverse_native_so_bracket
              a b c hab hbc
          noncomputable example (a b c : SpaceIndex)
              (hab : a < b) (hbc : b < c) :
              ⁅source9OrderedGammaPairInSo ⟨(a,c),hab.trans hbc⟩,
                source9OrderedGammaPairInSo ⟨(a,b),hab⟩⁆ =
                (2 : ℝ) • source9OrderedGammaPairInSo ⟨(b,c),hbc⟩ :=
            source9OriginalGamma_ordered_fork_reverse_native_so_bracket
              a b c hab hbc
          noncomputable example (a b c : SpaceIndex)
              (hab : a < b) (hbc : b < c) :
              ⁅source9OrderedGammaPairInSo ⟨(b,c),hbc⟩,
                source9OrderedGammaPairInSo ⟨(a,c),hab.trans hbc⟩⁆ =
                (2 : ℝ) • source9OrderedGammaPairInSo ⟨(a,b),hab⟩ :=
            source9OriginalGamma_ordered_shared_right_reverse_native_so_bracket
              a b c hab hbc
          noncomputable example (p : Source9OrderedGammaPairIndex) :
              ⁅source9OrderedGammaPairInSo p,
                source9OrderedGammaPairInSo p⁆ =
                (0 : LieAlgebra.Orthogonal.so SpinIndex ℝ) :=
            source9OriginalGamma_ordered_pair_native_so_self_bracket_zero p
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_chain_reverse_native_so_bracket
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_fork_reverse_native_so_bracket
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_shared_right_reverse_native_so_bracket
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_pair_native_so_self_bracket_zero
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10AO_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10ao/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10ao'/'declaration-audit.log').read_text()
          names=["source9OriginalGamma_ordered_chain_reverse_native_so_bracket","source9OriginalGamma_ordered_fork_reverse_native_so_bracket","source9OriginalGamma_ordered_shared_right_reverse_native_so_bracket","source9OriginalGamma_ordered_pair_native_so_self_bracket_zero"]
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==4 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10AO_FOUR_REVERSE_SELF_LIE_BRACKET_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and four independently audited reverse/self brackets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10ao-gamma-reverse-self-bracket-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10ao
          if-no-files-found: warn
