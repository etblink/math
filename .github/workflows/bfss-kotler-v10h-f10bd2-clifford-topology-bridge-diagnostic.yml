name: BFSS V10H F10BD2 source Spin9 PBW-coordinate topology diagnostic
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/diagnostics/FCP_K1D18V10HD2CliffordTopologyBridgeDiagnostic.lean
      - .github/workflows/bfss-kotler-v10h-f10bd2-clifford-topology-bridge-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-pbw-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin accepted source-nine PBW ancestry and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bd2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bd2/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe.lean")" = '42da9e4d7cc74a6137defe7f68e457275be21b31'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean")" = '63d117da8cb2ad337cfb372946332cb42bdf5390'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HD2CliffordTopologyBridgeDiagnostic.lean)" = '2adc47f7faac87c35f3c76a95171eb21b6e5c0ff'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lean/diagnostics/FCP_K1D18V10HD2CliffordTopologyBridgeDiagnostic.lean')
          s=p.read_text()
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for token in ['source9CliffordPBWBasis.repr.trans',
                        'Finsupp.linearEquivFunOnFinite',
                        'source9PBWCoordinates.toAddMonoidHom',
                        'source9PBWCoordinates.injective',
                        'NormedAddCommGroup.induced', 'NormedSpace.induced',
                        'TopologicalSpace (spinGroup source9Quadratic)',
                        'T2Space (spinGroup source9Quadratic)',
                        'Matrix.specialOrthogonalGroup SpinIndex ℝ']:
              assert token in code,token
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10BD2_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10X source Clifford gamma kernel ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe

      - name: Fresh accepted F10Y PBW source compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bd2/f10y-compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Run isolated PBW-coordinate topology bridge diagnostic
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HD2CliffordTopologyBridgeDiagnostic.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bd2/topology-diagnostic.log"
          echo "V10H_F10BD2_SOURCE9_PBW_TOPOLOGY_PASS"

      - name: Preserve exact SHA and topology bridge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bd2-source9-pbw-topology-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bd2
          if-no-files-found: warn
