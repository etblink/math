name: BFSS W0B1 R2 second original source RED evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0b1-r2-red-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-w0b1-original-r2-red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact tested W0B1 R2 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert exact R2 original source and previous R1 preserved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B1OriginalFullCliffordCommutantInduction.lean)" = 93244f15ae511cd4abbac13e216eed6b1988c009
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0B1OriginalFullCliffordCommutantIndependentConsumer.lean)" = 9ea114c7f8a8c26b814b3abe9fd5c6a1e853e53a
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0B1_R1_44117272657_RED_evidence.zip)" = a448d2ae775926ee05ab4a9028e29e8061fecdac
          python3 - <<'PY'
          import json
          s=json.load(open("BFSS_GATE_STATE.json"))
          assert s["active"]["gate"]=="P3-M4-W0B1"
          assert s["active"]["attempt"]=="R2" and s["active"]["status"]=="PENDING_STRICT_CI"
          assert s["last_qualified"]["run_id"]==44109519633
          assert s["previous_active_W0B1_R1_RED"]["run_id"]==44117272657
          assert s["previous_active_W0A4_R2_stopped"]["stopped"] is True
          PY
      - name: Fetch original provider ZIP and full job log and rehash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          aid=14347939975
          run=44127193329
          jid=134194094284
          tested="4ec854fb464abdc2f5af5bcd4206531b8102e28e"
          digest="bfadd329f067ca9e7926b245e0ed9b2989e7b4594eb9868eb401e5cf985b87a2"
          size=13607
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{aid}"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f: meta=json.load(f)
          assert meta["id"]==aid and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          def download(u):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(u,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as f: return f.read()
              else:
                  with response: return response.read()
          raw=download(url+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"preflight.log","cold-source.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0B1_ORIGINAL_FULL_CLIFFORD_W0B0_GREEN_W0A4_STOP_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "P3M4W0B1OriginalFullCliffordCommutantInduction.lean:43:6" in cold
              assert "Type mismatch: After simplification" in cold
              assert "FockOp" in cold
              assert "sorryAx" in cold and "build failed" in cold
              assert "Build completed successfully" not in cold
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/etblink/math/actions/jobs/{jid}/logs")
          assert len(log)>1000
          assert b"Type mismatch: After simplification" in log and b"sorryAx" in log
          zp=root/f"BFSS_M4_W0B1_R2_{run}_RED_evidence.zip"
          lp=root/f"BFSS_W0B1_R2_{run}_complete_job.log"
          mp=root/f"BFSS_W0B1_R2_{run}_RED_evidence_manifest.json"
          for p in [zp,lp,mp]: assert not p.exists(),p
          zp.write_bytes(raw)
          lp.write_bytes(log)
          manifest={
            "gate":"P3-M4-W0B1","attempt":"R2","status":"RED_UNQUALIFIED",
            "run_id":run,"job_id":jid,"tested_sha":tested,"provider_artifact_id":aid,
            "original_zip":{"path":str(zp),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(lp),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
            "failure":"cold original source line 43 type mismatch in Clifford induction scalar algebraMap case after AlgEquiv.commutes; source sorryAx due failure",
            "source_compiled":False,"consumer_qualified":False,
            "first_red_run":44117272657,"qualified_predecessor_run":44109519633,
            "stopping_rule":"TWO_ANALOGOUS_ORIGINAL_SCALAR_INDUCTION_SOURCE_REDS_STOP"
          }
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0B1_R2_ORIGINAL_PROVIDER_RED_REHASH_PASS",json.dumps(manifest,sort_keys=True))
          PY
      - name: Commit only exact original R2 negative evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0B1_R2_44127193329_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0B1_R2_44127193329_complete_job.log research/quantum-information/diagnostics/BFSS_W0B1_R2_44127193329_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0B1: archive second original scalar-case RED and enforce stop"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
