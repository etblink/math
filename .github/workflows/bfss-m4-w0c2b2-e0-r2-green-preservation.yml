name: BFSS W0C2B2 E0 R2 original source-consumer strict GREEN preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-e0-r2-green-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-e0-r2-strict-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned E0 R2 qualified-source candidate and 27 accepted anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify immutable E0 R2 source consumer donors and original E0 R1 RED receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E0OpaqueFockEqualActions.lean)" = 46051f2904ca92d4693d85f65fa39027ec548e35
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSW0C2B2E0OpaqueFockEqualActionsIndependentConsumer.lean)" = 73d03c880f12bd7f058a751b2a343743a2241a0f
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean)" = 51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean)" = 861628fe6322c919bee87e493e1e629d48bfa8bb
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-e0-opaque-fock-equal-actions-strict.yml)" = a639f78bef7c0d2935a6fcb522c431336d162a0e
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-e0-r2-consumer-dependency-build-strict.yml)" = 5a5494289f24168d5307a23d83a45d38b3e22656
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence.zip)" = ad1befa37a5897d2c8b2a76dcee0fe0c1e04a3ed
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_complete_job.log)" = a238030be885b65498bd3bbf1f49ad8bd8596012
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json)" = 599d84c8794b90b3054aaadb6a096a742e9e9ce2
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R2_44355713875_NATIVE_RED_evidence.zip)" = c8d32c6291f7469400abf794b0eacd30113ec828
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          m=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json').read_text())
          assert m['strict_run']==44364111715 and m['consumer_compiled'] is False
          assert m['original_zip']['sha256']=='923922af8ef3b8abbec70c12fcb494c5d0be5a8dbc3fb8bfd25b7f8629d72fc9'
          for path in (
              'BFSS_M4_W0C2B2_E0_R2_44368187249_GREEN_evidence.zip',
              'BFSS_W0C2B2_E0_R2_44368187249_complete_job.log',
              'BFSS_W0C2B2_E0_R2_44368187249_GREEN_evidence_manifest.json'):
              assert not (Path('research/quantum-information/diagnostics')/path).exists(),path
          print('BFSS_E0_R2_GREEN_ARCHIVER_27_ACCEPTED_ANCHORS_R1_NEGATIVE_EVIDENCE_FROZEN_PASS')
          PY
      - name: Independently verify original E0 R2 source and consumer GREEN provider ZIP and complete job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44368187249;job=135027500613;artifact=14457954368
          tested='da3cb6d69ddf40ee78a43f577346ea64e2ea4d9b'
          size=20816;digest='32065e648bc194211e09d25f720d883cc1adda8caec12283cb6dace19deb466c'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as resp:return json.load(resp)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='success' and r['run_attempt']==1
          assert j['id']==job and j['run_id']==run and j['conclusion']=='success'
          for step in ('Checkout exact unified', 'Preflight 27 accepted',
                       'Restore pinned Lean', 'Cold E0 source plus accepted W0C2A dependency',
                       'Preserve original E0 provider ZIP'):
              assert any(s['name'].startswith(step) and s['conclusion']=='success' for s in j['steps']),step
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={'preflight.log','tested-commit.txt','cold-source.log','consumer-dependency-control.log',
                    'source-axioms.log','consumer.log','auditor.log'}
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def validate(log,names):
              assert 'error:' not in log and 'sorryAx' not in log
              found=pat.findall(log)
              assert len(found)==len(names),(found,names)
              assert [s.rsplit('.',1)[-1] for s,_ in found]==names
              for _,axioms in found:
                  assert {x.strip() for x in axioms.split(',') if x.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert expected<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_E0_R2_27_ANCHORS_R1_ORIGINAL_CONSUMER_DEPENDENCY_RED_FROZEN_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              assert 'Build completed successfully (9243 jobs)' in z.read('cold-source.log').decode()
              assert 'BFSS_E0_R2_W0C2A_ACCEPTED_IMPORT_OLEAN_BUILT' in z.read('consumer-dependency-control.log').decode()
              validate(z.read('source-axioms.log').decode(),[
                  'originalFock_equal_actions_implies_difference_commutes',
                  'originalFock_equal_columns_implies_difference_commutes',
                  'originalFock_equal_column_family_implies_difference_commutes'])
              validate(z.read('consumer.log').decode(),[
                  'originalFock_equal_actions_implies_difference_commutes_consumer',
                  'originalFock_equal_columns_implies_difference_commutes_consumer',
                  'originalFock_equal_gamma_columns_difference_commutes_consumer'])
              aud=z.read('auditor.log').decode()
              assert 'BFSS_W0C2B2_E0_R2_3_SOURCE_3_CONSUMER_2_GAMMA_CONTROLS_6_MUTANTS_STRICT_GREEN' in aud
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>150000,len(full)
          for token in (b'Build completed successfully (9243 jobs)',
                        b'BFSS_E0_R2_W0C2A_ACCEPTED_IMPORT_OLEAN_BUILT',
                        b'BFSS_W0C2B2_E0_R2_3_SOURCE_3_CONSUMER_2_GAMMA_CONTROLS_6_MUTANTS_STRICT_GREEN',
                        b'Artifact ID 14457954368'):
              assert token in full,token
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B2_E0_R2_44368187249_GREEN_evidence.zip'
          log=root/'BFSS_W0C2B2_E0_R2_44368187249_complete_job.log'
          manifest=root/'BFSS_W0C2B2_E0_R2_44368187249_GREEN_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
              'gate':'P3-M4-W0C2B2-E0','attempt':'R2',
              'status':'ORIGINAL_SOURCE_AND_INDEPENDENT_CONSUMER_STRICT_GREEN_DIAGNOSTIC_ONLY',
              'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
              'original_zip':{'path':str(arc),'size':len(raw),'sha256':digest,'members':members},
              'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'46051f2904ca92d4693d85f65fa39027ec548e35',
              'consumer_blob':'73d03c880f12bd7f058a751b2a343743a2241a0f',
              'workflow_blob':'5a5494289f24168d5307a23d83a45d38b3e22656',
              'source_native_compiled':True,'consumer_compiled':True,
              'source_expected_axioms_only':True,'consumer_expected_axioms_only':True,
              'source_axiom_count':3,'consumer_axiom_count':3,'consumer_original_gamma_controls':2,
              'auditor_negative_mutants_rejected':6,
              'predecessor_accepted_anchor_count':27,'predecessor_qualified_run':44267283653,
              'B2_canonical_status':'BLOCKED','W0C2B3_status':'PROSPECTIVE_NOT_STAGED',
              'claim_ceiling':'Conditional equal-actions difference commutation on opaque true original Fock operators only; no original K(A) source actions or all-48 centrality; not 28th anchor'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_E0_R2_STRICT_GREEN_ORIGINAL_ZIP_WHOLE_JOB_SHA_CRC_AND_SIX_AXIOM_REPORTS_VERIFIED')
          PY
      - name: Git-pin original E0 R2 GREEN ZIP whole job log and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E0_R2_44368187249_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R2_44368187249_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R2_44368187249_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS E0 R2: archive original strict GREEN opaque Fock source and consumer evidence'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
