name: BFSS K1D18A original polar bridge strict warm-cache diagnostic
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - .github/workflows/bfss-kotler-k1d18a-polar-bridge-warm-cache-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-source-polar-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin exact source, environment and trusted cache verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          root=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$root/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$root/SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe.lean")" = '19db346be86030db4a3a291493b962bf00898898'
          test "$(git hash-object "$root/SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean")" = '9dc33c924c22e8823ddc905440feb05fb8ce3d0f'
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py)" = 'ca97ad005f75fc270942d034772871471933c7b3'
          python3 - <<'PY'
          import pathlib, re
          path=pathlib.Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean')
          s=path.read_text()
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path('contributions/bfss-kotler/tools').resolve()))
          from qualify_fcp_sync import code_only
          assert not re.search(r'\b(?:sorry|admit|sorryAx|axiom)\b',code_only(s))
          assert re.findall(r'(?m)^#print axioms (\S+)',s)==[
            'source48_coordinate_sum','source48_normalized_polar_coordinate_dot']
          PY
          echo K1D18A_SOURCE_VERIFIER_AND_DECLARATION_IDENTITIES_PASS
      - name: Restore pinned Lean and Mathlib dependencies
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          lake env lean --version
      - name: Restore verified SAME-BRANCH accepted K1D17 source ancestry
        id: accepted-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: lean/.lake/build/lib/lean/OAI
          key: bfss-fcp-k1d17-source-accepted-ancestors-v1-389ecdcc-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Require exact cache hit and independently revalidate 81 source roots
        shell: bash
        timeout-minutes: 20
        env:
          EXACT_CACHE_HIT: ${{ steps.accepted-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_CACHE_HIT" = true || { echo 'K1D18A_CACHE_MISS_STOP_NO_FALLBACK'; exit 1; }
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py verify --log-dir "$RUNNER_TEMP/bfss-k1d18a-cache-evidence"
          echo K1D18A_REUSED_ACCEPTED_K1D17_CACHE_ROOTS_81
      - name: Fresh candidate compilation with strict root and axiom evidence
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          p=OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          m=SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe
          mkdir -p ".lake/build/lib/lean/$p" "$RUNNER_TEMP/bfss-k1d18a-new-evidence"
          lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$p/$m.olean" "$p/$m.lean" > "$RUNNER_TEMP/bfss-k1d18a-new-evidence/candidate.log" 2>&1 || {
            cat "$RUNNER_TEMP/bfss-k1d18a-new-evidence/candidate.log"; exit 1;
          }
          test -s ".lake/build/lib/lean/$p/$m.olean"
          cat "$RUNNER_TEMP/bfss-k1d18a-new-evidence/candidate.log"
          python3 - <<'PY'
          import hashlib,pathlib,re
          root=pathlib.Path('.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler')
          file=root/'SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.olean'
          log=pathlib.Path('../')/'not-a-real-path'
          # Exact stdout checked by the following second independent import.
          assert file.stat().st_size > 0
          print('K1D18A_FRESH_OLEAN_SHA256',hashlib.sha256(file.read_bytes()).hexdigest())
          PY
      - name: Independently import new object and audit exact candidate type/axioms
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          d="$RUNNER_TEMP/bfss-k1d18a-new-evidence"
          cat > "$d/audit.lean" <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe
          #print axioms FCP.BFSSS1V52K1D18A.source48_coordinate_sum
          #print axioms FCP.BFSSS1V52K1D18A.source48_normalized_polar_coordinate_dot
          #check @FCP.BFSSS1V52K1D18A.source48_coordinate_sum
          #check @FCP.BFSSS1V52K1D18A.source48_normalized_polar_coordinate_dot
          LEAN
          lake env lean -DwarningAsError=true "$d/audit.lean" > "$d/audit.log" 2>&1 || { cat "$d/audit.log"; exit 1; }
          cat "$d/audit.log"
          python3 - "$d/audit.log" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          roots=['FCP.BFSSS1V52K1D18A.source48_coordinate_sum',
                 'FCP.BFSSS1V52K1D18A.source48_normalized_polar_coordinate_dot']
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [r for r,_ in reports]==roots,reports
          permitted={'propext','Classical.choice','Quot.sound'}
          for root,axioms in reports:
              assert set(x.strip() for x in axioms.split(',') if x.strip())<=permitted,(root,axioms)
          assert 'sorryAx' not in s
          assert not re.search(r'\.lean:\d+:\d+:\s*(?:warning|error)',s)
          for root in roots: assert root in s
          print('K1D18A_SCOPED_CACHE_REUSED_FRESH_TWO_ROOT_AXIOMS_PASS')
          PY
      - name: Preserve logs on any terminal outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d18a-warm-cache-source-bridge-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-k1d18a-cache-evidence
            ${{ runner.temp }}/bfss-k1d18a-new-evidence
          if-no-files-found: warn
