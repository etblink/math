name: BFSS W0C0 R2 second setup-only syntax RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c0-r2-second-preflight-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-r2-preflight-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact original second R2 preflight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert original source frozen and last qualified theorem preserved
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean)" = 96d3b63d08413f880d1adf0cef8b8e291f7b9453
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean)" = fe9136065179d706c60871ae16e02b8f60e1b189
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c0-r2-original-fock-scalar-trace-strict.yml)" = 5df8bb9123ee0bd47bccfa6f566d0c28cd339080
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip)" = 54f84642bc280e61ce9fe59b77bfd9caf7bc7c61
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip)" = 56e470ba2dbea58c9a05cdfcea91f64e06b568e8
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          assert s["active"]["gate"]=="P3-M4-W0C0" and s["active"]["attempt"]=="R2" and s["active"]["status"]=="PENDING_STRICT_CI"
          assert s["last_qualified"]["gate"]=="P3-M4-W0B2B" and s["last_qualified"]["run_id"]==44180157170
          assert s["w0c0_r2_first_preflight_red"]["run_id"]==44190799433
          PY
      - name: Independently download original Actions artifact and complete job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          run=44191695033; job=134422479000; artifact=14376422748
          tested="f1f86486035da380c1da30812b6830a3ef1e7dee"
          digest="447f688355a42051acc9926d3cc64e3d49148acd258b0e749e91bb3151a4e124"
          prefix="https://api.github.com/repos/etblink/math"
          hdr={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=60) as f:return json.load(f)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["status"]=="completed" and runinfo["conclusion"]=="failure" and runinfo["head_sha"]==tested
          assert meta["id"]==artifact and meta["size_in_bytes"]==514 and meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try: response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=hdr),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  with urllib.request.urlopen(e.headers["Location"],timeout=90) as f:return f.read()
              else:
                  with response:return response.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==514 and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and "tested-commit.txt" in z.namelist()
              assert z.read("tested-commit.txt").decode().strip()==tested
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(z.namelist())]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert b"SyntaxError" in full and b"was never closed" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/"BFSS_M4_W0C0_R2_44191695033_PREFLIGHT_SYNTAX_RED_evidence.zip"
          log=root/"BFSS_W0C0_R2_44191695033_complete_job.log"
          manifest=root/"BFSS_W0C0_R2_44191695033_PREFLIGHT_SYNTAX_RED_evidence_manifest.json"
          for p in (archive,log,manifest):assert not p.exists()
          archive.write_bytes(raw);log.write_bytes(full)
          m={"gate":"P3-M4-W0C0","attempt":"R2","status":"PREFLIGHT_RED_UNQUALIFIED",
             "run_id":run,"job_id":job,"artifact_id":artifact,"tested_sha":tested,
             "original_zip":{"path":str(archive),"size":514,"sha256":digest,"members":members},
             "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
             "source_blob":"96d3b63d08413f880d1adf0cef8b8e291f7b9453",
             "consumer_blob":"fe9136065179d706c60871ae16e02b8f60e1b189",
             "workflow_blob":"5df8bb9123ee0bd47bccfa6f566d0c28cd339080",
             "failure_phase":"PRE_LEAN_PYTHON_SYNTAX_ERROR",
             "native_theorems_executed":0,
             "failure_reason":"Historical evidence pin-check assertion omitted closing bracket; Python SyntaxError before Lean restoration."}
          manifest.write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0C0_R2_SECOND_PREFLIGHT_SYNTAX_RED_PROVIDER_AND_LOG_REHASH_PASS")
          PY
      - name: Git-pin original RED artifact, full Actions log, checksum manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44191695033_PREFLIGHT_SYNTAX_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C0_R2_44191695033_complete_job.log research/quantum-information/diagnostics/BFSS_W0C0_R2_44191695033_PREFLIGHT_SYNTAX_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C0 R2: preserve second setup-only Python syntax RED evidence"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
