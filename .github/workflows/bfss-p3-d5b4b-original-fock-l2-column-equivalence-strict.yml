          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-p3-d5b4b"
          names=["FCP.BFSSP3D5B4BOriginalFockL2ColumnEquiv.originalFockL2ColumnsEquiv","FCP.BFSSP3D5B4BOriginalFockL2ColumnEquiv.originalFockL2ColumnsEquiv_apply","FCP.BFSSP3D5B4BOriginalFockL2ColumnEquiv.originalFockL2ColumnsEquiv_symm_apply_apply","FCP.BFSSP3D5B4BOriginalFockL2ColumnEquiv.originalFockL2ColumnsEquiv_apply_symm_apply"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              log=(d/name).read_text()
              assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-3000:])
              warnings=[line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)]
              assert not warnings,(name,warnings[:8])
              if name!="cold-build.log":
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [n for n,_ in reports]==names,(name,reports,names)
                  for n,raw in reports:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(n,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
              "status":"B4B_ORIGINAL_FOCK_L2_COLUMN_SURJECTIVITY_STRICT_GREEN",
              "original_Fermion2_finite_L2_column_assembly":True,
              "source_Boson2_base_independent_consumer":True,
              "surjectivity_of_accepted_D5B3_isometry":True,
              "full_linear_isometric_equivalence_B4B":True,
              "operator_HS_identification":False,
              "gauge_fixed_space":False,"closed_H_graph":False,"spectral_existence":False
          },sort_keys=True,indent=2))
          print("BFSS_P3_D5B4B_ORIGINAL_FOCK_L2_COLUMN_EQUIVALENCE_STRICT_GREEN")
          PY
