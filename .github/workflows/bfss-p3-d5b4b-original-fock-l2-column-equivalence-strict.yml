        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          e="$RUNNER_TEMP/bfss-p3-d5b4b"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3D5B4BOriginalFockL2ColumnEquiv.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3D5B4BOriginalFockL2ColumnEquiv.olean"
