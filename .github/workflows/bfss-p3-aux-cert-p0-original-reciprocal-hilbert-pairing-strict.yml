name: BFSS P3-AUX-CERT-P0 original reciprocal Hilbert pairing strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-aux-cert-p0-original-reciprocal-hilbert-pairing-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxCertP0OriginalReciprocalHilbertPairing.lean
      - lean/diagnostics/BFSSP3AuxCertP0OriginalReciprocalHilbertPairingIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-cert-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-reciprocal-hilbert-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen source ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Preflight complete reviewed source closure and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-aux-cert-p0-evidence
          git rev-parse HEAD > bfss-aux-cert-p0-evidence/tested-sha.txt
          python3 - <<'PY' | tee bfss-aux-cert-p0-evidence/preflight.log
          from pathlib import Path
          import subprocess,re,json,hashlib
          BASE="23849e62a9b8fe88a66acaa65e77fc8a000c0974"
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxCertP0OriginalReciprocalHilbertPairing.lean"
          CONSUMER="lean/diagnostics/BFSSP3AuxCertP0OriginalReciprocalHilbertPairingIndependentConsumer.lean"
          EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxCertP0OriginalReciprocalHilbertPairing.lean":"f3b4645d85cd611b48cc6f480857659c0b5934c2","lean/diagnostics/BFSSP3AuxCertP0OriginalReciprocalHilbertPairingIndependentConsumer.lean":"e1f5e395550146370e8d17387ff00d35f2c4fbc2","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0AOriginalRadialScalar.lean":"a67f8740586588c6d4ee9c9148574c81c14d4937","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B1OriginalReciprocalLpInfinity.lean":"d1cbb8077799236e5e1b82704270bdb9ab9153b4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0B2AOriginalReciprocalFullL2BoundedAction.lean":"e2a02b551486cfbc2a723f5b5ff0b282177c5e76","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxG0B0OriginalReciprocalFullL2AEMultiplication.lean":"670cc600fdc42a03d21de759e8b46b6cb1306874","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC2AOriginalReciprocalFullL2Injectivity.lean":"64905d174965632d19e6bd04d334538018692b16","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC2BOriginalReciprocalHilbertOutputLift.lean":"45aa19082616ae874bf642f336d9a7c5fa1fd6f9","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean":"a9f27a48852ac570aedc8e0ab88d683250e6b138","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxRADC3OriginalPhysicalWeightedChargeGraph.lean":"6aff6416d341738a1f55e6aaad107f4726f1e34f"}
          ROOTS=["originalReciprocalField_conj","originalReciprocalFullL2CLM_inner","originalReciprocalHilbertOutputCLM_inner","originalWeightedChargeGraph_pairing"]
          NAMESPACE="FCP.BFSSP3AuxCertP0OriginalReciprocalHilbertPairing"
          DONORS=["FCP.BFSSP3AuxG0B0OriginalReciprocalFullL2AEMultiplication.originalReciprocalFullL2CLM_ae_originalField","FCP.BFSSP3AuxRADC2BOriginalReciprocalHilbertOutputLift.originalReciprocalHilbertOutputCLM_coordinate","FCP.BFSSP3AuxRADC3OriginalPhysicalWeightedChargeGraph.originalWeightedPhysicalChargeColumn_graph_eq","FCP.BFSSP3AuxRADC3OriginalPhysicalWeightedChargeGraph.originalWeightedPhysicalChargeGraph_mem_iff"]
          def git(*a):
              return subprocess.check_output(["git",*a],text=True).strip()
          assert git("cat-file","-t",BASE)=="commit"
          assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
          baseline={}
          for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
              m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
              if m:
                  baseline[m[2]]=m[1]
          seen={}
          stack=[SOURCE,CONSUMER]
          while stack:
              p=stack.pop()
              if p in seen:
                  continue
              f=Path(p)
              assert f.is_file(),("missing OAI source",p)
              sha=git("hash-object","--no-filters",p)
              if p not in (SOURCE,CONSUMER):
                  assert baseline.get(p)==sha,("reviewed existing OAI source drift",p,baseline.get(p),sha)
              seen[p]=sha
              for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                  for name in names.split("--",1)[0].split():
                      if name=="OAI" or name.startswith("OAI."):
                          stack.append("lean/"+name.replace(".","/")+".lean")
          for p,sha in EXPECTED.items():
              assert seen.get(p)==sha,("frozen donor/candidate drift",p,seen.get(p),sha)
          source=Path(SOURCE).read_text()
          consumer=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==(
              [NAMESPACE+"."+x for x in ROOTS]+DONORS)
          assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxG0B0OriginalReciprocalFullL2AEMultiplication","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxRADC3OriginalPhysicalWeightedChargeGraph","Mathlib.MeasureTheory.Function.L2Space","Mathlib.Analysis.InnerProductSpace.PiL2"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxCertP0OriginalReciprocalHilbertPairing","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxHeartbeats" not in code and "maxRecDepth" not in code
          assert "pairedGaugeData.physicalSpace" in consumer
          assert "originalWeightedChargeGraph_pairing pairedAlgebraData pairedGaugeData hε" in consumer
          assert "PiLp 2 (fun _ : SpinIndex => FullL2 2)" in consumer and ".graph" in consumer
          assert "FullL2 2" in consumer and "Fermion 2" in consumer and "Boson 2" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in packages if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          out=Path("bfss-aux-cert-p0-evidence")
          out.mkdir(exist_ok=True)
          receipt={"status":"PREFLIGHT_NOT_LEAN_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
              "reviewed_existing_source_baseline":BASE,"source":SOURCE,"consumer":CONSUMER,
              "transitive_OAI_pin_count":len(seen),"pins":dict(sorted(seen.items())),
              "source_roots":[NAMESPACE+"."+x for x in ROOTS],"independent_donor_roots":DONORS}
          manifest=out/"pin-manifest.json"
          manifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_CERT_P0_PREFLIGHT_PASS",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-cert-p0-evidence/cache.log
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold source and native paired graph consumer with four and eight root reports
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxCertP0OriginalReciprocalHilbertPairing"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxCertP0OriginalReciprocalHilbertPairing.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxCertP0OriginalReciprocalHilbertPairing.olean"
          rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
          timeout 3600s lake build "$mod" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe 2>&1 | tee ../bfss-aux-cert-p0-evidence/build.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-aux-cert-p0-evidence/source.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxCertP0OriginalReciprocalHilbertPairingIndependentConsumer.lean 2>&1 | tee ../bfss-aux-cert-p0-evidence/consumer.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          d=Path("../bfss-aux-cert-p0-evidence")
          new_roots=["FCP.BFSSP3AuxCertP0OriginalReciprocalHilbertPairing.originalReciprocalField_conj","FCP.BFSSP3AuxCertP0OriginalReciprocalHilbertPairing.originalReciprocalFullL2CLM_inner","FCP.BFSSP3AuxCertP0OriginalReciprocalHilbertPairing.originalReciprocalHilbertOutputCLM_inner","FCP.BFSSP3AuxCertP0OriginalReciprocalHilbertPairing.originalWeightedChargeGraph_pairing"]
          donors=["FCP.BFSSP3AuxG0B0OriginalReciprocalFullL2AEMultiplication.originalReciprocalFullL2CLM_ae_originalField","FCP.BFSSP3AuxRADC2BOriginalReciprocalHilbertOutputLift.originalReciprocalHilbertOutputCLM_coordinate","FCP.BFSSP3AuxRADC3OriginalPhysicalWeightedChargeGraph.originalWeightedPhysicalChargeColumn_graph_eq","FCP.BFSSP3AuxRADC3OriginalPhysicalWeightedChargeGraph.originalWeightedPhysicalChargeGraph_mem_iff"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in [
              ("build.log",None),("source.log",new_roots),("consumer.log",new_roots+donors)]:
              log=(d/name).read_text()
              assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
              assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
              if expected is not None:
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [n for n,_ in reports]==expected,(name,reports,expected)
                  for declaration,raw in reports:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
              "status":"ORIGINAL_RECIPROCAL_HILBERT_PAIRING_STRICT_GREEN",
              "original_native_SU2_FullL2_PiLp_graph_consumer":True,
              "epsilon_positive":True,
              "actual_AE_L2_and_finite_PiLp_inner_pairing":True,
              "actual_original_charge_domain_and_weighted_graph":True,
              "new_roots":4,"independent_donor_roots":4,
              "new_reciprocal_or_ratio_operator":False,
              "physical_Spin9_or_individual_supercharge_identity_proved":False,
              "Hardy_fidelity_zero_mode_or_gap_proved":False},sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_CERT_P0_ORIGINAL_RECIPROCAL_HILBERT_PAIRING_STRICT_GREEN")
          PY
      - name: Preserve strict and first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-aux-cert-p0-evidence
          path: bfss-aux-cert-p0-evidence/
          if-no-files-found: warn
          retention-days: 14
