name: BFSS D1S4 original finite Fock quantizer self-adjoint source strict

'on':
  push:
    branches:
      - research/bfss-hopfion-gut-counterfactuals-20261121
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1S4OriginalPhysicalQuantizationSelfAdjointProbe.lean
      - .github/workflows/bfss-d1s4-original-quantizer-selfadjoint-source-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-d1s4-original-quantizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-finite-fock-hermiticity:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact original source and root preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-d1s4"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-d1s4/tested-sha.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-d1s4/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-d1s4/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          root="lean/OAI/MathematicalPhysics/BFSS/"
          src=root+"Contrib/Kotler/D1S4OriginalPhysicalQuantizationSelfAdjointProbe.lean"
          pins={
            root+"Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            root+"FermionFrequency.lean":"cbb82a42f42b3b3d3695081247bd14d0496abc7d",
            root+"FermionQuantization.lean":"c6b72d030225c707ef54f5285a18a7a8175ee280",
            root+"FrequencyContraction.lean":"425edf6d7d0f9d15ce5f8bc92e8788ef60068618",
            root+"Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean":"152204ef15a6569534e0503824a697cb9ae8e4ce",
            root+"Contrib/Kotler/D1S3OriginalFermionCoefficientSkewProbe.lean":"f35d70284bec100dc617935cf41a6c933c618e5b",
          }
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,("FROZEN_ORIGINAL_SOURCE_DRIFT",path,actual,expected)
          text=Path(src).read_text()
          assert re.findall(r"(?m)^import (\S+)$",text)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.D1S3OriginalFermionCoefficientSkewProbe"]
          roots=["sourceQuantizeSkew_isSelfAdjoint",
                 "originalPhysicalQuantization_isSelfAdjoint",
                 "pairedOriginalPhysicalQuantization_isSelfAdjoint"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",text)==roots
          assert "set_option autoImplicit false" in text
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",text)
          assert all(t not in text for t in [
            "set_option maxRecDepth","set_option maxHeartbeats","set_option linter."])
          assert all(t in text for t in [
            "sourceQuantizeSkew_isSelfAdjoint",
            "originalPhysicalQuantization_isSelfAdjoint",
            "pairedOriginalPhysicalQuantization_isSelfAdjoint",
            "theta_selfAdjoint","quantizeFrequency",
            "originalFermionCoefficient_skew","FrequencyMatrix N",
            "Fermion N","star_smul","star_mul","star_sum"])
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in manifest if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_D1S4_ORIGINAL_SOURCE_PIN_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-d1s4/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Native source and strict no-axiom-expansion check
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-d1s4"
          timeout 2500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.D1S4OriginalPhysicalQuantizationSelfAdjointProbe 2>&1 | tee "$E/cold-build.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1S4OriginalPhysicalQuantizationSelfAdjointProbe.lean \
            2>&1 | tee "$E/source-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-d1s4"
          names=["sourceQuantizeSkew_isSelfAdjoint",
                 "originalPhysicalQuantization_isSelfAdjoint",
                 "pairedOriginalPhysicalQuantization_isSelfAdjoint"]
          for filename in ("cold-build.log","source-axioms.log"):
              body=(d/filename).read_text()
              for bad in ["error:","sorryAx","unknownIdentifier","unsolved goals"]:
                  assert bad not in body,(filename,bad,body[-6000:])
          content=(d/"source-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",content)
          expected=["FCP.BFSSHopfD1S4."+n for n in names]
          assert [n for n,_ in reports]==expected,(reports,expected)
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,axioms in reports:
              actual={a.strip() for a in axioms.split(",") if a.strip()}
              assert actual<=allowed,(name,actual)
          print("BFSS_D1S4_SOURCE_ONLY_STRICT_GREEN")
          PY

      - name: Preserve original source gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-d1s4-original-quantizer-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-d1s4/
          if-no-files-found: warn
          retention-days: 30
