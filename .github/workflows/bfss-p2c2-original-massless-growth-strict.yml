name: BFSS P2-C2 original massless fermion growth strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSP2C2OriginalMasslessGrowthBinding.lean
      - lean/diagnostics/BFSSP2C2OriginalMasslessGrowthConsumer.lean
      - .github/workflows/bfss-p2c2-original-massless-growth-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-p2c2-original-massless-growth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout pinned BFSS unified sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source pins and independent consumer contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-p2c2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-p2c2/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          pins = {
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/PotentialBasis.lean": "bc9b526284166efcba5a8e296adc79ba88e6764d",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2ColorCrossProbe.lean": "209b3808222730ca5e817d83ed32253a67513f7f",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2RealGammaProbe.lean": "b9b8192055c70f0d001d7982669b9823c55562ed",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2FermionF3C2ThetaFieldsProbe.lean": "ea5dff75247064d00bcd4645711256900473dacb",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSFullAlgebraDataProbe.lean": "de8242615e4b2959e2dfa57cf0c6fdf43896acb7",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSP2C2OriginalMasslessGrowthBinding.lean": "59a2dcc84ff36beddca12a440ab01b21b6c64cef",
            "lean/diagnostics/BFSSP2C2OriginalMasslessGrowthConsumer.lean": "6ed56103e88e2fb159d1ca2432ebdaf45c9c7f95",
            "lean/OAI/MathematicalPhysics/BFSS/PotentialBounds.lean": "06afe0a2fa0c6d65439ad15e4e6031f1d43260b7",
            "lean/OAI/MathematicalPhysics/BFSS/DeformedCharge.lean": "c27c913c44090100f0c714e3eb34e25205f4d2d3",
            "lean/lean-toolchain": "ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json": "67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for path,expected in pins.items():
              got = subprocess.check_output(
                  ["git","hash-object","--no-filters",path], text=True).strip()
              assert got == expected,(path,expected,got)
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          mathlib=next(p["rev"] for p in packages if p["name"]=="mathlib")
          assert mathlib=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSP2C2OriginalMasslessGrowthBinding.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP2C2OriginalMasslessGrowthConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==[
              "OAI.MathematicalPhysics.BFSS.PotentialBounds",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSFullAlgebraDataProbe"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSP2C2OriginalMasslessGrowthBinding"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==[
              "originalMasslessFermionGrowthConstant_nonneg",
              "originalMasslessFermionField_growth",
              "originalMasslessFermionField_inner_lower"]
          assert len(re.findall(r"(?m)^example\b",consumer))==3
          assert "concreteAlgebraData.deformedFermionField_growth" in source
          assert "concreteAlgebraData.deformedFermionField_inner_lower" in source
          assert "concreteAlgebraData.fermionGrowthConstant_nonneg" in source
          for body in (source,consumer):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "set_option maxHeartbeats 0" not in body
          print("BFSS_P2C2_PINNED_SOURCE_PREFLIGHT_PASS")
          PY
      - name: Restore exact pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original source build and strict independent consumer
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSP2C2OriginalMasslessGrowthBinding.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSP2C2OriginalMasslessGrowthBinding.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1650s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSP2C2OriginalMasslessGrowthBinding 2>&1 | tee "$RUNNER_TEMP/bfss-p2c2/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 |
            tee "$RUNNER_TEMP/bfss-p2c2/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSP2C2OriginalMasslessGrowthConsumer.lean 2>&1 |
            tee "$RUNNER_TEMP/bfss-p2c2/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-p2c2"
          names=["cold-build.log","source-axioms.log","independent-consumer.log"]
          for n in names:
              s=(root/n).read_text()
              assert "error:" not in s and "sorryAx" not in s,(n,s[-4000:])
              dependency_warning=re.compile(
                  r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              warnings=[line for line in s.splitlines()
                        if "warning:" in line and not dependency_warning.fullmatch(line)]
              assert not warnings,(n,warnings[:10])
          log=(root/"source-axioms.log").read_text()
          roots=[
            "FCP.BFSSP2C2OriginalMasslessGrowth.originalMasslessFermionGrowthConstant_nonneg",
            "FCP.BFSSP2C2OriginalMasslessGrowth.originalMasslessFermionField_growth",
            "FCP.BFSSP2C2OriginalMasslessGrowth.originalMasslessFermionField_inner_lower"]
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          assert [x for x,_ in reports]==roots,(reports,roots)
          allowed={"propext","Classical.choice","Quot.sound"}
          assert all({x.strip() for x in raw.split(",") if x.strip()}<=allowed for _,raw in reports),reports
          print("BFSS_P2C2_ORIGINAL_MASSLESS_FIELD_STRICT_GREEN")
          PY
      - name: Preserve exact P2-C2 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p2c2-original-massless-growth-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-p2c2/
          if-no-files-found: warn
          retention-days: 14
