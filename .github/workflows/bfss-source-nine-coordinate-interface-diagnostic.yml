name: BFSS source nine coordinate restriction Mathlib interface diagnostic

on:
  push:
    branches: [research/bfss-original-gamma-faithfulness-20261107]
    paths:
      - lean/diagnostics/BFSSSourceNineCoordinateInterfaceDiagnostic.lean
      - .github/workflows/bfss-source-nine-coordinate-interface-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinate-interface-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retain source controls and inspect exact original candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-coordinate-interface"
          git rev-parse HEAD > "$RUNNER_TEMP/bfss-coordinate-interface/tested-sha.txt"
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralSourceNineAxisCoordinateRestriction.lean)" = "1f9e3dec2502446d3a95d138583c0bc400eb717c"
          test "$(cat lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          python3 - <<'PY'
          import json
          m=json.load(open('lean/lake-manifest.json'))
          p=[p for p in m['packages'] if p['name']=='mathlib']
          assert len(p)==1 and p[0]['rev']=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          assert len(m['packages'])==42
          print('COORDINATE_INTERFACE_PINNED_PREFLIGHT_PASS')
          PY
          cp lean/diagnostics/BFSSSourceNineCoordinateInterfaceDiagnostic.lean "$RUNNER_TEMP/bfss-coordinate-interface/"
          cp .github/workflows/bfss-source-nine-coordinate-interface-diagnostic.yml "$RUNNER_TEMP/bfss-coordinate-interface/"
          cp lean/lean-toolchain lean/lake-manifest.json "$RUNNER_TEMP/bfss-coordinate-interface/"
          sha256sum lean/diagnostics/BFSSSourceNineCoordinateInterfaceDiagnostic.lean > "$RUNNER_TEMP/bfss-coordinate-interface/diagnostic-sha256.txt"
      - name: Restore pinned Lean and Mathlib environment
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
      - name: Compile the nine source-index and matrix interface tests only
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          set +e
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSSourceNineCoordinateInterfaceDiagnostic.lean 2>&1 | tee "$RUNNER_TEMP/bfss-coordinate-interface/diagnostic.log"
          code="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/bfss-coordinate-interface/compiler-exit.txt"
          test "$code" -eq 0
          grep -qx 'BFSS_SOURCE_NINE_COORDINATE_INTERFACE_DIAGNOSTIC_COMPLETE' "$RUNNER_TEMP/bfss-coordinate-interface/diagnostic.log"
          ! grep -Eq '(^|[[:space:]])(error:|sorryAx)' "$RUNNER_TEMP/bfss-coordinate-interface/diagnostic.log"
          # Lake package-dirty administrative warnings are not Lean proof warnings.
          # Preserve -DwarningAsError=true and reject all file-line Lean warnings.
          ! grep -Eq '^diagnostics/BFSSSourceNineCoordinateInterfaceDiagnostic\.lean:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/bfss-coordinate-interface/diagnostic.log"
          printf '%s\n' COORDINATE_INTERFACE_DIAGNOSTIC_PASS
      - name: Retain complete diagnostic and rejected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-coordinate-interface-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-coordinate-interface
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
