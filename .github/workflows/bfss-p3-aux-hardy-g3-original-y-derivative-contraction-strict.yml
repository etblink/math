name: BFSS P3-AUX-HARDY-G3 original Y derivative contraction strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-aux-hardy-g3-original-y-derivative-contraction-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean
      - lean/diagnostics/BFSSP3AuxHardyG3OriginalYDerivativeContractionIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-hardy-g3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-y-derivative-contraction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen source ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Preflight complete reviewed source closure and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-aux-hardy-g3-evidence
          git rev-parse HEAD > bfss-aux-hardy-g3-evidence/tested-sha.txt
          python3 - <<'PY' | tee bfss-aux-hardy-g3-evidence/preflight.log
          from pathlib import Path
          import subprocess,re,json,hashlib
          BASE="64718d564f311b914e629e8bae536327b053ee1f"
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean"
          CONSUMER="lean/diagnostics/BFSSP3AuxHardyG3OriginalYDerivativeContractionIndependentConsumer.lean"
          EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean": "03b5236bd91e4664e7101544b065054bd6c925a1", "lean/diagnostics/BFSSP3AuxHardyG3OriginalYDerivativeContractionIndependentConsumer.lean": "8fd1ac6d819aaccf9cabe38448813a09c75e59bb", "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60", "lean/OAI/MathematicalPhysics/BFSS/GammaWords.lean": "d12051e70de679f5458dbd456667a32c7b407ce4", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG1OriginalOddGammaTraces.lean": "6a019c9111b384e73a05de7b776ac9e5a83c7eb7", "lean/OAI/MathematicalPhysics/BFSS/GammaIdentity.lean": "45e58da900a7691b88e5760a483b8adff1c7f015", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG2OriginalPlaneCoefficientTrace.lean": "952890f8056c2b115d69a03c08c39762210c1a0b"}
          ROOTS=["originalHardyYCLM", "originalHardyYCLM_apply", "originalHardyY_fderiv", "originalHardyY_basis_contraction", "originalHardyY_derivative_contraction"]
          NAMESPACE="FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction"
          DONORS=["FCP.BFSSP3AuxHardyG2OriginalPlaneCoefficientTrace.originalHardyY", "FCP.BFSSP3AuxHardyG2OriginalPlaneCoefficientTrace.originalHardyY_trace", "FCP.BFSSP3AuxHardyG1OriginalOddGammaTraces.originalGamma_square_trace", "OAI.BFSSGamma.gamma_sq", "OAI.BFSSGamma.gamma_anti"]
          def git(*a):
              return subprocess.check_output(["git",*a],text=True).strip()
          assert git("cat-file","-t",BASE)=="commit"
          assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
          baseline={}
          for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
              m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
              if m:
                  baseline[m[2]]=m[1]
          seen={}
          stack=[SOURCE,CONSUMER]
          while stack:
              p=stack.pop()
              if p in seen:
                  continue
              f=Path(p)
              assert f.is_file(),("missing OAI source",p)
              sha=git("hash-object","--no-filters",p)
              if p not in (SOURCE,CONSUMER):
                  assert baseline.get(p)==sha,("reviewed existing OAI source drift",p,baseline.get(p),sha)
              seen[p]=sha
              for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                  for name in names.split("--",1)[0].split():
                      if name=="OAI" or name.startswith("OAI."):
                          stack.append("lean/"+name.replace(".","/")+".lean")
          for p,sha in EXPECTED.items():
              assert seen.get(p)==sha,("frozen donor/candidate drift",p,seen.get(p),sha)
          source=Path(SOURCE).read_text()
          consumer=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==(
              [NAMESPACE+"."+x for x in ROOTS]+DONORS)
          assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG2OriginalPlaneCoefficientTrace"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG3OriginalYDerivativeContraction","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxHeartbeats" not in code and "maxRecDepth" not in code
          assert "pairedAlgebraData" in consumer
          assert "originalHardyY_fderiv pairedAlgebraData" in consumer
          assert "originalHardyY_basis_contraction pairedAlgebraData" in consumer
          assert "originalHardyY_derivative_contraction pairedAlgebraData" in consumer
          assert "EuclideanSpace.single (8, nativeColorZero) 1" in consumer and "(1 / 56 : ℝ)" in consumer
          assert "nativeProbe" in consumer and "≠ 8" in consumer
          assert "private def nativeColorZero : ColorIndex 2" in consumer
          assert len(re.findall(r"(?m)^example\b",consumer))==12
          assert "FullL2 2" in consumer and "Fermion 2" in consumer and "Boson 2" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in packages if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          out=Path("bfss-aux-hardy-g3-evidence")
          out.mkdir(exist_ok=True)
          receipt={"status":"PREFLIGHT_NOT_LEAN_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
              "reviewed_existing_source_baseline":BASE,"source":SOURCE,"consumer":CONSUMER,
              "transitive_OAI_pin_count":len(seen),"pins":dict(sorted(seen.items())),
              "source_roots":[NAMESPACE+"."+x for x in ROOTS],"independent_donor_roots":DONORS}
          manifest=out/"pin-manifest.json"
          manifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_HARDY_G3_PREFLIGHT_PASS",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-hardy-g3-evidence/cache.log
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold source and native Y derivative contraction consumer with five and ten root reports
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG3OriginalYDerivativeContraction"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.olean"
          rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
          timeout 3600s lake build "$mod" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe 2>&1 | tee ../bfss-aux-hardy-g3-evidence/build.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-aux-hardy-g3-evidence/source.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG3OriginalYDerivativeContractionIndependentConsumer.lean 2>&1 | tee ../bfss-aux-hardy-g3-evidence/consumer.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          d=Path("../bfss-aux-hardy-g3-evidence")
          new_roots=["FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyYCLM", "FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyYCLM_apply", "FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_fderiv", "FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_basis_contraction", "FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyY_derivative_contraction"]
          donors=["FCP.BFSSP3AuxHardyG2OriginalPlaneCoefficientTrace.originalHardyY", "FCP.BFSSP3AuxHardyG2OriginalPlaneCoefficientTrace.originalHardyY_trace", "FCP.BFSSP3AuxHardyG1OriginalOddGammaTraces.originalGamma_square_trace", "OAI.BFSSGamma.gamma_sq", "OAI.BFSSGamma.gamma_anti"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in [
              ("build.log",None),("source.log",new_roots),("consumer.log",new_roots+donors)]:
              log=(d/name).read_text()
              assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
              assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
              if expected is not None:
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [n for n,_ in reports]==expected,(name,reports,expected)
                  for declaration,raw in reports:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
              "status":"ORIGINAL_Y_DERIVATIVE_CONTRACTION_STRICT_GREEN",
              "original_native_paired_gamma_and_Boson_consumer":True,
              "CLM_equals_accepted_original_Y":True,
              "actual_fderiv_identified":True,
              "all_nine_basis_and_derivative_contraction_one_quarter":True,
              "ninth_axis_one_over_fifty_six_control":True,
              "probe_four_and_wrong_eight_rejection":True,
              "tau_anticommutator_proved":False,
              "new_roots":5,"independent_donor_roots":5,
              "new_Clifford_or_Fock_model":False,
              "tau_algebra_or_physical_Spin9_proved":False,
              "Hardy_fidelity_zero_mode_or_gap_proved":False},sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_HARDY_G3_ORIGINAL_Y_DERIVATIVE_CONTRACTION_STRICT_GREEN")
          PY
      - name: Preserve strict and first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-aux-hardy-g3-evidence
          path: bfss-aux-hardy-g3-evidence/
          if-no-files-found: warn
          retention-days: 14
