name: BFSS V10H F8 ambient Clifford units exact generator determinant bridge strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF8CliffordUnitsGeneratorDetBridgeProbe.lean
      - .github/workflows/bfss-kotler-v10h-f8-clifford-unit-generator-det-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-clifford-units-generator-det:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify qualified F7 exact source and F8 ambient Clifford generator bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f8"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f8/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe.lean")" = '47e13c108393146c2ebb699237edb1414564d34d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe.lean")" = '9b9a2f85c8cbd8588c1d86fba92b4b6cffa16973'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF8CliffordUnitsGeneratorDetBridgeProbe.lean")" = '937e1033ad5261f2dfa0c415e60d4b7e38ac0736'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF8CliffordUnitsGeneratorDetBridgeProbe.lean').read_text()
          names=["source9CliffordUnitsGammaDetHom","source9CliffordUnitsGammaDetHom_apply","source9CliffordUnitsGammaDetHom_spin_apply","source9CliffordUnitsGammaDetHom_generator"]
          for n in names:
              assert len(re.findall(r'(?m)^(?:theorem|noncomputable def) '+re.escape(n)+r'\b',s)) == 1,n
          assert s.count('#print axioms ') == 4
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in code,'unhandled nested source comment'
          for required in ['source9GammaCliffordAlgHom', 'spinGroup.toUnits',
                           'source9GammaCliffordAlgHom_generator',
                           'map_one', 'map_mul', 'Matrix.det_mul']:
              assert required in code,required
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in code
          assert 'Matrix.detMonoidHom' not in code
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F8_CLIFFORD_UNIT_SOURCE_GENERATOR_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild qualified F7 source Spin9 two-sign proof ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe

      - name: Fresh F8 exact Clifford ambient unit determinant and generator compile warningAsError
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF8CliffordUnitsGeneratorDetBridgeProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f8/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f8/compiler.log")" -eq 4

      - name: Independently elaborate four F8 original Clifford-unit declaration types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F8_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF8CliffordUnitsGeneratorDetBridgeProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example :
              (CliffordAlgebra source9Quadratic)ˣ →* ℝ :=
            source9CliffordUnitsGammaDetHom
          noncomputable example (u : (CliffordAlgebra source9Quadratic)ˣ) :
              source9CliffordUnitsGammaDetHom u =
                (source9GammaCliffordAlgHom
                  (u : CliffordAlgebra source9Quadratic)).det :=
            source9CliffordUnitsGammaDetHom_apply u
          noncomputable example (g : spinGroup source9Quadratic) :
              source9CliffordUnitsGammaDetHom
                  (spinGroup.toUnits g) = gammaDetDirectHom g :=
            source9CliffordUnitsGammaDetHom_spin_apply g
          noncomputable example (u : (CliffordAlgebra source9Quadratic)ˣ)
              (v : SpaceIndex → ℝ)
              (hvec : (u : CliffordAlgebra source9Quadratic) =
                CliffordAlgebra.ι source9Quadratic v) :
              source9CliffordUnitsGammaDetHom u =
                (gammaNineRealLinear v).det :=
            source9CliffordUnitsGammaDetHom_generator u v hvec
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9CliffordUnitsGammaDetHom
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9CliffordUnitsGammaDetHom_apply
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9CliffordUnitsGammaDetHom_spin_apply
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9CliffordUnitsGammaDetHom_generator
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F8_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f8/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f8'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["source9CliffordUnitsGammaDetHom","source9CliffordUnitsGammaDetHom_apply","source9CliffordUnitsGammaDetHom_spin_apply","source9CliffordUnitsGammaDetHom_generator"]}
          assert len(reports)==4 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F8_ORIGINAL_CLIFFORD_UNITS_4_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f8-exact-clifford-generator-det-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f8
          if-no-files-found: warn
