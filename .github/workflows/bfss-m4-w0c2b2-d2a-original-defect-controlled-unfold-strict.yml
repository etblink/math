name: BFSS W0C2B2 D2A original Source48 defect controlled unfold strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D2AOriginalDefectControlledUnfold.lean
      - lean/diagnostics/BFSSW0C2B2D2AOriginalDefectControlledUnfoldIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0c2b2-d2a-original-defect-controlled-unfold-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-m4-w0c2b2-d2a
  cancel-in-progress: false
jobs:
  original-fock-additive-commutator-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Guard 27 anchors stopped R1 R2 and diagnostic bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-w0c2b2-d2a"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-w0c2b2-d2a/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-w0c2b2-d2a/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          src='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D2AOriginalDefectControlledUnfold.lean'
          con='lean/diagnostics/BFSSW0C2B2D2AOriginalDefectControlledUnfoldIndependentConsumer.lean'
          pins={
            src:'50f1092d7c6efe7795bde79429e3b263fc12f604',
            con:'3c621fe16b16610cf02c0bba2547bb5961a19f6d',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean':'51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean':'861628fe6322c919bee87e493e1e629d48bfa8bb',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentralityR2.lean':'d52f48a79750846231c306d9e9ac8ceda25d37be',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentrality.lean':'aae0746f002b1c74bf7712c59d7b5abfe4c8019a',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R1_44274131658_NATIVE_RED_evidence.zip':'12b5843b116bae63e2183049cae572cb1fcc051b',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R2_44280267807_NATIVE_RED_evidence.zip':'b668e91fa897136c5144ef535cb0fef035e9c216',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip':'5b0cd1c0581ac1a8df5c50093f91e3d12b3fef43',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R1_44330552342_complete_job.log':'ae3fcb4afe2be79f12162a5edafc554dbfb5c1db',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence_manifest.json':'d5bdfd6aee733ea626f6d720e97a2834587169aa',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean':'51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb',
            'research/quantum-information/BFSS_QIT_SCC_W0C2B2_D0_R1_R2_NATIVE_SOURCE_RED_HOLD_2026_11_18.md':'759ddff4fc02d0aafeb280f331855c471cd99a32',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence.zip':'18c87219367977d3d9530e90789c3e8612740849',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R2_44336446671_complete_job.log':'8e241a13c629bf245c539725d76e7230301e2de9',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence_manifest.json':'cda10924a924a50487ea76c2458de8ab5fbbcde5',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D1NamedSourceDefectBoundary.lean':'cf4286170608b3141df7ccbd753fc96507d1544a',
            'lean/diagnostics/BFSSW0C2B2D1NamedSourceDefectBoundaryIndependentConsumer.lean':'88a1b567fc2b9dcb550b736fdf289e95a8cbfb49',
            '.github/workflows/bfss-m4-w0c2b2-d1-named-source-boundary-strict.yml':'5cb43de6fb3ac4cb93c3eebc6a8f7e976f3661e3',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence.zip':'274024155e885fb1c5bb49e20604bd621f503f39',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_D1_R1_44344524186_complete_job.log':'64823596e80df015470360d2a8281b518fc5b7c2',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence_manifest.json':'4025fe5b30afda77615e7b5a88ba3beec9e5a80a',
            'research/quantum-information/BFSS_W0C2B2_METHODS_FAILURE_ATLAS_AND_D2_EXECUTION_PLAN_2026_11_18.md':'6f3d3272c9e75fd956faf92c96b3de630f19a739'
          }
          for path,expected in pins.items():
            got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert got==expected,(path,got,expected)
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['preservation_run']==44326513268
          assert a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED' and not s['strategic_focus']['full_bivector_bracket_qualified']
          red=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence_manifest.json').read_text())
          assert red['strict_run']==44330552342 and red['attempt']=='R1'
          assert red['failure_phase']=='COLD_DEPENDENCY_BUILD_TIMEOUT_1000S'
          assert red['count_as_comparable_native_proof_red'] is False
          assert red['original_zip']['sha256']=='cb089a42d1c9d63d92dfdeba00660f9266a02fb7aa338323ad31d50edeeb891b'
          assert red['original_job_log']['sha256']=='559e33c9ddb9eaeeb7b076e9be5c2cbee40a740e26359ddc40f8121d0dc02571'
          assert red['original_job_log']['size']==310587
          native=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence_manifest.json').read_text())
          assert native['strict_run']==44336446671 and native['status']=='ORIGINAL_NATIVE_SOURCE_RECURSION_RED_UNQUALIFIED'
          assert native['original_zip']['sha256']=='0ab470da516ef01035522d399abcd5a8561b99fcf96a7c1c76c9a9bad9d651dc'
          assert native['original_job_log']['sha256']=='62267f2f006cddac656c84a5e941200354e95a2d4e029155939f7da1af48a91b'
          assert native['D0_R2_native_proof_red_count']==1 and native['consumer_executed'] is False
          d1=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence_manifest.json').read_text())
          assert d1['strict_run']==44344524186 and d1['tested_sha']=='a5fc2deb20d173ff8ade0b4dcac1b0305372d7e4'
          assert d1['status']=='ORIGINAL_NATIVE_SOURCE_RECURSION_RED_UNQUALIFIED'
          assert d1['original_zip']['sha256']=='8d951f5b1fbf4aab243e2e40bbef665bfdd1771864ccf2c274f9c15711f6a138'
          assert d1['original_job_log']['sha256']=='ceba18e2f154fa8a66de0e578753b784c4ad34c7d5661d39c5184fdb3102cea5'
          assert d1['consumer_executed'] is False and d1['D1_R1_native_proof_red_count']==1
          print('BFSS_D2A_D1_NATIVE_RED_ORIGINAL_EVIDENCE_PRESERVED')
          print('BFSS_D1_D0_R2_NATIVE_RED_ORIGINAL_EVIDENCE_PRESERVED')
          print('BFSS_D0_R1_1000S_DEPENDENCY_TIMEOUT_ORIGINAL_BYTES_PRESERVED')
          for path,expected_count in ((src,1),(con,3)):
            t=Path(path).read_text()
            assert t.count('\n#print axioms ')==expected_count
            assert 'Fermion 2 →L[ℂ] Fermion 2' in t
            assert 'originalSource48K_lieDefect' in t
            if path==con:assert 'sourceNormalizedGamma' in t
            assert not any(k in t for k in ('maxRecDepth','maxHeartbeats'))
            assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',t)
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          manifest=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in manifest['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          print('BFSS_W0C2B2_D2A_27_ANCHORS_ALL_NEGATIVE_EVIDENCE_PREFLIGHT_PASS')
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original Fock additive source and independent consumer
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-w0c2b2-d2a"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.ProbeW0C2B2D2AOriginalDefectControlledUnfold 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D2AOriginalDefectControlledUnfold.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSW0C2B2D2AOriginalDefectControlledUnfoldIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import re,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'bfss-w0c2b2-d2a'
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          permitted_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,names):
            assert 'sorryAx' not in log and 'error:' not in log
            warnings=[line for line in log.splitlines() if 'warning:' in line and not permitted_warning.fullmatch(line)]
            assert not warnings,warnings
            found=pat.findall(log)
            assert len(found)==len(names),(found,names)
            assert [n.rsplit('.',1)[-1] for n,_ in found]==names
            for _,axioms in found:
              assert {a.strip() for a in axioms.split(',') if a.strip()}<=allowed,axioms
          source=['originalSource48K_lieDefect_unfoldD2A']
          consumer=['originalSource48K_lieDefect_unfoldD2A_consumer',
                    'originalSource48K_lieDefect_unfold_right_gammaD2A',
                    'originalSource48K_lieDefect_unfold_left_gammaD2A']
          audit((root/'source-axioms.log').read_text(),source)
          audit((root/'consumer.log').read_text(),consumer)
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.c' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.d' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,['a','b','c','d'])
          mutants=[good.replace('Quot.sound','sorryAx',1),good.replace('Quot.sound','Unknown.axiom',1),
                   good+good,'',good+'warning: unaccepted\n',good+'error: unsolved goals\n']
          for i,bad in enumerate(mutants):
            try:audit(bad,['a','b','c','d'])
            except AssertionError:pass
            else:raise AssertionError(('negative mutant accepted',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'error:' not in cold and 'sorryAx' not in cold
          print('BFSS_W0C2B2_D2A_1_SOURCE_3_CONSUMER_2_ORIGINAL_GAMMA_CONTROLS_6_MUTANTS_GREEN')
          PY
      - name: Upload original D0 diagnostic logs for independent audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-w0c2b2-d2a-original-evidence
          path: /home/runner/work/_temp/bfss-w0c2b2-d2a/
          retention-days: 14
          if-no-files-found: warn
