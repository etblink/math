name: BFSS M4 QTC0D original Fock thin tensor adapter strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean
      - lean/diagnostics/BFSSP3M4QTC0DOriginalFockThinTensorIndependentConsumer.lean
      - .github/workflows/bfss-m4-qtc0d-original-fock-thin-adapter-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-qtc0d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-fock-thin-tensor-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight exact source, consumer, QTC0A and QTC0C GREEN and stopped REDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-qtc0d"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-qtc0d/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-qtc0d/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean":"e52b8ca7a440e04ab3c3a93187e5100daa39e074","lean/diagnostics/BFSSP3M4QTC0DOriginalFockThinTensorIndependentConsumer.lean":"e6745b9f77fb8b1fbea58f4bb6055826320f342f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean":"9d1dc845bea73d8e07549c69d9ef07804509f52e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean":"9448c9a47c605cb6aba2cfc798ae28a0213c9411","lean/diagnostics/BFSSP3M4QTC0CAbstractCoefficientIndependentConsumer.lean":"4ec2e6eb6b98b6039326765454e563038258f869","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip":"7cebb61b36ba22283cbd27a8d5f91b301b7303e2","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_evidence.zip":"721c3b827bffafbe61d3d81720a103fb5297e389","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip":"671be94ee31c954b8f8b276de7b8ede9359aa617","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip":"485d47d68a5425a79d720248a4b64b972da619ab","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_complete_job.log":"8fd0bf888505b499d4585671b31f3fa278ab31e6","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_complete_job.log":"c56410ec436f5505988f6a138ae19e8afbb5d88f","research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_complete_job.log":"6290b76858d5e736b04af723532d94fec6b3e532","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean").read_text()
          con=Path("lean/diagnostics/BFSSP3M4QTC0DOriginalFockThinTensorIndependentConsumer.lean").read_text()
          expected_src=["originalFock_quadratic_covariance_tensor","originalFock_quadratic_covariance_skew"]
          expected_con=["originalFock_tensor_covariance_consumer","originalFock_skew_covariance_consumer"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==expected_src
          assert re.findall(r"(?m)^#print axioms (\S+)$",con)==expected_con
          assert len(re.findall(r"(?m)^example\b",con))==7
          assert len(re.findall(r"(?m)^theorem\b",src))==2 and len(re.findall(r"(?m)^theorem\b",con))==2
          for body in (src,con):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
              assert not re.search(r"(?m)^import\s+\S*P3M4QTC0B",body)
          assert len(re.findall(r"(?m)^import ",src))==3
          assert "Fermion 2 →L[ℂ] Fermion 2" in src
          assert "originalFock_quadratic_covariance_expanded" in src
          assert "originalFock_left_local_expansion" in src and "originalFock_right_local_expansion" in src
          assert "coefficient_both (fun i j => x i * x j) a b" in src
          assert "Matrix.transpose_apply" not in src
          assert "originalFockQuadratic x (a * b + b * a.transpose)" in src
          assert "originalFockQuadratic x (a * b - b * a)" in src
          assert "(1 / 4 : ℂ)" in src
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q=state["last_qualified"]
          a=state["active"]
          assert q["gate"]=="P3-M4-QTC0C" and q["run_id"]==44016807302 and q["status"]=="GREEN_QUALIFIED"
          assert a["gate"]=="P3-M4-QTC0D" and a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["attempt"]=="R1" and a["accepted_predecessor_run"]==44016807302
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean"] and a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4QTC0DOriginalFockThinTensorIndependentConsumer.lean"]
          assert a["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==2
          assert a["independent_controls"]==7
          assert Path(a["prospective_receipt"]).is_file()
          assert state["previous_active_QTC0B_R2_stopped"]["run_id"]==44014529416
          assert state["previous_active_QTC0B_R2_stopped"]["stopped"] is True
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          artifacts=[
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0A_R1_44001621836_evidence.zip",
             "bf8d93fe00846c9ea26815d32ee331424d9510d1816b66cd98c90ef82baf724c"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0C_R1_44016807302_evidence.zip",
             "1a95148f7dc41086683592b670257734c7726f0fff0929e4b59930a65ffefa0e"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R1_44012367725_evidence.zip",
             "a50bc06b6f5ac03c15be16de7b943910ca55bc3a7960f40829c1049e8402c5c1"),
            ("research/spectral-p2-original-field/diagnostics/BFSS_M4_QTC0B_R2_44014529416_evidence.zip",
             "f7fa7726865600cab92e1270b558dcc856ad0cfc28318f2bb7d95e74b7ab8dbb")
          ]
          for path,digest in artifacts:
              raw=Path(path).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest
              with zipfile.ZipFile(path) as z: assert z.testzip() is None
          print("BFSS_M4_QTC0D_QTC0A_QTC0C_GREEN_QTC0B_BOTH_REDS_AND_SOURCE_CONSUMER_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original Fock thin adapter source, consumer and strict axiom audits
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-qtc0d"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC0DOriginalFockThinTensorAdapter 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4QTC0DOriginalFockThinTensorIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-qtc0d"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-1500:]
              unexpected=[l for l in log.splitlines() if "warning:" in l and not allow_warning.fullmatch(l)]
              assert not unexpected,unexpected[:6]
              entries=pat.findall(log)
              assert len(entries)==len(expected),(entries,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in entries]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for theorem,axioms in entries:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(theorem,axioms)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b"))+"\n"
          audit(fixture,["a","b"])
          mutants=[
              fixture.replace("Quot.sound","sorryAx",1),
              fixture.replace("Quot.sound","Unapproved.axiom",1),
              fixture.replace("'N.b'","'N.a'"),
              "\n".join(fixture.splitlines()[:1])+"\n",
              fixture+"warning: unexpected warning\n",
              fixture+"error: source theorem failed\n"
          ]
          for k,bad in enumerate(mutants):
              try: audit(bad,["a","b"])
              except AssertionError: pass
              else: raise AssertionError(("auditor accepted mutated failure",k))
          print("BFSS_M4_QTC0D_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),["originalFock_quadratic_covariance_tensor","originalFock_quadratic_covariance_skew"])
          audit((root/"consumer.log").read_text(),["originalFock_tensor_covariance_consumer","originalFock_skew_covariance_consumer"])
          print("BFSS_M4_QTC0D_ORIGINAL_FOCK_THIN_2_SOURCE_2_CONSUMER_7_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve full original preflight, cold source, source and consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-qtc0d-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-qtc0d/
          if-no-files-found: warn
          retention-days: 14
