name: SM-D1-SCC1 independent native Lean finite witness separation strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean
      - lean/diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean
      - .github/workflows/sm-d1-scc1-finite-witness-lean-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm-d1-scc1-native-source-consumer-strict
  cancel-in-progress: false
jobs:
  independent-lean-source-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact research commit and original BFSS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify pinned source consumer SM data and 27 BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sm-d1-scc1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sm-d1-scc1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc1/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean":"41b5742fce2b13709677ecb19066b480436f43cf","lean/diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean":"d30bf2d71198fc0faefe221d5851536c1ee6ee8c","research/standard-model/SMD1_SCC1_FINITE_WITNESS_LEAN_MICROGATE_2026_11_18.md":"090ad97da637f8b68d07dd119d3c589ba5b1b80c","lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean":"481a984b5ba7d2d7df41297d162ab1d608646d6e","lean/diagnostics/SMY0OneFamilyAnomalyIndependentConsumer.lean":"082492122e15f5f73a24b086ea1e3c4ae71527df","research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json":"1d391ba994ee23f03c4423b45fbb15e7e42c86f1","research/standard-model/tools/smd1_scc0.py":"95569dffd88af133df3dd56d23e1f61ca8c4a207","research/standard-model/evidence/SMD1_SCC0_R1_44398482716_ORIGINAL_GREEN_evidence.zip":"7972d6c16074807028fc941fe6141638b32cad19","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean":"7d372392703d0fe69942df9df58b421af6850656"}
          for path,expected in pins.items():
              got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
              assert got==expected,(path,got,expected)
          s=Path('lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean').read_text();c=Path('lean/diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean').read_text()
          roots=["agrees_refl","agrees_symm","agrees_trans","separation_not_agreement","disagreement_has_witness","separation_mono","agreement_antitone","finite_separation_mono","singleton_deletion_minimal","distinct_singleton_minimals","uniform_separation_mono","overlap_blocks_uniform","missing_blocks_agreement","defined_separation_not_agreement"];independent=["separation_iff_not_agreement_consumer","monotone_separation_consumer","overlap_counterexample_consumer","missing_is_not_agreement_consumer","color_coefficient_distinguishes_consumer","weak_coefficient_distinguishes_consumer","two_distinct_minimal_witnesses_consumer"]
          assert s.startswith('import Mathlib.Tactic\n')
          assert c.startswith('import OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMD1SCC1FiniteWitnessSeparation\n')
          assert re.findall(r'(?m)^#print axioms (\S+)$',s)==roots
          assert re.findall(r'(?m)^#print axioms (\S+)$',c)==independent
          assert len(re.findall(r'(?m)^theorem\b',s))==14
          assert len(re.findall(r'(?m)^theorem\b',c))==7
          assert len(re.findall(r'(?m)^example\b',c))==2
          for f in (s,c):
              assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',f)
              assert not any(x in f for x in ('set_option maxRecDepth','set_option maxHeartbeats'))
          assert 'NFC_SCC_Branch' not in s+c and 'originalSource48BivectorK' not in s+c
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in sm['upcoming'])
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          lm=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in lm['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          print('SM_D1_SCC1_14_SOURCE_7_CONSUMER_2_EXAMPLES_SM_Y0_SM_D0_SCC0_27_BFSS_ANCHORS_PINNED_PREFLIGHT_PASS')
          
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib d13f23b7 cache
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original source independent consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/sm-d1-scc1"
          timeout 1100s lake build OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMD1SCC1FiniteWitnessSeparation 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sm-d1-scc1'
          src=["agrees_refl","agrees_symm","agrees_trans","separation_not_agreement","disagreement_has_witness","separation_mono","agreement_antitone","finite_separation_mono","singleton_deletion_minimal","distinct_singleton_minimals","uniform_separation_mono","overlap_blocks_uniform","missing_blocks_agreement","defined_separation_not_agreement"]
          con=["separation_iff_not_agreement_consumer","monotone_separation_consumer","overlap_counterexample_consumer","missing_is_not_agreement_consumer","color_coefficient_distinguishes_consumer","weak_coefficient_distinguishes_consumer","two_distinct_minimal_witnesses_consumer"]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          pkgwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(raw,names):
              assert 'sorryAx' not in raw and 'error:' not in raw
              assert not [x for x in raw.splitlines() if 'warning:' in x and not pkgwarn.fullmatch(x)]
              found=pat.findall(raw)
              assert [name.rsplit('.',1)[-1] for name,_ in found]==names,(found,names)
              for _,ax in found:
                  assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed,ax
          seed="'SM.test' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(seed,['test'])
          mutants=[seed.replace('Quot.sound','sorryAx'),seed.replace('Quot.sound','Foreign.axiom'),
                   seed+seed,'',seed+'warning: unexpected\n',seed+'error: unexpected\n']
          for i,mut in enumerate(mutants):
              try:audit(mut,['test'])
              except AssertionError:pass
              else:raise AssertionError(('auditor mutant survived',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'error:' not in cold and 'sorryAx' not in cold
          audit((root/'source-axioms.log').read_text(),src)
          audit((root/'consumer.log').read_text(),con)
          print('SM_D1_SCC1_14_NATIVE_SOURCE_7_INDEPENDENT_CONSUMER_2_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN')
          
          PY
      - name: Preserve exact tested source and independent consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm-d1-scc1-original-native-lean-source-consumer
          path: /home/runner/work/_temp/sm-d1-scc1/
          retention-days: 14
          if-no-files-found: warn
