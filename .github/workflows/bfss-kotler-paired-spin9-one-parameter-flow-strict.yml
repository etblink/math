name: BFSS V9W original Fock-paired one-parameter orthogonal exponential composition strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-one-parameter-flow-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-one-parameter-exponential-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact V9V ancestry and one-parameter composition theorem statements
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LieHomProbe.lean")" = '1b17d6542ebec81f12fd0231e8478f66679efd53'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9MathlibSkewBridgeProbe.lean")" = 'ee038db09af741bdd1af4b811d8daf79bb70ed37'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe.lean")" = '2b350ed73e1f831532d1200f1a0ab148ee53dacf'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalExponentialProbe.lean")" = 'cb27bc0755dc7f64bed51943ae18c24a00cba912'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe.lean")" = 'b471ebb2da441c4be099bed168f6fa3651e24a99'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe.lean")" = 'fe56b8b55ea9e72d50b8991962d8b22def7375d9'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe.lean').read_text()
          names=['pairedMatrixExp_add','pairedMatrixExp_zero','pairedMatrixExp_neg',
                 'coordinateToPairedCanonicalSkewLieHom_exp_add',
                 'normalizedPairedPlane_exp_add']
          for name in names:
            assert s.count('theorem '+name)==1,name
          assert 'Matrix.exp_add_of_commute' in s
          assert '((Commute.refl X).smul_left s).smul_right t' in s
          assert 'Matrix.exp_neg' in s
          assert 'SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V9W_SOURCE_AND_ONE_PARAMETER_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted V9V original paired orthogonal-group ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe

      - name: Fresh V9W one-parameter exponential composition compile with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v9w"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v9w/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v9w/compiler.log")" -eq 5

      - name: Independently elaborate five one-parameter statements and audit axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V9W_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe
          open FCP.BFSSPairedSpin9Plane
          open OAI.BFSSQuantum
          open NormedSpace
          #check pairedMatrixExp_add
          #check pairedMatrixExp_zero
          #check pairedMatrixExp_neg
          #check coordinateToPairedCanonicalSkewLieHom_exp_add
          #check normalizedPairedPlane_exp_add
          example (X : Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)
              (s t : ℝ) :
              exp ((s + t) • X) = exp (s • X) * exp (t • X) :=
            pairedMatrixExp_add X s t
          example (r s : SpaceIndex) (u v : ℝ) :
              exp ((u + v) • normalizedPairedPlane r s) =
                exp (u • normalizedPairedPlane r s) *
                exp (v • normalizedPairedPlane r s) :=
            normalizedPairedPlane_exp_add r s u v
          example (A : skewAdjointMatricesLieSubalgebra
              (1 : Matrix SpaceIndex SpaceIndex ℝ)) (s t : ℝ) :
              exp ((s + t) • ((coordinateToPairedCanonicalSkewLieHom A).val :
                Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)) =
              exp (s • ((coordinateToPairedCanonicalSkewLieHom A).val :
                Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)) *
              exp (t • ((coordinateToPairedCanonicalSkewLieHom A).val :
                Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)) :=
            coordinateToPairedCanonicalSkewLieHom_exp_add A s t
          #print axioms FCP.BFSSPairedSpin9Plane.pairedMatrixExp_add
          #print axioms FCP.BFSSPairedSpin9Plane.pairedMatrixExp_zero
          #print axioms FCP.BFSSPairedSpin9Plane.pairedMatrixExp_neg
          #print axioms FCP.BFSSPairedSpin9Plane.coordinateToPairedCanonicalSkewLieHom_exp_add
          #print axioms FCP.BFSSPairedSpin9Plane.normalizedPairedPlane_exp_add
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V9W_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v9w/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v9w'/'declaration-audit.log').read_text()
          prefix='FCP.BFSSPairedSpin9Plane.'
          expected=[prefix+'pairedMatrixExp_add',
                    prefix+'pairedMatrixExp_zero',
                    prefix+'pairedMatrixExp_neg',
                    prefix+'coordinateToPairedCanonicalSkewLieHom_exp_add',
                    prefix+'normalizedPairedPlane_exp_add']
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==expected,reports
          for _,ax in reports:
            assert set(x.strip() for x in ax.split(',') if x.strip()) <= {
              'propext','Classical.choice','Quot.sound'},ax
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V9W_ONE_PARAMETER_EXPONENTIAL_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v9w-original-paired-one-parameter-exponential-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9w
          if-no-files-found: warn
