name: BFSS TD-C1A D2R1 original-Fock inspector microgate
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - research/top-down-symmetry/TD_C1A_D2R1_INSTRUMENT_MICROGATE_MANIFEST.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-fock-variable-control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic source and pins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Verify preregistered source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_bfss_td_c1a_d2r1_instrument_microgate.py --preflight
          cp .github/workflows/bfss-td-c1a-d2r1-instrument-microgate.yml bfss-td-c1a-d2r1-evidence/executed-workflow.yml
          git hash-object --no-filters .github/workflows/bfss-td-c1a-d2r1-instrument-microgate.yml > bfss-td-c1a-d2r1-evidence/workflow-blob.txt
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Collect bounded original-Fock variable proof report
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 tools/run_bfss_td_c1a_d2r1_instrument_microgate.py --collect
      - name: Preserve exact positive-control and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-td-c1a-d2r1-original-fock-inspector-evidence
          path: bfss-td-c1a-d2r1-evidence/
          retention-days: 30
          if-no-files-found: warn
