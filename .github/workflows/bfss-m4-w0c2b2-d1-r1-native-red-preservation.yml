name: BFSS W0C2B2 D1 R1 source-exact native rfl recursion RED preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-d1-r1-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-d1-r1-original-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable D1 R1 source and 27 accepted anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact R2 source consumer workflow and accepted donor bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2D1NamedSourceDefectBoundary.lean)" = cf4286170608b3141df7ccbd753fc96507d1544a
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSW0C2B2D1NamedSourceDefectBoundaryIndependentConsumer.lean)" = 88a1b567fc2b9dcb550b736fdf289e95a8cbfb49
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-d1-named-source-boundary-strict.yml)" = 5cb43de6fb3ac4cb93c3eebc6a8f7e976f3661e3
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip)" = 5b0cd1c0581ac1a8df5c50093f91e3d12b3fef43
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence.zip)" = 18c87219367977d3d9530e90789c3e8612740849
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R1_44274131658_NATIVE_RED_evidence.zip)" = 12b5843b116bae63e2183049cae572cb1fcc051b
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R2_44280267807_NATIVE_RED_evidence.zip)" = b668e91fa897136c5144ef535cb0fef035e9c216
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert Path('research/quantum-information/diagnostics/BFSS_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence_manifest.json').exists()
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          root=Path('research/quantum-information/diagnostics')
          for name in ('BFSS_M4_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence.zip',
                       'BFSS_W0C2B2_D1_R1_44344524186_complete_job.log',
                       'BFSS_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence_manifest.json'):
              assert not (root/name).exists(),name
          print('BFSS_W0C2B2_D1_R1_SOURCE_EXACT_NATIVE_RECURSION_PRESERVATION_PREFLIGHT_PASS')
          PY
      - name: Independently verify exact RED original provider ZIP and full job transcript
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44344524186;job=134943205409;artifact=14445679625
          tested='a5fc2deb20d173ff8ade0b4dcac1b0305372d7e4'
          size=20106;digest='8d951f5b1fbf4aab243e2e40bbef665bfdd1771864ccf2c274f9c15711f6a138'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return json.load(response)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='failure' and r['run_attempt']==1
          assert j['id']==job and j['run_id']==run and j['conclusion']=='failure'
          for step in ('Checkout exact unified','Guard 27 anchors','Restore pinned Lean'):
              assert any(s['name'].startswith(step) and s['conclusion']=='success' for s in j['steps']),step
          assert any(s['name'].startswith('Cold original Fock additive') and s['conclusion']=='failure' for s in j['steps'])
          assert any(s['name'].startswith('Upload original D0 diagnostic') and s['conclusion']=='success' for s in j['steps'])
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={'preflight.log','tested-commit.txt','cold-source.log'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B2_D1_27_ANCHORS_ALL_NEGATIVE_EVIDENCE_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              for x in ('[9240/9240]','ProbeW0C2B2D1NamedSourceDefectBoundary.lean:44:2:',
                        'maximum recursion depth has been reached',
                        'originalSource48_defect_named_certificateD1','sorryAx','error: build failed'):
                  assert x in cold,x
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>150000
          for x in (b'ProbeW0C2B2D1NamedSourceDefectBoundary.lean:44:2:',
                    b'maximum recursion depth has been reached',
                    b'Artifact ID 14445679625'):
              assert x in full,x
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence.zip'
          log=root/'BFSS_W0C2B2_D1_R1_44344524186_complete_job.log'
          manifest=root/'BFSS_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
            'gate':'P3-M4-W0C2B2-D1','attempt':'R1','status':'ORIGINAL_NATIVE_SOURCE_RECURSION_RED_UNQUALIFIED',
            'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
            'original_zip':{'path':str(arc),'size':size,'sha256':digest,'members':members},
            'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
            'source_blob':'cf4286170608b3141df7ccbd753fc96507d1544a',
            'consumer_blob':'88a1b567fc2b9dcb550b736fdf289e95a8cbfb49',
            'workflow_blob':'5cb43de6fb3ac4cb93c3eebc6a8f7e976f3661e3',
            'failure_phase':'ORIGINAL_D0_SOURCE_LEAN',
            'first_causal_error':'maximum recursion depth at original D1 source line 44:2 checking rfl equality of original defect and named original K(A) operands',
            'secondary_error':'sorryAx in dependent source axioms',
            'source_axiom_reports_clean':2,'source_axiom_reports_with_generated_unaccepted_axiom':2,
            'consumer_executed':False,'D1_R1_previous_D0_timeout_not_native_proof_red':True,
            'D1_R1_native_proof_red_count':1,
            'predecessor_accepted_anchor_count':27,'predecessor_qualified_run':44267283653,
            'B2_canonical_status':'BLOCKED',
            'claim_ceiling':'No D1 original defect certificate qualification, no original all-48 gamma defect centrality, no unconditional K Lie bracket'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B2_D1_R1_ORIGINAL_NATIVE_RECURSION_ZIP_COMPLETE_LOG_MEMBER_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin immutable original D1 R1 native RED ZIP transcript and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B2_D1_R1_44344524186_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS W0C2B2 D1 R1: preserve original native source recursion RED evidence'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
