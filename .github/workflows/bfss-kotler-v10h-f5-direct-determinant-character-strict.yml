name: BFSS V10H F5 source Spin9 explicit direct determinant character strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe.lean
      - .github/workflows/bfss-kotler-v10h-f5-direct-determinant-character-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-direct-determinant:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify accepted source F4 and exact direct F5 character candidate hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f5"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f5/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe.lean")" = '76fa0635c0a4a7c1564d114bfc9442024d31177e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe.lean")" = '60af2103131f6dae30623ea7ce3204cd9ab96299'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe.lean")" = '47e13c108393146c2ebb699237edb1414564d34d'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe.lean').read_text()
          names=["gammaDetDirectHom","gammaDetDirectHom_apply","gammaDetDirectHom_sq","mem_source9OrientationSubgroup_iff_gammaDetDirectHom_one","gammaDetDirectHom_eq_originalPaired48_det"]
          for n in names:
              assert len(re.findall(r'(?m)^(?:theorem|noncomputable def) '+re.escape(n)+r'\b',s)) == 1,n
          assert s.count('#print axioms ') == 5
          assert 'map_one\' := gammaDet_one' in s
          assert "map_mul' := gammaDet_mul" in s
          assert 'source9OrientationSubgroup' in s
          assert 'pairedDetEqualGamma' in s
          # F5's exact pinned source uses nonnested Lean block/doc comments.
          # Negative guards target executable code, not historical comments.
          executable=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in executable, 'unhandled nested source comment'
          assert 'Matrix.detMonoidHom' not in executable
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in executable
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',executable)
          print('V10H_F5_DIRECT_SOURCE_CHARACTER_COMMENT_AWARE_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted source F4 orientation normal subgroup ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe

      - name: Fresh F5 direct character source compile warningAsError
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f5/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f5/compiler.log")" -eq 5

      - name: Independently elaborate exact five direct character declarations and check axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F5_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example :
              spinGroup source9Quadratic →* ℝ :=
            gammaDetDirectHom
          noncomputable example (g : spinGroup source9Quadratic) :
              gammaDetDirectHom g =
                (((source9SpinGammaOrthogonalHom g) : GammaMatrix).det) :=
            gammaDetDirectHom_apply g
          noncomputable example (g : spinGroup source9Quadratic) :
              (gammaDetDirectHom g) ^ 2 = 1 :=
            gammaDetDirectHom_sq g
          noncomputable example (g : spinGroup source9Quadratic) :
              g ∈ source9OrientationSubgroup ↔ gammaDetDirectHom g = 1 :=
            mem_source9OrientationSubgroup_iff_gammaDetDirectHom_one g
          noncomputable example (g : spinGroup source9Quadratic) :
              gammaDetDirectHom g =
                (((source9SpinOriginalPaired48OrthogonalHom g) :
                  Matrix Source48Label Source48Label ℝ)).det :=
            gammaDetDirectHom_eq_originalPaired48_det g
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_apply
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_sq
          #print axioms FCP.BFSSPairedSpin9DetFixture.mem_source9OrientationSubgroup_iff_gammaDetDirectHom_one
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_eq_originalPaired48_det
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F5_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f5/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f5'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["gammaDetDirectHom","gammaDetDirectHom_apply","gammaDetDirectHom_sq","mem_source9OrientationSubgroup_iff_gammaDetDirectHom_one","gammaDetDirectHom_eq_originalPaired48_det"]}
          assert len(reports)==5 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F5_DIRECT_DETERMINANT_CHARACTER_5_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f5-source-direct-det-character-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f5
          if-no-files-found: warn
