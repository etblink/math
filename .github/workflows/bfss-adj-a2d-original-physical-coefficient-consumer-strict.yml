name: BFSS ADJ-A2d original physical coefficient consumer strict

'on':
  push:
    branches:
      - research/bfss-hopfion-gut-counterfactuals-20261121
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSAdjointA2dPhysicalCoefficientQuantizerConsumer.lean
      - .github/workflows/bfss-adj-a2d-original-physical-coefficient-consumer-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-adj-a2d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-physical-coefficient-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Frozen original source and isolated-root preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-adj-a2d"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-adj-a2d/tested-sha.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-adj-a2d/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-adj-a2d/preflight.log"
          from pathlib import Path
          import subprocess,json,re
          base="lean/OAI/MathematicalPhysics/BFSS/"
          src=Path(base+"Contrib/Kotler/BFSSAdjointA2dPhysicalCoefficientQuantizerConsumer.lean")
          pins={
            base+"Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            base+"FermionFrequency.lean":"cbb82a42f42b3b3d3695081247bd14d0496abc7d",
            base+"FermionQuantization.lean":"c6b72d030225c707ef54f5285a18a7a8175ee280",
            base+"FrequencyContraction.lean":"425edf6d7d0f9d15ce5f8bc92e8788ef60068618",
            base+"Contrib/Kotler/BFSSAdjointA0AbstractPairSumStarSkew.lean":"373e9929a9d2aa5a6d9bb3e1b01c4748d44fcea0",
            base+"Contrib/Kotler/BFSSAdjointA1OriginalThetaPairRealScalarStar.lean":"0441b0d067dcd9e1d1e721b3c576a6e8a0600a53",
            base+"Contrib/Kotler/BFSSAdjointA2aOriginalSkewMatrixEntryThetaPair.lean":"dc7b35d295af72109f600da06098ae752971e60f",
            base+"Contrib/Kotler/BFSSAdjointA2bOriginalFrequencyDoubleSumSkew.lean":"a179985c31b6d8f0cd4092530c761155b320dc1c",
            base+"Contrib/Kotler/BFSSAdjointA2cOriginalFrequencyQuantizerSelfAdjoint.lean":"94893b6b4f623dfd92122947a4054c4b1a63a5ad",
            base+"Contrib/Kotler/D1S3OriginalFermionCoefficientSkewProbe.lean":"f35d70284bec100dc617935cf41a6c933c618e5b",
            base+"Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean":"152204ef15a6569534e0503824a697cb9ae8e4ce",
          }
          for path,expected in pins.items():
              observed=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert observed==expected,("SOURCE_DRIFT",path,observed,expected)
          s=src.read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSAdjointA2cOriginalFrequencyQuantizerSelfAdjoint",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.D1S3OriginalFermionCoefficientSkewProbe"]
          expected_roots=[
            "originalFermionCoefficient_quantize_isSelfAdjoint",
            "pairedOriginalFermionCoefficient_quantize_isSelfAdjoint"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==expected_roots
          for root in expected_roots:
              assert s.count("theorem "+root)==1,(root,"DECLARATION_COUNT")
          assert "set_option autoImplicit false" in s
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",s)
          for forbidden in ["set_option linter.","set_option maxRecDepth",
                            "set_option maxHeartbeats",
                            "D1S4OriginalPhysicalQuantizationSelfAdjointProbe",
                            "D1S1", "D1T0", "D1T1", "D1R0"]:
              assert forbidden not in s,("SCOPE_VIOLATION",forbidden)
          assert all(term in s for term in [
              "FCP.BFSSAdjointA2c.originalSkewFrequencyMatrix_quantize_isSelfAdjoint",
              "FCP.BFSSHopfD1S3.originalFermionCoefficient_skew",
              "FCP.BFSSHopfD1S3.pairedOriginalFermionCoefficient_skew",
              "FCP.BFSSSU2GaugeG1A.pairedAlgebraData",
              "M.quantizeFrequency (M.fermionCoefficient x)",
              "IsSelfAdjoint"])
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_ADJ_A2D_SOURCE_PIN_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-adj-a2d/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold original-source physical coefficient consumer and strict two-root original consumer axiom check
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-adj-a2d"
          timeout 2500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSAdjointA2dPhysicalCoefficientQuantizerConsumer 2>&1 | tee "$E/native-source.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSAdjointA2dPhysicalCoefficientQuantizerConsumer.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-adj-a2d"
          for name in ["native-source.log","strict-axioms.log"]:
              body=(d/name).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in body,(name,bad,body[-6000:])
          body=(d/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          expected=[
              "FCP.BFSSAdjointA2d.originalFermionCoefficient_quantize_isSelfAdjoint",
              "FCP.BFSSAdjointA2d.pairedOriginalFermionCoefficient_quantize_isSelfAdjoint"]
          assert [n for n,_ in reports]==expected,(reports,expected)
          allowed={"propext","Classical.choice","Quot.sound"}
          for n,listed in reports:
              axioms={a.strip() for a in listed.split(",") if a.strip()}
              assert axioms<=allowed,(n,axioms)
          print("BFSS_ADJ_A2D_ORIGINAL_CONSUMER_STRICT_GREEN")
          PY

      - name: Preserve first-causal native and strict evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-adj-a2d-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-adj-a2d/
          if-no-files-found: warn
          retention-days: 30
