name: BFSS V10H F10BE named PBW topology and original gamma continuity strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean
      - lean/diagnostics/FCP_K1D18V10HF10BEIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10be-pbw-topology-gamma-continuity-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pbw-topology-original-gamma-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin exact diagnostics ancestry and F10BE declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10be"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10be/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe.lean")" = '42da9e4d7cc74a6137defe7f68e457275be21b31'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean")" = '63d117da8cb2ad337cfb372946332cb42bdf5390'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HD2CliffordTopologyBridgeDiagnostic.lean)" = '2adc47f7faac87c35f3c76a95171eb21b6e5c0ff'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean")" = '7798089cb8ac4ec4fffc3ead4caa474def81b3f8'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HD3GammaContinuityDiagnostic.lean)" = 'a40a345d01ac3051f5b6ec148b7433a6c7a75b12'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean)" = 'a39fe3c332c89e9f405f55ff3f20c58b5b2600fd'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BEIndependentAudit.lean)" = 'dc765801abaf11df1cd08118b91ce37fe2e19337'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BEIndependentAudit.lean').read_text()
          names=["source9PBWCoordinates","source9PBWNormedAddCommGroup","source9PBWNormedSpace","source9Clifford_t2Space_pbw","source9Spin_t2Space_pbw","source9GammaCliffordAlgHom_continuous_pbw","source9SpinGammaSpecialOrthogonalHom_continuous_pbw"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'(?m)^instance\b|attribute\s+\[instance\]',code)
          for token in ['source9CliffordPBWBasis.repr.trans','Finsupp.linearEquivFunOnFinite',
                        'NormedAddCommGroup.induced','NormedSpace.induced',
                        'T2Space (spinGroup source9Quadratic)',
                        'Continuous source9GammaCliffordAlgHom',
                        'Continuous source9SpinGammaSpecialOrthogonalHom',
                        'source9SpinGammaSpecialOrthogonalHom_apply']:
              assert token in s,token
          assert 'auditPBWCoordinates' in audit
          assert 'source9PBWCoordinates = auditPBWCoordinates := rfl' in audit
          print('V10H_F10BE_SOURCE_PIN_SCOPE_AND_DECLARATION_INVENTORY_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10X and F10BC ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom

      - name: Fresh accepted F10Y PBW source compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10be/f10y-compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Fresh F10BE named PBW topology and continuity warnings-as-errors compile
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10be/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently reconstruct exact topology and audit all declaration axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BEIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10be/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BEIndependentAudit.lean "$RUNNER_TEMP/v10h-f10be/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean "$RUNNER_TEMP/v10h-f10be/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9PBWCoordinates","source9PBWNormedAddCommGroup","source9PBWNormedSpace","source9Clifford_t2Space_pbw","source9Spin_t2Space_pbw","source9GammaCliffordAlgHom_continuous_pbw","source9SpinGammaSpecialOrthogonalHom_continuous_pbw"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10be'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BE_EXACT_PBW_TOPOLOGY_CONTINUITY_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BE audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10be-pbw-topology-gamma-continuity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10be
          if-no-files-found: warn
