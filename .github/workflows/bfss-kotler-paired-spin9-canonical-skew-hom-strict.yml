name: BFSS V9T canonical Mathlib skew-adjoint LieHom type transport strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-canonical-skew-hom-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-source-paired-skew-liehom:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact qualified ancestry and canonical-type experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LieHomProbe.lean")" = '1b17d6542ebec81f12fd0231e8478f66679efd53'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9MathlibSkewBridgeProbe.lean")" = 'ee038db09af741bdd1af4b811d8daf79bb70ed37'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe.lean")" = '2b350ed73e1f831532d1200f1a0ab148ee53dacf'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe.lean').read_text()
          assert s.count('noncomputable def coordinateToPairedCanonicalSkewLieHom :')==1
          assert s.count('theorem coordinateToPairedCanonicalSkewLieHom_map_lie')==1
          assert 'coordinateSkewLieSubalgebra_eq_mathlib' in s
          assert 'pairedSkewLieSubalgebra_eq_mathlib' in s
          assert 'exact coordinateToPairedSkewLieHom' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V9T_PINNED_SOURCE_AND_STATEMENT_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted V9S exact canonical skew Lie algebra ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9MathlibSkewBridgeProbe

      - name: Fresh V9T canonical LieHom compile with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v9t"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v9t/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v9t/compiler.log")" -eq 2

      - name: Independently elaborate canonical LieHom and audit its axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V9T_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9CanonicalSkewLieHomProbe
          open FCP.BFSSPairedSpin9Plane
          open OAI.BFSSQuantum
          #check coordinateToPairedCanonicalSkewLieHom
          #check coordinateToPairedCanonicalSkewLieHom_map_lie
          example (A B : skewAdjointMatricesLieSubalgebra
              (1 : Matrix SpaceIndex SpaceIndex ℝ)) :
              coordinateToPairedCanonicalSkewLieHom ⁅A, B⁆ =
                ⁅coordinateToPairedCanonicalSkewLieHom A,
                  coordinateToPairedCanonicalSkewLieHom B⁆ :=
            coordinateToPairedCanonicalSkewLieHom_map_lie A B
          #print axioms FCP.BFSSPairedSpin9Plane.coordinateToPairedCanonicalSkewLieHom
          #print axioms FCP.BFSSPairedSpin9Plane.coordinateToPairedCanonicalSkewLieHom_map_lie
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V9T_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v9t/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v9t'/'declaration-audit.log').read_text()
          prefix='FCP.BFSSPairedSpin9Plane.'
          expected=[prefix+'coordinateToPairedCanonicalSkewLieHom',
                    prefix+'coordinateToPairedCanonicalSkewLieHom_map_lie']
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==expected,reports
          for _,ax in reports:
            assert set(x.strip() for x in ax.split(',') if x.strip()) <= {
              'propext','Classical.choice','Quot.sound'},ax
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V9T_CANONICAL_SKEW_LIEHOM_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v9t-original-mathlib-canonical-skew-liehom-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9t
          if-no-files-found: warn
