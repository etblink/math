name: BFSS W0C2B0 R2 second native RED preservation and stop-rule evidence
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0-r2-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-w0c2b0-r2-second-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact failed R2 and accepted original sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify failed original R1/R2 pins and immutable qualified W0C2A
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0OriginalRealFockCoefficientContractionR2.lean)" = 0a75a24387c2a50f14ed5698575cf2c670a864c1
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0OriginalRealFockCoefficientIndependentConsumerR2.lean)" = cc03e80af0573315f07a5d079c177a8ad279c559
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0-r2-original-real-coefficient-strict.yml)" = 0d68b23bc98aef28870d050397e02d02af26e6bb
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0OriginalRealFockCoefficientContraction.lean)" = 4846915b6d6f99e765a1ec28f9286295d7db2571
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip)" = 4117bd19a0a8d1614df176e72d69a9b628de19da
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B0_R1_44218523669_complete_job.log)" = 6736a0b404bc31eaa4b7bae58ff78d0bd0b232f7
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C2B0_R1_44218523669_NATIVE_RED_evidence_manifest.json)" = ba36b8a4862ca4d0931d9dac86761a893a3e48ac
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip)" = cb5591ab7ae5762150ea1d10dc093788f812d929
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2B0","R2","PENDING_STRICT_CI",False)
          assert (q["gate"],q["attempt"],q["run_id"],q["status"],q["qualification"])==("P3-M4-W0C2A","R1",44213315719,"GREEN_QUALIFIED",True)
          assert s["accepted_anchors"][-1]==q
          assert a["previous_red_run"]==44218523669 and a["previous_red_preservation_run"]==44221612711
          assert s["previous_active_W0C2B0_R1_RED"]["native_red_count"]==1
          assert s["next_planned"]["gate"]=="P3-M4-W0C2B1" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert s["strategic_focus"]["full_bivector_bracket_qualified"] is False
          for p in ["research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip",
                    "research/quantum-information/diagnostics/BFSS_W0C2B0_R2_44222678258_complete_job.log",
                    "research/quantum-information/diagnostics/BFSS_W0C2B0_R2_44222678258_NATIVE_RED_evidence_manifest.json"]:
              assert not Path(p).exists(),p
          print("BFSS_W0C2B0_R2_SECOND_NATIVE_RED_STOP_RULE_ARCHIVER_PREFLIGHT_PASS")
          PY
      - name: Re-download provider-original R2 RED ZIP, full log, CRC, all SHA checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          repo="https://api.github.com/repos/etblink/math"
          run=44222678258;job=134528155435;artifact=14391499234
          tested="105086fe87d17f79f75641878a6b9218db05167d"
          size=20434
          digest="9f7c56be541406843d1b5556c687f0500a4bb8112fc65867559f16fc70fff266"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          r=getjson(f"{repo}/actions/runs/{run}")
          j=getjson(f"{repo}/actions/jobs/{job}")
          a=getjson(f"{repo}/actions/artifacts/{artifact}")
          assert r["head_sha"]==tested and r["status"]=="completed" and r["conclusion"]=="failure" and r["run_attempt"]==1
          assert j["id"]==job and j["run_id"]==run and j["conclusion"]=="failure"
          assert any(x["name"].startswith("Preflight accepted W0C2A") and x["conclusion"]=="success" for x in j["steps"])
          assert any(x["name"].startswith("Restore pinned Lean 4.34.1") and x["conclusion"]=="success" for x in j["steps"])
          assert any(x["name"].startswith("Cold original real coefficient") and x["conclusion"]=="failure" for x in j["steps"])
          assert a["id"]==artifact and a["size_in_bytes"]==size and a["digest"]=="sha256:"+digest
          assert a["workflow_run"]["id"]==run and a["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with r:return r.read()
          raw=download(f"{repo}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"preflight.log","cold-source.log","tested-commit.txt"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0C2B0_R2_ACCEPTED_W0C2A_REAL_SCALAR_BRIDGE_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              for phrase in [
                  "P3M4W0C2B0OriginalRealFockCoefficientContractionR2.lean:56:",
                  "P3M4W0C2B0OriginalRealFockCoefficientContractionR2.lean:58:",
                  "P3M4W0C2B0OriginalRealFockCoefficientContractionR2.lean:74:",
                  "maximum recursion depth has been reached",
                  "sorryAx","error: build failed"
              ]:assert phrase in cold,phrase
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          full=download(f"{repo}/actions/jobs/{job}/logs")
          assert len(full)>200000 and b"maximum recursion depth has been reached" in full
          assert b"Artifact ID 14391499234" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          arc=root/"BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip"
          log=root/"BFSS_W0C2B0_R2_44222678258_complete_job.log"
          manifest=root/"BFSS_W0C2B0_R2_44222678258_NATIVE_RED_evidence_manifest.json"
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
              "gate":"P3-M4-W0C2B0","attempt":"R2","status":"NATIVE_SOURCE_RED_UNQUALIFIED",
              "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
              "original_zip":{"path":str(arc),"size":size,"sha256":digest,"members":members},
              "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
              "source_blob":"0a75a24387c2a50f14ed5698575cf2c670a864c1",
              "consumer_blob":"cc03e80af0573315f07a5d079c177a8ad279c559",
              "workflow_blob":"0d68b23bc98aef28870d050397e02d02af26e6bb",
              "failure_lines":[56,58,74,144],
              "failure_phase":"ORIGINAL_SOURCE_REAL_SUM_SUB_TRANSPORT_PLUS_SOURCE48_ELABORATION",
              "consumer_executed":False,"source_axiom_report_contains_sorryAx":True,
              "native_mathematical_red_count":2,
              "stop_rule":"STOP_CURRENT_COEFFICIENT_LAYOUT_AFTER_TWO_ANALOGOUS_NATIVE_REDS",
              "prior_native_R1_run":44218523669,"prior_R1_preservation_run":44221612711,
              "summary":"Typed source real->complex sum/sub helper rewrites do not match elaborated coercions; downstream Source48 specialization exceeds recursion; stop and separate finite-index bridge, no R3",
              "accepted_predecessor_run":44213315719,
              "claim_ceiling":"No unconditional original K Lie bracket, physical Spin9 or BFSS mass gap"
          },indent=2,sort_keys=True)+"\n")
          print("BFSS_W0C2B0_R2_PROVIDER_ORIGINAL_SECOND_NATIVE_RED_ZIP_FULL_JOB_LOG_SHA_CRC_STOP_PASS")
          PY
      - name: Git-pin original R2 RED ZIP, complete Actions log and SHA/CRC manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0_R2_44222678258_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0_R2_44222678258_NATIVE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C2B0 R2: preserve second native RED and two-attempt stop evidence"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
