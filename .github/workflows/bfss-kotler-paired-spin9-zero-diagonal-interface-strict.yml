name: BFSS V8H source paired Spin9 zero-diagonal interface strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-zero-diagonal-interface-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-zero-diagonal:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact original paired and gamma pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2PairedThetaLabelCrosswalkProbe.lean")" = 'f3a2b41f902a20f6fe237ecce18dd7e869e9c45e'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9PlaneGeneratorProbe.lean")" = '02b8e54464b0aea151c96cefd316a86270cf8871'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9AdjacentLieBracketProbe.lean")" = '2186cce50ad2f06c125b7281cbe10f319d975a81'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrientationSwapProbe.lean")" = '58cd7bbd6d1314dc684309b0fe4724688d00e59f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe.lean")" = '8aa93c41a83164e3a99eca139de477d82842d589'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe.lean').read_text()
          assert s.count('theorem zeroDiagonalPairedPlane_self')==1
          assert s.count('theorem zeroDiagonalPairedPlane_of_ne')==1
          assert s.count('theorem zeroDiagonalPairedPlane_swap')==1
          assert 'originalPairedPlane r s' in s
          assert 'originalPairedPlane_swap_order' in s
          assert 'zeroDiagonalPairedPlane r s = originalPairedPlane r s' in s
          assert 'zeroDiagonalPairedPlane s r = -(zeroDiagonalPairedPlane r s)' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V8H_EXACT_SOURCE_PIN_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted original V8D orientation ancestor
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9OrientationSwapProbe

      - name: Fresh compile exact V8H source with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v8h"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v8h/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v8h/compiler.log")" -eq 3

      - name: Fresh independent Lean theorem specialization and axiom gate
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V8H_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe
          open OAI.BFSSQuantum
          open FCP.BFSSS1V0
          example (r : SpaceIndex) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r r = 0 :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_self r
          example (r s : SpaceIndex) (hrs : r ≠ s) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s =
                FCP.BFSSPairedSpin9Plane.originalPairedPlane r s :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_of_ne r s hrs
          example (r s : SpaceIndex) :
              FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane s r =
                -(FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane r s) :=
            FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_swap r s
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_self
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_of_ne
          #check FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_swap
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_self
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_of_ne
          #print axioms FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_swap
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V8H_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v8h/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v8h'/'declaration-audit.log').read_text()
          roots=[
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_self',
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_of_ne',
            'FCP.BFSSPairedSpin9Plane.zeroDiagonalPairedPlane_swap',
          ]
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==roots,reports
          for name,ax in reports:
              assert set(x.strip() for x in ax.split(',') if x.strip()) <= {
                'propext','Classical.choice','Quot.sound'},(name,ax)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V8H_EXACT_THREE_ORIGINAL_PAIRED_ZERO_DIAGONAL_ROOTS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v8h-original-paired-zero-diagonal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v8h
          if-no-files-found: warn
