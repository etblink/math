name: BFSS original K1D3 scalar common-kernel strict qualification
on:
  push:
    branches:
      - research/fcp-k1d3-scalar-kernel-20261027
    paths:
      - .github/workflows/bfss-kotler-k1d3-scalar-kernel-owner-strict.yml
      - contributions/bfss-kotler/tools/qualify_fcp_k1d3.py
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D3OriginalExteriorScalarCommonCoordinateKernel.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D4OriginalSpin48ExteriorScalarKernel.lean
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-scalar-common-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify candidate source blobs and exact verifier identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d3.py)" = '281a07aeb0a4137a9106930da18f4c6f4cd84035'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D3OriginalExteriorScalarCommonCoordinateKernel.lean)" = '04c477227d2a535e01abe0e01ea1ae57ff116321'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D4OriginalSpin48ExteriorScalarKernel.lean)" = '271865855ec72fc428fe29aa005392273fad165f'
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Independently requalify original 22-module closure and 47 axiom roots
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_sync.py --group ancestry --mode lake --log-dir "$RUNNER_TEMP/bfss-k1d3-ancestry-evidence"
      - name: Fresh K1D3 and K1D4 compilation with strict two-root axiom audit
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d3.py --log-dir "$RUNNER_TEMP/bfss-k1d3-new-evidence"
      - name: Emit verifier and source compiler evidence
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/bfss-k1d3-ancestry-evidence" "$RUNNER_TEMP/bfss-k1d3-new-evidence" <<'PY'
          import pathlib, sys
          for arg in sys.argv[1:]:
              root = pathlib.Path(arg)
              for path in sorted(root.glob('*.log')):
                  print('COMPILER_EVIDENCE_FILE', root.name, path.name)
                  print(path.read_text())
              for path in sorted(root.glob('results.json')):
                  print('VERIFIER_RESULTS_FILE', root.name, path.read_text())
          PY
      - name: Preserve qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d3-scalar-kernel-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-k1d3-ancestry-evidence
            ${{ runner.temp }}/bfss-k1d3-new-evidence
          if-no-files-found: warn
