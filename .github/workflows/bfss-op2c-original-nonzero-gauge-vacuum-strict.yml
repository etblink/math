name: BFSS OP2c original nonzero SU2 gauge vacuum strict gate

on:
  push:
    branches: [research/bfss-original-gamma-faithfulness-20261107]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum.lean
      - lean/diagnostics/BFSSOP2cNonzeroOriginalGaugeVacuumIndependentAudit.lean
      - .github/workflows/bfss-op2c-original-nonzero-gauge-vacuum-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-op2c-gauge-vacuum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-nonzero-vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact original-source candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check exact OP2c import boundary and toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bfss-op2c"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum.lean lean/diagnostics/BFSSOP2cNonzeroOriginalGaugeVacuumIndependentAudit.lean | tee "$evidence/input-sha256.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path("lean/lean-toolchain").read_text().strip() == "leanprover/lean4:v4.34.1"
          packages = json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p for p in packages if p["name"] == "mathlib")["rev"] == "d13f23b723b8a846827a245b89c10fc7d3f11612"
          source = Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum.lean").read_text()
          consumer = Path("lean/diagnostics/BFSSOP2cNonzeroOriginalGaugeVacuumIndependentAudit.lean").read_text()
          assert [s for s in source.splitlines() if s.startswith("import ")] == [
              "import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP2bOriginalGaugeProjectionBridge"
          ]
          assert [s for s in consumer.splitlines() if s.startswith("import ")] == [
              "import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP2cNonzeroOriginalGaugeVacuum"
          ]
          print("OP2c exact original-source import and toolchain preflight: PASS")
          PY

      - name: Restore pinned Lean/Mathlib environment
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get

      - name: Compile exact OP2c source, consumer and axioms
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          evidence="$RUNNER_TEMP/bfss-op2c"
          cd lean
          lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP2cNonzeroOriginalGaugeVacuum 2>&1 | tee "$evidence/source-build.log"
          lake env lean OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum.lean 2>&1 | tee "$evidence/source-axioms.log"
          lake env lean diagnostics/BFSSOP2cNonzeroOriginalGaugeVacuumIndependentAudit.lean 2>&1 | tee "$evidence/consumer.log"
          if grep -E '^(OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum[.]lean|diagnostics/BFSSOP2cNonzeroOriginalGaugeVacuumIndependentAudit[.]lean):[0-9]+:[0-9]+: warning:' "$evidence/source-axioms.log" "$evidence/consumer.log"; then
            echo "STOP: OP2c source/consumer warning" >&2
            exit 1
          fi
          if grep -E 'sorryAx|Lean[.]ofReduceBool' "$evidence/source-axioms.log" "$evidence/consumer.log"; then
            echo "STOP: unexpected OP2c proof axiom" >&2
            exit 1
          fi
          echo "OP2c original nonzero fixed vacuum and projection, consumer, axioms: PASS"

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-op2c-vacuum-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-op2c/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
