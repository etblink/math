name: BFSS ADJ-A0 abstract finite pair-sum star microgate strict

'on':
  push:
    branches:
      - research/bfss-hopfion-gut-counterfactuals-20261121
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSAdjointA0AbstractPairSumStarSkew.lean
      - .github/workflows/bfss-adj-a0-abstract-pairsum-star-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-adj-a0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abstract-pairsum-star:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Microgate contract and exact Mathlib pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-adj-a0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-adj-a0/tested-sha.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-adj-a0/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-adj-a0/preflight.log"
          from pathlib import Path
          import json,re
          path=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSAdjointA0AbstractPairSumStarSkew.lean")
          s=path.read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==["Mathlib.Algebra.Star.BigOperators"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==["finitePairSum_star_skew"]
          assert s.count("theorem finitePairSum_star_skew")==1
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",s)
          assert "set_option autoImplicit false" in s
          for banned in ["maxRecDepth","maxHeartbeats","set_option linter.",
                         "D1S4OriginalPhysicalQuantizationSelfAdjointProbe",
                         "Fermion N","fermionCoefficient","quantizeFrequency"]:
              assert banned not in s,("UNEXPECTED_SCOPE_EXPANSION",banned)
          assert all(term in s for term in
                     ["Finset.sum_congr","star_sum","Finset.sum_comm","Finset.sum_neg_distrib"])
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in packages if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_ADJ_A0_ABSTRACT_PREFLIGHT_PASS")
          PY

      - name: Restore exact pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-adj-a0/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Narrow native build and strict singleton-axiom check
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-adj-a0"
          timeout 600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSAdjointA0AbstractPairSumStarSkew 2>&1 | tee "$E/native-build.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSAdjointA0AbstractPairSumStarSkew.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-adj-a0"
          for name in ["native-build.log","strict-axioms.log"]:
              body=(d/name).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in body,(name,bad,body[-5000:])
          body=(d/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          assert len(reports)==1 and reports[0][0]=="FCP.BFSSAdjointA0.finitePairSum_star_skew",reports
          axioms={a.strip() for a in reports[0][1].split(",") if a.strip()}
          assert axioms<={"propext","Classical.choice","Quot.sound"},axioms
          print("BFSS_ADJ_A0_ABSTRACT_STRICT_GREEN")
          PY

      - name: Preserve original source compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-adj-a0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-adj-a0/
          if-no-files-found: warn
          retention-days: 30
