name: BFSS actual Source48 all-vector Fock Clifford square strict qualification
on:
  push:
    branches:
      - integration/community-20261027-bfss
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48AllVectorFockCliffordSquareProbe.lean
      - .github/workflows/bfss-kotler-source48-all-vector-clifford-square-strict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source48-allvector-square:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = '9882359ced78b0a3bd7e2f057974bd0a031b3e60'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52L9E5A2FiniteComplexWeightedFockCliffordSquareProbe.lean)" = '2a8a5d5107dd866b01bf27d619b08b4b169917ac'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52L9E5B0OriginalFockRealComplexOperatorScalarBridgeProbe.lean)" = 'a02f767ebf1f569302e27676b8d426850db37af1'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48RealLinearGammaProbe.lean)" = 'a9f446ea7986ca796c2f4b222a5ab710d98590cc'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48QuadraticUnitAxesProbe.lean)" = 'de7cf67d2945718a1da98d05a14e1b0d7edcff4a'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48AllVectorFockCliffordSquareProbe.lean)" = '08fc227a08b4c15390d6f9a7cdbeec07c3ad570c'
      - name: Prepare pinned Lean environment
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
      - name: Build four strict-qualified Source48 and original Fock algebra parents
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSSource48RealLinearGammaProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSSource48QuadraticUnitAxesProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V52L9E5A2FiniteComplexWeightedFockCliffordSquareProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V52L9E5B0OriginalFockRealComplexOperatorScalarBridgeProbe
      - name: Compile exact Source48 all-vector quadratic square identity
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48AllVectorFockCliffordSquareProbe
          mkdir -p .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          timeout 750s lake env lean -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee /tmp/source48-allvector-square-strict.log
          test -s ".lake/build/lib/lean/${target}.olean"
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/source48-allvector-square-strict.log').read_text()
          source = pathlib.Path('OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48AllVectorFockCliffordSquareProbe.lean').read_text()
          requested = re.findall(r'^#print axioms (\S+)', source, re.M)
          actual = re.findall(r"(?ms)^'([^'\n]+)' depends on axioms: \[([^]]*)\]", log)
          warnings = re.findall(r'(?m)^[^\n]*\.lean:\d+:\d+: warning:', log)
          assert 'error:' not in log and 'sorryAx' not in log and not warnings, (warnings, log[-4000:])
          expected = ['sourceGammaRealLinear_sq']
          assert requested == expected and len(actual) == len(expected), (requested, actual)
          for (declaration, dependencies), name in zip(actual, expected):
              assert declaration == 'FCP.BFSSSource48AllVectorFockCliffordSquare.' + name, (declaration, name)
              used = {part.strip() for part in dependencies.split(',') if part.strip()}
              assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, (declaration, used)
          print('KOTLER_BFSS_SOURCE48_ALLVECTOR_QUADRATIC_SQUARE_ONE_ROOT_STRICT_PASS')
          PY
