name: BFSS V10H F3 source Spin9 squares original paired48 SO strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe.lean
      - .github/workflows/bfss-kotler-v10h-f3-source-square-orientation-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-square-so:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify accepted F2 exact source and new source-square proof hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f3"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f3/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HTypedDeterminantFixture.lean")" = '87b5e9ef8a241c6f16e488e4355d3aca12ff519a'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe.lean")" = '612d68edfdddedadfa80b780c1e4768bd7bc0ecd'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe.lean")" = '76fa0635c0a4a7c1564d114bfc9442024d31177e'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe.lean').read_text()
          names=["gammaDet_mul","gammaDet_square_one","originalPaired48_mem_SO_of_square"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s)) == 1,n
          assert s.count('#print axioms ') == 3
          assert 'map_mul source9SpinGammaOrthogonalHom' in s
          assert 'gammaDetSquareOne' in s and 'pairedSO_iff_gammaDetOne' in s
          assert 'source9SpinGammaDetHom_apply' not in s
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('V10H_F3_GENUINE_SPIN9_SQUARE_ORIENTATION_SOURCE_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F2 source exact original paired48 orientation boundary
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe

      - name: Fresh F3 source Spin9 square gamma and paired48 orientation compile warningAsError
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f3/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f3/compiler.log")" -eq 3

      - name: Independently elaborate F3 exact three types and audit root axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F3_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (g h : spinGroup source9Quadratic) :
              (((source9SpinGammaOrthogonalHom (g * h)) : GammaMatrix).det) =
                (((source9SpinGammaOrthogonalHom g) : GammaMatrix).det) *
                (((source9SpinGammaOrthogonalHom h) : GammaMatrix).det) :=
            gammaDet_mul g h
          noncomputable example (g : spinGroup source9Quadratic) :
              (((source9SpinGammaOrthogonalHom (g * g)) : GammaMatrix).det) = 1 :=
            gammaDet_square_one g
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48OrthogonalHom (g * g)) :
                Matrix Source48Label Source48Label ℝ) ∈
                Matrix.specialOrthogonalGroup Source48Label ℝ :=
            originalPaired48_mem_SO_of_square g
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDet_mul
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDet_square_one
          #print axioms FCP.BFSSPairedSpin9DetFixture.originalPaired48_mem_SO_of_square
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F3_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f3/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f3'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["gammaDet_mul","gammaDet_square_one","originalPaired48_mem_SO_of_square"]}
          assert len(reports)==3 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F3_SOURCE_SQUARE_ORIENTATION_3_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler, and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f3-original-spin9-squares-so-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f3
          if-no-files-found: warn
