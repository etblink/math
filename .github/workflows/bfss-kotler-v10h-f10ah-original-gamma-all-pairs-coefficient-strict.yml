name: BFSS V10H F10AH original gamma all-36 coefficient extraction strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AHOriginalGammaAllOrderedPairCoefficientExtractionProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10ah-original-gamma-all-pairs-coefficient-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-all-pairs-coefficient-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original gamma F10E F10AG and F10AH sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10ah"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10ah/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AGOriginalGammaOrderedPairGramProbe.lean")" = 'ac69fc77e5a5b68c8ac06abf8f978a8be8b69a1b'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AHOriginalGammaAllOrderedPairCoefficientExtractionProbe.lean")" = 'e7299c0be70800bfe5c939d98c595a6bf0488b6a'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AHOriginalGammaAllOrderedPairCoefficientExtractionProbe.lean').read_text()
          names=['source9OriginalGamma_ordered_pair_subtype_trace_gram',
                 'source9OriginalGamma_all_ordered_pairs_trace_extract',
                 'source9OriginalGamma_all_ordered_pairs_coeff_function_zero']
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
          assert s.count('#print axioms ') == 3
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for term in ['Source9OrderedGammaPairIndex',
                       'source9OrderedGammaPairMatrix',
                       'source9OriginalGamma_ordered_distinct_pair_trace_zero',
                       'source9OriginalGamma_pair_square_trace_neg_sixteen',
                       'Matrix.mul_sum','Matrix.trace_sum',
                       'Finset.sum_congr','mul_eq_zero.mp']:
              assert term in code,term
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10AH_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10AG original gamma full pair Gram ancestry
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3750s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AGOriginalGammaOrderedPairGramProbe

      - name: Fresh F10AH source all-36 gamma coefficient warning-as-error compiler
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AHOriginalGammaAllOrderedPairCoefficientExtractionProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10ah/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate three all-36 gamma coefficient types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10AH_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AHOriginalGammaAllOrderedPairCoefficientExtractionProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSGamma9
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (p q : Source9OrderedGammaPairIndex) :
              Matrix.trace (source9OrderedGammaPairMatrix p *
                source9OrderedGammaPairMatrix q) =
                if p = q then -(16 : ℝ) else 0 :=
            source9OriginalGamma_ordered_pair_subtype_trace_gram p q
          noncomputable example (p : Source9OrderedGammaPairIndex)
              (f : Source9OrderedGammaPairIndex → ℝ) :
              Matrix.trace (source9OrderedGammaPairMatrix p *
                (∑ q : Source9OrderedGammaPairIndex,
                  f q • source9OrderedGammaPairMatrix q)) =
                -(16 : ℝ) * f p :=
            source9OriginalGamma_all_ordered_pairs_trace_extract p f
          noncomputable example (f : Source9OrderedGammaPairIndex → ℝ)
              (hsum :
                (∑ q : Source9OrderedGammaPairIndex,
                  f q • source9OrderedGammaPairMatrix q) =
                    (0 : GammaMatrix)) :
              f = 0 :=
            source9OriginalGamma_all_ordered_pairs_coeff_function_zero f hsum
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_pair_subtype_trace_gram
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_all_ordered_pairs_trace_extract
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_all_ordered_pairs_coeff_function_zero
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10AH_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10ah/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10ah'/'declaration-audit.log').read_text()
          names=['source9OriginalGamma_ordered_pair_subtype_trace_gram',
                 'source9OriginalGamma_all_ordered_pairs_trace_extract',
                 'source9OriginalGamma_all_ordered_pairs_coeff_function_zero']
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==3 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10AH_THREE_ALL_PAIR_COEFF_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent original all-36 coefficient audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10ah-all-gamma-pair-coeff-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10ah
          if-no-files-found: warn
