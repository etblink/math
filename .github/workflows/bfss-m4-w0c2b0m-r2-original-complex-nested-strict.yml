name: BFSS M4 W0C2B0M R2 original Fock complex nested coefficient strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean
      - lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean
      - .github/workflows/bfss-m4-w0c2b0m-r2-original-complex-nested-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0c2b0m-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-complex-nested:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified original BFSS integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight original complex carrier source and stopped R1/R2 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0c2b0m-r2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0c2b0m-r2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0c2b0m-r2/preflight.log"
          import json, re, subprocess, hashlib, zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficient.lean":"19e20ca4138c0303c28e3ab46d4b2fcf3a496bb0","lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumer.lean":"14f366562c5986f58fd282a09e28720e7ea171b5","research/quantum-information/BFSS_QIT_SCC_W0C2B0M_R1_COMPLEX_NESTED_ACTION_PRE_GATE_2026_11_17.md":"5d570016acc1808b4b28627804db24027206097e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0CAbstractCoefficientContraction.lean":"9448c9a47c605cb6aba2cfc798ae28a0213c9411","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0DOriginalFockThinTensorAdapter.lean":"e52b8ca7a440e04ab3c3a93187e5100daa39e074","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean":"51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb","research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip":"cb5591ab7ae5762150ea1d10dc093788f812d929","research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_complete_job.log":"47d03e99bf3e9f4319200ecc02bfb7dc3db69175","research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_GREEN_evidence_manifest.json":"6d348101dd6b9feffcf479802248445313973698","research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip":"4117bd19a0a8d1614df176e72d69a9b628de19da","research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip":"3f15c1c8bcf0e057e3de2055abc6ec00e8b931ec","research/quantum-information/diagnostics/BFSS_W0C2B0_R2_44222678258_complete_job.log":"d20cb3c7e2239fd63922a1afb70b86e2e8734088","research/quantum-information/diagnostics/BFSS_W0C2B0_R2_44222678258_NATIVE_RED_evidence_manifest.json":"850033634128dc24705404a5b086c3fbda3725e1","research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence.zip":"c1874bd132ee5962454a85c6380e2be204b4596d","research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44251761371_complete_job.log":"a8532cd1ca1c3bc29e1c9a547f8f98e26769abb2","research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44251761371_PREFLIGHT_RED_evidence_manifest.json":"30fb623f207fcfc3d521a9522435dac80050d15b","research/quantum-information/BFSS_QIT_SCC_W0C2B0M_R1_FIRST_PREFLIGHT_RED_44251761371_IMPORT_COUNT_REPAIR_2026_11_17.md":"814fad537f4fbe9f3c1ccf2347c07731430dd3ee","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean":"b98cc05a012c98da8016496492d77135fc58ebc8","lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean":"dcbba93f72feb4f60912521f666d748bcf2e1687","research/quantum-information/BFSS_QIT_SCC_W0C2B0M_R2_EXPLICIT_COMPLEX_MODULE_REPAIR_PRE_GATE_2026_11_17.md":"090bfa986cfce97351d891979328fd81ebe77fb8",".github/workflows/bfss-m4-w0c2b0m-r2-original-complex-nested-strict.yml":"90492c571e555267d560aba6c910fef43ae52faf","research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip":"277b934810e6a999c974917d23a199ccd0be3ddd","research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44252646318_complete_job.log":"043fb4d1cffaca05166825fcd5923e0278fb8b36","research/quantum-information/diagnostics/BFSS_W0C2B0M_R1_44252646318_NATIVE_RED_evidence_manifest.json":"32def22a3c715395de8950be6001a0549d00920b"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,got,expected)
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2B0M","R2","PENDING_STRICT_CI",False)
          assert (q["gate"],q["run_id"],q["status"],q["qualification"])==("P3-M4-W0C2A",44213315719,"GREEN_QUALIFIED",True)
          assert len(s["accepted_anchors"])==24 and s["accepted_anchors"][-1]==q
          assert a["source"]=="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean" and a["source_blob"]==pins[a["source"]]
          assert a["consumer"]=="lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean" and a["consumer_blob"]==pins[a["consumer"]]
          assert a["prospective_receipt"]=="research/quantum-information/BFSS_QIT_SCC_W0C2B0M_R2_EXPLICIT_COMPLEX_MODULE_REPAIR_PRE_GATE_2026_11_17.md" and a["contract_commit"]=="58f7401d804bbd8e8b926263996895438a379430"
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==2
          assert a["independent_controls"]==2 and a["accepted_predecessor_run"]==44213315719
          assert a["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert s["previous_active_W0C2B0_R2_stopped"]["status"]=="BLOCKED"
          assert s["previous_active_W0C2B0_R2_stopped"]["native_red_count"]==2
          assert s["w0c2b0m_r1_first_preflight_red"]["run_id"]==44251761371
          assert s["w0c2b0m_r1_first_preflight_red"]["preservation_run"]==44252181709
          assert s["w0c2b0m_r1_first_preflight_red"]["failure_phase"]=="PREFLIGHT_BEFORE_LEAN"
          assert s["previous_active_W0C2B0M_R1_NATIVE_RED"]["run_id"]==44252646318
          assert s["previous_active_W0C2B0M_R1_NATIVE_RED"]["native_red_count"]==1
          assert s["previous_active_W0C2B0M_R1_NATIVE_RED"]["preservation_run"]==44253870183
          assert "exact (Finset.sum_smul).symm" in Path(a["source"]).read_text()
          assert "exact (sub_smul _ _ _).symm" in Path(a["source"]).read_text()
          assert s["next_planned"]["gate"]=="P3-M4-W0C2B0N"
          assert s["strategic_focus"]["full_bivector_bracket_qualified"] is False
          source=Path(a["source"]).read_text()
          consumer=Path(a["consumer"]).read_text()
          roots=["originalFock_complex_nested_coefficient_compose","originalFock_complex_nested_coefficient_bracket"]
          assert re.findall(r"(?m)^theorem\b",source)==["theorem"]*2
          assert re.findall(r"(?m)^theorem\b",consumer)==["theorem"]*2
          assert len(re.findall(r"(?m)^example\b",consumer))==2
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==roots
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[x+"_consumer" for x in roots]
          assert re.findall(r"(?m)^import ",source)==["import "]*2
          assert re.findall(r"(?m)^import ",consumer)==["import "]
          assert consumer.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2\n")
          for data in (source,consumer):
              assert "set_option autoImplicit false" in data
              assert "Fermion 2 →L[ℂ] Fermion 2" in data
              assert "Matrix ι ι ℂ" in data
              for banned in ["sourceNormalizedGamma","Matrix ι ι ℝ","maxRecDepth","maxHeartbeats","P3M4QTC1OriginalSourceRealComplexQuarterBridge","P3M4CT1G0OriginalFockJacobiSource48Adapter"]:
                  assert banned not in data,banned
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",data)
          assert all(token in source for token in ["Finset.smul_sum","Finset.sum_comm","Matrix.mul_apply","Finset.sum_smul","sub_smul"])
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          for name,sha,size in [("BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip","09bdc60577e56a767738cc85d94c11eafbd9f06a2521f6637b08a09ddd4e9453",20465),("BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip","02722db3e4d82c68bed20f980bc2f1b3400b7ed47604cc6f6463b0761d0b5ddb",20778),("BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip","9f7c56be541406843d1b5556c687f0500a4bb8112fc65867559f16fc70fff266",20434),("BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip","e9242ef864e6f7bdacb76386f94595b1c67b5eb471f0c485de795bd2970d1529",3779)]:
              data=Path("research/quantum-information/diagnostics",name).read_bytes()
              assert len(data)==size and hashlib.sha256(data).hexdigest()==sha,name
              with zipfile.ZipFile(Path("research/quantum-information/diagnostics",name)) as z:
                  assert z.testzip() is None,name
          print("BFSS_W0C2B0M_R2_ORIGINAL_FOCK_EXPLICIT_MODULE_REPAIR_AND_FROZEN_R1_RED_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original complex nested coefficient source independent consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0c2b0m-r2"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0c2b0m-r2"
          allowed={"propext","Classical.choice","Quot.sound"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log
              warnings=[line for line in log.splitlines() if "warning:" in line and not warning_ok.fullmatch(line)]
              assert not warnings,warnings[:3]
              roots=pat.findall(log)
              assert len(roots)==len(expected),(roots,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in roots]
              assert names==expected and len(set(names))==len(names),names
              for _,axioms in roots:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a","b"])
          bad=[good.replace("Quot.sound","sorryAx",1),good.replace("Quot.sound","Foreign.axiom",1),good+good,"",good+"warning: unexpected warning\n",good+"error: failed proof\n"]
          for i,case in enumerate(bad):
              try:audit(case,["a","b"])
              except AssertionError:pass
              else:raise AssertionError(("negative mutation accepted",i))
          cold=(root/"cold-source.log").read_text()
          assert "Build completed successfully" in cold and "error:" not in cold and "sorryAx" not in cold
          audit((root/"source-axioms.log").read_text(),["originalFock_complex_nested_coefficient_compose","originalFock_complex_nested_coefficient_bracket"])
          audit((root/"consumer.log").read_text(),["originalFock_complex_nested_coefficient_compose_consumer","originalFock_complex_nested_coefficient_bracket_consumer"])
          print("BFSS_W0C2B0M_R2_ORIGINAL_COMPLEX_NESTED_2_SOURCE_2_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN")
          PY
      - name: Preserve exact original proof and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0c2b0m-r2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0c2b0m-r2/
          if-no-files-found: warn
          retention-days: 14
