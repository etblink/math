name: BFSS W0C2B1 R1 original native Jacobi RED exact evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b1-r1-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-original-jacobi-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source-exact first native B1 RED and accepted anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify untouched first original source RED and negative history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceAction.lean)" = db15340dfb46eea78c20549bb6d1616dd99f302b
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B1OriginalFockJacobiCovarianceIndependentConsumer.lean)" = 76f5071b847245fe4173b0dde8205c8b69173b5d
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b1-r1-original-fock-jacobi-covariance-strict.yml)" = a7e7b89896f5f447ec88f0c548d222be54a5fdee
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip)" = 3e57a0e7205dc6f34c6f3da90ff3056fa63943ea
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B1','R1','PENDING_STRICT_CI',False)
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B0N','R1',44260119108,'GREEN_QUALIFIED')
          assert len(s['accepted_anchors'])==26 and s['accepted_anchors'][-1]==q
          assert s['previous_active_W0C2B0_R2_stopped']['native_red_count']==2
          assert s['previous_active_W0C2B0M_R1_NATIVE_RED']['run_id']==44252646318
          root=Path('research/quantum-information/diagnostics')
          for name in ('BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip','BFSS_W0C2B1_R1_44263755514_complete_job.log','BFSS_W0C2B1_R1_44263755514_NATIVE_RED_evidence_manifest.json'):
              assert not (root/name).exists(),name
          print('BFSS_W0C2B1_R1_ORIGINAL_JACOBI_NATIVE_RED_PRESERVATION_PREFLIGHT_PASS')
          PY
      - name: Independently pin original ZIP full job log and SHA CRC with exact failing goal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44263755514;job=134663119955;artifact=14409612451
          tested='7f60d7f305d1862434781ff75fa19ff5f4bac900'
          size=3658;digest='a0b6dfdd17dfdeceed8483f486e9bd98850bb187033fab457fbb1291f261d8ec'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f:return json.load(f)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure'
          assert j['id']==job and j['run_id']==run and j['conclusion']=='failure'
          for prefix_step in ('Checkout exact unified','Preflight qualified N','Restore pinned Lean'):
              assert any(s['name'].startswith(prefix_step) and s['conclusion']=='success' for s in j['steps']),prefix_step
          assert any(s['name'].startswith('Cold original Fock Jacobi') and s['conclusion']=='failure' for s in j['steps'])
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={'preflight.log','tested-commit.txt','cold-source.log'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B1_R1_ORIGINAL_FOCK_JACOBI_26_ACCEPTED_ANCHORS_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              for phrase in ('OriginalFockJacobiCovarianceAction.lean:54:51: unsolved goals',
                             "'FCP.BFSSP3M4W0C2B1OriginalFockJacobiCovarianceAction.originalFock_commutator_sum' depends on axioms",
                             "'FCP.BFSSP3M4W0C2B1OriginalFockJacobiCovarianceAction.originalFock_commutator_weighted_sum' depends on axioms",
                             "sorryAx", "error: build failed"):
                  assert phrase in cold,phrase
              assert cold.count('sorryAx')>=2
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>50000 and b'OriginalFockJacobiCovarianceAction.lean:54:51: unsolved goals' in full
          assert b'Artifact ID 14409612451' in full
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip'
          log=root/'BFSS_W0C2B1_R1_44263755514_complete_job.log'
          manifest=root/'BFSS_W0C2B1_R1_44263755514_NATIVE_RED_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
            'gate':'P3-M4-W0C2B1','attempt':'R1','status':'NATIVE_SOURCE_RED_UNQUALIFIED',
            'run_id':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
            'original_zip':{'path':str(arc),'size':size,'sha256':digest,'members':members},
            'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
            'source_blob':'db15340dfb46eea78c20549bb6d1616dd99f302b',
            'consumer_blob':'76f5071b847245fe4173b0dde8205c8b69173b5d',
            'workflow_blob':'a7e7b89896f5f447ec88f0c548d222be54a5fdee',
            'failure_phase':'ORIGINAL_SOURCE_LEAN',
            'causal_error':'Noncommutative Jacobi proof by noncomm_ring leaves an unsolved normalized sum; downstream conditional covariance inherits sorryAx',
            'source_error_line':54,'source_axiom_reports_passed':2,
            'source_axiom_reports_with_sorryAx':2,'consumer_executed':False,
            'native_red_count_this_architecture':1,
            'prior_accepted_anchor_count':26,'last_qualified_run':44260119108,
            'claim_ceiling':'No original Fock Jacobi, matrix covariance closure or original K bivector bracket qualified from R1'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B1_R1_ORIGINAL_NATIVE_RED_ZIP_COMPLETE_LOG_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin original native RED ZIP complete Actions job log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B1_R1_44263755514_NATIVE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B1_R1_44263755514_NATIVE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS W0C2B1 R1: preserve first original Fock Jacobi native RED evidence'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
