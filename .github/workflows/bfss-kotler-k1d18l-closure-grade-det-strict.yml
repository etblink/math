            ('SU2BFSSPhysicalDomainS1V52K1D18EOriginalSpinTwoFactorDeterminantProbe.lean',["originalSourceTwoGeneratorMatrices_det_one","originalSourceSpin48LinearMap_eq_twoGeneratorToLin_of_unitFactorization","originalSourceSpin48LinearMap_det_one_of_twoUnitFactorization"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18FOriginalLipschitzVectorActionProbe.lean',["sourceLipschitz_conjugated_generator_unique","sourceLipschitzVectorAction_clifford_generator","sourceLipschitzVectorAction_add","sourceLipschitzVectorAction_smul"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18GOriginalLipschitzVectorActionLawsProbe.lean',["originalSourceSpin48_unit_mem_lipschitz","sourceLipschitzVectorAction_one","sourceLipschitzVectorAction_mul","sourceLipschitzVectorAction_agrees_originalSpin48","originalSourceLipschitzLinearMap"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18HOriginalLipschitzLinearRepresentationProbe.lean',["originalSourceLipschitzLinearEquiv","originalSourceLipschitzLinearEquiv_apply","originalSourceLipschitzLinearRepresentation","originalSourceLipschitzDeterminantCharacter"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18IOriginalLipschitzGeneratorParityProbe.lean',["originalSourceGeneratorUnit_mem_lipschitz","originalSourceGeneratorLipschitzUnit","originalSourceGeneratorLipschitzLinearMap_eq_rankOne","originalSourceGeneratorLipschitzDeterminant_neg_one","originalSourceGeneratorLipschitzUnit_involute_neg"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18JOriginalLipschitzInverseGeneratorParityProbe.lean',["originalSourceGeneratorInverse_det_neg_one","originalSourceGeneratorInverse_involute_neg","originalSourceGeneratorInverse_grade_det_agreement"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18KOriginalLipschitzGradeDetIdentityAndMulProbe.lean',["originalSourceLipschitzGradeDetInvariant","originalSourceLipschitzGradeDetInvariant_one","originalSourceLipschitzGradeDetInvariant_generator","originalSourceLipschitzGradeDetInvariant_generator_inv","originalSourceLipschitzGradeDetInvariant_mul"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18LOriginalLipschitzClosureGradeDetProbe.lean',["originalSourceLipschitzGradeDetInvariant_all"]),
          ]
          for name,roots in files:
              s=(p/name).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|axiom)\b',code_only(s)),name
              assert re.findall(r'(?m)^#print axioms (\S+)',s)==roots,(name,'roots mismatch')
          print('K1D18L_EXACT_SOURCE_PINS_FORTY_ONE_DECLARATIONS_PASS')
          PY
      - name: Restore exact accepted Lean/Mathlib dependencies; no full dependency cache
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          lake env lean --version
      - name: Restore same-branch source accepted 81-root ancestry
        id: accepted-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: lean/.lake/build/lib/lean/OAI
          key: bfss-fcp-k1d17-source-accepted-ancestors-v1-389ecdcc-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Require exact validated 81-root source ancestry (no fallback)
        shell: bash
        timeout-minutes: 20
        env:
          EXACT_HIT: ${{ steps.accepted-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_HIT" = true || { echo 'K1D18L_NO_TRUSTED_ANCESTRY_CACHE_STOP'; exit 1; }
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py verify --log-dir "$RUNNER_TEMP/k1d18l-cache"
          echo K1D18L_ACCEPTED_81_ROOT_ANCESTRY_PASS
