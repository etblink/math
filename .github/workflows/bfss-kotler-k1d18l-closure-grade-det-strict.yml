          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==roots,reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name,axs in reports:
              assert set(x.strip() for x in axs.split(',') if x.strip())<=allowed,(name,axs)
          assert 'sorryAx' not in s
          assert not re.search(r'\.lean:\d+:\d+:\s*(?:warning|error)',s)
          for root in roots: assert root+' :' in s,('missing source-exact declaration type',root)
          print('K1D18L_EXACT_FORTY_ONE_ROOT_TYPES_AXIOMS_PASS')
          PY
      - name: Preserve compiler and independent axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d18l-closure-grade-det-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/k1d18l-cache
            ${{ runner.temp }}/k1d18l-fresh
          if-no-files-found: warn
