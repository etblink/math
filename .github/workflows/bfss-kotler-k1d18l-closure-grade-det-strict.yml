name: BFSS K1D18L original Lipschitz subgroup closure grade determinant strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - .github/workflows/bfss-kotler-k1d18l-closure-grade-det-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D18LOriginalLipschitzClosureGradeDetProbe.lean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-lipschitz-closure-grade-det:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source pins and no unproved declaration lexemes
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe.lean")" = '3253f10de6d31ed6f0ec5fd5d4674109cf9e04d6'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe.lean")" = '19db346be86030db4a3a291493b962bf00898898'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D13OriginalSpin48LinearRepresentationProbe.lean")" = 'ea7b39f86a3ee3da6e69ecde3e84a3e04252567d'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D16OriginalSpin48QuadraticIsometryProbe.lean")" = '6367c33e426cfda4269a34bf1fb8a71dec7fb8bc'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean")" = '9dc33c924c22e8823ddc905440feb05fb8ce3d0f'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18BPolarAllVectorCliffordBridgeProbe.lean")" = 'd0531752fa8f63df4f94294d6cd748fed1af223e'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe.lean")" = '9455998333da80845ab6b7514c13ef990c951019'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18DOriginalSourceSpinUnitFactorizationProbe.lean")" = '3e45853f5abbff26bf0dca170217013415736e9c'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18EOriginalSpinTwoFactorDeterminantProbe.lean")" = '4affb7ed6e0ca213e1317a87f313124f8fa844ae'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18FOriginalLipschitzVectorActionProbe.lean")" = '1562aaf20f77a96b7dd27afde090e59ff1258188'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18GOriginalLipschitzVectorActionLawsProbe.lean")" = '91d71119f865d4aec1e09bb55f9297e29e7174a4'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18HOriginalLipschitzLinearRepresentationProbe.lean")" = '3de8f66a91063845b0aaa8417ed9260cc5d41df6'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18IOriginalLipschitzGeneratorParityProbe.lean")" = '9e4d56f27e6f8f4cb3244236c36b29e595a91bc2'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18JOriginalLipschitzInverseGeneratorParityProbe.lean")" = '2dd6581775e92df5686267863c14529cde77bd60'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18KOriginalLipschitzGradeDetIdentityAndMulProbe.lean")" = '81067e786cac0fbb65b936b6013d028dc3e73fed'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18LOriginalLipschitzClosureGradeDetProbe.lean")" = 'db0488de5c74681f098ef1762af030d60431d628'
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py)" = 'ca97ad005f75fc270942d034772871471933c7b3'
          python3 - <<'PY'
          import pathlib,re,sys
          sys.path.insert(0,str(pathlib.Path('contributions/bfss-kotler/tools').resolve()))
          from qualify_fcp_sync import code_only
          p=pathlib.Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler')
          files=[
            ('SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean',["source48_coordinate_sum","source48_normalized_polar_coordinate_dot"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18BPolarAllVectorCliffordBridgeProbe.lean',["source48NormalizedPolarRow_dot","source48NormalizedPolarRow_dot_self","source48_clifford_generator_conjugation_from_row"]),
            ('SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe.lean',["source48_rankOneConjugationMatrix_mulVec","source48_rankOneMatrix_matches_original_clifford_conjugation","source48_original_generator_rankOneMatrix_det"]),
