          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          p=OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          mkdir -p ".lake/build/lib/lean/$p" "$RUNNER_TEMP/k1d18l-fresh"
          for m in SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe SU2BFSSPhysicalDomainS1V52K1D18BPolarAllVectorCliffordBridgeProbe SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe SU2BFSSPhysicalDomainS1V52K1D18DOriginalSourceSpinUnitFactorizationProbe SU2BFSSPhysicalDomainS1V52K1D18EOriginalSpinTwoFactorDeterminantProbe SU2BFSSPhysicalDomainS1V52K1D18FOriginalLipschitzVectorActionProbe SU2BFSSPhysicalDomainS1V52K1D18GOriginalLipschitzVectorActionLawsProbe SU2BFSSPhysicalDomainS1V52K1D18HOriginalLipschitzLinearRepresentationProbe SU2BFSSPhysicalDomainS1V52K1D18IOriginalLipschitzGeneratorParityProbe SU2BFSSPhysicalDomainS1V52K1D18JOriginalLipschitzInverseGeneratorParityProbe SU2BFSSPhysicalDomainS1V52K1D18KOriginalLipschitzGradeDetIdentityAndMulProbe SU2BFSSPhysicalDomainS1V52K1D18LOriginalLipschitzClosureGradeDetProbe; do
            lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$p/$m.olean" "$p/$m.lean" > "$RUNNER_TEMP/k1d18l-fresh/$m.log" 2>&1 || {
              cat "$RUNNER_TEMP/k1d18l-fresh/$m.log"; exit 1;
            }
            test -s ".lake/build/lib/lean/$p/$m.olean"
            cat "$RUNNER_TEMP/k1d18l-fresh/$m.log"
            sha256sum ".lake/build/lib/lean/$p/$m.olean"
          done
          echo K1D18L_SOURCE_EXACT_TWELVE_FRESH_COMPILATIONS_PASS
