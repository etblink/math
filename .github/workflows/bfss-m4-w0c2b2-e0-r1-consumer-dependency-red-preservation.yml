name: BFSS W0C2B2 E0 R1 original consumer dependency RED preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b2-e0-r1-consumer-dependency-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-e0-r1-consumer-environment-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable original E0 R1 sources and accepted anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify immutable E0 source consumer workflow, all 27 anchors and archived previous REDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E0OpaqueFockEqualActions.lean)" = 46051f2904ca92d4693d85f65fa39027ec548e35
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSW0C2B2E0OpaqueFockEqualActionsIndependentConsumer.lean)" = 73d03c880f12bd7f058a751b2a343743a2241a0f
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b2-e0-opaque-fock-equal-actions-strict.yml)" = a639f78bef7c0d2935a6fcb522c431336d162a0e
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean)" = 861628fe6322c919bee87e493e1e629d48bfa8bb
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean)" = 51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R2_44355713875_NATIVE_RED_evidence.zip)" = c8d32c6291f7469400abf794b0eacd30113ec828
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          for name in ('BFSS_M4_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence.zip',
                       'BFSS_W0C2B2_E0_R1_44364111715_complete_job.log',
                       'BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json'):
              assert not (Path('research/quantum-information/diagnostics')/name).exists(),name
          print('BFSS_E0_R1_27_ANCHORS_EVIDENCE_BYTES_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Independently download and verify original E0 R1 provider ZIP and complete job transcript
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44364111715;job=135013101504;artifact=14455579444
          tested='d5ca2b09e75e0471aa1979c3bab57e4d88009131'
          size=4074;digest='923922af8ef3b8abbec70c12fcb494c5d0be5a8dbc3fb8bfd25b7f8629d72fc9'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as resp:return json.load(resp)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='failure' and r['run_attempt']==1
          assert j['id']==job and j['run_id']==run and j['conclusion']=='failure'
          assert all(any(s['name'].startswith(n) and s['conclusion']=='success' for s in j['steps']) for n in (
               'Checkout exact unified','Preflight 27 accepted','Restore pinned Lean'))
          assert any(s['name'].startswith('Cold original opaque Fock E0 source') and s['conclusion']=='failure' for s in j['steps'])
          assert any(s['name'].startswith('Preserve original E0 provider ZIP') and s['conclusion']=='success' for s in j['steps'])
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert {'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log'}<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_E0_27_ACCEPTED_ANCHORS_ALL_SOURCE_NEGATIVE_EVIDENCE_AND_PINS_FROZEN_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (8966 jobs)' in cold
              assert 'error:' not in cold and 'sorryAx' not in cold
              source=z.read('source-axioms.log').decode()
              roots=['originalFock_equal_actions_implies_difference_commutes',
                     'originalFock_equal_columns_implies_difference_commutes',
                     'originalFock_equal_column_family_implies_difference_commutes']
              for root in roots:assert root in source,root
              assert 'sorryAx' not in source and 'error:' not in source
              con=z.read('consumer.log').decode()
              assert 'P3M4W0C2AOriginalBivectorLieDefectTraceBridge.olean' in con
              assert 'does not exist' in con and 'error:' in con
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>50000,len(full)
          assert b'Build completed successfully (8966 jobs)' in full
          assert b'P3M4W0C2AOriginalBivectorLieDefectTraceBridge.olean' in full
          assert b'Artifact ID 14455579444' in full
          root=Path('research/quantum-information/diagnostics');root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence.zip'
          log=root/'BFSS_W0C2B2_E0_R1_44364111715_complete_job.log'
          manifest=root/'BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
              'gate':'P3-M4-W0C2B2-E0','attempt':'R1',
              'status':'SOURCE_CLEAN_CONSUMER_IMPORT_OLEAN_MISSING_UNQUALIFIED',
              'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
              'original_zip':{'path':str(arc),'size':len(raw),'sha256':digest,'members':members},
              'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'46051f2904ca92d4693d85f65fa39027ec548e35',
              'consumer_blob':'73d03c880f12bd7f058a751b2a343743a2241a0f',
              'workflow_blob':'a639f78bef7c0d2935a6fcb522c431336d162a0e',
              'failure_phase':'INDEPENDENT_CONSUMER_IMPORT_DEPENDENCY_MISSING',
              'first_causal_error':'missing accepted W0C2A original LieDefectTraceBridge.olean; workflow built only E0 source import closure',
              'source_native_compiled':True,'source_expected_axioms_only':True,
              'consumer_compiled':False,'consumer_axioms_qualified':False,
              'native_source_proof_red_count':0,'consumer_environment_red_count':1,
              'predecessor_accepted_anchor_count':27,'predecessor_qualified_run':44267283653,
              'B2_canonical_status':'BLOCKED',
              'claim_ceiling':'No E0 source+consumer strict qualification, no original gamma centrality or K(A) Lie bracket'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_E0_R1_EXACT_PROVIDER_ZIP_COMPLETE_LOG_MEMBER_SHA_CRC_PRESERVED')
          PY
      - name: Git-pin immutable E0 R1 original ZIP log and SHA/CRC manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R1_44364111715_DEPENDENCY_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS E0 R1: preserve original source-green consumer dependency RED evidence'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
