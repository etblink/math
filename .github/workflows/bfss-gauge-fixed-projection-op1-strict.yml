name: BFSS OP1 gauge projection star-automorphism strict gate

on:
  push:
    branches: [research/bfss-original-gamma-faithfulness-20261107]
    paths:
      - lean/OAI/LinearAlgebra/GaugeFixedProjectionOP1.lean
      - lean/diagnostics/BFSSGaugeFixedProjectionOP1IndependentAudit.lean
      - .github/workflows/bfss-gauge-fixed-projection-op1-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-op1-gauge-fixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mathlib-only-op1:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Preflight pinned toolchain and bounded source imports
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bfss-op1"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/tested-commit.txt"
          sha256sum lean/OAI/LinearAlgebra/GaugeFixedProjectionOP1.lean \
            lean/diagnostics/BFSSGaugeFixedProjectionOP1IndependentAudit.lean \
            lean/lean-toolchain lean/lake-manifest.json | tee "$evidence/input-sha256.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path("lean/lean-toolchain").read_text().strip() == "leanprover/lean4:v4.34.1"
          manifest = json.loads(Path("lean/lake-manifest.json").read_text())
          mathlib = next(p for p in manifest["packages"] if p["name"] == "mathlib")
          assert mathlib["rev"] == "d13f23b723b8a846827a245b89c10fc7d3f11612"
          src = Path("lean/OAI/LinearAlgebra/GaugeFixedProjectionOP1.lean").read_text()
          consumer = Path("lean/diagnostics/BFSSGaugeFixedProjectionOP1IndependentAudit.lean").read_text()
          assert [s for s in src.splitlines() if s.startswith("import ")] == [
              "import OAI.LinearAlgebra.GaugeFixedProjectionOP0"
          ]
          assert [s for s in consumer.splitlines() if s.startswith("import ")] == [
              "import OAI.LinearAlgebra.GaugeFixedProjectionOP1"
          ]
          print("Exact Lean/Mathlib pins and OP1 source/consumer import boundaries: PASS")
          PY

      - name: Restore pinned Lean/Mathlib environment
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get

      - name: Compile exact OP1 source and independent consumer
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          evidence="$RUNNER_TEMP/bfss-op1"
          cd lean
          lake build OAI.LinearAlgebra.GaugeFixedProjectionOP1 2>&1 | tee "$evidence/source-build.log"
          lake env lean OAI/LinearAlgebra/GaugeFixedProjectionOP1.lean 2>&1 | tee "$evidence/source-axioms.log"
          lake env lean diagnostics/BFSSGaugeFixedProjectionOP1IndependentAudit.lean 2>&1 | tee "$evidence/consumer.log"
          # Lean 4.34.1 does not turn every warning fatal with -E warning.
          # Match only direct Lean source/consumer diagnostics, not dependency checkout warnings.
          if grep -E '^(OAI/LinearAlgebra/GaugeFixedProjectionOP1[.]lean|diagnostics/BFSSGaugeFixedProjectionOP1IndependentAudit[.]lean):[0-9]+:[0-9]+: warning:' "$evidence/source-axioms.log" "$evidence/consumer.log"; then
            echo "STOP: OP1 source or consumer emitted a Lean warning" >&2
            exit 1
          fi
          if grep -E 'sorryAx|Lean\.ofReduceBool' "$evidence/source-axioms.log" "$evidence/consumer.log"; then
            echo "STOP: unexpected proof axiom detected"
            exit 1
          fi
          echo "OP1 source, independent consumer, and axiom reports: PASS"

      - name: Retain exact inputs and full diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gauge-fixed-op1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-op1/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
