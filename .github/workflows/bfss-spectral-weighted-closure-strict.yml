name: BFSS spectral weighted closure strict gate

on:
  push:
    branches: [research/bfss-spectral-confinement-roadmap-20261106]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralWeightedClosureCompactness.lean
      - lean/diagnostics/BFSSSpectralWeightedClosureIndependentAudit.lean
      - contributions/bfss-kotler/BFSS_SPECTRAL_WEIGHTED_CLOSURE_MANIFEST_V1.json
      - contributions/bfss-kotler/tools/qualify_spectral_weighted_closure.py
      - contributions/bfss-kotler/tools/test_spectral_core_linear_moment.py
      - .github/workflows/bfss-spectral-weighted-closure-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weighted-closure-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retain proposed inputs and check both frozen gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spectral-weighted-closure"
          git rev-parse HEAD > "$RUNNER_TEMP/spectral-weighted-closure/tested-sha.txt"
          tar -czf "$RUNNER_TEMP/spectral-weighted-closure/proposed-inputs.tar.gz" \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralWeightedClosureCompactness.lean \
            lean/diagnostics/BFSSSpectralWeightedClosureIndependentAudit.lean \
            contributions/bfss-kotler/BFSS_SPECTRAL_WEIGHTED_CLOSURE_MANIFEST_V1.json \
            contributions/bfss-kotler/tools/qualify_spectral_weighted_closure.py \
            contributions/bfss-kotler/tools/test_spectral_core_linear_moment.py \
            .github/workflows/bfss-spectral-weighted-closure-strict.yml \
            lean/lean-toolchain lean/lake-manifest.json lean/lakefile.lean
          python3 contributions/bfss-kotler/tools/qualify_spectral_weighted_closure.py preflight
          python3 contributions/bfss-kotler/tools/test_spectral_linear_moment.py
          python3 contributions/bfss-kotler/tools/test_spectral_core_linear_moment.py
      - name: Restore pinned Lean and Mathlib environment
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
      - name: Cold rebuild accepted analysis and qualify the weighted closure bridge
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_spectral_weighted_closure.py run \
            --evidence "$RUNNER_TEMP/spectral-weighted-closure"
      - name: Retain exact inputs and all compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectral-weighted-closure-${{ github.sha }}
          path: ${{ runner.temp }}/spectral-weighted-closure
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
