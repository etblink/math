name: BFSS M4 W0C2B2 E1 original skew K bracket gamma action strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E1OriginalSkewBracketGammaAction.lean
      - lean/diagnostics/BFSSW0C2B2E1OriginalSkewBracketGammaActionIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0c2b2-e1-original-skew-bracket-gamma-action-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-m4-w0c2b2-e1-original-skew-bracket-gamma-action
  cancel-in-progress: false
jobs:
  original-source-skew-bracket-action:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout original immutable unified BFSS branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight 27 anchors exact frozen donors all negative and E0 GREEN evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-w0c2b2-e1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-w0c2b2-e1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-w0c2b2-e1/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          src='lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E1OriginalSkewBracketGammaAction.lean'
          con='lean/diagnostics/BFSSW0C2B2E1OriginalSkewBracketGammaActionIndependentConsumer.lean'
          roots=['originalSource48K_skew_complex_gamma_covariance',
                 'originalSource48K_skew_bracket_complex_gamma_covariance']
          pins={
            src:'5663ee2dcfd6ea682d23c3cf45dcd424888a7b89',
            con:'4450f110f9a206d278f312a333de430f64b61298',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B1OriginalFockJacobiCovarianceActionR2.lean':'861628fe6322c919bee87e493e1e629d48bfa8bb',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0NOriginalSource48RealComplexCoefficientAdapter.lean':'c5841055363a6eef713f35e568409dd2fa2b6c9e',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean':'c2e7a7c665121283cde13ae5dabc183362b6b420',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean':'51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B2OriginalSource48KLieDefectGammaCentralityR2.lean':'d52f48a79750846231c306d9e9ac8ceda25d37be',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E0OpaqueFockEqualActions.lean':'46051f2904ca92d4693d85f65fa39027ec548e35',
            'lean/diagnostics/BFSSW0C2B2E0OpaqueFockEqualActionsIndependentConsumer.lean':'73d03c880f12bd7f058a751b2a343743a2241a0f',
            '.github/workflows/bfss-m4-w0c2b2-e0-r2-consumer-dependency-build-strict.yml':'5a5494289f24168d5307a23d83a45d38b3e22656',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E0_R2_44368187249_GREEN_evidence.zip':'6b4204d7603459d075c60444e1b3e12adca78fe0',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R2_44368187249_complete_job.log':'0d335d6fdfbd0d566ecc0ecd6ab714fed31f9022',
            'research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R2_44368187249_GREEN_evidence_manifest.json':'c81dd245464a78af375d384e3e79f39ac5eae30b',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R1_44274131658_NATIVE_RED_evidence.zip':'12b5843b116bae63e2183049cae572cb1fcc051b',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_R2_44280267807_NATIVE_RED_evidence.zip':'b668e91fa897136c5144ef535cb0fef035e9c216',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R1_44330552342_TIMEOUT_evidence.zip':'5b0cd1c0581ac1a8df5c50093f91e3d12b3fef43',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D0_R2_44336446671_NATIVE_RED_evidence.zip':'18c87219367977d3d9530e90789c3e8612740849',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D1_R1_44344524186_NATIVE_RED_evidence.zip':'274024155e885fb1c5bb49e20604bd621f503f39',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R1_44350891866_NATIVE_RED_evidence.zip':'01c99ad7de02f8b71f61b830b17c66ce3d536035',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_D2A_R2_44355713875_NATIVE_RED_evidence.zip':'c8d32c6291f7469400abf794b0eacd30113ec828',
            'research/quantum-information/BFSS_W0C2B2_E1_ORIGINAL_BRACKET_GAMMA_ACTION_PRE_GATE_2026_11_18.md':'8aa226617570cc3f6395a93c5860912c0463559a'
          }
          for path,sha in pins.items():
            got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
            assert got==sha,(path,got,sha)
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B2','R2','BLOCKED',False)
          assert a['native_red_count']==2 and a['stop_rule_action']=='STOPPED_TWO_NATIVE_SOURCE_REDS_NO_UNCHANGED_RETRY'
          assert len(s['accepted_anchors'])==27 and s['accepted_anchors'][-1]==q
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B1','R2',44267283653,'GREEN_QUALIFIED')
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          assert s['strategic_focus']['full_bivector_bracket_qualified'] is False
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          lm=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(m['rev'] for m in lm['packages'] if m['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          for file,expectedimports in ((src,3),(con,1)):
            txt=Path(file).read_text()
            assert len(re.findall(r'(?m)^theorem\b',txt))==2
            assert len(re.findall(r'(?m)^import ',txt))==expectedimports
            assert re.findall(r'(?m)^#print axioms (\S+)$',txt)==(
              roots if file==src else [root+'_consumer' for root in roots])
            assert 'Fermion 2 →L[ℂ] Fermion 2' in txt and 'sourceNormalizedGamma' in txt
            assert 'set_option autoImplicit false' in txt
            assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',txt)
            assert not any(t in txt for t in ('maxRecDepth','maxHeartbeats','originalSource48K_lieDefect A B'))
          assert len(re.findall(r'(?m)^example\b',Path(con).read_text()))==2
          assert 'originalFock_commutator_covariance_bracket' in Path(src).read_text()
          assert 'originalSource48Fock_real_column_to_complex' in Path(src).read_text()
          assert Path(con).read_text().startswith('import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.ProbeW0C2B2E1OriginalSkewBracketGammaAction\n')
          gm=json.loads(Path('research/quantum-information/diagnostics/BFSS_W0C2B2_E0_R2_44368187249_GREEN_evidence_manifest.json').read_text())
          assert gm['status']=='ORIGINAL_SOURCE_AND_INDEPENDENT_CONSUMER_STRICT_GREEN_DIAGNOSTIC_ONLY'
          assert gm['strict_run']==44368187249 and gm['tested_sha']=='da3cb6d69ddf40ee78a43f577346ea64e2ea4d9b'
          assert gm['original_zip']['sha256']=='32065e648bc194211e09d25f720d883cc1adda8caec12283cb6dace19deb466c'
          assert gm['source_axiom_count']==gm['consumer_axiom_count']==3
          print('BFSS_W0C2B2_E1_27_ACCEPTED_ANCHORS_E0_ORIGINAL_GREEN_AND_STOPPED_B2_EVIDENCE_PINNED_PREFLIGHT_PASS')
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original source bracket gamma action two roots independent consumer and axioms
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-w0c2b2-e1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.ProbeW0C2B2E1OriginalSkewBracketGammaAction 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E1OriginalSkewBracketGammaAction.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSW0C2B2E1OriginalSkewBracketGammaActionIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'bfss-w0c2b2-e1'
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(log,expected):
            assert 'sorryAx' not in log and 'error:' not in log
            warnings=[line for line in log.splitlines() if 'warning:' in line and not allowed_warning.fullmatch(line)]
            assert not warnings,warnings
            found=pat.findall(log)
            assert len(found)==len(expected),(found,expected)
            assert [name.rsplit('.',1)[-1] for name,_ in found]==expected
            for _,ax in found: assert {a.strip() for a in ax.split(',') if a.strip()}<=allowed
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,['a','b'])
          mutants=[good.replace('Quot.sound','sorryAx',1),good.replace('Quot.sound','Foreign.axiom',1),
                   good+good,'',good+'warning: unexpected\n',good+'error: failed\n']
          for i,bad in enumerate(mutants):
            try:audit(bad,['a','b'])
            except AssertionError:pass
            else:raise AssertionError(('negative mutation passed',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'sorryAx' not in cold and 'error:' not in cold
          audit((root/'source-axioms.log').read_text(),[
            'originalSource48K_skew_complex_gamma_covariance',
            'originalSource48K_skew_bracket_complex_gamma_covariance'])
          audit((root/'consumer.log').read_text(),[
            'originalSource48K_skew_complex_gamma_covariance_consumer',
            'originalSource48K_skew_bracket_complex_gamma_covariance_consumer'])
          print('BFSS_W0C2B2_E1_ORIGINAL_SOURCE_BRACKET_GAMMA_2_SOURCE_2_CONSUMER_2_CONTROLS_6_MUTANTS_STRICT_GREEN')
          PY
      - name: Upload original E1 provider evidence for independent RED or GREEN archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-w0c2b2-e1-original-evidence
          path: /home/runner/work/_temp/bfss-w0c2b2-e1/
          retention-days: 14
          if-no-files-found: warn
