name: BFSS community-aligned Kotler spin-plane proof

on:
  push:
    branches:
      - integration/community-20261027-bfss
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/SpinPlaneCovariance.lean
      - .github/workflows/bfss-spin-plane-covariance-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out community-aligned owner branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reclaim runner disk before Mathlib dependency bootstrap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Install upstream-pinned Lean 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/SpinPlaneCovariance.lean)" = 'c262821f5532953048c9b2f3ecfbc04fa3b73f43'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = '9882359ced78b0a3bd7e2f057974bd0a031b3e60'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/GammaWords.lean)" = 'd12051e70de679f5458dbd456667a32c7b407ce4'
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          lean --version
          lake --version

      - name: Fetch exact Mathlib source and precompiled cache
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 1320s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile unchanged upstream BFSS source dependencies
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mkdir -p .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS
          for source in Core GammaWords; do
            file="OAI/MathematicalPhysics/BFSS/$source"
            timeout 180s lake env lean -o ".lake/build/lib/lean/$file.olean" "$file.lean"
          done

      - name: Compile contributor module and check exact theorem axioms
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          file=OAI/MathematicalPhysics/BFSS/SpinPlaneCovariance
          timeout 180s lake env lean -o ".lake/build/lib/lean/$file.olean" "$file.lean" 2>&1 | tee /tmp/bfss-spin-plane-axioms.log
          test -s ".lake/build/lib/lean/$file.olean"
          python3 - <<'PY'
          import re
          log=open('/tmp/bfss-spin-plane-axioms.log').read()
          found=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          expected=[
            "OAI.BFSSQuantum.AlgebraData.sourceGammaTwo_skew",
            "OAI.BFSSQuantum.AlgebraData.sourceSpinPlane_comm_gamma_i",
            "OAI.BFSSQuantum.AlgebraData.sourceSpinPlane_comm_gamma_j",
            "OAI.BFSSQuantum.AlgebraData.sourceSpinPlane_comm_gamma_remaining",
            "OAI.BFSSQuantum.AlgebraData.sourceSpinPlane_comm_gamma_all",
            "OAI.BFSSQuantum.AlgebraData.sourceSpinKineticCoefficient"]
          assert [n for n,_ in found] == expected, found
          allowed={'propext','Classical.choice','Quot.sound'}
          for name,axioms in found:
            assert {x.strip() for x in axioms.split(',')} <= allowed,(name,axioms)
          assert 'sorryAx' not in log and 'error:' not in log,log[-4000:]
          print("KOTLER_BFSS_SPIN_PLANE_COVARIANCE_PINNED_PASS")
          PY
