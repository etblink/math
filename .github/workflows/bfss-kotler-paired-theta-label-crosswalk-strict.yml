name: BFSS Kotler G1A paired label crosswalk strict qualification
on:
  push:
    branches:
      - integration/community-20261027-bfss
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2MixedProbe.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2MixedDiagProbe.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2MixedAllProbe.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2IndexedProbe.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2ThetaProbe.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2PairedThetaLabelCrosswalkProbe.lean
      - .github/workflows/bfss-kotler-paired-theta-label-crosswalk-strict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-label-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = '9882359ced78b0a3bd7e2f057974bd0a031b3e60'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2ImagProbe.lean)" = '71e0002c8e1f23a1522abd301bdc7f50a3b58214'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2MixedProbe.lean)" = '526abb5d59547075709a52c1e0d44a30a8b5222f'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2MixedDiagProbe.lean)" = 'd9d137fb01ae96d3d4828337a079aae861246508'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2MixedAllProbe.lean)" = '71a174e955b5849e0309af15ddf2f2af437a4e2f'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2IndexedProbe.lean)" = 'ff91c3e92369b7abd9cb861ec1cbbbd91f8d2293'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2B2ThetaProbe.lean)" = 'bc8fc9209fa2b907f0b372300868bc730b5fb5bd'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2PairedThetaLabelCrosswalkProbe.lean)" = 'f3a2b41f902a20f6fe237ecce18dd7e869e9c45e'
      - name: Prepare pinned Lean environment
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
      - name: Build actual thetaCandidate and source ancestors
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2FermionF2B2ThetaProbe
      - name: Compile source-exact G1A index bridge and check four roots
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2PairedThetaLabelCrosswalkProbe
          mkdir -p .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          timeout 750s lake env lean -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee /tmp/paired-crosswalk-strict.log
          test -s ".lake/build/lib/lean/${target}.olean"
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/paired-crosswalk-strict.log').read_text()
          source = pathlib.Path('OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2PairedThetaLabelCrosswalkProbe.lean').read_text()
          requested = re.findall(r'^#print axioms (\S+)', source, re.M)
          actual = re.findall(r"(?ms)^'([^'\n]+)' depends on axioms: \[([^]]*)\]", log)
          warnings = re.findall(r'(?m)^[^\n]*\.lean:\d+:\d+: warning:', log)
          assert 'error:' not in log and 'sorryAx' not in log and not warnings, (warnings, log[-4000:])
          expected = ['pairedToOldLabel_correct', 'pairedTheta_eq_reindexed_old',
                      'pairedTheta_CAR', 'pairedTheta_selfAdjoint']
          assert requested == expected and len(actual) == len(expected), (requested, actual)
          for (declaration, dependencies), name in zip(actual, expected):
              assert declaration == 'FCP.BFSSPairedThetaLabelCrosswalk.' + name, (declaration, name)
              used = {part.strip() for part in dependencies.split(',') if part.strip()}
              assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, (declaration, used)
          print('KOTLER_BFSS_PAIRED_LABEL_CROSSWALK_FOUR_ROOTS_STRICT_PASS')
          PY
