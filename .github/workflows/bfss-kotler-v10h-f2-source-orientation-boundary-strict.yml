name: BFSS V10H F2 exact source Spin9 paired48 SO orientation boundary strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe.lean
      - .github/workflows/bfss-kotler-v10h-f2-source-orientation-boundary-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-paired48-so-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify accepted F1 and exact F2 source, pinned original ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f2/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OriginalPaired48DeterminantTransferProbe.lean")" = '1f71be97fb11a01022257b791ab38863de4407b5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HTypedDeterminantFixture.lean")" = '87b5e9ef8a241c6f16e488e4355d3aca12ff519a'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe.lean")" = '612d68edfdddedadfa80b780c1e4768bd7bc0ecd'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe.lean').read_text()
          names=["pairedDetSquareOne","pairedSO_iff_gammaDetOne","pairedSO_iff_gammaSO"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s)) == 1,n
          assert s.count('#print axioms ') == 3
          assert 'pairedDetEqualGamma' in s
          assert 'gammaDetSquareOne' in s
          assert 'Matrix.mem_specialOrthogonalGroup_iff' in s
          assert 'source9SpinGammaDetHom_apply' not in s
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('V10H_F2_SOURCE_EXACT_ORIENTATION_BOUNDARY_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F1 minimal typed determinant ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HTypedDeterminantFixture

      - name: Fresh F2 original Spin9 paired48 SO-boundary compile warningAsError
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f2/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f2/compiler.log")" -eq 3

      - name: Independently elaborate exact F2 three types and audit root axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F2_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (g : spinGroup source9Quadratic) :
              ((((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ)).det) ^ 2 = 1 :=
            pairedDetSquareOne g
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) ∈
                Matrix.specialOrthogonalGroup Source48Label ℝ ↔
                (((source9SpinGammaOrthogonalHom g) : GammaMatrix).det) = 1 :=
            pairedSO_iff_gammaDetOne g
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) ∈
                Matrix.specialOrthogonalGroup Source48Label ℝ ↔
              ((source9SpinGammaOrthogonalHom g) : GammaMatrix) ∈
                Matrix.specialOrthogonalGroup SpinIndex ℝ :=
            pairedSO_iff_gammaSO g
          #print axioms FCP.BFSSPairedSpin9DetFixture.pairedDetSquareOne
          #print axioms FCP.BFSSPairedSpin9DetFixture.pairedSO_iff_gammaDetOne
          #print axioms FCP.BFSSPairedSpin9DetFixture.pairedSO_iff_gammaSO
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F2_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f2/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f2'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["pairedDetSquareOne","pairedSO_iff_gammaDetOne","pairedSO_iff_gammaSO"]}
          assert len(reports)==3 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F2_SOURCE_ORIENTATION_3_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler, and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f2-original-paired48-so-iff-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f2
          if-no-files-found: warn
