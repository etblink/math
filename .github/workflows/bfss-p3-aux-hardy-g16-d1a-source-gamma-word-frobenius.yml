name: BFSS G16 D1A original gamma word Frobenius strict diagnostic
'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16SourceGammaWordFrobenius.lean
      - lean/diagnostics/BFSSP3AuxHardyG16SourceGammaWordFrobeniusIndependentConsumer.lean
      - .github/workflows/bfss-p3-aux-hardy-g16-d1a-source-gamma-word-frobenius.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-g16-d1a-20261115
  cancel-in-progress: true
jobs:
  original-gamma-word-frobenius:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen original G15 source ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 128
          persist-credentials: false
      - name: Preflight exact original source closure and five native controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-g16-d1a-evidence
          git rev-parse HEAD > bfss-g16-d1a-evidence/tested-sha.txt
          python3 - <<'PY' | tee bfss-g16-d1a-evidence/preflight.log
          from pathlib import Path
          import hashlib,json,re,subprocess
          BASE="4d45f9c3bd1b3b2e94c7d23e2576a8fb87a65166"
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16SourceGammaWordFrobenius.lean"
          CONSUMER="lean/diagnostics/BFSSP3AuxHardyG16SourceGammaWordFrobeniusIndependentConsumer.lean"
          SOURCE_SHA="3956f0a3f62164a0ae1245beb0c0f07e034e60cb"
          CONSUMER_SHA="f3e6866f90f282f19a347bc6c2ffd288f43585d0"
          ROOTS=["FCP.BFSSP3AuxHardyG16SourceGammaWordFrobenius.originalGamma_frobenius_word","FCP.BFSSP3AuxHardyG16SourceGammaWordFrobenius.originalGamma_frobenius_self","FCP.BFSSP3AuxHardyG16SourceGammaWordFrobenius.originalGamma_frobenius_cross","OAI.BFSSGamma.trace_reverseWord_word"]
          FROZEN={
           "lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
           "lean/OAI/MathematicalPhysics/BFSS/GammaWords.lean":"d12051e70de679f5458dbd456667a32c7b407ce4",
           "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15OriginalTauCoefficientNormReduction.lean":"1a6765a57f4dcea2a1d7f05ac5d37dbbade9bdfc",
           "lean/diagnostics/BFSSP3AuxHardyG15OriginalTauCoefficientNormReductionIndependentConsumer.lean":"fe33403df207a37deb495efb99a63814583f1951",
           ".github/workflows/bfss-p3-aux-hardy-g15-original-tau-coefficient-norm-reduction-strict.yml":"8a54f68795fccb16775ee2fbf1650ccdc2f5e659",
           "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16FourPlaneIncidenceDiagnostic.lean":"a4e71f5d41e505a93e4e7cb70494d4c0a8e774cd",
           "lean/diagnostics/BFSSP3AuxHardyG16FourPlaneIncidenceIndependentConsumer.lean":"959e0b5936b81d6d039028fd4d7047b253829a82",
           ".github/workflows/bfss-p3-aux-hardy-g16-d0-finite-plane-incidence.yml":"2b3d689ca7f2cb97b69f18d01ea8728666ae06a6"
          }
          def git(*args):return subprocess.check_output(["git",*args],text=True).strip()
          assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
          assert git("hash-object","--no-filters",SOURCE)==SOURCE_SHA
          assert git("hash-object","--no-filters",CONSUMER)==CONSUMER_SHA
          for p,h in FROZEN.items():assert git("hash-object","--no-filters",p)==h,("accepted donor drift",p)
          baseline={}
          for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
              m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
              if m: baseline[m[2]]=m[1]
          seen={}
          stack=[SOURCE,CONSUMER]
          while stack:
              p=stack.pop()
              if p in seen:continue
              assert Path(p).is_file(),("missing source",p)
              h=git("hash-object","--no-filters",p)
              if p not in (SOURCE,CONSUMER):
                  assert baseline.get(p)==h,("reviewed original-source drift",p,baseline.get(p),h)
              seen[p]=h
              for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",Path(p).read_text()):
                  for name in names.split("--",1)[0].split():
                      if name=="OAI" or name.startswith("OAI."):
                          stack.append("lean/"+name.replace(".","/")+".lean")
          src=Path(SOURCE).read_text()
          control=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^import (\S+)$",src)==[
              "OAI.MathematicalPhysics.BFSS.Core","OAI.MathematicalPhysics.BFSS.GammaWords"]
          assert re.findall(r"(?m)^import (\S+)$",control)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG16SourceGammaWordFrobenius",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",control)==ROOTS
          assert len(re.findall(r"(?m)^example\b",control))==5
          for text in (src,control):
              assert "set_option autoImplicit false" in text
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",text)
              assert "maxHeartbeats" not in text and "maxRecDepth" not in text
              assert "set_option linter" not in text
          assert "pairedAlgebraData" not in src and "pairedAlgebraData" in control
          assert "trace_reverseWord_word" in src and "list_transpose" in src
          assert "originalHardyY" not in src and "originalHardyY" not in control
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(v["rev"] for v in packages if v["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          d={"status":"PREFLIGHT_NOT_D1A_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
              "base":BASE,"source_blob":SOURCE_SHA,"consumer_blob":CONSUMER_SHA,
              "roots":ROOTS,"examples":5,"pin_count":len(seen),"pins":dict(sorted(seen.items())),
              "frozen_accepted_sha":FROZEN}
          p=Path("bfss-g16-d1a-evidence/pin-manifest.json")
          p.write_text(json.dumps(d,sort_keys=True,indent=2)+"\n")
          print("BFSS_G16_D1A_PREFLIGHT_PASS",len(seen),hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Restore exact Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee ../bfss-g16-d1a-evidence/cache.log
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native original source and five independent paired controls
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG16SourceGammaWordFrobenius"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16SourceGammaWordFrobenius.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG16SourceGammaWordFrobenius.olean"
          rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
          timeout 3600s lake build "$mod" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe 2>&1 | tee ../bfss-g16-d1a-evidence/build.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-g16-d1a-evidence/source.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG16SourceGammaWordFrobeniusIndependentConsumer.lean 2>&1 | tee ../bfss-g16-d1a-evidence/consumer.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("../bfss-g16-d1a-evidence")
          roots=["FCP.BFSSP3AuxHardyG16SourceGammaWordFrobenius.originalGamma_frobenius_word","FCP.BFSSP3AuxHardyG16SourceGammaWordFrobenius.originalGamma_frobenius_self","FCP.BFSSP3AuxHardyG16SourceGammaWordFrobenius.originalGamma_frobenius_cross","OAI.BFSSGamma.trace_reverseWord_word"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in (("build.log",None),("source.log",roots),("consumer.log",roots)):
              content=(d/name).read_text()
              assert not any(s in content for s in ("error:","sorryAx","unknownIdentifier")),(name,content[-4000:])
              assert not [l for l in content.splitlines() if "warning:" in l and not depwarn.fullmatch(l)],name
              if expected:
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",content)
                  assert [a for a,_ in reports]==expected,(name,reports)
                  for _,raw in reports:assert {z.strip() for z in raw.split(",") if z.strip()}<=allowed,(name,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
              "status":"G16_D1A_SOURCE_GAMMA_WORD_FROBENIUS_DIAGNOSTIC_GREEN",
              "source_roots":3,"independent_examples":5,"donor_trace_reports":1,
              "original_AlgebraData_gamma_word_Frobenius_verified":True,
              "originalHardyY_ordinal_word_adapter_verified":False,
              "full_G16_coefficient_quadratic_verified":False,
              "physical_Spin9_or_Hardy_verified":False
          },indent=2,sort_keys=True)+"\n")
          print("BFSS_G16_D1A_SOURCE_GAMMA_WORD_FROBENIUS_DIAGNOSTIC_GREEN")
          PY
      - name: Preserve first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-g16-d1a-frobenius-evidence
          path: bfss-g16-d1a-evidence/
          if-no-files-found: warn
          retention-days: 14
