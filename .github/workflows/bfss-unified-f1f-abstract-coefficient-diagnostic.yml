name: BFSS F1F original Fock coordinate-plane specialization diagnostic

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientModuleDiagnostic.lean
      - lean/diagnostics/BFSSF1FAbstractCoefficientOriginalFockAudit.lean
      - lean/diagnostics/BFSSF1FAbstractFockInstanceBoundary.lean
      - lean/diagnostics/BFSSF1FAbstractFockCompactNamedSumBoundary.lean
      - lean/diagnostics/BFSSF1FAbstractFockOriginalThetaNamedCompactBoundary.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCompactCoefficientLinearMapCandidate.lean
      - lean/diagnostics/BFSSF1FOriginalThetaCompactCandidateIndependentAudit.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientMatrixUnitDiagnostic.lean
      - lean/diagnostics/BFSSF1FAbstractMatrixUnitIndependentAudit.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCoordinatePlaneCompactBridgeDiagnostic.lean
      - lean/diagnostics/BFSSF1FOriginalThetaCoordinatePlaneCompactBridgeIndependentAudit.lean
      - lean/diagnostics/BFSSF1FAbstractFockArbitraryFamilyBoundary.lean
      - lean/diagnostics/BFSSF1FAbstractFockNamedThetaBoundary.lean
      - .github/workflows/bfss-unified-f1f-abstract-coefficient-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-unified-f1f-abstract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abstract-coefficient-original-fock:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout exact pinned proof inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Freeze original F1A-F1F and abstract/Fock boundary diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bfss-f1f-abstract"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/tested-commit.txt"
          python3 - <<'PY'
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkg=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in pkg if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientModuleDiagnostic.lean":"55b7efec8a2e4d3f66fc6c3bbc2ce2e2414e7b34","lean/diagnostics/BFSSF1FAbstractCoefficientOriginalFockAudit.lean":"ba5f5d5dbbf14c10b8e43b658ff5dc6b19640775","lean/diagnostics/BFSSF1FAbstractFockInstanceBoundary.lean":"c616aa4a7be7df3f1b091df4218caa54ad1923b9","lean/diagnostics/BFSSF1FAbstractFockCompactNamedSumBoundary.lean":"1eb16366010fb9c422f2e1d30bd5ed0e16184dc9","lean/diagnostics/BFSSF1FAbstractFockOriginalThetaNamedCompactBoundary.lean":"c16559b961b046dd8738bc592bd6dd147faca3ae","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCompactCoefficientLinearMapCandidate.lean":"0353d64fe30d03b9c664267c2f0cab72df05ae16","lean/diagnostics/BFSSF1FOriginalThetaCompactCandidateIndependentAudit.lean":"af613f8c5553fce584ff12cf6bd762a545584d06","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientMatrixUnitDiagnostic.lean":"3d509236cd0bf33b2d45fff8ded46358d21735a1","lean/diagnostics/BFSSF1FAbstractMatrixUnitIndependentAudit.lean":"dc9951bd2ac71d051cf3a515d5f6ceb0fabba207","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCoordinatePlaneCompactBridgeDiagnostic.lean":"5604fb3ba00162c6f0e1abe5b15fd7142b16857f","lean/diagnostics/BFSSF1FOriginalThetaCoordinatePlaneCompactBridgeIndependentAudit.lean":"8c10b0fe5173a32ce4f33115414534aee9f50b54","lean/diagnostics/BFSSF1FAbstractFockArbitraryFamilyBoundary.lean":"e4de03e3b3b36b8a86336b080e0985ce0e6063a4","lean/diagnostics/BFSSF1FAbstractFockNamedThetaBoundary.lean":"ab2863b2515f853ca539ce3452bc406b7e6e5bac","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean":"3454f95cae979cc5aea9a8059882fe0ac346d0fc","lean/diagnostics/BFSSF1FOriginalThetaMatrixLinearMapIndependentAudit.lean":"9254f862a145583f34dfaa8e9d452612f61c63d1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1EOriginalThetaCoordinatePlaneMatrixAction.lean":"5c0c95e89ddc09b34d628dde3801e4a12ac98c53","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1DOriginalThetaBivectorAllLabelAction.lean":"b8cb1f81839cd3b26a05f949cc26e8bc88ebfbf0","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1COriginalThetaBivectorThirdLabelCommutator.lean":"c56d3da8e89aa6cd428854003d94ff843c33af75","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1BOriginalThetaBivectorSkewAdjoint.lean":"75cdfab1c25e961ba777c9788e77a3e6e4ee6d70","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1AOriginalThetaBivectorCommutator.lean":"1b91182135d53026ae0ece8f2f85da52ccbc6f58","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2FermionF2Probe.lean":"93d7ae00d4ee21ce59ab137c349590e2c496ff38"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          generic=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientModuleDiagnostic.lean").read_text()
          audit=Path("lean/diagnostics/BFSSF1FAbstractCoefficientOriginalFockAudit.lean").read_text()
          probe_instances=Path("lean/diagnostics/BFSSF1FAbstractFockInstanceBoundary.lean").read_text()
          probe_compact=Path("lean/diagnostics/BFSSF1FAbstractFockCompactNamedSumBoundary.lean").read_text()
          probe_theta_compact=Path("lean/diagnostics/BFSSF1FAbstractFockOriginalThetaNamedCompactBoundary.lean").read_text()
          candidate=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCompactCoefficientLinearMapCandidate.lean").read_text()
          independent=Path("lean/diagnostics/BFSSF1FOriginalThetaCompactCandidateIndependentAudit.lean").read_text()
          unit_source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientMatrixUnitDiagnostic.lean").read_text()
          unit_audit=Path("lean/diagnostics/BFSSF1FAbstractMatrixUnitIndependentAudit.lean").read_text()
          plane_source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCoordinatePlaneCompactBridgeDiagnostic.lean").read_text()
          plane_audit=Path("lean/diagnostics/BFSSF1FOriginalThetaCoordinatePlaneCompactBridgeIndependentAudit.lean").read_text()
          probe_arbitrary=Path("lean/diagnostics/BFSSF1FAbstractFockArbitraryFamilyBoundary.lean").read_text()
          probe_named=Path("lean/diagnostics/BFSSF1FAbstractFockNamedThetaBoundary.lean").read_text()
          prod=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaMatrixFiniteCoefficientLinearMap.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",generic)==[
              "Mathlib.Data.Matrix.Basis","Mathlib.Algebra.Module.BigOperators","Mathlib.Basic.Real.Basic"]
          assert re.findall(r"(?m)^import (\S+)$",audit)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction"]
          assert re.findall(r"(?m)^import (\S+)$",probe_instances)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction"]
          assert re.findall(r"(?m)^#synth (.+)$",probe_instances)==[
              "Fintype Source48Label","AddCommMonoid FockOp","Module ℝ FockOp"]
          assert "(ι := Source48Label) (M := FockOp)" in probe_instances
          assert "F1F_B0_ORIGINAL_FOCK_INSTANCES_AND_PARTIAL_SPECIALIZATION_COMPLETE" in probe_instances
          assert re.findall(r"(?m)^import (\S+)$",probe_compact)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",probe_compact)==[
              "arbitraryFockFamily_apply_compact"]
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in probe_compact
          assert "Source48Label" in probe_compact and "(1 / 2 : ℝ) • rawCoefficientSum T A" in probe_compact
          assert "halfCoefficientLinearMap_apply (ι := Source48Label) (M := FockOp) T A" in probe_compact
          assert "majoranaCandidate" not in probe_compact and "∑" not in probe_compact
          assert re.findall(r"(?m)^import (\S+)$",probe_theta_compact)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",probe_theta_compact)==[
              "originalThetaPairFamily_apply","originalThetaPairFamily_compact"]
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in probe_theta_compact
          assert "Source48Label → Source48Label → FockOp" in probe_theta_compact
          assert "fun p q => majoranaCandidate p * majoranaCandidate q" in probe_theta_compact
          assert "(1 / 2 : ℝ) • rawCoefficientSum originalThetaPairFamily A" in probe_theta_compact
          assert "∑" not in probe_theta_compact
          assert re.findall(r"(?m)^import (\S+)$",candidate)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction"]
          assert re.findall(r"(?m)^import (\S+)$",independent)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaCompactCoefficientLinearMapCandidate"]
          expected_new=["originalSourceThetaPairFamily","originalSourceThetaPairFamily_apply","originalSourceThetaCompactCoefficientLinearMap"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",candidate)==expected_new
          assert re.findall(r"(?m)^#print axioms (\S+)$",independent)==expected_new
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in candidate
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in independent
          assert "fun p q => majoranaCandidate p * majoranaCandidate q" in candidate
          assert "halfCoefficientLinearMap originalSourceThetaPairFamily" in candidate
          assert "theorem originalSourceThetaCompactCoefficientLinearMap_add" not in candidate
          assert "theorem originalSourceThetaCompactCoefficientLinearMap_smul" not in candidate
          assert "theorem originalSourceThetaCompactCoefficientLinearMap_apply" not in candidate
          assert "originalSource48CoordinatePlane p q" in independent
          assert "majoranaCandidate p * majoranaCandidate q" in independent
          assert "∑" not in candidate and "∑" not in independent
          assert re.findall(r"(?m)^import (\S+)$",unit_source)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic"]
          assert re.findall(r"(?m)^import (\S+)$",unit_audit)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientMatrixUnitDiagnostic"]
          expected_unit=[
              "rawCoefficientSum_matrixUnit",
              "halfCoefficientLinearMap_matrixUnit",
              "halfCoefficientLinearMap_skewPlane"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",unit_source)==expected_unit
          assert re.findall(r"(?m)^#print axioms (\S+)$",unit_audit)==[
              "FCP.BFSSF1FAbstractMatrixUnits."+x for x in expected_unit]
          assert "Matrix.single p q (1 : ℝ)" in unit_source
          assert "Matrix.single q p (1 : ℝ)" in unit_source
          assert "(1 / 2 : ℝ) •" in unit_source
          assert "Fin 2 → Fin 2 → ℝ" in unit_audit
          assert "majoranaCandidate" not in unit_source
          assert "Fermion" not in unit_source
          assert re.findall(r"(?m)^import (\S+)$",plane_source)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientMatrixUnitDiagnostic",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaCompactCoefficientLinearMapCandidate"]
          assert re.findall(r"(?m)^import (\S+)$",plane_audit)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaCoordinatePlaneCompactBridgeDiagnostic"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",plane_source)==[
              "originalThetaFamily_halfMap_sourcePlane"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",plane_audit)==[
              "FCP.BFSSF1FOriginalThetaCoordinatePlaneCompactBridge.originalThetaFamily_halfMap_sourcePlane"]
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in plane_source
          assert "originalSource48CoordinatePlane p q" in plane_source
          assert "originalSource48CoordinatePlane p q" in plane_audit
          assert "halfCoefficientLinearMap originalSourceThetaPairFamily" in plane_source
          assert "originalSourceThetaPairFamily p q" in plane_source
          assert "originalSourceThetaPairFamily q p" in plane_source
          assert "(1 / 2 : ℝ) •" in plane_source
          assert "∑" not in plane_source and "∑" not in plane_audit
          assert "originalSourceThetaCompactCoefficientLinearMap" not in plane_source
          for name,code,roots in [
              ("arbitrary",probe_arbitrary,["arbitraryFockFamily_apply_expanded"]),
              ("named",probe_named,["namedOriginalThetaFamily_apply_expanded",
                                    "inlineOriginalThetaFamily_apply_expanded"])]:
              assert re.findall(r"(?m)^import (\S+)$",code)==[
                  "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic",
                  "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction"],name
              assert re.findall(r"(?m)^#print axioms (\S+)$",code)==roots,name
              assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in code,name
              assert "Source48Label" in code and "(1 / 2 : ℝ) •" in code,name
              if name=="named":
                  assert "majoranaCandidate p * majoranaCandidate q" in code
          assert re.findall(r"(?m)^#print axioms (\S+)$",generic)==["rawCoefficientSum_add","rawCoefficientSum_smul","rawCoefficientLinearMap","halfCoefficientLinearMap","halfCoefficientLinearMap_apply","halfCoefficientLinearMap_apply_expanded"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",audit)==["originalFockHalfCoefficientMap","originalFockHalfCoefficientMap_add","originalFockHalfCoefficientMap_smul","originalFockHalfCoefficientMap_apply"]
          for name,code in [("generic",generic),("consumer",audit),("instances",probe_instances),("compact",probe_compact),("theta-compact",probe_theta_compact),("source-candidate",candidate),("independent-candidate",independent),("matrix-units",unit_source),("matrix-audit",unit_audit),("source-plane",plane_source),("independent-plane",plane_audit),("arbitrary",probe_arbitrary),("named",probe_named)]:
              assert [x for x in code.splitlines() if x.startswith("set_option ")]==["set_option autoImplicit false"],name
              cleaned=re.sub(r"/-.*?-/", "", code, flags=re.S)
              cleaned=re.sub(r"--[^\n]*","",cleaned)
              assert not re.search(r"\b(?:sorry|admit|axiom|unsafe|native_decide|maxRecDepth|maxHeartbeats)\b",cleaned),name
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in audit
          assert "private abbrev FockOp := Fermion 2 →L[ℂ] Fermion 2" in prod
          assert "majoranaCandidate p * majoranaCandidate q" in audit
          assert "majoranaCandidate p * majoranaCandidate q" in prod
          assert "(1 / 2 : ℝ) •" in audit and "(1 / 2 : ℝ) •" in prod
          evidence=Path(os.environ["RUNNER_TEMP"])/"bfss-f1f-abstract"
          for path in [*pins,"lean/lean-toolchain","lean/lake-manifest.json","lean/lakefile.lean",".github/workflows/bfss-unified-f1f-abstract-coefficient-diagnostic.yml"]:
              dst=evidence/"inputs"/path
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path,dst)
          (evidence/"input-pins.json").write_text(json.dumps({
              path:{"sha256":hashlib.sha256(Path(path).read_bytes()).hexdigest(),
                    "blob":subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()}
              for path in [*pins,"lean/lean-toolchain","lean/lake-manifest.json","lean/lakefile.lean",".github/workflows/bfss-unified-f1f-abstract-coefficient-diagnostic.yml"]
          },indent=2)+"\n")
          print("F1F_ABSTRACT_SYMBOLIC_AND_ORIGINAL_FOCK_EXACT_INPUT_PREFLIGHT_PASS")
          PY

      - name: Restore unchanged pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          for attempt in 1 2 3 4; do
            if (curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
                sh -s -- -y --default-toolchain none) 2>&1 |
                tee -a "$RUNNER_TEMP/bfss-f1f-abstract/elan-bootstrap.log"; then
              echo "ELAN_BOOTSTRAP_PASS_ATTEMPT_${attempt}" | tee -a "$RUNNER_TEMP/bfss-f1f-abstract/elan-bootstrap.log"
              break
            fi
            if (( attempt == 4 )); then
              echo "ELAN_BOOTSTRAP_FAILED_AFTER_RETRIES" | tee -a "$RUNNER_TEMP/bfss-f1f-abstract/elan-bootstrap.log"
              exit 1
            fi
            sleep $((15 * attempt))
          done
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Stage A cold compile abstract module with no BFSS imports
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientModuleDiagnostic 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/abstract-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientModuleDiagnostic.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/abstract-axioms.log"

      - name: Stage A2 symbolic matrix-unit/skew-plane evaluation and independent consumer
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FAbstractCoefficientMatrixUnitDiagnostic 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/matrix-unit-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FAbstractCoefficientMatrixUnitDiagnostic.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/matrix-unit-source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSF1FAbstractMatrixUnitIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/matrix-unit-independent-audit.log"

      - name: Stage B compact B0 B1a B1b and original source candidate independent audit
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3450s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1EOriginalThetaCoordinatePlaneMatrixAction 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/original-ancestry-build.log"
          # Boundary B0: inspect only the FockOp and label instances, plus the
          # theorem's partially specialized type (no finite-sum equality).
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -Ddiagnostics=true diagnostics/BFSSF1FAbstractFockInstanceBoundary.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/b0-instance-synthesis.log"
          # B1a: only the *named* coefficient sum, never evaluate the old
          # expanded-sum B1/B2/B3 red experiments in this scoped gate.
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -Ddiagnostics=true diagnostics/BFSSF1FAbstractFockCompactNamedSumBoundary.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/b1a-compact-named-sum.log"
          # B1b: use the original ordered theta products but KEEP the sum
          # named; first verify source product pointwise, then compact map.
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -Ddiagnostics=true diagnostics/BFSSF1FAbstractFockOriginalThetaNamedCompactBoundary.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/b1b-original-theta-named.log"
          # New source candidate is a bona fide original-Fock LinearMap,
          # NOT a qualification of the frozen literal production F1F map.
          timeout 600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaCompactCoefficientLinearMapCandidate 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/compact-candidate-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCompactCoefficientLinearMapCandidate.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/compact-source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSF1FOriginalThetaCompactCandidateIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/compact-independent-audit.log"

      - name: Stage C original Fock source skew-plane specialization and independent audit
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.F1FOriginalThetaCoordinatePlaneCompactBridgeDiagnostic 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/original-source-plane-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -Ddiagnostics=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/F1FOriginalThetaCoordinatePlaneCompactBridgeDiagnostic.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/original-source-plane-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -Ddiagnostics=true diagnostics/BFSSF1FOriginalThetaCoordinatePlaneCompactBridgeIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/bfss-f1f-abstract/original-source-plane-independent.log"

      - name: Fail closed on 23 exact generic and source plane axiom reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-f1f-abstract"
          expected={"b0-instance-synthesis.log":[],"abstract-axioms.log":["FCP.BFSSF1FAbstractCoefficient.rawCoefficientSum_add","FCP.BFSSF1FAbstractCoefficient.rawCoefficientSum_smul","FCP.BFSSF1FAbstractCoefficient.rawCoefficientLinearMap","FCP.BFSSF1FAbstractCoefficient.halfCoefficientLinearMap","FCP.BFSSF1FAbstractCoefficient.halfCoefficientLinearMap_apply","FCP.BFSSF1FAbstractCoefficient.halfCoefficientLinearMap_apply_expanded"],"b1a-compact-named-sum.log":["FCP.BFSSF1FAbstractFockCompactBoundary.arbitraryFockFamily_apply_compact"],"b1b-original-theta-named.log":["FCP.BFSSF1FAbstractFockOriginalThetaCompact.originalThetaPairFamily_apply","FCP.BFSSF1FAbstractFockOriginalThetaCompact.originalThetaPairFamily_compact"],"compact-source-axioms.log":["FCP.BFSSF1FOriginalThetaCompactCandidate.originalSourceThetaPairFamily","FCP.BFSSF1FOriginalThetaCompactCandidate.originalSourceThetaPairFamily_apply","FCP.BFSSF1FOriginalThetaCompactCandidate.originalSourceThetaCompactCoefficientLinearMap"],"compact-independent-audit.log":["FCP.BFSSF1FOriginalThetaCompactCandidate.originalSourceThetaPairFamily","FCP.BFSSF1FOriginalThetaCompactCandidate.originalSourceThetaPairFamily_apply","FCP.BFSSF1FOriginalThetaCompactCandidate.originalSourceThetaCompactCoefficientLinearMap"],"matrix-unit-source-axioms.log":["FCP.BFSSF1FAbstractMatrixUnits.rawCoefficientSum_matrixUnit","FCP.BFSSF1FAbstractMatrixUnits.halfCoefficientLinearMap_matrixUnit","FCP.BFSSF1FAbstractMatrixUnits.halfCoefficientLinearMap_skewPlane"],"matrix-unit-independent-audit.log":["FCP.BFSSF1FAbstractMatrixUnits.rawCoefficientSum_matrixUnit","FCP.BFSSF1FAbstractMatrixUnits.halfCoefficientLinearMap_matrixUnit","FCP.BFSSF1FAbstractMatrixUnits.halfCoefficientLinearMap_skewPlane"],"original-source-plane-axioms.log":["FCP.BFSSF1FOriginalThetaCoordinatePlaneCompactBridge.originalThetaFamily_halfMap_sourcePlane"],"original-source-plane-independent.log":["FCP.BFSSF1FOriginalThetaCoordinatePlaneCompactBridge.originalThetaFamily_halfMap_sourcePlane"]}
          allowed={"propext","Classical.choice","Quot.sound"}
          package_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          roots={}
          for path,names in expected.items():
              text=(root/path).read_text()
              for token in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
                  assert token not in text,(path,token)
              warnings=[line for line in text.splitlines() if "warning:" in line]
              assert all(package_warning.fullmatch(line) for line in warnings),(path,warnings[:10])
              reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",text)
              assert [n for n,_ in reports]==names,(path,reports)
              for name,axioms in reports:
                  have={x.strip() for x in axioms.split(",") if x.strip()}
                  assert have<=allowed,(name,have)
                  roots[name]=sorted(have)
          b0=(root/"b0-instance-synthesis.log").read_text()
          assert b0.splitlines().count("F1F_B0_ORIGINAL_FOCK_INSTANCES_AND_PARTIAL_SPECIALIZATION_COMPLETE")==1
          for path in ("abstract-build.log","matrix-unit-build.log","original-ancestry-build.log","compact-candidate-build.log","original-source-plane-build.log"):
              text=(root/path).read_text()
              assert "error:" not in text and "sorryAx" not in text,path
          receipt={"status":"ORIGINAL_FOCK_SOURCE_PLANE_ONLY_PASS","tested_commit":(root/"tested-commit.txt").read_text().strip(),
                   "roots":roots,"production_F1F_qualified":False,
                   "scope":"Accepted B0/B1a/B1b, genuine source compact LinearMap, abstract matrix-unit/skew-plane formulas, and separately specialized exact F1E original source plane identity for halfCoefficientLinearMap of named ordered original Majorana family. Equality to frozen literal production F1F and to concrete source map alias, and Spin/physical/spectral claims REMAIN OPEN."}
          (root/"diagnostic-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("F1F_ORIGINAL_FOCK_SOURCE_PLANE_BOUNDARY_PASS_NOT_PRODUCTION")
          PY

      - name: Preserve exact source inputs, failures, and component verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-f1f-abstract-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-f1f-abstract/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
