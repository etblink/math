name: BFSS V10H F10E original public real gamma trace-zero strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10e-public-gamma-trace-zero-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-public-gamma-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate original gamma and accepted F9 exact blobs; F10E public-source audit preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10e"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10e/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF9GeneratorDeterminantMagnitudeProbe.lean")" = '44493c4d9b72de2d2d84725768f8e2572ac91ed4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ExactGamma8PositiveAnchorProbe.lean")" = 'b9aec01f60966e4348faaa5d794c5f435d78c079'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10DOriginalGammaPrivateScopeMicroProbe.lean")" = '95c86b6bb5d5eda44552621bc3b8148560b47b31'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean').read_text()
          names=["source9OriginalGamma_basis_mul_self","source9OriginalGamma_anticommute","source9OriginalGamma_basis_trace_zero","gammaNineRealLinear_trace_zero"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
          assert s.count('#print axioms ')==4
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in code,'unhandled nested comment'
          for required in ['import Mathlib.LinearAlgebra.Matrix.Trace',
                           'gamma_clifford', 'Matrix.trace_mul_comm',
                           'source9OriginalGamma_basis_mul_self',
                           'Matrix.trace_sum', 'source9OriginalGamma_basis_trace_zero']:
              assert required in code, required
          assert 'import all ' not in code
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10E_PUBLIC_GAMMA_SOURCE_AND_FOUR_TYPES_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted exact original gamma F9 determinant-magnitude ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF9GeneratorDeterminantMagnitudeProbe

      - name: Fresh four F10E public original gamma trace proofs warning-as-error
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10e/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f10e/compiler.log")" -eq 4

      - name: Independently elaborate EXACT four public source gamma declarations and axiom whitelist
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10E_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe
          open FCP.BFSSGamma9
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSPairedSpin9Clifford
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (a : SpaceIndex) :
              gamma a * gamma a = (1 : GammaMatrix) :=
            source9OriginalGamma_basis_mul_self a
          noncomputable example (a b : SpaceIndex) (hab : a ≠ b) :
              gamma a * gamma b = -(gamma b * gamma a) :=
            source9OriginalGamma_anticommute a b hab
          noncomputable example (a : SpaceIndex) :
              Matrix.trace (gamma a) = 0 :=
            source9OriginalGamma_basis_trace_zero a
          noncomputable example (v : SpaceIndex → ℝ) :
              Matrix.trace (gammaNineRealLinear v) = 0 :=
            gammaNineRealLinear_trace_zero v
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OriginalGamma_basis_mul_self
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OriginalGamma_anticommute
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OriginalGamma_basis_trace_zero
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_trace_zero
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10E_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10e/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ["RUNNER_TEMP"])/"v10h-f10e"/"declaration-audit.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["source9OriginalGamma_basis_mul_self","source9OriginalGamma_anticommute","source9OriginalGamma_basis_trace_zero","gammaNineRealLinear_trace_zero"]}
          assert len(reports)==4 and {n for n,_ in reports}==expected,reports
          for n,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10E_ORIGINAL_GAMMA_FOUR_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve tested SHA, compiler failure and all independent declaration audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10e-original-public-trace-zero-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10e
          if-no-files-found: warn
