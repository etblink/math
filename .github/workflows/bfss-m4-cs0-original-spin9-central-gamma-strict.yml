name: BFSS M4 CS0 original Spin9 central active gamma sign strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CS0OriginalSpin9CentralGammaSign.lean
      - lean/diagnostics/BFSSP3M4CS0OriginalSpin9CentralGammaSignIndependentConsumer.lean
      - .github/workflows/bfss-m4-cs0-original-spin9-central-gamma-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-cs0-original-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-Fock-HS-isometry-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact unified integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact new source, original donors, independent consumer and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-cs0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-cs0/tested-commit.txt"
          python3 - <<'PY'
          import re,json,subprocess
          from pathlib import Path
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CS0OriginalSpin9CentralGammaSign.lean":"6b7e627d902f7f9c291cc54b1f3aa1e4dfd5bc1d",
            "lean/diagnostics/BFSSP3M4CS0OriginalSpin9CentralGammaSignIndependentConsumer.lean":"4daeae400a9f3105a2732450e10b1557bbe821cd",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB3OriginalFockStarAutomorphismAction.lean":"b50ef04695587b267ad8519074b1293f98828749",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6COriginalFockActiveGammaCovariance.lean":"2d6f777568b0026737112ff8256e5ed50fc9e6e6",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10UActualNegativeCentralSO48ImageProbe.lean":"353978608b978b00d0e36deb1c1a47c32641ea59",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48RealLinearGammaProbe.lean":"a9f446ea7986ca796c2f4b222a5ab710d98590cc",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for p,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert got==sha,(p,sha,got)
          p=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CS0OriginalSpin9CentralGammaSign.lean")
          s=p.read_text()
          c=Path("lean/diagnostics/BFSSP3M4CS0OriginalSpin9CentralGammaSignIndependentConsumer.lean").read_text()
          assertions=["originalSpin9Central_originalPairedOrthogonal_negativeOne",
            "originalSpin9Central_activeGamma_negative",
            "originalSpin9Central_activeGamma_negative_starAction",
            "originalSpin9Central_originalAxis_negative"]
          controls=["originalCentral_source48_vector_negative",
            "originalCentral_originalGamma_negative",
            "originalCentral_originalAxis_negative"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==assertions
          assert re.findall(r"(?m)^#print axioms (\S+)$",c)==controls
          assert "source9NegativeCentral_originalPairedSO48_image" not in s or "source9NegativeCentral" in s
          assert "source9Spin_originalFockOperatorAutomorphismHom_activeGamma" in s
          assert "Matrix.neg_mulVec" in s
          assert "set_option autoImplicit false" in s and "set_option autoImplicit false" in c
          assert "set_option maxHeartbeats 0" not in s and "set_option maxRecDepth" not in s
          for t in (s,c):
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",t)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in m["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_M4_CS0_SOURCE_DONORS_CONSUMER_PIN_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean 4.34.1 and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native source and independent source consumer with eight axiom reports
        shell: bash
        timeout-minutes: 57
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-cs0"
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4HS0OriginalSpin9FockHSIsometry"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CS0OriginalSpin9CentralGammaSign.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4HS0OriginalSpin9FockHSIsometry.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1900s lake build "$mod" 2>&1 | tee "$root/cold-native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee "$root/source-axioms.log"
          timeout 720s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4CS0OriginalSpin9CentralGammaSignIndependentConsumer.lean 2>&1 | tee "$root/independent-consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-cs0"
          allow={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("cold-native-source.log","source-axioms.log","independent-consumer.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-9000:])
              bad=[x for x in t.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
              assert not bad,(name,bad[:15])
          assert "Build completed successfully" in (root/"cold-native-source.log").read_text()
          for name,ct in (("source-axioms.log",4),("independent-consumer.log",3)):
              t=(root/name).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
              assert len(reports)==ct,(name,reports)
              for decl,raw in reports:
                  got={a.strip() for a in raw.split(",") if a.strip()}
                  assert got<=allow,(decl,got)
          print("BFSS_M4_CS0_ORIGINAL_FOCK_HS_ISOMETRY_4_SOURCE_3_CONSUMERS_STRICT_GREEN")
          PY
      - name: Preserve full source and independent consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-cs0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-cs0/
          if-no-files-found: warn
          retention-days: 14
