name: BFSS P3-AUX-HARDY-X0 original Xi norm and cutoff strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-aux-hardy-x0-original-xi-norm-cutoff-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyX0OriginalXiNormAndCutoff.lean
      - lean/diagnostics/BFSSP3AuxHardyX0OriginalXiNormAndCutoffIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-hardy-x0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-xi-norm-cutoff:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen source ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Preflight complete reviewed source closure and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfss-aux-hardy-x0-evidence
          git rev-parse HEAD > bfss-aux-hardy-x0-evidence/tested-sha.txt
          python3 - <<'PY' | tee bfss-aux-hardy-x0-evidence/preflight.log
          from pathlib import Path
          import subprocess,re,json,hashlib
          BASE="e406851deadc1d5b90ed2f609232d75ebb9e162e"
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyX0OriginalXiNormAndCutoff.lean"
          CONSUMER="lean/diagnostics/BFSSP3AuxHardyX0OriginalXiNormAndCutoffIndependentConsumer.lean"
          EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyX0OriginalXiNormAndCutoff.lean":"a84f1413524f894b364b1eb274f6d5edb47ad9f5","lean/diagnostics/BFSSP3AuxHardyX0OriginalXiNormAndCutoffIndependentConsumer.lean":"1c81d54d3d14c13d0b4bcaddea0a8602d20e73b8","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean":"cc01379653404c4ede3d551fd8d823e079543b21","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea"}
          ROOTS=["originalHardyXi","originalHardyXi_apply","originalHardyXi_norm_sq","originalHardyXi_sum_norm_sq","originalHardyXi_charge_realCutoff"]
          NAMESPACE="FCP.BFSSP3AuxHardyX0OriginalXiNormAndCutoff"
          DONORS=["OAI.BFSSQuantum.AlgebraData.cliffordLinear_norm_sq","OAI.BFSSQuantum.AlgebraData.principalSymbol_norm_sq","OAI.BFSSQuantum.AlgebraData.principalSymbol_unit_norm_sq","OAI.BFSSQuantum.AlgebraData.principalSymbol_basis_apply","OAI.BFSSQuantum.AlgebraData.charge_realCutoff"]
          def git(*a):
              return subprocess.check_output(["git",*a],text=True).strip()
          assert git("cat-file","-t",BASE)=="commit"
          assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
          baseline={}
          for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
              m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
              if m:
                  baseline[m[2]]=m[1]
          seen={}
          stack=[SOURCE,CONSUMER]
          while stack:
              p=stack.pop()
              if p in seen:
                  continue
              f=Path(p)
              assert f.is_file(),("missing OAI source",p)
              sha=git("hash-object","--no-filters",p)
              if p not in (SOURCE,CONSUMER):
                  assert baseline.get(p)==sha,("reviewed existing OAI source drift",p,baseline.get(p),sha)
              seen[p]=sha
              for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                  for name in names.split("--",1)[0].split():
                      if name=="OAI" or name.startswith("OAI."):
                          stack.append("lean/"+name.replace(".","/")+".lean")
          for p,sha in EXPECTED.items():
              assert seen.get(p)==sha,("frozen donor/candidate drift",p,seen.get(p),sha)
          source=Path(SOURCE).read_text()
          consumer=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==(
              [NAMESPACE+"."+x for x in ROOTS]+DONORS)
          assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.CliffordSymbols"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyX0OriginalXiNormAndCutoff","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxHeartbeats" not in code and "maxRecDepth" not in code
          assert "pairedAlgebraData" in consumer
          assert "originalHardyXi_charge_realCutoff pairedAlgebraData" in consumer
          assert "principalSymbolLinear" in consumer and "16 * ‖X‖ ^ 2" in consumer
          assert "hX : X ≠ 0" in consumer and "hv : v ≠ 0" in consumer
          assert "FullL2 2" in consumer and "Fermion 2" in consumer and "Boson 2" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in packages if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          out=Path("bfss-aux-hardy-x0-evidence")
          out.mkdir(exist_ok=True)
          receipt={"status":"PREFLIGHT_NOT_LEAN_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
              "reviewed_existing_source_baseline":BASE,"source":SOURCE,"consumer":CONSUMER,
              "transitive_OAI_pin_count":len(seen),"pins":dict(sorted(seen.items())),
              "source_roots":[NAMESPACE+"."+x for x in ROOTS],"independent_donor_roots":DONORS}
          manifest=out/"pin-manifest.json"
          manifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_HARDY_X0_PREFLIGHT_PASS",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-hardy-x0-evidence/cache.log
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold source and native Xi/cutoff consumer with five and ten root reports
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyX0OriginalXiNormAndCutoff"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyX0OriginalXiNormAndCutoff.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyX0OriginalXiNormAndCutoff.olean"
          rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
          timeout 3600s lake build "$mod" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe 2>&1 | tee ../bfss-aux-hardy-x0-evidence/build.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-aux-hardy-x0-evidence/source.log
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyX0OriginalXiNormAndCutoffIndependentConsumer.lean 2>&1 | tee ../bfss-aux-hardy-x0-evidence/consumer.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          d=Path("../bfss-aux-hardy-x0-evidence")
          new_roots=["FCP.BFSSP3AuxHardyX0OriginalXiNormAndCutoff.originalHardyXi","FCP.BFSSP3AuxHardyX0OriginalXiNormAndCutoff.originalHardyXi_apply","FCP.BFSSP3AuxHardyX0OriginalXiNormAndCutoff.originalHardyXi_norm_sq","FCP.BFSSP3AuxHardyX0OriginalXiNormAndCutoff.originalHardyXi_sum_norm_sq","FCP.BFSSP3AuxHardyX0OriginalXiNormAndCutoff.originalHardyXi_charge_realCutoff"]
          donors=["OAI.BFSSQuantum.AlgebraData.cliffordLinear_norm_sq","OAI.BFSSQuantum.AlgebraData.principalSymbol_norm_sq","OAI.BFSSQuantum.AlgebraData.principalSymbol_unit_norm_sq","OAI.BFSSQuantum.AlgebraData.principalSymbol_basis_apply","OAI.BFSSQuantum.AlgebraData.charge_realCutoff"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in [
              ("build.log",None),("source.log",new_roots),("consumer.log",new_roots+donors)]:
              log=(d/name).read_text()
              assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
              assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
              if expected is not None:
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [n for n,_ in reports]==expected,(name,reports,expected)
                  for declaration,raw in reports:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
              "status":"ORIGINAL_XI_NORM_CUTOFF_STRICT_GREEN",
              "original_native_SU2_Fock_SmoothCore_consumer":True,
              "literal_principal_symbol_Xi_binding":True,
              "source_CAR_half_per_row_and_eight_total":True,
              "actual_charge_realCutoff_phase_binding":True,
              "origin_and_wrong_factor_sixteen_controls":True,
              "new_roots":5,"independent_donor_roots":5,
              "new_Clifford_or_Fock_model":False,
              "tau_algebra_or_physical_Spin9_proved":False,
              "Hardy_fidelity_zero_mode_or_gap_proved":False},sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_AUX_HARDY_X0_ORIGINAL_XI_NORM_CUTOFF_STRICT_GREEN")
          PY
      - name: Preserve strict and first-causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-aux-hardy-x0-evidence
          path: bfss-aux-hardy-x0-evidence/
          if-no-files-found: warn
          retention-days: 14
