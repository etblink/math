          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10CKOrthogonalCompletionCoordinates.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10CKIndependentAudit.lean').read_text()
          names=["source9OrthogonalCompletionMap", "source9OrthogonalCompletionMap_zero", "source9Matrix_perturbation_gram_identity", "source9Orthogonal_perturbation_gram_zero", "source9OrthogonalCompletionMap_on_orthogonal", "source9OrderedUpperProjection_eq_iff_strict_entries", "source9OrthogonalCompletionMap_eq_of_upperProjection_eq", "source9OrthogonalCompletionMap_actual_reconstruction"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          for text in [s,audit]:
              assert text.count('#print axioms ')==len(names)
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'\b(if_pos|if_neg|dif_pos|dif_neg)\b',code)
              assert not re.search(r'(?m)^(?:local )?(?:noncomputable )?instance\b|attribute\s+\[(?:local )?instance',code)
              assert all(t not in code for t in ['Source48Label','NormedRing','GammaMatrix','SpinIndex','ChartedSpace','LieGroup'])
          assert 'NormedAddCommGroup.induced' not in s and 'NormedSpace.induced' not in s
          assert 'TopologicalSpace.induced' not in s
          for t in ['source9OrthogonalCompletionMap (B : Matrix SpaceIndex SpaceIndex ℝ)',
                    'if i < j then B i j', 'B i j + (B.transpose * B) i j',
                    '(1 + B).transpose * (1 + B) - 1',
                    "Matrix.mem_orthogonalGroup_iff'.1 hA",
                    'source9StrictPlaneMatrix (fun p : source9StrictPlaneIndex => A p.val.1 p.val.2)',
                    'source9StrictPlaneEnumeration.apply_symm_apply p',
                    'source9SpinCoordinateReconstruction_upperCoordinates g hg',
                    '(source9SpinVectorOrthogonalHom g).property hc']:
              assert t in s,t
          for t in ['auditCompletionMatrixTopology := rfl',
                    '∑ k : SpaceIndex, B k i * B k j',
                    'private theorem auditCompletionActualReconstruction_eq',
                    'source9OrthogonalCompletionMap_actual_reconstruction g hg',
                    'private theorem auditCompletion_negativeIdentity_zero',
                    '¬ Function.Injective source9OrthogonalCompletionMap',
                    'norm_num at hentry']:
              assert t in audit,t
          print('V10H_F10CK_SOURCE_PIN_ORTHOGONAL_COMPLETION_COORDINATES_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted CJ ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10CJCoordinateReconstructionDomain

      - name: Fresh F10CK orthogonal completion coordinates warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10CKOrthogonalCompletionCoordinates
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10ck/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently check native Gram identities actual reconstruction and noninjectivity control
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10CKIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10ck/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10CKIndependentAudit.lean "$RUNNER_TEMP/v10h-f10ck/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10CKOrthogonalCompletionCoordinates.lean "$RUNNER_TEMP/v10h-f10ck/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9OrthogonalCompletionMap", "source9OrthogonalCompletionMap_zero", "source9Matrix_perturbation_gram_identity", "source9Orthogonal_perturbation_gram_zero", "source9OrthogonalCompletionMap_on_orthogonal", "source9OrderedUpperProjection_eq_iff_strict_entries", "source9OrthogonalCompletionMap_eq_of_upperProjection_eq", "source9OrthogonalCompletionMap_actual_reconstruction"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10ck'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10CK_ORTHOGONAL_COMPLETION_COORDINATES_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10CK audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10ck-orthogonal-completion-coordinates-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10ck
          if-no-files-found: warn
