name: BFSS M4 W0C2B0M R2 strict GREEN original evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0m-r2-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-w0c2b0m-r2-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable original GREEN proof and existing RED evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Preflight strict proven R2 carrier and historical failure integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0MOriginalFockComplexNestedCoefficientR2.lean)" = b98cc05a012c98da8016496492d77135fc58ebc8
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0MOriginalFockComplexNestedCoefficientIndependentConsumerR2.lean)" = dcbba93f72feb4f60912521f666d748bcf2e1687
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0m-r2-original-complex-nested-strict.yml)" = 61f2cc992208fb31dfad2740e76425fe4d3c9962
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R1_44252646318_NATIVE_RED_evidence.zip)" = 277b934810e6a999c974917d23a199ccd0be3ddd
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44254608894_PREFLIGHT_RED_evidence.zip)" = 3e7266878a5eb46fffb753dc852032fc1a196581
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B0M','R2','PENDING_STRICT_CI',False)
          assert q['gate']=='P3-M4-W0C2A' and q['run_id']==44213315719
          assert len(s['accepted_anchors'])==24 and s['accepted_anchors'][-1]==q
          assert s['previous_active_W0C2B0M_R1_NATIVE_RED']['run_id']==44252646318
          assert s['w0c2b0m_r2_first_preflight_red']['run_id']==44254608894
          assert s['previous_active_W0C2B0_R2_stopped']['native_red_count']==2
          root=Path('research/quantum-information/diagnostics')
          for name in ('BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip',
                       'BFSS_W0C2B0M_R2_44255202048_complete_job.log',
                       'BFSS_W0C2B0M_R2_44255202048_GREEN_evidence_manifest.json'):
              assert not (root/name).exists(),name
          print('BFSS_W0C2B0M_R2_ORIGINAL_GREEN_EVIDENCE_ARCHIVE_PREFLIGHT_PASS')
          PY
      - name: Validate provider-original ZIP and full job log with per-member SHA and CRC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44255202048;job=134635125149;artifact=14405953184
          tested='ec27f66e865af66bca6064a2fd219038e359364c'
          size=4080;digest='fb4cfc3b3b098941576ebdb42650ae0e2abd3dc7996538bf79201ebbc91bf7cd'
          marker='BFSS_W0C2B0M_R2_ORIGINAL_COMPLEX_NESTED_2_SOURCE_2_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN'
          roots=['originalFock_complex_nested_coefficient_compose','originalFock_complex_nested_coefficient_bracket']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return json.load(response)
          ri=getjson(f'{prefix}/actions/runs/{run}')
          ji=getjson(f'{prefix}/actions/jobs/{job}')
          ai=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert ri['head_sha']==tested and ri['run_attempt']==1 and ri['conclusion']=='success' and ri['status']=='completed'
          assert ji['id']==job and ji['run_id']==run and ji['conclusion']=='success'
          for phrase in ('Preflight original complex carrier','Restore pinned Lean','Cold original complex nested','Preserve exact original proof'):
              assert any(s['name'].startswith(phrase) and s['conclusion']=='success' for s in ji['steps']),phrase
          assert ai['id']==artifact and ai['size_in_bytes']==size and ai['digest']=='sha256:'+digest
          assert ai['workflow_run']['id']==run and ai['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log','auditor.log'}
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(content,names):
              assert 'sorryAx' not in content and 'error:' not in content
              matches=pat.findall(content)
              assert len(matches)==len(names),(matches,names)
              assert [n.rsplit('.',1)[-1] for n,_ in matches]==names,matches
              for _,ax in matches:assert {s.strip() for s in ax.split(',') if s.strip()}<=allowed
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected,z.namelist()
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B0M_R2_ORIGINAL_FOCK_EXPLICIT_MODULE_REPAIR_AND_FROZEN_R1_RED_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (8964 jobs)' in cold
              assert 'error:' not in cold and 'sorryAx' not in cold
              audit(z.read('source-axioms.log').decode(),roots)
              audit(z.read('consumer.log').decode(),[n+'_consumer' for n in roots])
              assert marker in z.read('auditor.log').decode()
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(expected)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>50000 and marker.encode() in full
          assert b'Build completed successfully (8964 jobs)' in full
          assert b'Artifact ID 14405953184' in full
          root=Path('research/quantum-information/diagnostics')
          root.mkdir(parents=True,exist_ok=True)
          archive=root/'BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip'
          log=root/'BFSS_W0C2B0M_R2_44255202048_complete_job.log'
          manifest=root/'BFSS_W0C2B0M_R2_44255202048_GREEN_evidence_manifest.json'
          for p in (archive,log,manifest):assert not p.exists(),p
          archive.write_bytes(raw);log.write_bytes(full)
          manifest.write_text(json.dumps({
              'gate':'P3-M4-W0C2B0M','attempt':'R2','status':'ORIGINAL_STRICT_GREEN_PENDING_CANONICAL_ACCEPTANCE',
              'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
              'original_zip':{'path':str(archive),'size':size,'sha256':digest,'members':members},
              'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'b98cc05a012c98da8016496492d77135fc58ebc8',
              'consumer_blob':'dcbba93f72feb4f60912521f666d748bcf2e1687',
              'workflow_blob':'61f2cc992208fb31dfad2740e76425fe4d3c9962',
              'source_reports':2,'consumer_reports':2,'original_fock_controls':2,
              'negative_auditor_mutants':6,'cold_build_jobs':8964,
              'allowed_axioms':sorted(allowed),'strict_marker':marker,
              'preserved_original_r1_native_red':44252646318,
              'preserved_original_r2_preflight_red':44254608894,
              'last_qualified_predecessor':44213315719,
              'claim_ceiling':'Complex original Fock finite index coefficient action only; full original K Lie bracket and gamma centrality remain unproved'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B0M_R2_ORIGINAL_STRICT_GREEN_ZIP_FULL_LOG_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin exact original ZIP full job transcript and SHA CRC manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0M_R2_44255202048_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0M_R2_44255202048_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS W0C2B0M R2: preserve original strict GREEN ZIP full log and per-member hashes'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
