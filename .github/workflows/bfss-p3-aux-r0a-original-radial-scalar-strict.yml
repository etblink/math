name: BFSS P3-AUX-R0A original radial scalar strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-aux-r0a-original-radial-scalar-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0AOriginalRadialScalar.lean
      - lean/diagnostics/BFSSP3AuxR0AOriginalRadialScalarIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-r0a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-radial-scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Frozen source, toolchain and root preflight
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bfss-p3-aux-r0a"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/tested-sha.txt"
          python3 - <<'PY' | tee "$RUNNER_TEMP/bfss-p3-aux-r0a/preflight.log"
          from pathlib import Path
          import subprocess, json, re
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0AOriginalRadialScalar.lean")
          con=Path("lean/diagnostics/BFSSP3AuxR0AOriginalRadialScalarIndependentConsumer.lean")
          core="lean/OAI/MathematicalPhysics/BFSS/Core.lean"
          git=lambda *args: subprocess.check_output(["git",*args],text=True).strip()
          base="30af6302979e25fbb4ad72b584b85034bc6f96d9"
          assert subprocess.run(["git","merge-base","--is-ancestor",base,"HEAD"]).returncode==0
          assert git("hash-object","--no-filters",core)=="9882359ced78b0a3bd7e2f057974bd0a031b3e60"
          assert git("show",base+":lean/lean-toolchain")=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          roots=["originalRadialWeight_sq","originalRadialWeight_pos","originalRadialWeight_ge","originalRadialWeight_inv_le","originalRadialWeight_complex_mul_inv"]
          s=src.read_text()
          c=con.read_text()
          assert src.is_file() and con.is_file()
          assert re.findall(r"(?m)^#print axioms ([^\s]+)$",s)==roots
          assert re.findall(r"(?m)^#print axioms ([^\s]+)$",c)==["FCP.BFSSP3AuxR0AOriginalRadialScalar."+x for x in roots]
          for t in (s,c):
            assert "set_option autoImplicit false" in t
            assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",t)
          assert "Boson 2" in s and "OriginalChargeOutput" in s
          assert "PiLp 2" in c and "FullL2 2" in c
          print("BFSS_P3_AUX_R0A_PREFLIGHT_PASS",git("rev-parse","HEAD"))
          PY
      - name: Restore pinned Lean and Mathlib cache
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-p3-aux-r0a/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold build original scalar source and independent consumer
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          e="$RUNNER_TEMP/bfss-p3-aux-r0a"
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxR0AOriginalRadialScalar"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0AOriginalRadialScalar.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 3100s lake build "$mod" 2>&1 | tee "$e/build.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj"             OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxR0AOriginalRadialScalar.lean             2>&1 | tee "$e/source-axioms.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true             diagnostics/BFSSP3AuxR0AOriginalRadialScalarIndependentConsumer.lean             2>&1 | tee "$e/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import re,os,json
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-p3-aux-r0a"
          names=["originalRadialWeight_sq","originalRadialWeight_pos","originalRadialWeight_ge","originalRadialWeight_inv_le","originalRadialWeight_complex_mul_inv"]
          prefix="FCP.BFSSP3AuxR0AOriginalRadialScalar."
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for file,expected in [("build.log",None),("source-axioms.log",names),("independent-consumer.log",[prefix+n for n in names])]:
            t=(d/file).read_text()
            assert "error:" not in t and "sorryAx" not in t, (file,t[-3500:])
            extra=[x for x in t.splitlines() if "warning:" in x and not depwarn.fullmatch(x)]
            assert not extra,(file,extra[:8])
            if expected is not None:
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
              got=[n for n,_ in reports]
              assert got == ([prefix+n for n in expected] if file=="source-axioms.log" else expected),(file,got)
              for n,axs in reports:
                assert {a.strip() for a in axs.split(",") if a.strip()} <= allowed,(n,axs)
          (d/"scope.json").write_text(json.dumps({"scalar_original_boson_weight":True,"uniform_inverse_bound":True,"original_PiLp_output_anchored":True,"Lp_multiplier_constructed":False,"weighted_charge_operator_constructed":False,"dense_weighted_domain":False,"auxiliary_H_or_gap":False},indent=2))
          print("BFSS_P3_AUX_R0A_ORIGINAL_RADIAL_SCALAR_STRICT_GREEN")
          PY
      - name: Preserve exact proof receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p3-aux-r0a-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-p3-aux-r0a/
          if-no-files-found: warn
          retention-days: 14
