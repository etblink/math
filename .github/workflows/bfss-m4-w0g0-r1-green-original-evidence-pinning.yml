name: BFSS W0G0 R1 provider-original generic GREEN evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0g0-r1-green-original-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-generic-source-green:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact qualified W0G0 pending branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify unchanged original generic source, consumer and frozen native W0B1 STOP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0G0GenericScalarActionAdapter.lean)" = ff4f7f2a123e5b554ef08f09bffbcd9eec0c1a32
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0G0GenericScalarActionIndependentConsumer.lean)" = b1e2d8077f798c4b9526ddb61b9a50b58c093474
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0g0-generic-scalar-commute-strict.yml)" = dee2c3f91077e4fcf89b370745fffecd68f963c0
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0G0_R1_44134589228_PREFLIGHT_RED_evidence.zip)" = 49bfe05f74a3afa2a167e45d4b178438c2c8390b
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          q,a=s["last_qualified"],s["active"]
          assert q["gate"]=="P3-M4-W0B0" and q["run_id"]==44109519633 and q["status"]=="GREEN_QUALIFIED"
          assert q["evidence_archive_blob"]=="abbebbf9e7d2eeefeeef901a415030e09551c2d6"
          assert a["gate"]=="P3-M4-W0G0" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="ff4f7f2a123e5b554ef08f09bffbcd9eec0c1a32"
          assert a["consumer_blob"]=="b1e2d8077f798c4b9526ddb61b9a50b58c093474"
          assert a["workflow_blob"]=="dee2c3f91077e4fcf89b370745fffecd68f963c0"
          assert a["contract_commit"]=="41411b859527fa3501aa857c1106e336b04adca7"
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert s["previous_active_W0B1_R2_stopped"]["run_id"]==44127193329
          assert s["previous_active_W0B1_R1_RED"]["run_id"]==44117272657
          assert s["w0g0_preflight_r1"]["run_id"]==44134589228
          assert s["w0g0_preflight_r1"]["status"]=="PREFLIGHT_ONLY_RED"
          assert s["next_planned"]["gate"]=="P3-M4-W0H0" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert not Path("research/quantum-information/diagnostics/BFSS_M4_W0G0_R1_44135729729_GREEN_evidence.zip").exists()
          PY
      - name: Download exact provider-original ZIP and audit cold proof, consumer and all six mutations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          artifact=14351389019
          run=44135729729
          job=134224620570
          tested="0f5324182bfd3200b5eb7198cabdb0723fea842b"
          digest="4624751eec2ac6e549e9bf0faeb4a33963ad78eab7bfe383e2dc7302cc3561f4"
          size=2047
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{artifact}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as res:
              meta=json.load(res)
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          def download(u):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(u,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response: return response.read()
              else:
                  with response: return response.read()
          raw=download(url+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          expected={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={"propext","Classical.choice","Quot.sound"}
          def audit(t,names):
              assert "error:" not in t and "sorryAx" not in t
              found=pat.findall(t)
              assert len(found)==len(names),(found,names)
              assert [a.rsplit(".",1)[-1] for a,_ in found]==names,found
              for _,axioms in found:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==expected
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert "BFSS_W0G0_W0B0_GREEN_W0B1_R1_R2_STOP_ORIGINAL_EVIDENCE_PREFLIGHT_PASS" in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (1042 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert "BFSS_W0G0_2_GENERIC_SOURCE_2_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),["generic_scalarImage_commutes","generic_algEquiv_scalarImage_commutes"])
              audit(z.read("consumer.log").decode(),["generic_scalarImage_commutes_consumer","generic_algEquiv_scalarImage_commutes_consumer"])
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/etblink/math/actions/jobs/{job}/logs")
          assert len(log)>10000 and b"Build completed successfully (1042 jobs)." in log
          assert b"BFSS_W0G0_2_GENERIC_SOURCE_2_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in log
          assert b"BFSS_W0G0_W0B0_GREEN_W0B1_R1_R2_STOP_ORIGINAL_EVIDENCE_PREFLIGHT_PASS" in log
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0G0_R1_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0G0_R1_{run}_complete_job.log"
          manifest=root/f"BFSS_W0G0_R1_{run}_GREEN_evidence_manifest.json"
          for path in (archive,full,manifest): assert not path.exists(),path
          archive.write_bytes(raw)
          full.write_bytes(log)
          record={
            "gate":"P3-M4-W0G0","attempt":"R1","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(full),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
            "source_blob":"ff4f7f2a123e5b554ef08f09bffbcd9eec0c1a32",
            "consumer_blob":"b1e2d8077f798c4b9526ddb61b9a50b58c093474",
            "workflow_blob":"dee2c3f91077e4fcf89b370745fffecd68f963c0",
            "source_reports":2,"consumer_reports":2,"independent_controls":2,
            "negative_mutants":6,"cold_build_jobs":1042,
            "allowed_axioms":["propext","Classical.choice","Quot.sound"],
            "predecessor_qualified_run":44109519633,
            "stopped_original_source_red_runs":[44117272657,44127193329],
            "harness_only_red_run":44134589228
          }
          manifest.write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0G0_R1_GREEN_PROVIDER_ORIGINAL_REHASH_PASS",json.dumps(record,sort_keys=True))
          PY
      - name: Git-pin exact six-member provider GREEN ZIP, complete log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0G0_R1_44135729729_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0G0_R1_44135729729_complete_job.log research/quantum-information/diagnostics/BFSS_W0G0_R1_44135729729_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0G0_R1_44135729729_GREEN_evidence.zip | tr -d ' ')" = 2047
          git commit -m "BFSS W0G0: preserve six-member original generic GREEN ZIP and complete CI job log"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
