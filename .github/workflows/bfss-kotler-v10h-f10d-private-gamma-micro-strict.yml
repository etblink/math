name: BFSS V10H F10D original gamma private scope TWO-CELL strict diagnostic
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10DOriginalGammaPrivateScopeMicroProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10d-private-gamma-micro-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-private-scope-two-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify qualified F9, original exact gamma and two-cell diagnostic blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10d"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10d/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF9GeneratorDeterminantMagnitudeProbe.lean")" = '44493c4d9b72de2d2d84725768f8e2572ac91ed4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ExactGamma8PositiveAnchorProbe.lean")" = 'b9aec01f60966e4348faaa5d794c5f435d78c079'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10DOriginalGammaPrivateScopeMicroProbe.lean")" = '95c86b6bb5d5eda44552621bc3b8148560b47b31'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10DOriginalGammaPrivateScopeMicroProbe.lean').read_text()
          names=["originalGamma8_entry00","originalGamma8_entry88"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+n+r'\b',s))==1,n
          assert s.count('#print axioms ')==2
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in code
          assert 'import all OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2RealGammaProbe' in code
          assert 'gamma (8 : SpaceIndex)' in code
          assert 'Matrix.map_apply' in code
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats|maxRecDepth)',code)
          print('V10H_F10D_SOURCE_EXACT_TWO_CELL_PRIVATE_SCOPE_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F9 original gamma source ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF9GeneratorDeterminantMagnitudeProbe

      - name: Fresh F10D TWO original gamma entries warning-as-error compile
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10DOriginalGammaPrivateScopeMicroProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10d/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f10d/compiler.log")" -eq 2

      - name: Independently elaborate exact two matrix entries and reject all extra axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10D_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10DOriginalGammaPrivateScopeMicroProbe
          open FCP.BFSSGamma9
          open FCP.BFSSPairedSpin9DetFixture
          open OAI.BFSSQuantum
          noncomputable example :
              (gamma (8 : SpaceIndex)) (0 : SpinIndex) (0 : SpinIndex) =
                (1 : ℝ) :=
            originalGamma8_entry00
          noncomputable example :
              (gamma (8 : SpaceIndex)) (8 : SpinIndex) (8 : SpinIndex) =
                (-1 : ℝ) :=
            originalGamma8_entry88
          #print axioms FCP.BFSSPairedSpin9DetFixture.originalGamma8_entry00
          #print axioms FCP.BFSSPairedSpin9DetFixture.originalGamma8_entry88
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10D_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10d/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ["RUNNER_TEMP"])/"v10h-f10d"/"declaration-audit.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.originalGamma8_entry00','FCP.BFSSPairedSpin9DetFixture.originalGamma8_entry88'}
          assert len(reports)==2 and {n for n,_ in reports}==expected,reports
          for name,axioms in reports:
              assert set(a.strip() for a in axioms.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10D_EXACT_TWO_MATRIX_ENTRY_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve tested SHA, first compiler error and independent audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10d-private-scope-two-cell-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10d
          if-no-files-found: warn
