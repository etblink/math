        (d/"helper-scope.json").write_text(json.dumps({"status":"GENERIC_FINITE_OPERATOR_EVALUATION_PASS","native_G15_qualification":False},sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G15_FINITE_OPERATOR_EVALUATION_PASS")
        PY
