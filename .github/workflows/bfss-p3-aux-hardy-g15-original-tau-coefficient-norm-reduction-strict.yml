name: BFSS P3-AUX-HARDY-G15 original tau coefficient norm reduction strict
'on':
  push:
    branches:
    - integration/bfss-unified-research-20261108
    paths:
    - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15OriginalTauCoefficientNormReduction.lean
    - lean/diagnostics/BFSSP3AuxHardyG15OriginalTauCoefficientNormReductionIndependentConsumer.lean
    - .github/workflows/bfss-p3-aux-hardy-g15-original-tau-coefficient-norm-reduction-strict.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-hardy-g15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-tau-coefficient-norm-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout frozen source ancestry
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 96
        persist-credentials: false
    - name: Preflight complete reviewed source closure and toolchain
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bfss-aux-hardy-g15-evidence
        git rev-parse HEAD > bfss-aux-hardy-g15-evidence/tested-sha.txt
        python3 - <<'PY' | tee bfss-aux-hardy-g15-evidence/preflight.log
        from pathlib import Path
        import subprocess,re,json,hashlib
        BASE="3e2cc5da7a2e0965f158c0683acc774bcf1a81b8"
        SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15OriginalTauCoefficientNormReduction.lean"
        CONSUMER="lean/diagnostics/BFSSP3AuxHardyG15OriginalTauCoefficientNormReductionIndependentConsumer.lean"
        HELPER="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean"
        CONTROL_HELPER="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.lean"
        EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG6OriginalCorePotentialBinding.lean": "ebe37de869b25068dfedb98c60340a27335e5c04", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.lean": "6d0f99d61340b6a052e733c0b964b8c4dcf69457", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9BSourcePairAndChargeReductionProbe.lean": "e066601ddb02e78493eb91582ce2dcb0e6fa3ca1", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9COrderedPairCoefficientProbe.lean": "1010bbfc6618718d98fbaf8cab065f4478759f94", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean": "cc0f4624239160dc39a7a191a519786e71df6abd", "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60", "lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean": "cc01379653404c4ede3d551fd8d823e079543b21", "lean/OAI/MathematicalPhysics/BFSS/Kinetic.lean": "14045947b1860b28cbbd82c3f2b40967e795d5a8", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG4OriginalPotentialYCancellation.lean": "b2a482d0817fd39e7437a77d66d8f911c7073de3", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5OriginalPotentialTauCAR.lean": "9ada3167a5de3be647c51f0740b5998d4e6ea45a", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean": "0398bafa58b46dfbd83ec90a65be84adb03dedf8", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG7OriginalTauSmoothCore.lean": "d7320101971790d7fe56bfda1b011ae3e5d1b9d9", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean": "03b5236bd91e4664e7101544b065054bd6c925a1", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean": "138ab7f545bf00812a55d1cb035251a9eccb6c27", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean": "b7d518b9f4a6ffb4acfaa4f265416a0b3aeccc68", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9OriginalYEntryDerivativeBinding.lean": "59a1360ee22b9ffa24fdcf018d9c9299a0b9ce11", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.lean": "e7904e1edf3af664b3900c31c0757412d495d60c", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG10OriginalKineticTauCAR.lean": "59aaed1da894e8b91b2df51eda6f47a37cf4c517", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.lean": "fae4dc32dee27c5542f7fffddf217b276ed2bfef", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12OriginalDerivativeFockBilinear.lean": "f6296a909dcd84a9800012f18f55f7005866cb59", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12FiniteCoefficientContraction.lean": "2c0b07a603a94ad18342a53a5d88eaad5345cb5d", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15OriginalTauCoefficientNormReduction.lean": "1a6765a57f4dcea2a1d7f05ac5d37dbbade9bdfc", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG13OriginalCoreKineticTauAssembly.lean": "b112d763fe63a864e3b2ed72f551a521995b42b3", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG14OriginalCoreAnticommutatorCollapse.lean": "ef1fd6b67dd01c4dc893ef683ab7c75db44973c5", "lean/diagnostics/BFSSP3AuxHardyG15OriginalTauCoefficientNormReductionIndependentConsumer.lean": "7e873eae9001339a0f746637b9ac906311ec106b", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15RealCoefficientSumDiagnostic.lean": "732cee2546bfd629fe8bf0b20e63ac3ef356b5bd"}
        REPAIR_HELPER="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15RealCoefficientSumDiagnostic.lean"
        REPAIR_ROOTS=["FCP.BFSSP3AuxHardyG15RealCoefficientSumDiagnostic.realCoefficient_sum_smul", "FCP.BFSSP3AuxHardyG15RealCoefficientSumDiagnostic.realCoefficient_doubleSum"]
        DIAGNOSTIC_BASE="337f33b74ae6bc0fecce598ae52c1612c7d25413"
        ROOTS=["originalHardyTau_sq", "originalHardyTau_selfAdjoint", "originalHardyTau_norm_sq", "originalHardyTau_sum_norm_sq", "originalHardyTau_fourPlane_sum_eq_cliffordLinear", "originalHardyTau_fourPlane_sum_norm_sq"]
        NAMESPACE="FCP.BFSSP3AuxHardyG15OriginalTauCoefficientNormReduction"
        DONORS=["OAI.BFSSQuantum.AlgebraData.cliffordLinear_sq", "OAI.BFSSQuantum.AlgebraData.cliffordLinear_selfAdjoint", "OAI.BFSSQuantum.AlgebraData.cliffordLinear_norm_sq", "OAI.BFSSQuantum.AlgebraData.cliffordLinear_mixed", "FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyTauCore_apply", "FCP.BFSSP3AuxHardyG14OriginalCoreAnticommutatorCollapse.originalChargeTauCore_sum_apply"]
        CONTROL_ROOTS=["FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM", "FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntryCLM_apply", "FCP.BFSSP3AuxHardyG9ComplexMatrixEntryDerivative.complexMatrixEntry_fderiv_apply"]
        COEFF_HELPER="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12FiniteCoefficientContraction.lean"
        COEFF_ROOTS=["FCP.BFSSP3AuxHardyG12FiniteCoefficientContraction.finiteOperatorCoefficientContraction"]
        def git(*a):
            return subprocess.check_output(["git",*a],text=True).strip()
        assert git("cat-file","-t",BASE)=="commit"
        assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
        assert git("cat-file","-t",DIAGNOSTIC_BASE)=="commit"
        assert subprocess.run(["git","merge-base","--is-ancestor",DIAGNOSTIC_BASE,"HEAD"]).returncode==0
        assert git("rev-parse",DIAGNOSTIC_BASE+":"+REPAIR_HELPER)==EXPECTED[REPAIR_HELPER]
        baseline={}
        for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
            m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
            if m: baseline[m[2]]=m[1]
        seen={}
        stack=[SOURCE,CONSUMER,HELPER,CONTROL_HELPER,COEFF_HELPER,REPAIR_HELPER]
        while stack:
            p=stack.pop()
            if p in seen: continue
            f=Path(p)
            assert f.is_file(),("missing OAI source",p)
            sha=git("hash-object","--no-filters",p)
            if p not in (SOURCE,CONSUMER,CONTROL_HELPER,COEFF_HELPER,REPAIR_HELPER):
                assert baseline.get(p)==sha,("reviewed existing OAI source drift",p,baseline.get(p),sha)
            seen[p]=sha
            for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                for name in names.split("--",1)[0].split():
                    if name=="OAI" or name.startswith("OAI."):
                        stack.append("lean/"+name.replace(".","/")+".lean")
        for p,sha in EXPECTED.items():
            assert seen.get(p)==sha,("frozen donor/candidate drift",p,seen.get(p),sha)
        assert len(seen)==170,("unexpected original-source closure",len(seen))
        source=Path(SOURCE).read_text()
        consumer=Path(CONSUMER).read_text()
        helper=Path(HELPER).read_text()
        control=Path(CONTROL_HELPER).read_text()
        coefficient=Path(COEFF_HELPER).read_text()
        repair=Path(REPAIR_HELPER).read_text()
        assert re.findall(r"(?m)^import (\S+)$",helper)==["Mathlib"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",helper)==["FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply"]
        assert re.findall(r"(?m)^import (\S+)$",control)==["Mathlib"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",control)==CONTROL_ROOTS
        assert "pairedAlgebraData" not in control and "OAI.BFSSQuantum" not in control
        assert "Complex.ofRealCLM.comp" in control and "ContinuousLinearMap.proj" in control
        assert "ContinuousLinearMap.fderiv" in control
        assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG14OriginalCoreAnticommutatorCollapse","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG15RealCoefficientSumDiagnostic"]
        assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG15OriginalTauCoefficientNormReduction","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
        assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[NAMESPACE+"."+n for n in ROOTS]+DONORS
        for code in (source,consumer,helper,control,coefficient,repair):
            assert "set_option autoImplicit false" in code
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
            assert "maxHeartbeats" not in code and "maxRecDepth" not in code
        assert re.findall(r"(?m)^import (\S+)$",coefficient)==["Mathlib"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",coefficient)==COEFF_ROOTS
        assert "pairedAlgebraData" not in coefficient and "OAI.BFSSQuantum" not in coefficient
        assert "Finset.sum_comm" in coefficient and "Finset.sum_smul" in coefficient
        assert re.findall(r"(?m)^import (\S+)$",repair)==["Mathlib"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",repair)==REPAIR_ROOTS
        assert "pairedAlgebraData" not in repair and "OAI.BFSSQuantum" not in repair
        assert "realCoefficient_doubleSum b" in source
        assert "M.cliffordLinear_sq" in source and "M.cliffordLinear_selfAdjoint" in source
        assert "M.cliffordLinear_norm_sq" in source
        assert "originalHardyTau_fourPlane_sum_eq_cliffordLinear" in source
        assert "Fin 4 → SpaceIndex" in source and "∑ t : Fin 4, originalHardyY" in source
        assert "(1 / 2 : ℝ)" in source and "p.2 α p.1) ^ 2" in source
        assert "pairedAlgebraData" in consumer and "Fermion 2" in consumer and "FullL2 2" in consumer
        assert "generalize (0 : Boson 2) = X" in consumer
        assert "(fun _ => i) (fun _ => j)" in consumer
        assert "originalChargeTauCore_sum_apply pairedAlgebraData" in consumer
        assert len(re.findall(r"(?m)^example\b",consumer))==12
        assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
        packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
        assert next(v["rev"] for v in packages if v["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
        out=Path("bfss-aux-hardy-g15-evidence")
        receipt={"status":"PREFLIGHT_NOT_LEAN_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
            "reviewed_existing_source_baseline":BASE,"source":SOURCE,"consumer":CONSUMER,
            "isolated_helper":HELPER,"entry_derivative_helper":CONTROL_HELPER,"entry_derivative_roots":CONTROL_ROOTS,
            "coefficient_helper":COEFF_HELPER,"coefficient_helper_roots":COEFF_ROOTS,
            "repair_helper":REPAIR_HELPER,"repair_helper_roots":REPAIR_ROOTS,"accepted_diagnostic_run":43756234296,
            "transitive_OAI_pin_count":len(seen),"pins":dict(sorted(seen.items())),
            "source_roots":[NAMESPACE+"."+n for n in ROOTS],"independent_donor_roots":DONORS}
        manifest=out/"pin-manifest.json"
        manifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G15_PREFLIGHT_PASS",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())
        PY
    - name: Restore pinned Lean and Mathlib
      shell: bash
      timeout-minutes: 40
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
        curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        source "$HOME/.elan/env"
        cd lean
        timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-hardy-g15-evidence/cache.log
        test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
        test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
    - name: Isolated qualified real coefficient sum helper before native build
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        timeout 500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG15RealCoefficientSumDiagnostic 2>&1 | tee ../bfss-aux-hardy-g15-evidence/repair-helper-build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15RealCoefficientSumDiagnostic.olean OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG15RealCoefficientSumDiagnostic.lean 2>&1 | tee ../bfss-aux-hardy-g15-evidence/repair-helper.log
        python3 - <<'PY'
        from pathlib import Path
        import json,re
        d=Path("../bfss-aux-hardy-g15-evidence")
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        logs=[('repair-helper-build.log', None), ('repair-helper.log', ['FCP.BFSSP3AuxHardyG15RealCoefficientSumDiagnostic.realCoefficient_sum_smul', 'FCP.BFSSP3AuxHardyG15RealCoefficientSumDiagnostic.realCoefficient_doubleSum'])]
        for name,expected in logs:
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if expected is not None:
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                assert [n for n,_ in reports]==expected,(name,reports,expected)
                for declaration,raw in reports:assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
        print("BFSS_P3_AUX_HARDY_G15_QUALIFIED_REAL_SUM_HELPER_PASS")
        PY
    - name: Isolated Mathlib finite operator evaluation before native build
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        helper_mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG5FiniteOperatorEvaluation"
        helper_src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean"
        helper_obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.olean"
        timeout 500s lake build "$helper_mod" 2>&1 | tee ../bfss-aux-hardy-g15-evidence/helper-build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$helper_obj" "$helper_src" 2>&1 | tee ../bfss-aux-hardy-g15-evidence/helper.log
        python3 - <<'PY'
        from pathlib import Path
        import re,json
        d=Path("../bfss-aux-hardy-g15-evidence")
        expected=["FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply"]
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        for name in ("helper-build.log","helper.log"):
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if name=="helper.log":
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
