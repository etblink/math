name: BFSS IBI-G0C original BFSS SO3 hom and surjectivity strict

'on':
  push:
    branches: [research/bfss-incidence-unified-20261114]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Hom.lean
      - lean/diagnostics/BFSSIBIG0CSO3HomIndependentConsumer.lean
      - .github/workflows/bfss-ibi-g0c-so3-hom-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-g0c-so3-hom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-so3-hom-surjectivity-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact incidence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact original source and independent consumer pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-g0c-so3-hom"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-hom/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Hom.lean":"e078ce60467b0d7f7fadc19065d0aadfb132dca0",
            "lean/diagnostics/BFSSIBIG0CSO3HomIndependentConsumer.lean":"2d57aa3ecc1bfef72a16617ca8d209cbb4ddf7c7",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSourceSO3Witness.lean":"ecf86b8f8f70e5bc847716bb3f5287e460be940b",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0B1NativeDetOne.lean":"0b82625932304f9e03f07850cef674689475fc09",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG3AAdjointColorRepresentationProbe.lean":"553869f1287c64893398c3b79c04fe010023bd08",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for p,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert got==sha,(p,sha,got)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in pkgs if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Hom.lean").read_text()
          c=Path("lean/diagnostics/BFSSIBIG0CSO3HomIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSourceSO3Witness",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0B1NativeDetOne"]
          assert re.findall(r"(?m)^import (\S+)$",c)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Hom"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalAdjointColorMatrix_mem_SO3","originalAdjointSO3",
            "originalAdjointSO3Hom","originalAdjointSO3Hom_coe",
            "originalAdjointSO3Hom_surjective"]
          assert len(re.findall(r"(?m)^example\b",c))==5
          for token in ("mem_specialOrthogonalGroup_iff","mem_orthogonalGroup_iff'",
              "adjointColorMatrix_orthogonal","originalAdjointColorMatrix_det_one",
              "adjointColorMatrix_one","adjointColorMatrix_mul",
              "originalBFSS_adjoint_hits_every_SO3"):
              assert token in s,token
          for t in [s,c]:
              assert "set_option autoImplicit false" in t
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",t)
              assert "set_option maxHeartbeats 0" not in t
          print("BFSS_IBI_G0C_SO3_HOM_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native source and independent consumer axiom audit
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          module="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Hom"
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Hom.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Hom.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1650s lake build "$module" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-hom/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-hom/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSIBIG0CSO3HomIndependentConsumer.lean 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-hom/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-ibi-g0c-so3-hom"
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-4500:])
              allow=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              bad=[x for x in t.splitlines() if "warning:" in x and not allow.fullmatch(x)]
              assert not bad,(name,bad[:10])
          t=(root/"source-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
          expected=[
            "FCP.BFSSIBIG0CSO3Hom.originalAdjointColorMatrix_mem_SO3",
            "FCP.BFSSIBIG0CSO3Hom.originalAdjointSO3",
            "FCP.BFSSIBIG0CSO3Hom.originalAdjointSO3Hom",
            "FCP.BFSSIBIG0CSO3Hom.originalAdjointSO3Hom_coe",
            "FCP.BFSSIBIG0CSO3Hom.originalAdjointSO3Hom_surjective"]
          assert [name for name,_ in reports]==expected,reports
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,raw in reports:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,raw)
          print("BFSS_IBI_G0C_SO3_HOM_SURJECTIVE_SOURCE_AND_CONSUMER_STRICT_GREEN")
          PY
      - name: Preserve strict SO3 hom and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-g0c-so3-hom-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-g0c-so3-hom/
          if-no-files-found: warn
          retention-days: 14
