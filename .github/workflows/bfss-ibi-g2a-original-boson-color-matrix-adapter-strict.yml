name: BFSS IBI-G2A original boson gauge to SO3 color-matrix adapter strict

'on':
  push:
    branches: [research/bfss-incidence-unified-20261114]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG2AOriginalBosonColorMatrixAdapter.lean
      - lean/diagnostics/BFSSIBIG2AOriginalBosonColorMatrixAdapterIndependentConsumer.lean
      - .github/workflows/bfss-ibi-g2a-original-boson-color-matrix-adapter-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-g2a-original-boson-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-boson-matrix-and-independent-so3-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact incidence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source contract and frozen pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-g2a-boson-matrix"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-g2a-boson-matrix/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG2AOriginalBosonColorMatrixAdapter.lean":"7d202db031a3b21a8fc936850c5c04cbca5eb3b3",
            "lean/diagnostics/BFSSIBIG2AOriginalBosonColorMatrixAdapterIndependentConsumer.lean":"208b8e9bd6be062c591c1afe711c03d08e7dc19c",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Hom.lean":"e078ce60467b0d7f7fadc19065d0aadfb132dca0",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0AOriginalBosonGram.lean":"382315f9e9442f8506bcbe5b42dbc2bad4e7d86d",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG2ABosonGaugeProbe.lean":"898c987cbcc0840f9c137682c3be345baca809d1",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG3AAdjointColorRepresentationProbe.lean":"553869f1287c64893398c3b79c04fe010023bd08",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for p,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert got==sha,(p,sha,got)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in pkgs if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG2AOriginalBosonColorMatrixAdapter.lean").read_text()
          c=Path("lean/diagnostics/BFSSIBIG2AOriginalBosonColorMatrixAdapterIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Hom",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0AOriginalBosonGram"]
          assert re.findall(r"(?m)^import (\S+)$",c)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG2AOriginalBosonColorMatrixAdapter"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalSpatialColor_gauge_matrix",
            "originalSpatialColor_gauge_matrix_vector"]
          assert len(re.findall(r"(?m)^example\b",c))==3
          for token in ("M.spatialColor_gaugeConjugate",
              "M.colorConjugate_coefficient", "adjointColorMatrix",
              "bosonGauge g x"):
              assert token in s,token
          for token in ("originalAdjointSO3Hom_surjective", "originalAdjointSO3Hom_coe"):
              assert token in c,token
          for t in [s,c]:
              assert "set_option autoImplicit false" in t
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",t)
              assert "set_option maxHeartbeats 0" not in t
          print("BFSS_IBI_G2A_ORIGINAL_BOSON_MATRIX_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native boson matrix source and consumer axiom audit
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          module="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG2AOriginalBosonColorMatrixAdapter"
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG2AOriginalBosonColorMatrixAdapter.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG2AOriginalBosonColorMatrixAdapter.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1650s lake build "$module" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g2a-boson-matrix/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g2a-boson-matrix/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSIBIG2AOriginalBosonColorMatrixAdapterIndependentConsumer.lean 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g2a-boson-matrix/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-ibi-g2a-boson-matrix"
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-4500:])
              allow=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              bad=[x for x in t.splitlines() if "warning:" in x and not allow.fullmatch(x)]
              assert not bad,(name,bad[:10])
          t=(root/"source-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
          expected=[
            "FCP.BFSSIBIG2AOriginalBosonColorMatrixAdapter.originalSpatialColor_gauge_matrix",
            "FCP.BFSSIBIG2AOriginalBosonColorMatrixAdapter.originalSpatialColor_gauge_matrix_vector"]
          assert [name for name,_ in reports]==expected,reports
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,raw in reports:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,raw)
          print("BFSS_IBI_G2A_ORIGINAL_BOSON_MATRIX_STRICT_GREEN")
          PY
      - name: Preserve exact boson matrix and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-g2a-boson-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-g2a-boson-matrix/
          if-no-files-found: warn
          retention-days: 14
