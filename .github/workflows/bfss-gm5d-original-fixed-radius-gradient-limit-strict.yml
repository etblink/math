name: BFSS GM5D exact original fixed-radius gradient limit strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5DOriginalFixedRadiusGradientLimit.lean'
      - 'lean/diagnostics/BFSSGM5DOriginalFixedRadiusGradientLimitIndependentAudit.lean'
      - '.github/workflows/bfss-gm5d-original-fixed-radius-gradient-limit-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm5d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-fixed-radius-gradient-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5DOriginalFixedRadiusGradientLimit.lean \
            lean/diagnostics/BFSSGM5DOriginalFixedRadiusGradientLimitIndependentAudit.lean \
            .github/workflows/bfss-gm5d-original-fixed-radius-gradient-limit-strict.yml \
            > "$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5COriginalMasslessCoreMomentControl.lean": "d5b7fbe3cb19ec19a1fae372805830fe34b4d7b7",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5BOriginalNativeClosedChargeCoreEnergy.lean": "eebefdba1bf2b6c3d29462f88561f1337b2232de",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean": "a9f27a48852ac570aedc8e0ab88d683250e6b138",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean": "152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
            "lean/OAI/MathematicalPhysics/BFSS/PotentialBounds.lean": "06afe0a2fa0c6d65439ad15e4e6031f1d43260b7",
            "lean/OAI/MathematicalPhysics/BFSS/SobolevGraphs.lean": "f0e743c67633d9871aad7e3b225ebe73f4bb9d67",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","08177514383e5461984e76c7b4905c4e9a690837","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5DOriginalFixedRadiusGradientLimit.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM5DOriginalFixedRadiusGradientLimitIndependentAudit.lean").read_text()
          source_roots = [
            "coordinateDirection",
            "sourceCoreGradient_norm_sq",
            "fixedRadiusCoreGradient_sq_le",
            "fixedRadiusNativeGraph_gradientLimit",
          ]
          consumer_roots = [
            "pairedFixedRadiusCoreGradient_sq_le",
            "pairedFixedRadiusNativeGraph_gradientLimit",
          ]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5COriginalMasslessCoreMomentControl",
            "OAI.MathematicalPhysics.BFSS.SobolevGraphs",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5DOriginalFixedRadiusGradientLimit",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM5D_SOURCE_EXACT_FIXED_RADIUS_GRADIENT_LIMIT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original source fixed-radius gradient limit and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm5d-fixed-radius-gradient-limit"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5DOriginalFixedRadiusGradientLimit 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM5DOriginalFixedRadiusGradientLimitIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm5d-fixed-radius-gradient-limit"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSGM5D.coordinateDirection",
                  "FCP.BFSSGM5D.sourceCoreGradient_norm_sq",
                  "FCP.BFSSGM5D.fixedRadiusCoreGradient_sq_le",
                  "FCP.BFSSGM5D.fixedRadiusNativeGraph_gradientLimit",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSGM5DIndependent.pairedFixedRadiusCoreGradient_sq_le",
                  "FCP.BFSSGM5DIndependent.pairedFixedRadiusNativeGraph_gradientLimit",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_GM5D_ORIGINAL_SOURCE_FIXED_RADIUS_GRADIENT_LIMIT_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm5d-fixed-radius-gradient-limit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm5d-fixed-radius-gradient-limit/
          if-no-files-found: warn
          retention-days: 30
