name: BFSS K1D5 source Clifford scalar transport strict qualification
on:
  push:
    branches:
      - research/fcp-k1d5-clifford-scalar-20261027
    paths:
      - .github/workflows/bfss-kotler-k1d5-clifford-scalar-owner-strict.yml
      - contributions/bfss-kotler/tools/qualify_fcp_k1d5.py
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D5OriginalCliffordScalarTransportProbe.lean
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-clifford-scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact K1D5 candidate and verifier source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D5OriginalCliffordScalarTransportProbe.lean)" = 'afea20ff18e9ea7d03fc5dba5aa3c32fa0b830e5'
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d5.py)" = 'a41f6aaf497eeb2c3cebb2382592fa4ecb50effd'
      - name: Restore pinned Lean and Mathlib dependencies
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Requalify accepted 22-module original ancestry and 47 roots
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_sync.py --group ancestry --mode lake --log-dir "$RUNNER_TEMP/bfss-k1d5-ancestry-evidence"
      - name: Requalify both accepted K1D3-K1D4 composition roots
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d3.py --log-dir "$RUNNER_TEMP/bfss-k1d5-parent-evidence"
      - name: Fresh K1D5 source proof and two declaration axiom checks
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d5.py --log-dir "$RUNNER_TEMP/bfss-k1d5-new-evidence"
      - name: Emit original compiler, root-type, and verifier evidence
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/bfss-k1d5-ancestry-evidence" "$RUNNER_TEMP/bfss-k1d5-parent-evidence" "$RUNNER_TEMP/bfss-k1d5-new-evidence" <<'PY'
          import pathlib, sys
          for arg in sys.argv[1:]:
              root = pathlib.Path(arg)
              for path in sorted(root.glob('*.log')):
                  print('COMPILER_EVIDENCE_FILE', root.name, path.name)
                  print(path.read_text())
              for path in sorted(root.glob('results.json')):
                  print('VERIFIER_RESULTS_FILE', root.name, path.read_text())
          PY
      - name: Preserve success and failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d5-clifford-scalar-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-k1d5-ancestry-evidence
            ${{ runner.temp }}/bfss-k1d5-parent-evidence
            ${{ runner.temp }}/bfss-k1d5-new-evidence
          if-no-files-found: warn
