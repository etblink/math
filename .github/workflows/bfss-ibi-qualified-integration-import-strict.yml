name: BFSS IBI qualified original-source import against unified integration strict

'on':
  push:
    branches: [integration/bfss-ibi-qualified-candidate-20261115]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBI*.lean
      - lean/diagnostics/BFSSIBI*.lean
      - research/incidence-before-identity/IBI_QUALIFIED_IMPORT_CANDIDATE_MANIFEST_2026_11_15.md
      - .github/workflows/bfss-ibi-qualified-integration-import-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-qualified-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-unified-base-cold-source-and-17-independent-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact clean integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify immutable imported green source, consumer, receipt and toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-qualified-integration"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-qualified-integration/tested-commit.txt"
          python3 - <<'PY'
