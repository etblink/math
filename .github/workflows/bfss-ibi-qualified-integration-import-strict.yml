      - name: Restore frozen Lean 4.34.1 and Mathlib cache
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold build all accepted native IBI sources and independently compile all 17 consumers
        shell: bash
        timeout-minutes: 80
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          ROOT="$RUNNER_TEMP/bfss-ibi-qualified-integration"
          STEMS="IBIG0AOriginalBosonGram IBIG0B0QuaternionPolynomial IBIG0B1FinDet3 IBIG0B1NativeDetOne IBIG0B1SourceColumnsTriple IBIG0CInversePauli IBIG0CNativeXGenerator IBIG0CNativeZGenerator IBIG0CPauliTrace IBIG0CSO3Angle IBIG0CSO3Euler IBIG0CSO3Hom IBIG0CSourceSO3Witness IBIG0CXImage IBIG0CZImage IBIG1AOriginalLieTriple IBIG1BOriginalSignedCross"
          CONSUMERS="BFSSIBIG0AOriginalBosonGramIndependentConsumer.lean BFSSIBIG0B0QuaternionPolynomialIndependentConsumer.lean BFSSIBIG0B1FinDet3IndependentConsumer.lean BFSSIBIG0B1NativeDetOneIndependentConsumer.lean BFSSIBIG0B1SourceColumnsTripleIndependentConsumer.lean BFSSIBIG0CInversePauliIndependentConsumer.lean BFSSIBIG0CNativeXGeneratorIndependentConsumer.lean BFSSIBIG0CNativeZGeneratorIndependentConsumer.lean BFSSIBIG0CPauliTraceIndependentConsumer.lean BFSSIBIG0CSO3AngleIndependentConsumer.lean BFSSIBIG0CSO3EulerIndependentConsumer.lean BFSSIBIG0CSO3HomIndependentConsumer.lean BFSSIBIG0CSourceSO3WitnessIndependentConsumer.lean BFSSIBIG0CXImageIndependentConsumer.lean BFSSIBIG0CZImageIndependentConsumer.lean BFSSIBIG1AOriginalLieTripleIndependentConsumer.lean BFSSIBIG1BOriginalSignedCrossIndependentConsumer.lean"
          for stem in $STEMS; do
              obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/$stem.olean"
              rm -f "$obj" "$obj.private" "$obj.server" ".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/$stem.ilean"
          done
          timeout 2900s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0AOriginalBosonGram OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0B0QuaternionPolynomial OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0B1FinDet3 OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0B1NativeDetOne OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0B1SourceColumnsTriple OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CInversePauli OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CNativeXGenerator OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CNativeZGenerator OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CPauliTrace OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Angle OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Euler OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Hom OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSourceSO3Witness OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CXImage OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CZImage OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG1AOriginalLieTriple OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG1BOriginalSignedCross 2>&1 | tee "$ROOT/cold-build.log"
          for stem in $STEMS; do
              src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/$stem.lean"
              obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/$stem.olean"
              timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee "$ROOT/source-$stem.log"
          done
          for name in $CONSUMERS; do
              timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true "diagnostics/$name" 2>&1 | tee "$ROOT/consumer-$name.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-ibi-qualified-integration"
          source=Path("OAI/MathematicalPhysics/BFSS/Contrib/Kotler")
          stems=["IBIG0AOriginalBosonGram","IBIG0B0QuaternionPolynomial","IBIG0B1FinDet3","IBIG0B1NativeDetOne","IBIG0B1SourceColumnsTriple","IBIG0CInversePauli","IBIG0CNativeXGenerator","IBIG0CNativeZGenerator","IBIG0CPauliTrace","IBIG0CSO3Angle","IBIG0CSO3Euler","IBIG0CSO3Hom","IBIG0CSourceSO3Witness","IBIG0CXImage","IBIG0CZImage","IBIG1AOriginalLieTriple","IBIG1BOriginalSignedCross"]
          consumers=["BFSSIBIG0AOriginalBosonGramIndependentConsumer.lean","BFSSIBIG0B0QuaternionPolynomialIndependentConsumer.lean","BFSSIBIG0B1FinDet3IndependentConsumer.lean","BFSSIBIG0B1NativeDetOneIndependentConsumer.lean","BFSSIBIG0B1SourceColumnsTripleIndependentConsumer.lean","BFSSIBIG0CInversePauliIndependentConsumer.lean","BFSSIBIG0CNativeXGeneratorIndependentConsumer.lean","BFSSIBIG0CNativeZGeneratorIndependentConsumer.lean","BFSSIBIG0CPauliTraceIndependentConsumer.lean","BFSSIBIG0CSO3AngleIndependentConsumer.lean","BFSSIBIG0CSO3EulerIndependentConsumer.lean","BFSSIBIG0CSO3HomIndependentConsumer.lean","BFSSIBIG0CSourceSO3WitnessIndependentConsumer.lean","BFSSIBIG0CXImageIndependentConsumer.lean","BFSSIBIG0CZImageIndependentConsumer.lean","BFSSIBIG1AOriginalLieTripleIndependentConsumer.lean","BFSSIBIG1BOriginalSignedCrossIndependentConsumer.lean"]
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          logs=[root/"cold-build.log"]+[root/f"source-{s}.log" for s in stems]+[root/f"consumer-{c}.log" for c in consumers]
          for f in logs:
              t=f.read_text()
              assert "error:" not in t and "sorryAx" not in t,(str(f),t[-5000:])
              warnings=[x for x in t.splitlines() if "warning:" in x and not allow_warning.fullmatch(x)]
              assert not warnings,(str(f),warnings[:12])
          assert "Build completed successfully" in (root/"cold-build.log").read_text()
          count=0
          for stem in stems:
              t=(root/f"source-{stem}.log").read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
              declared=re.findall(r"(?m)^#print axioms ([^\s]+)",(source/f"{stem}.lean").read_text())
              assert len(reports)==len(declared),(stem,len(reports),len(declared),reports)
              assert len(reports)>0,stem
              for name,raw in reports:
                  assert {a.strip() for a in raw.split(",") if a.strip()}<=allowed,(stem,name,raw)
              count+=len(reports)
          assert len(consumers)==17 and len(stems)==17
          print("BFSS_IBI_17_SOURCE_17_CONSUMERS_STRICT_GREEN",len(stems),len(consumers),count)
          PY
      - name: Preserve cold source, consumer and pin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-qualified-import-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-qualified-integration/
          if-no-files-found: warn
          retention-days: 14
