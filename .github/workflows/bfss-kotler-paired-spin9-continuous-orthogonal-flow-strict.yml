name: BFSS V9Y original source-paired continuous real-parameter orthogonal flow strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9ContinuousOrthogonalFlowProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-continuous-orthogonal-flow-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-continuous-orthogonal-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact V9X ancestry and source-paired continuous flow statements
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LieHomProbe.lean")" = '1b17d6542ebec81f12fd0231e8478f66679efd53'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9MathlibSkewBridgeProbe.lean")" = 'ee038db09af741bdd1af4b811d8daf79bb70ed37'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe.lean")" = '2b350ed73e1f831532d1200f1a0ab148ee53dacf'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalExponentialProbe.lean")" = 'cb27bc0755dc7f64bed51943ae18c24a00cba912'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe.lean")" = 'b471ebb2da441c4be099bed168f6fa3651e24a99'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe.lean")" = 'fe56b8b55ea9e72d50b8991962d8b22def7375d9'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9TypedOneParameterOrthogonalHomProbe.lean")" = '51f634be2330d53e976bf12d82be01f1f64683f6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ContinuousOrthogonalFlowProbe.lean")" = '8a09e7db98b842da215d7bc2e23d651d8b3e03ca'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9ContinuousOrthogonalFlowProbe.lean').read_text()
          names=['pairedMatrixExp_continuous_real',
                 'pairedSkewOneParameterOrthogonalHom_continuous_real',
                 'normalizedPairedPlaneOneParameterOrthogonalHom_continuous_real',
                 'coordinateToPairedCanonicalOneParameterOrthogonalHom_continuous_real']
          for name in names:
            assert s.count('theorem '+name+'\n')==1,name
          assert 'open scoped Matrix.Norms.Operator' in s
          assert 'NormedSpace.exp_continuous' in s
          assert 'Continuous.subtype_mk' in s
          assert 'normalizedPairedPlane_transpose' in s
          assert 'SU2BFSSPairedSpin9TypedOneParameterOrthogonalHomProbe' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V9Y_SOURCE_AND_CONTINUITY_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted V9X original paired typed orthogonal hom ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9TypedOneParameterOrthogonalHomProbe

      - name: Fresh V9Y original paired real continuity proof compile with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9ContinuousOrthogonalFlowProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v9y"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v9y/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v9y/compiler.log")" -eq 4

      - name: Independently elaborate four real continuity declarations and audit axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V9Y_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9ContinuousOrthogonalFlowProbe
          open FCP.BFSSPairedSpin9Plane
          open OAI.BFSSQuantum
          open NormedSpace
          #check pairedMatrixExp_continuous_real
          #check pairedSkewOneParameterOrthogonalHom_continuous_real
          #check normalizedPairedPlaneOneParameterOrthogonalHom_continuous_real
          #check coordinateToPairedCanonicalOneParameterOrthogonalHom_continuous_real
          example (X : Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ) :
              Continuous (fun t : ℝ => exp (t • X)) :=
            pairedMatrixExp_continuous_real X
          example (X : Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)
              (hX : X.transpose = -X) :
              Continuous (fun t : ℝ =>
                pairedSkewOneParameterOrthogonalHom X hX
                  (Multiplicative.ofAdd t)) :=
            pairedSkewOneParameterOrthogonalHom_continuous_real X hX
          example (r s : SpaceIndex) :
              Continuous (fun t : ℝ =>
                normalizedPairedPlaneOneParameterOrthogonalHom r s
                  (Multiplicative.ofAdd t)) :=
            normalizedPairedPlaneOneParameterOrthogonalHom_continuous_real r s
          example (A : skewAdjointMatricesLieSubalgebra
              (1 : Matrix SpaceIndex SpaceIndex ℝ)) :
              Continuous (fun t : ℝ =>
                coordinateToPairedCanonicalOneParameterOrthogonalHom A
                  (Multiplicative.ofAdd t)) :=
            coordinateToPairedCanonicalOneParameterOrthogonalHom_continuous_real A
          #print axioms FCP.BFSSPairedSpin9Plane.pairedMatrixExp_continuous_real
          #print axioms FCP.BFSSPairedSpin9Plane.pairedSkewOneParameterOrthogonalHom_continuous_real
          #print axioms FCP.BFSSPairedSpin9Plane.normalizedPairedPlaneOneParameterOrthogonalHom_continuous_real
          #print axioms FCP.BFSSPairedSpin9Plane.coordinateToPairedCanonicalOneParameterOrthogonalHom_continuous_real
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V9Y_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v9y/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v9y'/'declaration-audit.log').read_text()
          prefix='FCP.BFSSPairedSpin9Plane.'
          expected=[prefix+'pairedMatrixExp_continuous_real',
                    prefix+'pairedSkewOneParameterOrthogonalHom_continuous_real',
                    prefix+'normalizedPairedPlaneOneParameterOrthogonalHom_continuous_real',
                    prefix+'coordinateToPairedCanonicalOneParameterOrthogonalHom_continuous_real']
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==expected,reports
          for _,ax in reports:
            assert set(x.strip() for x in ax.split(',') if x.strip()) <= {
              'propext','Classical.choice','Quot.sound'},ax
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V9Y_ORIGINAL_CONTINUOUS_ORTHOGONAL_FLOW_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v9y-original-paired-continuous-orthogonal-flow-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9y
          if-no-files-found: warn
