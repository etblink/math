name: BFSS V10E source Spin9 global gamma orthogonal strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean
      - .github/workflows/bfss-kotler-source-spin9-gamma-orthogonal-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-global-orthogonal:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin V10D source Spin9 units, V10C gamma Clifford and V10E exact proof source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10e"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10e/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaMatrixUnitsProbe.lean")" = '351d4b0f1a704ca4e02261b36bf49245e22f80dd'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean")" = 'f7f3025e774dd4773081a3b03df21d7d05270dcd'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean').read_text()
          names=["gammaNineRealLinear_transpose","source9GammaCliffordAlgHom_reverse","source9SpinGammaMatrix_star_transpose","source9SpinGammaMatrix_mem_orthogonalGroup","source9SpinGammaOrthogonalHom","source9SpinGammaOrthogonalHom_apply"]
          for n in names:
              assert len(re.findall(r'(?m)^(?:theorem|noncomputable def) '+re.escape(n)+r'\b',s))==1,n
          assert s.count('#print axioms ')==6
          assert 'spinGroup source9Quadratic →*' in s
          assert 'Matrix.orthogonalGroup SpinIndex ℝ' in s
          assert 'CliffordAlgebra.reverse.map_mul' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('V10E_ORIGINAL_SOURCE_SPIN9_ORTHOGONAL_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted V10D original source Spin9 matrix units ancestor
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9SourceSpinGammaMatrixUnitsProbe

      - name: Fresh V10E Clifford reversal and source Spin9 orthogonality compile
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10e/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10e/compiler.log")" -eq 6

      - name: Independently elaborate exact six V10E types and audit root axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V10E_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe
          open FCP.BFSSPairedSpin9Clifford
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (v : SpaceIndex → ℝ) :
              (gammaNineRealLinear v).transpose = gammaNineRealLinear v :=
            gammaNineRealLinear_transpose v
          noncomputable example (a : CliffordAlgebra source9Quadratic) :
              source9GammaCliffordAlgHom (CliffordAlgebra.reverse a) =
                (source9GammaCliffordAlgHom a).transpose :=
            source9GammaCliffordAlgHom_reverse a
          noncomputable example (g : spinGroup source9Quadratic) :
              source9GammaCliffordAlgHom (star (g : CliffordAlgebra source9Quadratic)) =
                (source9GammaCliffordAlgHom
                  (g : CliffordAlgebra source9Quadratic)).transpose :=
            source9SpinGammaMatrix_star_transpose g
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinGammaMatrixUnitsHom g) : GammaMatrix) ∈
                Matrix.orthogonalGroup SpinIndex ℝ :=
            source9SpinGammaMatrix_mem_orthogonalGroup g
          noncomputable example :
              spinGroup source9Quadratic →*
                Matrix.orthogonalGroup SpinIndex ℝ :=
            source9SpinGammaOrthogonalHom
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinGammaOrthogonalHom g) : GammaMatrix) =
                source9GammaCliffordAlgHom
                  (g : CliffordAlgebra source9Quadratic) :=
            source9SpinGammaOrthogonalHom_apply g
          #print axioms FCP.BFSSPairedSpin9Clifford.gammaNineRealLinear_transpose
          #print axioms FCP.BFSSPairedSpin9Clifford.source9GammaCliffordAlgHom_reverse
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaMatrix_star_transpose
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaMatrix_mem_orthogonalGroup
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaOrthogonalHom
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinGammaOrthogonalHom_apply
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V10E_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v10e/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10e'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["gammaNineRealLinear_transpose","source9GammaCliffordAlgHom_reverse","source9SpinGammaMatrix_star_transpose","source9SpinGammaMatrix_mem_orthogonalGroup","source9SpinGammaOrthogonalHom","source9SpinGammaOrthogonalHom_apply"]}
          assert len(reports)==6 and {n for n,_ in reports}==expected,reports
          for n,axioms in reports:
              assert set(a.strip() for a in axioms.split(','))<={'propext','Classical.choice','Quot.sound'},(n,axioms)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10E_SOURCE_SPIN9_GLOBAL_ORTHOGONAL_6_TYPED_AXIOMS_PASS')
          PY

      - name: Preserve exact compiler, tested SHA and declaration axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10e-source-spin9-global-orthogonal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10e
          if-no-files-found: warn
