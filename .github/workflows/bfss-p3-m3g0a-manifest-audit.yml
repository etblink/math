name: BFSS P3-M3G0A prospective source import manifest audit
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - tools/bfss_m3g0a_manifest_audit.py
      - .github/workflows/bfss-p3-m3g0a-manifest-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-m3g0a-manifest-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-import-closure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and immutable baseline parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Check 96 prior M2 pins and exact M3 gauge import closure against immutable source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bfss_m3g0a_manifest_audit.py
      - name: Preserve audit results and first causal failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p3-m3g0a-manifest-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: bfss-m3g0a-manifest-audit/
          if-no-files-found: warn
          retention-days: 14
