        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d8.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d8-evidence"
      - name: Requalify accepted K1D9 negative Spin membership roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d9.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d9-evidence"
      - name: Requalify accepted K1D10 negative-central action roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d10.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d10-evidence"
      - name: Requalify accepted K1D11 exact pointwise two-sign kernel roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d11.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d11-evidence"
      - name: Requalify accepted K1D12 source Spin48 vector action laws
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d12.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d12-evidence"
      - name: Requalify accepted K1D13 source Spin48 linear representation roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d13.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d13-evidence"
      - name: Requalify accepted K1D14 exact source GL kernel roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d14.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d14-evidence"
      - name: Requalify accepted K1D15 source quadratic preservation roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d15.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d15-evidence"
      - name: Requalify accepted K1D16 source isometry roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d16.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d16-evidence"
      - name: Fresh K1D17 source proof and three declaration axiom checks
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-new-evidence"
      - name: Seal freshly source-qualified 81-root ancestry cache on cold success
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py seal --log-dir "$RUNNER_TEMP/bfss-cache-pilot-cache-evidence"
          du -sh lean/.lake/build/lib/lean/OAI
      - name: Save exact qualified ancestry cache only after all strict cold checks
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: lean/.lake/build/lib/lean/OAI
          key: bfss-fcp-k1d17-source-accepted-ancestors-v1-389ecdcc-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Emit original compiler, root-type, and verifier evidence
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/bfss-cache-pilot-cache-evidence" "$RUNNER_TEMP/bfss-cache-pilot-ancestry-evidence" "$RUNNER_TEMP/bfss-cache-pilot-parent-evidence" "$RUNNER_TEMP/bfss-cache-pilot-new-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d16-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d15-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d14-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d13-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d12-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d11-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d5-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d6-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d7-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d8-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d9-evidence" "$RUNNER_TEMP/bfss-cache-pilot-k1d10-evidence" <<'PY'
          import pathlib, sys
          for arg in sys.argv[1:]:
              root = pathlib.Path(arg)
              for path in sorted(root.glob('*.log')):
                  print('COMPILER_EVIDENCE_FILE', root.name, path.name)
                  print(path.read_text())
              for path in sorted(root.glob('results.json')):
                  print('VERIFIER_RESULTS_FILE', root.name, path.read_text())
          PY
      - name: Preserve success and failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-cache-pilot-source-spin48-isometry-laws-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-cache-pilot-cache-evidence
            ${{ runner.temp }}/bfss-cache-pilot-ancestry-evidence
            ${{ runner.temp }}/bfss-cache-pilot-parent-evidence
            ${{ runner.temp }}/bfss-cache-pilot-new-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d16-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d15-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d14-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d13-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d12-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d11-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d10-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d9-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d8-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d7-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d6-evidence
            ${{ runner.temp }}/bfss-cache-pilot-k1d5-evidence
          if-no-files-found: warn
