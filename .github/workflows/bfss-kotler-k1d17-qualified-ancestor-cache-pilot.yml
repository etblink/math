name: BFSS K1D17 accepted source ancestry cache cold/warm strict pilot
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - .github/workflows/bfss-kotler-k1d17-qualified-ancestor-cache-pilot.yml
      - contributions/bfss-kotler/tools/qualify_fcp_k1d17.py
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D17OriginalSpin48IsometryActionLawsProbe.lean
      - contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py
      - contributions/bfss-kotler/FCP_K1D17_ANCESTRY_CACHE_PILOT_2026_10_28.md
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-source-spin48-isometry-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact K1D17 candidate and verifier source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D17OriginalSpin48IsometryActionLawsProbe.lean)" = '610325c863e509304b31d8914d9652971cddcd3f'
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d17.py)" = 'b33dc482e60ad8e188645969aac27da534df4c1c'
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py)" = 'ca97ad005f75fc270942d034772871471933c7b3'
      - name: Restore pinned Lean and Mathlib dependencies
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Restore exact accepted-source Lean olean cache
        id: accepted-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: lean/.lake/build/lib/lean/OAI
          key: bfss-fcp-k1d17-source-accepted-ancestors-v1-389ecdcc-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Strict cache-hit provenance, nonempty olean, SHA256, 81-root types and axiom audit
        if: steps.accepted-cache.outputs.cache-hit == 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py verify --log-dir "$RUNNER_TEMP/bfss-cache-pilot-cache-evidence"
      - name: Requalify accepted 22-module original ancestry and 47 roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_sync.py --group ancestry --mode lake --log-dir "$RUNNER_TEMP/bfss-cache-pilot-ancestry-evidence"
      - name: Requalify both accepted K1D3-K1D4 composition roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d3.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-parent-evidence"
      - name: Requalify accepted K1D5 Clifford scalar transport roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d5.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d5-evidence"
      - name: Requalify accepted K1D6 Clifford star and square-one roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d6.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d6-evidence"
      - name: Requalify accepted K1D7 scalar coefficient norm roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d7.py --log-dir "$RUNNER_TEMP/bfss-cache-pilot-k1d7-evidence"
      - name: Requalify accepted K1D8 two-sign upper bound roots
        if: steps.accepted-cache.outputs.cache-hit != 'true'
