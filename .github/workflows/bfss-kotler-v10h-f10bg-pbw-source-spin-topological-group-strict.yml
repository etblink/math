name: BFSS V10H F10BG PBW exact source Spin9 topological group strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean
      - lean/diagnostics/FCP_K1D18V10HF10BGIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10bg-pbw-source-spin-topological-group-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pbw-exact-source-spin-topological-group:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin exact accepted PBW ring ancestry and F10BG declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bg"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bg/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe.lean")" = '42da9e4d7cc74a6137defe7f68e457275be21b31'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean")" = '63d117da8cb2ad337cfb372946332cb42bdf5390'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HD2CliffordTopologyBridgeDiagnostic.lean)" = '2adc47f7faac87c35f3c76a95171eb21b6e5c0ff'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean")" = '7798089cb8ac4ec4fffc3ead4caa474def81b3f8'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HD3GammaContinuityDiagnostic.lean)" = 'a40a345d01ac3051f5b6ec148b7433a6c7a75b12'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean)" = 'db887aa6e495eb2a74c2e826018ffb5453158806'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BEIndependentAudit.lean)" = 'dc765801abaf11df1cd08118b91ce37fe2e19337'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BFPBWCliffordTopologicalRing.lean)" = 'f7ea4c9e9d996d04d07a7733ffe7ab6a91ce2636'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BFIndependentAudit.lean)" = 'dd00871d12e1d533d15aa67608713d85eed0ec66'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean)" = '9092ccaa5b4436bfa25cafe8b71541e6642999f6'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BGIndependentAudit.lean)" = '2934f82e5b6742896385f85083e96de563440ba0'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BGIndependentAudit.lean').read_text()
          names=["source9Clifford_reverse_continuous_pbw","source9Spin_inv_coe_eq_reverse","source9Spin_inv_continuous_pbw","source9Spin_mul_continuous_pbw","source9Spin_isTopologicalGroup_pbw"]
          for name in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          assert not re.search(r'(?m)^local instance\s*:',s)
          for cls in ['NormedAddCommGroup','NormedSpace','FiniteDimensional']:
              assert 'local instance f10bgLocal'+cls+' : '+cls in s
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'(?m)^instance\b|attribute\s+\[instance\]',code)
              assert not re.search(r'local instance(?:\s+[A-Za-z0-9_]+)?\s*:\s*(TopologicalSpace|IsTopologicalGroup|ContinuousMul|ContinuousInv)\b',code)
          for token in ['source9PBWNormedAddCommGroup','source9PBWNormedSpace',
                        'source9Clifford_finiteDimensional','continuous_of_finiteDimensional',
                        'CliffordAlgebra.star_def','spinGroup.involute_eq g.property',
                        'source9Clifford_mul_continuous_pbw.comp hpair',
                        'continuous_induced_rng.2 hcoerced',
                        'IsTopologicalGroup (spinGroup source9Quadratic)']:
              assert token in s,token
          assert 'source9PBWCoordinates = auditPBWCoordinates := rfl' in audit
          print('V10H_F10BG_SOURCE_PIN_EXACT_SPIN_OPERATIONS_AND_DECLARATION_INVENTORY_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10X and F10BC ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom

      - name: Fresh accepted F10Y PBW source compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bg/f10y-compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Fresh accepted F10BE named PBW topology ancestry compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bg/f10be-compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Fresh accepted F10BF ambient ring ancestry compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BFPBWCliffordTopologicalRing
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bg/f10bf-compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Fresh F10BG exact source Spin topology warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bg/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently reconstruct PBW topology and audit source Spin group types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BGIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bg/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BGIndependentAudit.lean "$RUNNER_TEMP/v10h-f10bg/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean "$RUNNER_TEMP/v10h-f10bg/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9Clifford_reverse_continuous_pbw","source9Spin_inv_coe_eq_reverse","source9Spin_inv_continuous_pbw","source9Spin_mul_continuous_pbw","source9Spin_isTopologicalGroup_pbw"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10bg'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BG_EXACT_PBW_SOURCE_SPIN_GROUP_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BG audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bg-pbw-exact-source-spin-topological-group-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bg
          if-no-files-found: warn
