name: BFSS W0H1A R2 ORIGINAL source GREEN evidence pinning

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0h1a-r2-original-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-native-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout active W0H1A R2 source without changing any proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert tested original R2 source and accepted W0H0 plus frozen RED history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1AOriginalGeneratorCentralizerComapR2.lean)" = c5c0894d99a01e92e92a58dac7313698a2f69971
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0H1AOriginalGeneratorCentralizerIndependentConsumerR2.lean)" = b6e91f79c46724f65f54835623b97d5f909dcf66
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0h1a-r2-original-centralizer-unfold-strict.yml)" = 64ec1b82e3ee81243529dc4f883ab510e6e35a7f
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0H1A_R1_44145848122_SOURCE_RED_evidence.zip)" = 0240463e97836e347a5423999e6832dfcf81e2cf
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0H1A_R2_44151092723_PREFLIGHT_RED_evidence.zip)" = eb161bec2356866a90f9cc832f87bae86ffb5a03
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert a["gate"]=="P3-M4-W0H1A" and a["attempt"]=="R2"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]=="c5c0894d99a01e92e92a58dac7313698a2f69971"
          assert a["consumer_blob"]=="b6e91f79c46724f65f54835623b97d5f909dcf66"
          assert a["workflow_blob"]=="64ec1b82e3ee81243529dc4f883ab510e6e35a7f"
          assert a["contract_commit"]=="884a1897bdecdfa365abd7206ad7411a8dddef15"
          assert a["previous_red_run"]==44145848122
          assert q["gate"]=="P3-M4-W0H0" and q["run_id"]==44139239821
          assert q["status"]=="GREEN_QUALIFIED" and q["qualification"] is True
          assert q["evidence_archive_blob"]=="ffbd66e56aff83031aece2c3b310ed34678bdd9f"
          assert s["last_qualified_source_exact_original_BFSS"]["run_id"]==44139239821
          assert s["previous_active_W0H1A_R1_RED"]["run_id"]==44145848122
          assert s["previous_active_W0H1A_R1_RED"]["status"]=="RED_UNQUALIFIED"
          assert s["w0h1a_r2_preflight_only"]["run_id"]==44149941739
          assert s["w0h1a_r2_preflight_only"]["artifact_count"]==0
          assert s["w0h1a_r2_second_preflight_only"]["run_id"]==44151092723
          assert s["w0h1a_r2_second_preflight_only"]["source_attempted"] is False
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert s["next_planned"]["gate"]=="P3-M4-W0H1B"
          assert s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert not Path("research/quantum-information/diagnostics/BFSS_M4_W0H1A_R2_44151962609_GREEN_evidence.zip").exists()
          PY
      - name: Fetch exact provider-original strict GREEN ZIP and full job log, CRC and axiom audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          run=44151962609
          job=134282408570
          artifact=14360402424
          tested="fdc69a364ff32c82ade764940d7b2ec0ec5b2fce"
          digest="15cf911e6c0029b5a7ebed47f735f1d4ae9e21769e90f6b82ab657a7071c8d9f"
          size=14105
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{artifact}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response: meta=json.load(response)
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):return None
          def download(u):
              try:
                  res=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(u,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as res:return res.read()
              else:
                  with res:return res.read()
          raw=download(url+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={"propext","Classical.choice","Quot.sound"}
          def audit(report,expected):
              assert "error:" not in report and "sorryAx" not in report
              roots=pattern.findall(report)
              assert len(roots)==len(expected),(roots,expected)
              assert [n.rsplit(".",1)[-1] for n,_ in roots]==expected,roots
              for _,axioms in roots:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read("tested-commit.txt").decode().strip()==tested
              preflight=z.read("preflight.log").decode()
              assert "BFSS_W0H1A_R2_ORIGINAL_DONOR_GREEN_R1_SOURCE_RED_ARCHIVED_PREFLIGHT_PASS" in preflight
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9131 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert "BFSS_W0H1A_R2_ORIGINAL_CENTRALIZER_1_SOURCE_1_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),["originalGenerator_mem_sourceCentralizerPullback"])
              audit(z.read("consumer.log").decode(),["originalGenerator_mem_sourceCentralizerPullback_consumer"])
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/etblink/math/actions/jobs/{job}/logs")
          assert len(log)>10000
          assert b"Build completed successfully (9131 jobs)." in log
          assert b"BFSS_W0H1A_R2_ORIGINAL_DONOR_GREEN_R1_SOURCE_RED_ARCHIVED_PREFLIGHT_PASS" in log
          assert b"BFSS_W0H1A_R2_ORIGINAL_CENTRALIZER_1_SOURCE_1_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in log
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0H1A_R2_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0H1A_R2_{run}_complete_job.log"
          manifest=root/f"BFSS_W0H1A_R2_{run}_GREEN_evidence_manifest.json"
          for p in (archive,full,manifest):assert not p.exists(),p
          archive.write_bytes(raw)
          full.write_bytes(log)
          record={
             "gate":"P3-M4-W0H1A","attempt":"R2","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
             "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
             "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
             "original_job_log":{"path":str(full),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
             "source_blob":"c5c0894d99a01e92e92a58dac7313698a2f69971",
             "consumer_blob":"b6e91f79c46724f65f54835623b97d5f909dcf66",
             "workflow_blob":"64ec1b82e3ee81243529dc4f883ab510e6e35a7f",
             "source_reports":1,"consumer_reports":1,"independent_controls":2,"negative_mutants":6,
             "cold_build_jobs":9131,
             "strict_marker":"BFSS_W0H1A_R2_ORIGINAL_CENTRALIZER_1_SOURCE_1_CONSUMER_2_CONTROLS_SIX_MUTANTS_STRICT_GREEN",
             "allowed_axioms":["propext","Classical.choice","Quot.sound"],
             "last_qualified_original_bfss_before_run":44139239821,
             "first_original_R1_native_source_red_run":44145848122,
             "R2_harness_preflight_red_runs":[44149941739,44151092723],
             "prior_W0B1_stopped_native_red_runs":[44117272657,44127193329]
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0H1A_R2_GREEN_PROVIDER_ORIGINAL_REHASH_PASS",json.dumps(record,sort_keys=True))
          PY
      - name: Git-pin original six-member GREEN ZIP, original full Actions log and digest manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0H1A_R2_44151962609_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0H1A_R2_44151962609_complete_job.log research/quantum-information/diagnostics/BFSS_W0H1A_R2_44151962609_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0H1A_R2_44151962609_GREEN_evidence.zip | tr -d ' ')" = 14105
          git commit -m "BFSS W0H1A R2: preserve original strict GREEN provider ZIP full CI log and SHA manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
