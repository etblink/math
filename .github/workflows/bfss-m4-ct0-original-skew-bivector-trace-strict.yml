name: BFSS M4 CT0 original skew bivector Fock trace strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT0OriginalSkewBivectorTrace.lean
      - lean/diagnostics/BFSSP3M4CT0OriginalSkewBivectorTraceIndependentConsumer.lean
      - .github/workflows/bfss-m4-ct0-original-skew-bivector-trace-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-ct0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-trace-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source, independent consumer, donors and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-ct0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-ct0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-ct0/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          base="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/"
          pins={
            base+"P3M4CT0OriginalSkewBivectorTrace.lean":"6f884308f3029d5e2b227ddcabd0558e35c2c6f8",
            "lean/diagnostics/BFSSP3M4CT0OriginalSkewBivectorTraceIndependentConsumer.lean":"f2ddadc880c62632dd91547526ee97bc92a0d504",
            base+"T1OriginalFockTraceInvariance.lean":"3be6c9a6f2898484df66690f94fdfa1877660897",
            base+"P3M4LB1SOriginalSource48SkewMatrixFockBivector.lean":"d7d460fc8d2806234816e8bd2088f9cebb6addd4",
            base+"P3M4LB1P0AOriginalSource48SkewPlane.lean":"7eb090ab82be47ecae18ae0d091716188cb2db79",
            base+"P3M4LB1P0BOriginalSource48SkewPlaneNormalization.lean":"1c47a8645bb8ae18110f29083c95887b8a0e3a15",
            base+"P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420",
            base+"SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4",
          }
          for path,want in pins.items():
            got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
            assert got==want,(path,want,got)
          src=Path(base+"P3M4CT0OriginalSkewBivectorTrace.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4CT0OriginalSkewBivectorTraceIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==[
            "originalFockTrace_mul_comm",
            "originalFock_complex_skew_symmetric_doubleSum_zero",
            "originalSource48BivectorK_skew_trace_zero"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
            "originalFockTrace_mul_comm_consumer",
            "originalFock_complex_skew_symmetric_doubleSum_zero_consumer",
            "originalSource48BivectorK_skew_trace_zero_consumer"]
          assert len(re.findall(r"(?m)^example\b",consumer))==4
          for x in (src,consumer):
            assert "set_option autoImplicit false" in x
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",x)
            assert "maxRecDepth" not in x and "maxHeartbeats" not in x
          assert "originalFockTrace" in src and "originalSource48BivectorK" in src
          assert "LinearMap.trace_mul_comm" in src
          assert "Finset.sum_comm" in src
          assert "((A p q / 4 : ℝ) : ℂ)" in src
          assert "((0 : Fin 24), (0 : Fin 2))" in consumer
          assert "((0 : Fin 24), (1 : Fin 2))" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in m["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          assert state["branch"]=="integration/bfss-unified-research-20261108"
          assert state["last_qualified"]["gate"]=="P3-M4-LB1P0B"
          assert state["last_qualified"]["run_id"]==43962066769
          assert state["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          print("BFSS_M4_CT0_EXACT_SOURCE_CONSUMER_DONOR_TOOLCHAIN_AND_CHECKPOINT_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold native original source, axiom audit and independent consumer
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-ct0"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4CT0OriginalSkewBivectorTrace 2>&1 | tee "$root/cold-source.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT0OriginalSkewBivectorTrace.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4CT0OriginalSkewBivectorTraceIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-ct0"
          allowed={"propext","Classical.choice","Quot.sound"}
          allowed_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(text):
            assert "error:" not in text and "sorryAx" not in text,text[-9000:]
            bad=[x for x in text.splitlines() if "warning:" in x and not allowed_warning.fullmatch(x)]
            assert not bad,bad[:12]
          def audit_reports(text,targets):
            audit(text)
            entries=pattern.findall(text)
            assert len(entries)==len(targets),(entries,targets)
            names=[s.rsplit(".",1)[-1] for s,_ in entries]
            assert len(set(names))==len(names) and set(names)==set(targets),(names,targets)
            for name,raw in entries:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,raw)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b","c"))+"\n"
          audit_reports(fixture,["a","b","c"])
          mutations=[
            fixture.replace("Quot.sound","sorryAx",1),
            fixture.replace("Quot.sound","Unapproved.axiom",1),
            fixture.replace("'N.c'","'N.a'"),
            "\n".join(fixture.splitlines()[:2])+"\n",
            fixture+"warning: unexpected source warning\n",
            fixture+"error: source failure\n",
          ]
          for k,mutant in enumerate(mutations):
            try: audit_reports(mutant,["a","b","c"])
            except AssertionError: pass
            else: raise AssertionError(("auditor negative control survived",k))
          print("BFSS_M4_CT0_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          audit(cold)
          assert "Build completed successfully" in cold
          audit_reports((root/"source-axioms.log").read_text(),[
            "originalFockTrace_mul_comm","originalFock_complex_skew_symmetric_doubleSum_zero",
            "originalSource48BivectorK_skew_trace_zero"])
          audit_reports((root/"consumer.log").read_text(),[
            "originalFockTrace_mul_comm_consumer",
            "originalFock_complex_skew_symmetric_doubleSum_zero_consumer",
            "originalSource48BivectorK_skew_trace_zero_consumer"])
          print("BFSS_M4_CT0_ORIGINAL_FOCK_SKEW_K_TRACE_3_SOURCE_3_CONSUMER_4_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve original preflight, cold, source, consumer and audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-ct0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-ct0/
          if-no-files-found: warn
          retention-days: 14
