name: BFSS M4 W0C2B0N R1 original strict GREEN independent evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2b0n-r1-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-w0c2b0n-r1-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable original Source48 GREEN and accepted 25 anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert exact native source consumer workflow and accepted predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2B0NOriginalSource48RealComplexCoefficientAdapter.lean)" = c5841055363a6eef713f35e568409dd2fa2b6c9e
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2B0NOriginalSource48RealComplexCoefficientIndependentConsumer.lean)" = 3773f069d3da87c7c899596817f02efec639fbfa
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2b0n-r1-original-source48-real-complex-strict.yml)" = d431d74251ba5826baf312534fd6578424306643
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0M_R2_44255202048_GREEN_evidence.zip)" = 547432c9bf3fb0778d6bc060daa6f9a6e9afc004
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R1_44218523669_NATIVE_RED_evidence.zip)" = 4117bd19a0a8d1614df176e72d69a9b628de19da
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B0_R2_44222678258_NATIVE_RED_evidence.zip)" = 3f15c1c8bcf0e057e3de2055abc6ec00e8b931ec
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          a,q=s['active'],s['last_qualified']
          assert (a['gate'],a['attempt'],a['status'],a['qualification'])==('P3-M4-W0C2B0N','R1','PENDING_STRICT_CI',False)
          assert (q['gate'],q['attempt'],q['run_id'],q['status'])==('P3-M4-W0C2B0M','R2',44255202048,'GREEN_QUALIFIED')
          assert len(s['accepted_anchors'])==25 and s['accepted_anchors'][-1]==q
          assert q['preservation_run']==44257915520
          assert s['previous_active_W0C2B0_R2_stopped']['native_red_count']==2
          assert s['previous_active_W0C2B0M_R1_NATIVE_RED']['run_id']==44252646318
          root=Path('research/quantum-information/diagnostics')
          for name in ('BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip',
                       'BFSS_W0C2B0N_R1_44260119108_complete_job.log',
                       'BFSS_W0C2B0N_R1_44260119108_GREEN_evidence_manifest.json'):
              assert not (root/name).exists(),name
          print('BFSS_W0C2B0N_R1_ORIGINAL_GREEN_EVIDENCE_ARCHIVER_PREFLIGHT_PASS')
          PY
      - name: Independently verify original Actions GREEN ZIP logs SHA CRC and axioms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          prefix='https://api.github.com/repos/etblink/math'
          run=44260119108;job=134651124869;artifact=14407892726
          tested='d66a948cfd9741fd4f9428471d9e7f559228276f'
          digest='e68c0260726275649427ee7d4e02c8c954504fd5fd228cd86a7f9a58e0f12761'
          size=3975
          marker='BFSS_W0C2B0N_R1_ORIGINAL_SOURCE48_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN'
          roots=['originalSource48Fock_real_column_to_complex',
                 'originalSource48_complexify_commutator',
                 'originalSource48Fock_real_commutator_column_to_complex']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          r=getjson(f'{prefix}/actions/runs/{run}')
          j=getjson(f'{prefix}/actions/jobs/{job}')
          a=getjson(f'{prefix}/actions/artifacts/{artifact}')
          assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='success' and r['run_attempt']==1
          assert j['id']==job and j['run_id']==run and j['conclusion']=='success'
          for step in ('Preflight accepted original M predecessor','Restore pinned Lean',
                       'Cold original Source48 adapter','Preserve original Source48 strict'):
              assert any(s['name'].startswith(step) and s['conclusion']=='success' for s in j['steps']),step
          assert a['id']==artifact and a['size_in_bytes']==size and a['digest']=='sha256:'+digest
          assert a['workflow_run']['id']==run and a['workflow_run']['head_sha']==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location']
                  assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f'{prefix}/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log','auditor.log'}
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(data,expected):
              assert 'sorryAx' not in data and 'error:' not in data
              matches=pat.findall(data)
              assert len(matches)==len(expected),(matches,expected)
              assert [x.rsplit('.',1)[-1] for x,_ in matches]==expected
              for _,ax in matches:
                  assert {i.strip() for i in ax.split(',') if i.strip()} <= allowed
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names,z.namelist()
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'BFSS_W0C2B0N_R1_ORIGINAL_SOURCE48_REAL_COMPLEX_AND_25_QUALIFIED_ANCHORS_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (8962 jobs)' in cold and 'error:' not in cold and 'sorryAx' not in cold
              audit(z.read('source-axioms.log').decode(),roots)
              audit(z.read('consumer.log').decode(),[x+'_consumer' for x in roots])
              assert marker in z.read('auditor.log').decode()
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'{prefix}/actions/jobs/{job}/logs')
          assert len(full)>50000 and marker.encode() in full
          assert b'Build completed successfully (8962 jobs)' in full
          assert b'Artifact ID 14407892726' in full
          root=Path('research/quantum-information/diagnostics')
          root.mkdir(parents=True,exist_ok=True)
          arc=root/'BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip'
          log=root/'BFSS_W0C2B0N_R1_44260119108_complete_job.log'
          manifest=root/'BFSS_W0C2B0N_R1_44260119108_GREEN_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw)
          log.write_bytes(full)
          manifest.write_text(json.dumps({
              'gate':'P3-M4-W0C2B0N','attempt':'R1','status':'ORIGINAL_STRICT_GREEN_PENDING_CANONICAL_ACCEPTANCE',
              'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
              'original_zip':{'path':str(arc),'size':size,'sha256':digest,'members':members},
              'original_job_log':{'path':str(log),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'c5841055363a6eef713f35e568409dd2fa2b6c9e',
              'consumer_blob':'3773f069d3da87c7c899596817f02efec639fbfa',
              'workflow_blob':'d431d74251ba5826baf312534fd6578424306643',
              'source_reports':3,'consumer_reports':3,'original_fock_controls':3,
              'negative_auditor_mutants':6,'cold_build_jobs':8962,
              'allowed_axioms':sorted(allowed),'strict_marker':marker,
              'accepted_predecessor_run':44255202048,
              'predecessor_preservation_run':44257915520,
              'historical_stopped_real_native_red_runs':[44218523669,44222678258],
              'claim_ceiling':'Original Source48 real/complex Fock coefficient transport and matrix ring-hom commutator only; original Lie-defect gamma centrality remains OPEN'
          },sort_keys=True,indent=2)+'\n')
          print('BFSS_W0C2B0N_R1_ORIGINAL_STRICT_GREEN_ZIP_FULL_LOG_MEMBER_SHA_CRC_VERIFIED')
          PY
      - name: Git-pin original six-member ZIP full Actions transcript and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2B0N_R1_44260119108_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2B0N_R1_44260119108_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2B0N_R1_44260119108_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'BFSS W0C2B0N R1: preserve provider original strict GREEN ZIP full log and SHA CRC'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
