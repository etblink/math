name: BFSS MASSLESS-M1a original complex quantizer strict

'on':
  push:
    branches:
      - research/bfss-hopfion-gut-counterfactuals-20261121
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessM1aOriginalComplexQuantizerNormalization.lean
      - .github/workflows/bfss-massless-m1a-original-complex-quantizer-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-massless-m1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-complex-quantizer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Frozen original source and isolated-root preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-massless-m1a"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-massless-m1a/tested-sha.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-massless-m1a/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-massless-m1a/preflight.log"
          from pathlib import Path
          import subprocess,json,re
          base="lean/OAI/MathematicalPhysics/BFSS/"
          src=Path(base+"Contrib/Kotler/BFSSMasslessM1aOriginalComplexQuantizerNormalization.lean")
          pins={
            base+"Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            base+"FermionFrequency.lean":"cbb82a42f42b3b3d3695081247bd14d0496abc7d",
            base+"FermionQuantization.lean":"c6b72d030225c707ef54f5285a18a7a8175ee280",
            base+"FrequencyContraction.lean":"425edf6d7d0f9d15ce5f8bc92e8788ef60068618",
            base+"Contrib/Kotler/BFSSMasslessM0OriginalBracketNegationProbe.lean":"948671c8173dd69bba380a1b08fd46c7b63efb57",
          }
          for path,expected in pins.items():
              observed=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert observed==expected,("SOURCE_DRIFT",path,observed,expected)
          s=src.read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessM0OriginalBracketNegationProbe"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==[
            "originalMasslessQuantizer_eq_cubic"]
          assert s.count("theorem originalMasslessQuantizer_eq_cubic")==1
          assert s.count("def masslessSourceFrequency")==1
          assert "set_option autoImplicit false" in s
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",s)
          for forbidden in ["set_option linter.","set_option maxRecDepth",
                            "set_option maxHeartbeats",
                            "D1FOriginalMasslessYukawaFockQuantization",
                            "D1S4OriginalPhysicalQuantizationSelfAdjointProbe",
                            "deformedFermionField_quantized",
                            "deformedFermionField_bracket",
                            "deformedFermionField 1 0",
                            "restrictScalars", "FullL2", "IsSelfAdjoint"]:
              assert forbidden not in s,("SCOPE_VIOLATION",forbidden)
          assert all(term in s for term in [
              "masslessSourceFrequency",
              "originalMasslessQuantizer_eq_cubic",
              "FCP.BFSSMasslessM0.sourceBracketCoefficient_negative_contraction",
              "M.quantizeFrequency (masslessSourceFrequency M x)",
              "M.cubicFermionComponent",
              "smul_neg", "neg_div", "neg_smul"])
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_MASSLESS_M1A_SOURCE_PIN_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-massless-m1a/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold original-source massless complex quantizer and strict single-root complex quantizer axiom check
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-massless-m1a"
          timeout 2500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessM1aOriginalComplexQuantizerNormalization 2>&1 | tee "$E/native-source.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMasslessM1aOriginalComplexQuantizerNormalization.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-massless-m1a"
          for name in ["native-source.log","strict-axioms.log"]:
              body=(d/name).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in body,(name,bad,body[-6000:])
          body=(d/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          expected=["FCP.BFSSMasslessM1a.originalMasslessQuantizer_eq_cubic"]
          assert [n for n,_ in reports]==expected,(reports,expected)
          allowed={"propext","Classical.choice","Quot.sound"}
          for n,listed in reports:
              axioms={a.strip() for a in listed.split(",") if a.strip()}
              assert axioms<=allowed,(n,axioms)
          print("BFSS_MASSLESS_M1A_COMPLEX_SOURCE_ONLY_STRICT_GREEN")
          PY

      - name: Preserve first-causal native and strict evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-massless-m1a-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-massless-m1a/
          if-no-files-found: warn
          retention-days: 30
