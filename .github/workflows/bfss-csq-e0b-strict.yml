name: BFSS CSQ-E0b original basis square strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0bOriginalBasisSquare.lean'
      - 'lean/diagnostics/BFSSCSQE0bIndependentAudit.lean'
      - '.github/workflows/bfss-csq-e0b-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-csq-e0b-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-source-csq-e0:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-csq-e0b"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-csq-e0b/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0bOriginalBasisSquare.lean \
            lean/diagnostics/BFSSCSQE0bIndependentAudit.lean \
            .github/workflows/bfss-csq-e0b-strict.yml \
            > "$RUNNER_TEMP/bfss-csq-e0b/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-csq-e0b/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-csq-e0b/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0aOriginalBasisSelector.lean": "a12c7c4d8b70844aaeb7598f9ccad82bd75aadd6",
            "lean/diagnostics/BFSSCSQE0aIndependentAudit.lean": "bbfcc24e2c726cda71c08d3ca8dd5d84bb88c1d7",
            ".github/workflows/bfss-csq-e0a-strict.yml": "de63886bc41b50dbbeb22dff1ddffaa6c28715ae",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0bOriginalBasisSquare.lean": "c236dc3b239540d6502627765fe87e39f02cb096",
            "lean/diagnostics/BFSSCSQE0bIndependentAudit.lean": "1bdde103629602e7aaebf990c42c0cdc1f486901",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQG0LiteralPhysicalSquare.lean": "ae2ec2b46624886e6eb59ffe33ac8c970925b923",
            "lean/diagnostics/BFSSCSQG0LiteralIndependentAudit.lean": "ef9d51eb59b0692d7ccbcbc9de3de79206479a26",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.lean": "6ccd7ba030643e356c3ea05e76fd8e95c13445ba",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean": "93b5f1eb20b4ff6f23f7f8334ad1c382d5ecd632",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","46afe238d950b4d941e72bb2450f6f5498bd96d0","HEAD"])
          subprocess.check_call(["git","merge-base","--is-ancestor","f320174e85d7a694eb12e602bc1bc451e8fcc303","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSCSQE0bOriginalBasisSquare.lean").read_text()
          t=Path("lean/diagnostics/BFSSCSQE0bIndependentAudit.lean").read_text()
          source_roots = ["fermionDifferenceToEquality","weightedSquarePoint","basisSquarePoint","basisSquareCore"]
          consumer_roots = ["pairedWeightedSquareAudit","pairedBasisSquareAudit"]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQE0aOriginalBasisSelector",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQE0bOriginalBasisSquare",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe|native_decide)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_CSQ_E0B_SOURCE_EXACT_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-csq-e0b/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original basis square and independent paired controls
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-csq-e0b"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSCSQE0bOriginalBasisSquare 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSCSQE0bIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-csq-e0b"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSCSQE0b.fermionDifferenceToEquality",
                  "FCP.BFSSCSQE0b.weightedSquarePoint",
                  "FCP.BFSSCSQE0b.basisSquarePoint",
                  "FCP.BFSSCSQE0b.basisSquareCore",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSCSQE0bIndependent.pairedWeightedSquareAudit",
                  "FCP.BFSSCSQE0bIndependent.pairedBasisSquareAudit",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_CSQ_E0B_ORIGINAL_SOURCE_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-csq-e0b-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-csq-e0b/
          if-no-files-found: warn
          retention-days: 30
