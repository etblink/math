name: SM-P0N0 R1 original JUNO physical-interface strict GREEN independent preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-p0n0-r1-original-strict-green-preservation.yml
permissions:
  actions: read
  contents: write
jobs:
  independent-original-physical-intake-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable accepted history and original SM-P0N0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify source exact JUNO ledger and 27 accepted BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 83bcb3956b6f5c4bf38a1ebe442f8870293ba2d6:research/standard-model/tools/sm_p0n0.py)" = 95192c55e594babe30eecf963debd7acf8a28c59
          test "$(git rev-parse 83bcb3956b6f5c4bf38a1ebe442f8870293ba2d6:research/standard-model/tests/test_sm_p0n0.py)" = 70b7df6ffad8c6c8f8ae2f6a1ddc89f417e375ba
          test "$(git rev-parse 83bcb3956b6f5c4bf38a1ebe442f8870293ba2d6:.github/workflows/sm-p0n0-juno-splitting-strict.yml)" = 6f0aeccbd7fb98237f0d7a19faea362763b51142
          test "$(git rev-parse HEAD:research/standard-model/tools/sm_p0n0.py)" = 95192c55e594babe30eecf963debd7acf8a28c59
          test "$(git rev-parse HEAD:research/standard-model/tests/test_sm_p0n0.py)" = 70b7df6ffad8c6c8f8ae2f6a1ddc89f417e375ba
          test "$(git rev-parse HEAD:research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json)" = 1d391ba994ee23f03c4423b45fbb15e7e42c86f1
          test "$(git rev-parse HEAD:research/standard-model/tools/smd1_scc0.py)" = 95569dffd88af133df3dd56d23e1f61ca8c4a207
          test "$(git rev-parse HEAD:research/standard-model/tools/smd1_scc3b1.py)" = f395234389956eff23512055f23e659066869eb9
          test "$(git rev-parse HEAD:research/standard-model/evidence/SMD1_SCC3B1_R1_44416698450_ORIGINAL_STRICT_GREEN_evidence.zip)" = 242f749c580794702eaaaf8d89a927b799a316d6
          test "$(git rev-parse HEAD:research/standard-model/evidence/SMD1_SCC3B0_R2_44414707214_ORIGINAL_STRICT_GREEN_evidence.zip)" = 0ed52e9e9aed7c98a5d1acefc776facacfc4517d
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean)" = 481a984b5ba7d2d7df41297d162ab1d608646d6e
          python3 - <<'PY'
          import json
          from pathlib import Path
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert sm['last_qualified_decision_methodology']['gate']=='SM-D1-SCC3B1'
          assert sm['last_qualified_formal_methodology']['gate']=='SM-D1-SCC3B0'
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in sm['upcoming'])
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert not list(Path('research/standard-model/evidence').glob('SM_P0N0_R1_44419768921_ORIGINAL_*'))
          print('SM_P0N0_R1_ORIGINAL_TESTED_SOURCE_SM_D0_SCC3B1_SCC3B0_27_BFSS_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Authenticate original physical intake ZIP full job and independent controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/etblink/math'
          run=44419768921;job=135209358069;artifact=14480966815
          tested='83bcb3956b6f5c4bf38a1ebe442f8870293ba2d6'
          size=3798
          digest='bfbc645d41d28e590b0f594c0cdad2a4f85271b77d7b4d384969c43e9389747a'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as resp:return json.load(resp)
          rr=api(f'/actions/runs/{run}')
          jj=api(f'/actions/jobs/{job}')
          aa=api(f'/actions/artifacts/{artifact}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(tested,'completed','success',1)
          assert (jj['id'],jj['run_id'],jj['conclusion'])==(job,run,'success')
          for key in ('Checkout canonical pinned','Verify frozen original','Original SCC0 and SCC3B1',
                      'Independent negative audit','Preserve original native'):
              assert any(s['name'].startswith(key) and s['conclusion']=='success' for s in jj['steps']),key
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(artifact,size,'sha256:'+digest)
          assert (aa['workflow_run']['id'],aa['workflow_run']['head_sha'])==(run,tested)
          assert aa['name']=='sm-p0n0-original-juno-physical-intake-source-consumer'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(path):
              request=urllib.request.Request(base+path,headers=headers)
              try:
                  resp=urllib.request.build_opener(NoRedirect).open(request,timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  target=e.headers['Location']
                  assert target.startswith('https://')
                  with urllib.request.urlopen(target,timeout=90) as r:return r.read()
              else:
                  with resp:return resp.read()
          raw=download(f'/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              required={'tested-commit.txt','preflight.log','python-version.log',
                        'scc0-regression.log','scc3b1-regression.log',
                        'physical-intake-consumer.log','negative-auditor.log',
                        'physical-intake-checkpoint.json','completion-auditor.log'}
              assert required<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'SM_P0N0_20_JUNO_TESTS_SOURCE_EXACT_SM_D0_SCC0_SCC3B1_SCC3B0_27_BFSS_ANCHORS_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              for path,n in [('scc0-regression.log',24),
                             ('scc3b1-regression.log',15),
                             ('physical-intake-consumer.log',20)]:
                  rawlog=z.read(path).decode()
                  assert f'Ran {n} tests' in rawlog and 'OK' in rawlog
                  assert len(re.findall(r'(?m)^test_',rawlog))==n
                  assert 'FAILED' not in rawlog and 'ERROR' not in rawlog
              assert 'SM_P0N0_7_ADVERSARIAL_REJECTIONS_ZERO_UNQUALIFIED_PREDICTIONS_PASS' in z.read('negative-auditor.log').decode()
              assert 'SM_P0N0_24_SCC0_15_SCC3B1_20_INDEPENDENT_7_NEGATIVE_ZERO_MODEL_PREDICTION_STRICT_GREEN' in z.read('completion-auditor.log').decode()
              checkpoint=json.loads(z.read('physical-intake-checkpoint.json'))
              assert checkpoint['gate']=='SM-P0N0'
              assert checkpoint['qualification']=='INTAKE_AND_NEGATIVE_CONTROLS_ONLY'
              assert checkpoint['measurement']['id']=='juno_dm2_21_2026'
              assert checkpoint['measurement']['value']=='3/40000'
              assert checkpoint['measurement']['error_minus']=='3/2500000'
              assert checkpoint['measurement']['unit']=='eV^2'
              assert checkpoint['measurement']['source']=='https://doi.org/10.1038/s41586-026-10538-z'
              assert checkpoint['measurement']['analysis_ordering']=='normal'
              assert checkpoint['measurement']['cofitted_observable']=='juno_sin2theta12_2026'
              assert checkpoint['measurement']['covariance_status']=='NOT_PRESENT_IN_FROZEN_LEDGER'
              assert checkpoint['measurement']['likelihood_status']=='NOT_PRESENT_IN_FROZEN_LEDGER'
              assert checkpoint['measurement']['role']=='EMPIRICAL_MEASUREMENT_NOT_MODEL_PREDICTION'
              assert checkpoint['model_prediction_count']==0
              assert checkpoint['experimental_evidence']=='NO_EXPERIMENTAL_INFERENCE'
              assert checkpoint['physical_SM_D1']=='PROSPECTIVE_UNSTAGED'
              assert checkpoint['candidate_statuses']['BFSS']=='MISSING_PHYSICAL_MAP'
              assert checkpoint['candidate_statuses']['NFC-protected-persistence']=='MISSING_PHYSICAL_MAP'
              assert checkpoint['candidate_statuses']['neutrino-extended-SM-fit']=='FIT_INPUT_NOT_PREDICTION'
              members=[{'name':n,'size':len(z.read(n)),
                        'sha256':hashlib.sha256(z.read(n)).hexdigest(),
                        'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          complete=download(f'/actions/jobs/{job}/logs')
          assert len(complete)>27000,len(complete)
          assert b'SM_P0N0_24_SCC0_15_SCC3B1_20_INDEPENDENT_7_NEGATIVE_ZERO_MODEL_PREDICTION_STRICT_GREEN' in complete
          out=Path('research/standard-model/evidence')
          out.mkdir(parents=True,exist_ok=True)
          stem='SM_P0N0_R1_44419768921_ORIGINAL_'
          zp=out/(stem+'STRICT_GREEN_evidence.zip')
          lp=out/(stem+'complete_job.log')
          mp=out/(stem+'STRICT_GREEN_evidence_manifest.json')
          cp=out/(stem+'physical_intake_checkpoint.json')
          for p in (zp,lp,mp,cp):assert not p.exists(),p
          zp.write_bytes(raw);lp.write_bytes(complete)
          cp.write_text(json.dumps(checkpoint,sort_keys=True,indent=2)+'\n')
          mp.write_text(json.dumps({
              'gate':'SM-P0N0','attempt':'R1',
              'status':'STRICT_PROVENANCE_AND_NEGATIVE_CONTROL_GREEN_NOT_PHYSICAL_PREDICTION',
              'original_run':run,'original_job':job,'original_artifact':artifact,'tested_commit':tested,
              'original_zip':{'path':str(zp),'size':size,'sha256':digest,'members':members},
              'original_full_job':{'path':str(lp),'size':len(complete),'sha256':hashlib.sha256(complete).hexdigest()},
              'machine_checkpoint':{'path':str(cp),'sha256':hashlib.sha256(cp.read_bytes()).hexdigest()},
              'original_tool_blob':'95192c55e594babe30eecf963debd7acf8a28c59',
              'original_consumer_blob':'70b7df6ffad8c6c8f8ae2f6a1ddc89f417e375ba',
              'original_workflow_blob':'6f0aeccbd7fb98237f0d7a19faea362763b51142',
              'frozen_SM_D0_blob':'1d391ba994ee23f03c4423b45fbb15e7e42c86f1',
              'original_SCC0_regression_tests':24,
              'original_SCC3B1_regression_tests':15,
              'original_independent_physical_intake_tests':20,
              'separate_negative_controls':7,
              'qualified_model_predictions':0,
              'BFSS_original_accepted_anchors_unchanged':27,
              'scientific_ceiling':'First JUNO 59.1-day frozen measurement definition and synthetic common-offset negative controls only. No model-derived BFSS/NFC prediction, no covariance, likelihood, model exclusion or physical SM-D1 result.'
          },sort_keys=True,indent=2)+'\n')
          print('SM_P0N0_R1_ORIGINAL_GREEN_JUNO_24_15_20_7_CHECKPOINT_ZERO_MAPS_ZIP_JOB_SHA_CRC_VERIFIED')
          PY
      - name: Commit original authenticated ZIP full job manifest and physical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/standard-model/evidence/SM_P0N0_R1_44419768921_ORIGINAL_*
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 4
          git commit -m 'SM-P0N0 R1 independently archive original source-exact JUNO intake GREEN'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
