name: BFSS P3-AUX-HARDY-G8 original tau derivative strict
'on':
  push:
    branches:
    - integration/bfss-unified-research-20261108
    paths:
    - .github/workflows/bfss-p3-aux-hardy-g8-original-tau-derivative-strict.yml
    - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean
    - lean/diagnostics/BFSSP3AuxHardyG8OriginalTauDerivativeIndependentConsumer.lean
    - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-hardy-g8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-tau-derivative:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout frozen source ancestry
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 96
        persist-credentials: false
    - name: Preflight complete reviewed source closure and toolchain
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bfss-aux-hardy-g8-evidence
        git rev-parse HEAD > bfss-aux-hardy-g8-evidence/tested-sha.txt
        python3 - <<'PY' | tee bfss-aux-hardy-g8-evidence/preflight.log
        from pathlib import Path
        import subprocess,re,json,hashlib
        BASE="b46d2246c05c43e866b9c4c0b405eb133093ae40"
        SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean"
        CONSUMER="lean/diagnostics/BFSSP3AuxHardyG8OriginalTauDerivativeIndependentConsumer.lean"
        HELPER="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean"
        CONTROL_HELPER="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean"
        EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG6OriginalCorePotentialBinding.lean":"ebe37de869b25068dfedb98c60340a27335e5c04","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.lean":"6d0f99d61340b6a052e733c0b964b8c4dcf69457","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9BSourcePairAndChargeReductionProbe.lean":"e066601ddb02e78493eb91582ce2dcb0e6fa3ca1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9COrderedPairCoefficientProbe.lean":"1010bbfc6618718d98fbaf8cab065f4478759f94","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean":"cc0f4624239160dc39a7a191a519786e71df6abd","lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean":"cc01379653404c4ede3d551fd8d823e079543b21","lean/OAI/MathematicalPhysics/BFSS/Kinetic.lean":"14045947b1860b28cbbd82c3f2b40967e795d5a8","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG4OriginalPotentialYCancellation.lean":"b2a482d0817fd39e7437a77d66d8f911c7073de3","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5OriginalPotentialTauCAR.lean":"9ada3167a5de3be647c51f0740b5998d4e6ea45a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean":"0398bafa58b46dfbd83ec90a65be84adb03dedf8","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG7OriginalTauSmoothCore.lean":"d7320101971790d7fe56bfda1b011ae3e5d1b9d9","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean":"03b5236bd91e4664e7101544b065054bd6c925a1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean":"138ab7f545bf00812a55d1cb035251a9eccb6c27","lean/diagnostics/BFSSP3AuxHardyG8OriginalTauDerivativeIndependentConsumer.lean":"0d3714894391fd6afa1bfb00b1df7238421ae7e7","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean":"b7d518b9f4a6ffb4acfaa4f265416a0b3aeccc68"}
        ROOTS=["originalHardyTauCoefficientDerivative","originalHardyTauDerivative","originalHardyTauDerivative_apply","originalHardyTauCore_coordinateDerivative_apply","originalHardyTauCore_derivative_commutator_apply","originalHardyTauCore_derivative_commutator_zero_at"]
        NAMESPACE="FCP.BFSSP3AuxHardyG8OriginalTauDerivative"
        DONORS=["OAI.BFSSQuantum.AlgebraData.coordinateDerivative_multiplier","OAI.BFSSQuantum.AlgebraData.fermionAction_derivative_commute","FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyY_entry_contDiff","FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyTauCore","FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyTauCore_apply","FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyYCLM_apply"]
        CONTROL_ROOTS=["FCP.BFSSP3AuxHardyG8DerivativeProductRule.originalFermionMultiplier_derivative_apply"]
        def git(*a):
            return subprocess.check_output(["git",*a],text=True).strip()
        assert git("cat-file","-t",BASE)=="commit"
        assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
        baseline={}
        for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
            m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
            if m: baseline[m[2]]=m[1]
        seen={}
        stack=[SOURCE,CONSUMER,HELPER,CONTROL_HELPER]
        while stack:
            p=stack.pop()
            if p in seen: continue
            f=Path(p)
            assert f.is_file(),("missing OAI source",p)
            sha=git("hash-object","--no-filters",p)
            if p not in (SOURCE,CONSUMER,CONTROL_HELPER):
                assert baseline.get(p)==sha,("reviewed existing OAI source drift",p,baseline.get(p),sha)
            seen[p]=sha
            for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                for name in names.split("--",1)[0].split():
                    if name=="OAI" or name.startswith("OAI."):
                        stack.append("lean/"+name.replace(".","/")+".lean")
        for p,sha in EXPECTED.items():
            assert seen.get(p)==sha,("frozen donor/candidate drift",p,seen.get(p),sha)
        source=Path(SOURCE).read_text()
        consumer=Path(CONSUMER).read_text()
        helper=Path(HELPER).read_text()
        control=Path(CONTROL_HELPER).read_text()
        assert re.findall(r"(?m)^import (\S+)$",helper)==["Mathlib"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",helper)==["FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply"]
        assert re.findall(r"(?m)^import (\S+)$",control)==["OAI.MathematicalPhysics.BFSS.CliffordSymbols"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",control)==CONTROL_ROOTS
        assert "pairedAlgebraData" not in control and "originalHardyTau" not in control
        assert "fermionAction_derivative_commute" in control and "coordinateDerivative_multiplier" in control
        assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG7OriginalTauSmoothCore","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG8DerivativeProductRule"]
        assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG8OriginalTauDerivative","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",source)==ROOTS
        assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[NAMESPACE+"."+n for n in ROOTS]+DONORS
        for code in (source,consumer,helper,control):
            assert "set_option autoImplicit false" in code
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
            assert "maxHeartbeats" not in code and "maxRecDepth" not in code
        assert "fderiv ℝ (fun Z : Boson 2 => (originalHardyY M i j Z A α β : ℂ)) X" in source
        assert "(EuclideanSpace.single (k, B) 1)" in source
        assert "originalFermionMultiplier_derivative_apply" in source
        assert "originalHardyTauCore M i j α (coordinateDerivative k B f) X +" in source
        assert "pairedAlgebraData" in consumer and "open FCP.BFSSSU2GaugeG1A" in consumer
        assert "SmoothCore 2" in consumer and "Fermion 2" in consumer and "FullL2 2" in consumer
        assert "originalHardyTauCore pairedAlgebraData i i α" in consumer
        assert len(re.findall(r"(?m)^example\b",consumer))==12
        assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
        packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
        assert next(v["rev"] for v in packages if v["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
        out=Path("bfss-aux-hardy-g8-evidence")
        receipt={"status":"PREFLIGHT_NOT_LEAN_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),
            "reviewed_existing_source_baseline":BASE,"source":SOURCE,"consumer":CONSUMER,
            "isolated_helper":HELPER,"product_rule_helper":CONTROL_HELPER,"product_rule_roots":CONTROL_ROOTS,
            "transitive_OAI_pin_count":len(seen),"pins":dict(sorted(seen.items())),
            "source_roots":[NAMESPACE+"."+n for n in ROOTS],"independent_donor_roots":DONORS}
        manifest=out/"pin-manifest.json"
        manifest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G8_PREFLIGHT_PASS",len(seen),hashlib.sha256(manifest.read_bytes()).hexdigest())
        PY
    - name: Restore pinned Lean and Mathlib
      shell: bash
      timeout-minutes: 40
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
        curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        source "$HOME/.elan/env"
        cd lean
        timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-hardy-g8-evidence/cache.log
        test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
        test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
    - name: Isolated Mathlib finite operator evaluation before native build
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        helper_mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG5FiniteOperatorEvaluation"
        helper_src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean"
        helper_obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.olean"
        timeout 500s lake build "$helper_mod" 2>&1 | tee ../bfss-aux-hardy-g8-evidence/helper-build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$helper_obj" "$helper_src" 2>&1 | tee ../bfss-aux-hardy-g8-evidence/helper.log
        python3 - <<'PY'
        from pathlib import Path
        import re,json
        d=Path("../bfss-aux-hardy-g8-evidence")
        expected=["FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply"]
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        for name in ("helper-build.log","helper.log"):
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if name=="helper.log":
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                assert [n for n,_ in reports]==expected,(name,reports)
                for declaration,raw in reports:
                    assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
        (d/"helper-scope.json").write_text(json.dumps({"status":"GENERIC_FINITE_OPERATOR_EVALUATION_PASS","native_G8_qualification":False},sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G8_FINITE_OPERATOR_EVALUATION_PASS")
        PY
    - name: Original derivative product rule before native data build
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        helper_mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG8DerivativeProductRule"
        helper_src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean"
        helper_obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.olean"
        timeout 500s lake build "$helper_mod" 2>&1 | tee ../bfss-aux-hardy-g8-evidence/product-rule-build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$helper_obj" "$helper_src" 2>&1 | tee ../bfss-aux-hardy-g8-evidence/product-rule.log
        python3 - <<'PY'
        from pathlib import Path
        import re,json
        d=Path("../bfss-aux-hardy-g8-evidence")
        expected=["FCP.BFSSP3AuxHardyG8DerivativeProductRule.originalFermionMultiplier_derivative_apply"]
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        for name in ("product-rule-build.log","product-rule.log"):
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if name=="product-rule.log":
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                assert [n for n,_ in reports]==expected,(name,reports)
                for declaration,raw in reports:
                    assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
        (d/"product-rule-scope.json").write_text(json.dumps({"status":"ORIGINAL_DERIVATIVE_PRODUCT_RULE_HELPER_PASS","native_G8_qualification":False},sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G8_ORIGINAL_DERIVATIVE_PRODUCT_RULE_HELPER_PASS")
        PY
    - name: Cold original tau derivative source and native consumer with six and twelve root reports
      shell: bash
      timeout-minutes: 75
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG8OriginalTauDerivative"
        src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean"
        obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.olean"
        rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
        timeout 3600s lake build "$mod" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG8DerivativeProductRule 2>&1 | tee ../bfss-aux-hardy-g8-evidence/build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-aux-hardy-g8-evidence/source.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG8OriginalTauDerivativeIndependentConsumer.lean 2>&1 | tee ../bfss-aux-hardy-g8-evidence/consumer.log
        python3 - <<'PY'
        from pathlib import Path
        import re,json
        d=Path("../bfss-aux-hardy-g8-evidence")
        new_roots=["FCP.BFSSP3AuxHardyG8OriginalTauDerivative.originalHardyTauCoefficientDerivative","FCP.BFSSP3AuxHardyG8OriginalTauDerivative.originalHardyTauDerivative","FCP.BFSSP3AuxHardyG8OriginalTauDerivative.originalHardyTauDerivative_apply","FCP.BFSSP3AuxHardyG8OriginalTauDerivative.originalHardyTauCore_coordinateDerivative_apply","FCP.BFSSP3AuxHardyG8OriginalTauDerivative.originalHardyTauCore_derivative_commutator_apply","FCP.BFSSP3AuxHardyG8OriginalTauDerivative.originalHardyTauCore_derivative_commutator_zero_at"]
        donors=["OAI.BFSSQuantum.AlgebraData.coordinateDerivative_multiplier","OAI.BFSSQuantum.AlgebraData.fermionAction_derivative_commute","FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyY_entry_contDiff","FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyTauCore","FCP.BFSSP3AuxHardyG7OriginalTauSmoothCore.originalHardyTauCore_apply","FCP.BFSSP3AuxHardyG3OriginalYDerivativeContraction.originalHardyYCLM_apply"]
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        for name,expected in [
            ("helper-build.log",None),("helper.log",["FCP.BFSSP3AuxHardyG5FiniteOperatorEvaluation.finiteOperatorAnticommutator_apply"]),("product-rule-build.log",None),("product-rule.log",["FCP.BFSSP3AuxHardyG8DerivativeProductRule.originalFermionMultiplier_derivative_apply"]),("build.log",None),("source.log",new_roots),("consumer.log",new_roots+donors)]:
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if expected is not None:
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                assert [n for n,_ in reports]==expected,(name,reports,expected)
                for declaration,raw in reports:
                    assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
        (d/"scope-receipt.json").write_text(json.dumps({'status': 'ORIGINAL_TAU_COORDINATE_DERIVATIVE_STRICT_GREEN', 'original_native_SmoothCore_Boson_Fock_consumer': True, 'original_multiplier_and_fermion_derivative_laws_reused': True, 'literal_original_Y_complex_entry_derivative': True, 'original_tau_coordinate_product_rule': True, 'explicit_coefficient_derivative_Fock_action': True, 'original_tau_derivative_commutator_pointwise': True, 'commutator_zero_at_state_zero': True, 'original_coefficients_unchanged': True, 'diagonal_plane_labels_retained': True, 'new_roots': 6, 'independent_donor_roots': 6, 'isolated_accepted_generic_helper_reports': 1, 'early_original_product_rule_helper_reports': 1, 'scalar_entry_derivative_bound_to_G3_basis_proved': False, 'finite_CAR_kinetic_contraction_proved': False, 'full_smooth_core_charge_tau_identity_proved': False, 'bounded_L2_tau_extension_proved': False, 'tau_norm_or_physical_Spin9_proved': False, 'Hardy_fidelity_zero_mode_or_gap_proved': False, 'new_Fock_Clifford_or_Hamiltonian': False},sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G8_ORIGINAL_TAU_COORDINATE_DERIVATIVE_STRICT_GREEN")
        PY
    - name: Preserve strict and first-causal evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bfss-aux-hardy-g8-evidence
        path: bfss-aux-hardy-g8-evidence/
        if-no-files-found: warn
        retention-days: 14
