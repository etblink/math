name: BFSS M4 W0C2A R1 original bivector Lie-defect trace witness strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean
      - lean/diagnostics/BFSSP3M4W0C2AOriginalBivectorLieDefectIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0c2a-r1-original-lie-defect-trace-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0c2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-bivector-defect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight W0C1 and CT0 accepted original evidence and W0C2A contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0c2a-r1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0c2a-r1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0c2a-r1/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean":"51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb","lean/diagnostics/BFSSP3M4W0C2AOriginalBivectorLieDefectIndependentConsumer.lean":"4ddacfbe1ee1d7d55b321f4cb9c0d6d462261aec","research/quantum-information/BFSS_QIT_SCC_W0C2A_ORIGINAL_BIVECTOR_DEFECT_REDUCTION_PRE_GATE_2026_11_17.md":"8f8994200d1321053feaea80f307d72f5b2e901e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT0OriginalSkewBivectorTrace.lean":"a6f93c62c83bf51a0b89691196f875399d2896fa","lean/diagnostics/BFSSP3M4CT0OriginalSkewBivectorTraceIndependentConsumer.lean":"f2ddadc880c62632dd91547526ee97bc92a0d504",".github/workflows/bfss-m4-ct0-original-skew-bivector-trace-strict.yml":"ff7a9b5c612ee9a6050cc3622b7004150b03f46c","research/spectral-p2-original-field/diagnostics/BFSS_M4_CT0_R2_43983772199_evidence.zip":"e0e0f0da963b7895eae425f4392b3b12866a2116","research/spectral-p2-original-field/diagnostics/BFSS_M4_CT0_R2_43983772199_complete_job.log":"a8f63cfafe8a914b9b155f43d213b7e3fd218ac1","research/spectral-p2-original-field/diagnostics/BFSS_M4_CT0_R2_43983772199_evidence_manifest.json":"83db728c5e087968086ed58bae492952315c03cd","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean":"5fafaa3d73d3761719ea160466b40d94b85d74db","lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumerR2.lean":"85e8067c892bc52533f6a3ecc1f099010efac4ae",".github/workflows/bfss-m4-w0c1-r2-original-commutator-trace-witness-strict.yml":"c9db16b6c55239f3c8235a70f623ca9f929dcee1","research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip":"49e33bdd397f1a803b4818044549bbc6d33c3fe3","research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_complete_job.log":"8f0acb0cc2ddbc1cf525e5ea5973cbed375b09e4","research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_GREEN_evidence_manifest.json":"bc464292d81b0d9772436e9859f637b2e1d21db7","research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip":"b9c846a1ef7abdecc8d5e627c5a9921a903bbf14","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,got,expected)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4W0C2AOriginalBivectorLieDefectIndependentConsumer.lean").read_text()
          sourceroots=["originalSource48_matrix_commutator_skew",
              "originalSource48K_lieDefect_trace_zero",
              "originalSource48K_lieBracket_of_defect_central"]
          consroots=[x+"_consumer" for x in sourceroots]
          assert re.findall(r"(?m)^theorem\b",source)==["theorem"]*3
          assert re.findall(r"(?m)^theorem\b",consumer)==["theorem"]*3
          assert len(re.findall(r"(?m)^example\b",consumer))==3
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==sourceroots
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==consroots
          assert len(re.findall(r"(?m)^import ",source))==3
          assert len(re.findall(r"(?m)^import ",consumer))==1
          assert consumer.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2AOriginalBivectorLieDefectTraceBridge\n")
          assert "noncomputable def originalSource48K_lieDefect" in source
          assert "hcentral : ∀ k : Source48Label" in source
          for part in ["originalFockTrace_mul_comm","originalSource48BivectorK_skew_trace_zero",
              "originalFockWitness_kernel_zero","originalSource48K_lieDefect_trace_zero",
              "Matrix.transpose_sub","Matrix.transpose_mul","sub_eq_zero.mp"]:
              assert part in source,part
          for body in (source,consumer):
              assert "set_option autoImplicit false" in body
              assert "open FCP.BFSSS1V0" in body
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",body)
              assert "maxRecDepth" not in body and "maxHeartbeats" not in body
              assert "P3M4QTC1OriginalSourceRealComplexQuarterBridge" not in body
              assert "P3M4CT1G0OriginalFockJacobiSource48Adapter" not in body
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2A","R1","PENDING_STRICT_CI",False)
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean"]
          assert a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0C2AOriginalBivectorLieDefectIndependentConsumer.lean"]
          assert a["contract_commit"]=="3084f8598e1722420786d0d5249a56ac7710cd5b"
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==3
          assert a["independent_controls"]==3 and a["accepted_predecessor_run"]==44208084307
          assert (q["gate"],q["attempt"],q["run_id"],q["status"])==("P3-M4-W0C1","R2",44208084307,"GREEN_QUALIFIED")
          assert q["qualification"] is True and s["accepted_anchors"][-1]==q
          assert q["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean"]
          assert q["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip"]
          assert q["preservation_run"]==44210764881
          ct0=next(z for z in s["accepted_anchors"] if z["gate"]=="P3-M4-CT0")
          assert ct0["run_id"]==43983772199 and ct0["status"]=="GREEN_QUALIFIED"
          assert ct0["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT0OriginalSkewBivectorTrace.lean"]
          assert ct0["evidence_archive_blob"]==pins["research/spectral-p2-original-field/diagnostics/BFSS_M4_CT0_R2_43983772199_evidence.zip"]
          assert s["next_planned"]["gate"]=="P3-M4-W0C2B"
          assert s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert Path(a["prospective_receipt"]).is_file()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          zipname="research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip"
          raw=Path(zipname).read_bytes()
          assert len(raw)==19649 and hashlib.sha256(raw).hexdigest()=="94b561a285577bbe61cf780ecfbf8843415f5b5f11889ae67632c2c29fa51ac1"
          with zipfile.ZipFile(zipname) as z:
              assert z.testzip() is None and set(z.namelist())=={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()=="3f45d2df6c4200086ba2a8ee404d2f4e37524672"
              assert "Build completed successfully (9230 jobs)." in z.read("cold-source.log").decode()
          assert s["previous_active_W0C1_R1_RED"]["run_id"]==44204390734
          print("BFSS_W0C2A_R1_ORIGINAL_W0C1_CT0_SOURCE_EXACT_AND_EVIDENCE_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original bivector defect, independent consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0c2a-r1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C2AOriginalBivectorLieDefectTraceBridge 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0C2AOriginalBivectorLieDefectIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0c2a-r1"
          allowed={"propext","Classical.choice","Quot.sound"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(content,expected):
              assert "error:" not in content and "sorryAx" not in content
              warnings=[line for line in content.splitlines() if "warning:" in line and not warning_ok.fullmatch(line)]
              assert not warnings,warnings[:3]
              found=pat.findall(content)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert names==expected and len(set(names))==len(names),names
              for _,axioms in found:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed
          good="'N.a' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.b' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.c' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["a","b","c"])
          bad=[good.replace("Quot.sound","sorryAx",1),good.replace("Quot.sound","Foreign.axiom",1),good+good,"",good+"warning: unexpected warning\n",good+"error: failed proof\n"]
          for i,case in enumerate(bad):
              try:audit(case,["a","b","c"])
              except AssertionError:pass
              else:raise AssertionError(("negative mutation accepted",i))
          cold=(root/"cold-source.log").read_text()
          assert "Build completed successfully" in cold and "error:" not in cold and "sorryAx" not in cold
          audit((root/"source-axioms.log").read_text(),["originalSource48_matrix_commutator_skew","originalSource48K_lieDefect_trace_zero","originalSource48K_lieBracket_of_defect_central"])
          audit((root/"consumer.log").read_text(),["originalSource48_matrix_commutator_skew_consumer","originalSource48K_lieDefect_trace_zero_consumer","originalSource48K_lieBracket_of_defect_central_consumer"])
          print("BFSS_W0C2A_R1_ORIGINAL_FOCK_DEFECT_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN")
          PY
      - name: Preserve exact original proof and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0c2a-r1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0c2a-r1/
          if-no-files-found: warn
          retention-days: 14
