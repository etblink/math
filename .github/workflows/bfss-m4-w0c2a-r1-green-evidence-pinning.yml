name: BFSS W0C2A R1 original conditional Lie-defect GREEN evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c2a-r1-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-provider-original-W0C2A-R1-GREEN:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact original W0C2A and qualified CT0/W0C1 donors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify native theorem and donor original bytes before preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C2AOriginalBivectorLieDefectTraceBridge.lean)" = 51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C2AOriginalBivectorLieDefectIndependentConsumer.lean)" = 4ddacfbe1ee1d7d55b321f4cb9c0d6d462261aec
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c2a-r1-original-lie-defect-trace-strict.yml)" = c1a18092b61cb05c08e08231ce10daadce99de45
          test "$(git rev-parse HEAD:research/quantum-information/BFSS_QIT_SCC_W0C2A_ORIGINAL_BIVECTOR_DEFECT_REDUCTION_PRE_GATE_2026_11_17.md)" = 8f8994200d1321053feaea80f307d72f5b2e901e
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4CT0OriginalSkewBivectorTrace.lean)" = a6f93c62c83bf51a0b89691196f875399d2896fa
          test "$(git rev-parse HEAD:research/spectral-p2-original-field/diagnostics/BFSS_M4_CT0_R2_43983772199_evidence.zip)" = e0e0f0da963b7895eae425f4392b3b12866a2116
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitnessR2.lean)" = 5fafaa3d73d3761719ea160466b40d94b85d74db
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C1_R2_44208084307_GREEN_evidence.zip)" = 49e33bdd397f1a803b4818044549bbc6d33c3fe3
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_complete_job.log)" = 8f0acb0cc2ddbc1cf525e5ea5973cbed375b09e4
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_W0C1_R2_44208084307_GREEN_evidence_manifest.json)" = bc464292d81b0d9772436e9859f637b2e1d21db7
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip)" = b9c846a1ef7abdecc8d5e627c5a9921a903bbf14
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C2A","R1","PENDING_STRICT_CI",False)
          assert a["source_blob"]=="51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb"
          assert a["consumer_blob"]=="4ddacfbe1ee1d7d55b321f4cb9c0d6d462261aec"
          assert a["workflow_blob"]=="c1a18092b61cb05c08e08231ce10daadce99de45"
          assert a["contract_commit"]=="3084f8598e1722420786d0d5249a56ac7710cd5b"
          assert (q["gate"],q["attempt"],q["run_id"],q["status"])==("P3-M4-W0C1","R2",44208084307,"GREEN_QUALIFIED")
          assert q["qualification"] is True and s["accepted_anchors"][-1]==q
          assert q["preservation_run"]==44210764881
          ct0=next(x for x in s["accepted_anchors"] if x["gate"]=="P3-M4-CT0")
          assert ct0["run_id"]==43983772199 and ct0["qualification"] is True
          assert s["next_planned"]["gate"]=="P3-M4-W0C2B" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert s["strategic_focus"]["full_bivector_bracket_qualified"] is False
          for p in ["research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip",
                    "research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_complete_job.log",
                    "research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_GREEN_evidence_manifest.json"]:
              assert not Path(p).exists(),p
          print("BFSS_W0C2A_R1_UNPROMOTED_ORIGINAL_EVIDENCE_ARCHIVER_PREFLIGHT_PASS")
          PY
      - name: Download and validate original CI ZIP and full original job transcript
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          run=44213315719;job=134496828078;artifact=14388057344
          tested="48e7e58b23c19643c905d16fe69e46d0a7c0a73e"
          size=20465
          digest="09bdc60577e56a767738cc85d94c11eafbd9f06a2521f6637b08a09ddd4e9453"
          marker="BFSS_W0C2A_R1_ORIGINAL_FOCK_DEFECT_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN"
          preflight="BFSS_W0C2A_R1_ORIGINAL_W0C1_CT0_SOURCE_EXACT_AND_EVIDENCE_PREFLIGHT_PASS"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return json.load(response)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          jobinfo=getjson(f"{prefix}/actions/jobs/{job}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["status"]=="completed" and runinfo["conclusion"]=="success"
          assert runinfo["head_sha"]==tested and runinfo["run_attempt"]==1
          assert jobinfo["id"]==job and jobinfo["run_id"]==run and jobinfo["conclusion"]=="success"
          for name in ["Preflight W0C1 and CT0 accepted original evidence and W0C2A contract",
                       "Restore pinned Lean 4.34.1 and Mathlib",
                       "Cold original bivector defect, independent consumer and axiom audit"]:
              assert any(x["name"]==name and x["conclusion"]=="success" for x in jobinfo["steps"]),name
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with r:return r.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={"propext","Classical.choice","Quot.sound"}
          def audit(text,expected):
              assert "error:" not in text and "sorryAx" not in text
              roots=pat.findall(text)
              assert len(roots)==len(expected),(roots,expected)
              assert [n.rsplit(".",1)[-1] for n,_ in roots]==expected,roots
              assert len({n for n,_ in roots})==len(roots)
              assert all({x.strip() for x in axioms.split(",") if x.strip()}<=allowed for _,axioms in roots)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert preflight in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9239 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert marker in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),[
                  "originalSource48_matrix_commutator_skew",
                  "originalSource48K_lieDefect_trace_zero",
                  "originalSource48K_lieBracket_of_defect_central"])
              audit(z.read("consumer.log").decode(),[
                  "originalSource48_matrix_commutator_skew_consumer",
                  "originalSource48K_lieDefect_trace_zero_consumer",
                  "originalSource48K_lieBracket_of_defect_central_consumer"])
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          complete=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(complete)>200000
          assert b"Build completed successfully (9239 jobs)." in complete
          assert preflight.encode() in complete and marker.encode() in complete
          assert b"Artifact ID 14388057344" in complete
          # The complete Actions transcript echoes negative auditor probes; only actual axiom reports are audited.
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/f"BFSS_M4_W0C2A_R1_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0C2A_R1_{run}_complete_job.log"
          manifest=root/f"BFSS_W0C2A_R1_{run}_GREEN_evidence_manifest.json"
          for p in (archive,full,manifest):assert not p.exists(),p
          archive.write_bytes(raw);full.write_bytes(complete)
          record={
            "gate":"P3-M4-W0C2A","attempt":"R1","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(full),"size":len(complete),"sha256":hashlib.sha256(complete).hexdigest()},
            "source_blob":"51c4b4ab238bcc0f897822a7da4d9fc74dfd55fb",
            "consumer_blob":"4ddacfbe1ee1d7d55b321f4cb9c0d6d462261aec",
            "workflow_blob":"c1a18092b61cb05c08e08231ce10daadce99de45",
            "source_reports":3,"consumer_reports":3,"independent_controls":3,"negative_mutants":6,
            "cold_build_jobs":9239,"strict_marker":marker,"preflight_marker":preflight,
            "allowed_axioms":["propext","Classical.choice","Quot.sound"],
            "accepted_predecessor_run":44208084307,
            "qualified_CT0_run":43983772199,
            "prior_W0C1_R1_native_red_run":44204390734,
            "claim_ceiling":"Original defect trace zero and conditional all-48-gamma centralizer reduction only; unconditional original K Lie bracket NOT PROVED"
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0C2A_R1_PROVIDER_ORIGINAL_GREEN_ZIP_FULL_JOB_LOG_AND_MEMBER_SHA_CRC_PASS")
          PY
      - name: Git-pin provider-original ZIP, full Actions log and member hash manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_complete_job.log research/quantum-information/diagnostics/BFSS_W0C2A_R1_44213315719_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0C2A_R1_44213315719_GREEN_evidence.zip | tr -d ' ')" = 20465
          git commit -m "BFSS W0C2A R1: preserve original conditional Lie-defect GREEN ZIP complete log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
          echo "BFSS_W0C2A_R1_ORIGINAL_GREEN_EVIDENCE_GIT_PIN_COMPLETE"
