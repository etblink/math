name: SM-D0 truth-first empirical constraints frozen-source provenance strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json
      - research/standard-model/tools/smd0_validate.py
      - research/standard-model/SM_D0_EMPIRICAL_CONSTRAINTS_RESEARCH_AND_VALIDATION_2026_11_18.md
      - .github/workflows/sm-d0-empirical-constraints-frozen-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm-d0-empirical-constraints-frozen-provenance
  cancel-in-progress: false
jobs:
  independent-empirical-record-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact truth-first unified integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight SM-D0 source records pinned SM-Y0 original GREEN and BFSS historical status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sm-d0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sm-d0/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d0/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          pins={
            'research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json':'1d391ba994ee23f03c4423b45fbb15e7e42c86f1',
            'research/standard-model/tools/smd0_validate.py':'acb1847efbc092b9e5df7a775a7550dc1506f85b',
            'research/standard-model/SM_D0_EMPIRICAL_CONSTRAINTS_RESEARCH_AND_VALIDATION_2026_11_18.md':'706daade555cda8a547875f7ace28c7834ae9d46',
            'research/methodology/TRUTH_FIRST_FOUNDATIONAL_RESEARCH_CHARTER_2026_11_18.md':'0513dda5fe1feaf4572d0dd1ed09293994ec2391',
            'research/standard-model/SM_GATE_STATE.json':'02768df91731fcba91391c59713a8c33d8efec22',
            'research/standard-model/evidence/SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence.zip':'8123915a1c0f792a031432d81a2ebc10dfab0c83',
            'research/standard-model/evidence/SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence_manifest.json':'a85a0bbc75e30cbce5a889031ac500058dde7a5f',
            'research/standard-model/evidence/SMY0_R1_44388795375_ORIGINAL_complete_job.log':'f05b7bf2795b243440f5d42c62825e410771239f',
            'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean':'7d372392703d0fe69942df9df58b421af6850656',
            'research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence.zip':'924d03cbeb88a186dc3f733297e5f01e04bbdc51'
          }
          for p,expected in pins.items():
              got=subprocess.check_output(['git','hash-object','--no-filters',p],text=True).strip()
              assert got==expected,(p,got,expected)
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          q=sm['last_qualified']
          assert q['gate']=='SM-Y0' and q['attempt']=='R1'
          assert q['status']=='STRICT_GREEN_INDEPENDENTLY_ARCHIVED'
          assert q['original_native_run']==44388795375
          assert q['independent_preservation_run']==44390133718
          assert q['archive_sha256']=='67e997beebb4646463fd3a690afb91e6dd76ba917f596828613b331c814c5030'
          assert sm['upcoming'][0]['id']=='SM-D0'
          bfss=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert len(bfss['accepted_anchors'])==27 and bfss['accepted_anchors'][-1]==bfss['last_qualified']
          assert (bfss['active']['gate'],bfss['active']['status'],bfss['active']['qualification'])==(
            'P3-M4-W0C2B2','BLOCKED',False)
          assert bfss['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          code=Path('research/standard-model/tools/smd0_validate.py').read_text()
          assert 'urlopen(' not in code and 'requests.get(' not in code and 'httpx.get(' not in code
          assert 'primary_sources_fetched_in_ci' in code
          assert '10_NEGATIVE_MUTATIONS_PASSED' in code
          report=Path('research/standard-model/SM_D0_EMPIRICAL_CONSTRAINTS_RESEARCH_AND_VALIDATION_2026_11_18.md').read_text()
          assert 'not a PDG world average' in report or 'neither a comprehensive latest/global fit nor a PDG world average' in report
          assert '2026-11-18' in report and 'NOT TESTED' in report
          print('SM_D0_TRUTH_FIRST_CHARTER_SM_Y0_QUALIFIED_27_BFSS_ACCEPTED_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Validate ten curated original-source records and ten negative mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/standard-model/tools/smd0_validate.py
          timeout 120s python3 research/standard-model/tools/smd0_validate.py "$RUNNER_TEMP/sm-d0/validation.json" 2>&1 | tee "$RUNNER_TEMP/sm-d0/audit.log"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d0/assertions.log"
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'sm-d0'
          m=json.loads((p/'validation.json').read_text())
          assert m['record_count']==10
          assert m['measurement_count']==5 and m['lower_limit_count']==4 and m['upper_limit_count']==1
          assert m['negative_mutations_rejected']==10
          assert m['primary_sources_fetched_in_ci'] is False
          a=(p/'audit.log').read_text()
          assert 'SM_D0_10_PRIMARY_SOURCED_RECORDS_MEASUREMENT_LIMIT_TYPES_10_NEGATIVE_MUTATIONS_PASSED' in a
          for key,file in [
            ('ledger_sha256','research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json'),
            ('validator_sha256','research/standard-model/tools/smd0_validate.py')]:
              assert hashlib.sha256(Path(file).read_bytes()).hexdigest()==m[key]
          doc=json.loads(Path('research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json').read_text())
          assert doc['as_of']=='2026-11-18'
          assert len(doc['constraints'])==10
          print('SM_D0_10_INPUTS_10_NEGATIVE_AUDITS_ORIGINAL_SCHEMA_AND_PINNED_SOURCE_SHA_STRICT_GREEN')
          PY
      - name: Upload exact SM-D0 frozen original validation records for independent archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm-d0-original-frozen-empirical-evidence
          path: /home/runner/work/_temp/sm-d0/
          retention-days: 14
          if-no-files-found: warn
