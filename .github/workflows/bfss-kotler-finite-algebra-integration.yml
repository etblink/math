name: BFSS community-aligned Kotler finite algebra smoke gates

on:
  push:
    branches:
      - integration/community-20261027-bfss
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2ColorCrossProbe.lean
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2RealGammaProbe.lean
      - .github/workflows/bfss-kotler-finite-algebra-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-algebra:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: SU2RealGammaProbe
            parent: OAI.MathematicalPhysics.BFSS.Core
            pin: b9b8192055c70f0d001d7982669b9823c55562ed
          - module: SU2ColorCrossProbe
            parent: OAI.MathematicalPhysics.BFSS.PotentialBasis OAI.Analysis.CharacterCriterion.Pauli
            pin: f2d6ca5a5bfb9de262c1128b15ddc407631d6c98
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out aligned owner branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce frozen original algebra and contributed source identities
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          SOURCE_PIN: ${{ matrix.pin }}
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = '9882359ced78b0a3bd7e2f057974bd0a031b3e60'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/${MODULE}.lean)" = "${SOURCE_PIN}"
      - name: Free runner disk for pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          lean --version
          lake --version
      - name: Restore pinned Mathlib source and cache
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
      - name: Compile actual original dependencies and new module
        shell: bash
        timeout-minutes: 65
        env:
          MODULE: ${{ matrix.module }}
          PARENTS: ${{ matrix.parent }}
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3000s lake build ${PARENTS}
          target="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/${MODULE}"
          mkdir -p .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          timeout 660s lake env lean -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "/tmp/${MODULE}.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          python3 - "${MODULE}" <<'PY'
          import pathlib, re, sys
          name = sys.argv[1]
          source = pathlib.Path(f'OAI/MathematicalPhysics/BFSS/Contrib/Kotler/{name}.lean').read_text()
          log = pathlib.Path(f'/tmp/{name}.log').read_text()
          assert 'sorryAx' not in log and 'error:' not in log and 'warning:' not in log, log[-4500:]
          printed = re.findall(r'^#print axioms (\S+)', source, re.M)
          axioms = re.findall(r"(?m)^'([^']+)' depends on axioms: \[([^]]*)\]", log)
          assert len(axioms) >= len(printed), (name, len(axioms), len(printed), log[-4500:])
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for declaration, dependencies in axioms:
              used = {part.strip() for part in dependencies.split(',') if part.strip()}
              assert used <= allowed, (declaration, used)
          print(f'KOTLER_BFSS_{name}_STRICT_ONE_MODULE_PASS')
          PY
