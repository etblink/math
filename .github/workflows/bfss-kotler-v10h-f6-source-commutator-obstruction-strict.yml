name: BFSS V10H F6 source Spin9 commutator obstruction conditional perfectness strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe.lean
      - .github/workflows/bfss-kotler-v10h-f6-source-commutator-obstruction-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-commutator-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact qualified F5 and F6 source, pinned source context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f6"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f6/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe.lean")" = '60af2103131f6dae30623ea7ce3204cd9ab96299'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe.lean")" = '47e13c108393146c2ebb699237edb1414564d34d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe.lean")" = '1b4edd14c457dea12481c1b5417ccf969290ddbd'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe.lean').read_text()
          names=["gammaDetDirectHom_inv_mul","gammaDetDirectHom_commutator","source9_commutator_le_orientation","source9_orientation_eq_top_of_isPerfect","originalPaired48_mem_SO_of_isPerfect"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s)) == 1,n
          assert s.count('#print axioms ') == 5
          executable=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in executable,'unhandled nested source comment'
          assert 'Mathlib.GroupTheory.IsPerfect' in executable
          assert 'gammaDetDirectHom' in executable
          assert 'Subgroup.commutator_le' in executable
          assert 'Group.IsPerfect' in executable
          assert 'hperfect :' in executable
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in executable
          assert 'Matrix.detMonoidHom' not in executable
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',executable)
          print('V10H_F6_SOURCE_COMMUTATOR_CONDITIONAL_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F5 source Spin9 direct determinant character
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe

      - name: Fresh F6 source-commutator and explicit perfectness conditional compile
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f6/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f6/compiler.log")" -eq 5

      - name: Independently elaborate source-exact five F6 declarations and axiom whitelist
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F6_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          open scoped commutatorElement
          noncomputable example (g : spinGroup source9Quadratic) :
              gammaDetDirectHom g * gammaDetDirectHom g⁻¹ = 1 :=
            gammaDetDirectHom_inv_mul g
          noncomputable example (g h : spinGroup source9Quadratic) :
              gammaDetDirectHom ⁅g, h⁆ = 1 :=
            gammaDetDirectHom_commutator g h
          noncomputable example :
              commutator (spinGroup source9Quadratic) ≤
                source9OrientationSubgroup :=
            source9_commutator_le_orientation
          noncomputable example
              (hperfect : Group.IsPerfect (spinGroup source9Quadratic)) :
              source9OrientationSubgroup = ⊤ :=
            source9_orientation_eq_top_of_isPerfect hperfect
          noncomputable example
              (hperfect : Group.IsPerfect (spinGroup source9Quadratic))
              (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) ∈
                Matrix.specialOrthogonalGroup Source48Label ℝ :=
            originalPaired48_mem_SO_of_isPerfect hperfect g
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_inv_mul
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_commutator
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9_commutator_le_orientation
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9_orientation_eq_top_of_isPerfect
          #print axioms FCP.BFSSPairedSpin9DetFixture.originalPaired48_mem_SO_of_isPerfect
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F6_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f6/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f6'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["gammaDetDirectHom_inv_mul","gammaDetDirectHom_commutator","source9_commutator_le_orientation","source9_orientation_eq_top_of_isPerfect","originalPaired48_mem_SO_of_isPerfect"]}
          assert len(reports)==5 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F6_SOURCE_COMMUTATOR_5_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f6-source-commutator-perfectness-conditional-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f6
          if-no-files-found: warn
