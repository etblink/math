name: BFSS V10H F10BA original gamma arbitrary-skew-pair defect extension strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BAOriginalGammaBracketDefectArbitrarySkewExtension.lean
      - .github/workflows/bfss-kotler-v10h-f10ba-original-gamma-arbitrary-skew-defect-extension-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-arbitrary-skew-defect-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin exact accepted F10AZ ancestry and F10BA source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10ba"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10ba/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean")" = '6c11e898dd7b5ed93db833ca0c7b678e6fda6ffe'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AKOriginalGammaOrderedChainLieBracketProbe.lean")" = '96836497816cdcd8caedc6970b1b667866847920'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ALOriginalGammaOrderedForkLieBracketProbe.lean")" = 'f9399a0ebf17b4aabbf889d12fbcb79111d89c45'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AMOriginalGammaOrderedSharedRightLieBracketProbe.lean")" = '00a521b011fe78eb9bf2983dc05e9e109ba0b403'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe.lean")" = 'a9c96b4840e297b0b79f343d32e3992f50a5ace0'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets.lean")" = '0764c5d8a0aab5bc5e960c5122e6bbeadccb1031'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge.lean")" = '430611eec059c8119573c50fbcee12901b8457d5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AQOriginalGammaAnyOrientationForkRightLieBrackets.lean")" = '58e39145e25f1117535bb7da4f5b128b7a7c2f7f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AROriginalGammaNativeBracketOrientationAndZeroBridge.lean")" = '712f459104e2724793cd58ff62789b9effdf9f13'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ASOriginalGammaTotalTripleNativeLieBrackets.lean")" = 'b2e9158ec9a3661f4bf818953372249c851eccdb'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ATOriginalGammaAnyOrientationFourthOverlapLieBracket.lean")" = 'a19788b12942af020209dba21c5512f8518e5dc8'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AUOriginalGammaExhaustiveNativePairLieBracket.lean")" = '73746ee6b1f2ad9ec1be11efbba20ca9833a11c6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SkewCoordinatePlaneSpanningProbe.lean")" = '626124eaa4635f64223b48bd6b986a367dc9b40e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9AntisymmetricPartExpansionProbe.lean")" = '133ae2ada5935a5c1d66bbfd46f225c41173dfce'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9InputSkewMatrixUnitBridgeProbe.lean")" = 'da4020a35b3784a90ce76c03798061993fc6275b'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LinearMapImageSkewProbe.lean")" = 'd8a75242a843db8b2cb26e62da0f10df9f814ea9'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LinearMapGeneratorAgreementProbe.lean")" = '549c1d332a2b9de322fad13abc2ec23ec42c966b'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LinearMapMatrixUnitEvaluationProbe.lean")" = '480a43155cb709cb549a19513ad99183a203afe4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9TypedLinearMapProbe.lean")" = '3d83bef542ac264faf11506d2484fd656017b8cf'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FiniteCoefficientScalarProbe.lean")" = 'c37cf40190b965c21da282aba49a37b07907530d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FiniteCoefficientLiftProbe.lean")" = 'b2c44f16a5acfb63d78ff8cc5c59c596fd41be0e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateUniversalBracketProbe.lean")" = '6d77516897cfbc229652fa779647da95150756c3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneProductExpansionProbe.lean")" = 'da60e25fe1e6f0c5bd29ea6db7754f27394974f5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitProductProbe.lean")" = 'a84879ae64bf8341b403fccb61f33cbd5628cac8'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitBridgeProbe.lean")" = 'd80001bbe5052357dbca559232d81cc01c56fb34'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneCarrierProbe.lean")" = '92a26e8380abe9c1f9bdf011d27b8e97b4e17ef3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NormalizedFourIndexStructureProbe.lean")" = '46e02a38f6647458132039bc1f44b0358c9c4f44'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AVOriginalGammaCoordinateLinearMapSkewImage.lean")" = 'bc895ed60f03a3e2091ff11ebd0b87e456f4408c'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AWOriginalGammaCoordinatePlaneBracketCompatibility.lean)" = '449905b6dd06fc9e747a0c9c22c8b6c66afab1a5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AXOriginalGammaBracketDefectBilinearity.lean")" = '53a7c6bad1a515b87869858f776ee76003980f12'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AYOriginalGammaBracketDefectLinearSlices.lean")" = '2ea4de72e1b6c2e46b6394849373fcc90fc51f34'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AZOriginalGammaBracketDefectPlaneSkewExtension.lean")" = 'd2276d3b4e1de86294a71a042828c32f0ff54d51'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BAOriginalGammaBracketDefectArbitrarySkewExtension.lean")" = '2a05796d38b74b401b0054e5944d84583ab0dae5'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BAOriginalGammaBracketDefectArbitrarySkewExtension.lean')
          s=p.read_text()
          name="coordinateToOriginalGammaBracketDefect_skew_pair_zero"
          assert len(re.findall(r'(?m)^theorem '+re.escape(name)+r'\b',s))==1
          assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1
          assert s.count('#print axioms ')==1
          code=re.sub(r'/-.*?-/', '', s, flags=re.S)
          for term in ['coordinateToOriginalGammaBracketDefect_leftLinear',
                       'coordinateToOriginalGammaBracketDefect_plane_skew_right',
                       'coordinateSkewMatrix9_plane_spanning',
                       'map_smul', 'map_sum', 'Finset.sum_const_zero']:
              assert term in code,term
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
          print('V10H_F10BA_SOURCE_PIN_ARBITRARY_SKEW_PAIR_EXTENSION_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10AZ plane-skew-zero ancestry
        shell: bash
        timeout-minutes: 80
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 4650s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AZOriginalGammaBracketDefectPlaneSkewExtension

      - name: Fresh F10BA arbitrary-skew-pair extension warnings-as-errors compile
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BAOriginalGammaBracketDefectArbitrarySkewExtension
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 960s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10ba/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate exact arbitrary-skew-pair theorem type and audit root axioms
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10BA_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BAOriginalGammaBracketDefectArbitrarySkewExtension
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSPairedSpin9Plane
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example
              (A B : Matrix SpaceIndex SpaceIndex ℝ)
              (hA : A.transpose = -A)
              (hB : B.transpose = -B) :
              coordinateToOriginalGammaBracketDefect A B = 0 :=
            coordinateToOriginalGammaBracketDefect_skew_pair_zero A B hA hB
          #print axioms FCP.BFSSPairedSpin9Clifford.coordinateToOriginalGammaBracketDefect_skew_pair_zero
          LEAN
          timeout 840s lake env lean -DwarningAsError=true /tmp/V10H_F10BA_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10ba/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10ba'/'declaration-audit.log').read_text()
          name='FCP.BFSSPairedSpin9Clifford.coordinateToOriginalGammaBracketDefect_skew_pair_zero'
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          assert len(reports)+len(empty)==1,(reports,empty)
          assert ({n for n,_ in reports}|set(empty))=={name},(reports,empty)
          for n,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BA_ORIGINAL_GAMMA_ARBITRARY_SKEW_PAIR_TYPE_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BA audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10ba-original-gamma-arbitrary-skew-pair-defect-extension-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10ba
          if-no-files-found: warn
