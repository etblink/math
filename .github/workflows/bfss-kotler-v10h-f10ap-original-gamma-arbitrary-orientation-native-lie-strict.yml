name: BFSS V10H F10AP original gamma arbitrary orientation native Lie strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge.lean
      - .github/workflows/bfss-kotler-v10h-f10ap-original-gamma-arbitrary-orientation-native-lie-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-arbitrary-orientation-lie-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original gamma F10E F10AJ F10AK F10AL F10AM F10AN F10AO F10AP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10ap"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10ap/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean")" = '6c11e898dd7b5ed93db833ca0c7b678e6fda6ffe'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AKOriginalGammaOrderedChainLieBracketProbe.lean")" = '96836497816cdcd8caedc6970b1b667866847920'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ALOriginalGammaOrderedForkLieBracketProbe.lean")" = 'f9399a0ebf17b4aabbf889d12fbcb79111d89c45'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AMOriginalGammaOrderedSharedRightLieBracketProbe.lean")" = '00a521b011fe78eb9bf2983dc05e9e109ba0b403'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ANOriginalGammaDisjointPairLieBracketProbe.lean")" = 'a9c96b4840e297b0b79f343d32e3992f50a5ace0'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets.lean")" = '0764c5d8a0aab5bc5e960c5122e6bbeadccb1031'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge.lean")" = '430611eec059c8119573c50fbcee12901b8457d5'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge.lean').read_text()
          names=["source9OriginalGamma_distinct_pair_transpose_neg","source9OriginalGamma_distinct_pair_mem_so","source9OriginalGamma_distinct_pair_reverse_sign","source9OriginalGamma_distinct_pair_agrees_ordered","source9OriginalGamma_distinct_chain_matrix_commutator","source9OriginalGamma_distinct_chain_native_so_bracket"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
              assert s.count('#print axioms '+n)==1,n
          assert s.count('#print axioms ')==6
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for term in ['source9OriginalGamma_anticommute',
                       'source9OriginalGamma_basis_mul_self',
                       'gamma_symmetric',
                       'LieAlgebra.Orthogonal.mem_so',
                       'source9OriginalGammaDistinctPairInSo',
                       'source9OrderedGammaPairInSo',
                       'Subtype.ext']:
              assert term in code,term
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10AP_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10AO original gamma native reversed and self ancestry
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3750s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AOOriginalGammaPairReverseAndSelfLieBrackets

      - name: Fresh F10AP original gamma arbitrary orientation warnings-as-errors compiler
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10ap/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate six original orientation/native chain theorem types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10AP_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10APOriginalGammaArbitraryOrientationNativeLieBridge
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSGamma9
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (a b : SpaceIndex) (hab : a ≠ b) :
              (gamma a * gamma b).transpose = -(gamma a * gamma b) :=
            source9OriginalGamma_distinct_pair_transpose_neg a b hab
          noncomputable example (a b : SpaceIndex) (hab : a ≠ b) :
              gamma a * gamma b ∈ LieAlgebra.Orthogonal.so SpinIndex ℝ :=
            source9OriginalGamma_distinct_pair_mem_so a b hab
          noncomputable example (a b : SpaceIndex) (hab : a ≠ b) :
              source9OriginalGammaDistinctPairInSo b a hab.symm =
                -(source9OriginalGammaDistinctPairInSo a b hab) :=
            source9OriginalGamma_distinct_pair_reverse_sign a b hab
          noncomputable example (a b : SpaceIndex) (hab : a < b) :
              source9OriginalGammaDistinctPairInSo a b (ne_of_lt hab) =
                source9OrderedGammaPairInSo ⟨(a,b),hab⟩ :=
            source9OriginalGamma_distinct_pair_agrees_ordered a b hab
          noncomputable example (a b c : SpaceIndex)
              (hab : a ≠ b) (hac : a ≠ c) (hbc : b ≠ c) :
              (gamma a * gamma b) * (gamma b * gamma c) -
                (gamma b * gamma c) * (gamma a * gamma b) =
                  (2 : ℝ) • (gamma a * gamma c) :=
            source9OriginalGamma_distinct_chain_matrix_commutator a b c hab hac hbc
          noncomputable example (a b c : SpaceIndex)
              (hab : a ≠ b) (hac : a ≠ c) (hbc : b ≠ c) :
              ⁅source9OriginalGammaDistinctPairInSo a b hab,
                source9OriginalGammaDistinctPairInSo b c hbc⁆ =
                (2 : ℝ) • source9OriginalGammaDistinctPairInSo a c hac :=
            source9OriginalGamma_distinct_chain_native_so_bracket a b c hab hac hbc
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_distinct_pair_transpose_neg
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_distinct_pair_mem_so
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_distinct_pair_reverse_sign
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_distinct_pair_agrees_ordered
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_distinct_chain_matrix_commutator
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_distinct_chain_native_so_bracket
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10AP_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10ap/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10ap'/'declaration-audit.log').read_text()
          names=["source9OriginalGamma_distinct_pair_transpose_neg","source9OriginalGamma_distinct_pair_mem_so","source9OriginalGamma_distinct_pair_reverse_sign","source9OriginalGamma_distinct_pair_agrees_ordered","source9OriginalGamma_distinct_chain_matrix_commutator","source9OriginalGamma_distinct_chain_native_so_bracket"]
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==6 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10AP_SIX_ORIENTATION_AND_NATIVE_LIE_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and six independent orientation/native chain audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10ap-gamma-arbitrary-orientation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10ap
          if-no-files-found: warn
