name: SM-D1-SCC1 R1 native strict linter RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-d1-scc1-r1-native-red-evidence-preservation.yml
permissions:
  actions: read
  contents: write
jobs:
  archive-original-scc1-r1-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout unified research without changing accepted originals
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Preflight exact failed source history and current protected gate state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse fe34844d7c67e2d9520cc77d458516573137ddc0:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean)" = 41b5742fce2b13709677ecb19066b480436f43cf
          test "$(git rev-parse fe34844d7c67e2d9520cc77d458516573137ddc0:.github/workflows/sm-d1-scc1-finite-witness-lean-strict.yml)" = 789c99e34ed4ff094ed0ba278bf93969a820dc22
          test "$(git rev-parse HEAD:research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json)" = 1d391ba994ee23f03c4423b45fbb15e7e42c86f1
          python3 - <<'PY'
          import json
          from pathlib import Path
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert len(bf['accepted_anchors'])==27 and bf['active']['status']=='BLOCKED'
          assert not list(Path('research/standard-model/evidence').glob('SMD1_SCC1_R1_44400900631_*'))
          print('SM_D1_SCC1_R1_ORIGINAL_RED_SOURCE_FROZEN_SM_BFSS_PREFLIGHT_PASS')
          PY
      - name: Authenticate and archive exact original R1 failed job ZIP and SHA CRC evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/etblink/math'
          run=44400900631
          job=135143314675
          artifact=14472886007
          tested='fe34844d7c67e2d9520cc77d458516573137ddc0'
          expected_sha='fc2e5597bbbc9bc3f8e9eab8708e9eefe5a3f7e5d9a5bcadefbd5d59d34d7319'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def meta(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as r:return json.load(r)
          rr=meta(f'/actions/runs/{run}')
          jj=meta(f'/actions/jobs/{job}')
          aa=meta(f'/actions/artifacts/{artifact}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(
              tested,'completed','failure',1)
          assert (jj['id'],jj['run_id'],jj['conclusion'])==(job,run,'failure')
          for name in ('Checkout exact research','Verify pinned source consumer',
                       'Restore pinned Lean'):
              assert any(s['name'].startswith(name) and s['conclusion']=='success'
                         for s in jj['steps']),name
          assert any(s['name'].startswith('Cold original source') and
                     s['conclusion']=='failure' for s in jj['steps'])
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(
              artifact,1954,'sha256:'+expected_sha)
          assert (aa['workflow_run']['id'],aa['workflow_run']['head_sha'])==(run,tested)
          assert aa['name']=='sm-d1-scc1-original-native-lean-source-consumer'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def getraw(path):
              try:
                  res=urllib.request.build_opener(NoRedirect).open(
                      urllib.request.Request(base+path,headers=headers),timeout=60)
              except urllib.error.HTTPError as exc:
                  assert exc.code==302,exc
                  url=exc.headers['Location']
                  assert url.startswith('https://')
                  with urllib.request.urlopen(url,timeout=90) as r:return r.read()
              else:
                  with res:return res.read()
          data=getraw(f'/actions/artifacts/{artifact}/zip')
          assert len(data)==1954 and hashlib.sha256(data).hexdigest()==expected_sha
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert {'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log'}<=names,names
              assert 'consumer.log' not in names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'SM_D1_SCC1_14_SOURCE_7_CONSUMER_2_EXAMPLES_SM_Y0_SM_D0_SCC0_27_BFSS_ANCHORS_PINNED_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              assert 'Build completed successfully (3092 jobs)' in z.read('cold-source.log').decode()
              diag=z.read('source-axioms.log').decode()
              assert 'error: Try ' in diag and 'simp at hx' in diag and 'simpa using hx' in diag
              assert 'sorryAx' not in diag
              members=[{'name':n,'size':len(z.read(n)),
                        'sha256':hashlib.sha256(z.read(n)).hexdigest(),
                        'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=getraw(f'/actions/jobs/{job}/logs')
          assert len(full)>20000
          assert b'error: Try ' in full and b'simp at hx' in full
          root=Path('research/standard-model/evidence');root.mkdir(parents=True,exist_ok=True)
          zp=root/'SMD1_SCC1_R1_44400900631_ORIGINAL_LINTER_RED_evidence.zip'
          lp=root/'SMD1_SCC1_R1_44400900631_ORIGINAL_complete_job.log'
          mp=root/'SMD1_SCC1_R1_44400900631_ORIGINAL_LINTER_RED_evidence_manifest.json'
          for p in (zp,lp,mp):assert not p.exists(),p
          zp.write_bytes(data);lp.write_bytes(full)
          mp.write_text(json.dumps({
              'gate':'SM-D1-SCC1','attempt':'R1','status':'ORIGINAL_NATIVE_LINTER_RED_UNQUALIFIED',
              'run':run,'job':job,'tested_commit':tested,'artifact':artifact,
              'zip':{'path':str(zp),'size':len(data),'sha256':expected_sha,'members':members},
              'log':{'path':str(lp),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'41b5742fce2b13709677ecb19066b480436f43cf',
              'workflow_blob':'789c99e34ed4ff094ed0ba278bf93969a820dc22',
              'source_cold_build':'PASS_3092_JOBS',
              'native_source_strict':'RED_linter.unnecessarySimpa_line_109',
              'consumer_native':'NOT_REACHED',
              'BFSS_accepted_original_anchors_unchanged':27,
              'qualification':False,
              'scope':'Diagnostic failure; preserves both negative information and earlier accepted proofs. This is not a counterexample to the mathematical statement.'
          },sort_keys=True,indent=2)+'\n')
          print('SM_D1_SCC1_R1_NATIVE_LINTER_RED_ORIGINAL_ZIP_FULL_JOB_SHA_CRC_INDEPENDENTLY_VERIFIED')
          PY
      - name: Commit original R1 RED ZIP complete job and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/standard-model/evidence/SMD1_SCC1_R1_44400900631_ORIGINAL_*
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'SM-D1-SCC1 R1 preserve original native strict linter RED evidence'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
