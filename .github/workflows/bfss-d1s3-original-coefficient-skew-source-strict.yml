name: BFSS D1S3 original fermion coefficient skew source strict

'on':
  push:
    branches:
      - research/bfss-hopfion-gut-counterfactuals-20261121
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1S3OriginalFermionCoefficientSkewProbe.lean
      - .github/workflows/bfss-d1s3-original-coefficient-skew-source-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-d1s3-original-coefficient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-coefficient-skew-source:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Freeze original source and audit theorem roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-d1s3"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-d1s3/tested-sha.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-d1s3/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-d1s3/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          root="lean/OAI/MathematicalPhysics/BFSS/"
          dep=root+"Contrib/Kotler/OperatorDependencies/"
          p=root+"Contrib/Kotler/D1S3OriginalFermionCoefficientSkewProbe.lean"
          pins={
            root+"Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            root+"FermionFrequency.lean":"cbb82a42f42b3b3d3695081247bd14d0496abc7d",
            root+"FermionQuantization.lean":"c6b72d030225c707ef54f5285a18a7a8175ee280",
            root+"FrequencyContraction.lean":"425edf6d7d0f9d15ce5f8bc92e8788ef60068618",
            dep+"SU2BFSSG1APairedThetaProbe.lean":"152204ef15a6569534e0503824a697cb9ae8e4ce",
          }
          for q,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",q],text=True).strip()
              assert actual==expected,("FROZEN_SOURCE_DRIFT",q,actual,expected)
          a=Path(p).read_text()
          assert re.findall(r"(?m)^import (\S+)$",a)==[
            "OAI.MathematicalPhysics.BFSS.FermionQuantization",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG1APairedThetaProbe"]
          roots=["sourceStructureFirstTwoSkew","sourceGammaEntrySymm",
                 "sourceMassTEntrySkew","originalFermionCoefficient_skew",
                 "pairedOriginalFermionCoefficient_skew"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",a)==roots
          assert "set_option autoImplicit false" in a
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",a)
          assert "set_option maxRecDepth" not in a and "set_option maxHeartbeats" not in a
          assert "set_option linter." not in a
          assert all(q in a for q in [
            "sourceStructureFirstTwoSkew","sourceGammaEntrySymm",
            "sourceMassTEntrySkew","originalFermionCoefficient_skew",
            "pairedOriginalFermionCoefficient_skew","structureConstant_cycle",
            "structureConstant_swap","massT_transpose","gamma_symmetric"])
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_D1S3_ORIGINAL_SOURCE_PIN_PREFLIGHT_PASS")
          PY

      - name: Restore exact Lean and pinned Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-d1s3/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Native source build and exact source-only strict axiom gate
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-d1s3"
          timeout 2500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.D1S3OriginalFermionCoefficientSkewProbe 2>&1 | tee "$E/cold-build.log"
          timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/D1S3OriginalFermionCoefficientSkewProbe.lean \
            2>&1 | tee "$E/source-axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-d1s3"
          names=["sourceStructureFirstTwoSkew","sourceGammaEntrySymm",
                 "sourceMassTEntrySkew","originalFermionCoefficient_skew",
                 "pairedOriginalFermionCoefficient_skew"]
          for filename in ("cold-build.log","source-axioms.log"):
              log=(d/filename).read_text()
              for token in ["error:","sorryAx","unknownIdentifier","unsolved goals"]:
                  assert token not in log,(filename,token,log[-6000:])
          content=(d/"source-axioms.log").read_text()
          reported=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",content)
          expected=["FCP.BFSSHopfD1S3."+name for name in names]
          assert [name for name,_ in reported]==expected,(reported,expected)
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,axioms in reported:
              actual={part.strip() for part in axioms.split(",") if part.strip()}
              assert actual<=allowed,(name,actual)
          print("BFSS_D1S3_SOURCE_ONLY_STRICT_GREEN")
          PY

      - name: Preserve original compiler and axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-d1s3-original-coefficient-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-d1s3/
          if-no-files-found: warn
          retention-days: 30
