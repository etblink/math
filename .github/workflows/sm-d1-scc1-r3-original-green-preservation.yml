name: SM-D1-SCC1 R3 original native strict GREEN independent preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-d1-scc1-r3-original-green-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-scc1-r3-native-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout unchanged qualified SM and BFSS sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Assert tested source independent consumer and original 27 BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse b091db762022f8b0a0a5648064855c52529fd784:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean)" = b78f942e12874c1bb690ef2d6d6ef2a800031245
          test "$(git rev-parse b091db762022f8b0a0a5648064855c52529fd784:lean/diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean)" = d30bf2d71198fc0faefe221d5851536c1ee6ee8c
          test "$(git rev-parse b091db762022f8b0a0a5648064855c52529fd784:.github/workflows/sm-d1-scc1-finite-witness-lean-strict.yml)" = a7457bba07e3977a4ff99d491a5ae2e103f9089f
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean)" = b78f942e12874c1bb690ef2d6d6ef2a800031245
          test "$(git rev-parse HEAD:lean/diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean)" = d30bf2d71198fc0faefe221d5851536c1ee6ee8c
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean)" = 481a984b5ba7d2d7df41297d162ab1d608646d6e
          test "$(git rev-parse HEAD:research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json)" = 1d391ba994ee23f03c4423b45fbb15e7e42c86f1
          test "$(git rev-parse HEAD:research/standard-model/tools/smd1_scc0.py)" = 95569dffd88af133df3dd56d23e1f61ca8c4a207
          python3 - <<'PY'
          import json
          from pathlib import Path
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert any(v['id']=='SM-D1' and v['status']=='PROSPECTIVE_UNSTAGED' for v in sm['upcoming'])
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert not list(Path('research/standard-model/evidence').glob('SMD1_SCC1_R3_44403273333_*'))
          print('SMD1_SCC1_R3_VERIFIED_ORIGINAL_SOURCE_AND_CONSUMER_27_BFSS_ANCHORS_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Independently authenticate original R3 job source consumer and provider artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/etblink/math'
          run=44403273333;job=135151666651;artifact=14474152713
          tested='b091db762022f8b0a0a5648064855c52529fd784'
          size=2636;checksum='8d4455001fd5f5a49cde2758b736a4e43737616298f3278a2615381a9f50bf65'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def meta(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as r:return json.load(r)
          rr=meta(f'/actions/runs/{run}')
          jj=meta(f'/actions/jobs/{job}')
          aa=meta(f'/actions/artifacts/{artifact}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(tested,'completed','success',1)
          assert (jj['id'],jj['run_id'],jj['conclusion'])==(job,run,'success')
          for key in ('Checkout exact research','Verify pinned source consumer','Restore pinned Lean','Cold original source','Preserve exact tested'):
              assert any(s['name'].startswith(key) and s['conclusion']=='success' for s in jj['steps']),key
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(artifact,size,'sha256:'+checksum)
          assert (aa['workflow_run']['id'],aa['workflow_run']['head_sha'])==(run,tested)
          assert aa['name']=='sm-d1-scc1-original-native-lean-source-consumer'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(path):
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base+path,headers=headers),timeout=60)
              except urllib.error.HTTPError as exc:
                  assert exc.code==302,exc
                  signed=exc.headers['Location']
                  assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as r:return r.read()
              else:
                  with response:return response.read()
          data=download(f'/actions/artifacts/{artifact}/zip')
          assert len(data)==size and hashlib.sha256(data).hexdigest()==checksum
          source=['agrees_refl','agrees_symm','agrees_trans','separation_not_agreement',
            'disagreement_has_witness','separation_mono','agreement_antitone',
            'finite_separation_mono','singleton_deletion_minimal',
            'distinct_singleton_minimals','uniform_separation_mono',
            'overlap_blocks_uniform','missing_blocks_agreement',
            'defined_separation_not_agreement']
          consumer=['separation_iff_not_agreement_consumer','monotone_separation_consumer',
            'overlap_counterexample_consumer','missing_is_not_agreement_consumer',
            'color_coefficient_distinguishes_consumer',
            'weak_coefficient_distinguishes_consumer','two_distinct_minimal_witnesses_consumer']
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={'propext','Classical.choice','Quot.sound'}
          def audit(raw,names):
              assert 'sorryAx' not in raw and 'error:' not in raw and 'warning:' not in raw
              matched=pattern.findall(raw)
              assert len(matched)==len(names),(matched,names)
              assert [name.rsplit('.',1)[-1] for name,_ in matched]==names
              for _,axs in matched:
                  assert {a.strip() for a in axs.split(',') if a.strip()}<=allowed,axs
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              required={'tested-commit.txt','preflight.log','cold-source.log','source-axioms.log','consumer.log','auditor.log'}
              assert required<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'SM_D1_SCC1_14_SOURCE_7_CONSUMER_2_EXAMPLES_SM_Y0_SM_D0_SCC0_27_BFSS_ANCHORS_PINNED_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (3093 jobs)' in cold and 'error:' not in cold and 'sorryAx' not in cold
              audit(z.read('source-axioms.log').decode(),source)
              audit(z.read('consumer.log').decode(),consumer)
              assert 'SM_D1_SCC1_14_NATIVE_SOURCE_7_INDEPENDENT_CONSUMER_2_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN' in z.read('auditor.log').decode()
              members=[{'name':n,'size':len(z.read(n)),'sha256':hashlib.sha256(z.read(n)).hexdigest(),'crc32':format(z.getinfo(n).CRC,'08x')} for n in sorted(names)]
          full=download(f'/actions/jobs/{job}/logs')
          assert len(full)>30000,len(full)
          assert b'SM_D1_SCC1_14_NATIVE_SOURCE_7_INDEPENDENT_CONSUMER_2_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN' in full
          assert b'SM_D1_SCC1_14_SOURCE_7_CONSUMER_2_EXAMPLES_SM_Y0_SM_D0_SCC0_27_BFSS_ANCHORS_PINNED_PREFLIGHT_PASS' in full
          root=Path('research/standard-model/evidence')
          root.mkdir(parents=True,exist_ok=True)
          zp=root/'SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence.zip'
          lp=root/'SMD1_SCC1_R3_44403273333_ORIGINAL_complete_job.log'
          mp=root/'SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence_manifest.json'
          for f in (zp,lp,mp):assert not f.exists()
          zp.write_bytes(data);lp.write_bytes(full)
          mp.write_text(json.dumps({
              'gate':'SM-D1-SCC1','attempt':'R3','status':'NATIVE_SOURCE_AND_INDEPENDENT_CONSUMER_STRICT_GREEN_MATH_ONLY',
              'original_run':run,'original_job':job,'original_artifact':artifact,'tested_commit':tested,
              'original_zip':{'path':str(zp),'size':size,'sha256':checksum,'members':members},
              'complete_job_log':{'path':str(lp),'size':len(full),'sha256':hashlib.sha256(full).hexdigest()},
              'source_blob':'b78f942e12874c1bb690ef2d6d6ef2a800031245',
              'independent_consumer_blob':'d30bf2d71198fc0faefe221d5851536c1ee6ee8c',
              'original_workflow_blob':'a7457bba07e3977a4ff99d491a5ae2e103f9089f',
              'source_axiom_count':14,'independent_consumer_axiom_count':7,
              'independent_examples':2,'auditor_negative_controls':6,
              'allowed_axioms':sorted(allowed),'cold_build_jobs':3093,
              'prior_failures':['R1 native warning-as-error','R2 missing original SM-Y0 olean consumer dependency'],
              'BFSS_accepted_anchors_unchanged':27,'BFSS_active':'P3-M4-W0C2B2_BLOCKED',
              'scientific_ceiling':'Finite deterministic Boolean observational equivalence/separation and SM-Y0 mathematical coefficient witness tests only. No statistical likelihood, continuous family theorem, physical SM prediction, BFSS physics confirmation, or SCC theorem transfer.'
          },sort_keys=True,indent=2)+'\n')
          print('SM_D1_SCC1_R3_ORIGINAL_NATIVE_STRICT_GREEN_ZIP_COMPLETE_JOB_SHA_CRC_14_SOURCE_7_CONSUMER_INDEPENDENTLY_VERIFIED')
          PY
      - name: Commit original R3 native GREEN ZIP full log and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/standard-model/evidence/SMD1_SCC1_R3_44403273333_ORIGINAL_*
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'SM-D1-SCC1 R3 archive original native strict GREEN source consumer and axiom checks'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
