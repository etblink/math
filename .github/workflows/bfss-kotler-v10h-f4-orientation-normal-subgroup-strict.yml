name: BFSS V10H F4 source Spin9 orientation normal subgroup strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe.lean
      - .github/workflows/bfss-kotler-v10h-f4-orientation-normal-subgroup-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-orientation-normal-subgroup:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin accepted F3 and F2 ancestors and F4 five declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f4"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f4/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF2SourceOrientationBoundaryProbe.lean")" = '612d68edfdddedadfa80b780c1e4768bd7bc0ecd'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe.lean")" = '76fa0635c0a4a7c1564d114bfc9442024d31177e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe.lean")" = '9018e4ee9ebd2ad8eae55ed850fb561257327bef'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe.lean').read_text()
          names=["gammaDet_one","source9OrientationSubgroup","mem_source9OrientationSubgroup_iff_pairedSO","source9OrientationSubgroup_sq_mem","source9OrientationSubgroup_normal"]
          for n in names:
              pattern=r'(?m)^(?:theorem|noncomputable def|instance) '+re.escape(n)+r'\b'
              assert len(re.findall(pattern,s)) == 1,(n,re.findall(pattern,s))
          assert s.count('#print axioms ') == 5
          assert 'Subgroup.Normal source9OrientationSubgroup' in s
          assert 'gammaDet_mul' in s and 'gammaDet_square_one' in s
          assert 'pairedSO_iff_gammaDetOne' in s
          assert 'source9SpinGammaDetHom_apply' not in s
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('V10H_F4_SOURCE_NORMAL_ORIENTATION_SUBGROUP_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F3 source Spin9 group-square SO48 ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF3SourceSquareOrientationProbe

      - name: Fresh F4 genuine Spin9 orientation normal-subgroup strict compile
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f4/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f4/compiler.log")" -eq 5

      - name: Independently elaborate exact five F4 declarations and axiom whitelist
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F4_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF4OrientationNormalSubgroupProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example :
              (((source9SpinGammaOrthogonalHom
                (1 : spinGroup source9Quadratic)) : GammaMatrix).det) = 1 :=
            gammaDet_one
          noncomputable example :
              Subgroup (spinGroup source9Quadratic) :=
            source9OrientationSubgroup
          noncomputable example (g : spinGroup source9Quadratic) :
              g ∈ source9OrientationSubgroup ↔
                ((source9SpinOriginalPaired48OrthogonalHom g) :
                  Matrix Source48Label Source48Label ℝ) ∈
                  Matrix.specialOrthogonalGroup Source48Label ℝ :=
            mem_source9OrientationSubgroup_iff_pairedSO g
          noncomputable example (g : spinGroup source9Quadratic) :
              g * g ∈ source9OrientationSubgroup :=
            source9OrientationSubgroup_sq_mem g
          noncomputable example :
              Subgroup.Normal source9OrientationSubgroup :=
            source9OrientationSubgroup_normal
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDet_one
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OrientationSubgroup
          #print axioms FCP.BFSSPairedSpin9DetFixture.mem_source9OrientationSubgroup_iff_pairedSO
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OrientationSubgroup_sq_mem
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OrientationSubgroup_normal
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F4_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f4/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f4'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["gammaDet_one","source9OrientationSubgroup","mem_source9OrientationSubgroup_iff_pairedSO","source9OrientationSubgroup_sq_mem","source9OrientationSubgroup_normal"]}
          assert len(reports)==5 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F4_NORMAL_ORIENTATION_SUBGROUP_5_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f4-source-orientation-normal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f4
          if-no-files-found: warn
