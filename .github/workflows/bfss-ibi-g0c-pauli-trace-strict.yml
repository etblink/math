name: BFSS IBI-G0C original Pauli trace source bridge strict

'on':
  push:
    branches: [research/bfss-incidence-unified-20261114]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CPauliTrace.lean
      - lean/diagnostics/BFSSIBIG0CPauliTraceIndependentConsumer.lean
      - .github/workflows/bfss-ibi-g0c-pauli-trace-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-g0c-pauli-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact incidence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source pins and narrow theorem contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-g0c-pauli-trace"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-g0c-pauli-trace/tested-commit.txt"
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          pins = {
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CPauliTrace.lean": "86fad18d5e85dfd509dc68802c7f39f30c367154",
            "lean/diagnostics/BFSSIBIG0CPauliTraceIndependentConsumer.lean": "afed0e446ce16c5e94a170018a7e37b8c2e5b510",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG3AAdjointColorRepresentationProbe.lean": "553869f1287c64893398c3b79c04fe010023bd08",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean": "152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSFullAlgebraDataProbe.lean": "de8242615e4b2959e2dfa57cf0c6fdf43896acb7",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2ColorCrossProbe.lean": "209b3808222730ca5e817d83ed32253a67513f7f",
            "lean/OAI/MathematicalPhysics/BFSS/GaugeCore.lean": "e4990dadf1d8bde849e351467282ab3f14989c3b",
            "lean/lean-toolchain": "ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json": "67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for path, expected in pins.items():
              got = subprocess.check_output(
                  ["git", "hash-object", "--no-filters", path], text=True).strip()
              assert got == expected, (path, expected, got)
          assert Path("lean/lean-toolchain").read_text().strip() == "leanprover/lean4:v4.34.1"
          packages = json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in packages if p["name"] == "mathlib") == "d13f23b723b8a846827a245b89c10fc7d3f11612"
          source = Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CPauliTrace.lean").read_text()
          consumer = Path("lean/diagnostics/BFSSIBIG0CPauliTraceIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$", source) == [
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG3AAdjointColorRepresentationProbe"]
          assert re.findall(r"(?m)^import (\S+)$", consumer) == [
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CPauliTrace"]
          assert re.findall(r"(?m)^#print axioms (\S+)$", source) == [
              "originalAdjointColorMatrix_normalizedPauliTrace",
              "originalAdjointColorMatrix_pauliTrace"]
          assert len(re.findall(r"(?m)^example\b", consumer)) == 3
          for body in (source, consumer):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b", body)
              assert "set_option maxHeartbeats 0" not in body
          for needle in ("pairedAlgebraData_color", "concreteAlgebraData_color",
              "pauliScale_sq", "originalAdjointColorMatrix_pauliTrace"):
              assert needle in source, needle
          print("BFSS_IBI_G0C_PAULI_TRACE_SOURCE_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original source and independent consumer and axiom audit
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CPauliTrace.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CPauliTrace.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1650s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CPauliTrace 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-pauli-trace/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-pauli-trace/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true             diagnostics/BFSSIBIG0CPauliTraceIndependentConsumer.lean 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-pauli-trace/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ["RUNNER_TEMP"]) / "bfss-ibi-g0c-pauli-trace"
          for name in ("cold-build.log", "source-axioms.log", "independent-consumer.log"):
              log = (root / name).read_text()
              assert "error:" not in log and "sorryAx" not in log, (name, log[-4000:])
              allowed_warning = re.compile(
                  r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              unexpected = [s for s in log.splitlines()
                            if "warning:" in s and not allowed_warning.fullmatch(s)]
              assert not unexpected, (name, unexpected[:10])
          log = (root / "source-axioms.log").read_text()
          reports = re.findall(
              r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",
              log)
          expected = [
              "FCP.BFSSIBIG0CPauliTrace.originalAdjointColorMatrix_normalizedPauliTrace",
              "FCP.BFSSIBIG0CPauliTrace.originalAdjointColorMatrix_pauliTrace"]
          assert [name for name, _ in reports] == expected, reports
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name, raw in reports:
              assert {a.strip() for a in raw.split(",") if a.strip()} <= allowed, (name, raw)
          print("BFSS_IBI_G0C_PAULI_TRACE_SOURCE_AND_INDEPENDENT_CONSUMER_STRICT_GREEN")
          PY
      - name: Preserve exact G0C Pauli trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-g0c-pauli-trace-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-g0c-pauli-trace/
          if-no-files-found: warn
          retention-days: 14
