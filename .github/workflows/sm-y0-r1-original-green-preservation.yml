name: SM-Y0 R1 independent original Standard Model source-consumer GREEN evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-y0-r1-original-green-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-sm-y0-native-source-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen SM-Y0 source and original canonical BFSS anchors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify SM-Y0 exact Lean and workflow bytes original project charter and 27 BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean)" = 481a984b5ba7d2d7df41297d162ab1d608646d6e
          test "$(git rev-parse HEAD:lean/diagnostics/SMY0OneFamilyAnomalyIndependentConsumer.lean)" = 082492122e15f5f73a24b086ea1e3c4ae71527df
          test "$(git rev-parse HEAD:.github/workflows/sm-y0-one-family-hypercharge-anomalies-strict.yml)" = 62ec08931b474f586ec2d8bb5054b9b747796c7a
          test "$(git rev-parse HEAD:research/standard-model/SMY0_ONE_FAMILY_HYPERCHARGE_ANOMALY_PRE_GATE_2026_11_18.md)" = 3fecff333d5c7495beca4ab22cfb1dfbd10b36a7
          test "$(git rev-parse HEAD:research/methodology/TRUTH_FIRST_FOUNDATIONAL_RESEARCH_CHARTER_2026_11_18.md)" = 0513dda5fe1feaf4572d0dd1ed09293994ec2391
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean)" = 7d372392703d0fe69942df9df58b421af6850656
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C2B2_E2_R2_44382978294_NATIVE_SYNTAX_RED_evidence.zip)" = 924d03cbeb88a186dc3f733297e5f01e04bbdc51
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert len(s['accepted_anchors'])==27
          assert (s['last_qualified']['gate'],s['last_qualified']['run_id'])==('P3-M4-W0C2B1',44267283653)
          assert (s['active']['gate'],s['active']['status'],s['active']['qualification'])==(
            'P3-M4-W0C2B2','BLOCKED',False)
          assert s['next_planned']['status']=='PROSPECTIVE_NOT_STAGED'
          for name in ('SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence.zip',
                       'SMY0_R1_44388795375_ORIGINAL_complete_job.log',
                       'SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence_manifest.json'):
            assert not (Path('research/standard-model/evidence')/name).exists(),name
          print('SM_Y0_ORIGINAL_GREEN_27_BFSS_ANCHORS_AND_ORIGINAL_SM_SOURCE_FROZEN_PREFLIGHT_PASS')
          PY
      - name: Independently download verify exact original SM-Y0 provider ZIP and complete GitHub job transcript
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          repo='https://api.github.com/repos/etblink/math'
          run=44388795375; job=135100501006; artifact=14466219833
          tested='151b9d4c8c4c23cd9f70b54a566aa08c507c656b'
          size=2318;digest='67e997beebb4646463fd3a690afb91e6dd76ba917f596828613b331c814c5030'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def getjson(path):
              with urllib.request.urlopen(urllib.request.Request(repo+path,headers=headers),timeout=60) as r:return json.load(r)
          rr=getjson(f'/actions/runs/{run}')
          jj=getjson(f'/actions/jobs/{job}')
          aa=getjson(f'/actions/artifacts/{artifact}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(tested,'completed','success',1)
          assert jj['id']==job and jj['run_id']==run and jj['conclusion']=='success'
          for step in ('Checkout unified','Preflight exact SM sources','Restore exact pinned Lean',
                       'Cold independent SM-Y0 source consumer','Preserve original SM-Y0'):
              assert any(s['name'].startswith(step) and s['conclusion']=='success' for s in jj['steps']),step
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(artifact,size,'sha256:'+digest)
          assert aa['workflow_run']['id']==run and aa['workflow_run']['head_sha']==tested
          assert aa['name']=='sm-y0-original-source-consumer-evidence'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(path):
              url=repo+path
              try:r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers['Location'];assert signed.startswith('https://')
                  with urllib.request.urlopen(signed,timeout=90) as rr:return rr.read()
              else:
                  with r:return r.read()
          raw=download(f'/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          source=['canonical_colorMixed_zero','canonical_weakMixed_zero','canonical_cubicAbelian_zero',
                  'canonical_gravityMixed_zero','canonical_hypercharge_coefficients_vanish',
                  'canonical_weak_doublet_count_even','erasedQuark_colorMixed_ne_zero',
                  'erasedQuark_weakMixed_ne_zero','erasedQuark_not_anomaly_free']
          consumer=['canonical_inputs_consumer','colorMixed_consumer','weakMixed_consumer',
                    'cubicAbelian_consumer','gravityMixed_consumer','all_hypercharge_coefficients_consumer',
                    'perturbed_charge_detected_consumer','weak_doublets_even_consumer']
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          allowed={'propext','Classical.choice','Quot.sound'}
          def audit(log,names):
              assert 'error:' not in log and 'sorryAx' not in log
              matches=pat.findall(log)
              assert len(matches)==len(names),(matches,names)
              assert [x.rsplit('.',1)[-1] for x,_ in matches]==names,(matches,names)
              for _,ax in matches:assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed,ax
              return {x:axs for x,axs in matches}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              members=set(z.namelist())
              expected={'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log','auditor.log'}
              assert expected<=members,members
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'SM_Y0_9_SOURCE_8_CONSUMER_TRUTH_FIRST_CHARTER_PDG_CONTEXT_27_BFSS_ANCHORS_FROZEN_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (3092 jobs)' in cold
              assert 'error:' not in cold and 'sorryAx' not in cold
              srcax=audit(z.read('source-axioms.log').decode(),source)
              conax=audit(z.read('consumer.log').decode(),consumer)
              assert 'SM_Y0_ORIGINAL_9_SOURCE_8_INDEPENDENT_CONSUMER_3_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN' in z.read('auditor.log').decode()
              m=[{'name':x,'size':len(z.read(x)),
                  'sha256':hashlib.sha256(z.read(x)).hexdigest(),
                  'crc32':format(z.getinfo(x).CRC,'08x')} for x in sorted(members)]
          whole=download(f'/actions/jobs/{job}/logs')
          assert len(whole)>40000,len(whole)
          for token in (b'Build completed successfully (3092 jobs)',
                        b'SM_Y0_ORIGINAL_9_SOURCE_8_INDEPENDENT_CONSUMER_3_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN',
                        b'Artifact ID 14466219833'):
              assert token in whole,token
          root=Path('research/standard-model/evidence')
          root.mkdir(parents=True,exist_ok=True)
          arc=root/'SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence.zip'
          log=root/'SMY0_R1_44388795375_ORIGINAL_complete_job.log'
          manifest=root/'SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence_manifest.json'
          for p in (arc,log,manifest):assert not p.exists(),p
          arc.write_bytes(raw);log.write_bytes(whole)
          manifest.write_text(json.dumps({
            'gate':'SM-Y0','attempt':'R1','status':'ONE_FAMILY_SOURCE_AND_INDEPENDENT_CONSUMER_STRICT_GREEN_MATH_ONLY',
            'strict_run':run,'job_id':job,'tested_sha':tested,'artifact_id':artifact,
            'original_zip':{'path':str(arc),'size':len(raw),'sha256':digest,'members':m},
            'complete_job_log':{'path':str(log),'size':len(whole),'sha256':hashlib.sha256(whole).hexdigest()},
            'source_blob':'481a984b5ba7d2d7df41297d162ab1d608646d6e',
            'consumer_blob':'082492122e15f5f73a24b086ea1e3c4ae71527df',
            'workflow_blob':'62ec08931b474f586ec2d8bb5054b9b747796c7a',
            'source_axiom_roots':len(srcax),'consumer_axiom_roots':len(conax),
            'independent_examples':3,'auditor_mutations_rejected':6,
            'cold_build_jobs':3092,'allowed_axioms':sorted(allowed),
            'canonical_BFSS_anchors_unchanged':27,'canonical_BFSS_active':'P3-M4-W0C2B2_BLOCKED',
            'scope':'Checks rational anomaly coefficients, one-family even doublet count and an altered-charge counterexample. No theorem about full QFT, GUT, Higgs, neutrino masses, BFSS or physical unification'
          },sort_keys=True,indent=2)+'\n')
          print('SM_Y0_ORIGINAL_STRICT_GREEN_ZIP_COMPLETE_JOB_SHA_CRC_9_SOURCE_8_CONSUMER_6_NEGATIVES_INDEPENDENTLY_VERIFIED')
          PY
      - name: Commit original SM-Y0 strict GREEN ZIP full job log and checksum manifest to Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/standard-model/evidence/SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence.zip research/standard-model/evidence/SMY0_R1_44388795375_ORIGINAL_complete_job.log research/standard-model/evidence/SMY0_R1_44388795375_ORIGINAL_STRICT_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'SM-Y0 R1: preserve original native strict GREEN source-consumer archive and axiom audits'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
