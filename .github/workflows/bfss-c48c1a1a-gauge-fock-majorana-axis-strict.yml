          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/C48C1A1aOriginalGaugeFockMajoranaAxisCovariance.lean").read_text()
          test=Path("lean/diagnostics/BFSSC48C1A1aOriginalGaugeFockMajoranaAxisIndependentAudit.lean").read_text()
