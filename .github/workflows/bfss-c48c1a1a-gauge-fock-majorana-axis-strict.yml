      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore precisely pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-c48c1a1a/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold compile genuine G4H gauge-unitary original Fock gamma axis and independent consumer
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          evidence="$RUNNER_TEMP/bfss-c48c1a1a"
          root=OAI.MathematicalPhysics.BFSS.Contrib.Kotler
          timeout 3600s lake build \
            "$root.C48C1A1aOriginalGaugeFockMajoranaAxisCovariance" 2>&1 | tee "$evidence/cold-source-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/C48C1A1aOriginalGaugeFockMajoranaAxisCovariance.lean 2>&1 | tee "$evidence/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSC48C1A1aOriginalGaugeFockMajoranaAxisIndependentAudit.lean 2>&1 | tee "$evidence/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          e=Path(os.environ["RUNNER_TEMP"])/"bfss-c48c1a1a"
          source_roots=["FCP.BFSSC48C1A1aOriginalGaugeFockMajoranaAxisCovariance.sourceGammaAxis_eq_originalGaugeTheta","FCP.BFSSC48C1A1aOriginalGaugeFockMajoranaAxisCovariance.originalGaugeUnitary_sourceGammaAxis_covariant"]
          consumer_roots=["FCP.BFSSC48C1A1aOriginalGaugeFockMajoranaAxisCovariance.sourceGammaAxis_eq_originalGaugeTheta","FCP.BFSSC48C1A1aOriginalGaugeFockMajoranaAxisCovariance.originalGaugeUnitary_sourceGammaAxis_covariant","FCP.BFSSC48C1A1aOriginalGaugeFockMajoranaAxisIndependentAudit.originalGaugeUnitary_originalAxis_reverse","FCP.BFSSC48C1A1aOriginalGaugeFockMajoranaAxisIndependentAudit.originalGaugeUnitary_originalSource48Label"]
          allowed={"propext","Classical.choice","Quot.sound"}
          pkg_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for fn in ("cold-source-build.log","source-axioms.log","independent-consumer.log"):
              log=(e/fn).read_text()
              for forbidden in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
                  assert forbidden not in log,(fn,forbidden)
              warnings=[line for line in log.splitlines() if "warning:" in line and not pkg_warning.fullmatch(line)]
              assert not warnings,(fn,"unexpected warnings",warnings[:10])
              if fn!="cold-source-build.log":
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  expected=source_roots if fn=="source-axioms.log" else consumer_roots
                  assert [x for x,_ in reports]==expected,(fn,reports,expected)
                  for name,raw in reports:
                      actual={x.strip() for x in raw.split(",") if x.strip()}
                      assert actual<=allowed,(fn,name,actual)
