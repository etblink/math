name: BFSS spectral linear moment analysis strict gate

on:
  push:
    branches: [research/bfss-spectral-confinement-roadmap-20261106]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralLinearMomentCompactness.lean
      - lean/diagnostics/BFSSSpectralLinearMomentIndependentAudit.lean
      - contributions/bfss-kotler/BFSS_SPECTRAL_LINEAR_MOMENT_MANIFEST_V1.json
      - contributions/bfss-kotler/tools/qualify_spectral_linear_moment.py
      - .github/workflows/bfss-spectral-linear-moment-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-moment-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact sources and save proposed gate inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spectral-linear-moment"
          git rev-parse HEAD > "$RUNNER_TEMP/spectral-linear-moment/tested-sha.txt"
          tar -czf "$RUNNER_TEMP/spectral-linear-moment/proposed-inputs.tar.gz" \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralLinearMomentCompactness.lean \
            lean/diagnostics/BFSSSpectralLinearMomentIndependentAudit.lean \
            contributions/bfss-kotler/BFSS_SPECTRAL_LINEAR_MOMENT_MANIFEST_V1.json \
            contributions/bfss-kotler/tools/qualify_spectral_linear_moment.py \
            .github/workflows/bfss-spectral-linear-moment-strict.yml \
            lean/lean-toolchain lean/lake-manifest.json lean/lakefile.lean
          python3 contributions/bfss-kotler/tools/qualify_spectral_linear_moment.py preflight
      - name: Restore pinned Lean and Mathlib environment
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
      - name: Cold rebuild and independently consume the linear moment lemmas
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_spectral_linear_moment.py run \
            --evidence "$RUNNER_TEMP/spectral-linear-moment"
      - name: Retain exact inputs and full compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectral-linear-moment-${{ github.sha }}
          path: ${{ runner.temp }}/spectral-linear-moment
          if-no-files-found: error
          retention-days: 14
