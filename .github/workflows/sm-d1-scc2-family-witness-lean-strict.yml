name: SM-D1-SCC2 family minimal witness original native Lean strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC2FamilyMinimalWitnesses.lean
      - lean/diagnostics/SMD1SCC2FamilyMinimalIndependentConsumer.lean
      - .github/workflows/sm-d1-scc2-family-witness-lean-strict.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm-d1-scc2-family-witness-strict
  cancel-in-progress: false
jobs:
  source-and-independent-family-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout original unified research and protected BFSS evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source pins SCC1 mathematical archive SM and 27 BFSS anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sm-d1-scc2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sm-d1-scc2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/sm-d1-scc2/preflight.log"
          import json,re,subprocess
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC2FamilyMinimalWitnesses.lean":"3fd8fe33536c243829479428e97f992a3bb0942c","lean/diagnostics/SMD1SCC2FamilyMinimalIndependentConsumer.lean":"24bcb7c5e2f14b84814ed8f954834a05ea5bfed5","research/standard-model/SMD1_SCC2_FAMILY_MINIMAL_WITNESS_MICROGATE_2026_11_18.md":"a428d83b33d225b6e37dd0aa7f28b9f4ff3869f9","lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean":"b78f942e12874c1bb690ef2d6d6ef2a800031245","lean/diagnostics/SMD1SCC1FiniteWitnessIndependentConsumer.lean":"d30bf2d71198fc0faefe221d5851536c1ee6ee8c","lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean":"481a984b5ba7d2d7df41297d162ab1d608646d6e","research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json":"1d391ba994ee23f03c4423b45fbb15e7e42c86f1","research/standard-model/tools/smd1_scc0.py":"95569dffd88af133df3dd56d23e1f61ca8c4a207","research/standard-model/evidence/SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence.zip":"faf10f95ec2973ad5040be3f6f2ac362dcc1ca10","research/standard-model/evidence/SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence_manifest.json":"a14d4f8092849aa7f99b68b8dbc99e29131f027a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/ProbeW0C2B2E2OriginalTargetGammaAction.lean":"7d372392703d0fe69942df9df58b421af6850656"}
          for path,expected in pins.items():
              got=subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()
              assert got==expected,(path,got,expected)
          s=Path('lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC2FamilyMinimalWitnesses.lean').read_text();c=Path('lean/diagnostics/SMD1SCC2FamilyMinimalIndependentConsumer.lean').read_text()
          roots=["uniformDeletionMinimal_iff_minimal","uniformDeletionMinimal_is_uniform","equivalent_pair_blocks_uniform","empty_witnesses_blocked","family_minimal_implies_uniform"];consumers=["two_witnesses_uniform_consumer","removing_true_blocks_uniform_consumer","removing_false_blocks_uniform_consumer","both_witnesses_necessary_consumer","two_witnesses_globally_minimal_consumer"]
          assert s.startswith('import Mathlib.Tactic\n')
          assert 'SMD1SCC1FiniteWitnessSeparation' in s
          assert c.startswith('import OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMD1SCC2FamilyMinimalWitnesses\n')
          assert re.findall(r'(?m)^#print axioms (\S+)$',s)==roots
          assert re.findall(r'(?m)^#print axioms (\S+)$',c)==consumers
          assert len(re.findall(r'(?m)^theorem\b',s))==5
          assert len(re.findall(r'(?m)^theorem\b',c))==5
          assert len(re.findall(r'(?m)^example\b',c))==2
          assert 'Finset.minimal_iff_forall_erase' in s
          for t in (s,c):
              assert not re.search(r'(?m)^\s*(sorry|admit|axiom|unsafe)\b',t)
              assert not any(x in t for x in ('set_option maxRecDepth','set_option maxHeartbeats'))
          assert 'NFC_SCC_Branch' not in s+c and 'originalSource48BivectorK' not in s+c
          sm=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          assert sm['last_qualified']['gate']=='SM-Y0'
          assert sm['last_qualified_empirical']['gate']=='SM-D0'
          assert sm['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert sm['last_qualified_formal_methodology']['gate']=='SM-D1-SCC1'
          assert sm['last_qualified_formal_methodology']['independent_preservation_run']==44404925679
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in sm['upcoming'])
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert Path('lean/lean-toolchain').read_text().strip()=='leanprover/lean4:v4.34.1'
          lm=json.loads(Path('lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in lm['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          print('SM_D1_SCC2_5_SOURCE_5_CONSUMER_2_EXAMPLES_PINNED_MATHLIB_SM_Y0_SM_D0_SCC0_SCC1_27_BFSS_ANCHORS_PREFLIGHT_PASS')
          
          PY
      - name: Restore original pinned Lean 4.34.1 Mathlib cache
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          test "$(git -C .lake/packages/mathlib rev-parse HEAD:Mathlib/Order/CompleteLattice/Finset.lean)" = fce1b985bf079d153d2774d0c7c370b3048589ab
      - name: Cold source SCC1 imports SCC2 consumer and strict axiom checks
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/sm-d1-scc2"
          timeout 1100s lake build OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMD1SCC1FiniteWitnessSeparation OAI.MathematicalPhysics.StandardModel.Contrib.Kotler.SMD1SCC2FamilyMinimalWitnesses 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC2FamilyMinimalWitnesses.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/SMD1SCC2FamilyMinimalIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sm-d1-scc2'
          source=["uniformDeletionMinimal_iff_minimal","uniformDeletionMinimal_is_uniform","equivalent_pair_blocks_uniform","empty_witnesses_blocked","family_minimal_implies_uniform"]
          consumer=["two_witnesses_uniform_consumer","removing_true_blocks_uniform_consumer","removing_false_blocks_uniform_consumer","both_witnesses_necessary_consumer","two_witnesses_globally_minimal_consumer"]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          pkgwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          def audit(raw,names):
              assert 'sorryAx' not in raw and 'error:' not in raw
              assert not [x for x in raw.splitlines() if 'warning:' in x and not pkgwarn.fullmatch(x)]
              found=pat.findall(raw)
              assert len(found)==len(names),(found,names)
              assert [name.rsplit('.',1)[-1] for name,_ in found]==names
              for _,axs in found:
                  assert {a.strip() for a in axs.split(',') if a.strip()}<=allowed,axs
          good="'SM.check' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,['check'])
          bad=[good.replace('Quot.sound','sorryAx'),good.replace('Quot.sound','New.axiom'),
               good+good,'',good+'warning: unexpected\n',good+'error: unexpected\n']
          for i,value in enumerate(bad):
              try:audit(value,['check'])
              except AssertionError:pass
              else:raise AssertionError(('auditor mutant survived',i))
          cold=(root/'cold-source.log').read_text()
          assert 'Build completed successfully' in cold and 'error:' not in cold and 'sorryAx' not in cold
          audit((root/'source-axioms.log').read_text(),source)
          audit((root/'consumer.log').read_text(),consumer)
          print('SM_D1_SCC2_5_NATIVE_SOURCE_5_INDEPENDENT_CONSUMER_2_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN')
          
          PY
      - name: Preserve exact native source and consumer diagnostics for independent archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm-d1-scc2-original-family-minimal-lean-source-consumer
          path: /home/runner/work/_temp/sm-d1-scc2/
          retention-days: 14
          if-no-files-found: warn
