name: BFSS V9R genuine source-native to original paired-Fock skew LieHom strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9LieHomProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-lie-hom-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-original-paired-skew-lie-hom:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact original paired and gamma pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2PairedThetaLabelCrosswalkProbe.lean")" = 'f3a2b41f902a20f6fe237ecce18dd7e869e9c45e'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9PlaneGeneratorProbe.lean")" = '02b8e54464b0aea151c96cefd316a86270cf8871'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9AdjacentLieBracketProbe.lean")" = '2186cce50ad2f06c125b7281cbe10f319d975a81'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrientationSwapProbe.lean")" = '58cd7bbd6d1314dc684309b0fe4724688d00e59f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SharedLeftBracketProbe.lean")" = 'ce5cdc1d8073262b867fc705e0adc4f0ac5e743e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ZeroDiagonalBracketsProbe.lean")" = 'd9c453029eed5ffba4d498bb333a9d5302261aa3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ZeroDiagonalInterfaceProbe.lean")" = '8aa93c41a83164e3a99eca139de477d82842d589'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexDiagonalBoundaryProbe.lean")" = 'd0fba846741de21848820f46a179d7cc0251c113'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexPairCoincidenceProbe.lean")" = '10c1f7ea6bccece8003632d9fc43ace907dc27f1'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexDistinctCasesProbe.lean")" = '35b6e9acd0504885521727ec0e655f7e51813ea0'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9UniversalFourIndexBracketProbe.lean")" = 'b4b302b306e543194789d1af450d3658d93e6f09'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ZeroDiagonalSkewSquareProbe.lean")" = 'a4a4ada7dab04c87cdad14206656c6b81b32aeae'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NormalizedPlaneInterfaceProbe.lean")" = 'a217471af24ba8c086746d8ade85d1337a1b66d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NormalizedAdjacentBracketProbe.lean")" = '8ffeb7c8a369f356837c47b2e514175f24c897f4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NormalizedUniversalScalarBracketProbe.lean")" = 'bf441cca38636920498b6283ca178aa82aa0b2a3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NormalizedFourIndexStructureProbe.lean")" = '46e02a38f6647458132039bc1f44b0358c9c4f44'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneCarrierProbe.lean")" = '92a26e8380abe9c1f9bdf011d27b8e97b4e17ef3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitBridgeProbe.lean")" = 'd80001bbe5052357dbca559232d81cc01c56fb34'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitProductProbe.lean")" = 'a84879ae64bf8341b403fccb61f33cbd5628cac8'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneProductExpansionProbe.lean")" = 'da60e25fe1e6f0c5bd29ea6db7754f27394974f5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateUniversalBracketProbe.lean")" = '6d77516897cfbc229652fa779647da95150756c3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FiniteCoefficientLiftProbe.lean")" = 'b2c44f16a5acfb63d78ff8cc5c59c596fd41be0e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FiniteCoefficientScalarProbe.lean")" = 'c37cf40190b965c21da282aba49a37b07907530d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9TypedLinearMapProbe.lean")" = '3d83bef542ac264faf11506d2484fd656017b8cf'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LinearMapMatrixUnitEvaluationProbe.lean")" = '480a43155cb709cb549a19513ad99183a203afe4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LinearMapGeneratorAgreementProbe.lean")" = '549c1d332a2b9de322fad13abc2ec23ec42c966b'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LinearMapImageSkewProbe.lean")" = 'd8a75242a843db8b2cb26e62da0f10df9f814ea9'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9InputSkewMatrixUnitBridgeProbe.lean")" = 'da4020a35b3784a90ce76c03798061993fc6275b'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9AntisymmetricPartExpansionProbe.lean")" = '133ae2ada5935a5c1d66bbfd46f225c41173dfce'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SkewCoordinatePlaneSpanningProbe.lean")" = '626124eaa4635f64223b48bd6b986a367dc9b40e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9FourIndexRHSTransportProbe.lean")" = 'b7d08c6dfe027179a2934e580a8fbd0a71484ff4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9GeneratorCommutatorPreservationProbe.lean")" = 'c486ca5e6606fb69038cffa073c68791580b496e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9BracketDefectAdditivityProbe.lean")" = 'f2f60cb89cd7ec5f844e71e46cb70baf697c9c56'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9BracketDefectScalarProbe.lean")" = '41d74947e5e4d272f2b174274f62af7c8d52bce7'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9BracketDefectLinearExtensionsProbe.lean")" = '90c700e2152312f82c6f16e7a485a31e2d331579'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9BracketDefectPlaneSkewExtensionProbe.lean")" = '9de00df800da7c62c2340ed995df90780969798a'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9BracketDefectSkewPairVanishingProbe.lean")" = 'f23b0124e0ac32df475200df6d63026fe93c81f1'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NativeSkewCommutatorEqualityProbe.lean")" = 'ca26ae3f9942eb8d3ad639e77356a7df3c41456f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9NativeSkewCommutatorClosureProbe.lean")" = '19c556c7c7d7610eac9c0030c03983344757408d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9TypedSkewCarrierCommutatorProbe.lean")" = 'd8d36c3207031a7429e00c0b3a7e383bf277e4ea'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9TypedSkewCarrierLinearStructureProbe.lean")" = 'ed6d4722aaedd7e5442e62ceb4a47bd5504ba0d5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LieHomProbe.lean")" = '1b17d6542ebec81f12fd0231e8478f66679efd53'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9LieHomProbe.lean').read_text()
          assert s.count('noncomputable def coordinateSkewLieSubalgebra')==1
          assert s.count('noncomputable def pairedSkewLieSubalgebra')==1
          assert s.count('noncomputable def coordinateToPairedSkewLieHom')==1
          assert 'Mathlib.Algebra.Lie.OfAssociative' in s
          assert 'LieRing.ofAssociativeRing' in s
          assert 'coordinateToPairedLinearMap_skew_commutator' in s
          assert 'coordinateToPairedLinearMap_image_transpose' in s
          assert 'map_smul coordinateToPairedLinearMap c A.val' in s
          assert s.count('change (A + B).transpose = -(A + B)')==1
          assert s.count('change (X + Y).transpose = -(X + Y)')==1
          assert s.count('change (c • A).transpose = -(c • A)')==1
          assert s.count('change (c • X).transpose = -(c • X)')==1
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V9R_EXACT_SOURCE_PIN_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted V9R native skew carriers and real linear laws
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9TypedSkewCarrierLinearStructureProbe

      - name: Fresh compile exact V9R genuine LieHom source with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9LieHomProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v9r"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v9r/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v9r/compiler.log")" -eq 1

      - name: Fresh independent V9R LieHom theorem and axiom gate
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V9R_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9LieHomProbe
          open FCP.BFSSPairedSpin9Plane
          #check coordinateSkewLieSubalgebra
          #check pairedSkewLieSubalgebra
          #check coordinateToPairedSkewLieHom
          example (A B : coordinateSkewLieSubalgebra) :
              coordinateToPairedSkewLieHom ⁅A, B⁆ =
                ⁅coordinateToPairedSkewLieHom A, coordinateToPairedSkewLieHom B⁆ :=
            LieHom.map_lie coordinateToPairedSkewLieHom A B
          example (c : ℝ) (A : coordinateSkewLieSubalgebra) :
              coordinateToPairedSkewLieHom (c • A) =
                c • coordinateToPairedSkewLieHom A :=
            map_smul coordinateToPairedSkewLieHom c A
          #print axioms FCP.BFSSPairedSpin9Plane.coordinateToPairedSkewLieHom
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V9R_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v9r/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v9r'/'declaration-audit.log').read_text()
          root='FCP.BFSSPairedSpin9Plane.coordinateToPairedSkewLieHom'
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==[root],reports
          ax=reports[0][1]
          assert set(x.strip() for x in ax.split(',') if x.strip()) <= {
            'propext','Classical.choice','Quot.sound'},ax
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V9R_GENUINE_LIE_HOM_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v9r-original-paired-typed-skew-carriers-linear-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9r
          if-no-files-found: warn
