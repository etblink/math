name: BFSS V10H F10BY actual word vector action full derivative strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative.lean
      - lean/diagnostics/FCP_K1D18V10HF10BYIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10by-actual-word-vector-action-derivative-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-word-vector-action-full-derivative:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin accepted compatible actual action derivative ancestry and F10BY declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10by"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10by/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean")" = 'db887aa6e495eb2a74c2e826018ffb5453158806'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BFPBWCliffordTopologicalRing.lean")" = 'f7ea4c9e9d996d04d07a7733ffe7ab6a91ce2636'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BFIndependentAudit.lean)" = 'dd00871d12e1d533d15aa67608713d85eed0ec66'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BGPBWSourceSpinTopologicalGroup.lean")" = '9092ccaa5b4436bfa25cafe8b71541e6642999f6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BOSourceVectorConjugationDerivative.lean")" = '03287d741b05cd4e373f1b5e608d0e6888b63e89'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BOIndependentAudit.lean)" = '744a1917c34857f40c08aded9f2b1480c7dfe62c'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BTPBWBilinearMultiplicationSmoothness.lean")" = '10c56519331f867d5f453a63953e0018c03a09a3'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BTIndependentAudit.lean)" = '7fd6812e2e5ee4bdfa5b56422a9905c5611e6bd3'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BUAmbientVectorActionSmoothness.lean)" = 'aa38de95852718445ddd0448068592f9cefe4db4'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BUIndependentAudit.lean)" = '7a8e3f09d3a799d49ca5c3fa2060abe957ef7628'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BICoordinatePlaneSourceCurve.lean")" = 'faabd83f813eab9ae2026c5d426f8baed80d33a6'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BIIndependentAudit.lean)" = '119ab4569f0ef663838856ed3611e500a7125c82'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BVFinitePlaneWordSmoothness.lean)" = '1c0f3ddfc4fba9e28be411a4fd241e36398095a9'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BVIndependentAudit.lean)" = '54d3a22f75892e7a98d3f0986e3544b57d82a54e'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BJSourceCurveDerivatives.lean")" = '528937bc6f528eed64aea16ecc5eb69c74c2dd99'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BJIndependentAudit.lean)" = '13186e289439acf51af42c80cb0585f74a6285c2'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BWFinitePlaneWordDerivative.lean)" = '6a67d6fb7a1d01f5d0045adb8a6edb3747d0ee70'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BWIndependentAudit.lean)" = '26d4bc3768986a3d5ec9bb44484ba818085f57f6'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BLSourceCoordinateCommutatorAction.lean")" = 'bc0d8539c2523fffe2f36ee4b121a1b81a1431be'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BLIndependentAudit.lean)" = '1900ee7fa3f95d025dd3a2e210f2fa63d9c659d1'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneCarrierProbe.lean")" = '92a26e8380abe9c1f9bdf011d27b8e97b4e17ef3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitBridgeProbe.lean")" = 'd80001bbe5052357dbca559232d81cc01c56fb34'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BXWordDerivativeNativeVectorAction.lean)" = 'bbf201b5af11213eacef21fe6ec41947635cc781'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BXIndependentAudit.lean)" = '30d42b22ebadafb09c2b0c65db839af71ccf4ba7'
          
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BMInverseSourceCurveDerivative.lean")" = '545581346eaf563b54dcf3c828e43d19c2d1dd23'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BMIndependentAudit.lean)" = '057c3313f16775de85109fd5ca257eef69c04cf8'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative.lean)" = '1fa83224a22fc0c7d2efdd6b1fdffe2f55f536cc'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BYIndependentAudit.lean)" = '63b13c337d63df13cbc8d9d7aeaa51d685a0cd6b'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BYIndependentAudit.lean').read_text()
          names=["source9CoordinateHalfBivector_reverse","source9PlaneSpinWordVelocity_reverse","source9PlaneSpinWord_conjugation_hasFDerivAt_zero","source9PlaneSpinWord_vectorAction_hasFDerivAt_zero","source9PlaneSpinWord_vectorAction_fderiv_zero","source9PlaneSpinWord_vectorAction_fderiv_zero_apply"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          assert audit.count('CliffordAlgebra source9Quadratic →L[ℝ] CliffordAlgebra source9Quadratic).comp')==2
          assert audit.count('let R : CliffordAlgebra source9Quadratic →L[ℝ] CliffordAlgebra source9Quadratic :=')==2
          assert audit.count('let L : CliffordAlgebra source9Quadratic →L[ℝ] CliffordAlgebra source9Quadratic :=')==2
          assert 'local instance auditPBWIsTopologicalAddGroup :' in audit
          assert 'letI : IsTopologicalRing (CliffordAlgebra source9Quadratic) :=' in audit
          assert 'source9Clifford_isTopologicalRing_pbw' in audit
          assert 'exact IsTopologicalRing.isTopologicalAddGroup' in audit
          assert 'example : Sub (CliffordAlgebra source9Quadratic →L[ℝ] CliffordAlgebra source9Quadratic) :=' in audit
          assert not re.search(r'(?m)^local instance\s*:',s)
          for cls in ['NormedAddCommGroup','NormedSpace']:
              assert re.search(r'local instance f10byLocal'+cls+r'\s*:\s*'+cls,s),cls
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'(?m)^instance\b|attribute\s+\[instance\]',code)
              assert all(token not in code for token in ['Source48Label','NormedRing','GammaMatrix','SpinIndex','ChartedSpace','LieGroup','ContinuousLinearMap.add_apply'])
          for token in ['source9PBWNormedAddCommGroup','source9PBWNormedSpace',
                        '(hrs : r ≠ s)','(hrs : ∀ i, r i ≠ s i)',
                        'CliffordAlgebra.reverse.map_mul','CliffordAlgebra.reverse_ι',
                        'source9CoordinateClifford_anticommute r s hrs',
                        'source9PlaneSpinWordVelocity_reverse r s hrs l v',
                        'let W : (Fin k → ℝ) → CliffordAlgebra source9Quadratic',
                        'let H : (Fin k → ℝ) →L[ℝ] CliffordAlgebra source9Quadratic',
                        'L.hasFDerivAt.comp (0 : Fin k → ℝ) hW',
                        'source9CliffordReverseCLM.hasFDerivAt.comp (0 : Fin k → ℝ) hW',
                        'source9CliffordMulCLM.hasFDerivAt_of_bilinear hleft hreverse',
                        'apply ContinuousLinearMap.ext','CliffordAlgebra.reverse.map_one',
                        'rw [source9Spin_inv_coe_eq_reverse]','rw [hlinear, heq] at hproduct',
                        'source9VectorProjectionCLM.hasFDerivAt.comp (0 : Fin k → ℝ)',
                        'exact source9PlaneSpinWordVelocity_projected_commutator r s l v z',
                        'rw [hlinear, heq] at h',
                        '(source9PlaneSpinWord_vectorAction_hasFDerivAt_zero r s hrs l z).fderiv',
                        'congrArg (fun L : (Fin k → ℝ) →L[ℝ] (SpaceIndex → ℝ)',
                        'L v) hmap).trans (source9PlaneWordVectorVelocity_apply r s z l v)']:
              assert token in s,token
          for token in ['source9PBWCoordinates = auditPBWCoordinates := rfl',
                        'source9PBWNormedAddCommGroup =','NormedAddCommGroup.induced',
                        'NormedSpace.induced ℝ','auditPBWCoordinates.injective := rfl',
                        'source9CoordinateHalfBivector_reverse r s hrs',
                        'source9PlaneSpinWordVelocity_reverse r s hrs l v',
                        'CliffordAlgebra.ι source9Quadratic z * source9PlaneSpinWordVelocity r s l v := rfl',
                        'source9PlaneSpinWord_conjugation_hasFDerivAt_zero r s hrs l z',
                        'source9PlaneSpinWord_vectorAction_hasFDerivAt_zero r s hrs l z',
                        'source9PlaneSpinWord_vectorAction_fderiv_zero r s hrs l z',
                        'source9PlaneSpinWord_vectorAction_fderiv_zero_apply r s hrs l z v',
                        '((source9PlaneSpinWord r s hrs t l)⁻¹ : spinGroup source9Quadratic)',
                        '(Matrix.single r s (1 : ℝ) - Matrix.single s r (1 : ℝ))',
                        'coordinatePlane9_eq_single_sub_single r s']:
              assert token in audit,token
          print('V10H_F10BY_SOURCE_PIN_ACTUAL_WORD_VECTOR_ACTION_FULL_DERIVATIVE_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted combined F10BX ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BXWordDerivativeNativeVectorAction

      - name: Fresh F10BY actual action derivative warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10by/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently check actual inverse action full native derivative and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BYIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10by/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BYIndependentAudit.lean "$RUNNER_TEMP/v10h-f10by/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BYActualWordVectorActionDerivative.lean "$RUNNER_TEMP/v10h-f10by/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9CoordinateHalfBivector_reverse","source9PlaneSpinWordVelocity_reverse","source9PlaneSpinWord_conjugation_hasFDerivAt_zero","source9PlaneSpinWord_vectorAction_hasFDerivAt_zero","source9PlaneSpinWord_vectorAction_fderiv_zero","source9PlaneSpinWord_vectorAction_fderiv_zero_apply"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10by'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BY_ACTUAL_WORD_VECTOR_ACTION_FULL_DERIVATIVE_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BY audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10by-actual-word-vector-action-full-derivative-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10by
          if-no-files-found: warn
