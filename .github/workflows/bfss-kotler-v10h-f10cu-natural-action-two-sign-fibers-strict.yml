          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10CUNaturalActionTwoSignFibers.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10CUIndependentAudit.lean').read_text()
          names=["source9Spin_scalar_coefficient_square_one", "source9Spin_scalar_coefficient_two_signs", "source9NaturalKernel_clifford_one_or_neg_one", "source9NaturalMatrix_eq_one_iff_two_signs", "source9NegativeCentral_naturalMatrix_one", "source9NaturalMatrix_eq_iff_two_sign_fiber", "source9NaturalMatrix_fiber_signs_distinct", "source9NaturalMatrix_not_injective", "source9Reconstruction_eq_self_or_negative_on_sourceNeighborhood"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          for text in [s,audit]:
              assert text.count('#print axioms ')==len(names)
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert not re.search(r'\b(if_pos|if_neg|dif_pos|dif_neg)\b',code)
              allowed_instances = [] if text is s else ['local instance : Fintype (Finset SpaceIndex) := Fintype.ofFinite _', 'local instance : NormedAddCommGroup (CliffordAlgebra source9Quadratic) :=\n  NormedAddCommGroup.induced\n    (CliffordAlgebra source9Quadratic) (Finset SpaceIndex → ℝ)\n    auditSignsPBWCoordinates.toAddMonoidHom auditSignsPBWCoordinates.injective\nlocal instance : NormedSpace ℝ (CliffordAlgebra source9Quadratic) :=\n  NormedSpace.induced ℝ\n    (CliffordAlgebra source9Quadratic) (Finset SpaceIndex → ℝ) auditSignsPBWCoordinates']
              for allowed in allowed_instances:
                  assert code.count(allowed)==1
                  code=code.replace(allowed,'')
              assert not re.search(r'(?m)^(?:local )?(?:noncomputable )?instance\b|attribute\s+\[(?:local )?instance',code)
              assert all(t not in code for t in ['Source48Label','NormedRing','GammaMatrix','SpinIndex','ChartedSpace','LieGroup'])
          assert 'NormedAddCommGroup.induced' not in s and 'NormedSpace.induced' not in s
          assert 'TopologicalSpace.induced' not in s
          assert 'ℕ∞ω' not in s or 'open scoped ContDiff' in s
          assert 'source9PBWNormedAddCommGroup' not in s and 'source9PBWNormedSpace' not in s
          assert audit.count('NormedAddCommGroup.induced')==2 and audit.count('NormedSpace.induced')==2
          for t in ['spinGroup.star_mul_self_of_mem g.property', 'CliffordAlgebra.star_algebraMap', 'FaithfulSMul.algebraMap_injective ℝ (CliffordAlgebra source9Quadratic)', 'c * c = 1', '(c - 1) * (c + 1) = 0', 'c = 1 ∨ c = -1', 'source9NaturalMatrix_eq_one_iff_clifford_scalar g', 'g = 1 ∨ g = source9NegativeCentral', 'source9NaturalMatrix_eq_iff_relative_kernel g h', 'g = h ∨ g = source9NegativeCentral * h', 'have hh : source9SpinVectorOrthogonalHom g = source9SpinVectorOrthogonalHom h', 'source9NegativeCentral_ne_one (mul_right_cancel hprod).symm', '(hg : g ∈ source9SpinNaturalMatrixRecoveryNeighborhood)', 'source9NaturalMatrix_reconstruction_eq_on_sourceNeighborhood g hg']:
              assert t in s,t
          for t in ['source9PBWCoordinates = auditSignsPBWCoordinates := rfl', 'auditSignsSpinTopology := rfl', 'auditSignsMatrixTopology := rfl', 'source9SpinNaturalMatrixRecoveryNeighborhood_mem_nhds_one_pbw', 'source9SpinVectorOrthogonalHom g = 1 ↔', 'source9SpinVectorOrthogonalHom g = source9SpinVectorOrthogonalHom h ↔', '∃ h : spinGroup source9Quadratic, h ≠ g ∧', 'source9NaturalMatrix_fiber_signs_distinct g', '(hneg : source9SpinCoordinateReconstruction g ≠ source9NegativeCentral * g)', 'source9SpinCoordinateReconstruction_eq_self_iff g', 'source9Spin_scalar_coefficient_square_one g 2 hc', 'private theorem auditSigns_negative_ne_one', 'source9Spin_scalar_coefficient_square_one', 'source9Spin_scalar_coefficient_two_signs', 'source9NaturalKernel_clifford_one_or_neg_one', 'source9NaturalMatrix_eq_one_iff_two_signs', 'source9NegativeCentral_naturalMatrix_one', 'source9NaturalMatrix_eq_iff_two_sign_fiber', 'source9NaturalMatrix_fiber_signs_distinct', 'source9NaturalMatrix_not_injective', 'source9Reconstruction_eq_self_or_negative_on_sourceNeighborhood']:
              assert t in audit,t
          print('V10H_F10CU_SOURCE_PIN_NATURAL_ACTION_TWO_SIGN_FIBERS_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
