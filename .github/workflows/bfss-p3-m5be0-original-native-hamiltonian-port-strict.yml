name: BFSS P3-M5BE0 current original native Hamiltonian strict
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-p3-m5be0-original-native-hamiltonian-port-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M5BE0OriginalNativeHamiltonianPort.lean
      - lean/diagnostics/BFSSP3M5BE0OriginalNativeHamiltonianPortIndependentConsumer.lean
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-p3-m5be0-original-native-hamiltonian-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-native-physical-H-source-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact historical native BE source closure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 96
          persist-credentials: false
      - name: Check source, consumer, BE donor and immutable OAI manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-p3-m5be0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-p3-m5be0/tested-commit.txt"
          python3 - <<'PY' | tee "$RUNNER_TEMP/bfss-p3-m5be0/source-closure-preflight.log"
          from pathlib import Path
          import subprocess,re,json,hashlib
          BASE="c6253c7c8bec20ede9ac9cb725fb694c5e55d6b5"
          SOURCE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M5BE0OriginalNativeHamiltonianPort.lean"
          CONSUMER="lean/diagnostics/BFSSP3M5BE0OriginalNativeHamiltonianPortIndependentConsumer.lean"
          BE="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe.lean"
          EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M5BE0OriginalNativeHamiltonianPort.lean":"785633769214dcdfa6ef8517d58497f83fe30760","lean/diagnostics/BFSSP3M5BE0OriginalNativeHamiltonianPortIndependentConsumer.lean":"9e0c5538b19cba6d5952ed95636c02f37d12677f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe.lean":"0afafb8eae4b5efdbd4f95eff2ae1e9352dfe7c5","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea"}
          SRC_ROOTS=["originalPairedNormalizedH_eq_charge_square","originalPairedNormalizedH_naturalDomain","originalPairedNormalizedH_apply","originalPairedNormalizedH_selfAdjoint","originalPairedNormalizedH_closed","originalPairedNormalizedH_domain_dense","originalPairedNormalizedH_weakForm_iff"]
          BE_ROOTS=["weakRepresentative_iff_adjoint","weakRepresentative_iff_naturalAdjointSquare","sixteen_inner_smul","one_sixteenth_inner_smul","normalizedWeakRepresentative_iff_naturalAdjointSquare","adjoint_smul_of_dense","selfAdjoint_smul_real","originalMinimalPhysicalNormalizedWeakForm_associatedOperator_iff","originalMinimalPhysicalNormalizedHamiltonian_domain","originalMinimalPhysicalNormalizedHamiltonian_apply","originalMinimalPhysicalNormalizedHamiltonian_selfAdjoint","originalMinimalPhysicalNormalizedHamiltonian_weakForm_iff","originalMinimalPhysicalNormalizedHamiltonian_closed","originalMinimalPhysicalNormalizedHamiltonian_domain_dense"]
          def git(*a):
            return subprocess.check_output(["git",*a],text=True).strip()
          assert git("cat-file","-t",BASE)=="commit"
          assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
          basepaths={}
          for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
            m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
            if m: basepaths[m[2]]=m[1]
          seen={}
          stack=[SOURCE,CONSUMER,BE]
          while stack:
            p=stack.pop()
            if p in seen: continue
            file=Path(p)
            assert file.is_file(),("missing original source import",p)
            sha=git("hash-object","--no-filters",p)
            if p not in (SOURCE,CONSUMER):
              assert basepaths.get(p)==sha,("historical baseline OAI source drift",p,basepaths.get(p),sha)
            seen[p]=sha
            for name in re.findall(r"(?m)^import\s+(\S+)\s*$",file.read_text()):
              if name=="OAI" or name.startswith("OAI."):
                imp="lean/"+name.replace(".","/")+".lean"
                assert Path(imp).is_file(),("missing original OAI import",p,name)
                stack.append(imp)
          for p,sha in EXPECTED.items():
            assert seen.get(p)==sha,("source/consumer/frozen BE drift",p,seen.get(p),sha)
          s=Path(SOURCE).read_text()
          c=Path(CONSUMER).read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe","OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe"]
          assert re.findall(r"(?m)^import (\S+)$",c)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M5BE0OriginalNativeHamiltonianPort"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==SRC_ROOTS
          assert re.findall(r"(?m)^#print axioms (\S+)$",c)==(
            ["FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort."+x for x in SRC_ROOTS]+
            ["FCP.BFSSSU2PhysicalDomainL6H5E8BE."+x for x in BE_ROOTS])
          for blob in (s,c):
            assert "set_option autoImplicit false" in blob
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",blob)
            assert "maxHeartbeats" not in blob
          assert "originalMinimalPhysicalNormalizedHamiltonian" in s
          assert "(1 / 16 : ℂ)" in s
          assert "pairedGaugeData.physicalSpace" in c
          assert "FullL2 2" in c and "Fermion 2" in c and "Boson 2" in c
          assert "originalPairedNormalizedH_weakForm_iff" in s
          assert git("show",BASE+":lean/lean-toolchain")=="leanprover/lean4:v4.34.1"
          lm=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in lm if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          out=Path("bfss-p3-m5be0-manifest-audit")
          out.mkdir(exist_ok=True)
          receipt={
            "status":"P3_M5BE0_EXACT_CURRENT_SOURCE_CLOSURE_PREFLIGHT_NOT_LEAN_QUALIFIED",
            "tested_commit":git("rev-parse","HEAD"),
            "baseline":BASE,
            "current_imported_BE_blob":EXPECTED[BE],
            "source":SOURCE,
            "consumer":CONSUMER,
            "transitive_OAI_pin_count":len(seen),
            "new_candidate_files":2,
            "root_count":len(SRC_ROOTS),
            "BE_donor_axiom_root_count":len(BE_ROOTS),
            "pins":dict(sorted(seen.items())),
            "mathematical_qualification":False}
          (out/"pin-manifest.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("BFSS_P3_M5BE0_EXACT_ORIGINAL_BE_SOURCE_PREFLIGHT_PASS",len(seen),
                hashlib.sha256((out/"pin-manifest.json").read_bytes()).hexdigest())
          
          PY
      - name: Restore Lean 4.34.1 and exact Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-p3-m5be0/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold historical BE import, original paired consumer and 21 root axiom audits
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          e="$RUNNER_TEMP/bfss-p3-m5be0"
          orig="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8BEOriginalNormalizedPhysicalHamiltonianProbe.lean"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M5BE0OriginalNativeHamiltonianPort.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M5BE0OriginalNativeHamiltonianPort.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 3600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M5BE0OriginalNativeHamiltonianPort 2>&1 | tee "$e/cold-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee "$e/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M5BE0OriginalNativeHamiltonianPortIndependentConsumer.lean 2>&1 | tee "$e/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-p3-m5be0"
          new_roots=["FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_eq_charge_square","FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_naturalDomain","FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_apply","FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_selfAdjoint","FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_closed","FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_domain_dense","FCP.BFSSP3M5BE0OriginalNativeHamiltonianPort.originalPairedNormalizedH_weakForm_iff"]
          be_roots=["FCP.BFSSSU2PhysicalDomainL6H5E8BE.weakRepresentative_iff_adjoint","FCP.BFSSSU2PhysicalDomainL6H5E8BE.weakRepresentative_iff_naturalAdjointSquare","FCP.BFSSSU2PhysicalDomainL6H5E8BE.sixteen_inner_smul","FCP.BFSSSU2PhysicalDomainL6H5E8BE.one_sixteenth_inner_smul","FCP.BFSSSU2PhysicalDomainL6H5E8BE.normalizedWeakRepresentative_iff_naturalAdjointSquare","FCP.BFSSSU2PhysicalDomainL6H5E8BE.adjoint_smul_of_dense","FCP.BFSSSU2PhysicalDomainL6H5E8BE.selfAdjoint_smul_real","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedWeakForm_associatedOperator_iff","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedHamiltonian_domain","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedHamiltonian_apply","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedHamiltonian_selfAdjoint","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedHamiltonian_weakForm_iff","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedHamiltonian_closed","FCP.BFSSSU2PhysicalDomainL6H5E8BE.originalMinimalPhysicalNormalizedHamiltonian_domain_dense"]
          allowed={"propext","Classical.choice","Quot.sound"}
          depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name,expected in [
              ("cold-build.log",None),
              ("source-axioms.log",new_roots),
              ("independent-consumer.log",new_roots+be_roots)]:
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            unexpected=[l for l in log.splitlines()
                        if "warning:" in l and not depwarn.fullmatch(l)]
            assert not unexpected,(name,unexpected[:8])
            if expected is not None:
              reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
              assert [n for n,_ in reports]==expected,(name,reports,expected)
              for declaration,raw in reports:
                assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
          (d/"scope-receipt.json").write_text(json.dumps({
            "status":"P3_M5BE0_ORIGINAL_NATIVE_NORMALIZED_HAMILTONIAN_CURRENT_SOURCE_PORT",
            "original_BE_import_compiled":True,
            "concrete_paired_AlgebraData2_GaugeData":True,
            "original_sixteen_charge_natural_domain":True,
            "original_1_over_16_T_adjoint_T_normalization":True,
            "source_domain_action_selfadjoint_weakform_closed_dense":True,
            "independent_original_FullL2_consumer":True,
            "new_local_roots":7,
            "original_BE_donor_roots":14,
            "original_BF_BG_BH_current_imported_ports_qualified":False,
            "concrete_H_nonzero_domain_witness_proved":False,
            "nonzero_eigenstate_or_spectral_gap_proved":False
          },sort_keys=True,indent=2))
          print("BFSS_P3_M5BE0_ORIGINAL_NATIVE_PHYSICAL_H_STRICT_GREEN")
          PY
      - name: Preserve first-causal RED and strict source/consumer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p3-m5be0-native-h-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-p3-m5be0/
            bfss-p3-m5be0-manifest-audit/
          if-no-files-found: warn
          retention-days: 14
