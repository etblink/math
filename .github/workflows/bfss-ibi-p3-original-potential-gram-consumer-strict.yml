name: BFSS IBI P3 original Pauli potential Gram downstream consumer strict

'on':
  push:
    branches: [integration/bfss-ibi-qualified-candidate-20261115]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIP3OriginalPotentialGramConsumer.lean
      - lean/diagnostics/BFSSIBIP3OriginalPotentialGramIndependentConsumer.lean
      - .github/workflows/bfss-ibi-p3-original-potential-gram-consumer-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-p3-original-potential-gram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-P2C0-potential-incidence-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify frozen original physical and imported incidence source contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-p3-potential"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-p3-potential/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIP3OriginalPotentialGramConsumer.lean":"a04cb0e2babcf5b6d0567cf802e9e73f9740294e",
            "lean/diagnostics/BFSSIBIP3OriginalPotentialGramIndependentConsumer.lean":"877b934221f69bee4737d92e3d2d65f5623434ea",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0AOriginalBosonGram.lean":"382315f9e9442f8506bcbe5b42dbc2bad4e7d86d",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSP2C0OriginalPauliPotentialBinding.lean":"3a2aa136e97bb907ac0d36a7b1559523f42c4d14",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG2ABosonGaugeProbe.lean":"898c987cbcc0840f9c137682c3be345baca809d1",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"
          }
          for p,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert got==sha,(p,sha,got)
          path=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIP3OriginalPotentialGramConsumer.lean")
          t=path.read_text()
          assert re.findall(r"(?m)^import (\S+)$",t)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0AOriginalBosonGram",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSP2C0OriginalPauliPotentialBinding"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",t)==[
              "sourceColorWedgeSquared_eq_gramMinor",
              "originalPauli_masslessPotential_eq_gramMinors",
              "originalPauli_masslessPotential_gauge"]
          assert "originalGram_gauge" in t
          assert "originalPauli_masslessPotential_eq_wedge" in t
          assert "set_option autoImplicit false" in t
          assert "set_option maxHeartbeats 0" not in t
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",t)
          c=Path("lean/diagnostics/BFSSIBIP3OriginalPotentialGramIndependentConsumer.lean").read_text()
          assert len(re.findall(r"(?m)^example\b",c))==3
          assert re.findall(r"(?m)^import (\S+)$",c)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIP3OriginalPotentialGramConsumer"]
          assert "set_option autoImplicit false" in c
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",c)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(p["rev"] for p in packages if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_IBI_P3_POTENTIAL_GRAM_SOURCE_CONSUMER_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original potential and independent original source consumer axiom audit
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-ibi-p3-potential"
          mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIP3OriginalPotentialGramConsumer"
          src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIP3OriginalPotentialGramConsumer.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIP3OriginalPotentialGramConsumer.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1700s lake build "$mod" 2>&1 | tee "$root/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee "$root/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSIBIP3OriginalPotentialGramIndependentConsumer.lean 2>&1 | tee "$root/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-ibi-p3-potential"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              s=(root/name).read_text()
              assert "error:" not in s and "sorryAx" not in s,(name,s[-6000:])
              bad=[x for x in s.splitlines() if "warning:" in x and not allow_warning.fullmatch(x)]
              assert not bad,(name,bad[:15])
          assert "Build completed successfully" in (root/"cold-build.log").read_text()
          s=(root/"source-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          expected=[
            "FCP.BFSSIBIP3OriginalPotentialGramConsumer.sourceColorWedgeSquared_eq_gramMinor",
            "FCP.BFSSIBIP3OriginalPotentialGramConsumer.originalPauli_masslessPotential_eq_gramMinors",
            "FCP.BFSSIBIP3OriginalPotentialGramConsumer.originalPauli_masslessPotential_gauge"]
          assert [name for name,_ in reports]==expected,reports
          for name,raw in reports:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,raw)
          print("BFSS_IBI_P3_ORIGINAL_POTENTIAL_GRAM_MAINLINE_CONSUMER_STRICT_GREEN")
          PY
      - name: Preserve exact source consumer and axiom audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-p3-original-potential-gram-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-p3-potential/
          if-no-files-found: warn
          retention-days: 14
