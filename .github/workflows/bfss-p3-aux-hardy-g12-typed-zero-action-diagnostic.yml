name: BFSS G12 D0 typed zero action diagnostic
'on':
  push:
    branches:
    - integration/bfss-unified-research-20261108
    paths:
    - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12TypedZeroActionDiagnostic.lean
    - lean/diagnostics/BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.lean
    - .github/workflows/bfss-p3-aux-hardy-g12-typed-zero-action-diagnostic.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: bfss-p3-aux-hardy-g12-d0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typed-zero-action-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout frozen source ancestry
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 96
        persist-credentials: false
    - name: Pin diagnostic closure and freeze main G12 bytes
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bfss-aux-hardy-g12-d0-evidence
        git rev-parse HEAD | tee bfss-aux-hardy-g12-d0-evidence/tested-sha.txt
        python3 - <<'PY' | tee bfss-aux-hardy-g12-d0-evidence/preflight.log
        from pathlib import Path
        import hashlib,json,re,subprocess
        BASE="7459e472085a6ef9b3c5c8352073ea1bafa6645e"
        GENERIC="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12TypedZeroActionDiagnostic.lean"
        NATIVE="lean/diagnostics/BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.lean"
        COEFFICIENT="lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12FiniteCoefficientContraction.lean"
        EXPECTED={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG6OriginalCorePotentialBinding.lean": "ebe37de869b25068dfedb98c60340a27335e5c04", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.lean": "6d0f99d61340b6a052e733c0b964b8c4dcf69457", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9BSourcePairAndChargeReductionProbe.lean": "e066601ddb02e78493eb91582ce2dcb0e6fa3ca1", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9COrderedPairCoefficientProbe.lean": "1010bbfc6618718d98fbaf8cab065f4478759f94", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean": "cc0f4624239160dc39a7a191a519786e71df6abd", "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60", "lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean": "cc01379653404c4ede3d551fd8d823e079543b21", "lean/OAI/MathematicalPhysics/BFSS/Kinetic.lean": "14045947b1860b28cbbd82c3f2b40967e795d5a8", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG4OriginalPotentialYCancellation.lean": "b2a482d0817fd39e7437a77d66d8f911c7073de3", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5OriginalPotentialTauCAR.lean": "9ada3167a5de3be647c51f0740b5998d4e6ea45a", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG5FiniteOperatorEvaluation.lean": "0398bafa58b46dfbd83ec90a65be84adb03dedf8", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG7OriginalTauSmoothCore.lean": "d7320101971790d7fe56bfda1b011ae3e5d1b9d9", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG3OriginalYDerivativeContraction.lean": "03b5236bd91e4664e7101544b065054bd6c925a1", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8OriginalTauDerivative.lean": "138ab7f545bf00812a55d1cb035251a9eccb6c27", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG8DerivativeProductRule.lean": "b7d518b9f4a6ffb4acfaa4f265416a0b3aeccc68", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9OriginalYEntryDerivativeBinding.lean": "59a1360ee22b9ffa24fdcf018d9c9299a0b9ce11", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG9ComplexMatrixEntryDerivative.lean": "e7904e1edf3af664b3900c31c0757412d495d60c", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG10OriginalKineticTauCAR.lean": "59aaed1da894e8b91b2df51eda6f47a37cf4c517", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG11OriginalDerivativeColorContraction.lean": "fae4dc32dee27c5542f7fffddf217b276ed2bfef", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12FiniteCoefficientContraction.lean": "2c0b07a603a94ad18342a53a5d88eaad5345cb5d", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12TypedZeroActionDiagnostic.lean": "0a7b8ea4145a004d30577034c88db90346f2d77e", "lean/diagnostics/BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.lean": "12675baab7f764dbcb8f276d357246c70956a927"}
        FROZEN_MAIN={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12OriginalDerivativeFockBilinear.lean": "80ea179d9e2afa223bda77ce0d62af6ab61db422", "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12FiniteCoefficientContraction.lean": "2c0b07a603a94ad18342a53a5d88eaad5345cb5d", "lean/diagnostics/BFSSP3AuxHardyG12OriginalDerivativeFockBilinearIndependentConsumer.lean": "13f5557809b7ecce2dfeb60d2988febcd85bf529", ".github/workflows/bfss-p3-aux-hardy-g12-original-derivative-fock-bilinear-strict.yml": "a90a4f2b04623abdfe7b1db860b3716f0d60d570"}
        GENERIC_ROOTS=["FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexZeroOperatorProduct", "FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexSelectedColorSum"]
        NATIVE_ROOTS=["FCP.BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.originalZeroProduct", "FCP.BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.originalOffColorZero", "FCP.BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.originalSelectedColorSum"]
        def git(*args):
            return subprocess.check_output(["git",*args],text=True).strip()
        assert git("cat-file","-t",BASE)=="commit"
        assert subprocess.run(["git","merge-base","--is-ancestor",BASE,"HEAD"]).returncode==0
        for p,sha in FROZEN_MAIN.items():
            assert git("hash-object","--no-filters",p)==sha,("main G12 bytes changed",p)
        baseline={}
        for line in git("ls-tree","-r",BASE,"--","lean/OAI").splitlines():
            m=re.fullmatch(r"\d+ blob ([0-9a-f]{40})\t(.+)",line)
            if m:baseline[m[2]]=m[1]
        seen={}
        stack=[GENERIC,NATIVE,COEFFICIENT]
        while stack:
            p=stack.pop()
            if p in seen:continue
            f=Path(p)
            assert f.is_file(),("missing source",p)
            sha=git("hash-object","--no-filters",p)
            if p not in (GENERIC,NATIVE,COEFFICIENT):
                assert baseline.get(p)==sha,("accepted donor drift",p)
            seen[p]=sha
            for names in re.findall(r"(?m)^(?:public )?import[ \t]+([^\n]+)",f.read_text()):
                for name in names.split("--",1)[0].split():
                    if name=="OAI" or name.startswith("OAI."):stack.append("lean/"+name.replace(".","/")+".lean")
        for p,sha in EXPECTED.items():assert seen.get(p)==sha,("explicit pin drift",p,seen.get(p),sha)
        assert len(seen)==166,("diagnostic closure drift",len(seen))
        assert not any(p.endswith("P3AuxHardyG12OriginalDerivativeFockBilinear.lean") or p.endswith("BFSSP3AuxHardyG12OriginalDerivativeFockBilinearIndependentConsumer.lean") for p in seen)
        generic=Path(GENERIC).read_text();native=Path(NATIVE).read_text()
        assert re.findall(r"(?m)^import (\S+)$",generic)==["Mathlib"]
        assert re.findall(r"(?m)^#print axioms (\S+)$",generic)==GENERIC_ROOTS
        assert re.findall(r"(?m)^#print axioms (\S+)$",native)==NATIVE_ROOTS+GENERIC_ROOTS
        assert len(re.findall(r"(?m)^example\b",native))==3
        assert re.findall(r"(?m)^import (\S+)$",native)==[
         "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG11OriginalDerivativeColorContraction",
         "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG12FiniteCoefficientContraction",
         "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe",
         "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG12TypedZeroActionDiagnostic"]
        for text in (generic,native):
            assert "set_option autoImplicit false" in text
            assert "_root_.zero_smul ℂ" in text
            assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",text)
            assert "maxHeartbeats" not in text and "maxRecDepth" not in text
        assert "pairedAlgebraData" not in generic and "OAI.BFSSQuantum" not in generic
        assert "pairedAlgebraData" in native and "AlgebraData 2" in native
        assert "#check zero_smul" in native and "#check _root_.zero_smul" in native
        assert "set_option pp.all true" in native and "(0 : ℂ)" in native
        assert "Finset.sum_eq_single" in generic and "ite_eq_right" in generic
        assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
        packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
        assert next(v["rev"] for v in packages if v["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
        receipt={"status":"DIAGNOSTIC_PREFLIGHT_NOT_G12_QUALIFICATION","tested_sha":git("rev-parse","HEAD"),"reviewed_existing_source_baseline":BASE,"pins":dict(sorted(seen.items())),"transitive_OAI_pin_count":len(seen),"frozen_main_G12":FROZEN_MAIN,"generic_roots":GENERIC_ROOTS,"native_roots":NATIVE_ROOTS}
        p=Path("bfss-aux-hardy-g12-d0-evidence/pin-manifest.json");p.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
        print("BFSS_P3_AUX_HARDY_G12_D0_PREFLIGHT_PASS",len(seen),hashlib.sha256(p.read_bytes()).hexdigest())
        PY
    - name: Restore pinned Lean and Mathlib
      shell: bash
      timeout-minutes: 40
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
        curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        source "$HOME/.elan/env"
        cd lean
        timeout 2100s lake exe cache get 2>&1 | tee ../bfss-aux-hardy-g12-d0-evidence/cache.log
        test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
        test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
    - name: Strict Mathlib-only typed zero diagnostic
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        timeout 500s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG12TypedZeroActionDiagnostic 2>&1 | tee ../bfss-aux-hardy-g12-d0-evidence/generic-build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12TypedZeroActionDiagnostic.olean OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12TypedZeroActionDiagnostic.lean 2>&1 | tee ../bfss-aux-hardy-g12-d0-evidence/generic.log
        python3 - <<'PY'
        from pathlib import Path
        import json,re
        d=Path("../bfss-aux-hardy-g12-d0-evidence")
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        logs=[('generic-build.log', None), ('generic.log', ['FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexZeroOperatorProduct', 'FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexSelectedColorSum'])]
        for name,expected in logs:
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if expected is not None:
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                assert [n for n,_ in reports]==expected,(name,reports,expected)
                for declaration,raw in reports:assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
        print("BFSS_G12_D0_GENERIC_TYPED_ZERO_ACTION_PASS")
        PY
    - name: Accepted donor build and strict original-carrier diagnostic only
      shell: bash
      timeout-minutes: 75
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
        test ! -e .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12OriginalDerivativeFockBilinear.olean
        timeout 3600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG11OriginalDerivativeColorContraction OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG12FiniteCoefficientContraction OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG12TypedZeroActionDiagnostic 2>&1 | tee ../bfss-aux-hardy-g12-d0-evidence/native-build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.lean 2>&1 | tee ../bfss-aux-hardy-g12-d0-evidence/native.log
        test ! -e .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG12OriginalDerivativeFockBilinear.olean
        python3 - <<'PY'
        from pathlib import Path
        import json,re
        d=Path("../bfss-aux-hardy-g12-d0-evidence")
        allowed={"propext","Classical.choice","Quot.sound"}
        depwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
        logs=[('generic-build.log', None), ('generic.log', ['FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexZeroOperatorProduct', 'FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexSelectedColorSum']), ('native-build.log', None), ('native.log', ['FCP.BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.originalZeroProduct', 'FCP.BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.originalOffColorZero', 'FCP.BFSSP3AuxHardyG12TypedZeroActionNativeDiagnostic.originalSelectedColorSum', 'FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexZeroOperatorProduct', 'FCP.BFSSP3AuxHardyG12TypedZeroActionDiagnostic.complexSelectedColorSum'])]
        for name,expected in logs:
            log=(d/name).read_text()
            assert not any(x in log for x in ("error:","sorryAx","unknownIdentifier")),(name,log[-4500:])
            assert not [line for line in log.splitlines() if "warning:" in line and not depwarn.fullmatch(line)],name
            if expected is not None:
                reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                assert [n for n,_ in reports]==expected,(name,reports,expected)
                for declaration,raw in reports:assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(declaration,raw)
        (d/"scope-receipt.json").write_text(json.dumps({'status': 'G12_D0_TYPED_ZERO_ACTION_DIAGNOSTIC_GREEN', 'generic_reports': 2, 'native_reports': 5, 'literal_paired_examples': 3, 'explicit_complex_root_qualified_zero_action': True, 'main_G12_qualification': False, 'full_G12_source_compiled': False, 'full_G12_consumer_tested': False, 'root_cause_inference': 'Inspect printed lemma/scalar types; passing tests alone do not distinguish inference and namespace causes', 'core_rotation_tau_norm_or_physical_spectral_claim': False},sort_keys=True,indent=2)+"\n")
        print("BFSS_G12_D0_TYPED_ZERO_ACTION_DIAGNOSTIC_GREEN")
        PY
    - name: Preserve strict and first-causal evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bfss-aux-hardy-g12-d0-evidence
        path: bfss-aux-hardy-g12-d0-evidence/
        if-no-files-found: warn
        retention-days: 14
