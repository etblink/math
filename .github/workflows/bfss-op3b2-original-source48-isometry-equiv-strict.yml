name: BFSS OP3-B2 original paired source48 quadratic isometry equiv strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3B2OriginalSource48QuadraticIsometryEquiv.lean
      - lean/diagnostics/BFSSOP3B2OriginalSource48IsometryIndependentAudit.lean
      - .github/workflows/bfss-op3b2-original-source48-isometry-equiv-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-op3b2-isometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source48-isometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact OP3-B2 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify immutable original source geometry and OP3-B2 proof contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-op3b2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-op3b2/tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-op3b2/toolchain-sha256.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in pkgs if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={"lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean":"65db1f822b86bfbf400957a0aaa94784d6cb7a39","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48QuadraticUnitAxesProbe.lean":"de7cf67d2945718a1da98d05a14e1b0d7edcff4a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean":"9dc5713dfea7c40d8c9f58088392e144c3c28517","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10QSourceSpinOrientationDetOneProbe.lean":"948712b83647829ab5902dfa88979f44747af1f3","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean":"75a679f2a1435d747e219617feea266b4508c53d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3BOriginalSource48QuadraticIsometryBridge.lean":"e6a1c6fe0db9292dada850fae64bdd431a0f464d","lean/diagnostics/BFSSOP3BOriginalSource48QuadraticIndependentAudit.lean":"714be0a0aeec834bd233d2c66ae362ba68ca5cec","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3B2OriginalSource48QuadraticIsometryEquiv.lean":"9f8ea5c212105635a24f2042d1d05e682fe85670","lean/diagnostics/BFSSOP3B2OriginalSource48IsometryIndependentAudit.lean":"d6ca1fc59dd923eb7a9c21d12523fdfd1731d5b9","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3A2OriginalComplexCliffordFockSourceAxisCrosswalk.lean":"a9db27fc28379b35ca85515d733cc0bc43376592"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,expected,actual)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3B2OriginalSource48QuadraticIsometryEquiv.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSOP3B2OriginalSource48IsometryIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP3BOriginalSource48QuadraticIsometryBridge",
              "Mathlib.LinearAlgebra.Matrix.ToLin",
              "Mathlib.LinearAlgebra.QuadraticForm.IsometryEquiv"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP3B2OriginalSource48QuadraticIsometryEquiv"]
          roots=["orthogonalMatrix_source48LinearEquiv",
                 "orthogonalMatrix_source48IsometryEquiv",
                 "source9SpinOriginalPaired48IsometryEquiv",
                 "source9SpinOriginalPaired48IsometryEquiv_apply"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==roots
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
              "FCP.BFSSOP3B2OriginalSource48Isometry."+x for x in roots]
          for token in ["Matrix.mem_orthogonalGroup_iff'","Matrix.mem_orthogonalGroup_iff",
                        "Matrix.mulVec_mulVec","A.mulVecLin","A.transpose.mulVec",
                        "orthogonal_matrix_preserves_source48Quadratic",
                        "source9SpinOriginalPaired48OrthogonalHom",
                        "source9SpinOriginalPaired48SpecialOrthogonalHom_apply",
                        "source48Quadratic.IsometryEquiv"]:
              assert token in source,token
          for name,body in (("source",source),("consumer",consumer)):
              assert "∑" not in body,(name,"no full source sums")
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe|set_option maxRecDepth|set_option maxHeartbeats)\b",body),(name,"forbidden")
          print("OP3B2_EXACT_SOURCE48_ORTHOGONAL_ISOMETRY_PINS_PASS",len(pins))
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-op3b2/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold build original F10R and OP3-B1 B2 then independent exact type and axiom audits
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          evidence="$RUNNER_TEMP/bfss-op3b2"
          root=OAI.MathematicalPhysics.BFSS.Contrib.Kotler
          timeout 3600s lake build \
            "$root.SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe" \
            "$root.OP3BOriginalSource48QuadraticIsometryBridge" \
            "$root.OP3B2OriginalSource48QuadraticIsometryEquiv" 2>&1 | tee "$evidence/cold-source-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3B2OriginalSource48QuadraticIsometryEquiv.lean 2>&1 | tee "$evidence/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSOP3B2OriginalSource48IsometryIndependentAudit.lean 2>&1 | tee "$evidence/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import re,json,os
          e=Path(os.environ["RUNNER_TEMP"])/"bfss-op3b2"
          roots=["FCP.BFSSOP3B2OriginalSource48Isometry.orthogonalMatrix_source48LinearEquiv",
                 "FCP.BFSSOP3B2OriginalSource48Isometry.orthogonalMatrix_source48IsometryEquiv",
                 "FCP.BFSSOP3B2OriginalSource48Isometry.source9SpinOriginalPaired48IsometryEquiv",
                 "FCP.BFSSOP3B2OriginalSource48Isometry.source9SpinOriginalPaired48IsometryEquiv_apply"]
          allowed={"propext","Classical.choice","Quot.sound"}
          package_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for fn in ("cold-source-build.log","source-axioms.log","independent-consumer.log"):
              log=(e/fn).read_text()
              for bad in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
                  assert bad not in log,(fn,bad)
              unexpected=[l for l in log.splitlines() if "warning:" in l and not package_warning.fullmatch(l)]
              assert not unexpected,(fn,unexpected[:12])
              if fn!="cold-source-build.log":
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [name for name,_ in reports]==roots,(fn,reports)
                  for name,raw in reports:
                      found={x.strip() for x in raw.split(",") if x.strip()}
                      assert found<=allowed,(fn,name,found)
                  print(fn,"OP3B2_EXACT_FOUR_ROOT_AXIOM_GATE_PASS")
          receipt={"status":"OP3B2_ORIGINAL_SOURCE48_ISOMETRY_EQUIV_ONLY_PASS",
                   "roots":roots,
                   "full_Clifford_automorphism":False,
                   "global_Spin9_operator_action":False,
                   "star_continuity_center_gauge_spectral":False,
                   "scope":"Separately qualified original real orthogonal-matrix LinearEquiv, then source48Quadratic.IsometryEquiv packaging and genuine F10R Spin9 specialization at same 48 labels, with unchanged underlying mulVec. Clifford lift and Fock action remain unqualified."}
          (e/"scope-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True))
          print("OP3B2_ORIGINAL_PAIRED_SOURCE48_ISOMETRY_INDEPENDENT_STRICT_PASS")
          PY

      - name: Retain exact diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-op3b2-isometry-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-op3b2/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
