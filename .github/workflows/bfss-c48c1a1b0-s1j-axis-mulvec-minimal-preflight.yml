name: BFSS C48-1A1b0 original S1J source axis mulVec minimal preflight

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/diagnostics/BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.lean
      - .github/workflows/bfss-c48c1a1b0-s1j-axis-mulvec-minimal-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-c48c1a1b0-mulvec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-S1J-axis-mulvec:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze exact original S1J, G3B, S1V5 and mulVec diagnostic pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in pkgs if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe.lean":"de0a042cb39f58b81a0ebd54ce64912bff481a80",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG3B24ModeOrthogonalLiftProbe.lean":"3cdf867357ea2955bf9d88ec6f5f6a0f9228e92a",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean":"fad0eab5014aa038ddb0bf8411b0e81c358e7908",
            "lean/diagnostics/BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.lean":"1b27a02ce7054a29f388bb1b798dafdd019e8819"
          }
          assert len(pins)==4
          for p,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert actual==expected,(p,actual,expected)
          body=Path("lean/diagnostics/BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",body)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG3B24ModeOrthogonalLiftProbe",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe"
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$",body)==[
            "originalSourceLabel_eq_G1AColorMode",
            "originalS1J_sourceBlockColor_entry",
            "originalS1J_mulVec_sourceBlockColorAxis"
          ]
          assert "set_option autoImplicit false" in body
          assert "maxRecDepth" not in body and "maxHeartbeats" not in body
          assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
          print("C48C1A1b0_AXIS_MULVEC_4_BLOB_PINS_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Check original source S1J axis mulVec proof and axioms
        shell: bash
        timeout-minutes: 17
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          mkdir -p "$RUNNER_TEMP/bfss-c48c1a1b0-mulvec"
          timeout 680s lake build \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe \
            2>&1 | tee "$RUNNER_TEMP/bfss-c48c1a1b0-mulvec/dependency-build.log"
          timeout 200s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.lean \
            2>&1 | tee "$RUNNER_TEMP/bfss-c48c1a1b0-mulvec/axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          log=(Path(os.environ["RUNNER_TEMP"])/"bfss-c48c1a1b0-mulvec"/"axioms.log").read_text()
          for forbidden in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
              assert forbidden not in log,(forbidden,log[-4000:])
          pkg_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          warnings=[line for line in log.splitlines() if "warning:" in line and not pkg_warning.fullmatch(line)]
          assert not warnings,("unexpected warning",warnings[:10])
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          roots=[
            "FCP.BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.originalSourceLabel_eq_G1AColorMode",
            "FCP.BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.originalS1J_sourceBlockColor_entry",
            "FCP.BFSSC48C1A1b0OriginalS1JAxisMulVecMinimalProbe.originalS1J_mulVec_sourceBlockColorAxis"
          ]
          assert [x for x,_ in reports]==roots,(reports,roots)
          allowed={"propext","Classical.choice","Quot.sound"}
          assert all({x.strip() for x in raw.split(",") if x.strip()}<=allowed for _,raw in reports),reports
          print("C48C1A1b0_ORIGINAL_S1J_AXIS_MULVEC_MINIMAL_STRICT_PASS")
          PY
      - name: Preserve S1J axis mulVec diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-c48c1a1b0-mulvec-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-c48c1a1b0-mulvec/
          retention-days: 14
