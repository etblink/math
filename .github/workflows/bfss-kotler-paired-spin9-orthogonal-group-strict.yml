name: BFSS V9V exact original Fock-paired matrix orthogonal group membership strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-orthogonal-group-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-orthogonal-group:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact qualified ancestry and actual orthogonal-group membership
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9LieHomProbe.lean")" = '1b17d6542ebec81f12fd0231e8478f66679efd53'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9MathlibSkewBridgeProbe.lean")" = 'ee038db09af741bdd1af4b811d8daf79bb70ed37'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CanonicalSkewLieHomProbe.lean")" = '2b350ed73e1f831532d1200f1a0ab148ee53dacf'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalExponentialProbe.lean")" = 'cb27bc0755dc7f64bed51943ae18c24a00cba912'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe.lean")" = 'b471ebb2da441c4be099bed168f6fa3651e24a99'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe.lean').read_text()
          assert s.count('theorem pairedSkewExp_mem_orthogonalGroup')==1
          assert s.count('theorem coordinateToPairedCanonicalSkewLieHom_exp_mem_orthogonalGroup')==1
          assert s.count('theorem normalizedPairedPlane_exp_mem_orthogonalGroup')==1
          assert 'Matrix.mem_orthogonalGroup_iff' in s
          assert 'Matrix.isUnit_exp' in s
          assert 'Matrix.mul_nonsing_inv' in s
          assert 'SU2BFSSPairedSpin9OrthogonalExponentialProbe' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V9V_ORIGINAL_SOURCE_AND_MEMBERSHIP_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted V9U real paired matrix-exponential ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9OrthogonalExponentialProbe

      - name: Fresh V9V actual orthogonal-group membership compile with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v9v"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v9v/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v9v/compiler.log")" -eq 3

      - name: Independently elaborate orthogonal-group membership and audit axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V9V_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe
          open FCP.BFSSPairedSpin9Plane
          open OAI.BFSSQuantum
          open NormedSpace
          #check pairedSkewExp_mem_orthogonalGroup
          #check coordinateToPairedCanonicalSkewLieHom_exp_mem_orthogonalGroup
          #check normalizedPairedPlane_exp_mem_orthogonalGroup
          example (X : Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)
              (hX : X.transpose = -X) (t : ℝ) :
              exp (t • X) ∈ Matrix.orthogonalGroup FCP.BFSSS1V0.Source48Label ℝ :=
            pairedSkewExp_mem_orthogonalGroup X hX t
          example (r s : SpaceIndex) (t : ℝ) :
              exp (t • normalizedPairedPlane r s) ∈
                Matrix.orthogonalGroup FCP.BFSSS1V0.Source48Label ℝ :=
            normalizedPairedPlane_exp_mem_orthogonalGroup r s t
          example (A : skewAdjointMatricesLieSubalgebra
              (1 : Matrix SpaceIndex SpaceIndex ℝ)) (t : ℝ) :
              exp (t • ((coordinateToPairedCanonicalSkewLieHom A).val :
                Matrix FCP.BFSSS1V0.Source48Label FCP.BFSSS1V0.Source48Label ℝ)) ∈
                  Matrix.orthogonalGroup FCP.BFSSS1V0.Source48Label ℝ :=
            coordinateToPairedCanonicalSkewLieHom_exp_mem_orthogonalGroup A t
          #print axioms FCP.BFSSPairedSpin9Plane.pairedSkewExp_mem_orthogonalGroup
          #print axioms FCP.BFSSPairedSpin9Plane.coordinateToPairedCanonicalSkewLieHom_exp_mem_orthogonalGroup
          #print axioms FCP.BFSSPairedSpin9Plane.normalizedPairedPlane_exp_mem_orthogonalGroup
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V9V_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v9v/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v9v'/'declaration-audit.log').read_text()
          prefix='FCP.BFSSPairedSpin9Plane.'
          expected=[prefix+'pairedSkewExp_mem_orthogonalGroup',
                    prefix+'coordinateToPairedCanonicalSkewLieHom_exp_mem_orthogonalGroup',
                    prefix+'normalizedPairedPlane_exp_mem_orthogonalGroup']
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==expected,reports
          for _,ax in reports:
            assert set(x.strip() for x in ax.split(',') if x.strip()) <= {
              'propext','Classical.choice','Quot.sound'},ax
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V9V_ORIGINAL_PAIRED_ORTHOGONAL_MEMBERSHIP_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v9v-original-paired-orthogonal-group-membership-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9v
          if-no-files-found: warn
