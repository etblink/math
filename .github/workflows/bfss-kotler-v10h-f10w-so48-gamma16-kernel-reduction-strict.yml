name: BFSS V10H F10W source paired SO48 and gamma16 exact kernel reduction strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10WOriginalPairedSO48Gamma16KernelReductionProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10w-so48-gamma16-kernel-reduction-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-so48-gamma16-kernel-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original gamma V10E V10F F10V and F10W
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10w"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10w/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean")" = '3979ea1d3c64e4a3cb82e4baf2c10cbc6b5cb627'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean")" = '9dc5713dfea7c40d8c9f58088392e144c3c28517'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10VSourceCentralInvolutionSO48SignActionProbe.lean")" = '4d61948281f17213e2c9ba1dc8ae9c57299c34d3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10WOriginalPairedSO48Gamma16KernelReductionProbe.lean")" = '1e21a40ac75613dc1c7a31d8266185db8a77e809'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10WOriginalPairedSO48Gamma16KernelReductionProbe.lean').read_text()
          names=['gamma16ToOriginalPaired48_injective',
                 'source9OriginalPairedSO48_eq_iff_gamma16',
                 'source9OriginalPairedSO48_mem_ker_iff_gamma16',
                 'source9OriginalPairedSO48_ker_eq_gamma16_ker']
          for name in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(name)+r'\b',s))==1,name
          assert s.count('#print axioms ')==4
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for tok in ['gamma16ToOriginalPaired48','pairedColorSpinEquiv',
                      'Matrix.reindexRingEquiv','Matrix.kronecker_apply',
                      'source9SpinOriginalPaired48SpecialOrthogonalHom',
                      'source9SpinGammaOrthogonalHom','MonoidHom.mem_ker']:
              assert tok in code,tok
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10W_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10V source Spin9 central SO48 sign ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10VSourceCentralInvolutionSO48SignActionProbe

      - name: Fresh F10W actual SO48 gamma16 kernel reduction warning-as-error proof
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10WOriginalPairedSO48Gamma16KernelReductionProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10w/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate four exact kernel reduction types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10W_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10WOriginalPairedSO48Gamma16KernelReductionProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example :
              Function.Injective gamma16ToOriginalPaired48 :=
            gamma16ToOriginalPaired48_injective
          noncomputable example
              (g h : spinGroup source9Quadratic) :
              source9SpinOriginalPaired48SpecialOrthogonalHom g =
                source9SpinOriginalPaired48SpecialOrthogonalHom h ↔
              source9SpinGammaOrthogonalHom g =
                source9SpinGammaOrthogonalHom h :=
            source9OriginalPairedSO48_eq_iff_gamma16 g h
          noncomputable example
              (g : spinGroup source9Quadratic) :
              g ∈ source9SpinOriginalPaired48SpecialOrthogonalHom.ker ↔
                g ∈ source9SpinGammaOrthogonalHom.ker :=
            source9OriginalPairedSO48_mem_ker_iff_gamma16 g
          noncomputable example :
              (source9SpinOriginalPaired48SpecialOrthogonalHom.ker :
                Set (spinGroup source9Quadratic)) =
              (source9SpinGammaOrthogonalHom.ker :
                Set (spinGroup source9Quadratic)) :=
            source9OriginalPairedSO48_ker_eq_gamma16_ker
          #print axioms FCP.BFSSPairedSpin9Clifford.gamma16ToOriginalPaired48_injective
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalPairedSO48_eq_iff_gamma16
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalPairedSO48_mem_ker_iff_gamma16
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalPairedSO48_ker_eq_gamma16_ker
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10W_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10w/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10w'/'declaration-audit.log').read_text()
          names=['gamma16ToOriginalPaired48_injective',
                 'source9OriginalPairedSO48_eq_iff_gamma16',
                 'source9OriginalPairedSO48_mem_ker_iff_gamma16',
                 'source9OriginalPairedSO48_ker_eq_gamma16_ker']
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==4 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10W_FOUR_GAMMA16_KERNEL_REDUCTION_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA, compiler and independent kernel-reduction audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10w-original-so48-gamma16-kernel-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10w
          if-no-files-found: warn
