name: BFSS W0C0 R2 original scalar trace GREEN evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c0-r2-green-evidence-pinning.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-provider-original-W0C0-R2-GREEN:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact original W0C0 R2 and accepted predecessors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check strict R2 source, consumer, and immutable negative evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean)" = 96d3b63d08413f880d1adf0cef8b8e291f7b9453
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean)" = fe9136065179d706c60871ae16e02b8f60e1b189
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c0-r2-original-fock-scalar-trace-strict.yml)" = b36fb1ae5b76a3b611292ac9ac4c11ca59509bde
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip)" = f8133dba86db582f5d302885c7c134b3e2ff043a
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip)" = 54f84642bc280e61ce9fe59b77bfd9caf7bc7c61
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip)" = 56e470ba2dbea58c9a05cdfcea91f64e06b568e8
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44191695033_PREFLIGHT_SYNTAX_RED_evidence.zip)" = 5655f0d212cc75319ad45d8f8ec1a0fb143c8dba
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C0","R2","PENDING_STRICT_CI",False)
          assert a["source_blob"]=="96d3b63d08413f880d1adf0cef8b8e291f7b9453"
          assert a["consumer_blob"]=="fe9136065179d706c60871ae16e02b8f60e1b189"
          assert a["workflow_blob"]=="b36fb1ae5b76a3b611292ac9ac4c11ca59509bde"
          assert q["gate"]=="P3-M4-W0B2B" and q["run_id"]==44180157170 and q["qualification"] is True
          assert q==s["accepted_anchors"][-1]
          assert s["previous_active_W0C0_R1_RED"]["run_id"]==44184526501
          assert s["w0c0_r2_first_preflight_red"]["run_id"]==44190799433
          assert s["w0c0_r2_second_preflight_red"]["run_id"]==44191695033
          assert s["next_planned"]["gate"]=="P3-M4-W0C1" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          for p in ["research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip","research/quantum-information/diagnostics/BFSS_W0C0_R2_44192981282_complete_job.log","research/quantum-information/diagnostics/BFSS_W0C0_R2_44192981282_GREEN_evidence_manifest.json"]:
              assert not Path(p).exists(),p
          print("BFSS_W0C0_R2_UNPROMOTED_ORIGINAL_EVIDENCE_PREFLIGHT_PASS")
          PY
      - name: Rehash original provider ZIP, full Actions job log and six axiom reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.error,urllib.request,zipfile
          from pathlib import Path
          run=44192981282;job=134426946419;artifact=14378238828
          tested="d193649342bb543faa91bf559db0b953c6ec2dcd"
          size=19089
          digest="37cd7da40243fff8833524789de91314a5bf21bf273a086f96cb81669679c8e1"
          marker="BFSS_W0C0_R2_ORIGINAL_FOCK_SCALAR_TRACE_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN"
          preflight="BFSS_W0C0_R2_W0B2B_ACCEPTED_ORIGINAL_TRACE_VACUUM_PREFLIGHT_PASS"
          prefix="https://api.github.com/repos/etblink/math"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as res:return json.load(res)
          runinfo=getjson(f"{prefix}/actions/runs/{run}")
          jobinfo=getjson(f"{prefix}/actions/jobs/{job}")
          meta=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert runinfo["id"]==run and runinfo["status"]=="completed" and runinfo["conclusion"]=="success"
          assert runinfo["head_sha"]==tested and runinfo["run_attempt"]==1
          assert jobinfo["id"]==job and jobinfo["run_id"]==run and jobinfo["conclusion"]=="success"
          assert all(s["conclusion"]=="success" for s in jobinfo["steps"] if s["name"] in [
              "Preflight accepted W0B2B original Schur, T1 trace and OP2c nonzero vacuum",
              "Restore pinned Lean 4.34.1 and Mathlib",
              "Cold original Fock scalar trace, independent consumer and axiom audit"])
          assert meta["id"]==artifact and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try: response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as response:return response.read()
              else:
                  with response:return response.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          names={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
          source=["originalFockTrace_one_eq_finrank","originalFockTrace_one_ne_zero","originalFockTrace_scalar_one_eq_zero_iff"]
          consumer=[name+"_consumer" for name in source]
          allowed={"propext","Classical.choice","Quot.sound"}
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(report,expected):
              assert "error:" not in report and "sorryAx" not in report
              found=pat.findall(report)
              assert len(found)==len(expected),(found,expected)
              assert [name.rsplit(".",1)[-1] for name,_ in found]==expected,found
              assert len({name for name,_ in found})==len(expected)
              for _,axioms in found:
                  assert {x.strip() for x in axioms.split(",") if x.strip()}<=allowed,axioms
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names
              assert z.read("tested-commit.txt").decode().strip()==tested
              assert preflight in z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "Build completed successfully (9218 jobs)." in cold
              assert "error:" not in cold and "sorryAx" not in cold
              assert marker in z.read("auditor.log").decode()
              audit(z.read("source-axioms.log").decode(),source)
              audit(z.read("consumer.log").decode(),consumer)
              members=[{"name":name,"size":len(z.read(name)),"sha256":hashlib.sha256(z.read(name)).hexdigest(),"crc32":format(z.getinfo(name).CRC,"08x")} for name in sorted(names)]
          complete=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(complete)>20000
          assert b"Build completed successfully (9218 jobs)." in complete
          assert marker.encode() in complete and preflight.encode() in complete
          assert b"Artifact ID 14378238828" in complete
          # The full Actions transcript includes audit-test source text mentioning sorryAx;
          # acceptance checks only the six parsed theorem reports, not script echoes.
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(exist_ok=True,parents=True)
          archive=root/f"BFSS_M4_W0C0_R2_{run}_GREEN_evidence.zip"
          full=root/f"BFSS_W0C0_R2_{run}_complete_job.log"
          manifest=root/f"BFSS_W0C0_R2_{run}_GREEN_evidence_manifest.json"
          for p in (archive,full,manifest):assert not p.exists(),p
          archive.write_bytes(raw)
          full.write_bytes(complete)
          record={
            "gate":"P3-M4-W0C0","attempt":"R2","status":"GREEN_STRICT_PROVIDER_ORIGINAL_UNPROMOTED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":size,"sha256":digest,"members":members},
            "original_job_log":{"path":str(full),"size":len(complete),"sha256":hashlib.sha256(complete).hexdigest()},
            "source_blob":"96d3b63d08413f880d1adf0cef8b8e291f7b9453",
            "consumer_blob":"fe9136065179d706c60871ae16e02b8f60e1b189",
            "workflow_blob":"b36fb1ae5b76a3b611292ac9ac4c11ca59509bde",
            "source_reports":3,"consumer_reports":3,"independent_controls":3,"negative_mutants":6,
            "cold_build_jobs":9218,"strict_marker":marker,"preflight_marker":preflight,
            "allowed_axioms":["propext","Classical.choice","Quot.sound"],
            "accepted_predecessor_run":44180157170,
            "prior_W0C0_R1_native_red_run":44184526501,
            "prior_W0C0_R2_setup_red_runs":[44190799433,44191695033]
          }
          manifest.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("BFSS_W0C0_R2_ORIGINAL_GREEN_PROVIDER_ZIP_AND_FULL_JOB_LOG_REHASH_PASS")
          PY
      - name: Git-pin provider-original ZIP, complete log and member-digest manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip research/quantum-information/diagnostics/BFSS_W0C0_R2_44192981282_complete_job.log research/quantum-information/diagnostics/BFSS_W0C0_R2_44192981282_GREEN_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          test "$(wc -c < research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip | tr -d ' ')" = 19089
          git commit -m "BFSS W0C0 R2: preserve original scalar-trace GREEN ZIP complete Actions log and manifest"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
