name: BFSS E-M7-001-R1 preregistered coefficient-model replication

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - research/spectral-p2-original-field/tools/replicate_source_fermion_sharp_constant.py
      - .github/workflows/bfss-e-m7-001-r1-replication.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-independent-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout original source, registry, and both independent methods
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify experiment preregistration, exact source blobs and fixed scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e-m7-001-r1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/e-m7-001-r1/source-head.txt"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          registry=json.loads(Path("research/methodology/BFSS_EXPERIMENT_REGISTRY.json").read_text())
          test=next(x for x in registry["entries"] if x["id"]=="E-M7-001-R1")
          assert test["status"]=="REGISTERED_NOT_EXECUTED",test["status"]
          assert test["prior_exploration_retroactively_registered"] is False
          assert test["stages"]["experiment"]["prespecified_fixtures"]["float_random"]==200
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2RealGammaProbe.lean":"b9b8192055c70f0d001d7982669b9823c55562ed",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2ColorCrossProbe.lean":"209b3808222730ca5e817d83ed32253a67513f7f",
            "contributions/bfss-kotler/tools/audit_spectral_confinement_ab.py":"4dcc78016765253e8efe5f9f5697aba4999a6d6d",
            "contributions/bfss-kotler/tools/audit_spectral_source_premises.py":"d52cbb008099513399abaf33b11c82a1dc52b665",
            "research/spectral-p2-original-field/tools/audit_source_fermion_sharp_constant.py":"f779c7a73f28b3d246f2c532877cd9835bd88333",
            "research/spectral-p2-original-field/tools/replicate_source_fermion_sharp_constant.py":"caad1c94d94d2d7c83a503a2927d773ec3ae2a48",
          }
          for path,sha in pins.items():
            got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
            assert got==sha,(path,got,sha)
          print("BFSS_E_M7_001_R1_PINNED_PREREGISTRATION_PASS")
          PY
      - name: Install finite Python algebra dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user "numpy==2.3.5" "sympy==1.14.0"
          python3 - <<'PY'
          import numpy,sympy
          assert numpy.__version__=="2.3.5"
          assert sympy.__version__=="1.14.0"
          print("PYTHON_ALGEBRA_PIN_PASS")
          PY
      - name: Execute prior independently pinned algorithm and frozen fixtures
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 research/spectral-p2-original-field/tools/audit_source_fermion_sharp_constant.py --output "$RUNNER_TEMP/e-m7-001-r1/baseline.json" 2>&1 | tee "$RUNNER_TEMP/e-m7-001-r1/baseline.log"
      - name: Execute independent Kronecker plus Hermitian eigenvalue replication
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 research/spectral-p2-original-field/tools/replicate_source_fermion_sharp_constant.py --output "$RUNNER_TEMP/e-m7-001-r1/independent.json" 2>&1 | tee "$RUNNER_TEMP/e-m7-001-r1/independent.log"
      - name: Compare output receipts under preregistered thresholds and retain evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,os,hashlib
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"e-m7-001-r1"
          a=json.loads((d/"baseline.json").read_text())
          b=json.loads((d/"independent.json").read_text())
          assert a["status"]=="EXACT_INTEGER_NUMERICAL_AND_OPTIONAL_SYMBOLIC_RESEARCH_ONLY_NOT_LEAN"
          assert b["status"]=="INDEPENDENT_FINITE_TESTS_ONLY_NOT_LEAN"
          assert len(a["source_48x48_polynomial_samples"])==len(b["integer_polynomial_fixtures"])==16
          assert a["norm_diagnostics"]["random_count"]==b["numerical"]["random_count"]==200
          tol=3e-10
          errors=[]
          for key,one in a["norm_diagnostics"]["source_cases"].items():
            two=next(t for t in b["numerical"]["geometric_fixtures"] if t["configuration"]==key)
            errors.append(abs(one["norm_over_r"]-two["norm_ratio"]))
          for key,one in a["norm_diagnostics"]["near_valley_ratio_by_epsilon"].items():
            errors.append(abs(one-b["numerical"]["near_valley"][key]))
          assert max(errors)<=tol,max(errors)
          assert abs(a["norm_diagnostics"]["conditional_sharp_C"]-b["bound"])<tol
          assert a["reduced_symbolic_model"]["status"]=="EXACT_SYMBOLIC_PASS_REDUCED_12_BY_12",a["reduced_symbolic_model"]
          assert all(x["max_integer_residual"]==0 for x in b["integer_polynomial_fixtures"])
          result={"experiment":"E-M7-001-R1","status":"SURVIVED_FINITE_TESTS_NOT_PROVED",
                  "original_source_coefficients_pinned":True,
                  "independent_methods":["48x48 SVD signed-permutation basis",
                                         "48x48 eigvalsh Hermitian i*K0 built via color-gamma Kronecker"],
                  "sample_count":200,"integer_polynomial_fixtures":16,
                  "max_cross_method_fixture_difference":max(errors),
                  "candidate_bound":b["bound"],
                  "symbolic_12x12_exact":True,
                  "reduced_formula_universal":False,
                  "source_B_field_operator_bound_qualified":False,
                  "physical_sector_coercivity_qualified":False,
                  "spectral_claim":False}
          (d/"comparison.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          for f in d.glob("*.json"):
            print(f.name,hashlib.sha256(f.read_bytes()).hexdigest())
          print("BFSS_E_M7_001_R1_INDEPENDENT_FINITE_REPLICATION_GREEN_NOT_THEOREM")
          PY
      - name: Preserve red and green data for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-e-m7-001-r1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e-m7-001-r1/
          retention-days: 14
          if-no-files-found: warn
