name: BFSS OP3-C0 original real Clifford generator square strict gate

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C0OriginalRealCliffordGeneratorSquare.lean
      - lean/diagnostics/BFSSOP3C0OriginalRealCliffordSquareIndependentAudit.lean
      - .github/workflows/bfss-op3c0-original-real-clifford-generator-square-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-op3c0-source-clifford-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-real-clifford-square:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact tested original OP3-C0 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Freeze OP3-C0 original source quadratic group and independent proof contract
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bfss-op3c0"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$evidence/toolchain-sha256.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in pkgs if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={"lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean":"65db1f822b86bfbf400957a0aaa94784d6cb7a39","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean":"fad0eab5014aa038ddb0bf8411b0e81c358e7908","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean":"9dc5713dfea7c40d8c9f58088392e144c3c28517","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean":"75a679f2a1435d747e219617feea266b4508c53d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48QuadraticUnitAxesProbe.lean":"de7cf67d2945718a1da98d05a14e1b0d7edcff4a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3BOriginalSource48QuadraticIsometryBridge.lean":"e6a1c6fe0db9292dada850fae64bdd431a0f464d","lean/diagnostics/BFSSOP3BOriginalSource48QuadraticIndependentAudit.lean":"714be0a0aeec834bd233d2c66ae362ba68ca5cec","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3A2OriginalComplexCliffordFockSourceAxisCrosswalk.lean":"a9db27fc28379b35ca85515d733cc0bc43376592","lean/diagnostics/BFSSOP3A2OriginalComplexCliffordSourceAxisIndependentAudit.lean":"cf71ad136eaad6fbbf6150ed07b70078d27ca92f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C0OriginalRealCliffordGeneratorSquare.lean":"a78dd151dd41726170eed639821460cf0b2882ed","lean/diagnostics/BFSSOP3C0OriginalRealCliffordSquareIndependentAudit.lean":"a7fe68b0fd995d024ba1bf9d66c0c48960ac9ef4"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,expected,actual)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C0OriginalRealCliffordGeneratorSquare.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSOP3C0OriginalRealCliffordSquareIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP3BOriginalSource48QuadraticIsometryBridge",
              "Mathlib.LinearAlgebra.CliffordAlgebra.Basic",
              "Mathlib.LinearAlgebra.Matrix.ToLin"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OP3C0OriginalRealCliffordGeneratorSquare"]
          roots=["orthogonal_source48_clifford_generator_square",
                 "source9Spin_originalClifford_generatorLinearMap",
                 "source9Spin_originalClifford_generatorLinearMap_apply",
                 "source9Spin_originalClifford_generatorLinearMap_square"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==roots
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
              "FCP.BFSSOP3C0OriginalRealCliffordSquare."+r for r in roots]
          for token in ("CliffordAlgebra.ι_sq_scalar",
                        "orthogonal_matrix_preserves_source48Quadratic",
                        "source9SpinOriginalPaired48OrthogonalHom",
                        "Matrix.mulVecLin_apply",
                        "LinearMap.comp_apply",
                        "source48Quadratic","Source48Label","Source48Vector",
                        "CliffordAlgebra source48Quadratic",
                        "spinGroup source9Quadratic"):
              assert token in source+consumer,token
          assert "Source48Vector →ₗ[ℝ] CliffordAlgebra source48Quadratic" in source
          assert "algebraMap ℝ (CliffordAlgebra source48Quadratic)" in source
          for name,body in (("source",source),("consumer",consumer)):
              assert "∑" not in body,(name,"unexpected finite sum")
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe|set_option maxRecDepth|set_option maxHeartbeats)\b",body),(name,"forbidden")
          assert "CliffordAlgebra.lift source48Quadratic" not in source
          assert "source48Quadratic.IsometryEquiv" not in source
          print("OP3C0_EXACT_SOURCE_CLIFFORD_GENERATOR_SQUARE_PINS_PASS",len(pins))
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exactly pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-op3c0/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold build OP3-B1 original parent and OP3-C0 then independent exact source audit
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          evidence="$RUNNER_TEMP/bfss-op3c0"
          root=OAI.MathematicalPhysics.BFSS.Contrib.Kotler
          timeout 3600s lake build \
            "$root.SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe" \
            "$root.OP3BOriginalSource48QuadraticIsometryBridge" \
            "$root.OP3C0OriginalRealCliffordGeneratorSquare" 2>&1 | tee "$evidence/cold-source-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true \
            OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C0OriginalRealCliffordGeneratorSquare.lean 2>&1 | tee "$evidence/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSOP3C0OriginalRealCliffordSquareIndependentAudit.lean 2>&1 | tee "$evidence/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          evidence=Path(os.environ["RUNNER_TEMP"])/"bfss-op3c0"
          roots=[
              "FCP.BFSSOP3C0OriginalRealCliffordSquare.orthogonal_source48_clifford_generator_square",
              "FCP.BFSSOP3C0OriginalRealCliffordSquare.source9Spin_originalClifford_generatorLinearMap",
              "FCP.BFSSOP3C0OriginalRealCliffordSquare.source9Spin_originalClifford_generatorLinearMap_apply",
              "FCP.BFSSOP3C0OriginalRealCliffordSquare.source9Spin_originalClifford_generatorLinearMap_square"]
          allowed={"propext","Classical.choice","Quot.sound"}
          package_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for fn in ("cold-source-build.log","source-axioms.log","independent-consumer.log"):
              log=(evidence/fn).read_text()
              for bad in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
                  assert bad not in log,(fn,bad)
              warnings=[line for line in log.splitlines() if "warning:" in line and not package_warning.fullmatch(line)]
              assert not warnings,(fn,"unexpected warnings",warnings[:12])
              if fn!="cold-source-build.log":
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
                  assert [name for name,_ in reports]==roots,(fn,reports)
                  for name,raw in reports:
                      found={x.strip() for x in raw.split(",") if x.strip()}
                      assert found<=allowed,(fn,name,found)
                  print(fn,"OP3C0_EXACT_FOUR_ROOT_AXIOM_GATE_PASS")
          receipt={"status":"OP3C0_ORIGINAL_REAL_SOURCE_CLIFFORD_SQUARE_ONLY_PASS",
                   "roots":roots,
                   "Clifford_AlgHom_qualified":False,
                   "Spin9_group_action_qualified":False,
                   "complexified_M3I_Fock_action_qualified":False,
                   "star_center_continuity_gauge_spectrum_qualified":False,
                   "OP3B2_IsometryEquiv_qualified":False,
                   "scope":"Original source48Quadratic and original paired Spin9→O48 action: source Clifford generator squares correctly after matrix action. Named source real-linear generator map and its evaluation only. NO Clifford lift or group action."}
          (evidence/"scope-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True))
          print("OP3C0_ORIGINAL_REAL_CLIFFORD_SQUARE_INDEPENDENT_STRICT_PASS")
          PY

      - name: Retain exact original source and diagnostics regardless of outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-op3c0-square-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-op3c0/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
