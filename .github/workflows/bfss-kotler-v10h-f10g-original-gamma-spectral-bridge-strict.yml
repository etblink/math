name: BFSS V10H F10G exact original real gamma spectral bridge strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10GSourceGammaRealSpectralBridgeProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10g-original-gamma-spectral-bridge-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-real-gamma-spectral-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate pinned original gamma, F9 F10E F10F, and exact F10G candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10g"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10g/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF9GeneratorDeterminantMagnitudeProbe.lean")" = '44493c4d9b72de2d2d84725768f8e2572ac91ed4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10FSourceGammaSymmetricPositiveQuadraticProbe.lean")" = '19a1d1fd4cfc89d7c243d28a4c9f1663a3aa3ce3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10GSourceGammaRealSpectralBridgeProbe.lean")" = '76800a61a1b26825896519789ae2aaaef19069e9'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10GSourceGammaRealSpectralBridgeProbe.lean').read_text()
          names=["gammaNineRealLinear_isHermitian","gammaNineRealLinear_realEigenvalues_sum_zero","gammaNineRealLinear_det_eq_realEigenvalues_prod"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
          assert s.count('#print axioms ')==3
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in code, 'unhandled source comment'
          for required in ['import Mathlib.Analysis.Matrix.Spectrum',
                           'Matrix.isHermitian_iff_isSymm',
                           'gammaNineRealLinear_isSymm',
                           'Matrix.IsHermitian.trace_eq_sum_eigenvalues',
                           'gammaNineRealLinear_trace_zero',
                           'Matrix.IsHermitian.det_eq_prod_eigenvalues']:
              assert required in code,required
          assert 'import all ' not in code
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10G_EXACT_REAL_GAMMA_SPECTRAL_API_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild qualified F10F original gamma symmetry and positive quadratic ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10FSourceGammaSymmetricPositiveQuadraticProbe

      - name: Fresh F10G original real gamma spectral bridge warnings-as-errors
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10GSourceGammaRealSpectralBridgeProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10g/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f10g/compiler.log")" -eq 3

      - name: Independently elaborate exact three real Hermitian spectral types and root axiom whitelist
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10G_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10GSourceGammaRealSpectralBridgeProbe
          open FCP.BFSSGamma9
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (v : SpaceIndex → ℝ) :
              (gammaNineRealLinear v).IsHermitian :=
            gammaNineRealLinear_isHermitian v
          noncomputable example (v : SpaceIndex → ℝ) :
              (∑ i : SpinIndex,
                ((gammaNineRealLinear_isHermitian v).eigenvalues i : ℝ)) = 0 :=
            gammaNineRealLinear_realEigenvalues_sum_zero v
          noncomputable example (v : SpaceIndex → ℝ) :
              (gammaNineRealLinear v).det =
                ∏ i : SpinIndex,
                  ((gammaNineRealLinear_isHermitian v).eigenvalues i : ℝ) :=
            gammaNineRealLinear_det_eq_realEigenvalues_prod v
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_isHermitian
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_realEigenvalues_sum_zero
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_det_eq_realEigenvalues_prod
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10G_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10g/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ["RUNNER_TEMP"])/"v10h-f10g"/"declaration-audit.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["gammaNineRealLinear_isHermitian","gammaNineRealLinear_realEigenvalues_sum_zero","gammaNineRealLinear_det_eq_realEigenvalues_prod"]}
          assert len(reports)==3 and {n for n,_ in reports}==expected,reports
          for n,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10G_REAL_SPECTRAL_3_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve SHA/compiler and independent exact spectral declaration audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10g-real-gamma-spectral-bridge-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10g
          if-no-files-found: warn
