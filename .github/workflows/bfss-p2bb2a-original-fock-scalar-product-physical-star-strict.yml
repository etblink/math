name: BFSS P2b-B2a original Fock scalar and product physical-star strict microgate

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB2aOriginalFockScalarProductPhysicalStar.lean
      - lean/diagnostics/BFSSP2bB2aOriginalFockScalarProductIndependentAudit.lean
      - .github/workflows/bfss-p2bb2a-original-fock-scalar-product-physical-star-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-p2bb2a-original-fock-scalar-mul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fock-scalar-product-physical-star:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact B2a source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Freeze original source and independent two-root ancestry
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bfss-p2bb2a"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/tested-commit.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$evidence/toolchain-sha256.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re,json,subprocess
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          packages=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in packages if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pins={"lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean":"65db1f822b86bfbf400957a0aaa94784d6cb7a39","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean":"fad0eab5014aa038ddb0bf8411b0e81c358e7908","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean":"9dc5713dfea7c40d8c9f58088392e144c3c28517","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean":"75a679f2a1435d747e219617feea266b4508c53d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48QuadraticUnitAxesProbe.lean":"de7cf67d2945718a1da98d05a14e1b0d7edcff4a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3BOriginalSource48QuadraticIsometryBridge.lean":"e6a1c6fe0db9292dada850fae64bdd431a0f464d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C0OriginalRealCliffordGeneratorSquare.lean":"a78dd151dd41726170eed639821460cf0b2882ed","lean/diagnostics/BFSSOP3C0OriginalRealCliffordSquareIndependentAudit.lean":"a7fe68b0fd995d024ba1bf9d66c0c48960ac9ef4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52L9E5C1OriginalFockCliffordAlgebraUniversalLiftProbe.lean":"e41b8980284ead53ec5018587bef23c3cc741b59","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3A2OriginalComplexCliffordFockSourceAxisCrosswalk.lean":"a9db27fc28379b35ca85515d733cc0bc43376592","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C2OriginalRealCliffordGroupLaw.lean":"69267168df2edb54d55c4f5101273a2ac436a72d","lean/diagnostics/BFSSOP3C2OriginalRealCliffordGroupLawIndependentAudit.lean":"39f51ec530fd1b75d676da7d40a3fb070d4668f7","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C1OriginalRealCliffordDirectUniversalLift.lean":"5d689fc9537a2f7e9890a332421a501baa3c7532","lean/diagnostics/BFSSOP3C1OriginalRealCliffordUniversalLiftIndependentAudit.lean":"355b2accf8d902730b9e0a6d54346c12757d757f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C3OriginalRealCliffordAlgEquiv.lean":"efe6ec3ca2b4b7203afde3f7f280f6fce97e409d","lean/diagnostics/BFSSOP3C3OriginalRealCliffordIndependentAudit.lean":"8163af16cf5800c00dca9151ba3e992eef32744a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C4OriginalRealCliffordSpinAction.lean":"6d1592a9681718d7a3a48c30168515b7cd0dc3ca","lean/diagnostics/BFSSOP3C4OriginalRealCliffordIndependentAudit.lean":"1bec56e0b8d3e0bf4e57902c814ccd53ad0ee69f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C5AOriginalComplexCliffordBaseChange.lean":"3a28870674b5ce1b53c4a2854b3101f72442a201","lean/diagnostics/BFSSOP3C5AOriginalComplexCliffordIndependentAudit.lean":"3b535e4901bfa96d6144308d1cac86140c143710","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C5BOriginalComplexCliffordSpinAction.lean":"bd0e69e754a8de32ee2face664ae1d71860930ed","lean/diagnostics/BFSSOP3C5BOriginalComplexCliffordIndependentAudit.lean":"bdfd3addde08ffe76a9e2d48a6b56eefc6b07e57","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3IOriginalComplexCliffordFockAlgebraEquivProbe.lean":"754a5f2a13baea90312f6031eb8fa7963dbdf42b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3HOriginalComplexCliffordFockFaithfulProbe.lean":"0b0b1f06f332cc9da738375e4511c28361c09f72","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3DOriginalComplexCliffordFullFockImageProbe.lean":"17ec2266d7854643338c1c238b90fb374b5fe139","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3GOriginalFockContinuousOperatorFinrankProbe.lean":"a2c99c34756eba29472ce0ccd77f85c7db4d05c1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3COriginalCliffordFockSchurAndFiniteProbe.lean":"6fefd9ae344df0b7247feb34c9bec5ea0a27aea0","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6AOriginalFockOperatorSpinAction.lean":"94ba1beb876aaf9af7eaa50b444dc45c9ec9bc69","lean/diagnostics/BFSSOP3C6AOriginalFockOperatorIndependentAudit.lean":"6590095f10f5fa38008f34d231ebfc3150d63f32","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6BOriginalFockDonorGammaCovariance.lean":"7d862a77489a57d9a7d7a3664d7b25908c55bfef","lean/diagnostics/BFSSOP3C6BOriginalFockDonorGammaIndependentAudit.lean":"d2788238f79bd65646ea4b043918f92bd1e6e213","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3AOriginalCliffordFockGeneratorAxisCrosswalk.lean":"b3f032e8d2bc99901b659c323d982a29a926cd47","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52L9E4OriginalFockRealLinearCliffordGeneratorMapProbe.lean":"d1a6194ac68fef46ca99de45beb46d15ccb32c79","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48RealLinearGammaProbe.lean":"a9f446ea7986ca796c2f4b222a5ab710d98590cc","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6COriginalFockActiveGammaCovariance.lean":"2d6f777568b0026737112ff8256e5ed50fc9e6e6","lean/diagnostics/BFSSOP3C6COriginalFockActiveGammaIndependentAudit.lean":"e4299e480783c1f12ba249ce73fd2a69ca2919da","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52L9E5B0OriginalFockRealComplexOperatorScalarBridgeProbe.lean":"a02f767ebf1f569302e27676b8d426850db37af1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48FockGammaSelfAdjointProbe.lean":"98889cb8607ccc64091165fbca585acb898b9ddc","lean/diagnostics/BFSSP2aOriginalFockGammaIndependentAudit.lean":"95d425e47ddd74a47c810095e2086e94b5157800","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bAOriginalFockGammaPhysicalStar.lean":"b8240c9c3060d825e65d126daa1172e65c569e74","lean/diagnostics/BFSSP2bAOriginalFockGammaIndependentAudit.lean":"b3ec33170d02f5333b96b3aa19b255f3a33126d1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB0OriginalFockAdjointAdditiveBridge.lean":"a83e8d9df3d593159a370bd3219c8227edba3316","lean/diagnostics/BFSSP2bB0OriginalFockAdjointAdditiveIndependentAudit.lean":"7e5d13460214cb4f20ae32bac3ed113a60b86b13","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB2aOriginalFockScalarProductPhysicalStar.lean":"e2c0cd73128aa24b0550d6a58785eb68e1c04134","lean/diagnostics/BFSSP2bB2aOriginalFockScalarProductIndependentAudit.lean":"5e1f370759af281759224c438e48a6077815d5e3"}
          assert len(pins)==47
          for path,blob in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==blob,(path,blob,got)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB2aOriginalFockScalarProductPhysicalStar.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP2bB2aOriginalFockScalarProductIndependentAudit.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P2bB0OriginalFockAdjointAdditiveBridge"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==["OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P2bB2aOriginalFockScalarProductPhysicalStar"]
          roots=["originalFock_physicalStar_mul","source9Spin_originalFockOperator_algebraMap_map_star","source9Spin_originalFockOperator_mul_map_star"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==roots
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==["FCP.BFSSP2bB2aOriginalFockScalarProductPhysicalStar."+x for x in roots]
          ancestor=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB0OriginalFockAdjointAdditiveBridge.lean").read_text()
          assert "originalFock_physicalStar_add" in ancestor and "originalFock_spinStarCompat_add" in ancestor
          for term in ("Fermion 2 →L[ℂ] Fermion 2","ContinuousLinearMap.adjoint_comp",
                       "algebraMap_star_comm","originalFock_physicalStar_mul",
                       "source9Spin_originalFockOperator_algebraMap_map_star",
                       "source9Spin_originalFockOperator_mul_map_star",
                       "source9Spin_originalFockOperatorAutomorphismHom",
                       ".commutes","map_mul","congrArg₂"):
              assert term in source,term
          for body,name in ((source,"source"),(consumer,"consumer")):
              assert "set_option autoImplicit false" in body
              assert "maxHeartbeats" not in body and "maxRecDepth" not in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body),(name,"forbidden")
          print("P2BB2A_SOURCE_EXACT_47_PINS_PASS",len(pins))
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean and Mathlib without relaxing pins
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-p2bb2a/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Cold compile exact source B0 ancestor, B2a and independent consumer
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          evidence="$RUNNER_TEMP/bfss-p2bb2a"
          root=OAI.MathematicalPhysics.BFSS.Contrib.Kotler
          timeout 3600s lake build "$root.P2bB0OriginalFockAdjointAdditiveBridge" "$root.P2bB2aOriginalFockScalarProductPhysicalStar" 2>&1 | tee "$evidence/cold-source-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB2aOriginalFockScalarProductPhysicalStar.lean 2>&1 | tee "$evidence/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP2bB2aOriginalFockScalarProductIndependentAudit.lean 2>&1 | tee "$evidence/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          e=Path(os.environ["RUNNER_TEMP"])/"bfss-p2bb2a"
          roots=["FCP.BFSSP2bB2aOriginalFockScalarProductPhysicalStar.originalFock_physicalStar_mul","FCP.BFSSP2bB2aOriginalFockScalarProductPhysicalStar.source9Spin_originalFockOperator_algebraMap_map_star","FCP.BFSSP2bB2aOriginalFockScalarProductPhysicalStar.source9Spin_originalFockOperator_mul_map_star"]
          allowed={"propext","Classical.choice","Quot.sound"}
          pkg_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for fn in ("cold-source-build.log","source-axioms.log","independent-consumer.log"):
              data=(e/fn).read_text()
              for forbidden in ("error:","sorryAx","Lean.ofReduceBool","unknownIdentifier"):
                  assert forbidden not in data,(fn,forbidden)
              warnings=[line for line in data.splitlines() if "warning:" in line and not pkg_warning.fullmatch(line)]
              assert not warnings,(fn,"unexpected warnings",warnings[:10])
              if fn!="cold-source-build.log":
                  matches=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",data)
                  assert [z[0] for z in matches]==roots,(fn,matches)
                  for name,raw in matches:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(fn,name,raw)
          (e/"scope-receipt.json").write_text(json.dumps({
              "status":"P2BB2A_ORIGINAL_FOCK_SCALAR_PRODUCT_STAR_ONLY_PASS",
              "accepted_roots":roots,
              "exact_original_Fock_Hilbert_adjoint_reverse_product":True,
              "scalar_algebraMap_physical_star_compatibility":True,
              "conditional_original_Fock_Spin9_product_star_compatibility":True,
              "P2bB1_qualified_only_by_independent_prior_run":True,
              "P2bB2_full_Fock_star_qualified":False,
              "spectral_claims":False
          },indent=2,sort_keys=True))
          print("P2BB2A_ORIGINAL_FOCK_SCALAR_PRODUCT_INDEPENDENT_STRICT_PASS")
          PY

      - name: Preserve diagnostics even on error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p2bb2a-original-scalar-product-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-p2bb2a/
          if-no-files-found: warn
          retention-days: 14
