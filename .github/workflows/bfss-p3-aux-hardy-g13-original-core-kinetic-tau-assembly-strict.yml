    - name: Cold original core kinetic tau source and twelve native controls
      shell: bash
      timeout-minutes: 75
      run: |
        set -euo pipefail
        source "$HOME/.elan/env"
        cd lean
        mod="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG13OriginalCoreKineticTauAssembly"
        src="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG13OriginalCoreKineticTauAssembly.lean"
        obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3AuxHardyG13OriginalCoreKineticTauAssembly.olean"
        rm -rf .lake/build/lib/lean/OAI .lake/build/ir/OAI
        timeout 3600s lake build "$mod" OAI.MathematicalPhysics.BFSS.Contrib.Kotler.OperatorDependencies.SU2BFSSG4JExactGaugeDataAssemblyProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3AuxHardyG9ComplexMatrixEntryDerivative 2>&1 | tee ../bfss-aux-hardy-g13-evidence/build.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$src" 2>&1 | tee ../bfss-aux-hardy-g13-evidence/source.log
        timeout 500s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3AuxHardyG13OriginalCoreKineticTauAssemblyIndependentConsumer.lean 2>&1 | tee ../bfss-aux-hardy-g13-evidence/consumer.log
        python3 - <<'PY'
        from pathlib import Path
        import re,json
