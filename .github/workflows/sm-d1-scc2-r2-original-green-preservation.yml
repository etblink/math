name: SM-D1-SCC2 R2 original strict GREEN independent evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/sm-d1-scc2-r2-original-green-preservation.yml
permissions:
  actions: read
  contents: write
jobs:
  archive-original-scc2-r2-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical unified research and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact R2 tested source consumer Mathlib and accepted gates
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse 78259610fedf009b178041dd1ce79f47df54a709:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC2FamilyMinimalWitnesses.lean)" = 1f3aecd60e2fc9e73da88a8b2e9bc4c2a722ac2a
          test "$(git rev-parse 78259610fedf009b178041dd1ce79f47df54a709:lean/diagnostics/SMD1SCC2FamilyMinimalIndependentConsumer.lean)" = 24bcb7c5e2f14b84814ed8f954834a05ea5bfed5
          test "$(git rev-parse 78259610fedf009b178041dd1ce79f47df54a709:.github/workflows/sm-d1-scc2-family-witness-lean-strict.yml)" = 7186bbd6868a89e413cbd7be8fa715d4617ab49f
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC2FamilyMinimalWitnesses.lean)" = 1f3aecd60e2fc9e73da88a8b2e9bc4c2a722ac2a
          test "$(git rev-parse HEAD:lean/diagnostics/SMD1SCC2FamilyMinimalIndependentConsumer.lean)" = 24bcb7c5e2f14b84814ed8f954834a05ea5bfed5
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMD1SCC1FiniteWitnessSeparation.lean)" = b78f942e12874c1bb690ef2d6d6ef2a800031245
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/StandardModel/Contrib/Kotler/SMY0OneFamilyAnomalyLedger.lean)" = 481a984b5ba7d2d7df41297d162ab1d608646d6e
          test "$(git rev-parse HEAD:research/standard-model/data/SM_D0_EMPIRICAL_CONSTRAINTS_ASOF_2026_11_18.json)" = 1d391ba994ee23f03c4423b45fbb15e7e42c86f1
          test "$(git rev-parse HEAD:research/standard-model/tools/smd1_scc0.py)" = 95569dffd88af133df3dd56d23e1f61ca8c4a207
          test "$(git rev-parse HEAD:research/standard-model/evidence/SMD1_SCC1_R3_44403273333_ORIGINAL_STRICT_GREEN_evidence.zip)" = faf10f95ec2973ad5040be3f6f2ac362dcc1ca10
          python3 - <<'PY'
          import json
          from pathlib import Path
          st=json.loads(Path('research/standard-model/SM_GATE_STATE.json').read_text())
          bf=json.loads(Path('BFSS_GATE_STATE.json').read_text())
          assert st['last_qualified']['gate']=='SM-Y0'
          assert st['last_qualified_empirical']['gate']=='SM-D0'
          assert st['last_qualified_methodology']['gate']=='SM-D1-SCC0'
          assert st['last_qualified_formal_methodology']['gate']=='SM-D1-SCC1'
          assert st['last_qualified_formal_methodology']['independent_preservation_run']==44404925679
          assert any(x['id']=='SM-D1' and x['status']=='PROSPECTIVE_UNSTAGED' for x in st['upcoming'])
          assert len(bf['accepted_anchors'])==27
          assert (bf['active']['gate'],bf['active']['status'],bf['active']['qualification'])==('P3-M4-W0C2B2','BLOCKED',False)
          assert Path('research/standard-model/evidence/SMD1_SCC2_R1_44406382070_ORIGINAL_NATIVE_RED_evidence_manifest.json').exists()
          assert not list(Path('research/standard-model/evidence').glob('SMD1_SCC2_R2_44407657796_*'))
          print('SM_D1_SCC2_R2_FROZEN_ORIGINAL_SOURCES_SCC1_SMY0_SMD0_SCC0_27_BFSS_ANCHORS_PREFLIGHT_PASS')
          PY
      - name: Independently verify original R2 run job ZIP and all source consumer axiom reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,re,urllib.request,urllib.error,zipfile
          from pathlib import Path
          root='https://api.github.com/repos/etblink/math'
          run=44407657796
          job=135167078519
          artifact=14476606748
          tested='78259610fedf009b178041dd1ce79f47df54a709'
          size=2450
          expected='568b7b02056b145824a095b9c2f12ce149c25919b49d93b586c7187766d71cee'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get_json(path):
              req=urllib.request.Request(root+path,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          rr=get_json(f'/actions/runs/{run}')
          jj=get_json(f'/actions/jobs/{job}')
          aa=get_json(f'/actions/artifacts/{artifact}')
          assert (rr['head_sha'],rr['status'],rr['conclusion'],rr['run_attempt'])==(tested,'completed','success',1)
          assert (jj['id'],jj['run_id'],jj['conclusion'])==(job,run,'success')
          for name in ('Checkout original unified','Verify source pins',
                       'Restore original pinned','Cold source SCC1',
                       'Preserve exact native source'):
              assert any(s['name'].startswith(name) and s['conclusion']=='success' for s in jj['steps']),name
          assert (aa['id'],aa['size_in_bytes'],aa['digest'])==(artifact,size,'sha256:'+expected)
          assert (aa['workflow_run']['id'],aa['workflow_run']['head_sha'])==(run,tested)
          assert aa['name']=='sm-d1-scc2-original-family-minimal-lean-source-consumer'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(path):
              try:
                  res=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(root+path,headers=headers),timeout=60)
              except urllib.error.HTTPError as err:
                  assert err.code==302,err
                  target=err.headers['Location']
                  assert target.startswith('https://')
                  with urllib.request.urlopen(target,timeout=90) as response:return response.read()
              else:
                  with res:return res.read()
          raw=download(f'/actions/artifacts/{artifact}/zip')
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==expected
          roots=['uniformDeletionMinimal_iff_minimal','uniformDeletionMinimal_is_uniform',
            'equivalent_pair_blocks_uniform','empty_witnesses_blocked','family_minimal_implies_uniform']
          consumers=['two_witnesses_uniform_consumer','removing_true_blocks_uniform_consumer',
            'removing_false_blocks_uniform_consumer','both_witnesses_necessary_consumer',
            'two_witnesses_globally_minimal_consumer']
          pattern=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          pkgwarn=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          allowed={'propext','Classical.choice','Quot.sound'}
          def audit(text,expected_names):
              assert 'sorryAx' not in text and 'error:' not in text
              extra=[line for line in text.splitlines() if 'warning:' in line and not pkgwarn.fullmatch(line)]
              assert not extra,extra
              found=pattern.findall(text)
              assert len(found)==len(expected_names),(found,expected_names)
              assert [name.rsplit('.',1)[-1] for name,_ in found]==expected_names
              for _,xs in found:
                  assert {ax.strip() for ax in xs.split(',') if ax.strip()}<=allowed,xs
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              required={'preflight.log','tested-commit.txt','cold-source.log','source-axioms.log','consumer.log','auditor.log'}
              assert required<=names,names
              assert z.read('tested-commit.txt').decode().strip()==tested
              assert 'SM_D1_SCC2_5_SOURCE_5_CONSUMER_2_EXAMPLES_PINNED_MATHLIB_SM_Y0_SM_D0_SCC0_SCC1_27_BFSS_ANCHORS_PREFLIGHT_PASS' in z.read('preflight.log').decode()
              cold=z.read('cold-source.log').decode()
              assert 'Build completed successfully (3093 jobs)' in cold and 'error:' not in cold and 'sorryAx' not in cold
              audit(z.read('source-axioms.log').decode(),roots)
              audit(z.read('consumer.log').decode(),consumers)
              assert 'SM_D1_SCC2_5_NATIVE_SOURCE_5_INDEPENDENT_CONSUMER_2_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN' in z.read('auditor.log').decode()
              members=[{'name':name,'size':len(z.read(name)),'sha256':hashlib.sha256(z.read(name)).hexdigest(),'crc32':format(z.getinfo(name).CRC,'08x')} for name in sorted(names)]
          complete=download(f'/actions/jobs/{job}/logs')
          assert len(complete)>35000,len(complete)
          assert b'SM_D1_SCC2_5_NATIVE_SOURCE_5_INDEPENDENT_CONSUMER_2_EXAMPLES_6_NEGATIVE_AUDITS_STRICT_GREEN' in complete
          assert b'SM_D1_SCC2_5_SOURCE_5_CONSUMER_2_EXAMPLES_PINNED_MATHLIB_SM_Y0_SM_D0_SCC0_SCC1_27_BFSS_ANCHORS_PREFLIGHT_PASS' in complete
          out=Path('research/standard-model/evidence')
          out.mkdir(parents=True,exist_ok=True)
          zp=out/'SMD1_SCC2_R2_44407657796_ORIGINAL_STRICT_GREEN_evidence.zip'
          lp=out/'SMD1_SCC2_R2_44407657796_ORIGINAL_complete_job.log'
          mp=out/'SMD1_SCC2_R2_44407657796_ORIGINAL_STRICT_GREEN_evidence_manifest.json'
          for p in (zp,lp,mp):assert not p.exists(),p
          zp.write_bytes(raw)
          lp.write_bytes(complete)
          manifest={
              'gate':'SM-D1-SCC2','attempt':'R2',
              'status':'NATIVE_SOURCE_AND_INDEPENDENT_CONSUMER_STRICT_GREEN_MATH_ONLY',
              'original_run':run,'original_job':job,'original_artifact':artifact,'tested_commit':tested,
              'original_zip':{'path':str(zp),'size':size,'sha256':expected,'members':members},
              'complete_job_log':{'path':str(lp),'size':len(complete),'sha256':hashlib.sha256(complete).hexdigest()},
              'source_blob':'1f3aecd60e2fc9e73da88a8b2e9bc4c2a722ac2a',
              'independent_consumer_blob':'24bcb7c5e2f14b84814ed8f954834a05ea5bfed5',
              'original_workflow_blob':'7186bbd6868a89e413cbd7be8fa715d4617ab49f',
              'pinned_mathlib_commit':'d13f23b723b8a846827a245b89c10fc7d3f11612',
              'pinned_mathlib_finset_blob':'fce1b985bf079d153d2774d0c7c370b3048589ab',
              'source_axiom_reports':5,'consumer_axiom_reports':5,
              'consumer_examples':2,'negative_auditor_controls':6,'cold_build_jobs':3093,
              'allowed_axioms':sorted(allowed),
              'prior_red':{'run':44406382070,'archived_by':44407777276,
                'cause':'Unknown Finset.not_mem_empty; unqualified empty_witnesses_blocked included sorryAx'},
              'BFSS_original_accepted_anchors_unchanged':27,
              'scientific_ceiling':'Finite total deterministic Boolean cross-family witness minimality and toy two-witness example; no likelihood, optimal cardinality, physical SM or BFSS model prediction, continuous parameter theorem, or NFC SCC transfer.'
          }
          mp.write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('SM_D1_SCC2_R2_ORIGINAL_STRICT_GREEN_ZIP_JOB_SHA_CRC_SOURCE_CONSUMER_AX1_INDEPENDENTLY_VERIFIED')
          PY
      - name: Commit exact original SCC2 R2 GREEN ZIP job and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/standard-model/evidence/SMD1_SCC2_R2_44407657796_ORIGINAL_*
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'SM-D1-SCC2 R2 preserve original native strict GREEN with independent checksums'
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
