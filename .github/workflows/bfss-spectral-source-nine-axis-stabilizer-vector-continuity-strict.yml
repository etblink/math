name: BFSS spectral source nine axis-stabilizer restricted vector-projection continuity strict gate

on:
  push:
    branches: [research/bfss-original-gamma-faithfulness-20261107]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralSourceNineAxisStabilizerVectorContinuity.lean
      - lean/diagnostics/BFSSSpectralSourceNineAxisStabilizerVectorContinuityIndependentAudit.lean
      - contributions/bfss-kotler/BFSS_SPECTRAL_SOURCE_NINE_AXIS_STABILIZER_VECTOR_CONTINUITY_MANIFEST_V1.json
      - contributions/bfss-kotler/tools/qualify_spectral_source_nine_axis_stabilizer_vector_continuity.py
      - contributions/bfss-kotler/tools/test_spectral_source_nine_axis_stabilizer_vector_continuity.py
      - .github/workflows/bfss-spectral-source-nine-axis-stabilizer-vector-continuity-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-nine-axis-stabilizer-vector-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retain proposed inputs and check exact source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spectral-source-nine-axis-stabilizer-vector-continuity"
          git rev-parse HEAD > "$RUNNER_TEMP/spectral-source-nine-axis-stabilizer-vector-continuity/tested-sha.txt"
          tar -czf "$RUNNER_TEMP/spectral-source-nine-axis-stabilizer-vector-continuity/proposed-inputs.tar.gz" \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SpectralSourceNineAxisStabilizerVectorContinuity.lean \
            lean/diagnostics/BFSSSpectralSourceNineAxisStabilizerVectorContinuityIndependentAudit.lean \
            contributions/bfss-kotler/BFSS_SPECTRAL_SOURCE_NINE_AXIS_STABILIZER_VECTOR_CONTINUITY_MANIFEST_V1.json \
            contributions/bfss-kotler/tools/qualify_spectral_source_nine_axis_stabilizer_vector_continuity.py \
            contributions/bfss-kotler/tools/test_spectral_source_nine_axis_stabilizer_vector_continuity.py \
            .github/workflows/bfss-spectral-source-nine-axis-stabilizer-vector-continuity-strict.yml \
            lean/lean-toolchain lean/lake-manifest.json lean/lakefile.lean
          python3 contributions/bfss-kotler/tools/qualify_spectral_source_nine_axis_stabilizer_vector_continuity.py preflight
          python3 contributions/bfss-kotler/tools/test_spectral_source_nine_axis_stabilizer_vector_continuity.py
      - name: Restore pinned Lean and Mathlib environment
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
      - name: Cold rebuild exact ancestors then strict source and independent consumer
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_spectral_source_nine_axis_stabilizer_vector_continuity.py run \
            --evidence "$RUNNER_TEMP/spectral-source-nine-axis-stabilizer-vector-continuity"
      - name: Retain complete compiler and exact input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectral-source-nine-axis-stabilizer-vector-continuity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spectral-source-nine-axis-stabilizer-vector-continuity
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
