name: BFSS direct finite fixture replay

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'research/computational/python-first-20261124/bfss-physical-implication/replay_direct_fixture.py'
      - '.github/workflows/bfss-direct-fixture-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  rank-one-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen inputs and runtime
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/bfss-direct-fixture"
          mkdir -p "$E"
          git rev-parse HEAD | tee "$E/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8bbbaef5ea0c5d03c49369f16aa714cb26173f6d HEAD
          python3 - <<'PY' | tee "$E/preflight.log"
          import subprocess
          pins = {
            "research/computational/python-first-20261124/bfss-seed-transport/source_seed_integer.npz": "91c57e1f3f1e856a51bbc11dbb5a01ee9099ecc0",
            "research/computational/python-first-20261124/bfss-seed-transport/independent_integer_recheck.py": "7cc5e660fb40b2d96c5462a930f7ac266a362fe0",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMSYPythonGammaRows.lean": "818ff344566c2f2552a30591d92fb7f718efe866",
            "research/computational/python-first-20261124/bfss-mixed104/jet_001.json": "89a8c71ccf96f20ed9f6c378341d826135b47afd",
          }
          for path, expected in pins.items():
              got = subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got == expected,(path,got,expected)
              print(path,got)
          print("BFSS_DIRECT_FIXTURE_FROZEN_INPUT_PASS")
          PY
          git ls-tree HEAD -- 'research/computational/python-first-20261124/bfss-physical-implication/replay_direct_fixture.py' '.github/workflows/bfss-direct-fixture-replay.yml' | tee "$E/tested-blobs.txt"
          python3 -m venv "$RUNNER_TEMP/bfss-venv"
          "$RUNNER_TEMP/bfss-venv/bin/python" -m pip install --disable-pip-version-check numpy==2.2.6
          "$RUNNER_TEMP/bfss-venv/bin/python" -c 'import sys,numpy;print(sys.version,numpy.__version__)' | tee "$E/runtime.txt"
      - name: Execute direct fixture
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/bfss-direct-fixture"
          "$RUNNER_TEMP/bfss-venv/bin/python" -u 'research/computational/python-first-20261124/bfss-physical-implication/replay_direct_fixture.py' 001 --output "$E/results.json" 2>&1 | tee "$E/replay.log"
          grep -Fx 'BFSS_DIRECT_FIXTURE_SELFTEST_PASS' "$E/replay.log"
          grep -Fx 'BFSS_DIRECT_FIXTURE_EXACT_PASS' "$E/replay.log"
          python3 - "$E/results.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["comparisons"]=={"tau":152,"beta":152,"nu":456,"t":456,"v":152}
          assert r["errors"]==[] and r["Euler_exact"]
          print("BFSS_DIRECT_FIXTURE_SCOPE_PASS")
          PY
      - name: Preserve original computational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-direct-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-direct-fixture/
          retention-days: 30
          if-no-files-found: warn
