name: BFSS IBI-G0C abstract SO3 circle angle strict

'on':
  push:
    branches: [research/bfss-incidence-unified-20261114]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Angle.lean
      - lean/diagnostics/BFSSIBIG0CSO3AngleIndependentConsumer.lean
      - .github/workflows/bfss-ibi-g0c-so3-angle-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-ibi-g0c-so3-angle0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abstract-angle-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact incidence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact pure-math proof and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-ibi-g0c-so3-angle0"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-angle0/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Angle.lean":"2bc7521a8f417ddd8e0e74370d3d014ddb200e2a",
            "lean/diagnostics/BFSSIBIG0CSO3AngleIndependentConsumer.lean":"9f98826ebf5321ebac3ecc66383f37e5361d4308",
            "lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5",
            "lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CXImage.lean":"999a0c66110431d1c92aaaf6ca37b21f253a9501",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CZImage.lean":"e4623ef2e7ce825575a73f96e087bee17c4872ab"
          }
          for p,sha in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()
              assert got==sha,(p,sha,got)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in pkgs if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Angle.lean").read_text()
          c=Path("lean/diagnostics/BFSSIBIG0CSO3AngleIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==["Mathlib"]
          assert re.findall(r"(?m)^import (\S+)$",c)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Angle"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==["unitCircle_exists_angle"]
          assert len(re.findall(r"(?m)^example\b",c))==5
          for t in [s,c]:
              assert "set_option autoImplicit false" in t
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",t)
              assert "set_option maxHeartbeats 0" not in t
          print("BFSS_IBI_G0C_SO3_ANGLE0_PREFLIGHT_PASS")
          PY
      - name: Restore frozen Lean and Mathlib cache
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold abstract source and independent consumer strict audit
        shell: bash
        timeout-minutes: 43
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          module="OAI.MathematicalPhysics.BFSS.Contrib.Kotler.IBIG0CSO3Angle"
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Angle.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/IBIG0CSO3Angle.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 1650s lake build "$module" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-angle0/cold-build.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-angle0/source-axioms.log"
          timeout 420s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSIBIG0CSO3AngleIndependentConsumer.lean 2>&1 |
            tee "$RUNNER_TEMP/bfss-ibi-g0c-so3-angle0/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-ibi-g0c-so3-angle0"
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              t=(root/name).read_text()
              assert "error:" not in t and "sorryAx" not in t,(name,t[-4500:])
              allow=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
              bad=[x for x in t.splitlines() if "warning:" in x and not allow.fullmatch(x)]
              assert not bad,(name,bad[:10])
          t=(root/"source-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
          assert [name for name,_ in reports]==["FCP.BFSSIBIG0CSO3Angle.unitCircle_exists_angle"],reports
          allowed={"propext","Classical.choice","Quot.sound"}
          for name,raw in reports:
              assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,raw)
          print("BFSS_IBI_G0C_SO3_ANGLE0_SOURCE_AND_CONSUMER_STRICT_GREEN")
          PY
      - name: Preserve strict abstract SO3 angle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-ibi-g0c-so3-angle0-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-ibi-g0c-so3-angle0/
          if-no-files-found: warn
          retention-days: 14
