name: BFSS P3-OP1B original Fock trace columns strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1BOriginalFockTraceColumns.lean
      - lean/diagnostics/BFSSP3OP1BOriginalFockTraceColumnsIndependentConsumer.lean
      - .github/workflows/bfss-p3-op1b-original-fock-trace-columns-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-p3-op1b-original-trace-columns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pinned original Fock source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze 57 OP1A/T1 pins and two OP1B source-consumer blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-p3-op1b"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-p3-op1b/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          pins={"lean/OAI/MathematicalPhysics/BFSS/Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean":"65db1f822b86bfbf400957a0aaa94784d6cb7a39","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean":"fad0eab5014aa038ddb0bf8411b0e81c358e7908","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean":"9dc5713dfea7c40d8c9f58088392e144c3c28517","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean":"75a679f2a1435d747e219617feea266b4508c53d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48QuadraticUnitAxesProbe.lean":"de7cf67d2945718a1da98d05a14e1b0d7edcff4a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3BOriginalSource48QuadraticIsometryBridge.lean":"e6a1c6fe0db9292dada850fae64bdd431a0f464d","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C0OriginalRealCliffordGeneratorSquare.lean":"a78dd151dd41726170eed639821460cf0b2882ed","lean/diagnostics/BFSSOP3C0OriginalRealCliffordSquareIndependentAudit.lean":"a7fe68b0fd995d024ba1bf9d66c0c48960ac9ef4","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52L9E5C1OriginalFockCliffordAlgebraUniversalLiftProbe.lean":"e41b8980284ead53ec5018587bef23c3cc741b59","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3A2OriginalComplexCliffordFockSourceAxisCrosswalk.lean":"a9db27fc28379b35ca85515d733cc0bc43376592","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C2OriginalRealCliffordGroupLaw.lean":"69267168df2edb54d55c4f5101273a2ac436a72d","lean/diagnostics/BFSSOP3C2OriginalRealCliffordGroupLawIndependentAudit.lean":"39f51ec530fd1b75d676da7d40a3fb070d4668f7","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C1OriginalRealCliffordDirectUniversalLift.lean":"5d689fc9537a2f7e9890a332421a501baa3c7532","lean/diagnostics/BFSSOP3C1OriginalRealCliffordUniversalLiftIndependentAudit.lean":"355b2accf8d902730b9e0a6d54346c12757d757f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C3OriginalRealCliffordAlgEquiv.lean":"efe6ec3ca2b4b7203afde3f7f280f6fce97e409d","lean/diagnostics/BFSSOP3C3OriginalRealCliffordIndependentAudit.lean":"8163af16cf5800c00dca9151ba3e992eef32744a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C4OriginalRealCliffordSpinAction.lean":"6d1592a9681718d7a3a48c30168515b7cd0dc3ca","lean/diagnostics/BFSSOP3C4OriginalRealCliffordIndependentAudit.lean":"1bec56e0b8d3e0bf4e57902c814ccd53ad0ee69f","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C5AOriginalComplexCliffordBaseChange.lean":"3a28870674b5ce1b53c4a2854b3101f72442a201","lean/diagnostics/BFSSOP3C5AOriginalComplexCliffordIndependentAudit.lean":"3b535e4901bfa96d6144308d1cac86140c143710","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C5BOriginalComplexCliffordSpinAction.lean":"bd0e69e754a8de32ee2face664ae1d71860930ed","lean/diagnostics/BFSSOP3C5BOriginalComplexCliffordIndependentAudit.lean":"bdfd3addde08ffe76a9e2d48a6b56eefc6b07e57","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3IOriginalComplexCliffordFockAlgebraEquivProbe.lean":"754a5f2a13baea90312f6031eb8fa7963dbdf42b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3HOriginalComplexCliffordFockFaithfulProbe.lean":"0b0b1f06f332cc9da738375e4511c28361c09f72","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3DOriginalComplexCliffordFullFockImageProbe.lean":"17ec2266d7854643338c1c238b90fb374b5fe139","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3GOriginalFockContinuousOperatorFinrankProbe.lean":"a2c99c34756eba29472ce0ccd77f85c7db4d05c1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3COriginalCliffordFockSchurAndFiniteProbe.lean":"6fefd9ae344df0b7247feb34c9bec5ea0a27aea0","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6AOriginalFockOperatorSpinAction.lean":"94ba1beb876aaf9af7eaa50b444dc45c9ec9bc69","lean/diagnostics/BFSSOP3C6AOriginalFockOperatorIndependentAudit.lean":"6590095f10f5fa38008f34d231ebfc3150d63f32","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6BOriginalFockDonorGammaCovariance.lean":"7d862a77489a57d9a7d7a3664d7b25908c55bfef","lean/diagnostics/BFSSOP3C6BOriginalFockDonorGammaIndependentAudit.lean":"d2788238f79bd65646ea4b043918f92bd1e6e213","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3AOriginalCliffordFockGeneratorAxisCrosswalk.lean":"b3f032e8d2bc99901b659c323d982a29a926cd47","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52L9E4OriginalFockRealLinearCliffordGeneratorMapProbe.lean":"d1a6194ac68fef46ca99de45beb46d15ccb32c79","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48RealLinearGammaProbe.lean":"a9f446ea7986ca796c2f4b222a5ab710d98590cc","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP3C6COriginalFockActiveGammaCovariance.lean":"2d6f777568b0026737112ff8256e5ed50fc9e6e6","lean/diagnostics/BFSSOP3C6COriginalFockActiveGammaIndependentAudit.lean":"e4299e480783c1f12ba249ce73fd2a69ca2919da","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48NormalizedFockGammaProbe.lean":"7abc03723b3111e4a03389b722054e50d6a9bf30","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52L9E5B0OriginalFockRealComplexOperatorScalarBridgeProbe.lean":"a02f767ebf1f569302e27676b8d426850db37af1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSSource48FockGammaSelfAdjointProbe.lean":"98889cb8607ccc64091165fbca585acb898b9ddc","lean/diagnostics/BFSSP2aOriginalFockGammaIndependentAudit.lean":"95d425e47ddd74a47c810095e2086e94b5157800","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bAOriginalFockGammaPhysicalStar.lean":"b8240c9c3060d825e65d126daa1172e65c569e74","lean/diagnostics/BFSSP2bAOriginalFockGammaIndependentAudit.lean":"b3ec33170d02f5333b96b3aa19b255f3a33126d1","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB1OriginalFockComplexifiedGammaPhysicalStar.lean":"b6187c20366b31baca423979cb42b4a4ad707d5e","lean/diagnostics/BFSSP2bB1OriginalFockComplexifiedGammaIndependentAudit.lean":"d8842d9a719462ae7eec43bba5690a2ffd08ef48","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB0OriginalFockAdjointAdditiveBridge.lean":"a83e8d9df3d593159a370bd3219c8227edba3316","lean/diagnostics/BFSSP2bB0OriginalFockAdjointAdditiveIndependentAudit.lean":"7e5d13460214cb4f20ae32bac3ed113a60b86b13","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB2aOriginalFockScalarProductPhysicalStar.lean":"e2c0cd73128aa24b0550d6a58785eb68e1c04134","lean/diagnostics/BFSSP2bB2aOriginalFockScalarProductIndependentAudit.lean":"5e1f370759af281759224c438e48a6077815d5e3","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB2OriginalFockGlobalPhysicalStar.lean":"4e612210d9ca04f5877a87de54bc6bf1a350e602","lean/diagnostics/BFSSP2bB2OriginalFockGlobalPhysicalStarIndependentAudit.lean":"84a9fe1213105893043d378de43759898bb97e93","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P2bB3OriginalFockStarAutomorphismAction.lean":"b50ef04695587b267ad8519074b1293f98828749","lean/diagnostics/BFSSP2bB3OriginalFockStarAutomorphismIndependentAudit.lean":"cf10db6ffb01c8390e7f4833e1fd4e36bc9df7b7","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/T1OriginalFockTraceInvariance.lean":"3be6c9a6f2898484df66690f94fdfa1877660897","lean/diagnostics/BFSST1OriginalFockTraceIndependentAudit.lean":"e3ce4de9987a07a7405c29ece850b9b203eeade7","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1AOriginalFockTracePairing.lean":"b79f4230dc03670f4b3fffc425a0cc283688a7c6","lean/diagnostics/BFSSP3OP1AOriginalFockTracePairingIndependentConsumer.lean":"f998b1cfe6c43a987f0ecec3eabe64303695d713","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1BOriginalFockTraceColumns.lean":"e47e732a5898fea1004d49de41fd59e4d240180a","lean/diagnostics/BFSSP3OP1BOriginalFockTraceColumnsIndependentConsumer.lean":"4bd43459a3323ef2ce51289cd1df2d8b8fee6aa1"}
          assert len(pins)==59,len(pins)
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,(path,expected,got)
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          pkgs=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in pkgs if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1BOriginalFockTraceColumns.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3OP1BOriginalFockTraceColumnsIndependentConsumer.lean").read_text()
          assert re.findall(r"(?m)^import (\S+)$",source)==[
              "Mathlib.Analysis.InnerProductSpace.Trace",
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3OP1AOriginalFockTracePairing"]
          assert re.findall(r"(?m)^import (\S+)$",consumer)==[
              "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3OP1BOriginalFockTraceColumns"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==[
              "originalFockTrace_eq_sum_inner",
              "originalFockTrace_star_mul_eq_sum_inner"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
              "FCP.BFSSP3OP1BOriginalFockTraceColumns.originalFockTrace_eq_sum_inner",
              "FCP.BFSSP3OP1BOriginalFockTraceColumns.originalFockTrace_star_mul_eq_sum_inner"]
          assert len(re.findall(r"(?m)^example\b",consumer))==2
          for token in ("LinearMap.trace_eq_sum_inner","originalFockTrace_apply",
                        "originalFockEndAlgEquiv.symm",
                        "ContinuousLinearMap.star_eq_adjoint",
                        "ContinuousLinearMap.adjoint_inner_right"):
              assert token in source,token
          assert "originalFockTracePairing T T" in consumer
          for body in (source,consumer):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",body)
              assert "maxHeartbeats" not in body and "maxRecDepth" not in body
          print("BFSS_P3_OP1B_ORIGINAL_FOCK_59_BLOB_PREFLIGHT_PASS")
          PY
      - name: Restore exact pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 2100s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-p3-op1b/mathlib-cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold compile OP1B source and independent consumer
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          evidence="$RUNNER_TEMP/bfss-p3-op1b"
          source_file="OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1BOriginalFockTraceColumns.lean"
          obj=".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3OP1BOriginalFockTraceColumns.olean"
          rm -f "$obj" "${obj%.olean}.ilean" "${obj%.olean}.olean.private" "${obj%.olean}.olean.server"
          timeout 3600s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3OP1BOriginalFockTraceColumns 2>&1 | tee "$evidence/cold-build.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true -o "$obj" "$source_file" 2>&1 | tee "$evidence/source-axioms.log"
          timeout 450s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3OP1BOriginalFockTraceColumnsIndependentConsumer.lean 2>&1 | tee "$evidence/independent-consumer.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-p3-op1b"
          expected=[
              "FCP.BFSSP3OP1BOriginalFockTraceColumns.originalFockTrace_eq_sum_inner",
              "FCP.BFSSP3OP1BOriginalFockTraceColumns.originalFockTrace_star_mul_eq_sum_inner"]
          allowed={"propext","Classical.choice","Quot.sound"}
          pkg_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          for name in ("cold-build.log","source-axioms.log","independent-consumer.log"):
              s=(root/name).read_text()
              for forbidden in ("error:","sorryAx","unknownIdentifier"):
                  assert forbidden not in s,(name,forbidden)
              warnings=[line for line in s.splitlines()
                        if "warning:" in line and not pkg_warning.fullmatch(line)]
              assert not warnings,(name,warnings[:8])
              if name!="cold-build.log":
                  reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
                  assert [x for x,_ in reports]==expected,(name,reports,expected)
                  for q,raw in reports:
                      assert {x.strip() for x in raw.split(",") if x.strip()}<=allowed,(name,q,raw)
          (root/"scope-receipt.json").write_text(json.dumps({
              "status":"OP1B_ORIGINAL_FOCK_TRACE_COLUMN_STRICT_GREEN",
              "original_Fermion2_trace_basis_formula":True,
              "original_Fermion2_adjoint_trace_quadratic_basis_formula":True,
              "hilbert_schmidt_positive_norm_formalized":False,
              "source_group_action_continuity":False,
              "physical_gauge_operator_compatibility":False,
              "physical_L2_column_hamiltonian_identification":False,
              "spectral_claims":False
          },sort_keys=True,indent=2))
          print("BFSS_P3_OP1B_ORIGINAL_TRACE_COLUMN_STRICT_GREEN")
          PY
      - name: Preserve OP1B evidence whether green or red
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-p3-op1b-original-trace-columns-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-p3-op1b/
          if-no-files-found: warn
          retention-days: 14
