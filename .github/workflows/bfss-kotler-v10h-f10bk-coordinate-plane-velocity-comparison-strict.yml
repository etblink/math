name: BFSS V10H F10BK exact canonical source-plane gamma velocity comparison strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BKCoordinatePlaneVelocityComparison.lean
      - lean/diagnostics/FCP_K1D18V10HF10BKIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10bk-coordinate-plane-velocity-comparison-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-source-plane-original-gamma-velocity:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin accepted derivatives native LieHom and F10BK comparison declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bk"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bk/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean")" = '3979ea1d3c64e4a3cb82e4baf2c10cbc6b5cb627'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean")" = '7798089cb8ac4ec4fffc3ead4caa474def81b3f8'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BHUnitVectorPairMembership.lean)" = 'f17d83d961055ebf4b00b74dfb35010a51c886d4'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BHIndependentAudit.lean)" = '441cca373a4d3ae9ec72277afc5c3339f1af2cf2'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BICoordinatePlaneSourceCurve.lean)" = 'faabd83f813eab9ae2026c5d426f8baed80d33a6'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BIIndependentAudit.lean)" = '119ab4569f0ef663838856ed3611e500a7125c82'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BEPBWTopologyGammaContinuity.lean")" = 'db887aa6e495eb2a74c2e826018ffb5453158806'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BJSourceCurveDerivatives.lean)" = '528937bc6f528eed64aea16ecc5eb69c74c2dd99'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BJIndependentAudit.lean)" = '13186e289439acf51af42c80cb0585f74a6285c2'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BBOriginalGammaCanonicalSkewLieHom.lean")" = 'cbf92737d81c5e69efc2fa85735d6af239540070'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AVOriginalGammaCoordinateLinearMapSkewImage.lean")" = 'bc895ed60f03a3e2091ff11ebd0b87e456f4408c'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinatePlaneCarrierProbe.lean")" = '92a26e8380abe9c1f9bdf011d27b8e97b4e17ef3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9CoordinateMatrixUnitBridgeProbe.lean")" = 'd80001bbe5052357dbca559232d81cc01c56fb34'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BKCoordinatePlaneVelocityComparison.lean)" = '382e0c369c1455cfd39a7153c9017e6b9b546fd1'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BKIndependentAudit.lean)" = '7c83f0446ed37b935cff96ce27df67acad83fd05'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BKCoordinatePlaneVelocityComparison.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BKIndependentAudit.lean').read_text()
          names=["source9CoordinatePlaneInSo","coordinateToOriginalGammaSkewLieHom_coordinatePlane_apply","source9PlaneCliffordVelocity_gamma_eq_coordinatePlaneLieHom","source9PlaneSpinCurve_gamma_hasDerivAt_coordinatePlaneLieHom"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert 'Source48Label' not in code
              assert not re.search(r'(?m)^(?:local )?instance\b',code)
              assert 'open scoped Matrix.Norms.Elementwise' in code
          for token in ['LieAlgebra.Orthogonal.so SpaceIndex ℝ','⟨coordinatePlane9 r s, by',
                        'coordinatePlane9_transpose r s','dite_eq_right hrs',
                        'coordinateToOriginalGammaLinearMap_coordinatePlane',
                        'source9PlaneSpinCurve_gamma_hasDerivAt_zero r s hrs']:
              assert token in s,token
          assert '(Matrix.single r s (1 : ℝ) - Matrix.single s r (1 : ℝ))' in audit
          assert 'coordinatePlane9_eq_single_sub_single r s' in audit
          assert 'auditGammaProductTopology := rfl' in audit
          print('V10H_F10BK_SOURCE_PIN_NATIVE_PLANE_NORMALIZATION_AND_VELOCITY_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10BJ derivative and F10BB canonical LieHom ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BJSourceCurveDerivatives OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BBOriginalGammaCanonicalSkewLieHom

      - name: Fresh F10BK native-plane velocity comparison warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BKCoordinatePlaneVelocityComparison
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bk/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently check literal native plane and exact LieHom velocity types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BKIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bk/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BKIndependentAudit.lean "$RUNNER_TEMP/v10h-f10bk/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BKCoordinatePlaneVelocityComparison.lean "$RUNNER_TEMP/v10h-f10bk/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9CoordinatePlaneInSo","coordinateToOriginalGammaSkewLieHom_coordinatePlane_apply","source9PlaneCliffordVelocity_gamma_eq_coordinatePlaneLieHom","source9PlaneSpinCurve_gamma_hasDerivAt_coordinatePlaneLieHom"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10bk'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BK_EXACT_NATIVE_PLANE_LIEHOM_VELOCITY_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BK audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bk-native-source-plane-original-gamma-velocity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bk
          if-no-files-found: warn
