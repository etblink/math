name: BFSS M4 W0C0 R2 original Fock scalar trace separation strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean
      - lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean
      - .github/workflows/bfss-m4-w0c0-r2-original-fock-scalar-trace-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fock-scalar-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight accepted W0B2B original Schur, T1 trace and OP2c nonzero vacuum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0c0-r2"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0c0-r2/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0c0-r2/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean":"96d3b63d08413f880d1adf0cef8b8e291f7b9453","lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean":"fe9136065179d706c60871ae16e02b8f60e1b189","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/T1OriginalFockTraceInvariance.lean":"3be6c9a6f2898484df66690f94fdfa1877660897","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OP2cNonzeroOriginalGaugeVacuum.lean":"a16d3573b737bb4453e42b0b543d63cbbac1cd1b","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4BFermionLinearTransportProbe.lean":"e55fcbb58ce4d3776bddefdd6d11ad83560bb75c","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2BOriginalSchurScalarCommutant.lean":"6d5fbe98aa8d660c9b7c680efefde02501d8e253","lean/diagnostics/BFSSP3M4W0B2BOriginalSchurScalarIndependentConsumer.lean":"68e1fe906d2d498f01baf56db7879c2697596c1c",".github/workflows/bfss-m4-w0b2b-r1-original-schur-scalar-strict.yml":"ce8fd612a8c23ffe5fc86aa61fdc480c3a2e8f8f","research/quantum-information/BFSS_QIT_SCC_W0C0_R2_ORIGINAL_FOCK_LET_STYLE_REPAIR_PRE_GATE_2026_11_17.md":"80dca01403546bf146553208ee6a0e56c18ac474","research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip":"f8133dba86db582f5d302885c7c134b3e2ff043a","research/quantum-information/diagnostics/BFSS_W0B2B_R1_44180157170_complete_job.log":"76e06a033b2e3dacc6dbf9ae7c7c6280b1d4a07b","research/quantum-information/diagnostics/BFSS_W0B2B_R1_44180157170_GREEN_evidence_manifest.json":"8770fa58b313985267fb710abb58fd3a282d7712","research/quantum-information/diagnostics/BFSS_M4_W0B2A_R1_44174996514_GREEN_evidence.zip":"e4d1fa8d7a87d5ce4fcfc5483c2308648762a62b","research/quantum-information/diagnostics/BFSS_M4_W0H1B_R1_44160611850_SOURCE_RED_evidence.zip":"3cfab55e2a8a30cb4c63e0a4aa47d224b826636a","research/quantum-information/diagnostics/BFSS_M4_W0B1_R1_44117272657_RED_evidence.zip":"a448d2ae775926ee05ab4a9028e29e8061fecdac","research/quantum-information/diagnostics/BFSS_M4_W0B1_R2_44127193329_RED_evidence.zip":"813b3325da4f721afc0bb313a710410eb40a3bcf","research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip":"54f84642bc280e61ce9fe59b77bfd9caf7bc7c61","research/quantum-information/diagnostics/BFSS_W0C0_R1_44184526501_complete_job.log":"8cd529bae1b3b138597403f82dc16e610e981d91","research/quantum-information/diagnostics/BFSS_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence_manifest.json":"3adae59c5e1705bf7a8ec27d5835af9ebf253335","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparation.lean":"42ee591cbd6c9d7d98e736076c2a4b6cb321ae0e","lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumer.lean":"63ce6ff9ee136bf3b02a845dc1c8dea4cbaf9054",".github/workflows/bfss-m4-w0c0-r1-original-fock-scalar-trace-strict.yml":"43736998ba3bd7d2bb51b54b03afd56af17776b2","research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip":"56e470ba2dbea58c9a05cdfcea91f64e06b568e8","research/quantum-information/diagnostics/BFSS_W0C0_R2_44190799433_complete_job.log":"74fa47be27ace746009b5dca6919cb3132383395","research/quantum-information/diagnostics/BFSS_W0C0_R2_44190799433_PREFLIGHT_RED_evidence_manifest.json":"0589342a9fda8875ea0e8cd079246b467e726dd8","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          src=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean").read_text()
          assert len(re.findall(r"(?m)^theorem\b",src))==3 and len(re.findall(r"(?m)^theorem\b",consumer))==3
          assert len(re.findall(r"(?m)^example\b",consumer))==3
          assert re.findall(r"(?m)^#print axioms (\S+)$",src)==[
           "originalFockTrace_one_eq_finrank",
           "originalFockTrace_one_ne_zero",
           "originalFockTrace_scalar_one_eq_zero_iff"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
           "originalFockTrace_one_eq_finrank_consumer",
           "originalFockTrace_one_ne_zero_consumer",
           "originalFockTrace_scalar_one_eq_zero_iff_consumer"]
          assert len(re.findall(r"(?m)^import ",src))==4
          assert consumer.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C0OriginalFockScalarTraceSeparationR2\n")
          assert len(re.findall(r"(?m)^import ",consumer))==1
          for name in ("originalFockTrace_apply","LinearMap.trace_one","originalFermionVacuum_ne_zero",
                       "Module.finrank_pos","map_smul","originalFockTrace_one_ne_zero"):
              assert name in src,name
          for body in (src,consumer):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",body)
              assert "maxHeartbeats" not in body and "maxRecDepth" not in body
              assert "CliffordAlgebra.induction" not in body
          assert "originalFockClifford_scalar_operator_unique" not in src
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert a["gate"]=="P3-M4-W0C0" and a["attempt"]=="R2"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean"] and a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean"]
          assert a["contract_commit"]=="2ece5242c232a2e77a8e5ecbf6ed634c5529a3a6"
          assert a["previous_red_run"]==44184526501 and s["previous_active_W0C0_R1_RED"]["run_id"]==44184526501
          assert s["w0c0_r2_first_preflight_red"]["run_id"]==44190799433
          assert s["w0c0_r2_first_preflight_red"]["failure_phase"]=="PRE_LEAN_PIN_PATH_MISMATCH"
          assert s["w0c0_r2_first_preflight_red"]["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44190799433_PREFLIGHT_RED_evidence.zip"]
          assert s["w0c0_r2_first_preflight_red"]["evidence_job_log_blob"]==pins["research/quantum-information/diagnostics/BFSS_W0C0_R2_44190799433_complete_job.log"]
          assert s["w0c0_r2_first_preflight_red"]["evidence_manifest_blob"]==pins["research/quantum-information/diagnostics/BFSS_W0C0_R2_44190799433_PREFLIGHT_RED_evidence_manifest.json"

          assert a["previous_red_artifact_sha256"]=="a1c300789de7b8e97e88efa894841670ab92bf7e98d489373c54dff285b9eb73"
          assert s["previous_active_W0C0_R1_RED"]["status"]=="RED_UNQUALIFIED"
          assert s["previous_active_W0C0_R1_RED"]["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip"]
          assert "  let : Nontrivial V :=" in src and "  letI : Nontrivial V :=" not in src
          redzip=Path("research/quantum-information/diagnostics/BFSS_M4_W0C0_R1_44184526501_SOURCE_LINTER_RED_evidence.zip")
          assert redzip.stat().st_size==18813 and hashlib.sha256(redzip.read_bytes()).hexdigest()=="a1c300789de7b8e97e88efa894841670ab92bf7e98d489373c54dff285b9eb73"
          with zipfile.ZipFile(redzip) as z:
              assert z.testzip() is None and set(z.namelist())=={"preflight.log","cold-source.log","source-axioms.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()=="deaf6f7cc314f3b18ff231945112b6478cae25e3"
              assert "Build completed successfully (9218 jobs)." in z.read("cold-source.log").decode()
              assert "The goal is a proposition" in z.read("source-axioms.log").decode()
          origlog=Path("research/quantum-information/diagnostics/BFSS_W0C0_R1_44184526501_complete_job.log")
          assert "The goal is a proposition" in origlog.read_text()

          assert a["accepted_predecessor_run"]==44180157170
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==3
          assert a["independent_controls"]==3
          assert q["gate"]=="P3-M4-W0B2B" and q["attempt"]=="R1" and q["run_id"]==44180157170
          assert q["qualification"] is True and q["status"]=="GREEN_QUALIFIED"
          assert q["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2BOriginalSchurScalarCommutant.lean"]
          assert q["evidence_archive_blob"]==pins["research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip"]
          assert q["preservation_run"]==44182808147
          assert s["accepted_anchors"][-1]==q
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert s["previous_active_W0H1B_R1_RED"]["run_id"]==44160611850
          assert s["next_planned"]["gate"]=="P3-M4-W0C1" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert Path(a["prospective_receipt"]).is_file()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          old=Path("research/quantum-information/diagnostics/BFSS_M4_W0B2B_R1_44180157170_GREEN_evidence.zip")
          assert old.stat().st_size==14293
          assert hashlib.sha256(old.read_bytes()).hexdigest()=="90049da54aee06c9cc649b1577059f10c440c037de3689e25b5da9314b7623a6"
          with zipfile.ZipFile(old) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()=="e5b93b53ba9917374e39b79dac4e808f44ad615c"
              assert "Build completed successfully (9134 jobs)." in z.read("cold-source.log").decode()
              assert "BFSS_W0B2B_R1_ORIGINAL_SCHUR_SCALAR_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in z.read("auditor.log").decode()
          print("BFSS_W0C0_R2_W0B2B_ACCEPTED_ORIGINAL_TRACE_VACUUM_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original Fock scalar trace, independent consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0c0-r2"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0C0OriginalFockScalarTraceSeparationR2 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C0OriginalFockScalarTraceSeparationR2.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0C0OriginalFockScalarTraceIndependentConsumerR2.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0c0-r2"
          allowed={"propext","Classical.choice","Quot.sound"}
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              warnings=[line for line in log.splitlines() if "warning:" in line and not warning_ok.fullmatch(line)]
              assert not warnings,warnings[:3]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert names==expected and len(set(names))==len(names),names
              for _,axioms in found:
                  assert {x.strip() for x in axioms.split(",") if x.strip()}<=allowed,axioms
          good="'N.one' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.two' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["one","two"])
          bads=[good.replace("Quot.sound","sorryAx",1),good.replace("Quot.sound","Foreign.axiom",1),good+good,"",good+"warning: unexpected warning\n",good+"error: failed proof\n"]
          for k,bad in enumerate(bads):
              try: audit(bad,["one","two"])
              except AssertionError: pass
              else: raise AssertionError(("negative mutation accepted",k))
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),
                ["originalFockTrace_one_eq_finrank",
                 "originalFockTrace_one_ne_zero",
                 "originalFockTrace_scalar_one_eq_zero_iff"])
          audit((root/"consumer.log").read_text(),
                ["originalFockTrace_one_eq_finrank_consumer",
                 "originalFockTrace_one_ne_zero_consumer",
                 "originalFockTrace_scalar_one_eq_zero_iff_consumer"])
          print("BFSS_W0C0_R2_ORIGINAL_FOCK_SCALAR_TRACE_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN")
          PY
      - name: Preserve exact original proof and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0c0-r2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0c0-r2/
          if-no-files-found: warn
          retention-days: 14
