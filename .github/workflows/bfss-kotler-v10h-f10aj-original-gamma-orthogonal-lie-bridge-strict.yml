name: BFSS V10H F10AJ original gamma orthogonal Lie subalgebra bridge strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean
      - .github/workflows/bfss-kotler-v10h-f10aj-original-gamma-orthogonal-lie-bridge-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-orthogonal-lie-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original gamma F10E F10AI and F10AJ source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10aj"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10aj/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AIOriginalGammaAllOrderedPairsLinearIndependentBridge.lean")" = 'd161986eaac79a27591c5538096451e858ec369d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean")" = '6c11e898dd7b5ed93db833ca0c7b678e6fda6ffe'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge.lean').read_text()
          names=['source9OriginalGamma_ordered_pair_transpose_neg',
                 'source9OriginalGamma_ordered_pair_mem_so',
                 'source9OriginalGamma_ordered_pairs_so_linearIndependent']
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
          assert s.count('#print axioms ') == 3
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for term in ['gamma_symmetric', 'source9OriginalGamma_anticommute',
                       'Matrix.transpose_mul', 'LieAlgebra.Orthogonal.mem_so',
                       'LieAlgebra.Orthogonal.so SpinIndex ℝ',
                       'source9OriginalGamma_all_ordered_pairs_linearIndependent',
                       'LinearIndependent.of_comp']:
              assert term in code,term
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10AJ_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10AI gamma 36-pair independence ancestry
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3750s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AIOriginalGammaAllOrderedPairsLinearIndependentBridge

      - name: Fresh F10AJ native orthogonal Lie bridge warnings-as-errors compiler
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10aj/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate three native so(16) bridge theorem types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10AJ_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10AJOriginalGammaPairOrthogonalLieSubalgebraBridge
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSGamma9
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (p : Source9OrderedGammaPairIndex) :
              (source9OrderedGammaPairMatrix p).transpose =
                -(source9OrderedGammaPairMatrix p) :=
            source9OriginalGamma_ordered_pair_transpose_neg p
          noncomputable example (p : Source9OrderedGammaPairIndex) :
              source9OrderedGammaPairMatrix p ∈
                LieAlgebra.Orthogonal.so SpinIndex ℝ :=
            source9OriginalGamma_ordered_pair_mem_so p
          noncomputable example :
              LinearIndependent ℝ source9OrderedGammaPairInSo :=
            source9OriginalGamma_ordered_pairs_so_linearIndependent
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_pair_transpose_neg
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_pair_mem_so
          #print axioms FCP.BFSSPairedSpin9Clifford.source9OriginalGamma_ordered_pairs_so_linearIndependent
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10AJ_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10aj/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10aj'/'declaration-audit.log').read_text()
          names=['source9OriginalGamma_ordered_pair_transpose_neg',
                 'source9OriginalGamma_ordered_pair_mem_so',
                 'source9OriginalGamma_ordered_pairs_so_linearIndependent']
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==3 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10AJ_THREE_NATIVE_SO_BRIDGE_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independently audited native so(16) bridge
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10aj-gamma-native-so-bridge-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10aj
          if-no-files-found: warn
