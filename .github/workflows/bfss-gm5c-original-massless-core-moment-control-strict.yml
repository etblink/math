name: BFSS GM5C exact original massless core moment control strict

'on':
  push:
    branches:
      - integration/bfss-unified-research-20261108
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5COriginalMasslessCoreMomentControl.lean'
      - 'lean/diagnostics/BFSSGM5COriginalMasslessCoreMomentControlIndependentAudit.lean'
      - '.github/workflows/bfss-gm5c-original-massless-core-moment-control-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-gm5c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-massless-core-moment-control:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and independent consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-gm5c-core-moment-control"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-gm5c-core-moment-control/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-tree HEAD -- \
            lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5COriginalMasslessCoreMomentControl.lean \
            lean/diagnostics/BFSSGM5COriginalMasslessCoreMomentControlIndependentAudit.lean \
            .github/workflows/bfss-gm5c-original-massless-core-moment-control-strict.yml \
            > "$RUNNER_TEMP/bfss-gm5c-core-moment-control/tested-blobs.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-gm5c-core-moment-control/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-gm5c-core-moment-control/preflight.log"
          from pathlib import Path
          import subprocess,re,json
          pins={
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5BOriginalNativeClosedChargeCoreEnergy.lean": "eebefdba1bf2b6c3d29462f88561f1337b2232de",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5AOriginalPhysicalMasslessCorePairing.lean": "66b088543e802268657232862a363506fc7000ae",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM4AOriginalMasslessPhysicalFixedSpaceRestriction.lean": "a42c8018a8d9fde12b530a81fa96e9765c8cb699",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean": "a9f27a48852ac570aedc8e0ab88d683250e6b138",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean": "152204ef15a6569534e0503824a697cb9ae8e4ce",
            "lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean": "e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
            "lean/OAI/MathematicalPhysics/BFSS/PotentialBounds.lean": "06afe0a2fa0c6d65439ad15e4e6031f1d43260b7",
            "lean/OAI/MathematicalPhysics/BFSS/MassiveMoments.lean": "2fd223d0da1a85c3be52bb2b9c68f4f12d10957e",
            "lean/OAI/MathematicalPhysics/BFSS/Cutoffs.lean": "7fe937b9af79f4ea7a8f994fa37d510608464c2b",
            "lean/OAI/MathematicalPhysics/BFSS/Core.lean": "9882359ced78b0a3bd7e2f057974bd0a031b3e60",
          }
          for path,expected in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==expected,("FROZEN_SOURCE_DRIFT",path,got,expected)
          subprocess.check_call(["git","merge-base","--is-ancestor","406d3d0ecdd9b97c4154688a4965546e165da549","HEAD"])
          s=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSGM5COriginalMasslessCoreMomentControl.lean").read_text()
          t=Path("lean/diagnostics/BFSSGM5COriginalMasslessCoreMomentControlIndependentAudit.lean").read_text()
          source_roots = [
            "coreRadialMoment",
            "kineticPotentialCoreEnergy",
            "masslessCoreFermionIntegral_abs_le",
            "nativeCoreEnergy_difference_le",
            "nativeCoreEnergy_difference_le_of_support",
          ]
          consumer_roots = [
            "pairedNativeCoreEnergy_difference_le",
            "pairedNativeCoreEnergy_difference_le_of_support",
          ]
          assert re.findall(r"(?m)^import (\S+)$", s) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5BOriginalNativeClosedChargeCoreEnergy",
            "OAI.MathematicalPhysics.BFSS.Cutoffs",
          ]
          assert re.findall(r"(?m)^import (\S+)$", t) == [
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5COriginalMasslessCoreMomentControl",
          ]
          assert re.findall(r"(?m)^#print axioms (\S+)$", s) == source_roots
          assert re.findall(r"(?m)^#print axioms (\S+)$", t) == consumer_roots
          for content in [s,t]:
              assert "set_option autoImplicit false" in content
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",content)
              for forbidden in ["set_option maxRecDepth","set_option maxHeartbeats",
                                "set_option synthInstance.maxHeartbeats"]:
                  assert forbidden not in content
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          m=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in m if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_GM5C_SOURCE_EXACT_CORE_MOMENT_CONTROL_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-gm5c-core-moment-control/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Original source massless core moment control and independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-gm5c-core-moment-control"
          timeout 3000s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSGM5COriginalMasslessCoreMomentControl 2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSGM5COriginalMasslessCoreMomentControlIndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          E=Path(os.environ["RUNNER_TEMP"])/"bfss-gm5c-core-moment-control"
          for fn in ["native-source.log","strict-axioms.log"]:
              log=(E/fn).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in log,(fn,bad,log[-6000:])
          expected = {
              "native-source.log": [
                  "FCP.BFSSGM5C.coreRadialMoment",
                  "FCP.BFSSGM5C.kineticPotentialCoreEnergy",
                  "FCP.BFSSGM5C.masslessCoreFermionIntegral_abs_le",
                  "FCP.BFSSGM5C.nativeCoreEnergy_difference_le",
                  "FCP.BFSSGM5C.nativeCoreEnergy_difference_le_of_support",
              ],
              "strict-axioms.log": [
                  "FCP.BFSSGM5CIndependent.pairedNativeCoreEnergy_difference_le",
                  "FCP.BFSSGM5CIndependent.pairedNativeCoreEnergy_difference_le_of_support",
              ],
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for filename, names in expected.items():
              transcript = (E / filename).read_text()
              if filename == "native-source.log":
                  assert "Build completed successfully" in transcript
              for name in names:
                  pattern = re.escape("'" + name + "'") + (
                      r" (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
                  )
                  reports = re.findall(pattern, transcript)
                  assert len(reports) == 1, (filename, name, reports)
                  axioms = {x.strip() for x in reports[0].split(",") if x.strip()}
                  assert axioms <= allowed, (filename, name, axioms)
          print("BFSS_GM5C_ORIGINAL_SOURCE_CORE_MOMENT_CONTROL_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal original source and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-gm5c-core-moment-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-gm5c-core-moment-control/
          if-no-files-found: warn
          retention-days: 30
