name: BFSS V10H F10N original real gamma positive determinant strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10NOriginalGammaPositiveDeterminantProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10n-original-gamma-positive-determinant-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gamma-positive-determinant:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original source gamma, qualified F9 and F10E-M and F10N four declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10n"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10n/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF9GeneratorDeterminantMagnitudeProbe.lean")" = '44493c4d9b72de2d2d84725768f8e2572ac91ed4'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10EPublicGammaTraceZeroProbe.lean")" = '3922916e49fc961efa99a72d706ca83ca704e3d6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10FSourceGammaSymmetricPositiveQuadraticProbe.lean")" = '19a1d1fd4cfc89d7c243d28a4c9f1663a3aa3ce3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10GSourceGammaRealSpectralBridgeProbe.lean")" = '76800a61a1b26825896519789ae2aaaef19069e9'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10HSourceGammaEigenvalueSquareProbe.lean")" = '245d1c509d41e71f001204d04b154dee76bd1b6c'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10IRealEigenvalueSqrtTwoSignProbe.lean")" = '0497b3ac508931ad568fc6ef1e3c20c688627ba7'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10JSourceEigenvalueSignPartitionProbe.lean")" = '144d32242d33428fdf26b40a9cfb8ce42bbe7c87'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10KSourceEigenvalueCardinalityBalanceProbe.lean")" = '680122d148d53078f7b0493369b6a53f8f1101ef'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10LSourceRealEigenvalueEightEachProbe.lean")" = '225f44f885923e567f2965ffd587920d4bfdaf5e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10MOriginalGammaEigenvalueProductPartitionProbe.lean")" = 'ec8c1ea8339df8262b394b0c8013e99b807a314b'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10NOriginalGammaPositiveDeterminantProbe.lean")" = '07a96a2e476cd857c5e8cca1f106d39689793117'
          python3 - <<'PY'
          from pathlib import Path
          import re
          code=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10NOriginalGammaPositiveDeterminantProbe.lean').read_text()
          names=["gammaNineRealLinear_det_eq_source9Quadratic_pow8_of_ne","gammaNineRealLinear_det_eq_source9Quadratic_pow8","gammaNineRealLinear_det_nonneg","source9CliffordUnitsGammaDetHom_generator_positive_branch"]
          for name in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(name)+r'\b',code))==1,name
          assert code.count('#print axioms ')==4
          src=re.sub(r'/\-.*?\-/', '', code, flags=re.S)
          assert '/-' not in src
          for required in ['gammaNineRealLinear_det_eq_realEigenvalues_prod',
                           'source9RealEigenvalue_prod_sign_partition',
                           'source9PositiveEigenIndices_prod_eq_sqrt_pow_eight',
                           'source9NegativeEigenIndices_prod_eq_neg_sqrt_pow_eight',
                           'Real.mul_self_sqrt', 'source9Quadratic_nonneg',
                           'gammaNineRealLinear_det_eq_pow8_or_neg',
                           'source9CliffordUnitsGammaDetHom_generator']:
              assert required in src,required
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',src)
          print('V10H_F10N_ORIGINAL_POSITIVE_DETERMINANT_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted original F10M real eigenvalue product ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10MOriginalGammaEigenvalueProductPartitionProbe

      - name: Fresh F10N ORIGINAL gamma positive determinant proof warning-as-error
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10NOriginalGammaPositiveDeterminantProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10n/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f10n/compiler.log")" -eq 4

      - name: Independently elaborate all four exact original gamma determinant types and axiom whitelist
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10N_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10NOriginalGammaPositiveDeterminantProbe
          open FCP.BFSSGamma9
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (v : SpaceIndex → ℝ) (hv : v ≠ 0) :
              (gammaNineRealLinear v).det =
                (source9Quadratic v) ^ 8 :=
            gammaNineRealLinear_det_eq_source9Quadratic_pow8_of_ne v hv
          noncomputable example (v : SpaceIndex → ℝ) :
              (gammaNineRealLinear v).det =
                (source9Quadratic v) ^ 8 :=
            gammaNineRealLinear_det_eq_source9Quadratic_pow8 v
          noncomputable example (v : SpaceIndex → ℝ) :
              0 ≤ (gammaNineRealLinear v).det :=
            gammaNineRealLinear_det_nonneg v
          noncomputable example
              (u : (CliffordAlgebra source9Quadratic)ˣ)
              (v : SpaceIndex → ℝ)
              (hvec : (u : CliffordAlgebra source9Quadratic) =
                CliffordAlgebra.ι source9Quadratic v) :
              source9CliffordUnitsGammaDetHom u =
                (source9Quadratic v) ^ 8 :=
            source9CliffordUnitsGammaDetHom_generator_positive_branch u v hvec
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_det_eq_source9Quadratic_pow8_of_ne
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_det_eq_source9Quadratic_pow8
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaNineRealLinear_det_nonneg
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9CliffordUnitsGammaDetHom_generator_positive_branch
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10N_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10n/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ["RUNNER_TEMP"])/"v10h-f10n"/"declaration-audit.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          names=["gammaNineRealLinear_det_eq_source9Quadratic_pow8_of_ne","gammaNineRealLinear_det_eq_source9Quadratic_pow8","gammaNineRealLinear_det_nonneg","source9CliffordUnitsGammaDetHom_generator_positive_branch"]
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in names}
          assert len(reports)==4 and {n for n,_ in reports}==expected,reports
          for n,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10N_ORIGINAL_REAL_GAMMA_DET_FOUR_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve tested SHA, compiler and independent original determinant type audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10n-original-gamma-positive-det-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10n
          if-no-files-found: warn
