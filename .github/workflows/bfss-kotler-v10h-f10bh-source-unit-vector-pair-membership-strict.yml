name: BFSS V10H F10BH actual source unit-vector pair Spin membership strict gate

on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BHUnitVectorPairMembership.lean
      - lean/diagnostics/FCP_K1D18V10HF10BHIndependentAudit.lean
      - .github/workflows/bfss-kotler-v10h-f10bh-source-unit-vector-pair-membership-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-source-unit-vector-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin exact algebraic gamma ancestry and F10BH source pair declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10bh"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10bh/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean")" = '3979ea1d3c64e4a3cb82e4baf2c10cbc6b5cb627'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom.lean")" = '7798089cb8ac4ec4fffc3ead4caa474def81b3f8'
          test "$(git hash-object lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BHUnitVectorPairMembership.lean)" = 'f17d83d961055ebf4b00b74dfb35010a51c886d4'
          test "$(git hash-object lean/diagnostics/FCP_K1D18V10HF10BHIndependentAudit.lean)" = '441cca373a4d3ae9ec72277afc5c3339f1af2cf2'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BHUnitVectorPairMembership.lean').read_text()
          audit=Path('lean/diagnostics/FCP_K1D18V10HF10BHIndependentAudit.lean').read_text()
          names=["source9UnitVectorCliffordUnit","source9UnitVectorCliffordUnit_mem_lipschitzGroup","source9UnitVectorPair_mem_spinGroup","source9UnitVectorPairSpin","source9UnitVectorPairSpin_gamma"]
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|theorem) '+re.escape(name)+r'\b',s))==1,name
              assert len(re.findall(r'(?m)^#print axioms '+re.escape(name)+r'[ \t]*$',s))==1,name
              assert '#print axioms FCP.BFSSPairedSpin9Clifford.'+name in audit,name
          assert s.count('#print axioms ')==len(names)
          assert audit.count('#print axioms ')==len(names)
          for text in [s,audit]:
              code=re.sub(r'/\-.*?\-/', '', text, flags=re.S)
              code=re.sub(r'--[^\n]*','',code)
              assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)|linter\.',code)
              assert 'Source48Label' not in code
              assert not re.search(r'(?m)^(?:local )?instance\b',code)
          for token in ['source9Quadratic v = 1','source9Quadratic u = 1',
                        'CliffordAlgebra.ι_sq_scalar','Subgroup.subset_closure',
                        'spinGroup.mem_iff','pinGroup.mem_iff','Submonoid.mem_map',
                        'CliffordAlgebra.star_ι','CliffordAlgebra.ι_mul_ι_mem_evenOdd_zero',
                        'source9SpinGammaSpecialOrthogonalHom_apply']:
              assert token in s,token
          print('V10H_F10BH_SOURCE_PIN_ACTUAL_NORMALIZED_VECTOR_PAIR_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10BC exact algebraic source gamma ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10BCSourceSpinGammaSpecialOrthogonalHom

      - name: Fresh F10BH source pair membership warnings-as-errors compilation
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BHUnitVectorPairMembership
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          rm -f ".lake/build/lib/lean/${target}.olean"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10bh/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently check normalized source membership and exact gamma image types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 600s lake env lean -DwarningAsError=true diagnostics/FCP_K1D18V10HF10BHIndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10bh/declaration-audit.log"
          cp diagnostics/FCP_K1D18V10HF10BHIndependentAudit.lean "$RUNNER_TEMP/v10h-f10bh/independent-audit.lean"
          cp OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10BHUnitVectorPairMembership.lean "$RUNNER_TEMP/v10h-f10bh/candidate-source.lean"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          names={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["source9UnitVectorCliffordUnit","source9UnitVectorCliffordUnit_mem_lipschitzGroup","source9UnitVectorPair_mem_spinGroup","source9UnitVectorPairSpin","source9UnitVectorPairSpin_gamma"]}
          for filename in ['compiler.log','declaration-audit.log']:
              s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10bh'/filename).read_text()
              reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^\]]*)\]",s)
              empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
              assert len(reports)+len(empty)==len(names),(filename,reports,empty)
              assert ({n for n,_ in reports}|set(empty))==names,(filename,reports,empty)
              for n,axs in reports:
                  assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
              assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10BH_EXACT_NORMALIZED_SOURCE_PAIR_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent F10BH audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10bh-actual-source-unit-vector-pair-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10bh
          if-no-files-found: warn
