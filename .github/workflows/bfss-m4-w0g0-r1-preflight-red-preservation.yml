name: BFSS W0G0 R1 harness-only preflight RED evidence preservation

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0g0-r1-preflight-red-preservation.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-generic-preflight-red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact W0G0 R1 pending source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify generic original bytes and frozen W0B1 STOP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0G0GenericScalarActionAdapter.lean)" = ff4f7f2a123e5b554ef08f09bffbcd9eec0c1a32
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0G0GenericScalarActionIndependentConsumer.lean)" = b1e2d8077f798c4b9526ddb61b9a50b58c093474
          python3 - <<'PY'
          import json
          s=json.load(open("BFSS_GATE_STATE.json"))
          assert s["active"]["gate"]=="P3-M4-W0G0" and s["active"]["attempt"]=="R1"
          assert s["active"]["status"]=="PENDING_STRICT_CI"
          assert s["last_qualified"]["run_id"]==44109519633
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          PY
      - name: Download provider-original preflight RED ZIP and full Actions job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          aid=14350907997
          run=44134589228
          jid=134220543984
          tested="a7d236bb340637230d87718ba36470c1c5a4742d"
          digest="68fe1a129f566cdedbb36283dc217bb95c337ca1be1be97215b97c9aeecf866b"
          size=389
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          url=f"https://api.github.com/repos/etblink/math/actions/artifacts/{aid}"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f: meta=json.load(f)
          assert meta["id"]==aid and meta["size_in_bytes"]==size
          assert meta["digest"]=="sha256:"+digest
          assert meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==tested
          def download(u):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
              try:
                  response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(u,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  signed=e.headers["Location"]
                  assert signed.startswith("https://")
                  with urllib.request.urlopen(signed,timeout=90) as f: return f.read()
              else:
                  with response: return response.read()
          raw=download(url+"/zip")
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"preflight.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()==tested
              preflight=z.read("preflight.log").decode()
              assert "AssertionError" in preflight and 'File "<stdin>", line 9' in preflight
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in sorted(z.namelist())]
          log=download(f"https://api.github.com/repos/etblink/math/actions/jobs/{jid}/logs")
          assert b"AssertionError" in log and b'File "<stdin>", line 9' in log
          assert b"Cold generic source" in log
          zp=root/f"BFSS_M4_W0G0_R1_{run}_PREFLIGHT_RED_evidence.zip"
          lp=root/f"BFSS_W0G0_R1_{run}_complete_job.log"
          mp=root/f"BFSS_W0G0_R1_{run}_PREFLIGHT_RED_manifest.json"
          for p in [zp,lp,mp]: assert not p.exists(),p
          zp.write_bytes(raw)
          lp.write_bytes(log)
          m={"gate":"P3-M4-W0G0","attempt":"R1","status":"PREFLIGHT_ONLY_RED","failure_phase":"PREFLIGHT_BEFORE_LEAN",
             "root_cause":"Python regex over-escaped word-boundary in exact checker; no Lean source or consumer attempted",
             "run_id":run,"job_id":jid,"tested_sha":tested,"original_artifact_id":aid,
             "original_zip":{"path":str(zp),"size":size,"sha256":digest,"members":members},
             "full_original_job_log":{"path":str(lp),"size":len(log),"sha256":hashlib.sha256(log).hexdigest()},
             "source_blob":"ff4f7f2a123e5b554ef08f09bffbcd9eec0c1a32","consumer_blob":"b1e2d8077f798c4b9526ddb61b9a50b58c093474",
             "last_qualified_run":44109519633}
          mp.write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0G0_R1_ORIGINAL_HARNESS_RED_EVIDENCE_REHASH_PASS",json.dumps(m,sort_keys=True))
          PY
      - name: Git-pin only original harness RED ZIP, full log and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0G0_R1_44134589228_PREFLIGHT_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0G0_R1_44134589228_complete_job.log research/quantum-information/diagnostics/BFSS_W0G0_R1_44134589228_PREFLIGHT_RED_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0G0: preserve source-untested harness-only R1 preflight RED"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
