name: BFSS V10F actual original paired-Fock Spin9 orthogonal-48 strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean
      - .github/workflows/bfss-kotler-source-spin9-original-paired48-orthogonal-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-48-global-orthogonal:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify V10E accepted source, genuine paired equiv and exact V10F content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10f"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10f/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe.lean")" = '3979ea1d3c64e4a3cb82e4baf2c10cbc6b5cb627'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9PlaneGeneratorProbe.lean")" = '02b8e54464b0aea151c96cefd316a86270cf8871'
          test "$(git hash-object "$p/SU2PairedThetaLabelCrosswalkProbe.lean")" = 'f3a2b41f902a20f6fe237ecce18dd7e869e9c45e'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean")" = '9dc5713dfea7c40d8c9f58088392e144c3c28517'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean').read_text()
          names=["gamma16ToOriginalPaired48_one","gamma16ToOriginalPaired48_mul","gamma16ToOriginalPaired48_transpose","gamma16ToOriginalPaired48_mem_orthogonalGroup","source9SpinOriginalPaired48OrthogonalHom","source9SpinOriginalPaired48OrthogonalHom_apply"]
          for n in names:
              assert len(re.findall(r'(?m)^(?:theorem|noncomputable def) '+re.escape(n)+r'\b',s)) == 1,n
          assert s.count('noncomputable def gamma16ToOriginalPaired48')==1
          assert s.count('#print axioms ')==6
          assert 'pairedColorSpinEquiv' in s and 'Source48Label' in s
          assert 'Matrix.reindexRingEquiv' in s and 'Matrix.mul_kronecker_mul' in s
          assert 'spinGroup source9Quadratic →*' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('V10F_ORIGINAL_PAIRED48_EXACT_SOURCE_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted V10E and source paired-index ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9SourceSpinGammaOrthogonalProbe OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9PlaneGeneratorProbe

      - name: Fresh V10F original paired-48 orthogonal proof compilation, warningAsError
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10f/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10f/compiler.log")" -eq 6

      - name: Independently elaborate six exact original paired-48 transport types and axiom whitelist
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V10F_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSS1V0
          open FCP.BFSSPairedSpin9Plane
          open OAI.BFSSQuantum
          open Matrix
          open scoped Kronecker
          noncomputable example :
              gamma16ToOriginalPaired48 (1 : GammaMatrix) =
                (1 : Matrix Source48Label Source48Label ℝ) :=
            gamma16ToOriginalPaired48_one
          noncomputable example (A B : GammaMatrix) :
              gamma16ToOriginalPaired48 (A * B) =
                gamma16ToOriginalPaired48 A * gamma16ToOriginalPaired48 B :=
            gamma16ToOriginalPaired48_mul A B
          noncomputable example (A : GammaMatrix) :
              (gamma16ToOriginalPaired48 A).transpose =
                gamma16ToOriginalPaired48 A.transpose :=
            gamma16ToOriginalPaired48_transpose A
          noncomputable example (A : GammaMatrix)
              (hA : A ∈ Matrix.orthogonalGroup SpinIndex ℝ) :
              gamma16ToOriginalPaired48 A ∈
                Matrix.orthogonalGroup Source48Label ℝ :=
            gamma16ToOriginalPaired48_mem_orthogonalGroup A hA
          noncomputable example :
              spinGroup source9Quadratic →*
                Matrix.orthogonalGroup Source48Label ℝ :=
            source9SpinOriginalPaired48OrthogonalHom
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) =
                (Matrix.reindexRingEquiv ℝ pairedColorSpinEquiv)
                  ((1 : Matrix (ColorIndex 2) (ColorIndex 2) ℝ) ⊗ₖ
                    ((source9SpinGammaOrthogonalHom g) : GammaMatrix)) :=
            source9SpinOriginalPaired48OrthogonalHom_apply g
          #print axioms FCP.BFSSPairedSpin9Clifford.gamma16ToOriginalPaired48_one
          #print axioms FCP.BFSSPairedSpin9Clifford.gamma16ToOriginalPaired48_mul
          #print axioms FCP.BFSSPairedSpin9Clifford.gamma16ToOriginalPaired48_transpose
          #print axioms FCP.BFSSPairedSpin9Clifford.gamma16ToOriginalPaired48_mem_orthogonalGroup
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinOriginalPaired48OrthogonalHom
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinOriginalPaired48OrthogonalHom_apply
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V10F_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v10f/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10f'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in ["gamma16ToOriginalPaired48_one","gamma16ToOriginalPaired48_mul","gamma16ToOriginalPaired48_transpose","gamma16ToOriginalPaired48_mem_orthogonalGroup","source9SpinOriginalPaired48OrthogonalHom","source9SpinOriginalPaired48OrthogonalHom_apply"]}
          assert len(reports)==6 and {n for n,_ in reports}==expected, reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(','))<= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10F_ORIGINAL_PAIRED48_GLOBAL_ORTHOGONAL_6_EXACT_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, original compiler and independent axiom proof artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10f-original-paired48-global-orthogonal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10f
          if-no-files-found: warn
