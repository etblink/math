name: BFSS M4 QTC0B original Fock tensor contraction strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0BOriginalFockQuadraticTensorContraction.lean
      - lean/diagnostics/BFSSP3M4QTC0BOriginalFockQuadraticTensorIndependentConsumer.lean
      - .github/workflows/bfss-m4-qtc0b-original-fock-tensor-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-qtc0b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fock-tensor-contraction-independent-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact unified integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify frozen tensor source, consumer, accepted QTC0A and negative history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-qtc0b"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-qtc0b/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-qtc0b/preflight.log"
          import json,re,hashlib,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0BOriginalFockQuadraticTensorContraction.lean":"ab7b1dbf31ad92000184204f14d083400d39bc00","lean/diagnostics/BFSSP3M4QTC0BOriginalFockQuadraticTensorIndependentConsumer.lean":"00755f559de156912d301efd91d944711ae382f6","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean":"b0b519e46566856e100bf6aa882f9fcdf37d397e","lean/diagnostics/BFSSP3M4QTC0AOriginalFockWeightedQuadraticIndependentConsumer.lean":"9d1dc845bea73d8e07549c69d9ef07804509f52e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1L2AbstractOriginalFockCovarianceLeibniz.lean":"b4012951a26aa7573db513adab3d7ce27396db7e","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1C1OriginalSource48SkewKMajoranaCovariance.lean":"c2e7a7c665121283cde13ae5dabc183362b6b420","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4LB1P1OriginalFourMajoranaCommutator.lean":"9a2899e24c02cb5a5dd58159605a34195fce3856","contributions/bfss-kotler/BFSS_PROJECT_LEAD_EVERGREEN_QUALIFIED_REUSE_LEDGER_2026_11_10.md":"4a8604acb431247694eb0a34bef1086a66e27af7","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,want in pins.items():
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==want,(path,want,got)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0BOriginalFockQuadraticTensorContraction.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4QTC0BOriginalFockQuadraticTensorIndependentConsumer.lean").read_text()
          expected_src=["originalFock_quadratic_covariance_tensor","originalFock_quadratic_covariance_skew"]
          expected_con=["originalFock_tensor_covariance_consumer","originalFock_skew_covariance_consumer"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==expected_src
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==expected_con
          assert len(re.findall(r"(?m)^example\b",consumer))==7
          for code in (source,consumer):
              assert "set_option autoImplicit false" in code
              assert not re.search(r"(?m)^\s*(?:sorry|admit|axiom|unsafe)\b",code)
              assert "maxRecDepth" not in code and "maxHeartbeats" not in code
          assert "Fermion 2 →L[ℂ] Fermion 2" in source
          assert "originalFock_quadratic_covariance_expanded" in source
          assert "originalFock_left_tensor_contract" in source
          assert "originalFock_right_tensor_contract" in source
          assert "Matrix.mul_apply" in source and "Matrix.transpose_apply" in source
          assert "originalFockQuadratic x (a * b + b * a.transpose)" in source
          assert "originalFockQuadratic x (a * b - b * a)" in source
          assert "matrixE00" in consumer and "(Fin 2)" in consumer
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          state=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          last=state["last_qualified"]
          active=state["active"]
          assert last["gate"]=="P3-M4-QTC0A" and last["status"]=="GREEN_QUALIFIED" and last["run_id"]==44001621836
          assert last["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0AOriginalFockWeightedQuadraticCovariance.lean"]
          assert active["gate"]=="P3-M4-QTC0B" and active["status"]=="PENDING_STRICT_CI" and active["qualification"] is False
          assert active["accepted_predecessor_run"]==44001621836
          assert active["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0BOriginalFockQuadraticTensorContraction.lean"] and active["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4QTC0BOriginalFockQuadraticTensorIndependentConsumer.lean"]
          assert active["allowed_axioms"]==["propext","Classical.choice","Quot.sound"]
          assert state["previous_active_CT1G0_R2_stopped"]["stopped"] is True
          assert state["previous_active_CT1G0_R2_stopped"]["run_id"]==43991790285
          archive=Path(last["evidence_archive"])
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=="bf8d93fe00846c9ea26815d32ee331424d9510d1816b66cd98c90ef82baf724c"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert z.read("tested-commit.txt").decode().strip()==last["tested_sha"]
          print("BFSS_M4_QTC0B_SOURCE_CONSUMER_ACCEPTED_QTC0A_STOP_AND_TOOLCHAIN_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
      - name: Cold original Fock tensor source, independent consumer and axiom auditor
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-qtc0b"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4QTC0BOriginalFockQuadraticTensorContraction 2>&1 | tee "$root/cold-source.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4QTC0BOriginalFockQuadraticTensorContraction.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 360s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4QTC0BOriginalFockQuadraticTensorIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-qtc0b"
          allowed={"propext","Classical.choice","Quot.sound"}
          allow_warning=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-1600:]
              warnings=[l for l in log.splitlines() if "warning:" in l and not allow_warning.fullmatch(l)]
              assert not warnings,warnings[:4]
              entries=pat.findall(log)
              assert len(entries)==len(expected),(entries,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in entries]
              assert len(set(names))==len(names) and set(names)==set(expected),names
              for theorem,axioms in entries:
                  assert {a.strip() for a in axioms.split(",") if a.strip()}<=allowed,(theorem,axioms)
          fixture="\n".join("'N.%s' depends on axioms: [propext, Classical.choice, Quot.sound]"%x for x in ("a","b"))+"\n"
          audit(fixture,["a","b"])
          mutants=[
              fixture.replace("Quot.sound","sorryAx",1),
              fixture.replace("Quot.sound","Unapproved.axiom",1),
              fixture.replace("'N.b'","'N.a'"),
              "\n".join(fixture.splitlines()[:1])+"\n",
              fixture+"warning: unexpected warning\n",
              fixture+"error: source theorem failed\n"]
          for index,bad in enumerate(mutants):
              try: audit(bad,["a","b"])
              except AssertionError: pass
              else: raise AssertionError(("negative auditor accepted",index))
          print("BFSS_M4_QTC0B_AUDITOR_POSITIVE_AND_6_NEGATIVE_CONTROLS_PASS")
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),[
            "originalFock_quadratic_covariance_tensor","originalFock_quadratic_covariance_skew"])
          audit((root/"consumer.log").read_text(),[
            "originalFock_tensor_covariance_consumer","originalFock_skew_covariance_consumer"])
          print("BFSS_M4_QTC0B_ORIGINAL_FOCK_TENSOR_CONTRACTION_2_SOURCE_2_CONSUMER_7_CONTROLS_STRICT_GREEN")
          PY
      - name: Preserve full original preflight, cold source, source and consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-qtc0b-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-qtc0b/
          if-no-files-found: warn
          retention-days: 14
