name: BFSS K1D18C genuine source rank-one Clifford generator strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - .github/workflows/bfss-kotler-k1d18c-actual-rank-one-strict.yml
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe.lean
  workflow_dispatch:
permissions:
  contents: read

jobs:
  actual-source-clifford-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact frozen 81-root provenance and three new source blob pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe.lean")" = '19db346be86030db4a3a291493b962bf00898898'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean")" = '9dc33c924c22e8823ddc905440feb05fb8ce3d0f'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18BPolarAllVectorCliffordBridgeProbe.lean")" = 'd0531752fa8f63df4f94294d6cd748fed1af223e'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe.lean")" = '9455998333da80845ab6b7514c13ef990c951019'
          test "$(git hash-object contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py)" = 'ca97ad005f75fc270942d034772871471933c7b3'
          python3 - <<'PY'
          import pathlib,re,sys
          sys.path.insert(0,str(pathlib.Path('contributions/bfss-kotler/tools').resolve()))
          from qualify_fcp_sync import code_only
          p=pathlib.Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler')
          files=[
            ('SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe.lean',
              ['source48_coordinate_sum','source48_normalized_polar_coordinate_dot']),
            ('SU2BFSSPhysicalDomainS1V52K1D18BPolarAllVectorCliffordBridgeProbe.lean',
              ['source48NormalizedPolarRow_dot','source48NormalizedPolarRow_dot_self',
               'source48_clifford_generator_conjugation_from_row']),
            ('SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe.lean',
              ['source48_rankOneConjugationMatrix_mulVec',
               'source48_rankOneMatrix_matches_original_clifford_conjugation',
               'source48_original_generator_rankOneMatrix_det']),
          ]
          for name,roots in files:
              s=(p/name).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|axiom)\b',code_only(s))
              assert re.findall(r'(?m)^#print axioms (\S+)',s)==roots,(name,'root list mismatch')
          print('K1D18C_EXACT_SOURCES_PINNED_EIGHT_ROOTS')
          PY
      - name: Restore pinned Lean/Mathlib with unchanged dependency process
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          lake env lean --version
      - name: Restore exact owner-branch accepted 81 root cache
        id: accepted-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: lean/.lake/build/lib/lean/OAI
          key: bfss-fcp-k1d17-source-accepted-ancestors-v1-389ecdcc-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Fail closed unless the exact 81 root sealed ancestry is independently reverified
        shell: bash
        timeout-minutes: 20
        env:
          EXACT_HIT: ${{ steps.accepted-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_HIT" = true || { echo 'K1D18C_NO_VALID_SOURCE_ANCESTRY_CACHE_STOP'; exit 1; }
          source "$HOME/.elan/env"
          python3 contributions/bfss-kotler/tools/qualify_fcp_k1d17_cached_ancestry.py verify --log-dir "$RUNNER_TEMP/bfss-k1d18c-cache"
          echo K1D18C_SOURCE_ACCEPTED_81_CACHE_REVALIDATED
      - name: Fresh strict source compiler K1D18A K1D18B K1D18C
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          p=OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          mkdir -p ".lake/build/lib/lean/$p" "$RUNNER_TEMP/bfss-k1d18c-fresh"
          for m in SU2BFSSPhysicalDomainS1V52K1D18APolarCoordinateNormalizationProbe SU2BFSSPhysicalDomainS1V52K1D18BPolarAllVectorCliffordBridgeProbe SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe; do
            lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$p/$m.olean" "$p/$m.lean" > "$RUNNER_TEMP/bfss-k1d18c-fresh/$m.log" 2>&1 || {
              cat "$RUNNER_TEMP/bfss-k1d18c-fresh/$m.log"; exit 1;
            }
            test -s ".lake/build/lib/lean/$p/$m.olean"
            cat "$RUNNER_TEMP/bfss-k1d18c-fresh/$m.log"
            sha256sum ".lake/build/lib/lean/$p/$m.olean"
          done
          echo K1D18C_ORIGINAL_SOURCE_PARENT_AND_CANDIDATE_FRESH_COMPILER_PASS
      - name: Independent candidate/parent eight declaration exact types and axiom audit
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          d="$RUNNER_TEMP/bfss-k1d18c-fresh"
          cat > "$d/audit.lean" <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPhysicalDomainS1V52K1D18CRankOneActualCliffordGeneratorProbe
          #print axioms FCP.BFSSS1V52K1D18A.source48_coordinate_sum
          #print axioms FCP.BFSSS1V52K1D18A.source48_normalized_polar_coordinate_dot
          #print axioms FCP.BFSSS1V52K1D18B.source48NormalizedPolarRow_dot
          #print axioms FCP.BFSSS1V52K1D18B.source48NormalizedPolarRow_dot_self
          #print axioms FCP.BFSSS1V52K1D18B.source48_clifford_generator_conjugation_from_row
          #print axioms FCP.BFSSS1V52K1D18C.source48_rankOneConjugationMatrix_mulVec
          #print axioms FCP.BFSSS1V52K1D18C.source48_rankOneMatrix_matches_original_clifford_conjugation
          #print axioms FCP.BFSSS1V52K1D18C.source48_original_generator_rankOneMatrix_det
          #check @FCP.BFSSS1V52K1D18A.source48_coordinate_sum
          #check @FCP.BFSSS1V52K1D18A.source48_normalized_polar_coordinate_dot
          #check @FCP.BFSSS1V52K1D18B.source48NormalizedPolarRow_dot
          #check @FCP.BFSSS1V52K1D18B.source48NormalizedPolarRow_dot_self
          #check @FCP.BFSSS1V52K1D18B.source48_clifford_generator_conjugation_from_row
          #check @FCP.BFSSS1V52K1D18C.source48_rankOneConjugationMatrix_mulVec
          #check @FCP.BFSSS1V52K1D18C.source48_rankOneMatrix_matches_original_clifford_conjugation
          #check @FCP.BFSSS1V52K1D18C.source48_original_generator_rankOneMatrix_det
          LEAN
          lake env lean -DwarningAsError=true "$d/audit.lean" > "$d/audit.log" 2>&1 || { cat "$d/audit.log"; exit 1; }
          cat "$d/audit.log"
          python3 - "$d/audit.log" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          roots=[
            'FCP.BFSSS1V52K1D18A.source48_coordinate_sum',
            'FCP.BFSSS1V52K1D18A.source48_normalized_polar_coordinate_dot',
            'FCP.BFSSS1V52K1D18B.source48NormalizedPolarRow_dot',
            'FCP.BFSSS1V52K1D18B.source48NormalizedPolarRow_dot_self',
            'FCP.BFSSS1V52K1D18B.source48_clifford_generator_conjugation_from_row',
            'FCP.BFSSS1V52K1D18C.source48_rankOneConjugationMatrix_mulVec',
            'FCP.BFSSS1V52K1D18C.source48_rankOneMatrix_matches_original_clifford_conjugation',
            'FCP.BFSSS1V52K1D18C.source48_original_generator_rankOneMatrix_det',
          ]
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert [n for n,_ in reports]==roots,reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name,axs in reports:
              assert set(x.strip() for x in axs.split(',') if x.strip())<=allowed,(name,axs)
          assert 'sorryAx' not in s
          assert not re.search(r'\.lean:\d+:\d+:\s*(?:error|warning)',s)
          for root in roots: assert root+' :' in s,('missing exact type',root)
          print('K1D18C_SOURCE_EXACT_ALL_EIGHT_ROOTS_STRICT_AXIOMS_PASS')
          PY
      - name: Preserve complete success and failure compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d18c-source-rankone-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bfss-k1d18c-cache
            ${{ runner.temp }}/bfss-k1d18c-fresh
          if-no-files-found: warn
