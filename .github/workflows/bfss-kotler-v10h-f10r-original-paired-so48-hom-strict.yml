name: BFSS V10H F10R original paired SO48 hom strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10r-original-paired-so48-hom-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-so48-hom:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin source original gamma V10F V10G F10Q and F10R
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10r"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10r/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceSpinOriginalPaired48OrthogonalProbe.lean")" = '9dc5713dfea7c40d8c9f58088392e144c3c28517'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OriginalPaired48DeterminantTransferProbe.lean")" = '1f71be97fb11a01022257b791ab38863de4407b5'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10QSourceSpinOrientationDetOneProbe.lean")" = '948712b83647829ab5902dfa88979f44747af1f3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean")" = '75a679f2a1435d747e219617feea266b4508c53d'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe.lean').read_text()
          assert len(re.findall(r'(?m)^theorem source9SpinOriginalPaired48_mem_specialOrthogonal\b',s))==1
          assert len(re.findall(r'(?m)^noncomputable def source9SpinOriginalPaired48SpecialOrthogonalHom\b',s))==1
          assert len(re.findall(r'(?m)^theorem source9SpinOriginalPaired48SpecialOrthogonalHom_apply\b',s))==1
          assert s.count('#print axioms ')==3
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for required in ['source9SpinOriginalPaired48_mem_specialOrthogonal_of_gamma_det_one',
                           'gammaDetDirectHom_eq_one',
                           'source9SpinOriginalPaired48OrthogonalHom',
                           'Matrix.specialOrthogonalGroup Source48Label']:
              assert required in code,required
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10R_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10Q source Spin9 determinant-one ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10QSourceSpinOrientationDetOneProbe

      - name: Fresh F10R original paired SO48 hom warning-as-error proof
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10r/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate 3 SO48 types and check root axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10R_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10RSourceSpinOriginalPaired48SOHomProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) ∈
                Matrix.specialOrthogonalGroup Source48Label ℝ :=
            source9SpinOriginalPaired48_mem_specialOrthogonal g
          noncomputable example :
              spinGroup source9Quadratic →*
                Matrix.specialOrthogonalGroup Source48Label ℝ :=
            source9SpinOriginalPaired48SpecialOrthogonalHom
          noncomputable example (g : spinGroup source9Quadratic) :
              ((source9SpinOriginalPaired48SpecialOrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) =
              ((source9SpinOriginalPaired48OrthogonalHom g) :
                Matrix Source48Label Source48Label ℝ) :=
            source9SpinOriginalPaired48SpecialOrthogonalHom_apply g
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinOriginalPaired48_mem_specialOrthogonal
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinOriginalPaired48SpecialOrthogonalHom
          #print axioms FCP.BFSSPairedSpin9Clifford.source9SpinOriginalPaired48SpecialOrthogonalHom_apply
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10R_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10r/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10r'/'declaration-audit.log').read_text()
          names=['source9SpinOriginalPaired48_mem_specialOrthogonal',
                 'source9SpinOriginalPaired48SpecialOrthogonalHom',
                 'source9SpinOriginalPaired48SpecialOrthogonalHom_apply']
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          assert len(reports)==3 and {n for n,_ in reports}==expected,reports
          for name,axioms in reports:
              assert set(a.strip() for a in axioms.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10R_THREE_SO48_EXACT_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve tested SHA, compiler and independent SO48 audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10r-original-paired-so48-hom-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10r
          if-no-files-found: warn
