name: BFSS V10H F7 genuine source Spin9 two-sign orientation obstruction strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe.lean
      - .github/workflows/bfss-kotler-v10h-f7-two-sign-obstruction-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spin9-two-sign-discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify accepted F6 exact source and F7 two-sign candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f7"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f7/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF5TypedDirectDeterminantCharacterProbe.lean")" = '47e13c108393146c2ebb699237edb1414564d34d'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe.lean")" = '1b4edd14c457dea12481c1b5417ccf969290ddbd'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe.lean")" = '9b9a2f85c8cbd8588c1d86fba92b4b6cffa16973'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe.lean').read_text()
          names=["gammaDetDirectHom_eq_one_or_neg_one","gammaDetDirectHom_eq_neg_one_iff_not_mem","source9OrientationSubgroup_ne_top_iff_exists_negative","not_source9_isPerfect_of_negative","source9OrientationSubgroup_eq_top_iff_all_positive"]
          for n in names:
              assert len(re.findall(r'(?m)^theorem '+re.escape(n)+r'\b',s))==1,n
          assert s.count('#print axioms ')==5
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          assert '/-' not in code, 'unhandled nested comment'
          assert 'Mathlib.Algebra.Ring.Commute' in code
          assert 'gammaDetDirectHom_sq' in code
          assert 'sq_eq_one_iff' in code
          assert 'source9_orientation_eq_top_of_isPerfect' in code
          assert 'SU2BFSSPairedSpin9SourceDeterminantCharacterProbe' not in code
          assert 'Matrix.detMonoidHom' not in code
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F7_EXACT_TWO_SIGN_OBSTRUCTION_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted source F6 commutator and conditional perfectness
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF6SourceCommutatorObstructionProbe

      - name: Fresh F7 source two-sign original Spin9 determinant strict compile
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f7/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10h-f7/compiler.log")" -eq 5

      - name: Independently elaborate exact F7 five declarations and check root axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F7_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF7TwoSignObstructionDiscriminatorProbe
          open FCP.BFSSPairedSpin9Clifford
          open FCP.BFSSPairedSpin9DetFixture
          open FCP.BFSSS1V0
          open OAI.BFSSQuantum
          open Matrix
          noncomputable example (g : spinGroup source9Quadratic) :
              gammaDetDirectHom g = 1 ∨ gammaDetDirectHom g = -1 :=
            gammaDetDirectHom_eq_one_or_neg_one g
          noncomputable example (g : spinGroup source9Quadratic) :
              gammaDetDirectHom g = -1 ↔
                g ∉ source9OrientationSubgroup :=
            gammaDetDirectHom_eq_neg_one_iff_not_mem g
          noncomputable example :
              source9OrientationSubgroup ≠ ⊤ ↔
                ∃ g : spinGroup source9Quadratic, gammaDetDirectHom g = -1 :=
            source9OrientationSubgroup_ne_top_iff_exists_negative
          noncomputable example (g : spinGroup source9Quadratic)
              (hneg : gammaDetDirectHom g = -1) :
              ¬ Group.IsPerfect (spinGroup source9Quadratic) :=
            not_source9_isPerfect_of_negative g hneg
          noncomputable example :
              source9OrientationSubgroup = ⊤ ↔
                ∀ g : spinGroup source9Quadratic, gammaDetDirectHom g = 1 :=
            source9OrientationSubgroup_eq_top_iff_all_positive
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_eq_one_or_neg_one
          #print axioms FCP.BFSSPairedSpin9DetFixture.gammaDetDirectHom_eq_neg_one_iff_not_mem
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OrientationSubgroup_ne_top_iff_exists_negative
          #print axioms FCP.BFSSPairedSpin9DetFixture.not_source9_isPerfect_of_negative
          #print axioms FCP.BFSSPairedSpin9DetFixture.source9OrientationSubgroup_eq_top_iff_all_positive
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F7_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f7/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f7'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={'FCP.BFSSPairedSpin9DetFixture.'+n for n in ["gammaDetDirectHom_eq_one_or_neg_one","gammaDetDirectHom_eq_neg_one_iff_not_mem","source9OrientationSubgroup_ne_top_iff_exists_negative","not_source9_isPerfect_of_negative","source9OrientationSubgroup_eq_top_iff_all_positive"]}
          assert len(reports)==5 and {n for n,_ in reports}==expected,reports
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F7_TWO_SIGN_5_DECLARATION_AXIOMS_PASS')
          PY

      - name: Preserve exact tested SHA, compiler and independent axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f7-source-two-sign-obstruction-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f7
          if-no-files-found: warn
