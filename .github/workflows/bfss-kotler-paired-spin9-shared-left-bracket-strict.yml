name: BFSS V8F original paired Spin9 shared-left bracket strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SharedLeftBracketProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-shared-left-bracket-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-shared-left-bracket:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact original paired and gamma pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2PairedThetaLabelCrosswalkProbe.lean")" = 'f3a2b41f902a20f6fe237ecce18dd7e869e9c45e'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = '65db1f822b86bfbf400957a0aaa94784d6cb7a39'
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9PlaneGeneratorProbe.lean")" = '02b8e54464b0aea151c96cefd316a86270cf8871'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9AdjacentLieBracketProbe.lean")" = '2186cce50ad2f06c125b7281cbe10f319d975a81'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrientationSwapProbe.lean")" = '58cd7bbd6d1314dc684309b0fe4724688d00e59f'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SharedLeftBracketProbe.lean")" = 'ce5cdc1d8073262b867fc705e0adc4f0ac5e743e'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SharedLeftBracketProbe.lean').read_text()
          assert s.count('theorem originalPairedPlane_shared_left_bracket')==1
          assert 'SU2BFSSPairedSpin9AdjacentLieBracketProbe' in s and 'SU2BFSSPairedSpin9OrientationSwapProbe' in s
          assert 'originalPairedPlane r s * originalPairedPlane r t -' in s and 'originalPairedPlane s t + originalPairedPlane s t' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('K1D18V8F_EXACT_SOURCE_PIN_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile exact accepted V8B and V8D theorem ancestors
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9AdjacentLieBracketProbe \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9OrientationSwapProbe

      - name: Fresh compile exact V8F source with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SharedLeftBracketProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          mkdir -p "$RUNNER_TEMP/v8f"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v8f/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v8f/compiler.log")" -eq 1

      - name: Fresh independent Lean theorem specialization and axiom gate
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V8F_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9SharedLeftBracketProbe
          open OAI.BFSSQuantum
          example (r s t : SpaceIndex) (hrs : r ≠ s) (hrt : r ≠ t) (hst : s ≠ t) :
              FCP.BFSSPairedSpin9Plane.originalPairedPlane r s *
                FCP.BFSSPairedSpin9Plane.originalPairedPlane r t -
                  FCP.BFSSPairedSpin9Plane.originalPairedPlane r t *
                    FCP.BFSSPairedSpin9Plane.originalPairedPlane r s =
                FCP.BFSSPairedSpin9Plane.originalPairedPlane s t +
                  FCP.BFSSPairedSpin9Plane.originalPairedPlane s t :=
            FCP.BFSSPairedSpin9Plane.originalPairedPlane_shared_left_bracket
              r s t hrs hrt hst
          #check FCP.BFSSPairedSpin9Plane.originalPairedPlane_shared_left_bracket
          #print axioms FCP.BFSSPairedSpin9Plane.originalPairedPlane_shared_left_bracket
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V8F_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v8f/declaration-audit.log"
          python3 - <<'PY'
          import os,pathlib,re
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v8f'/'declaration-audit.log').read_text()
          root='FCP.BFSSPairedSpin9Plane.originalPairedPlane_shared_left_bracket'
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
          assert len(reports)==1 and reports[0][0]==root,reports
          assert set(x.strip() for x in reports[0][1].split(',') if x.strip()) <= {
            'propext','Classical.choice','Quot.sound'},reports
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('K1D18V8F_EXACT_ONE_ORIGINAL_SOURCE_SHARED_LEFT_ROOT_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v8f-original-paired-shared-left-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v8f
          if-no-files-found: warn
