name: BFSS V10H F10Z source nine exterior PBW ordered word strict gate
on:
  push:
    branches: [research/fcp-k1d17-ancestor-cache-pilot-20261028]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10ZSourceNineExteriorPBWOrderedWordProbe.lean
      - .github/workflows/bfss-kotler-v10h-f10z-source-nine-exterior-pbw-word-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-nine-exterior-pbw-word:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin original Cl9 F10X F10Y K1D2C method and new F10Z
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10h-f10z"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10h-f10z/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2RealGammaProbe.lean")" = 'b9b8192055c70f0d001d7982669b9823c55562ed'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SourceCliffordGammaLiftProbe.lean")" = 'f53d7c52559d8e00061716d2746a87154e35e3fa'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10XSourceCliffordGammaKernelCriterionProbe.lean")" = '42da9e4d7cc74a6137defe7f68e457275be21b31'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe.lean")" = '578ddf1505da2ab2848bc88cf709660d941cb8ec'
          test "$(git hash-object "$p/SU2BFSSPhysicalDomainS1V52K1D2COriginalExteriorPBWBasisOrderedWordProbe.lean")" = '3ed038ffa6be357965af5c777ecebf958518fff3'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9V10HF10ZSourceNineExteriorPBWOrderedWordProbe.lean")" = 'ea9c2a99c2f913277af18bcafbbf152f14cecbd6'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10ZSourceNineExteriorPBWOrderedWordProbe.lean').read_text()
          names=['source9ExteriorPBWBasis','source9ExteriorCoordinateWord',
                 'source9ExteriorPBWOrderedLabels',
                 'source9ExteriorPBWBasis_eq_coordinateWord',
                 'source9ExteriorPBWOrderedLabels_nodup',
                 'source9CliffordPBWBasis_eq_exteriorWord']
          for name in names:
              assert len(re.findall(r'(?m)^(?:noncomputable def|def|theorem) '+re.escape(name)+r'\b',s))==1,name
          assert s.count('#print axioms ') == 6
          code=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
          for token in ['source9CliffordPBWBasis','CliffordAlgebra.equivExterior source9Quadratic',
                        'ExteriorAlgebra.basis_apply','I.orderEmbOfFin',
                        'source9ExteriorCoordinateWord','SpaceIndex']:
              assert token in code,token
          assert not re.search(r'\b(sorry|admit|native_decide)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',code)
          print('V10H_F10Z_SOURCE_PIN_AND_SCOPE_PASS')
          PY

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Rebuild accepted F10Y source nine Clifford PBW ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10YSourceNineCliffordPBWBasisProbe

      - name: Fresh F10Z source nine exterior PBW ordered word warning-as-error proof
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9V10HF10ZSourceNineExteriorPBWOrderedWordProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 840s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10h-f10z/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"

      - name: Independently elaborate six exact source PBW word types and axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/V10H_F10Z_IndependentAudit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9V10HF10ZSourceNineExteriorPBWOrderedWordProbe
          open FCP.BFSSPairedSpin9Clifford
          open OAI.BFSSQuantum
          noncomputable example :
              Module.Basis (Finset SpaceIndex) ℝ
                (ExteriorAlgebra ℝ (SpaceIndex → ℝ)) :=
            source9ExteriorPBWBasis
          noncomputable example (xs : List SpaceIndex) :
              ExteriorAlgebra ℝ (SpaceIndex → ℝ) :=
            source9ExteriorCoordinateWord xs
          noncomputable example (I : Finset SpaceIndex) :
              List SpaceIndex :=
            source9ExteriorPBWOrderedLabels I
          noncomputable example (I : Finset SpaceIndex) :
              source9ExteriorPBWBasis I =
                source9ExteriorCoordinateWord
                  (source9ExteriorPBWOrderedLabels I) :=
            source9ExteriorPBWBasis_eq_coordinateWord I
          noncomputable example (I : Finset SpaceIndex) :
              (source9ExteriorPBWOrderedLabels I).Nodup :=
            source9ExteriorPBWOrderedLabels_nodup I
          noncomputable example (I : Finset SpaceIndex) :
              source9CliffordPBWBasis I =
                (CliffordAlgebra.equivExterior source9Quadratic).symm
                  (source9ExteriorCoordinateWord
                    (source9ExteriorPBWOrderedLabels I)) :=
            source9CliffordPBWBasis_eq_exteriorWord I
          #print axioms FCP.BFSSPairedSpin9Clifford.source9ExteriorPBWBasis
          #print axioms FCP.BFSSPairedSpin9Clifford.source9ExteriorCoordinateWord
          #print axioms FCP.BFSSPairedSpin9Clifford.source9ExteriorPBWOrderedLabels
          #print axioms FCP.BFSSPairedSpin9Clifford.source9ExteriorPBWBasis_eq_coordinateWord
          #print axioms FCP.BFSSPairedSpin9Clifford.source9ExteriorPBWOrderedLabels_nodup
          #print axioms FCP.BFSSPairedSpin9Clifford.source9CliffordPBWBasis_eq_exteriorWord
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/V10H_F10Z_IndependentAudit.lean 2>&1 | tee "$RUNNER_TEMP/v10h-f10z/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ['RUNNER_TEMP'])/'v10h-f10z'/'declaration-audit.log').read_text()
          names=['source9ExteriorPBWBasis','source9ExteriorCoordinateWord',
                 'source9ExteriorPBWOrderedLabels',
                 'source9ExteriorPBWBasis_eq_coordinateWord',
                 'source9ExteriorPBWOrderedLabels_nodup',
                 'source9CliffordPBWBasis_eq_exteriorWord']
          expected={'FCP.BFSSPairedSpin9Clifford.'+n for n in names}
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          empty=re.findall(r"(?m)^'([^'\n]+)' does not depend on any axioms",s)
          actual={n for n,_ in reports}|set(empty)
          assert len(reports)+len(empty)==6 and actual==expected,(reports,empty)
          for name,axs in reports:
              assert set(a.strip() for a in axs.split(',')) <= {'propext','Classical.choice','Quot.sound'},(name,axs)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10H_F10Z_SIX_SOURCE_PBW_WORD_TYPES_AXIOMS_PASS')
          PY

      - name: Preserve exact SHA compiler and independent source PBW word audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10h-f10z-source-nine-pbw-ordered-word-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10h-f10z
          if-no-files-found: warn
