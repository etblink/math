name: BFSS M4 W0B2A R1 original Clifford module endomorphism strict

'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2AOriginalCliffordModuleEndBridge.lean
      - lean/diagnostics/BFSSP3M4W0B2AOriginalCliffordModuleEndIndependentConsumer.lean
      - .github/workflows/bfss-m4-w0b2a-original-module-end-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4-w0b2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-clifford-module-end:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preflight W0H1B R2 accepted, original M3B/M3C/M3I and historical RED provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-m4-w0b2a-r1"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-m4-w0b2a-r1/tested-commit.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-m4-w0b2a-r1/preflight.log"
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          pins={"lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2AOriginalCliffordModuleEndBridge.lean":"58d852a27e84288c0b1f33d784940155e2f26d54","lean/diagnostics/BFSSP3M4W0B2AOriginalCliffordModuleEndIndependentConsumer.lean":"85784957405d4740f7dddc9e04dc72ed4c9d3b7a","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1BOriginalAdjoinFullCliffordCommutantR2.lean":"9139fba785aa31a1e1cde83419f9848ea67fc016","lean/diagnostics/BFSSP3M4W0H1BOriginalAdjoinFullCliffordIndependentConsumerR2.lean":"61964ed693120a6db5f39d034581fc5a5aac9f0a",".github/workflows/bfss-m4-w0h1b-r2-original-centralizer-membership-strict.yml":"c46291c407af0f5e85f23bad2cb20114abd6b03c","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe.lean":"e7de3612d83889d8e08318307b37b15ac6567202","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3COriginalCliffordFockSchurAndFiniteProbe.lean":"6fefd9ae344df0b7247feb34c9bec5ea0a27aea0","lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/OperatorDependencies/SU2BFSSPhysicalDomainS1V52M3IOriginalComplexCliffordFockAlgebraEquivProbe.lean":"754a5f2a13baea90312f6031eb8fa7963dbdf42b","research/quantum-information/BFSS_QIT_SCC_W0B2A_R1_ORIGINAL_CLIFFORD_MODULE_END_PRE_GATE_2026_11_17.md":"083025b2505699966ce22e063e08facebd281821","research/quantum-information/diagnostics/BFSS_M4_W0H1B_R2_44164974919_GREEN_evidence.zip":"7e49358ea47500a2b2e8ab0407e7db44c7871cb5","research/quantum-information/diagnostics/BFSS_W0H1B_R2_44164974919_complete_job.log":"7a0996ce15adfc8f9bf5462c350dafaecd6ff906","research/quantum-information/diagnostics/BFSS_W0H1B_R2_44164974919_GREEN_evidence_manifest.json":"4ef0a86aabdf53da7bf85dd15101f89b592badd3","research/quantum-information/diagnostics/BFSS_M4_W0H1B_R1_44160611850_SOURCE_RED_evidence.zip":"3cfab55e2a8a30cb4c63e0a4aa47d224b826636a","research/quantum-information/diagnostics/BFSS_W0H1B_R1_44160611850_complete_job.log":"51c99b6096bffee493f39713f2b48c8add482440","research/quantum-information/diagnostics/BFSS_W0H1B_R1_44160611850_SOURCE_RED_evidence_manifest.json":"1487191587142dbd9caa6fc881250a0b3b8e099b","research/quantum-information/diagnostics/BFSS_M4_W0B1_R1_44117272657_RED_evidence.zip":"a448d2ae775926ee05ab4a9028e29e8061fecdac","research/quantum-information/diagnostics/BFSS_M4_W0B1_R2_44127193329_RED_evidence.zip":"813b3325da4f721afc0bb313a710410eb40a3bcf","lean/lean-toolchain":"ba8ebf2dbaf6a668cd2a0e086186d6d569b69ff5","lean/lake-manifest.json":"67d01d2717d0aaff59fb8814bb53581b961f42b4"}
          for path,expected in pins.items():
              actual=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          source=Path("lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2AOriginalCliffordModuleEndBridge.lean").read_text()
          consumer=Path("lean/diagnostics/BFSSP3M4W0B2AOriginalCliffordModuleEndIndependentConsumer.lean").read_text()
          assert len(re.findall(r"(?m)^theorem\b",source))==2
          assert len(re.findall(r"(?m)^noncomputable def\b",source))==1
          assert len(re.findall(r"(?m)^theorem\b",consumer))==3
          assert len(re.findall(r"(?m)^example\b",consumer))==3
          assert re.findall(r"(?m)^#print axioms (\S+)$",source)==[
              "originalFockClifford_module_smul","originalFockClifford_moduleEnd","originalFockClifford_moduleEnd_apply"]
          assert re.findall(r"(?m)^#print axioms (\S+)$",consumer)==[
              "originalFockClifford_module_smul_consumer",
              "originalFockClifford_moduleEnd_apply_consumer",
              "originalFockClifford_moduleEnd_smul_consumer"]
          assert len(re.findall(r"(?m)^import ",source))==2 and len(re.findall(r"(?m)^import ",consumer))==1
          assert consumer.startswith("import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0B2AOriginalCliffordModuleEndBridge\n")
          for name in ("originalComplexEquiv_fullClifford_commutes T h a",
                       "originalComplexCliffordFockAlgEquiv a",
                       "Module.End A V","originalFockClifford_module_smul"):
              assert name in source,name
          for body in (source,consumer):
              assert "set_option autoImplicit false" in body
              assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",body)
              assert "maxHeartbeats" not in body and "maxRecDepth" not in body
              assert "CliffordAlgebra.induction" not in body
          assert "originalComplexCliffordFock_scalarCommutant" not in source
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert a["gate"]=="P3-M4-W0B2A" and a["attempt"]=="R1"
          assert a["status"]=="PENDING_STRICT_CI" and a["qualification"] is False
          assert a["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2AOriginalCliffordModuleEndBridge.lean"] and a["consumer_blob"]==pins["lean/diagnostics/BFSSP3M4W0B2AOriginalCliffordModuleEndIndependentConsumer.lean"]
          assert a["contract_commit"]=="7bda19744b08a71ce85744a2fc2de4a84668a4fe"
          assert a["accepted_predecessor_run"]==44164974919
          assert a["expected_source_reports"]==a["expected_consumer_reports"]==3
          assert a["independent_controls"]==3
          assert q["gate"]=="P3-M4-W0H1B" and q["attempt"]=="R2"
          assert q["status"]=="GREEN_QUALIFIED" and q["qualification"] is True
          assert q["run_id"]==44164974919 and q["source_blob"]==pins["lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0H1BOriginalAdjoinFullCliffordCommutantR2.lean"]
          assert s["accepted_anchors"][-1]==q
          assert s["previous_active_W0H1B_R1_RED"]["run_id"]==44160611850
          assert s["previous_active_W0B1_R2_stopped"]["stopped"] is True
          assert s["next_planned"]["gate"]=="P3-M4-W0B2B" and s["next_planned"]["status"]=="PROSPECTIVE_NOT_STAGED"
          assert Path(a["prospective_receipt"]).is_file()
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          old=Path("research/quantum-information/diagnostics/BFSS_M4_W0H1B_R2_44164974919_GREEN_evidence.zip")
          assert old.stat().st_size==14233
          assert hashlib.sha256(old.read_bytes()).hexdigest()=="a5dc404d93dd6df74ff97e5a4f498661d467edc75391cb46099147859b8928a3"
          with zipfile.ZipFile(old) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"auditor.log","cold-source.log","consumer.log","preflight.log","source-axioms.log","tested-commit.txt"}
              assert z.read("tested-commit.txt").decode().strip()=="a383fc5bcab5656b3fb67efe4a398c1788b201d1"
              assert "Build completed successfully (9132 jobs)." in z.read("cold-source.log").decode()
              assert "BFSS_W0H1B_R2_ORIGINAL_ADJOIN_FULL_CLIFFORD_2_SOURCE_2_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN" in z.read("auditor.log").decode()
          print("BFSS_W0B2A_R1_W0H1B_GREEN_ORIGINAL_M3B_M3C_M3I_PREFLIGHT_PASS")
          PY
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get
          test "$(lake env lean --version | grep -oF '4.34.1')" = '4.34.1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Cold original W0B2A module endomorphism, consumer and axiom audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          root="$RUNNER_TEMP/bfss-m4-w0b2a-r1"
          timeout 1100s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.P3M4W0B2AOriginalCliffordModuleEndBridge 2>&1 | tee "$root/cold-source.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0B2AOriginalCliffordModuleEndBridge.lean 2>&1 | tee "$root/source-axioms.log"
          timeout 300s lake env lean -DautoImplicit=false -DwarningAsError=true diagnostics/BFSSP3M4W0B2AOriginalCliffordModuleEndIndependentConsumer.lean 2>&1 | tee "$root/consumer.log"
          python3 - <<'PY' 2>&1 | tee "$root/auditor.log"
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bfss-m4-w0b2a-r1"
          allowed={"propext","Classical.choice","Quot.sound"}
          warning_ok=re.compile(r"^warning: [a-zA-Z0-9_-]+: repository '[^']*/lean/\.lake/packages/[a-zA-Z0-9_-]+' has local changes$")
          pat=re.compile(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          def audit(log,expected):
              assert "error:" not in log and "sorryAx" not in log,log[-2000:]
              warnings=[line for line in log.splitlines() if "warning:" in line and not warning_ok.fullmatch(line)]
              assert not warnings,warnings[:3]
              found=pat.findall(log)
              assert len(found)==len(expected),(found,expected)
              names=[n.rsplit(".",1)[-1] for n,_ in found]
              assert names==expected and len(set(names))==len(names),names
              for _,axioms in found:
                  assert {x.strip() for x in axioms.split(",") if x.strip()}<=allowed,axioms
          good="'N.one' depends on axioms: [propext, Classical.choice, Quot.sound]\n'N.two' depends on axioms: [propext, Classical.choice, Quot.sound]\n"
          audit(good,["one","two"])
          bads=[good.replace("Quot.sound","sorryAx",1),good.replace("Quot.sound","Foreign.axiom",1),good+good,"",good+"warning: unexpected warning\n",good+"error: failed proof\n"]
          for k,bad in enumerate(bads):
              try: audit(bad,["one","two"])
              except AssertionError: pass
              else: raise AssertionError(("negative mutation accepted",k))
          cold=(root/"cold-source.log").read_text()
          assert "error:" not in cold and "sorryAx" not in cold
          assert "Build completed successfully" in cold
          audit((root/"source-axioms.log").read_text(),
                ["originalFockClifford_module_smul","originalFockClifford_moduleEnd","originalFockClifford_moduleEnd_apply"])
          audit((root/"consumer.log").read_text(),
                ["originalFockClifford_module_smul_consumer","originalFockClifford_moduleEnd_apply_consumer",
                 "originalFockClifford_moduleEnd_smul_consumer"])
          print("BFSS_W0B2A_R1_ORIGINAL_FOCK_CLIFFORD_MODULE_END_3_SOURCE_3_CONSUMER_3_CONTROLS_SIX_MUTANTS_STRICT_GREEN")
          PY
      - name: Preserve exact original proof and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4-w0b2a-r1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-m4-w0b2a-r1/
          if-no-files-found: warn
          retention-days: 14
