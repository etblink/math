name: BFSS V10A original Fock-paired exponential determinant-one and special orthogonal strict gate
on:
  push:
    branches:
      - research/fcp-k1d17-ancestor-cache-pilot-20261028
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SpecialOrthogonalExponentialProbe.lean
      - .github/workflows/bfss-kotler-paired-spin9-special-orthogonal-exponential-strict.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-paired-special-orthogonal-exponential:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check exact pinned source and V9Z qualified ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10a"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v10a/tested-sha.txt"
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          p=lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ContinuousMonoidOrthogonalFlowProbe.lean")" = '2b7cd4659e6aa9b8554281b045f9b6d56e30ffc6'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9ContinuousOrthogonalFlowProbe.lean")" = '8a09e7db98b842da215d7bc2e23d651d8b3e03ca'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OrthogonalGroupMembershipProbe.lean")" = 'b471ebb2da441c4be099bed168f6fa3651e24a99'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9OneParameterOrthogonalFlowProbe.lean")" = 'fe56b8b55ea9e72d50b8991962d8b22def7375d9'
          test "$(git hash-object "$p/SU2BFSSPairedSpin9SpecialOrthogonalExponentialProbe.lean")" = '4e09280dca5ef228820ececbf336935ed130bf46'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SpecialOrthogonalExponentialProbe.lean').read_text()
          for name in ['pairedSkewExp_det_one','pairedSkewExp_mem_specialOrthogonalGroup']:
              assert s.count('theorem '+name+'\n') == 1, name
          assert 'isPreconnected_univ' in s and '.eq_of_sq_eq' in s
          assert 'Matrix.mem_specialOrthogonalGroup_iff' in s
          assert not re.search(r'\b(sorry|admit)\b|(?m:^\s*axiom\s)|set_option\s+(maxRecDepth|maxHeartbeats)',s)
          print('V10A_EXACT_ORIGINAL_PAIRED_SOURCE_PREFLIGHT_PASS')
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Compile accepted V9Z original paired continuous-hom ancestry
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          timeout 3150s lake build OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9ContinuousMonoidOrthogonalFlowProbe

      - name: Fresh V10A determinant-one and SO48 source compile with warnings as errors
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          target=OAI/MathematicalPhysics/BFSS/Contrib/Kotler/SU2BFSSPairedSpin9SpecialOrthogonalExponentialProbe
          mkdir -p ".lake/build/lib/lean/$(dirname "$target")"
          timeout 750s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/${target}.olean" "${target}.lean" 2>&1 | tee "$RUNNER_TEMP/v10a/compiler.log"
          test -s ".lake/build/lib/lean/${target}.olean"
          test "$(grep -c '^.*depends on axioms:\|^.*does not depend on any axioms' "$RUNNER_TEMP/v10a/compiler.log")" -eq 2

      - name: Independently elaborate exact V10A theorem types and audit two root axioms
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          cat > /tmp/PairedSpin9V10A_Audit.lean <<'LEAN'
          import OAI.MathematicalPhysics.BFSS.Contrib.Kotler.SU2BFSSPairedSpin9SpecialOrthogonalExponentialProbe
          open FCP.BFSSPairedSpin9Plane
          open FCP.BFSSS1V0
          open NormedSpace
          noncomputable example
              (X : Matrix Source48Label Source48Label ℝ)
              (hX : X.transpose = -X) (t : ℝ) :
              (exp (t • X)).det = 1 :=
            pairedSkewExp_det_one X hX t
          noncomputable example
              (X : Matrix Source48Label Source48Label ℝ)
              (hX : X.transpose = -X) (t : ℝ) :
              exp (t • X) ∈ Matrix.specialOrthogonalGroup Source48Label ℝ :=
            pairedSkewExp_mem_specialOrthogonalGroup X hX t
          #print axioms FCP.BFSSPairedSpin9Plane.pairedSkewExp_det_one
          #print axioms FCP.BFSSPairedSpin9Plane.pairedSkewExp_mem_specialOrthogonalGroup
          LEAN
          timeout 600s lake env lean -DwarningAsError=true /tmp/PairedSpin9V10A_Audit.lean 2>&1 | tee "$RUNNER_TEMP/v10a/declaration-audit.log"
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          s=(Path(os.environ['RUNNER_TEMP'])/'v10a'/'declaration-audit.log').read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' depends on axioms: \[([^]]*)\]",s)
          expected={
            'FCP.BFSSPairedSpin9Plane.pairedSkewExp_det_one',
            'FCP.BFSSPairedSpin9Plane.pairedSkewExp_mem_specialOrthogonalGroup'
          }
          assert len(reports)==2 and {n for n,_ in reports}==expected, reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name, axioms in reports:
            assert set(a.strip() for a in axioms.split(','))<=allowed, (name,axioms)
          assert 'sorryAx' not in s and not re.search(r'\.lean:\d+:\d+:\s*(warning|error)',s)
          print('V10A_ORIGINAL_PAIRED_DET_ONE_AND_SPECIAL_ORTHOGONAL_TYPED_AXIOMS_PASS')
          PY

      - name: Preserve compiler and independent axiom artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-v10a-original-paired-special-orthogonal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v10a
          if-no-files-found: warn
