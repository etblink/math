name: BFSS massless14 plus D69 unified integration independent strict

'on':
  push:
    branches:
      - integration/bfss-unified-massless14-candidate-20261122
    paths:
      - 'lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/BFSSMassless*.lean'
      - lean/diagnostics/BFSSMasslessUnified14AndD69IndependentAudit.lean
      - research/integration/BFSS_MASSLESS14_D69_CANDIDATE_MANIFEST_2026_11_22.json
      - .github/workflows/bfss-massless14-d69-unified-integration-strict.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-massless14-d69-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-massless-paired-closed-dense-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Frozen original source and isolated-root preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-massless14-d69-integration"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-massless14-d69-integration/tested-sha.txt"
          sha256sum lean/lean-toolchain lean/lake-manifest.json | tee "$RUNNER_TEMP/bfss-massless14-d69-integration/environment-sha256.txt"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/bfss-massless14-d69-integration/preflight.log"
          from pathlib import Path
          import subprocess,json,re
          base="lean/OAI/MathematicalPhysics/BFSS/"
          src=Path("lean/diagnostics/BFSSMasslessUnified14AndD69IndependentAudit.lean")
          pins={
            base+"Core.lean":"9882359ced78b0a3bd7e2f057974bd0a031b3e60",
            base+"MixedEnergy.lean":"cc00f5b2ce4bb1811162e4bf2d9c773a9779ef8e",
            base+"DeformedCharge.lean":"c27c913c44090100f0c714e3eb34e25205f4d2d3",
            base+"FermionFrequency.lean":"cbb82a42f42b3b3d3695081247bd14d0496abc7d",
            base+"FermionQuantization.lean":"c6b72d030225c707ef54f5285a18a7a8175ee280",
            base+"FrequencyContraction.lean":"425edf6d7d0f9d15ce5f8bc92e8788ef60068618",
            base+"Contrib/Kotler/BFSSMasslessM0OriginalBracketNegationProbe.lean":"948671c8173dd69bba380a1b08fd46c7b63efb57",
            base+"Contrib/Kotler/BFSSMasslessM1aOriginalComplexQuantizerNormalization.lean":"93e11616d37a3bfac44320e7518027d8883c6072",
            base+"Contrib/Kotler/BFSSMasslessM1bOriginalRealFieldRestrictionConsumer.lean":"fc2994f932cc13bbade9735f74a97390a4ea224d",
            base+"Contrib/Kotler/BFSSMasslessM1cOriginalCoefficientDifferenceConsumer.lean":"749992dec67bf4bca28ab957890191aeb8c78fb8",
            base+"Contrib/Kotler/BFSSMasslessD0aOriginalSmoothCoreLpAction.lean":"1bf49640d543635313495c505a4a4dbc64583ae2",
            base+"Contrib/Kotler/BFSSMasslessD0b0OriginalMaximalDomainSubmodule.lean":"84853fb624289121938e0fb4d2b45afdc16a74c6",
            base+"Contrib/Kotler/OperatorDependencies/SU2BFSSG1APairedThetaProbe.lean":"152204ef15a6569534e0503824a697cb9ae8e4ce",
            base+"Contrib/Kotler/BFSSMasslessD0c0OriginalGenericPartialMultiplierGraph.lean":"2fc90310c9ac476d8e52ba0176ecc94f8994d1c9",
            base+"Contrib/Kotler/BFSSMasslessD0c1PairedNamedActionAdapter.lean":"46def7b34022ec033b235ada6d99f9a90f4850d3",
            base+"Contrib/Kotler/BFSSMasslessD0d0OriginalNaturalDomainDensity.lean":"74cea492fd85c2c77dbe1547af2117778014a735",
            base+"Contrib/Kotler/BFSSMasslessD0e0OriginalPointwiseLimitTransfer.lean":"29cc0574389eb82e8a84928fc9e4fb15dda533c3",
            base+"Contrib/Kotler/BFSSMasslessD0e1aOriginalJointLpAeSubsequence.lean":"e4bd9da6820f62138e707a1d6fb767ac6d4c3c9b",
            base+"Contrib/Kotler/BFSSMasslessD0e1bOriginalGraphAeLimitIdentification.lean":"2f6d07801b9fc5c817d1790a356b2442f6b00373",
            base+"Contrib/Kotler/BFSSMasslessD0e1cOriginalGenericGraphClosedness.lean":"f2e01a80a9361b49e717fda7132a7b96dc8d0736",
            base+"Contrib/Kotler/BFSSMasslessD0e1dPairedOriginalClosedDenseGraphConsumer.lean":"84562c41e7cff18cba6f5ad2f0584447f2ff6794",
            base+"GaugeCore.lean":"e4990dadf1d8bde849e351467282ab3f14989c3b",
            base+"Contrib/Kotler/OperatorDependencies/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean":"e20c76fb22bc09d16dbcd8657333227cb34ed1ea",
            base+"Contrib/Kotler/P3M5BE0OriginalNativeHamiltonianPort.lean":"f08f1eac4dfb2ff75cdda7421faaf78d4dce77e1",
            base+"Contrib/Kotler/SU2RealGammaProbe.lean":"b9b8192055c70f0d001d7982669b9823c55562ed",
            base+"Contrib/Kotler/RHOPFP9C3D2G1D69OriginalGammaQCanonicalProjectivizationHomeomorph.lean":"db6cba9a0e72cd83bb9241027ddddf3c27f6e213",
            "lean/diagnostics/RHOPFP9C3D2G1D69OriginalGammaQCanonicalProjectivizationHomeomorphIndependentAudit.lean":"03ed8d38e25d73c145e726daa5c8a7fa2622b305",
            "research/topology/data/BFSS_GAMMA9_SOURCE_PERMUTATION_FIXTURE_2026_11_18.json":"684680e139cfcd09c37bf075c0c014bdaa80ba35",
            "lean/diagnostics/BFSSMasslessUnified14AndD69IndependentAudit.lean":"6700db01eb4d23c75190aba9ddaa37645c05f841",
            "research/integration/BFSS_MASSLESS14_D69_CANDIDATE_MANIFEST_2026_11_22.json":"203e563abfd1a4dc43ce390f9248ca4fd4f7a8a4",
          }
          for path,expected in pins.items():
              observed=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert observed==expected,("SOURCE_DRIFT",path,observed,expected)
          frozen="6f0603e6b73db3e7c808a1a91d54bb995c510333"
          manifest=json.loads(Path("research/integration/BFSS_MASSLESS14_D69_CANDIDATE_MANIFEST_2026_11_22.json").read_text())
          assert manifest["target_frozen_parent"]==frozen
          assert manifest["exact_research_source_snapshot"]=="15cf95aaf285333be4af9fbebb951542a563aed8"
          assert manifest["candidate_branch"]=="integration/bfss-unified-massless14-candidate-20261122"
          entries=manifest["new_qualified_sources"]
          assert len(entries)==14 and len(set(e["path"] for e in entries))==14
          for e in entries:
              path=e["path"]
              assert path.startswith(base+"Contrib/Kotler/BFSSMassless")
              got=subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()
              assert got==e["blob_sha1"],("IMMUTABLE_RESEARCH_SOURCE_DRIFT",path,got,e["blob_sha1"])
          allowed_diff={e["path"] for e in entries}|{
              "lean/diagnostics/BFSSMasslessUnified14AndD69IndependentAudit.lean",
              "research/integration/BFSS_MASSLESS14_D69_CANDIDATE_MANIFEST_2026_11_22.json",
              ".github/workflows/bfss-massless14-d69-unified-integration-strict.yml",
              "research/integration/BFSS_MASSLESS14_D69_INTEGRATION_R1_PREFLIGHT_RED_2026_11_22.md",
              "research/integration/BFSS_MASSLESS14_D69_INTEGRATION_R2_CONSUMER_RED_2026_11_22.md",
          }
          subprocess.check_call(["git","merge-base","--is-ancestor",frozen,"HEAD"])
          changed=set(subprocess.check_output(["git","diff","--name-only",frozen,"HEAD"],text=True).splitlines())
          assert changed==allowed_diff,("CANDIDATE_UNEXPECTED_CHANGES",sorted(changed^allowed_diff))
          s=src.read_text()
          assert re.findall(r"(?m)^import (\S+)$",s)==[
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessD0e1dPairedOriginalClosedDenseGraphConsumer",
            "OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C3D2G1D69OriginalGammaQCanonicalProjectivizationHomeomorph"]
          roots=["originalPairedMasslessDomainDenseAndGraphClosed",
                 "originalGammaQCanonicalProjectivizationHomeomorph"]
          assert re.findall(r"(?m)^theorem (\S+)",s)==roots[:1]
          assert re.findall(r"(?m)^noncomputable def (\S+)",s)==roots[1:]
          assert re.findall(r"(?m)^#print axioms (\S+)$",s)==roots
          assert "set_option autoImplicit false" in s
          assert not re.search(r"(?m)^\s*(sorry|admit|axiom|unsafe)\b",s)
          for bad in ["set_option maxRecDepth","set_option maxHeartbeats",
                      "IsFiniteMeasure","set_option linter."]:
              assert bad not in s,("CONSUMER_SCOPE_VIOLATION",bad)
          assert "FCP.BFSSMasslessD0e1d.pairedOriginalMasslessDomain_dense_and_graph_closed" in s
          assert "FCP.RHOPFP9C3D2G1D69.relationalSourceQCircleOrbitCanonicalProjectivizationHomeomorph" in s
          print("BFSS_MASSLESS14_D69_CANDIDATE_SOURCE_INTEGRITY_PASS")
          assert Path("lean/lean-toolchain").read_text().strip()=="leanprover/lean4:v4.34.1"
          manifest=json.loads(Path("lean/lake-manifest.json").read_text())["packages"]
          assert next(x["rev"] for x in manifest if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          print("BFSS_MASSLESS14_D69_ORIGINAL_DONOR_PIN_PREFLIGHT_PASS")
          PY

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1800s lake exe cache get 2>&1 | tee "$RUNNER_TEMP/bfss-massless14-d69-integration/cache.log"
          test "$(lake env lean --version | grep -oF '4.34.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Unified original D69 and 14-source cold build plus independent strict consumer
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd lean
          E="$RUNNER_TEMP/bfss-massless14-d69-integration"
          timeout 3000s lake build \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.BFSSMasslessD0e1dPairedOriginalClosedDenseGraphConsumer \
            OAI.MathematicalPhysics.BFSS.Contrib.Kotler.RHOPFP9C3D2G1D69OriginalGammaQCanonicalProjectivizationHomeomorph \
            2>&1 | tee "$E/native-source.log"
          timeout 600s lake env lean -DautoImplicit=false -DwarningAsError=true \
            diagnostics/BFSSMasslessUnified14AndD69IndependentAudit.lean \
            2>&1 | tee "$E/strict-axioms.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"bfss-massless14-d69-integration"
          for name in ["native-source.log","strict-axioms.log"]:
              body=(d/name).read_text()
              for bad in ["error:","sorryAx","unsolved goals","unknown identifier"]:
                  assert bad not in body,(name,bad,body[-6000:])
          native=(d/"native-source.log").read_text()
          native_roots=[
            "FCP.BFSSMasslessD0e1d.pairedOriginalMasslessGraph_isClosed",
            "FCP.BFSSMasslessD0e1d.pairedOriginalMasslessDomain_dense_and_graph_closed",
            "FCP.RHOPFP9C3D2G1D69.relationalSourceQCircleOrbitCanonicalProjectivizationHomeomorph",
            "FCP.RHOPFP9C3D2G1D69.relationalSourceQCircleOrbitCanonicalProjectivizationHomeomorph_class"]
          for name in native_roots:
              assert "'"+name+"' depends on axioms:" in native,("MISSING_NATIVE_ROOT",name)
          body=(d/"strict-axioms.log").read_text()
          reports=re.findall(r"(?m)^'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",body)
          expected=[
            "FCP.BFSSMasslessUnified14Independent.originalPairedMasslessDomainDenseAndGraphClosed",
            "FCP.BFSSMasslessUnified14Independent.originalGammaQCanonicalProjectivizationHomeomorph"]
          assert [n for n,_ in reports]==expected,(reports,expected)
          allowed={"propext","Classical.choice","Quot.sound"}
          for n,listed in reports:
              axioms={a.strip() for a in listed.split(",") if a.strip()}
              assert axioms<=allowed,(n,axioms)
          print("BFSS_MASSLESS14_D69_UNIFIED_INDEPENDENT_STRICT_GREEN")
          PY

      - name: Preserve first-causal native and strict evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-massless14-d69-integration-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-massless14-d69-integration/
          if-no-files-found: warn
          retention-days: 30
