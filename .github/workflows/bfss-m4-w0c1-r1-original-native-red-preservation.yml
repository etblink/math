name: BFSS W0C1 R1 original native zero-scalar RED evidence preservation
'on':
  push:
    branches: [integration/bfss-unified-research-20261108]
    paths:
      - .github/workflows/bfss-m4-w0c1-r1-original-native-red-preservation.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve-w0c1-r1-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen R1 and immutable accepted predecessors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify R1 original source and accepted W0C0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/P3M4W0C1OriginalCommutatorTraceWitness.lean)" = bdcef8cd83feda4fda905092649c7411a2456f9e
          test "$(git rev-parse HEAD:lean/diagnostics/BFSSP3M4W0C1OriginalCommutatorTraceIndependentConsumer.lean)" = 9563e06c058771fec4be3b322be48799f38be231
          test "$(git rev-parse HEAD:.github/workflows/bfss-m4-w0c1-r1-original-commutator-trace-witness-strict.yml)" = 61341d74095497e43f69c05234f129c21868ed65
          test "$(git rev-parse HEAD:research/quantum-information/diagnostics/BFSS_M4_W0C0_R2_44192981282_GREEN_evidence.zip)" = 4992a5444441022a998afc26324551a273b747c9
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("BFSS_GATE_STATE.json").read_text())
          a,q=s["active"],s["last_qualified"]
          assert (a["gate"],a["attempt"],a["status"],a["qualification"])==("P3-M4-W0C1","R1","PENDING_STRICT_CI",False)
          assert q["gate"]=="P3-M4-W0C0" and q["run_id"]==44192981282 and q["qualification"] is True
          assert s["accepted_anchors"][-1]==q
          assert not Path("research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip").exists()
          PY
      - name: Retrieve and verify original RED ZIP and entire Actions job transcript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.error,zipfile
          from pathlib import Path
          prefix="https://api.github.com/repos/etblink/math"
          run=44204390734;job=134466466516;artifact=14384021959
          tested="38898e1198d5f0d1ad7f10b43e9e58830e007d19"
          digest="006cbbca5679d7891d800851aabe160df014ab0f089500f059ef1999f688d884"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f:return json.load(f)
          r=getjson(f"{prefix}/actions/runs/{run}")
          j=getjson(f"{prefix}/actions/jobs/{job}")
          a=getjson(f"{prefix}/actions/artifacts/{artifact}")
          assert r["head_sha"]==tested and r["status"]=="completed" and r["conclusion"]=="failure" and r["run_attempt"]==1
          assert j["id"]==job and j["run_id"]==run and j["conclusion"]=="failure"
          assert any("Cold original witness kernel" in s["name"] and s["conclusion"]=="failure" for s in j["steps"])
          assert a["id"]==artifact and a["size_in_bytes"]==19367 and a["digest"]=="sha256:"+digest
          assert a["workflow_run"]["id"]==run and a["workflow_run"]["head_sha"]==tested
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):return None
          def download(url):
              try: res=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=60)
              except urllib.error.HTTPError as e:
                  assert e.code==302,e
                  url=e.headers["Location"]
                  assert url.startswith("https://")
                  with urllib.request.urlopen(url,timeout=90) as resp:return resp.read()
              else:
                  with res:return res.read()
          raw=download(f"{prefix}/actions/artifacts/{artifact}/zip")
          assert len(raw)==19367 and hashlib.sha256(raw).hexdigest()==digest
          names={"preflight.log","cold-source.log","tested-commit.txt"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and set(z.namelist())==names
              assert z.read("tested-commit.txt").decode().strip()==tested
              preflight=z.read("preflight.log").decode()
              cold=z.read("cold-source.log").decode()
              assert "BFSS_W0C1_R1_W0B2B_W0C0_ORIGINAL_SOURCE_EXACT_GREEN_AND_REDS_PREFLIGHT_PASS" in preflight
              assert "P3M4W0C1OriginalCommutatorTraceWitness.lean:45:13: unsolved goals" in cold
              assert "⊢ 0 • 1 = 0" in cold
              assert "sorryAx" in cold and "Build completed successfully" not in cold[-2000:]
              assert "originalFockWitnessSignature_injective" in cold
              members=[{"name":n,"size":len(z.read(n)),"sha256":hashlib.sha256(z.read(n)).hexdigest(),"crc32":format(z.getinfo(n).CRC,"08x")} for n in sorted(names)]
          full=download(f"{prefix}/actions/jobs/{job}/logs")
          assert len(full)>30000
          assert b"unsolved goals" in full and b"originalFockWitness_kernel_zero" in full
          assert b"Artifact ID 14384021959" in full
          root=Path("research/quantum-information/diagnostics")
          root.mkdir(parents=True,exist_ok=True)
          archive=root/"BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip"
          log=root/"BFSS_W0C1_R1_44204390734_complete_job.log"
          manifest=root/"BFSS_W0C1_R1_44204390734_NATIVE_RED_evidence_manifest.json"
          for p in [archive,log,manifest]:assert not p.exists(),p
          archive.write_bytes(raw);log.write_bytes(full)
          meta={
            "gate":"P3-M4-W0C1","attempt":"R1","status":"NATIVE_SOURCE_RED_UNQUALIFIED",
            "run_id":run,"job_id":job,"tested_sha":tested,"artifact_id":artifact,
            "original_zip":{"path":str(archive),"size":19367,"sha256":digest,"members":members},
            "original_job_log":{"path":str(log),"size":len(full),"sha256":hashlib.sha256(full).hexdigest()},
            "source_blob":"bdcef8cd83feda4fda905092649c7411a2456f9e",
            "consumer_blob":"9563e06c058771fec4be3b322be48799f38be231",
            "workflow_blob":"61341d74095497e43f69c05234f129c21868ed65",
            "failure_phase":"NATIVE_SOURCE_KERNEL_FINAL_ZERO_SMUL_GOAL",
            "failure_line":45,"axiom_report_contains_sorryAx":True,
            "consumer_executed":False,
            "failure_reason":"Kernel proof left goal (0 : ℂ) • (1 : Op) = 0; dependent injectivity inherited sorryAx from incomplete proof.",
            "accepted_predecessor_run":44192981282
          }
          manifest.write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          print("BFSS_W0C1_R1_PROVIDER_ORIGINAL_NATIVE_RED_ZIP_COMPLETE_JOB_LOG_CRC_SHA_PASS")
          PY
      - name: Git-pin original R1 RED ZIP, full job log and digest manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/quantum-information/diagnostics/BFSS_M4_W0C1_R1_44204390734_NATIVE_RED_evidence.zip research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_complete_job.log research/quantum-information/diagnostics/BFSS_W0C1_R1_44204390734_NATIVE_RED_evidence_manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "BFSS W0C1 R1: preserve original native zero-scalar goal RED ZIP and full job log"
          git push origin HEAD:refs/heads/integration/bfss-unified-research-20261108
